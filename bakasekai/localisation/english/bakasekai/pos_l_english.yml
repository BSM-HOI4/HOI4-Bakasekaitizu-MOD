l_english:
we_are_sealand:0 "We Are Sealand"
we_are_sealand_desc:0 "Our nation, once a sea fortress, gained territory through the tectonic shifts of the Comet Incident.\nWe are Sealand, and we now fulfill all requirements of a state!"
rich_sealand:0 "Rich Finances"
rich_sealand_desc:0 "Support from both coastal governments, along with immigrants and tourists from around the world, have greatly enriched our finances!"
pos_eng:0 "Sealand-UK Friendship Agreement"
pos_eng_desc:0 "This agreement strengthens the friendly relations between the Principality of Sealand and the United Kingdom, encouraging mutual cooperation and respect. It promotes collaboration and information sharing in fields such as culture, economy, and environment, aiming for the development of peaceful relations."
