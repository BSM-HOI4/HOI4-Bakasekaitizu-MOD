l_english:
POS_fortress_state:0 "Fortress State"
POS_fortress_state_desc:0 "Originating from a sea fortress, our nation possesses unparalleled defensive strength."
POS_royal_prestige:0 "Royal Prestige"
POS_royal_prestige_desc:0 "The Bates royal family commands the respect of the people, elevating national prestige."
POS_channel_fortress_spirit:0 "Channel Fortress"
POS_channel_fortress_spirit_desc:0 "Our fortress reigning over the Channel repels all enemies."
POS_civic_spirit:0 "Civic Spirit"
POS_civic_spirit_desc:0 "The participation of each citizen strengthens the nation."
POS_citizen_republic:0 "Citizen Republic"
POS_citizen_republic_desc:0 "A republic where all citizens participate equally is Sealand's ideal form."
POS_paradise_spirit:0 "Paradise Spirit"
POS_paradise_spirit_desc:0 "Liberation from labor and the pursuit of pleasure. This is humanity's ultimate destination."
POS_paradise_residence:0 "Paradise Residence"
POS_paradise_residence_desc:0 "Sealand is the world's only true paradise. All who live here are freed from suffering."
POS_data_haven_economy:0 "Data Haven Economy"
POS_data_haven_economy_desc:0 "The free flow of information forms the foundation of a new economy."
POS_micronation_diplomacy:0 "Micronation Diplomacy"
POS_micronation_diplomacy_desc:0 "Cooperation with the world's small nations dramatically strengthens Sealand's diplomacy."
POS_channel_defense:0 "Channel Defense System"
POS_channel_defense_desc:0 "Channel defenses are hardened and ready to repel any invasion."
POS_maritime_power:0 "Maritime Supremacy"
POS_maritime_power_desc:0 "Who controls the Channel controls the sea. Under the banner of the Sealand Navy."
POS_roy_bates:0 "Roy Bates"
POS_joan_bates:0 "Joan Bates"
POS_michael_bates:0 "Michael Bates"
POS_sealand_rising:0 "Sealand Rising"
POS_sealand_rising_desc:0 "The tiny sea fortress nation of Sealand. Its history is about to begin."
POS_royal_house_bates:0 "Royal House of Bates"
POS_royal_house_bates_desc:0 "Roy Bates and his family lead the nation as Sealand's royal house."
POS_fortress_heritage:0 "Fortress Heritage"
POS_fortress_heritage_desc:0 "Leverage the legacy of Roughs Tower, the WWII sea fort, for national defense."
POS_declaration_sovereignty:0 "Declaration of Sovereignty"
POS_declaration_sovereignty_desc:0 "Sealand declares its existence to the international community as an independent sovereign state."
POS_channel_residence:0 "Relocation to the Channel"
POS_channel_residence_desc:0 "Develop the fortress into a full-fledged residence and increase population."
POS_battle_of_sealand:0 "Battle of Sealand"
POS_battle_of_sealand_desc:0 "Inherit the glorious history of defending the fortress from invaders as a military tradition."
POS_princely_court:0 "Princely Court"
POS_princely_court_desc:0 "Establish a court and a system of noble titles. This will become an important diplomatic asset."
POS_royal_navy_tradition:0 "Royal Navy Tradition"
POS_royal_navy_tradition_desc:0 "As a nation surrounded by sea, establish naval traditions."
POS_crown_jewels:0 "Crown Jewels"
POS_crown_jewels_desc:0 "The royal treasures are the nation's cultural heritage and the people's pride."
POS_resist_channel_powers:0 "Resist the Channel Powers"
POS_resist_channel_powers_desc:0 "Against British and French pressure, Sealand will defend its independence."
POS_channel_fortress:0 "Channel Fortress"
POS_channel_fortress_desc:0 "Sealand has finally become an impregnable fortress reigning over the English Channel."
POS_civil_reform:0 "Dawn of Civic Reform"
POS_civil_reform_desc:0 "Transition from direct democracy to a more participatory civic politics."
POS_citizen_assembly:0 "Establish Citizen Assembly"
POS_citizen_assembly_desc:0 "Establish an assembly where all citizens can participate, achieving true democracy."
POS_civic_constitution:0 "Draft Civic Constitution"
POS_civic_constitution_desc:0 "Draft a constitution that codifies the rights and duties of citizens."
POS_local_self_governance:0 "Establish Local Self-Governance"
POS_local_self_governance_desc:0 "A small nation can achieve finely-tuned self-governance."
POS_civil_education:0 "Promote Civic Education"
POS_civil_education_desc:0 "Education is the foundation of democracy. Elevate citizens' knowledge."
POS_civilism_path:0 "Path to Civilism"
POS_civilism_path_desc:0 "Deepen direct democracy and complete the transition to a civilist state."
POS_citizen_rights:0 "Expand Citizen Rights"
POS_citizen_rights_desc:0 "Grant citizenship to all residents, welcoming them as members of the nation."
POS_cooperative_economy:0 "Cooperative Economy"
POS_cooperative_economy_desc:0 "Build a cooperative economy operated by citizens working together."
POS_citizen_army:0 "Form Citizen Army"
POS_citizen_army_desc:0 "Citizens defend their own country. Form a volunteer citizen army."
POS_civic_republic:0 "Civic Republic"
POS_civic_republic_desc:0 "The ideal of civilism has been realized. All citizens are sovereign."
POS_paradise_vision:0 "Vision of Paradise"
POS_paradise_vision_desc:0 "Liberation from labor. Pursuit of pleasure. Automation will bring true freedom to humanity."
POS_pleasure_gardens:0 "Channel Pleasure Gardens"
POS_pleasure_gardens_desc:0 "A paradise floating in the Channel. Every pleasure is available here."
POS_automated_leisure:0 "Automated Leisure"
POS_automated_leisure_desc:0 "Machines handle labor while humans enjoy leisure."
POS_channel_resort:0 "Build Channel Resort"
POS_channel_resort_desc:0 "Construct resort facilities to attract tourists from around the world."
POS_leisure_technology:0 "Develop Leisure Technology"
POS_leisure_technology_desc:0 "Invest in technology development to maximize pleasure."
POS_paradise_path:0 "Path to Paradise"
POS_paradise_path_desc:0 "Go beyond direct democracy and complete the transition to a paradise state."
POS_hedonistic_culture:0 "Blooming Hedonistic Culture"
POS_hedonistic_culture_desc:0 "A culture of pleasure-seeking blooms in Sealand."
POS_data_haven:0 "Construct Data Haven"
POS_data_haven_desc:0 "Build a free data refuge on the internet, creating a new economy."
POS_automated_paradise:0 "Completed Automated Paradise"
POS_automated_paradise_desc:0 "A fully automated paradise. Humans simply enjoy pleasure."
POS_haven_of_hedonism:0 "Haven of Hedonism"
POS_haven_of_hedonism_desc:0 "Sealand has become the world's only true paradise. All who come here are happy."
POS_title_enterprise:0 "Launch Title Enterprise"
POS_title_enterprise_desc:0 "Sell Sealand noble titles worldwide, opening new sources of diplomacy and income."
POS_diplomatic_outreach:0 "Dispatch Diplomatic Envoys"
POS_diplomatic_outreach_desc:0 "Send envoys worldwide to spread awareness of Sealand."
POS_sell_barony:0 "Sell Barony"
POS_sell_barony_desc:0 "Sell baron titles to build relations with small nations."
POS_micronation_contact:0 "Contact Micronations"
POS_micronation_contact_desc:0 "Open diplomatic channels with other micronations around the world."
POS_sell_earldom:0 "Sell Earldom"
POS_sell_earldom_desc:0 "Sell earl titles to build relations with a broader range of nations."
POS_micronation_league:0 "Micronation League"
POS_micronation_league_desc:0 "Form a micronation league to strengthen solidarity among small states."
POS_title_to_generals:0 "Grant Titles to Generals"
POS_title_to_generals_desc:0 "Grant titles to generals of other nations to expand military influence."
POS_sell_dukedom:0 "Sell Dukedom"
POS_sell_dukedom_desc:0 "Sell the highest-ranking duke titles to major nations for maximum diplomatic effect."
POS_international_recognition:0 "International Recognition Campaign"
POS_international_recognition_desc:0 "Have the international community broadly recognize Sealand's sovereignty."
POS_small_state_alliance:0 "Form Small State Alliance"
POS_small_state_alliance_desc:0 "Form an alliance of small states to stand against pressure from major powers."
POS_industrial_foundation:0 "Build Industrial Foundation"
POS_industrial_foundation_desc:0 "Build an independent industrial foundation despite being a small nation."
POS_dockyard_expansion:0 "Expand Dockyards"
POS_dockyard_expansion_desc:0 "Expand shipbuilding capacity to strengthen the naval foundation."
POS_arms_production:0 "Begin Arms Production"
POS_arms_production_desc:0 "Begin domestic arms production to increase military independence."
POS_naval_construction:0 "Naval Construction Plan"
POS_naval_construction_desc:0 "Formulate an independent naval construction plan to strengthen Channel defense."
POS_fortification_program:0 "Fortification Program"
POS_fortification_program_desc:0 "Transform the Channel fortress into an impregnable stronghold."
POS_channel_trade:0 "Promote Channel Trade"
POS_channel_trade_desc:0 "Promote trade as a key transportation hub in the Channel."
POS_coast_guard_est:0 "Organize Coast Guard"
POS_coast_guard_est_desc:0 "Organize a coast guard to ensure territorial waters security."
POS_channel_defense_focus:0 "Channel Defense System"
POS_channel_defense_focus_desc:0 "Comprehensively strengthen the Channel defense system."
POS_marine_forces:0 "Form Marine Forces"
POS_marine_forces_desc:0 "Form marine forces to gain amphibious warfare capabilities."
POS_maritime_supremacy:0 "Establish Maritime Supremacy"
POS_maritime_supremacy_desc:0 "The Sealand Navy controls the Channel, establishing maritime supremacy."
POS_channel_pressure.1.t:0 "British Sovereignty Claim"
POS_channel_pressure.1.d:0 "The British government has challenged Sealand's sovereignty, pressuring us under the pretext of 'Channel security'.\nHow should we respond?"
POS_channel_pressure.1.a:0 "Accept British demands"
POS_channel_pressure.1.b:0 "Assert sovereignty and resist"
POS_channel_pressure.1.c:0 "Exploit Anglo-French rivalry"
POS_channel_pressure.2.t:0 "French Territorial Claim"
POS_channel_pressure.2.d:0 "France has made a territorial claim over Sealand based on 'historical rights'.\nHow should we respond?"
POS_channel_pressure.2.a:0 "Accept French demands"
POS_channel_pressure.2.b:0 "Assert sovereignty and resist"
POS_channel_pressure.2.c:0 "Exploit Anglo-French rivalry"
POS_channel_pressure.3.t:0 "Joint Anglo-French Operations"
POS_channel_pressure.3.d:0 "Britain and France have jointly launched covert operations against Sealand.\nWe face a critical situation."
POS_channel_pressure.3.a:0 "Convene parliament to discuss response"
POS_channel_pressure.3.b:0 "Respond secretly"
POS_channel_pressure.3.c:0 "Appeal to the international community"
POS_channel_pressure.4.t:0 "Results of the Operations"
POS_channel_pressure.4.d:0 "Our response has borne fruit, and Sealand's position has been strengthened.\nThe international community seems to recognize our resolve."
POS_channel_pressure.4.a:0 "Sealand will not yield"
POS_sovereignty_crisis.1.t:0 "Sovereignty Crisis"
POS_sovereignty_crisis.1.d:0 "Parts of the international community are questioning Sealand's status as a nation.\nHow should we defend our sovereignty?"
POS_sovereignty_crisis.1.a:0 "Handle through diplomatic channels"
POS_sovereignty_crisis.1.b:0 "Present legal basis"
POS_sovereignty_crisis.1.c:0 "Demonstrate through force"
POS_sovereignty_crisis.2.t:0 "Sovereignty Assessment"
POS_sovereignty_crisis.2.d:0 "An assessment of Sealand's sovereignty has been made."
POS_sovereignty_crisis.2.a:0 "The international community is beginning to recognize us"
POS_sovereignty_crisis.2.b:0 "The road ahead is still long"
POS_titles.1.t:0 "Head of State Purchases Title"
POS_titles.1.d:0 "A foreign head of state has purchased a Sealand noble title.\nThis will improve diplomatic relations."
POS_titles.1.a:0 "An honorable transaction"
POS_titles.1.b:0 "Use this opportunity to deepen relations"
POS_titles.2.t:0 "General Knighted"
POS_titles.2.d:0 "A foreign general has been granted a Sealand noble title.\nStrengthened military relations are expected."
POS_titles.2.a:0 "Strengthen army relations"
POS_titles.2.b:0 "Strengthen navy relations"
POS_titles.3.t:0 "Title Fraud Scandal"
POS_titles.3.d:0 "A fraud incident has been uncovered in the title sales.\nSealand's reputation has been damaged."
POS_titles.3.a:0 "We must respond immediately..."
POS_diplomacy.1.t:0 "Micronation Conference Invitation"
POS_diplomacy.1.d:0 "An invitation to a micronation conference has arrived.\nHow should Sealand take advantage of this opportunity?"
POS_diplomacy.1.a:0 "Participate actively"
POS_diplomacy.1.b:0 "Lead the conference"
POS_diplomacy.1.c:0 "Observe from the sidelines"
POS_diplomacy.2.t:0 "Alliance Proposal"
POS_diplomacy.2.d:0 "At the micronation conference, the formation of a small state alliance was proposed.\nShould Sealand take the lead?"
POS_diplomacy.2.a:0 "Promote alliance formation"
POS_diplomacy.2.b:0 "Proceed with caution"
POS_diplomacy.3.t:0 "Treaty Signing"
POS_diplomacy.3.d:0 "The micronation alliance treaty has been signed.\nSealand's international standing has dramatically improved."
POS_diplomacy.3.a:0 "A new era begins"
POS_battle.1.t:0 "Invaders Attack"
POS_battle.1.d:0 "Unknown forces have attacked the Sealand fortress!\nHow should we respond?"
POS_battle.1.a:0 "Defend the fortress"
POS_battle.1.b:0 "Attempt negotiation"
POS_battle.1.c:0 "Request British assistance"
POS_battle.2.t:0 "Glory of Defense"
POS_battle.2.d:0 "The invaders have been repelled! The Battle of Sealand has ended in glorious victory.\nThis victory will boost national morale."
POS_battle.2.a:0 "Long live Sealand!"
POS_battle.3.t:0 "Situation Contained"
POS_battle.3.d:0 "The situation has been brought under control.\nHowever, this incident has highlighted our vulnerabilities."
POS_battle.3.a:0 "We must strengthen our defenses"
