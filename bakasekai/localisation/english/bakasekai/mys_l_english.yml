l_english:
 MYS_GATHERING_STORM_DESC: "Mystery is a nation shrouded in secrecy, existing deep within the Balkans. Due to strict information control and a unique political system, its internal affairs are almost impossible to glimpse from the outside. The fragmentary information that rarely leaks out sometimes brings surprises that overturn common sense. Will the truth of this enigmatic country ever be revealed?"
 MYS.100.t: "-Europe Shrouded in Mystery-"
 MYS.100.d: "Today, after a final telegram was sent from somewhere in Germany, all contact with the European continent ceased. We no longer have any way to know what remains there—whether anyone lives in Europe, or in what form they might persist. The British Prime Minister declared, \"Europe is wrapped in a veil that can never be lifted.\" How far will that veil stretch?"
 MYS.100.a: "You're next"
 MYS.100.b: "I think, therefore I am"
 MYS.100.c: "We possess an unwavering understanding of the Strait of Dover"
