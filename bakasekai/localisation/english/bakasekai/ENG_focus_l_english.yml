 ENG_request_trade_union_support_cost_level_up_tt: "Increases the cost of all §YRequest Trade Union Support§! decisions by 10.\n"
 ENG_request_trade_union_support_cost_level_down_tt: "Decreases the cost of all §YRequest Trade Union Support§! decisions by 10, to a minimum of 40 below their base cost.\n"
 ENG_request_trade_union_support_for_new_factories: "Request Trade Union Support for New Factories"
 ENG_request_trade_union_support_for_new_factories_desc: "We shall ask the Trade Unions to support the acquisition of new factories."
 ENG_request_trade_union_factory_worker_support: "Request Trade Union Factory Worker Support"
 ENG_request_trade_union_factory_worker_support_desc: "We will use our connections and goodwill in the Trade Unions to convince them of the importance that factory productivity is increased for the immediate future. With their support, we can motivate the workforce."
 ENG_request_trade_union_dockyard_worker_support: "Request Trade Union Dockyard Worker Support"
 ENG_request_trade_union_dockyard_worker_support_desc: "We will use our connections and goodwill in the Trade Unions to convince them of the importance that dockyard productivity is increased for the immediate future. With their support, we can motivate the dockyard workforce."
 ENG_request_trade_union_construction_worker_support: "Request Trade Union Construction Worker Support"
 ENG_request_trade_union_construction_worker_support_desc: "We will use our connections and goodwill in the Trade Unions to convince them of the importance that construction productivity is increased for the immediate future. With their support, we can motivate the construction workforce."
 ENG_request_trade_union_war_propaganda_support: "Request Trade Union War Propaganda Support"
 ENG_request_trade_union_war_propaganda_support_desc: "We require aid from the Trade Unions to prepare the people for war - it is coming, and they must support the government preparing for it."
 ENG_impose_martial_law_on_canada: "Impose Martial law on Canada"
 ENG_impose_martial_law_on_canada_desc: "The people of Canada are misguided, and must be protected from themselves. During this time we can re-educate them and see to their government."
 ENG_impose_martial_law_tt: "AI is prevented from breaking free for 180 days."
 ENG_cannot_leave_faction: "Has Martial Law."
 ENG_propaganda_campaigns_in_canada: "Propaganda Campaigns in Canada"
 ENG_propaganda_campaigns_in_canada_desc: "We will launch a major propaganda campaign to educate the Canadian people on the follies of their government, and the necessity for British guidance."
 ENG_replace_government_in_canada_fascism: "Install Fascist Government in Canada"
 ENG_replace_government_in_canada_fascism_desc: "The Canadian people are ready for a change in government to one more... amenable to our fascist leadership."
 ENG_replace_government_in_canada_communism: "Install Communist Government in Canada"
 ENG_replace_government_in_canada_communism_desc: "The Canadian people are ready for a change in government to one more... amenable to our communist leadership."
 ENG_replace_government_communism_tt: "Will remain a puppet when Decolonization is achieved.\n"
 ENG_impose_martial_law_on_south_africa: "Impose Martial law on South Africa"
 ENG_impose_martial_law_on_south_africa_desc: "The people of South Africa are misguided, and must be protected from themselves. During this time we can re-educate them and see to their government."
 ENG_propaganda_campaigns_in_south_africa: "Propaganda Campaigns in South Africa"
 ENG_propaganda_campaigns_in_south_africa_desc: "We will launch a major propaganda campaign to educate the South African people on the follies of their government, and the necessity for British guidance."
 ENG_replace_government_in_south_africa_fascism: "Install Fascist Government in South Africa"
 ENG_replace_government_in_south_africa_fascism_desc: "The South African people are ready for a change in government to one more... amenable to our fascist leadership."
 ENG_replace_government_in_south_africa_communism: "Install Communist Government in South Africa"
 ENG_replace_government_in_south_africa_communism_desc: "The South African people are ready for a change in government to one more... amenable to our communist leadership."
 ENG_impose_martial_law_on_british_raj: "Impose Martial Law on British Raj"
 ENG_impose_martial_law_on_british_raj_desc: "The people of India are misguided, and must be protected from themselves. During this time we can re-educate them and see to their government."
 ENG_propaganda_campaigns_in_british_raj: "Propaganda Campaigns in British Raj"
 ENG_propaganda_campaigns_in_british_raj_desc: "We will launch a major propaganda campaign to educate the Indian people on the follies of their government, and the necessity for British guidance."
 ENG_replace_government_in_british_raj_fascism: "Install Fascist Government in British Raj"
 ENG_replace_government_in_british_raj_fascism_desc: "The Indian people are ready for a change in government to one more... amenable to our fascist leadership."
 ENG_replace_government_in_british_raj_communism: "Install Communist Government in British Raj"
