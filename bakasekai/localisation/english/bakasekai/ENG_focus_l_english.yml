 ENG_trade_unions_demand_minister_appointment_decision: "Appoint Trade Union Minister"
 ENG_trade_unions_demand_minister_appointment_decision_desc: "To fulfill the Trade Unions' demands, we will appoint their chosen representative to the cabinet."
