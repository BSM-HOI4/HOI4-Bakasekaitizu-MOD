 ENG_march_on_downing_street: "March on Downing Street"
 ENG_march_on_downing_street_desc: "A final great march on No. 10 Downing Street will surely push the government to call for a referendum on the future of the nation. They cannot stand against the will of the people."
 ENG_speech_against_germany: "Hold Anti-German Speech"
 ENG_speech_against_germany_desc: "As Mosley's popularity soars, so does the outlandish criticism he is bombarded with. To assuage fears that he merely wishes to force Hitlerism upon the British people, perhaps a grand and powerfully-formulated speech is required, in which Mosley distances himself in unmistaken terms from the Hitler's variety of fascism."
 ENG_speech_against_germany_tt: "§RShould stability drop below 50% during the Blackshirt Marches, a civil war will start!§!\n"
 ENG_reconciliatory_speech: "Reconciliatory Speech"
 ENG_reconciliatory_speech_desc: "In order to reduce increasing domestic political tensions, a speech with reconciliatory language may well be just what is required."
 ENG_the_mosley_plan: "Enact The Mosley Plan"
 ENG_the_mosley_plan_desc: "A bold restructuring of the economy, combined with ample propaganda and public investments, should galvanize the people in one great effort to repair the nation and kick-start our rearmament."
 ENG_imperial_conference_decision: "Imperial Conference"
 ENG_imperial_conference_decision_desc: "The Imperial Conference has started, and we may push our agenda for the next two months, before Dominion representatives return home again. Improving diplomatic relations with our Dominions will likely increase the chances of those Dominions agreeing with our proposals."
 ENG_imperial_conference_discussion_in_progress: "Imperial Conference discussion in progress.\n"
 ENG_discuss_imperial_defense: "Discuss Imperial Defense"
 ENG_discuss_imperial_defense_desc: "We will put forward a motion proposing that all members of the Commonwealth make a significant contribution to the defense of the Empire."
 ENG_discuss_imperial_trade: "Discuss Imperial Trade"
 ENG_discuss_imperial_trade_desc: "We will put forward a motion proposing that all members of the Commonwealth increase the preferential trade within the Empire, so that we as a whole may prosper even more."
 ENG_discuss_imperial_economy: "Discuss Imperial Economy"
 ENG_discuss_imperial_economy_desc: "We will put forward a motion proposing that all members of the Commonwealth make a significant investment in their domestic economies, reducing their reliance on our investments and strengthening the Empire as a whole."
 ENG_discuss_appeasement: "Discuss Appeasement"
 ENG_discuss_appeasement_desc: "We have received ample criticism for our policy of appeasement, so we shall put this policy up to the Commonwealth for discussion."
 ENG_discuss_imperial_federation: "Discuss Imperial Federation"
 ENG_discuss_imperial_federation_desc: "Ever since the previous century, voices have spoken up in favor of joining all parts of the Empire together in one Imperial Federation, rather than progress further to the alternative of 'home rule', involving independence for all Dominions. We will now put forward a motion to discuss it for the last time."
