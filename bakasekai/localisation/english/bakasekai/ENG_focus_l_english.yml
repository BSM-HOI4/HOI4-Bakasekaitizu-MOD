 ENG_trade_unions_demand_legislation_amendment: "Amend Legislation"
 ENG_trade_unions_demand_legislation_amendment_desc: "To fulfill the Trade Unions' demands, we will expend some extra political effort to amend the current legislation proposal, to their wishes."
 ENG_trade_unions_demand_conscription_limitations: "Limit Conscription"
 ENG_trade_unions_demand_conscription_limitations_desc: "To fulfill the Trade Unions' demands, we will limit our conscription efforts for the time being."
 ENG_trade_unions_demand_conscription_limitations_tt: "Prevents increasing the Conscription Laws for §Y365 days§!.\n"
 ENG_trade_unions_demand_conscription_limitations_tt2: "If current Conscription Law is above §YVolunteer Only§!, reduces Conscription Law by one step.\n"
 ENG_cannot_increase_conscription_law: "Promised the Trade Unions not to increase conscription.\n"
 ENG_trade_unions_demand_workplace_safety_legislation: "Pass Factory Safety Legislation"
 ENG_trade_unions_demand_workplace_safety_legislation_desc: "To fulfill the Trade Unions' demands, we will pass new workplace safety legislation, granting further protection to our workforce, at the necessary cost of some productivity."
 ENG_trade_unions_demand_increase_in_paid_leave: "Pass Increase in Paid Leave Legislation"
 ENG_trade_unions_demand_increase_in_paid_leave_desc: "To fulfill the Trade Unions' demands, we will pass legislation granting workers more paid leave from their employers."
 ENG_trade_unions_demand_minimum_pay_increase: "Pass Minimum Wage Increase Legislation"
 ENG_trade_unions_demand_minimum_pay_increase_desc: "To fulfill the Trade Unions' demands, we will pass legislation increasing the minimum wage for all sectors."
 ENG_trade_unions_demand_construction_safety_legislation: "Pass Construction Safety Legislation"
 ENG_trade_unions_demand_construction_safety_legislation_desc: "To fulfill the Trade Unions' demands, we will pass new construction safety legislation, granting further protection for those who work in the construction industry."
 ENG_trade_unions_demand_mandatory_union_days: "Enact Mandatory Union Days"
 ENG_trade_unions_demand_mandatory_union_days_desc: "To fulfill the Trade Unions' demands, we will pass new legislation requiring all laborers to participate in 'Union Days', educating them on their rights, encouraging them to unionize, and provide a time-slot for other union-related activities."
 ENG_trade_unions_demand_referendum: "Hold Referendum"
 ENG_trade_unions_demand_referendum_desc: "As socialist support has soared, we have no choice but to accede to the Trade Unions' demands for a referendum. The outcome is all but a foregone conclusion..."
