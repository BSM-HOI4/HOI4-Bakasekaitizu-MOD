 RAJ_GOE_seek_support_from_the_unions_tt: "We will be able to seek support from the Unions. They will support us if we give them a form of concession, reducing the required communist popularity threshold required to complete §Y$RAJ_royal_indian_navy_mutiny$§! by §G-10%§! "
 RAJ_GOE_accept_russian_muhajir_money: "$RAJ_accept_russian_muhajir_money$"
 RAJ_GOE_accept_russian_muhajir_money_desc: "Discreet financial support from abroad can accelerate our organizational efforts and reduce our reliance on local funding sources."
 RAJ_GOE_meet_with_the_kremlin: "[MeetWithKremlinLoc]"
 RAJ_GOE_meet_with_the_kremlin_desc: "[MeetWithKremlinLocDesc]"
 RAJ_GOE_meet_with_the_kremlin_desc_NO_USSR:  "Seeking to gain support from foreign Communist Aligned groups may yield material assistance and strategic guidance, strengthening our position at home"
 RAJ_GOE_meet_with_the_kremlin_desc_USSR: "Securing a formal dialogue with the Soviet leadership may yield material assistance and strategic guidance, strengthening our position at home"
 RAJ_GOE_spread_dissent_in_the_army: "Use Radical Officers to Spread Dissent in the Army"
 RAJ_GOE_spread_dissent_in_the_army_desc: "Our network of sympathetic officers can be leveraged to question the loyalty of the military to its current leadership and undermine confidence in the existing order"
 RAJ_GOE_orchestrate_train_robberies: "Orchestrate Train Robberies"
 RAJ_GOE_orchestrate_train_robberies_desc: "Disrupting rail shipments weakens colonial logistics while providing us with supplies and resources to fund further operations."
 RAJ_GOE_orchestrate_train_robberies_tt: "(Will be removed once becoming Communist)"
 RAJ_royal_indian_navy_mutiny_threshold_tt: "Reduces the required §Ycommunist support§! threshold for completing §Y$RAJ_royal_indian_navy_mutiny$§! by: §Y$RIGHT|G=%$§!\n"
 RAJ_GOE_infiltrate_the_national_congress: "Infiltrate the National Congress"
 RAJ_GOE_infiltrate_the_national_congress_desc: "By embedding our sympathizers within the Indian National Congress we can influence its direction from within, amplifying class tensions, undermining moderate leadership and preparing the ground for a more radical shift."
 RAJ_GOE_undermine_gandhis_movement: "Undermine Gandhi's Non-Violence Movement "
 RAJ_GOE_undermine_gandhis_movement_desc: "Though Gandhi’s message remains popular, his movement is vulnerable to internal contradictions and class compromise. Through targeted infiltration and subtle agitation, we can expose these weaknesses and steer support toward a more revolutionary alternative."
 RAJ_GOE_communism_sway_bose: "Sway Bose to our Cause"
 RAJ_GOE_communism_sway_bose_desc: "Subhas Chandra Bose commands significant influence among nationalist circles. Aligning his ambitions with our movement could provide both legitimacy and access to broader support networks."
