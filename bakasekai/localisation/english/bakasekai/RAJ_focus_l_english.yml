 RAJ_mughal_shortcut: "Politics:\nThe Mughals"
 RAJ_eic_shortcut: "The East India Company"
 RAJ_road_to_independence_shortcut: "The Road to Independence"
 RAJ_majestys_government_shortcut: "A Loyal Government"
 RAJ_railways_shortcut: "The Railways"
 RAJ_army_shortcut: "The Officers"
 RAJ_ammunition_factories_shortcut: "Ammunition Factories"
 RAJ_recruitment_shortcut: "Recruitment"
 RAJ_navy_shortcut: "Indian Navy"
 RAJ_airforce_shortcut: "Indian Air Force"
 RAJ_constitution_for_the_masses: "Constitution for the Masses"
 RAJ_constitution_for_the_masses_desc: "The People's Republic cannot rest on old imperial law.\nA new constitution must reflect the will of the workers, the farmers, and the landless — not the whims of monarchs or colonial governors."
 RAJ_founding_of_the_peoples_republic: "Founding of the People's Republic"
 RAJ_founding_of_the_peoples_republic_desc: "We have overthrown the old order.\nNow begins the task of building a new one — forged by the people, for the people, and sustained by revolution."
 RAJ_agrarian_socialism: "Agrarian Socialism"
 RAJ_agrarian_socialism_desc: "The revolution begins in the fields.\nLet the land return to those who till it, and let the villages govern themselves in the name of equality and justice."
 RAJ_urban_industrialism: "Urban Industrialism"
 RAJ_urban_industrialism_desc: "The future lies not in the pastures, but in the factories.\nOnly through rapid industrial development can we secure the revolution and prepare for the battles ahead."
 RAJ_urban_industrialism_tt: "This will alter the five year plan to be more geared towards Industrial Expansion, giving §G+10%§! Building Speed"
 RAJ_urban_industrialism_tt2: "This will alter the five year plan to be more geared towards Agrarian Socialism, giving: "
 RAJ_land_of_the_tillers: "Land of the Tillers"
 RAJ_land_of_the_tillers_desc: "The landlords are gone, but the struggle remains.\nWe will redistribute the land and break the last chains of feudalism — plot by plot, village by village."
 RAJ_focus_on_the_countryside: "Focus on the Countryside"
 RAJ_focus_on_the_countryside_desc: "Our strength lies in the millions who call the soil home.\nLet us invest in them, arm them, and organize them — the revolution belongs to the villages."
 RAJ_decentralize_the_party: "Decentralize the Party"
 RAJ_decentralize_the_party_desc: "Authority should not flow from offices in Indraprastha.\nLet the people guide the revolution through local councils and rural soviets."
 RAJ_industrialize_the_ganges: "Industrialize the Ganges"
 RAJ_industrialize_the_ganges_desc: "The Ganges has fed us for centuries.\nNow it will power our machines, fuel our furnaces, and arm our armies."
 RAJ_comrades_of_the_city: "Comrades of the City"
 RAJ_comrades_of_the_city_desc: "The workers of the cities are the vanguard.\nWith education, tools and unity, they shall lead the Republic into modernity."
 RAJ_central_comittee_authority: "Central Committee Authority"
 RAJ_central_comittee_authority_desc: "Discipline is strength.\nThe Central Committee will oversee all aspects of governance, ensuring that the revolution does not stray into chaos."
 RAJ_reorganize_the_five_year_plan_towards_heavy_industry: "Redirect the Five-Year Plan"
 RAJ_reorganize_the_five_year_plan_towards_heavy_industry_desc: "The current pace of industrialization is insufficient.\nWe must prioritize heavy industry and steel output if we are to defend our revolution."
 RAJ_invite_soviet_industrial_experts: "Invite Soviet Industrial Experts"
 RAJ_invite_soviet_industrial_experts_desc: "The Soviets have experience in building an industrial base from nothing.\nLet us learn from their model and accelerate our own transformation."
 RAJ_planned_economy2: "Consolidate the Planned Economy"
 RAJ_planned_economy2_desc: "The market has no place in the revolution.\nEvery resource, every laborer, and every factory must serve the five-year plan."
 RAJ_the_red_curtain_falls_over_asia: "The Red Curtain Falls Over Asia"
 RAJ_the_red_curtain_falls_over_asia_desc: "We have secured our homeland.\nNow it is time to carry the flame of revolution to our neighbors by word, by pamphlet or by gun."
 RAJ_the_red_curtain_falls_over_asia_desc_tt: "Unlocks decisions to spread a communist revolution across Asia"
 RAJ_red_punjab_operation: "Red Punjab Operation"
 RAJ_red_punjab_operation_desc: "Our capital is vulnerable towards foreign aggression. We must increase its security zone"
 RAJ_secure_rajahsthan: "Secure Rajasthan"
 RAJ_secure_rajahsthan_desc: "The deserts of Rajasthan must not become a base for a counter-revolution.\nWe will bring the state into our fold."
 RAJ_strike_eastern_pakistan: "Strike Eastern Pakistan"
 RAJ_strike_eastern_pakistan_desc: "The eastern wing of [PAK.GetName] is isolated and unstable.\nNow is the time to strike, before they can gain a proper foothold."
 RAJ_mass_assault: "Mass Assault"
 RAJ_defenders_of_the_revolution_idea_tt: "Add technology: §YRevolutionary Mass Assault§!."
 RAJ_arm_the_peasantry: "Arm the Peasantry"
 RAJ_arm_the_peasantry_desc: "The revolution must reach every field.\nWe will distribute arms to loyal rural militias, ensuring that no village stands defenseless against reaction."
 RAJ_every_man_a_gun: "Every Man a Gun"
 RAJ_every_man_a_gun_desc: "In the People's Republic, all citizens are soldiers.\nWe will standardize training and arm the population en masse, turning the nation itself into a fortress."
 RAJ_every_man_a_leader: "Every Man a Leader"
 RAJ_every_man_a_leader_desc: "True revolutionary strength comes not from orders, but from initiative.\nWe will train local commanders and militia leaders to act decisively, without waiting for permission."
 RAJ_defenders_of_the_revolution: "Defenders of the Revolution"
 RAJ_defenders_of_the_revolution_desc: "They are not soldiers. They are guardians of an idea.\nWe will elevate our most disciplined and loyal fighters into an elite corps, defenders of both soil and ideology."
 RAJ_education_for_the_masses: "Education for the Masses"
 RAJ_education_for_the_masses_desc: "Without knowledge, revolution decays into tyranny.\nLiteracy, political education, and scientific training will be brought to every village and factory."
 RAJ_break_the_zamindars: "Break the Zamindars"
 RAJ_break_the_zamindars_desc: "The landlords are the skeleton of the old regime.\nWe will dismantle their estates, seize their land, and scatter their power to the wind."
 RAJ_planned_but_decentralized: "Planned but Decentralized"
 RAJ_planned_but_decentralized_desc: "We will retain economic planning, but grant local collectives autonomy.\nEfficiency through ideology, not bureaucracy."
 RAJ_socialist_self_reliance: "Socialist Self-Reliance"
 RAJ_socialist_self_reliance_desc: "We will not depend on capitalist imports or imperialist advisors.\nIndia will feed itself, arm itself, and stand alone if it must."
 RAJ_quality_training: "Quality Training"
 RAJ_quality_training_desc: "Quantity alone does not win wars.\nWe will standardize our training programs, improve officer instruction, and elevate the professionalism of our armed forces."
 RAJ_iron_will_indoctrination: "Iron Will Indoctrination"
 RAJ_iron_will_indoctrination_desc: "Strength is not only in the body — it is in belief.\nWe will instill absolute discipline, ideological clarity, and an unbreakable will to fight in every soldier."
 RAJ_purge_the_reactionaries: "Purge the Reactionaries"
 RAJ_purge_the_reactionaries_desc: "There can be no compromise with the old world.\nEnemies of the revolution, saboteurs, and counter-revolutionary elements will be rooted out."
 RAJ_stopping_the_japanese_threat_into_central_asia: "Stop the Japanese Threat in Central Asia"
 RAJ_stopping_the_japanese_threat_into_central_asia_desc: "Japan's ambitions do not end at China's borders. Their eyes now turn toward Central Asia, a potential springboard for further imperial expansion.\nWe must act swiftly. By reinforcing our eastern frontier we will stop the tide of conquest before it reaches the steppes and beyond."
