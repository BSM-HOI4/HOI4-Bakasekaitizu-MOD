 RAJ_population_decisions: "Rural Industrialization"
 RAJ_industrialize_state: "Industrialize [FROM.GetName]"
 RAJ_industrialize_state_desc: "Our nation is once again on the rise. Although the task is great, bringing rural areas into the modern era is sure to pay dividends in the future."
 RAJ_industrialized_this_state: "§HRural areas already industrialized§!"
 RAJ_reduce_agrarian_society_value_tooltip: "\n§H$RAJ_agrarian_society$§!\nRecruitable Population Factor: [?RAJ_agrarian_society_increment|+=%]\n"
 RAJ_industrialize_state_goe: "$RAJ_industrialize_state$"
 RAJ_industrialize_state_goe_desc: "$RAJ_industrialize_state_desc$"
 RAJ_GATHERING_STORM_DESC: "The crown jewel of the British Empire, the Raj of India is a strange combination of imperial power and imperial powerlessness. A tiny elite of British civil servants rule over a vast subcontinent filled with hundreds of millions of subjects. From their ranks recruits the Indian Army, which fought bravely in the Great War.\n\nIndian leaders hoped that the sacrifices made in the last war would help India gain her independence from Britain, but so far, that hope has been disappointed. With a new war looming, many believe that the time has come to take that freedom - by whatever means necessary."
 RAJ_BLITZKRIEG_DESC: "The crown jewel of the British Empire, the Raj of India is a strange combination of imperial power and imperial powerlessness. A tiny elite of British civil servants rule over a vast subcontinent filled with hundreds of millions of subjects. From their ranks recruits the Indian Army, which fought bravely in the Great War.\n\nIndian leaders hoped that the sacrifices made in the last war would help India gain her independence from Britain, but so far, that hope has been disappointed. With a new war looming, many believe that the time has come to take that freedom - by whatever means necessary."
