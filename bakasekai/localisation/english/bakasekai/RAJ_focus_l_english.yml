 RAJ_azad_hind: "Azad Hind"
 RAJ_azad_hind_desc: "The Free India government, supported by enemies of the British, is working towards the liberation of India. They are working with Japan to subvert European rule, in the hopes of establishing a self-governing Indian state."
 RAJ_marginalized_muslim_community: "Marginalized Muslim Community"
