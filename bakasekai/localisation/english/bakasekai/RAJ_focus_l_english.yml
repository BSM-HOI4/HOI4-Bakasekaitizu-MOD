 RAJ_a_loyal_government: "A Loyal Government"
 RAJ_a_loyal_government_desc: "Despite the desire for independence from dissidents within [RAJ.GetNameDef], our government remains strong and stable. We will continue to uphold the Crown's interests with discipline and resolve."
 RAJ_high_import_duties: "High Import Duties"
 RAJ_high_import_duties_desc: "We have enacted a new policy with the intention of protecting local industries and retaining the economic output of [RAJ.GetNameDef]. With higher import duties on foreign goods, we shall ensure that [RAJ.GetNameDef] can stand on its own two feet in global economic circles."
 RAJ_the_zamindari_system: "The Zamindari System"
 RAJ_the_zamindari_system_desc: "By expanding the Zamindari System, we have ensured administrative efficiency by empowering the loyal landlords maintaining order in the rural regions of the country."
 RAJ_exports_for_the_empire: "Indian Exports for the Empire"
 RAJ_exports_for_the_empire_desc: "Colonial trade has been the backbone of the [ENG.GetAdjective] Empire for centuries, and the exports from [RAJ.GetNameDef] are no different. By prioritizing the cultivation of staple crops such as tea, cotton and jute, we have secured a steady flow of revenue for us and for the Empire."
 RAJ_war_industry: "War Industry"
 RAJ_war_industry_dec: "Through sheer determination and tireless resolve, we must support the war effort by increasing the funding toward our arms industry. Our people will forge our victory through courage, sweat and steel."
 RAJ_indian_gentlemen_officers_goe: "$RAJ_indian_gentlemen_officers$"
 RAJ_indian_gentlemen_officers_goe_desc: "$RAJ_indian_gentlemen_officers_desc$"
 RAJ_south_east_asia_command_dm: "$RAJ_south_east_asia_command$"
 RAJ_south_east_asia_command_dm_desc: "By establishing the South East Asia Command, we have been able to extend our military influence across the entire region. This will surely aid us in planning our military campaigns on the continent."
