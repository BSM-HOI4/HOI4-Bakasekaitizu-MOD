 RAJ_risk_of_famine: "Risk of Famine"
 RAJ_risk_of_famine_desc: "The Indian system of food production is very fragile. Even a small interruption might cause a collapse."
 RAJ_risk_of_famine_instant_desc: "A §Rfamine§! will trigger if one of these are true:\n -We lose a starting Indian state and fail to take it back within §Y30 day(s)§! (Aden being excluded)\n-The new controller is not a releasable that is occupied by us at the start of the game\n-The new controller is not our subject."
 RAJ_famine: "Famine"
 RAJ_famine_desc: "Incompetence, indifference and blatant corruption in the colonial government and the Indian railroads have turned a difficult situation into a full-blown catastrophe. The country will suffer from this for months to come."
