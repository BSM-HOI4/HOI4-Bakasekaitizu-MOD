l_english:

 # National Spirits
 NOR_sunken_ship:0 "Sunken Ships"
 NOR_sunken_ship_desc:0 "Our homeland, unified by the great Harald I, has been swallowed by the imperialistic expansion policy of neighboring empires, and now we are pushed into the depths of distant Siberia. But we will never give up. Until the day we set foot on our homeland again."

 NOR_one_nation_two_language:0 "One Nation, Two Languages"
 NOR_one_nation_two_language_desc:0 "Our country currently has two official languages: one is Norwegian, which we have used since ancient times, and the other is Russian, which is used in this land. Although both belong to the same language family, they are completely different languages otherwise. In such a situation, everything we do is inefficient. Eventually, we must unify into one of these languages."

 NOR_old_industrial_tradition:0 "Inefficient Industrial System"
 NOR_old_industrial_tradition_desc:0 "Our country's industrial system is still immature, and old inefficient systems still remain today."

 NOR_haakon_vii:0 "King Haakon VII"
 NOR_haakon_vii_desc:0 "Under King Haakon VII, successor to his great-uncle Oscar II and King of Norway, the Norwegian people are united and aim for the day to reclaim their former lands."