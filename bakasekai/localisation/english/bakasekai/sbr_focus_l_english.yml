l_english:
 # ROOT
 SBR_free_declaration:0 "Declaration of Freedom"
 SBR_free_declaration_desc:0 "From the frozen lands of Siberia, we proclaim the birth of a new free nation. The history of the Holy Siberian Free State begins amidst ruins and hope."

 # Tier 1
 SBR_internal_order:0 "Establish Internal Order"
 SBR_internal_order_desc:0 "Unite the fractured domestic factions and build a solid administrative foundation. The time has come to end the three-way power struggle."
 SBR_siberian_resource:0 "Siberian Resource Development"
 SBR_siberian_resource_desc:0 "Exploit the rich iron ore and resources sleeping beneath the permafrost to solidify the nation's economic foundation."

 # Path choices
 SBR_path_ruin:0 "Path of Ruins"
 SBR_path_ruin_desc:0 "Under the banner of Ruinism, destroy the old order and build a new world upon the ruins. Destructive power is the only true liberation."
 SBR_path_holy:0 "Holy Path"
 SBR_path_holy_desc:0 "Trust in ancient mythology and sacred power to guide Siberia as a holy nation. Heaven's will shall grant us victory."
 SBR_path_red:0 "Red Path"
 SBR_path_red_desc:0 "Light the flame of red revolution in Siberia. Overthrow corrupt imperialism with the power of the workers and build a truly equal society."

 # Ruinism branch
 SBR_ruin_doctrine:0 "Ruinist Doctrine"
 SBR_ruin_doctrine_desc:0 "Permeate the entire military with the doctrine of destruction. Annihilation is our tactic and our philosophy."
 SBR_ruin_war_economy:0 "Ruin War Economy"
 SBR_ruin_war_economy_desc:0 "Dedicate all productive capacity to war. Civilian welfare is secondary — victory is everything."
 SBR_ruin_purge:0 "Purge the Anti-Ruinists"
 SBR_ruin_purge_desc:0 "Thoroughly eliminate anti-Ruinists and opportunists lurking within the nation. Fear shall unite the country."
 SBR_ruin_blitzkrieg:0 "Blitzkrieg Doctrine"
 SBR_ruin_blitzkrieg_desc:0 "Research and adopt lightning-fast Blitzkrieg tactics. The iron hammer of armor shall shatter enemy defensive lines in an instant."
 SBR_ruin_arsenal:0 "Arsenal of Ruin"
 SBR_ruin_arsenal_desc:0 "Harness Siberia's industrial power to build an Arsenal of Ruin. Ammunition and weapons flow without end."
 SBR_ruin_sov_ultimatum:0 "Ultimatum to the Soviets"
 SBR_ruin_sov_ultimatum_desc:0 "Deliver a final ultimatum to the crumbling, corrupt Soviet Union: submit as a vassal, or face utter annihilation."
 SBR_ruin_total_mobilization:0 "Total Mobilization"
 SBR_ruin_total_mobilization_desc:0 "Conscript every citizen as a cog in the war machine. The storm of Ruinism howls across the land."
 SBR_ruin_west_reclaim:0 "Western Ruination"
 SBR_ruin_west_reclaim_desc:0 "Reclaim the occupied lands of the Russian Empire and Norway with the iron hammer of ruin. The west shall become our ruins."
 SBR_ruin_west_reclaim_tt:0 "Adds state claims westward (Russian Empire / Norway direction)."
 SBR_ruin_south_conquest:0 "Southern Conquest"
 SBR_ruin_south_conquest_desc:0 "March upon the lands of China and Korea with the feet of ruin. The old order of East Asia shall be swept away."
 SBR_ruin_south_conquest_tt:0 "Adds state claims toward China and Korea."
 SBR_ruin_convergence:0 "Siberian Ruin Empire"
 SBR_ruin_convergence_desc:0 "Only upon ruins can a true empire be built. The Ruin Empire of Holy Siberia shall reign supreme over Eurasia."
 SBR_ruin_convergence_tt:0 "The glory of the Ruin Empire resounds. War support and stability greatly increase."

 # Holy branch
 SBR_holy_shaman:0 "Shaman Council"
 SBR_holy_shaman_desc:0 "Recruit ancient shamans as senior advisors to the state. The voice of spirits shall guide our nation's direction and unite the hearts of our people."
 SBR_holy_divine_army:0 "Holy Warriors"
 SBR_holy_divine_army_desc:0 "Organize a holy warrior order fighting in the name of the divine. The power of faith transforms ordinary soldiers into sacred warriors."
 SBR_holy_theocracy:0 "Theocratic Declaration"
 SBR_holy_theocracy_desc:0 "Formally declare Holy Siberia as a theocratic state governed by divine law. Politics and faith become one."
 SBR_holy_prophecy:0 "Divine Prophecy"
 SBR_holy_prophecy_desc:0 "Promulgate the divine oracle of the Shaman Council to the people. God's blessing upon science and technology accelerates our research."
 SBR_holy_crusade:0 "Holy Crusade"
 SBR_holy_crusade_desc:0 "Launch a holy crusade under God's will against faithless regimes. Divine judgment shall be delivered."
 SBR_holy_sacred_decree:0 "Sacred Land Decree"
 SBR_holy_sacred_decree_desc:0 "Declare the reclamation of all sacred lands beyond Siberia. The time has come to take back the holy ground occupied by the Soviets."
 SBR_holy_sacred_decree_tt:0 "Adds state claims on key Soviet territories and creates a war goal to puppet the USSR."
 SBR_holy_holy_industry:0 "Holy Industry"
 SBR_holy_holy_industry_desc:0 "Convert the power of faith into industrial production. Under God's protection, Siberia's factories run day and night without ceasing."
 SBR_holy_west_return:0 "Reclaim the Western Holy Lands"
 SBR_holy_west_return_desc:0 "Reclaim the western sacred lands that once lay under Holy Siberia's dominion, in the name of the divine. Russian Empire and Norway — be warned."
 SBR_holy_west_return_tt:0 "Adds state claims westward (Russian Empire / Norway direction)."
 SBR_holy_south_mission:0 "Southern Mission"
 SBR_holy_south_mission_desc:0 "Dispatch missionaries to spread the mythological faith to heathens of the south. By sword if necessary."
 SBR_holy_south_mission_tt:0 "Adds state claims toward the east and south."
 SBR_holy_convergence:0 "Divine Siberian Manifestation"
 SBR_holy_convergence_desc:0 "The power of myth manifests in the mortal world. Holy Siberia's divine mission nears completion, and a kingdom of the gods shall be built across Eurasia."
 SBR_holy_convergence_tt:0 "The sacred light of the Holy Empire descends across all lands. Stability and political power greatly increase."

 # Red branch
 SBR_red_workers:0 "Workers' Council"
 SBR_red_workers_desc:0 "Siberian workers seize power. Council governance becomes the foundation of the state, explosively increasing productive capacity."
 SBR_red_army_rebuild:0 "Red Army Rebuilt"
 SBR_red_army_rebuild_desc:0 "Under the command of General Blyukher, organize a new Red Army — the iron shield and sword of the revolution."
 SBR_red_collectivization:0 "Agricultural Collectivization"
 SBR_red_collectivization_desc:0 "Collectivize agriculture and transition to socialist modes of production. The people are freed from the land and march toward the factories."
 SBR_red_heavy_industry:0 "Heavy Industrialization"
 SBR_red_heavy_industry_desc:0 "Drive Siberian heavy industrialization inspired by Stalin's Five-Year Plan. Iron and steel become the foundation of national power."
 SBR_red_purge_bourgeois:0 "Purge the Bourgeoisie"
 SBR_red_purge_bourgeois_desc:0 "Thoroughly purge the bourgeoisie and counter-revolutionary elements opposed to the revolution. The red terror cleanses the nation."
 SBR_red_absorb_sov:0 "Soviet Absorption Plan"
 SBR_red_absorb_sov_desc:0 "Put an end to Moscow's corrupt bureaucracy. True socialism begins in Siberia. Absorb the Soviets and build a genuine people's republic."
 SBR_red_absorb_sov_tt:0 "Adds a war goal to puppet the Soviet Union."
 SBR_red_eastern:0 "Eastern Reddening"
 SBR_red_eastern_desc:0 "Spread the red revolution eastward. The working classes of China and Korea await liberation."
 SBR_red_sov_integrate:0 "Soviet Integration"
 SBR_red_sov_integrate_desc:0 "Formally integrate the puppeted Soviet Union. Dismantle Moscow's bureaucratic apparatus and reorganize it into Siberian-style People's Councils."
 SBR_red_sov_integrate_tt:0 "Adds production bonuses from Soviet integration."
 SBR_red_south_advance:0 "Southern Advance"
 SBR_red_south_advance_desc:0 "Turn the red banner southward. Defeat the capitalist forces of China and Korea and build a red paradise across Asia."
 SBR_red_south_advance_tt:0 "Adds state claims southward and increases mobilization capacity."
 SBR_red_convergence:0 "Siberian Red Republic"
 SBR_red_convergence_desc:0 "A new red superpower centered on Siberia is born. The socialist great empire stretching east and west shall sweep across Eurasia."
 SBR_red_convergence_tt:0 "The red flag of the empire flies across Eurasia. Production capacity and the arsenal are greatly strengthened."

 # Final
 SBR_saint_siberia_glory:0 "Glory of Holy Siberia"
 SBR_saint_siberia_glory_desc:0 "Whether walking the path of ruins, holiness, or revolution — the Holy Siberian Free State etches its glory into the annals of Eurasian history forever."
 SBR_saint_siberia_glory_tt:0 "The fame of the Holy Siberian Free State echoes across all of Eurasia. National stability and war support greatly increase."

 # National spirits
 SBR_spirit_order:0 "Order Established"
 SBR_spirit_order_desc:0 "Internal chaos has subsided and state administration is beginning to function."
 SBR_spirit_ruinism_fervor:0 "Ruinist Fervor"
 SBR_spirit_ruinism_fervor_desc:0 "Ruinist conviction stirs the people to action. The thirst for destruction elevates military morale but gravely undermines stability."
 SBR_spirit_holy_mandate:0 "Holy Mandate"
 SBR_spirit_holy_mandate_desc:0 "Faith in mythological power unites the people under a single sacred mission, stabilizing the nation and encouraging development."
 SBR_spirit_red_vanguard:0 "Red Vanguard"
 SBR_spirit_red_vanguard_desc:0 "As vanguard of the socialist revolution, workers unite. Productive capacity rises and the revolutionary flame burns ever brighter."
 SBR_spirit_siberian_bastion:0 "Siberian Bastion"
 SBR_spirit_siberian_bastion_desc:0 "Formidable defensive positions exploiting Siberia's permafrost have been constructed. The enemy shall exhaust themselves upon this frozen land."
 SBR_spirit_theocracy:0 "Theocratic State"
 SBR_spirit_theocracy_desc:0 "Holy Siberia is governed by divine law. The authority of the shamans permeates politics, bringing order and prosperity — at the cost of martial spirit."
