l_english:
 ##############################################
 # NSI National Focus Tree (English)
 ##############################################
 
 # Base Focus
 NSI_Sinkou:0 "Awakening"
 NSI_Sinkou_desc:0 "The ancient civilization of North Sentinel Island has evolved in isolation for millennia. Now is the time to demonstrate the true power of our civilization."
 
 # Isolation Tree
 NSI_isolation_doctrine:0 "Doctrine of Isolation"
 NSI_isolation_doctrine_desc:0 "Contact with the outside world brings contamination and corruption. We must maintain complete isolation to preserve our purity."
 
 NSI_outsider_rejection:0 "Rejection of Outsiders"
 NSI_outsider_rejection_desc:0 "No intruders shall be tolerated on our island. Strengthen coastal defenses to protect our sacred land."
 
 NSI_sacred_barriers:0 "Sacred Barriers"
 NSI_sacred_barriers_desc:0 "Through ancestral defensive arts, we fortify the entire island. Build absolute barriers to repel invaders."
 
 NSI_ancient_traditions:0 "Ancient Traditions"
 NSI_ancient_traditions_desc:0 "The ancient laws and traditions passed down for millennia are the source of our power. By preserving these teachings, we gain true strength."
 
 NSI_guardian_spirits:0 "Guardian Spirits' Protection"
 NSI_guardian_spirits_desc:0 "The spiritual beings protecting the island grant us power. Through this mystical protection, we become invincible."
 
 NSI_eternal_vigilance:0 "Eternal Vigilance"
 NSI_eternal_vigilance_desc:0 "Establish a permanent watch against external threats. This vigilance is the key to preserving our civilization."
 
 # Military Tree
 NSI_warrior_tradition:0 "Warrior Tradition"
 NSI_warrior_tradition_desc:0 "The ancient way of the warrior passed down through generations. Our warriors are born with the arts of combat."
 
 NSI_elite_guards:0 "Elite Guard"
 NSI_elite_guards_desc:0 "An elite force composed of the island's finest warriors. They possess power beyond ordinary soldiers."
 
 NSI_coastal_defense:0 "Coastal Defense"
 NSI_coastal_defense_desc:0 "Perfect defense of the island's coastline. No invader can approach from the sea."
 
 NSI_hidden_arsenals:0 "Hidden Arsenals"
 NSI_hidden_arsenals_desc:0 "Ancient armories hidden deep beneath the island. Centuries worth of weapons and equipment are stored there."
 
 NSI_ancient_weapons:0 "Ancient Weapons"
 NSI_ancient_weapons_desc:0 "Ancient weapon-making techniques passed down through generations. They possess power far surpassing modern weapons."
 
 # Underground City Tree
 NSI_chikatoshi:0 "Underground City"
 NSI_chikatoshi_desc:0 "Construct a massive city beneath the island. This underground city will become the true center of our civilization."
 
 NSI_underground_expansion:0 "Underground Expansion"
 NSI_underground_expansion_desc:0 "Further expand the underground city to accommodate more facilities."
 
 NSI_deep_tunnels:0 "Deep Tunnels"
 NSI_deep_tunnels_desc:0 "A deep tunnel network crisscrossing the entire island. Provides perfect defense systems and transportation."
 
 NSI_underground_forges:0 "Underground Forges"
 NSI_underground_forges_desc:0 "Massive forges built deep underground. Here our weapons and equipment are manufactured."
 
 NSI_subterranean_city:0 "Subterranean Metropolis"
 NSI_subterranean_city_desc:0 "Completion of the full underground metropolis. This city possesses scale and functions surpassing any surface city."
 
 NSI_hidden_laboratories:0 "Hidden Laboratories"
 NSI_hidden_laboratories_desc:0 "Secret laboratories built in the deepest parts of the underground city. Here our science and technology advance dramatically."
 
 NSI_underground_networks:0 "Underground Networks"
 NSI_underground_networks_desc:0 "Advanced communication networks connecting the entire underground city. Establish perfect information transmission systems."
 
 NSI_self_sufficient_society:0 "Self-Sufficient Society"
 NSI_self_sufficient_society_desc:0 "Achieve a completely self-sufficient society with no dependence on the outside world. The outside world is unnecessary for us."
 
 # Politics Tree
 NSI_tribal_council:0 "Tribal Council"
 NSI_tribal_council_desc:0 "A governance system through the ancient tribal system. The island is ruled by the wisdom of the elders."
 
 NSI_elder_wisdom:0 "Elder Wisdom"
 NSI_elder_wisdom_desc:0 "Ancient wisdom possessed by the island's elders. This knowledge is the foundation of our politics."
 
 NSI_isolation_laws:0 "Isolation Laws"
 NSI_isolation_laws_desc:0 "Legally prohibit contact with the outside world. These laws preserve our purity forever."
 
 # Faith Tree
 NSI_ancestral_worship:0 "Ancestral Worship"
 NSI_ancestral_worship_desc:0 "The tradition of ancestral worship continuing for millennia. The spirits of our ancestors watch over us and grant us power."
 
 NSI_sacred_rituals:0 "Sacred Rituals"
 NSI_sacred_rituals_desc:0 "Perform sacred rituals passed down from ancient times. These rituals greatly enhance our combat capabilities."
 
 NSI_forbidden_knowledge:0 "Forbidden Knowledge"
 NSI_forbidden_knowledge_desc:0 "Open the door to forbidden knowledge incomprehensible to ordinary people. This knowledge brings us immeasurable power."
 
 NSI_ancient_texts:0 "Ancient Texts"
 NSI_ancient_texts_desc:0 "Documents recording lost ancient military knowledge. This knowledge perfects our tactics."
 
 NSI_mystical_sciences:0 "Mystical Sciences"
 NSI_mystical_sciences_desc:0 "Unique scholarship fusing science and mysticism. Creates technology far surpassing modern science."
 
 NSI_spiritual_awakening:0 "Spiritual Awakening"
 NSI_spiritual_awakening_desc:0 "Spiritual awakening of all islanders. This awakening transcends our abilities beyond dimensions."
 
 NSI_otherworldly_contact:0 "Otherworldly Contact"
 NSI_otherworldly_contact_desc:0 "Establish contact with beings not of this world. Through their guidance, our technology leaps forward."
 
 NSI_divine_protection:0 "Divine Protection"
 NSI_divine_protection_desc:0 "Receive direct protection from the gods. This protection perfects our defenses."
 
 NSI_transcendent_wisdom:0 "Transcendent Wisdom"
 NSI_transcendent_wisdom_desc:0 "Acquire transcendent wisdom beyond human understanding. Through this wisdom, we approach divinity."
 
 NSI_reality_manipulation:0 "Reality Manipulation"
 NSI_reality_manipulation_desc:0 "Gain the power to manipulate reality itself. Even physical laws obey our will."
 
 NSI_temporal_mastery:0 "Temporal Mastery"
 NSI_temporal_mastery_desc:0 "Acquire the ability to control the flow of time. Both past and future are under our dominion."
 
 NSI_godlike_ascension:0 "Godlike Ascension"
 NSI_godlike_ascension_desc:0 "Finally, we ascend to godlike beings. No longer does anyone exist who can match us."
 
 # Awakening Tree
 NSI_awakening_wrath:0 "Awakening Wrath"
 NSI_awakening_wrath_desc:0 "When we who love peace are attacked, ancient wrath awakens. The time for retribution against invaders has come."
 
 NSI_ancient_fury:0 "Ancient Fury"
 NSI_ancient_fury_desc:0 "Ancient fury against those who broke millennia of peace. This anger knows no end."
 
 NSI_technological_supremacy:0 "Technological Supremacy"
 NSI_technological_supremacy_desc:0 "Release the true technological power we have kept hidden. Our scientific capabilities overwhelm all other nations."
 
 NSI_retribution:0 "Divine Retribution"
 NSI_retribution_desc:0 "In the name of the gods, we bring retribution upon those who invaded us. This retribution is complete and absolute."