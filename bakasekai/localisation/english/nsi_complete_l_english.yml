l_english:
 ##############################################
 # NSI Ideas (English)
 ##############################################
 
 # Base Ideas
 NSI_chikatoshi:0 "Underground City Construction"
 NSI_chikatoshi_desc:0 "Building massive city infrastructure underground has dramatically improved production capacity and construction efficiency."
 
 # Isolation Tree
 nsi_isolation_policy:0 "Isolationist Policy"
 nsi_isolation_policy_desc:0 "By cutting all contact with the outside world, we maintain our purity and stability. War and alliances are forbidden, but domestic affairs are greatly strengthened."
 
 nsi_outsider_rejection:0 "Outsider Rejection"
 nsi_outsider_rejection_desc:0 "Established a system to completely reject external intruders. Coastal defense and army defensive capabilities are greatly improved."
 
 nsi_sacred_barriers:0 "Sacred Barriers"
 nsi_sacred_barriers_desc:0 "By covering the entire island with sacred defensive barriers, fortification levels, defensive power, and spy detection capabilities are enhanced."
 
 nsi_ancient_traditions:0 "Ancient Traditions"
 nsi_ancient_traditions_desc:0 "Through ancient traditions and laws continuing for millennia, political power, stability, and ideological defense are strengthened."
 
 nsi_guardian_spirits:0 "Guardian Spirits' Protection"
 nsi_guardian_spirits_desc:0 "Through mystical protection by the island's guardian spirits, stability, war support, and military morale are greatly improved."
 
 nsi_eternal_vigilance:0 "Eternal Vigilance"
 nsi_eternal_vigilance_desc:0 "Through a permanent vigilance system against the outside world, construction efficiency and resource efficiency are improved, and consumer goods demand is reduced."
 
 # Military Tree
 nsi_warrior_tradition:0 "Warrior Tradition"
 nsi_warrior_tradition_desc:0 "Through the ancient way of the warrior, army attack/defense power and experience gain rate are improved."
 
 nsi_elite_guards:0 "Elite Guard"
 nsi_elite_guards_desc:0 "A guard unit by the island's most elite warriors. Special forces limits and combat power are greatly strengthened."
 
 nsi_ancient_weapons:0 "Ancient Weapons"
 nsi_ancient_weapons_desc:0 "Through ancient weapon technology passed down through generations, army attack power, equipment conversion speed, and military factory efficiency are improved."
 
 # Underground City Tree
 nsi_deep_tunnel_network:0 "Deep Tunnel Network"
 nsi_deep_tunnel_network_desc:0 "Through deep tunnel networks connecting the entire island, defensive power, entrenchment speed, spy detection, and fortification levels are improved."
 
 nsi_subterranean_metropolis:0 "Subterranean Metropolis"
 nsi_subterranean_metropolis_desc:0 "Through the completed underground metropolis, industrial and shipbuilding capabilities and construction efficiency are greatly improved, and consumer goods demand is reduced."
 
 nsi_hidden_research:0 "Hidden Research"
 nsi_hidden_research_desc:0 "Through secret research facilities deep underground, research speed, construction efficiency, and spy detection capabilities are improved."
 
 nsi_communication_network:0 "Communication Network"
 nsi_communication_network_desc:0 "Through advanced underground communication networks, political power, construction efficiency, and encryption/decryption capabilities are improved."
 
 nsi_autarky_perfected:0 "Perfect Autarky"
 nsi_autarky_perfected_desc:0 "Established a complete self-sufficient system with no dependence on the outside world. Stability, war support, and resource efficiency are greatly improved, and trade law costs are reduced."
 
 # Politics Tree
 nsi_tribal_council:0 "Tribal Council"
 nsi_tribal_council_desc:0 "A governance system through the ancient tribal system. Political power and stability are improved, and resistance to foreign ideologies is strengthened."
 
 nsi_isolation_laws:0 "Isolation Laws"
 nsi_isolation_laws_desc:0 "Laws legally prohibiting contact with the outside world. Stability, war support, and ideological defense are strengthened, and consumer goods demand is reduced."
 
 # Faith/Mystical Tree
 nsi_ancestral_worship:0 "Ancestral Worship"
 nsi_ancestral_worship_desc:0 "Through ancestral worship continuing for millennia, stability, war support, military morale, and ideological defense are improved."
 
 nsi_sacred_rituals:0 "Sacred Rituals"
 nsi_sacred_rituals_desc:0 "Through ancient sacred rituals, war support, military morale, and army experience gain rate are improved."
 
 nsi_forbidden_knowledge:0 "Forbidden Knowledge"
 nsi_forbidden_knowledge_desc:0 "Through forbidden knowledge incomprehensible to ordinary people, research speed, electronics production efficiency, and encryption capabilities are improved."
 
 nsi_ancient_military_wisdom:0 "Ancient Military Wisdom"
 nsi_ancient_military_wisdom_desc:0 "Through lost ancient military knowledge, army attack/defense power, planning speed, and maximum planning are improved."
 
 nsi_mystical_sciences:0 "Mystical Sciences"
 nsi_mystical_sciences_desc:0 "Through unique scholarship fusing science and mysticism, research speed and civilian/military factory production efficiency are improved."
 
 nsi_spiritual_awakening:0 "Spiritual Awakening"
 nsi_spiritual_awakening_desc:0 "Through spiritual awakening of all islanders, stability, war support, political power, and military morale are greatly improved."
 
 nsi_otherworldly_guidance:0 "Otherworldly Guidance"
 nsi_otherworldly_guidance_desc:0 "Through guidance from otherworldly beings, research speed, electronics efficiency, and encryption/decryption capabilities are dramatically improved."
 
 nsi_divine_protection:0 "Divine Protection"
 nsi_divine_protection_desc:0 "Through direct protection from the gods, fortress/coastal fortress levels, army defensive power, and spy detection capabilities are greatly strengthened."
 
 nsi_transcendent_wisdom:0 "Transcendent Wisdom"
 nsi_transcendent_wisdom_desc:0 "Through transcendent wisdom beyond human understanding, research speed, stability, political power, and construction efficiency are greatly improved."
 
 nsi_reality_bending:0 "Reality Bending"
 nsi_reality_bending_desc:0 "Through the power to manipulate reality itself, industrial/shipbuilding capabilities, construction efficiency, and resource efficiency are supernaturally improved."
 
 nsi_temporal_control:0 "Temporal Control"
 nsi_temporal_control_desc:0 "Through the ability to control the flow of time, research speed, construction efficiency, experience gain, and conscription efficiency are greatly improved."
 
 nsi_ascended_beings:0 "Ascended Beings"
 nsi_ascended_beings_desc:0 "Through ascension to divine beings, all abilities transcend human limits. No longer does anyone exist who can match us."
 
 # Awakening Tree
 nsi_awakened_empire:0 "Awakened Empire"
 nsi_awakened_empire_desc:0 "The awakening of a fallen empire whose peace was broken. Isolationist constraints are removed, and retribution against invaders begins with mighty military power."
 
 nsi_ancient_fury:0 "Ancient Fury"
 nsi_ancient_fury_desc:0 "Through ancient fury against those who broke millennia of peace, war support, army attack power, morale, and experience gain are greatly strengthened."
 
 nsi_tech_supremacy:0 "Technological Supremacy"
 nsi_tech_supremacy_desc:0 "Through the release of the true technological power we have kept hidden, research speed and military/civilian factory production efficiency are greatly improved."
 
 nsi_divine_retribution:0 "Divine Retribution"
 nsi_divine_retribution_desc:0 "Complete retribution in the name of the gods. Military power and war support are strengthened to the extreme, and justification time is greatly reduced."
 
 ##############################################
 # NSI Events (English)
 ##############################################
 
 # Underground City Construction Event
 nsi_events.1.t:0 "Underground Expansion Completed"
 nsi_events.1.d:0 "Our engineers have successfully completed another phase of underground city expansion. The new tunnels and chambers will greatly benefit our civilization."
 nsi_events.1.a:0 "Excellent progress"
 
 # Ancient Artifact Discovery Event
 nsi_events.2.t:0 "Ancient Artifact Discovered"
 nsi_events.2.d:0 "While excavating the underground city, our workers have uncovered ancient artifacts containing lost knowledge. How shall we utilize this discovery?"
 nsi_events.2.a:0 "Study for scientific advancement"
 nsi_events.2.b:0 "Apply to military knowledge"
 
 # Outsider Contact Rejection Event
 nsi_events.3.t:0 "Outsiders Attempt Contact"
 nsi_events.3.d:0 "Foreign vessels have been spotted near our shores, attempting to make contact. Our isolation policy demands their immediate rejection."
 nsi_events.3.a:0 "Drive them away"
 
 # Guardian Spirits Protection Event
 nsi_events.4.t:0 "Guardian Spirits' Blessing"
 nsi_events.4.d:0 "The island's guardian spirits have blessed our people with their divine protection, strengthening our resolve and unity."
 nsi_events.4.a:0 "Accept the blessing gratefully"
 
 # Awakening Warning Event
 nsi_events.5.t:0 "The Ancient Island Stirs"
 nsi_events.5.d:0 "Reports indicate that the mysterious North Sentinel Island, long isolated from the world, is showing signs of unprecedented activity following attacks on its territory."
 nsi_events.5.a:0 "This could be dangerous..."
 
 # Research Breakthrough Event
 nsi_events.6.t:0 "Mystical Research Breakthrough"
 nsi_events.6.d:0 "Our researchers have achieved a breakthrough in mystical sciences, opening new avenues of technological advancement."
 nsi_events.6.a:0 "Focus on electronics"
 nsi_events.6.b:0 "Focus on industry"
 
 # Underground Farm Expansion Event
 nsi_events.7.t:0 "Underground Agriculture Expansion"
 nsi_events.7.d:0 "Our underground agricultural systems can be expanded to increase either industrial capacity or population support."
 nsi_events.7.a:0 "Expand industrial capacity"
 nsi_events.7.b:0 "Increase population support"
 
 # Mystical Phenomenon Event
 nsi_events.8.t:0 "Mystical Phenomenon"
 nsi_events.8.d:0 "Strange mystical phenomena have been observed across the island, indicating our growing mastery over supernatural forces."
 nsi_events.8.a:0 "Channel into research"
 nsi_events.8.b:0 "Use for construction"
 
 # Awakening News Event
 nsi_events.100.t:0 "The Fallen Empire Awakens"
 nsi_events.100.d:0 "The ancient civilization of North Sentinel Island has finally revealed its true power. After millennia of peaceful isolation, they have awakened to defend their sacred land with terrible fury."
 nsi_events.100.a:0 "This is unprecedented..."
 nsi_events.100.b:0 "Our wrath is righteous!"
 
 ##############################################
 # NSI Decisions (English)
 ##############################################
 
 # Decision Categories
 NSI_internal_development:0 "Internal Development"
 NSI_awakened_actions:0 "Awakened Empire Actions"
 
 # Internal Development Decisions
 NSI_expand_underground_city:0 "Expand Underground City"
 NSI_expand_underground_city_desc:0 "Continue the expansion of our underground city infrastructure to increase industrial capacity."
 
 NSI_strengthen_defenses:0 "Strengthen Island Defenses"
 NSI_strengthen_defenses_desc:0 "Reinforce our defensive positions to better protect against potential invaders."
 
 NSI_spiritual_meditation:0 "Spiritual Meditation"
 NSI_spiritual_meditation_desc:0 "Engage in spiritual practices to strengthen the unity and resolve of our people."
 
 NSI_ancient_research:0 "Ancient Knowledge Research"
 NSI_ancient_research_desc:0 "Delve deeper into our ancient archives to unlock forgotten knowledge and technologies."
 
 NSI_recruit_elite_warriors:0 "Recruit Elite Warriors"
 NSI_recruit_elite_warriors_desc:0 "Train and recruit elite warriors from among our most capable fighters."
 
 NSI_commune_with_spirits:0 "Commune with Guardian Spirits"
 NSI_commune_with_spirits_desc:0 "Seek guidance and blessings from the guardian spirits that protect our island."
 
 # Awakened Empire Decisions
 NSI_mobilize_ancient_arsenal:0 "Mobilize Ancient Arsenal"
 NSI_mobilize_ancient_arsenal_desc:0 "Unlock our hidden weapon stockpiles accumulated over centuries of preparation."
 
 NSI_divine_wrath:0 "Channel Divine Wrath"
 NSI_divine_wrath_desc:0 "Call upon the gods to smite our enemies with divine retribution."
 
 NSI_reality_alteration:0 "Reality Alteration"
 NSI_reality_alteration_desc:0 "Use our mastery over reality to instantly manifest industrial infrastructure."
 
 NSI_temporal_manipulation:0 "Temporal Manipulation"
 NSI_temporal_manipulation_desc:0 "Manipulate the flow of time to accelerate our technological and military development."

 ##############################################
 # NSI Technologies (English)
 ##############################################
 nsi_ancient_warfare:0 "Ancient Warfare"
 nsi_ancient_warfare_desc:0 "Revive combat techniques passed down from ancestors and establish a unique tactical system."
 
 nsi_spiritual_guidance:0 "Spiritual Guidance"
 nsi_spiritual_guidance_desc:0 "Deepen spiritual unity and incorporate spiritual elements into military doctrine."
 
 nsi_sacred_rituals_tech:0 "Sacred Ritual Technology"
 nsi_sacred_rituals_tech_desc:0 "Technology to improve soldiers' morale and organization through ancient rituals."
 
 nsi_forbidden_knowledge_tech:0 "Forbidden Knowledge Technology"
 nsi_forbidden_knowledge_tech_desc:0 "Utilize forbidden ancient knowledge to develop dangerous but powerful technologies."
 
 nsi_advanced_construction:0 "Advanced Construction Technology"
 nsi_advanced_construction_desc:0 "Develop tribal building knowledge to establish more efficient construction techniques."

 ##############################################
 # NSI Equipment (English)
 ##############################################
 tribal_equipment:0 "Tribal Equipment"
 tribal_equipment_desc:0 "Traditional weapons and armor passed down from ancient times. Simple but effective."
 
 tribal_equipment_1:0 "Improved Tribal Equipment"
 tribal_equipment_1_desc:0 "Weapons made by improving traditional manufacturing techniques. Enhanced power and reliability."
 
 ancient_enhanced_equipment:0 "Ancient Enhanced Equipment"
 ancient_enhanced_equipment_desc:0 "Ancient weapons enhanced by forbidden knowledge. Possesses tremendous power."

 ##############################################
 # NSI Units (English)
 ##############################################
 nsi_tribal_warriors:0 "Tribal Warriors"
 nsi_tribal_warriors_desc:0 "Warriors who know the island's natural environment inside out. Skilled in jungle and forest combat."
 
 nsi_ancient_guard:0 "Ancient Guard"
 nsi_ancient_guard_desc:0 "Elite soldiers trained through forbidden knowledge. Possess superhuman abilities."

 ##############################################
 # Opinion Modifiers
 ##############################################
 
 nsi_mysterious_isolation:0 "Mysterious Isolation"