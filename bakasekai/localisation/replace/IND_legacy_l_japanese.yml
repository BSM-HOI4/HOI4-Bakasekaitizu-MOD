l_japanese:
 RAJ_seek_japanese_support_tt: "独立戦争が始まれば、[JAP.GetNameDef]は以下のものを提供してくれる:\nB4Y対艦攻撃機§Y120機§!\n[Jap.GetAdjective]キ10戦闘機§Y135機§!\nこれらに対応する設計図および\n"
 RAJ_GOE_vie_for_princes_tt: "\n[THIS.GetName]に圧力を§Y1§!加え、我々の支配下に入るようプレッシャーをかける。利用可能な国家への圧力値が§Y1§!減少する（現在値[?ROOT.pressure_left]/[?ROOT.default_pressure]）\n\n§Y現在の国家への圧力値: §![GetPressureTextRAJ]"
 RAJ_GOE_princely_state_timeout_tt: "圧力をかけることによって、彼らの領土を外交的に併合することができる。圧力による優位性が明確ならば、[FROM.GetName]は確実に我々の支配下に入るだろう。\n\nこの任務の終了時点で、各国はどの国の支配下に入るかを決定する。他国を上回り、25%超の圧力をかけた国があれば、彼らは喜んで[ROOT.GetName]の支配下に入るだろう。\n\n"
 RAJ_hidden_pressure_RAJ_BAN_does_not_exist: "\n[THIS.GetName]に対する我が国の圧力値: §O[?THIS.RAJ_pressure]§!\n[THIS.GetName]に対する[PAK.GetAdjective]の圧力値: §Y不明§!"
 RAJ_hidden_pressure_PAK_BAN_does_not_exist: "\n[THIS.GetName]に対する我が国の圧力値: §G[?THIS.PAK_pressure]§!\n[THIS.GetName]に対する[RAJ.GetAdjective]の圧力値: §Y不明§!"
 RAJ_hidden_pressure_BAN: ""
 RAJ_hidden_pressure_ban_exists: "[THIS.GetName]に対する[BAN.GetAdjective]の圧力値: §YUnknown§!"
