 why_we_fight_effect: "§Y中立的外交政策§!の精神がない場合、陣営を創設することができる。\n"
 ENG_AIR_REARMAMENT_DESC_COMMUNIST: "大陸に位置する敵国と戦争する上で、人民空軍（People's Air Force）の存在は勝利の鍵となるだろう。手始めに、航空基地を再軍備計画で確実に補強しなくてはならない。"
 ENG_AIR_REARMAMENT_DESC_HISTORICAL: "大陸に位置する敵国と戦争する上で、王立空軍（Royal Air Force）の存在は勝利の鍵となるだろう。手始めに、航空基地を再軍備計画で確実に補強しなくてはならない。"
 ENG_AST_suppressed_coup: "オーストラリアは暴動を鎮圧した。\n"
 ENG_BRITANNIA_RULES_THE_WAVES_DESC_COMMUNIST: "他国はワーカーズ・リベレーション・ネイヴィーに恐れ慄き、革新的ドクトリンの創造に追われている。慢心し、個々の艦船の質、量のみをあてにしてはならない。"
 ENG_BRITANNIA_RULES_THE_WAVES_DESC_HISTORICAL: "他国はロイヤル・ネイヴィーに恐れ慄き、革新的ドクトリンの創造に追われている。慢心し、個々の艦船の質、量のみをあてにしてはならない。"
 ENG_BSA_COMPANY_DESC_COMMUNIST: "革命兵器工場は十分な小火器を生産できていない。しかし先の大戦同様、バーミンガム小火器会社と契約する事で、彼らの生産力を強化できる。"
 ENG_BSA_COMPANY_DESC_HISTORICAL: "ロイヤル・オードナンス工場は十分な小火器を生産できていない。しかし先の大戦同様、バーミンガム小火器会社（Birmingham Small Arms Company）と契約する事で、彼らの生産力を強化できる。"
 ENG_CAN_suppressed_coup: "カナダは暴動を鎮圧した。\n"
 ENG_COASTAL_COMMAND_DESC_COMMUNIST: "我々の産業は帝国の離れた場所から本土に輸送される資源に支えられている。輸送船は生命線であり、誇り高き労働者解放海軍と人民空軍によって護衛しなければならない。沿岸防衛隊を編成して港に近寄る敵を防ぐ必要がある。"
 ENG_COASTAL_COMMAND_DESC_HISTORICAL: "我々の産業は帝国の離れた場所から本土に輸送される資源に支えられている。輸送船は生命線であり、誇り高き海軍と空軍によって護衛しなければならない。沿岸防衛隊を編成して港に近寄る敵を防ぐ必要がある。"
 ENG_GENERAL_REARMAMENT_DESC_AHISTORICAL: "前任者は軍事的状況を無視し続けてきた。我々の不十分な軍隊状況を改善するために全面的な再軍備計画を実施する必要がある。"
 ENG_GENERAL_REARMAMENT_DESC_HISTORICAL: "新たな世界大戦はどうやら不可避のものとなりつつあるようだ。ヒトラーでなくとも天皇が、もしくはソビエトでさえもきっかけとなるだろう……世論は本格的再軍備を開始する方向に十分傾いている。"
 ENG_LIMITED_REARMAMENT_AHISTORICAL: "我々の国内政治と国際関係の新しい取り組みは健全な軍隊を必要とする。将来的な準備として我々の民間債業を拡大し始めるべきであり、将来的に軍事産業の拡大のための安定した基盤を形成するだろう。"
 ENG_LIMITED_REARMAMENT_HISTORICAL: "昨今のドイツと世界中のファシスト勢力による動乱は、我々が平和を謳歌できないかもしれない事を示唆している。もし状況が悪い方向へ動くならば、我々は再軍備の為に動き始めるべきである。"
 ENG_NAVAL_REARMAMENT_DESC_COMMUNIST: "我々は第二次ロンドン海軍軍縮条約で海軍の軍拡競争を予防を試みたが、加盟国は軍縮条約を無視している。ワーカーズ・リベレーション・ネイヴィーが世界の覇権を喪失する事は許されない。我らは常に世界最大の海軍でなければならないのだ。"
 ENG_NAVAL_REARMAMENT_DESC_HISTORICAL: "我々は第二次ロンドン海軍軍縮条約で海軍の軍拡競争を予防を試みたが、加盟国は軍縮条約を無視している。ロイヤル・ネイヴィーが世界の覇権を喪失する事は許されない。我らは常に世界最大の海軍でなければならないのだ。"
 ENG_NZL_suppressed_coup: "ニュージーランドは暴動を鎮圧した。\n"
 ENG_Naval_treaty_nation: "@ENG イギリス"
 ENG_ROYAL_ORDNANCE_FACTORIES_DESC_COMMUNIST: "嘆かわしい事に、ウーリッジの革命兵器工廠は十分な数の弾薬や小火器を生産するには不十分だ。全国により多くの工場を建てるべきだろう。特に安全な地域が望ましい。"
 ENG_ROYAL_ORDNANCE_FACTORIES_DESC_HISTORICAL: "嘆かわしい事に、ウーリッジの王立兵器工廠は十分な数の弾薬や小火器を生産するには不十分だ。全国により多くの工場を建てるべきだろう。特に安全な地域が望ましい。"
 ENG_ROYAL_ORDNANCE_FACTORIES_NAME_COMMUNIST: "レヴォリューショナリー・オードナンス工場"
 ENG_ROYAL_ORDNANCE_FACTORIES_NAME_HISTORICAL: "ロイヤル・オードナンス工場"
 ENG_ROYAL_TANK_REGIMENT_DESC_COMMUNIST: "戦車を発明したのはイギリスであり、従って共和国戦車連隊（Republican Guard Tank Regiment）は世界で最良の戦車を備えているべきだが、現在のところそれは真実ではない。特殊車両開発委員会（Special Vehicle Development Committee）はイギリスを戦車開発の最前線に置くために、現代型の設計の研究と開発を提案している。"
 ENG_ROYAL_TANK_REGIMENT_DESC_HISTORICAL: "戦車を発明したのはイギリスであり、従って王立戦車連隊（Royal Tank Regiment）は世界で最良の戦車を備えているべきだが、現在のところそれは真実ではない。特殊車両開発委員会（Special Vehicle Development Committee）はイギリスを戦車開発の最前線に置くために、現代型の設計の研究と開発を提案している。"
 ENG_ROYAL_TANK_REGIMENT_NAME_COMMUNIST: "共和国戦車連隊"
 ENG_ROYAL_TANK_REGIMENT_NAME_HISTORICAL: "王立戦車連隊"
 ENG_SAF_suppressed_coup: "南アフリカは暴動を鎮圧した。\n"
 ENG_VANGUARD_DESC_COMMUNIST: "我々は数の上で敵海軍に優越されてはならない。未だに備蓄として眠っている15インチ砲を、新型戦艦に要求され開発に時間がかかる16インチ砲の代用としする。この措置によって新型戦艦のネームシップであるWLMS ヴァンガードの建造は大きく加速するだろう。"
 ENG_VANGUARD_DESC_HISTORICAL: "我々は数の上で敵海軍に優越されてはならない。未だに備蓄として眠っている15インチ砲を、新型戦艦に要求され開発に時間がかかる16インチ砲の代用としする。この措置によって新型戦艦のネームシップであるHMS ヴァンガードの建造は大きく加速するだろう。"
 ENG_a_change_in_course: "方針転換"
 ENG_a_change_in_course_desc: "世界の緊張が増して行っている現状において、このままの政治指導では国益を保護する力に欠けていることは明白である。直近数十年の政治を抜本的に改革し、新たな政道に乗り出す時が来た。"
 ENG_a_s_warfare: "対潜戦"
 ENG_a_s_warfare_desc: "大西洋は我々の生命線だ。脆弱な船舶輸送が水平線の上下にわたって餌食になることを払拭させねばならない。最良の兵器と探知装備による護衛を確保するために、対潜水艦戦の分野における最新技術の開発に注力する。"
 ENG_abdication_crisis: "エドワード8世退位危機"
 ENG_abdication_crisis_changed_mind: "エドワード8世がウォリス・シンプソンと結婚しなかった"
