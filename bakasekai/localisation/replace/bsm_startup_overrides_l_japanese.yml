 mutiny_1:0 "反乱の鎮圧"
 mutiny_event.1.a:0 "軍の規律を維持せよ"
 mutiny_event.1.desc:0 "忠実な部隊の投入により、反乱は速やかに鎮圧された。反乱の首謀者たちは逮捕され、軍の規律は回復した。前線の安定は確保された。"
 mutiny_event.1.t:0 "反乱鎮圧――成功"
 mutiny_event.2.a:0 "軍の崩壊が迫っている"
 mutiny_event.2.desc:0 "反乱部隊の鎮圧は失敗した。鎮圧部隊の一部までもが反乱に同調し、事態はさらに悪化した。軍の指揮系統は危機に瀕している。"
 mutiny_event.2.t:0 "反乱鎮圧――失敗"
 mutiny_event.3.a:0 "兵士たちの声を聞き入れた"
 mutiny_event.3.desc:0 "反乱兵の代表との対話は成功裏に終わった。彼らの不満に真摯に耳を傾めたことで、兵士たちは徐々に指揮系統に復帰し始めている。軍の団結は回復されつつある。"
 mutiny_event.3.t:0 "反乱部隊との交渉――成功"
 mutiny_event.4.a:0 "軍の規律を再建せよ"
 mutiny_event.4.desc:0 "親衛隊の投入が功を奏した。反乱部隊は制圧され、指揮系統は回復に向かっている。しかし、軍内の亀裂は一朝一夕には癒えない。"
 mutiny_event.4.t:0 "反乱鎮圧――第二波成功"
 mutiny_event.5.a:0 "軍は崩壊の縁にある"
 mutiny_event.5.desc:0 "第二波の鎮圧作戦も失敗に終わった。反乱はさらに広がりを見せ、忠実な部隊にも動揺が生じている。軍の分裂は決定的なものになりつつある。"
 mutiny_event.5.t:0 "反乱鎮圧――第二波失敗"
 mutiny_event.6.a:0 "軍の団結を取り戻した"
 mutiny_event.6.desc:0 "反乱兵との交渉は妥結した。待遇改善と指揮官の更迭が約束され、兵士たちは武器を置き始めた。軍内部の緊張は和らぎ、戦闘力の回復が期待される。"
 mutiny_event.6.t:0 "反乱部隊との交渉――第二波成功"
 mutiny_event.7.a:0 "鉄の拳で秩序を取り戻した"
 mutiny_event.7.desc:0 "圧倒的な軍事力により、反乱は完全に鎮圧された。反乱指導者たちは軍事法廷にかけられ、軍の規律は力によって再建された。しかしその代償は計り知れない。"
 mutiny_event.7.t:0 "反乱鎮圧――第三波成功"
 mutiny_event.8.a:0 "全てが崩壊しつつある"
 mutiny_event.8.desc:0 "最後の鎮圧の試みも失敗した。反乱は軍全体に波及し、もはや制御不能の状況にある。国家の武力そのものが内側から崩れ去ろうとしている。"
 mutiny_event.8.t:0 "反乱鎮圧――第三波失敗"
 mutiny_event.9.a:0 "軍は生まれ変わった"
 mutiny_event.9.desc:0 "政府の大幅な譲歩が反乱兵に受け入れられた。軍事改革と待遇の抜本的改善が約束され、兵士たちは指揮系統に復帰した。軍は血を分けた教訓から再び一つになった。"
 mutiny_event.9.t:0 "反乱部隊との交渉――第三波成功"
 mutiny_mission:0 "反乱の監視"
