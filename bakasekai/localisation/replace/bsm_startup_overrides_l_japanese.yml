 ENG_unite_the_anglosphere: "英語圏の統合"
 ENG_unite_the_anglosphere_desc: "我々の言葉と文化が地球上のいたる所で今までの間使われていることは我らの黄金時代における遺産の一つだ。独立を保つこれらの地域における忘恩と侮辱に耐え忍ぶくらいならばいっその事我らの支配の下に統一すべきだ。"
 ENG_urge_restraint: "抑制を主張"
 ENG_urge_restraint_desc: "我々の行進が滞りなく終了したが、それに対する暴力的な対応が国内の地域に波及し、全国的な不安さらには潜在的な内戦さえも引き起こすのは避けなければならない。それは影響力を持った支持者の何人かの意見に背くことになるかもしれないが、我々の指導者には暴力を絶対に控えるよう指示するべきだ。"
 ENG_urge_restraint_tt: "次の§Y黒シャツ隊の行進§!が§Y暴力沙汰§!へと発展する可能性が大きく減少する。\n"
 ENG_utilize_home_guard_in_factories: "工場で国防市民軍を用いる"
 ENG_utilize_home_guard_in_factories_tt: "このディシジョンは§Y184§!日ごとに再度有効になる"
