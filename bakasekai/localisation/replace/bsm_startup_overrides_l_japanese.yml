 ENG_request_trade_union_construction_worker_support: "労働組合の建設労働者の支援を要請する"
 ENG_request_trade_union_construction_worker_support_desc: "我々は労働組合の繋がりと信用を利用して、当面の間、建設の生産性が向上することの重要性を納得させる。労働組合の支援により、我々は全建設労働者たちに動機を与えることができる。"
 ENG_request_trade_union_dockyard_worker_support: "労働組合の造船所労働者の支援を要請する"
 ENG_request_trade_union_dockyard_worker_support_desc: "我々は労働組合の繋がりと信用を利用して、当面の間、造船所の生産性が向上することの重要性を納得させる。労働組合の支援により、我々は全造船所労働者たちに動機を与えることができる。"
 ENG_request_trade_union_factory_worker_support: "労働組合の工場労働者の支援を要請する"
 ENG_request_trade_union_factory_worker_support_desc: "我々は労働組合の繋がりと信用を利用して、当面の間、工場の生産性が向上することの重要性を納得させる。労働組合の支援により、我々は全工場労働者たちに動機を与えることができる。"
 ENG_request_trade_union_support_cost_level_down_tt: "全§Y労働組合への支援要請§!ディシジョンのコストを10引きさげる。最低は40まで。\n"
 ENG_request_trade_union_support_cost_level_up_tt: "全§Y労働組合への支援要請§!ディシジョンのコストが10引きあがる。\n"
 ENG_request_trade_union_support_for_new_factories: "新工場への労働組合の支援を要請する"
 ENG_request_trade_union_support_for_new_factories_desc: "我々は新工場獲得の為の支援を労働組合に依頼する。"
 ENG_request_trade_union_war_propaganda_support: "労働組合に戦争プロパガンダの支援を要請する"
 ENG_request_trade_union_war_propaganda_support_desc: "人々を戦争に備えさせるために労働組合からの援助を要求する。戦争は近づいて来ており、彼らは政府の備えを支援しなければならないのだ。"
