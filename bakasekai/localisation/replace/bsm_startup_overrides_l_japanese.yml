 ENG_replace_government_in_australia_communism: "オーストラリアに共産主義政権を樹立する"
 ENG_replace_government_in_australia_communism_desc: "オーストラリアは政権交代により我々の同志に従順となる準備ができている。"
 ENG_replace_government_in_australia_fascism: "オーストラリアにファシスト政権を樹立する"
 ENG_replace_government_in_australia_fascism_desc: "オーストラリアの人々は政治体制をもう一つのものに変える準備が整っている……オーストラリアは我々ファシストの指導者に従順だ。"
