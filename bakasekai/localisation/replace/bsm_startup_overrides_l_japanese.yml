 ENG_vanguard_tt_hms: "HMS ヴァンガードを建造する。\n"
 ENG_vickers_experimental_facility_focus: "ヴィッカースの実験施設"
 ENG_vickers_experimental_facility_focus_desc: "特殊技術プロジェクトの研究開発をさらに進めるため、フォックスウォーレンのヴィッカースの実験施設の拡張に努めるべきである。"
 ENG_vickers_experimental_facility_focus_tt: "§Y[126.GetName]§!に他の§Y実験施設§!がない場合、§Y[126.GetName]§!に§Y航空力学・航空電子工学研究施設§!を§G1§!つ獲得する。"
 ENG_war_with_germany: "ドイツとの交戦"
 ENG_war_with_germany_desc: "ドイツ人達は我々に他の選択肢を残しはしなかった。自由な世界と我らの子供の未来のために。今こそ戦争の時である。"
 ENG_war_with_italy: "イタリアとの交戦"
 ENG_war_with_italy_desc: "イタリアが新しい帝国への計画の放棄を拒んだことは、彼らが直に領土拡張戦争を始めるであろうことを証明している。手遅れとなる前に、この脅威を取り除く必要があるだろう。"
 ENG_war_with_japan: "日本との交戦"
 ENG_war_with_japan_desc: "あらゆる方法を使ったが日本は拡張主義的なやり方を放棄する事を拒否した。大英帝国とアジアの人々の安全のため、日本を征伐する必要がある。"
 ENG_war_with_ussr: "想像を絶する作戦"
 ENG_war_with_ussr_desc: "ソビエト連邦の脅威は、我々の非難にも関わらず日に日に増大している。最早これを黙認する余地はなく、戦争へと踏み切ることが、より良い我が国の未来への決断となるだろう。"
