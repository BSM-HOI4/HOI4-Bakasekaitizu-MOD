 ENG_danish_intervention: "デンマークへの介入"
 ENG_danish_intervention_desc: "世界平和の敵に対するデンマークの支援が続いているが、奴らをこちら側に置く唯一の手段が存在する。ヨーロッパ大陸において陸上からの侵攻が必要となった場合に備え、デンマークを戦略的足掛かりの確立のために利用することだ。"
 ENG_david_lloyd_george: "デイヴィッド・ロイド・ジョージ"
 ENG_david_stirling: "デイヴィッド・スターリング"
 ENG_declare_american_monarchy: "アメリカ君主制を宣言"
 ENG_decolonization: "脱植民地化"
 ENG_decolonization_desc: "それは時代の終わりでもあるが、我々の選択の終わりでもある。止まることのない独立運動の台頭に対して無駄に奮闘し威厳を保つのではなく、自信と誇りを持って堂々と、我が国の保護下で彼らを可能な限り導くのだ。今、残されているのは残された絆を断ち切り、かつて世界の舞台に依存していた人々を対等に迎えることだけだ。"
 ENG_decolonized: "イギリスが脱植民地化した"
 ENG_demand_treaty_compliance: "条約の応諾を要求"
 ENG_demand_treaty_compliance_tt: "彼らが§Y60日§!以内に要求に応じない場合、我々は§Y傀儡化の戦争目標§!を得る。\n"
 ENG_demand_treaty_compliance_tt2: "§Y戦艦§!・§Y巡洋戦艦§!・§Y空母§!の海軍規模が§Y[Root.GetName]§!と比べて§Y100%§!以上である。"
 ENG_demand_treaty_compliance_tt3: "§Y戦艦§!・§Y巡洋戦艦§!・§Y空母§!の海軍規模が§Y[Root.GetName]§!と比べて§Y65%§!以上である。"
 ENG_demand_treaty_compliance_tt4: "§Y戦艦§!・§Y巡洋戦艦§!・§Y空母§!の海軍規模が§Y[Root.GetName]§!と比べて§Y35%§!以上である。"
 ENG_democratic_civil_war_tt: "民主主義派が内戦を始めた。\n"
 ENG_democratic_party: "保守党"
 ENG_desperate_defense_of_the_homeland: "祖国の必死の防衛"
 ENG_disband_home_guards_tt: "§Rすべての国防市民軍を解散させる§!。\n（人的資源や装備品は戻らない）"
 ENG_discuss_appeasement: "宥和政策についての議論"
 ENG_discuss_appeasement_desc: "宥和政策方針について幅広い批判を受けたことで、我々は議論のためにこの方針を英連邦に入れ知恵すべきである。"
 ENG_discuss_imperial_defense: "帝国防衛についての議論"
 ENG_discuss_imperial_defense_desc: "英連邦の全構成国が帝国防衛に重大な貢献を提言する運動を提唱する。"
 ENG_discuss_imperial_economy: "帝国経済についての議論"
 ENG_discuss_imperial_economy_desc: "英連邦の全構成国が国内経済に多大な投資を行い、我々の投資への依存を減少させ、全体として帝国の強化を提言する運動を提唱する。"
 ENG_discuss_imperial_federation: "帝国連邦についての議論"
 ENG_discuss_imperial_federation_desc: "前世紀以来、全自治領の独立を含む「内政自治権」の代わりに進捗するよりもむしろ、帝国の全地域を単一帝国連邦として統合することに賛成の声が上がっている。それを最後としての議論を行う運動を提唱する。"
 ENG_discuss_imperial_trade: "帝国貿易についての議論"
 ENG_discuss_imperial_trade_desc: "英連邦の全構成国が帝国内における優先貿易の増加を提言する運動を提唱することで、我々全体が更に繁栄する可能性が高まる。"
 ENG_ditched_by_the_germans_flag: "イギリス人への支持によりドイツ人から見捨てられた。\n"
 ENG_ditched_the_italians_flag: "我々がイタリアから距離を置くことをイギリスが支持した。\n"
 ENG_dominion_communist_propaganda: "イギリス共産党のプロパガンダ"
 ENG_dominion_fascist_propaganda: "イギリス・ファシスト党のプロパガンダ"
 ENG_dominions_accepted_federation: "自治領が帝国連邦を承認した\n"
 ENG_dominions_stayed_with_fascist_britain_flag: "ファシスト政権のイギリスに留まった。"
 ENG_dudley_pound: "$dudley_pound$"
 ENG_dutch_security: "オランダの確保"
 ENG_dutch_security_desc: "オランダでは敵を支援する政治運動が続いている。自由なヨーロッパを確実にする為にはオランダは征伐されなければならない。"
 ENG_east_indies_fleet_focus: "東インド艦隊の設立"
 ENG_east_indies_fleet_focus_desc: "1904年、第一海軍卿サー・ジョン・フィッシャー提督は、戦時には極東における三つの主要部隊――東インド戦隊、中国艦隊、オーストラリア戦隊――を、シンガポールを拠点とする「東洋艦隊」の指揮下に統合するよう命じた。この地域の緊張が高まるなか、これを実現するための準備を始めるのが賢明だろう。"
 ENG_edmund_ironside: "$edmund_ironside$"
 ENG_edward_ellington: "$edward_ellington$"
 ENG_edward_viii_abdicated: "エドワード8世の退位"
 ENG_eliminate_the_upper_class: "上流階級の排除"
 ENG_eliminate_the_upper_class_desc: "労働者は立ち上がって上流階級による抑圧を打破するに違いない。我々は彼らに呼応し、会社を国有化する。"
 ENG_eliminate_the_upper_class_tt: "貴族階級の元帥、将軍及び提督を排除する。\n"
 ENG_embargo_germany: "ドイツへの禁輸"
 ENG_embargo_germany_desc: "ドイツの再軍備は国際平和への侮辱かつ強大な脅威である。彼らが軍備への補給をするための資源を、我々は供給すべきではない。"
 ENG_embargo_ussr: "ソ連への禁輸"
 # [same value supplied by vanilla; original preserved] ENG_embargo_ussr_desc: "ソビエト連邦は、我が国の資源を用いて軍事力の強化を行っている。すぐに彼らとの貿易を停止する必要がある。"
 ENG_enact_the_mosley_manifesto: "モズレー宣言の制定"
 ENG_enact_the_mosley_manifesto_desc: "数年間の準備期間を経て、モズレーは貧困を解消するための経済改革に関するマニフェストを作成した。指導者としての提案を実行するときがきた。"
 ENG_end_the_blackouts: "全国規模の停電を終了"
 ENG_enforce_blackouts: "全国規模の停電を実施"
 ENG_enforce_blackouts_tt: "この国民精神はディシジョンによって取り除くことができる"
 ENG_enforce_decolonization: "脱植民地化の実行"
 ENG_enforce_decolonization_desc: "世界の諸国家に倣い我々は今こそ脱植民地化を進めるべきだ。そして我々はこの道理に分別を見出さぬ者に分別というものを教え込むために最後通牒を送りつけるだろう。"
 ENG_enforce_the_naval_treaties: "海軍軍縮条約の施行"
 ENG_enforce_the_naval_treaties_desc: "ワシントン海軍軍縮条約の条項を無視することを選択した数か国を我々は注視している。この傾向は無視できないものだ。我々が優位性を維持し、同調国が現れないようにするためには、これらの国を一刻も早く攻撃し、我々の意思を無視する国はどうなるかを見せつけてやらねばならない。"
 ENG_enforce_the_naval_treaties_tt: "これは我々よりも多くの§Y主力艦§!を保有している国に対し、その§Y主力艦§!を§G削減§!させるために使用でき、もし彼らが拒否した場合§Y傀儡の戦争目標§!を得る。\n"
 ENG_ernest_bevin: "アーネスト・ベビン"
 ENG_ernle_chatfield: "$ernle_chatfield$"
 ENG_establish_the_local_defense_volunteers: "地域防衛志願兵を設立する"
 ENG_establish_the_local_defense_volunteers_tt: "§Y市民兵結成§!と§Y工場で国防市民軍を用いる§!ディシジョンがアンロック。"
 ENG_evacuated_colonial_assets: "疎開した植民地資産"
 ENG_every_man_will_do_his_duty: "各員がその義務を尽くせ"
 ENG_every_man_will_do_his_duty_desc: "ネルソンの有名な言葉の精神でもって我々は人々に義務感を植え付けなければならない。彼らがそれを好きであろうとなかろうと、国家は来たる危機に直面すると彼らの奉仕を要求するのだから。"
 ENG_exiled_royal_family: "王室の追放"
 ENG_expand_the_repair_yards: "修理ドックの拡張"
 ENG_expand_the_repair_yards_desc: "我が海軍は世界最大級の規模であるが、戦闘でダメージを受けた場合や、艦船が消耗した場合には、速やかに船を修理する手段が必要である。我が軍の修理作業場を拡張することはこれを達成するだけではなく、古い艦船を改修することを可能にするだろう。"
 ENG_expand_the_secret_intelligence_service_focus: "秘密諜報機関の拡大"
 ENG_expand_the_secret_intelligence_service_focus_desc: "MI6の通称で知られる英国諜報局は、破壊活動や外国からの脅威から祖国を守っている。第一次世界大戦中に結成されたものの、20年代に再編成された。しかし、当時は重要な詳細を見逃していた。組織の規模を再び拡大する努力をすべきだ。"
 ENG_expected_decolonization: "脱植民地化への期待"
 ENG_expected_decolonization_tt: "クーデター計画が回避される。\n"
 ENG_expose_the_belly_of_the_bear: "巨大化する熊の横っ腹"
 ENG_expose_the_belly_of_the_bear_desc: "橋頭保を確保せずしてソ連に挑むのは信じられない暴挙だ。我々は[PER.GetName]及び[AFG.GetName]の両国を通過することを要求し、彼らが最も想定しないところで陸続きの無防備なソビエトの横っ腹を攻撃する。"
 ENG_fascism_party: "イギリス・ファシスト連盟"
 ENG_federal_integration: "連邦の統合"
 ENG_follow_moscow: "モスクワに従う"
 ENG_follow_moscow_desc: "そもそも英国の共産主義は常にクレムリンの指示に従ってきた。そのようにやってきたことが今では論理的だということだけではなく、必要であるということでもある。赤軍と我が海軍の間にマルクスの言葉を深く、幅広く広めていき、誰も我々を止めることはできない。"
 ENG_for_the_good_of_the_revolution: "良き革命のために"
 ENG_for_the_good_of_the_revolution_desc: "全ての国民はより良き国家のために快適性を犠牲にする覚悟がある。英国人は堂々と配給に並ぶことが最終的な勝利をもたらすと確信している。"
 ENG_fortify_the_empire: "帝国の要塞化"
 ENG_foundations_for_an_indian_state: "インド国家の基礎"
 ENG_foundations_for_an_indian_state_desc: "もしそれが独立国家として機能するのであれば、インドの工業化を促進すると同時にインド政府を抜本的に再構築しなければならない。アジア大陸全体を統治するという課題は、我々が発見したように単純なものではなく、成功するためにはインドを準備しなければならない。"
 ENG_frank_whittle: "$frank_whittle$"
 ENG_frederick_bowhill: "$frederick_bowhill$"
 ENG_george_giffard: "ジョージ・ジファード"
 ENG_george_orwell: "ジョージ・オーウェル"
 ENG_george_vi: "ジョージ6世"
 ENG_george_vi_desc: "最初の連邦元首にして最後のインド皇帝は、いまだに偉大な遺産の継承者と見なされている。かつて彼の父がそうだったように、彼は英国国民の結束の象徴なのだ。"
 ENG_germany_rejected_isolate_the_italian_threat: "ドイツは地中海における脅威の隔離を拒否した。\n"
 ENG_gibraltar_for_spanish_support: "スペインからの援助の見返りにジブラルタルを"
 ENG_gibraltar_for_spanish_support_desc: "長い間ジブラルタルは、我が国にとって欠くことのできない地域と考えられてきたが、フランコから支援を得るのと引き換えに、スペインへジブラルタルを返還することは十分釣り合うことである。"
 ENG_global_defense: "国際防衛"
 ENG_global_defense_desc: "イギリスの人々を保護することはそもそも脅威の拡大を防ぐことから始まる。奴らが我々を我々のホームで焼き払い、遠くまでかつ広くに拡散する群衆となる前に、我々は紛争の原因を見つけ出してその場に明らかにしなければならない。"
 ENG_god_save_the_king: "神よ王を護り賜え"
 ENG_god_save_the_king_desc: "何をおいても王と国家に対して尽くす義務がある。抵抗、希望そして我々の臣民及び敵に対する帝国の団結の象徴として、王は内にあっては讃えられ、外にあっては畏れられなければならない。我々はそうしなくてはならないのだ。"
 ENG_guide_the_colonies: "植民地の統治"
 ENG_guide_the_colonies_desc: "長期間の統治の後、完全なる独立への一歩を踏み出すことは簡単ではない。我々の自治領は政府を再編成する際、我々の指導の元、完全なる独立の際にその機能が上手くいくように、援助が必要になるだろう。"
 ENG_guided_by_britain: "イギリス人による指導"
 ENG_guiding_the_colonies: "植民地指導"
 ENG_harold_alexander: "$harold_alexander$"
 ENG_harry_pollitt: "$harry_pollitt$"
 ENG_henry_harwood: "$henry_harwood$"
 ENG_henry_pownall: "ヘンリー・パウノル"
 ENG_henry_wilson: "ヘンリー・ウィルソン"
 ENG_home_defence: "本土防衛"
 ENG_home_defence_desc: "我々がイギリスの民衆を保護することができないのならば、広大な帝国など何の意味も持たない。安全なブリテン島を維持することに力を集中するべきだ。"
 ENG_home_defence_tt: "侵略があった場合の§Y国土防衛§!のディシジョンをアンロック。"
 ENG_home_guard_assistance_in_factories: "工場での国防市民軍の支援"
 ENG_homeland_defense_decision_cat: "本土防衛"
 ENG_homeland_defense_decision_cat_desc: "[ROOT.GetAdjective]の緊縮財政によって、多くの戦争に勝利してきた。そして、二度と負けることがないようにしたいのであれば、祖国を守るために全力を尽くす覚悟をしなければならない。我々は決して降伏しない！"
 ENG_horatio_dundas: "ホレーショ・ダンダス"
 ENG_host_CZE_exile_government: "[CZE.GetAdjective]亡命政府を樹立"
 ENG_hugh_dowding: "$hugh_dowding$"
 ENG_imperial_conference: "帝国会議を開催"
 ENG_imperial_conference_approved_resolution: "承認された帝国会議決議"
 ENG_imperial_conference_decision: "帝国会議"
 ENG_imperial_conference_decision_desc: "帝国会議が招集され、自治領の代議員が再び帰国するまで今後二ヶ月間、議題を押し進めることであろう。我が自治領との外交関係の改善は、自治領が提案に同意する可能性を高めるであろう。"
 ENG_imperial_conference_defense_dominion: "帝国会議における防衛の賛同"
 ENG_imperial_conference_desc: "統治下の全植民地と全自治領の政府首脳が最後に集まったのは1932年のことだった。帝国を強化したいのであれば、今こそあの会議を開く時だ。"
 ENG_imperial_conference_discussion_in_progress: "進行中の帝国会議の議論。\n"
 ENG_imperial_conference_economy_dominion: "帝国会議における経済の賛同"
 ENG_imperial_conference_opinion: "帝国会議"
 ENG_imperial_conference_tt: "§Y帝国会議§!ディシジョンを60日間解禁する。\n§Rディシジョンに使うための政治力を節約することで確保せよ！§!\n"
 ENG_imperial_conscription: "帝国の徴兵"
 ENG_imperial_conscription_desc: "我々は我が帝国が有する豊富な人的資源を長期間無視してきた。今こそ帝国全土において徴兵制度を劇的に改正して、現在の戦いのためにいかに豊富な人的資源を有するか実感すべきときが来た。国家のために全ての国民が義務を果たすだろう！"
 ENG_imperial_federation: "帝国連邦"
 ENG_imperial_federation_desc: "帝国連邦は長い間自治に代わる手段として認識されていた。長い準備期間を経て、ついに我が政府と我が自治領政府を統一し、世界有数の超大国としての地位を取り戻す時が来た。Rule Britannia!（統べよブリタニア！）"
 ENG_imperial_loyalist: "帝国の体制支持者"
 ENG_imperial_trade: "帝国貿易"
 # [same value supplied by vanilla; original preserved] ENG_imperialist_civil_war: "蜂起が助長された。\n"
 ENG_impose_martial_law_on_australia: "オーストラリアでの戒厳令発令"
 ENG_impose_martial_law_on_australia_desc: "オーストラリアは誤った考えを持っていて、保護されなければならない。その間に我々は彼らを再教育し、オーストラリア政府を保護下に置くことができる。"
 ENG_impose_martial_law_on_british_raj: "イギリス領インド帝国での戒厳令発令"
 ENG_impose_martial_law_on_british_raj_desc: "イギリス領インド帝国国民は誤った考えを持っていて、保護されなければならない。その間に我々は彼らを再教育し、イギリス領インド帝国政府を保護下に置くことができる。"
 ENG_impose_martial_law_on_canada: "カナダに戒厳令を課す"
 ENG_impose_martial_law_on_canada_desc: "カナダ国民は誤った考えを持っていて、保護されなければならない。その間に我々は彼らを再教育し、カナダ政府を保護下に置くことができる。"
 ENG_impose_martial_law_on_new_zealand: "ニュージーランドでの戒厳令発令"
 ENG_impose_martial_law_on_new_zealand_desc: "ニュージーランドは誤った考えを持っていて、保護されなければならない。その間に我々は彼らを再教育し、ニュージーランド政府を保護下に置くことができる。"
 ENG_impose_martial_law_on_south_africa: "南アフリカでの戒厳令発令"
 ENG_impose_martial_law_on_south_africa_desc: "南アフリカ国民は誤った考えを持っていて、保護されなければならない。その間に我々は彼らを再教育し、南アフリカ政府を保護下に置くことができる。"
 ENG_impose_martial_law_tt: "AIは180日間解放されない。"
 ENG_indian_autonomy: "インドの自治"
 ENG_indian_autonomy_desc: "完全な独立について合意せず、他の自治領がすでに享受しているように、彼らに広範囲にわたる自治を与えることによってインドの独立運動を弱めることができる可能性がある。"
 ENG_indian_autonomy_tt: "§R自治権が約束されない、あるいはハリファックス卿が国の指導者を務めている場合、[RAJ.GetNameDef]は、帝国連邦の提案を一切受け入れないだろう。§!"
 ENG_install_american_monarchy: "アメリカ君主制を樹立"
 ENG_isolate_the_mediterranean_threat: "地中海の脅威を孤立化"
 ENG_isolate_the_mediterranean_threat_desc: "[ITA.GetAdjective]海軍は、地中海への我々の輸送を脅かしている。我々は、脅威を封じ込めるために彼らを外交的に孤立させる運動を始めなければならない。"
 ENG_issue_gasmasks: "ガスマスク配布"
 ENG_issue_gasmasks_desc: "世界は日々その危険さを増している。いかなる毒ガス攻撃からも民間人を保護しなければならない。イギリス人は「ほっと一息」するべきだ。"
 ENG_jackie_smyth: "ジャッキー・スミス"
 ENG_james_chadwick: "$james_chadwick$"
 ENG_james_fownes_somerville: "ジェームズ・フォウンズ・サマヴィル"
 ENG_james_somerville: "$james_somerville$"
 ENG_jfc_fuller: "J・F・C・フラー"
 ENG_jock_campbell: "ジョック・キャンベル"
 ENG_john_beckett: "$john_beckett$"
 ENG_john_cunningham: "ジョン・カニンガム"
 ENG_john_tovey: "ジョン・トーヴィー"
 ENG_john_vereker: "$john_vereker$"
 ENG_joint_air_training_scheme: "共同航空訓練計画"
 ENG_joint_air_training_scheme_desc: "イギリス政府は連邦加盟国の航空機搭乗員のために、連邦全土において訓練計画を実行した。これにより、かなりの利益を得ることができるだろう。"
 ENG_kenneth_anderson: "$kenneth_anderson$"
 ENG_kickstart_the_war_industry: "軍需産業の促進"
 ENG_kickstart_the_war_industry_desc: "期限は厳守しなければならない、我々に軍需産業の自然な成長を待つ時間はない。戦争に備えるのであれば、工場を迅速に建設するためにさらに大きな投資をしなければならない。"
 ENG_king_edward: "エドワード8世"
 ENG_king_edward_fascism: "エドワード8世"
 ENG_leslie_hore_belisha: "レズリー・ホア＝ベリシャ"
 ENG_liberate_the_home_of_marx: "マルクスの故郷を解放"
 ENG_liberate_the_home_of_marx_desc: "カール・マルクス生誕の地にファシズムが蔓延っていることは彼の名声を汚すだけでなく、社会主義への永遠の屈辱である。ドイツの地からこの邪悪な勢力を駆逐するときが来た。"
 ENG_louis_mountbatten: "$louis_mountbatten$"
 ENG_maintaining_imperial_integrity: "完全なる帝国を維持"
 ENG_maintaining_imperial_integrity_desc: "我々の帝国の防衛は、制海権と自治領の忠誠心から始まる。我々の海軍優勢が脅かされないように他国の海軍戦力に警告しなければならない。そして同時に、我々は世界中で強さを発揮するために、我々の臣民をより奮闘させなければならない。"
 ENG_maintaining_the_balance_of_power: "勢力均衡の維持"
 ENG_maintaining_the_balance_of_power_bad: "勢力均衡の維持"
 ENG_maintaining_the_balance_of_power_desc: "帝国の強さは、ヨーロッパの軟弱さと停滞により成立する。我々が世界的な問題に集中することができるようになっているならば、ヨーロッパが我々に目を向ける暇がないほど、それぞれの情勢で手をつけられなくさせておかなければならない。我々はヨーロッパの情勢を気にすることなく、我々が望んでいるこの絶妙な勢力均衡を脅かす拡張主義体制に対して行動を続けるだろう。"
 ENG_maintaining_the_balance_of_power_good: "勢力均衡の維持"
 ENG_mandatory_union_days: "義務的労働組合日数"
 ENG_march_on_downing_street: "ダウニング街での行進"
 ENG_march_on_downing_street_desc: "ダウニング街10番地での最後の大行進は、政府に国家の未来についての国民投票を開催させることとなるだろう。彼らは国民の意志に逆らうことはできない。"
 ENG_march_timer_flag: "今まさに行進が行われているのだ。"
 ENG_mary_sophia_allen: "メアリー・ソフィア・アレン"
 ENG_max_horton: "$max_horton$"
 ENG_maxwell_aitken: "マックス・エイトケン"
 ENG_merton_beckwithsmith: "マートン・ベックウィズ＝スミス"
 ENG_mi6_ns: "MI6"
 ENG_miles_dempsey: "マイルズ・デンプシー"
 ENG_military_training_act: "軍事訓練法"
 ENG_military_training_act_desc: "先の大戦は、人々の心にもう戦う必要はないという印象を残していった。世界情勢の緊迫に伴い、全ての若い男性が基礎的軍事訓練を受けるようにせねばならない。"
 ENG_mot_focus_tooltip: "自動車化歩兵師団を配備することができる。"
 ENG_motion_of_no_confidence: "内閣不信任決議"
 ENG_motion_of_no_confidence_desc: "現在の政府は、迫り来る世界の危機を打開する試みに失敗した。これ以上の試みは、今や己の弱さの表れに過ぎない。我々は来たる嵐を乗り切ることができるよう、さらに強い指導者を必要としている。"
 ENG_motorized_focus: "陸軍の自動車化"
 ENG_motorized_focus_desc: "近年、陸軍は歩兵の自動車化を試みている。十分な自動車化が成されているとは言い難いが、陸軍大臣の言葉があれば間も無く可能となるだろう。"
 ENG_move_to_secure_the_dominions: "自治領確保の動き"
 ENG_move_to_secure_the_dominions_desc: "各自治領は我々のイデオロギーの変化に不信の念を抱いている。彼らは言い聞かせてもウェストミンスターとの関係を再考することはないだろう。外交関係に過度の緊張が走る前に、迅速な行動により政権交代を強いることができるかもしれない。"
 ENG_move_to_secure_the_dominions_tt: "§Y自治領確保の動き§!ディシジョンが可能。\n"
 ENG_neil_ritchie: "ネイル・リッチー"
 ENG_neutrality_party: "ウィンザー家"
 ENG_neutrality_party_kings_party: "王党"
 ENG_neutrality_party_kings_party_long: "王党"
 ENG_neutrality_party_long: "ウィンザー家"
 ENG_neutrality_party_queens_party: "女王党"
 ENG_neutrality_party_queens_party_long: "女王党"
 ENG_nevile_henderson: "ネヴィル・ヘンダーソン"
 ENG_neville_chamberlain: "ネヴィル・チェンバレン"
 ENG_no_further_appeasement: "宥和政策はもう必要ない"
 ENG_no_further_appeasement_desc: "失敗した宥和政策を続けることは馬鹿げている。敵が要求を撤回せず、要求がさらに肥大化することは明らかである。さらに多くの優位性を与えてしまう前に、今こそ奴らを止めなければならない。"
 ENG_no_further_appeasement_tt: "ルールを設定: £trigger_yes£同じイデオロギーの国家に対し戦争目標の正当化・宣戦布告ができる。\nルールを設定: £trigger_yes£国家を傀儡化できる。\n"
 ENG_non_interference_treaty: "非干渉条約"
 ENG_noninterference_treaty_with_germany: "ドイツとの不干渉条約"
 ENG_noninterference_treaty_with_germany_desc: "我が帝国の野心はヨーロッパの安定性の上に拠っている。おそらくこれは継続的な平和関係と大英帝国に関する問題に干渉しないという[GER.GetNameDef]の約束の見返りとして、彼に対してヨーロッパにおける白紙委任を与えることにより容易に達成されることだろう。"
 ENG_norwegian_intervention: "ノルウェーへの介入"
 ENG_norwegian_intervention_desc: "ノルウェー内に反民主主義的運動が根付きつつある。例え武力行使が必要となる事態に至ろうとも、彼らの政治が我々の利害に添うよう留め置くべきだろう。"
 ENG_oliver_leese: "オリヴァー・リース"
 ENG_organize_the_blackshirts: "黒シャツ隊を組織"
 ENG_organize_the_blackshirts_desc: "イギリス・ファシスト連合の成功は、大衆のイメージにかかっている。我々は軍事的に洗練された行進を全国で開催することにより、我らが組織の団結の精神と個々人の力を見せつけることができる。反対派を脅して活動できないようにしている間に、我々はより多くの支持者を獲得する。最終的な目標は指導者の交代を要求してダウニング街を行進することだ。"
 ENG_organize_the_blackshirts_map_category_name: "黒シャツ隊をどこで行進させるか選択する。"
 ENG_organize_the_blackshirts_tt: "§Y黒シャツ隊の組織§!ディシジョンを解禁する。\n"
 ENG_oswald_mosley: "オズワルド・モズレー"
 ENG_parachute_regiments: "空挺部隊訓練基地"
 ENG_parachute_regiments_desc: "敵領土における初期の空挺作戦で成功を収めた今、未来がパラシュート連隊にあることは明白だ。専用の訓練施設と装備があれば、この新技術を全体の戦略に取り入れられるだろう。"
 ENG_philip_kerr: "フィリップ・カー"
 ENG_pre_empt_spanish_alignment: "スペインとの同盟を先取り"
 ENG_pre_empt_spanish_alignment_desc: "スペインが我々よりも先にドイツとの同盟を組めば以後あらゆる攻撃的な行動について後手に回ることを余儀なくされるリスクが現れるだろう。その事態が起こることをただ見ているわけにはいかない。我々は[GER.GetName]に先んじて潜在的な脅威に対する適切な備えを進めていくべきだ。"
 ENG_pre_empt_the_ideological_threat: "イデオロギーの脅威を阻止"
 ENG_pre_empt_the_ideological_threat_desc: "帝国は様々な考え方の人々により成り立っている。我々は第5列の者たちがクレムリンからの指令により動いているのを把握しており、この諸悪の根源を叩き潰すことにより彼らの声を黙らせることができるかもしれない。"
 ENG_pre_empt_the_strategic_threat: "戦略的脅威の回避"
 ENG_pre_empt_the_strategic_threat_desc: "帝国は、我が国の豊富な資源を欲する国外からの脅威に取り囲まれている。我々は誰がどのような理由なのかを知っているため、我々が不幸にも弱体化して彼らに急襲される前に戦いを挑むことに対して妨げるものは何もない。"
 ENG_prepare_for_the_inevitable: "必然への備え"
 ENG_prepare_for_the_inevitable_desc: "我が国が再び世界規模の紛争に巻き込まれる事はほぼ確実であると見られる。再軍備を加速させるために産業支出を拡張せねばならない。"
 ENG_preparing_the_second_front: "第二戦線の準備"
 ENG_preparing_the_second_front_desc: "戦争の火蓋が落とされた時、我が国の盟邦であるソビエトに第二戦線の戦端を開いてもらえば我々の助けとなるだろう。そのための準備を今から始めねばならない。"
 ENG_prevent_a_continental_hegemony: "大陸覇権の阻止"
 ENG_prevent_a_continental_hegemony_desc: "[GER.GetNameDef]がヨーロッパ大陸全土に対し野心を抱いているのは明らかだ。これを見過ごすことはあってはならない。彼らが手の施しようのない挑戦を引き起こす前に我らが同盟国とともにドイツと対決しなくてはならない。"
 ENG_promote_the_blitz_spirit: "電撃戦の精神の昇格"
 ENG_propaganda_campaigns_in_australia: "オーストラリアでの宣伝運動"
 ENG_propaganda_campaigns_in_australia_desc: "我々は、オーストラリアの人々に彼らの政府の愚かさと、イギリスの指導の必要性を教育するために大規模なプロパガンダキャンペーンを立ち上げる。"
 ENG_propaganda_campaigns_in_british_raj: "イギリス領インド帝国での宣伝運動"
 ENG_propaganda_campaigns_in_british_raj_desc: "我々は、イギリス領インド帝国の人々に彼らの政府の愚かさと、イギリスの指導の必要性を教育するために大規模なプロパガンダキャンペーンを立ち上げる。"
 ENG_propaganda_campaigns_in_canada: "カナダでの宣伝運動"
 ENG_propaganda_campaigns_in_canada_desc: "我々は、カナダの人々に彼らの政府の愚かさと、イギリスの指導の必要性を教育するために大規模なプロパガンダキャンペーンを立ち上げる。"
 ENG_propaganda_campaigns_in_new_zealand: "ニュージーランドでの宣伝運動"
 ENG_propaganda_campaigns_in_new_zealand_desc: "我々は、ニュージーランドの人々に彼らの政府の愚かさと、イギリスの指導の必要性を教育するために大規模なプロパガンダキャンペーンを立ち上げる。"
 ENG_propaganda_campaigns_in_south_africa: "南アフリカでの宣伝運動"
 ENG_propaganda_campaigns_in_south_africa_desc: "我々は、南アフリカの人々に彼らの政府の愚かさと、イギリスの指導の必要性を教育するために大規模なプロパガンダキャンペーンを立ち上げる。"
