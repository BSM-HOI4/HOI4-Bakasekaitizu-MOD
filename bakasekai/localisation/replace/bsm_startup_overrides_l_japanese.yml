 raid_type_thermonuclear_strike: "核融合爆弾攻撃"
 raid_type_thermonuclear_strike_desc: "戦略爆撃機とその護衛機が指定された標的に向かって飛行し、核融合爆弾を投下する。その後、爆撃機は爆風に巻き込まれないようその地域から脱出を試みる。"
 ruinism: "破滅主義"
 shinto:0 "神道"
 shogunate: "将軍派"
 stability.21.a:0 "放置する"
 stability.21.d:0 "軍事的取り締まりを実施する"
 stability.21.desc.a:0 "各地で召集令状を無視する者が続出している。民衆の間に厭戦気分が広がり、志願兵の数は激減した。このままでは前線の兵力維持すら危うい。"
 stability.21.desc.b:0 "徴兵忌避はもはや個人の問題ではない。地域ぐるみで召集を拒否する動きが広がり、一部の地方では徴兵担当官が追い返される事態まで発生している。政府の権威は地に落ちようとしている。"
 stability.21.desc.c:0 "国家は徴兵制度の崩壊に直面している。兵士となるべき若者たちは街頭で反戦デモに参加し、地方の指導者たちは公然と中央政府の動員令に背いている。もはや事態は深刻さを極めている。"
 stability.21.e:0 "生活条件の改善を約束する"
 stability.21.f:0 "軍による強制鎮圧を命令する"
 stability.21.g:0 "生活条件の大幅改善を約束する"
 stability.21.h:0 "軍事力による全面的な弾圧を命じる"
 stability.21.i:0 "抜本的な生活改善策を提示する"
 stability.21.t:0 "徴兵忌避の蔓延"
 stability.22.a:0 "成す術がない"
 stability.22.b:0 "治安部隊を投入して鎮圧する"
 stability.22.c:0 "労働者代表と交渉する"
 stability.22.d:0 "軍を動員して鎮圧する"
 stability.22.desc.a:0 "主要工場地帯で労働者たちがストライキに突入した。賃金の引き上げと労働条件の改善を要求し、生産ラインが次々と停止している。戦時経済に深刻な打撃が懸念される。"
 stability.22.desc.b:0 "ストライキは波状のように全国に広がりつつある。交通・運輸部門にも波及し、物資の輸送に遅延が生じ始めた。労働組合の指導者たちは政府との対話を拒否し、態度を硬化させている。"
 stability.22.desc.c:0 "全産業が麻痺の危機に瀕している。労働者の蜂起は暴動の様相を呈し、工場の設備が破壊される事件も発生している。国の経済基盤そのものが揺らぎ始めた。"
 stability.22.e:0 "労働側の要求を受け入れて交渉する"
 stability.22.f:0 "戒厳令を宣言して鎮圧する"
 stability.22.g:0 "大幅な譲歩を行い交渉をまとめる"
 stability.22.t:0 "労働者ストライキ"
 stability.23.a:0 "見過ごすしかない"
 stability.23.b:0 "忠実な部隊を送り鎮圧する"
 stability.23.c:0 "反乱部隊の代表と交渉する"
 stability.23.d:0 "親衛隊を動員して鎮圧にあたる"
 stability.23.desc.a:0 "前線の部隊で命令拒否が報告された。将校に対する不信感が広がり、一部の兵士たちは塹壕を放棄し始めている。士気の崩壊が危惧される。"
 stability.23.desc.b:0 "反乱の火種は複数の部隊に飛び火した。将校が部下に射殺される事件も報告されており、指揮系統の維持が困難になりつつある。前線の部隊は崩壊の縁に立たされている。"
 stability.23.desc.c:0 "軍全体が制御を失いつつある。部隊単位での集団脱走が相次ぎ、反乱兵たちは独自の軍事委員会を設立し始めている。国家の武力そのものが内側から崩壊しようとしている。"
 stability.23.e:0 "反乱兵の要求を聞き入れ交渉する"
 stability.23.f:0 "軍事力をもって完全に鎮圧する"
 stability.23.g:0 "反乱部隊に大幅な譲歩を提示する"
 stability.23.t:0 "部隊の反乱"
 stability.31.a:0 "良き知らせだ"
 stability.31.desc:0 "軍の果断な行動により、徴兵忌避の首謀者が逮捕された。法の執行が徹底されたことで、召集令状への服従率は回復に向かっている。秩序は徐々に戻りつつある。"
 stability.31.t:0 "徴兵忌避の取り締まり――成功"
 stability.32.a:0 "事態は悪化の一途だ"
 stability.32.desc:0 "軍の取り締まりはかえって民衆の反発を招いた。警察と市民の衝突が各地で発生し、国家の威信はさらに傷ついた。事態は以前よりも悪化している。"
 stability.32.t:0 "徴兵忌避の取り締まり――失敗"
 stability.33.a:0 "国家の命運がかかっている"
 stability.33.desc:0 "軍の強制鎮圧は民衆の怒りに火を注ぐ結果となった。各地で反政府勢力が蜂起し、国家は内戦の渦に巻き込まれた。もはや後戻りはできない。"
 stability.33.t:0 "徴兵忌避の取り締まり――内戦勃発"
 stability.34.a:0 "国民の信頼を取り戻した"
 stability.34.desc:0 "政府の生活改善策は民衆の心を動かした。兵役免除者の待遇改善と家族への支援が発表され、志願者の数は徐々に回復している。国民の信頼は少しずつ戻りつつある。"
 stability.34.t:0 "生活条件の改善――徴兵忌回避ける"
 stability.35.a:0 "秩序は回復した"
 stability.35.desc:0 "強硬策が功を奏した。第二波の徴兵忌避運動は鎮圧され、首謀者たちは軍事法廷にかけられた。動員体制は再び機能し始めている。"
 stability.35.t:0 "徴兵忌避の軍事鎮圧――第二波成功"
 stability.36.a:0 "事態は手に負えなくなっている"
 stability.36.desc:0 "第二波の鎮圧は惨憺たる結果に終わった。軍の行動は民衆のさらなる怒りを買い、徴兵忌避はむしろ勢いを増している。国の安定は根底から揺らいでいる。"
 stability.36.t:0 "徴兵忌避の軍事鎮圧――第二波失敗"
 stability.37.a:0 "国民は納得したようだ"
 stability.37.desc:0 "政府の大幅な譲歩は民衆に受け入れられた。福祉予算の拡大と兵役制度の見直しが発表され、社会の緊張は和らぎつつある。志願者の数も順調に回復している。"
 stability.37.t:0 "生活条件の大幅改善――徴兵忌回避ける"
 stability.38.a:0 "もはや後戻りはできない"
 stability.38.desc:0 "軍事力による全面的な弾圧が成功を収めた。反戦運動の指導者たちは一斉に逮捕され、徴兵制度は再び機能し始めた。しかし、その代償は決して小さくない。"
 stability.38.t:0 "徴兵忌避の全面的弾圧――成功"
 stability.39.a:0 "破滅的な結果だ"
 stability.39.desc:0 "全面的な弾圧は国家に深刻な亀裂をもたらした。民衆の怒りは頂点に達し、政府への信頼は完全に失墜した。国家の安定は危機的状況にある。"
 stability.39.t:0 "徴兵忌避の全面的弾圧――失敗"
 stability.40.a:0 "ようやく落ち着きを取り戻した"
 stability.40.desc:0 "政府の抜本的な改革案は民衆の広範な支持を得た。生活水準の向上と公正な兵役制度の導入が約束され、社会の動揺は静まりつつある。長期的な安定への道が開けた。"
 stability.40.t:0 "抜本的な生活改善策――徴兵忌回避ける"
 strikes_1:0 "ストライキの対処"
 strikes_event.1.a:0 "生産を再開せよ"
 strikes_event.1.desc:0 "治安部隊の迅速な投入により、ストライキは鎮圧された。労働組合の指導者たちは逮捕され、工場の操業は再開された。秩序は力をもって回復された。"
 strikes_event.1.t:0 "ストライキ鎮圧――成功"
 strikes_event.2.a:0 "事態は悪化している"
 strikes_event.2.desc:0 "治安部隊の投入は火に油を注ぐ結果となった。労働者たちはさらに結束を固め、ストライキはより広範な範囲に拡大した。政府の対応は裏目に出た。"
 strikes_event.2.t:0 "ストライキ鎮圧――失敗"
 strikes_event.3.a:0 "合意に達した"
 strikes_event.3.desc:0 "労働者代表との交渉は妥結した。賃金の引き上げと労働条件の改善が合意に達し、労働者たちは職場に戻り始めた。生産は間もなく正常化する見通しだ。"
 strikes_event.3.t:0 "ストライキ交渉――成功"
 strikes_event.4.a:0 "秩序は戻った"
 strikes_event.4.desc:0 "軍の動員により、拡大したストライキは制圧された。主要インフラの機能は回復し、労働者の抵抗は鎮圧された。国家の経済活動は徐々に正常化しつつある。"
 strikes_event.4.t:0 "ストライキ鎮圧――第二波成功"
 strikes_event.5.a:0 "国家は危機的状況にある"
 strikes_event.5.desc:0 "軍の投入は労働者の決起を招いた。街頭にはバリケードが築かれ、デモ隊と軍の衝突が激化している。事態の収拾は極めて困難な状況にある。"
 strikes_event.5.t:0 "ストライキ鎮圧――第二波失敗"
 strikes_event.6.a:0 "労使の合意が成立した"
 strikes_event.6.desc:0 "粘り強い交渉の末、労働者側との大幅な合意に達した。労働者の不満に真摯に向き合う姿勢が評価され、職場への復帰が進んでいる。社会の安定は回復に向かっている。"
 strikes_event.6.t:0 "ストライキ交渉――第二波成功"
 strikes_event.7.a:0 "秩序は強制的に回復された"
 strikes_event.7.desc:0 "戒厳令下の徹底した鎮圧作戦が成功を収めた。ストライキの中心人物たちは拘束され、工場・インフラは軍の管理下に置かれた。国家機能は辛うじて維持されている。"
 strikes_event.7.t:0 "ストライキ鎮圧――第三波成功"
 strikes_event.8.a:0 "もはや手遅れかもしれない"
 strikes_event.8.desc:0 "あらゆる手段が尽きたが、ストライキは収まらない。むしろ鎮圧の試みは民衆の怒りを増幅させただけだった。国の経済は崩壊の淵に立たされている。"
 strikes_event.8.t:0 "ストライキ鎮圧――第三波失敗"
 strikes_event.9.a:0 "国民の団結を取り戻した"
 strikes_event.9.desc:0 "政府の大幅な譲歩により、ついに全面合意に達した。労働者の要求が広範に受け入れられ、社会の動揺は収束に向かっている。国の団結は回復された。"
 strikes_event.9.t:0 "ストライキ交渉――第三波成功"
 strikes_mission:0 "ストライキの監視"
