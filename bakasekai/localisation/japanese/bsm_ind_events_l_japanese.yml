l_japanese:
 # ========== bsm_ind.1 - 帝国の岐路 ==========
 bsm_ind.1.t:0 "帝国の岐路"
 bsm_ind.1.d:0 "インドは長きにわたり大英帝国の王冠に輝く宝石であった。しかし今、世界は激動の時代を迎え、インドの運命も重大な岐路に立たされている。自治への渇望は民衆の心に深く根付き、政治指導者たちは未来への道筋を模索している。我々は自由への道を歩むべきか、それとも時が熟すのを待つべきか。"
 bsm_ind.1.a:0 "自由への道を歩む"
 bsm_ind.1.b:0 "時を待つ"

 # ========== bsm_ind.2 - 自治要求をGBRへ ==========
 bsm_ind.2.t:0 "自治の要求"
 bsm_ind.2.d:0 "インド国民会議派をはじめとする政治勢力は、イギリス本国に対して明確な自治権の譲渡を求める声を上げている。穏健派は自治領としての地位を主張し、急進派は完全なる独立を要求している。いかなる道を選ぶべきか。"
 bsm_ind.2.a:0 "自治領の地位を要求する"
 bsm_ind.2.b:0 "完全独立を要求する"

 # ========== bsm_ind.2b - GBR通知（自治領要求）==========
 bsm_ind.2b.t:0 "インドからの自治領地位要求"
 bsm_ind.2b.d:0 "インドの指導者たちがロンドンに代表団を派遣し、自治領としての地位向上を正式に要求してきた。この要求に応じることは帝国の結束を保ちつつインドの協力を維持する道であるが、他の植民地への波及効果も懸念される。"
 bsm_ind.2b.a:0 "要求を受諾する"
 bsm_ind.2b.b:0 "要求を拒否する"

 # ========== bsm_ind.2c - GBR通知（完全独立要求）==========
 bsm_ind.2c.t:0 "インドからの完全独立要求"
 bsm_ind.2c.d:0 "インドの民族主義者が完全な独立を宣言し、イギリスの植民地支配の即時終結を要求している。これは帝国にとって前例のない危機である。独立を認めることは帝国の威信を傷つけるが、武力による鎮圧は長期的な対立を招く恐れがある。"
 bsm_ind.2c.a:0 "独立を認める"
 bsm_ind.2c.b:0 "拒否する"

 # ========== bsm_ind.3 - クリップス使節団 ==========
 bsm_ind.3.t:0 "クリップス使節団"
 bsm_ind.3.d:0 "イギリス政府はスタッフォード・クリップス卿をインドに派遣し、戦後の自治権付与を条件にインドの戦争協力を求めている。国民会議派はこの提案を検討しているが、多くの指導者は即時の譲歩を主張している。使節団の条件を受諾すべきか。"
 bsm_ind.3.a:0 "使節団の条件を受諾する"
 bsm_ind.3.b:0 "使節団の条件を拒否する"

 # ========== bsm_ind.4 - 枢軸国の支援申し出 ==========
 bsm_ind.4.t:0 "枢軸国からの支援の申し出"
 bsm_ind.4.d:0 "欧州の枢軸国がインドの独立運動に対する支援を申し出てきた。彼らの目的は明らかにイギリスの植民地体制を崩壊させることにあるが、この支援はインドの独立を加速させる可能性もある。しかし、ファシズムとの手を結ぶことは道義的な問題も孕んでいる。"
 bsm_ind.4.a:0 "枢軸国の支援を受け入れる"
 bsm_ind.4.b:0 "独自の道を歩む"

 # ========== bsm_ind.4b - GER通知 ==========
 bsm_ind.4b.t:0 "インドからの支援要請"
 bsm_ind.4b.d:0 "インドの独立運動指導者が我が国に対し、イギリス植民地支配からの解放に向けた支援を求めてきた。インドは戦略的に重要な地域であり、イギリスの後方を攪乱する絶好の機会となる。"
 bsm_ind.4b.a:0 "インドを支援する"
 bsm_ind.4b.b:0 "今は支援できない"

 # ========== bsm_ind.5 - ソ連の支援申し出 ==========
 bsm_ind.5.t:0 "ソ連からの支援の申し出"
 bsm_ind.5.d:0 "ソ連がインドの反植民地運動に対する支援を提案してきた。共産主義のイデオロギーは一部のインド知識人に影響を与えているが、大多数は非同盟と独立を志向している。ソ連の支援を受け入れることは、新しい世界秩序への入り口となるかもしれない。"
 bsm_ind.5.a:0 "ソ連の支援を受け入れる"
 bsm_ind.5.b:0 "中立を維持する"

 # ========== bsm_ind.5b - SOV通知 ==========
 bsm_ind.5b.t:0 "インド革命への支援要請"
 bsm_ind.5b.d:0 "インドの進歩的な勢力が、イギリス帝国主義からの解放に向けて我が国の支援を求めてきた。アジアにおける革命的変化は世界のプロレタリアートの利益に合致する。この歴史的機会を活かすべきか。"
 bsm_ind.5b.a:0 "インド革命を支援する"
 bsm_ind.5b.b:0 "今は支援できない"

 # ========== bsm_ind.6 - 自治領新憲法 ==========
 bsm_ind.6.t:0 "新憲法の発布"
 bsm_ind.6.d:0 "イギリス政府との協議の結果、インド自治領に新たな憲法が授与されることとなった。この憲法は自治領としての権限を拡大し、インド人の政治参加を大幅に認めるものである。帝国奉仕の枠組みの中で、我々はより大きな自治を手に入れようとしている。"
 bsm_ind.6.a:0 "憲法に署名する"

 # ========== bsm_ind.10 - 独立宣言（国民会議派）==========
 bsm_ind.10.t:0 "独立宣言"
 bsm_ind.10.d:0 "長き闘争の末、ついにその時が来た。インド国民会議派は全インドに向けて独立を宣言する。幾世代もの犠牲と献身の果てに、インドは自由な共和国として新たな一歩を踏み出す。世界は今日、歴史の転換点を目撃する。"
 bsm_ind.10.a:0 "インド共和国の誕生"

 # ========== bsm_ind.10b - ニュース：インド独立 ==========
 bsm_ind.10b.t:0 "インドが独立を宣言！"
 bsm_ind.10b.d:0 "インドが大英帝国からの完全独立を宣言した。この歴史的宣言は世界中に衝撃を与え、植民地体制の終焉を告げるものとして広く認識されている。アジア最大の国家が新たな時代に踏み出した。"
 bsm_ind.10b.a:0 "新たな時代の幕開けだ"
 bsm_ind.10b.b:0 "注目すべき出来事だ"

 # ========== bsm_ind.11 - アザド・ヒンド独立宣言 ==========
 bsm_ind.11.t:0 "アザド・ヒンドの独立宣言"
 bsm_ind.11.d:0 "スバース・チャンドラ・ボースの指導のもと、インド国民軍の精神を受け継ぐ勢力が自由インド仮政府の樹立を宣言した。彼らは武力による独立達成を主張し、国内外のインド人に決起を呼びかけている。この宣言はインド亜大陸の政治地図を一変させる可能性を秘めている。"
 bsm_ind.11.a:0 "共和国の樹立を宣言する"
 bsm_ind.11.b:0 "国際的な承認を求める"

 # ========== bsm_ind.12 - 独立の熱狂と混乱 ==========
 bsm_ind.12.t:0 "独立の熱狂と混乱"
 bsm_ind.12.d:0 "独立の喜びは大衆を熱狂させたが、それと同時に深刻な社会的不安定が生じている。宗教的対立の激化、大量の人口移動、行政機構の混乱が独立直後の国家を圧迫している。指導者たちは危機管理と民意の尊重の間で難しい選択を迫られている。"
 bsm_ind.12.a:0 "非常事態を宣言する"
 bsm_ind.12.b:0 "民意を信頼する"

 # ========== bsm_ind.15 - 分割問題 ==========
 bsm_ind.15.t:0 "インドの分割"
 bsm_ind.15.d:0 "ムスリム連盟の要求は日に日に強まり、統一インドの理想は現実の前に揺らいでいる。宗教的境界線に基づく国家分割は避けられない選択として迫ってくる。しかし、この決断は何百万人もの運命を左右し、亜大陸の未来を決定づけるものである。分割を受け入れるか、それとも統一を守り抜くか。"
 bsm_ind.15.a:0 "分割を受け入れる準備をする"
 bsm_ind.15.b:0 "統一インドを守る"

 # ========== bsm_ind.16 - 藩王国の統合 ==========
 bsm_ind.16.t:0 "藩王国の統合"
 bsm_ind.16.d:0 "独立に伴い、かつての藩王国の君主たちが自らの地位と領地について新政府との交渉を求めている。数百に上る藩王国を新たな国家体制に統合することは、統一国家建設における最大の課題の一つである。寛大な条件で円滑な統合を図るか、強硬な姿勢で即時の接収を迫るか。"
 bsm_ind.16.a:0 "寛大な条件で統合する"
 bsm_ind.16.b:0 "即時統合を要求する"

 # ========== bsm_ind.17 - 州の再編成 ==========
 bsm_ind.17.t:0 "州の再編成"
 bsm_ind.17.d:0 "藩王国の統合が進む中、国家の行政区分を見直すべき時が来た。言語別に州を再編することは民衆の要望に応えるものであるが、行政の抜本的改革には時間と労力を要する。現状の区分を維持しつつ段階的な改革を進める道もある。"
 bsm_ind.17.a:0 "言語別に州を再編する"
 bsm_ind.17.b:0 "現状の行政区分を維持する"

 # ========== bsm_ind.20 - パキスタンの誕生 ==========
 bsm_ind.20.t:0 "パキスタンの誕生"
 bsm_ind.20.d:0 "ムスリム連盟の長き闘争の末、ついにパキスタンが建国される。インド亜大陸は二つの国家に分割され、何百万人もの人々が新たな国境を越えて移動を始めている。これは歴史的な瞬間であると同時に、計り知れない人的・社会的代償を伴う決断である。平和的な移行を遂げることは両国の最大の課題となる。"
 bsm_ind.20.a:0 "分割を受け入れ、平和的な移行を目指す"

 # ========== bsm_ind.20b - ニュース：パキスタン独立 ==========
 bsm_ind.20b.t:0 "パキスタンが独立を宣言！"
 bsm_ind.20b.d:0 "インド亜大陸の分割により、パキスタンが新たな独立国家として誕生した。この分割は大英帝国の植民地支配の終焉を決定的なものとし、南アジアの政治地図を根本から書き換えた。しかし、この決断は大規模な人口移動と宗教間の対立を引き起こしている。"
 bsm_ind.20b.a:0 "新しい隣国との関係を築かねばならない"
 bsm_ind.20b.b:0 "パキスタン万歳！"
 bsm_ind.20b.c:0 "世界は注目している"

 # ========== bsm_ind.21 - カシミール問題 ==========
 bsm_ind.21.t:0 "カシミール問題"
 bsm_ind.21.d:0 "ジャンムー・カシミール地方の帰属問題が両国間の最大の火種となっている。ヒンドゥーのマハラジャが支配するこのムスリム多数派の藩王国は、インドとパキスタンの双方が領有を主張している。この問題の解決は両国の将来を左右するのみならず、南アジア全体の平和と安定に関わる。"
 bsm_ind.21.a:0 "カシミールの帰属を主張する"
 bsm_ind.21.b:0 "パキスタンと交渉する"

 # ========== bsm_ind.25 - パキスタンへのSAEC招待 ==========
 bsm_ind.25.t:0 "南アジア経済共同体への招待"
 bsm_ind.25.d:0 "インドが主導する南アジア経済共同体（SAEC）への加盟が提案された。この経済協力枠組みは地域の安定と繁栄に寄与する可能性があるが、同時にインドの影響力拡大を受け入れることでもある。我が国はこの招待に応じるべきか。"
 bsm_ind.25.a:0 "SAECへの加盟を受け入れる"
 bsm_ind.25.b:0 "断る"

 # ========== bsm_ind.26 - 東南アジアへの拡大招待 ==========
 bsm_ind.26.t:0 "南アジア経済共同体への参加招待"
 bsm_ind.26.d:0 "インドから南アジア経済共同体（SAEC）への参加が招かれた。この枠組みは地域の経済協力と相互発展を目的としており、加盟国には貿易利便性と技術協力の恩恵が約束されている。しかし、域外の国家にとっては新たな外交関係の構築を意味する。"
 bsm_ind.26.a:0 "SAECへ参加する"
 bsm_ind.26.b:0 "断る"

 # ========== bsm_ind.30 - 非同盟運動宣言 ==========
 bsm_ind.30.t:0 "非同盟運動の宣言"
 bsm_ind.30.d:0 "インドの主導により、アジア・アフリカの新興独立国が結集して非同盟運動が宣言された。冷戦の両陣営に対抗する第三の道として、これらの国々は自らの主権と独立した外交路線を守ることを誓い合った。これは世界の政治構図に新たな軸をもたらす歴史的な出来事である。"
 bsm_ind.30.a:0 "非同盟の精神に賛同する"
 bsm_ind.30.b:0 "興味深い動きだ"

 # ========== bsm_ind.31 - ニュース：SAEC設立 ==========
 bsm_ind.31.t:0 "南アジア経済共同体が設立！"
 bsm_ind.31.d:0 "インドの主導のもと、南アジア経済共同体（SAEC）が正式に設立された。この地域経済協力機構は加盟国間の貿易促進、技術協力、共同インフラ開発を目的としており、南アジア地域全体の経済発展を後押しすることが期待されている。"
 bsm_ind.31.a:0 "地域協力の新たな時代だ"
 bsm_ind.31.b:0 "注目すべき動きだ"

 # ========== 決定カテゴリー ==========
 IND_partition_management:0 "分割管理"
 IND_national_reconstruction:0 "国家再建"

