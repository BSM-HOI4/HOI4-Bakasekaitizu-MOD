l_japanese:
 NTS_provisional_constitution:0 "仮称憲法"
 NTS_provisional_constitution_desc:0 "タシュケントに集まった五つの机がいずれも譲らず、正式な国名すら定まらぬまま発布された暫定協定である。公文書には仮の記号が押され、統一通貨や行政機構の機能不全が国家の求心力を日々蝕んでいる。恒久的な国号と統治理念が確定するまで、この宙吊りの体制が連邦の肩に重くのしかかり続ける。"
 NTS_two_seas:0 "二つの海"
 NTS_two_seas_desc:0 "連邦は北のカスピ海と南のアラビア海という、互いに隔絶された二つの海に港を抱えている。内陸の塩湖と外洋の大海では必要な艦艇も運用思想も異なり、限られた海事資源は常に二つに分散されてしまう。それでも広大な沿岸航路は、内陸国家に貴重な通商の息吹をもたらしている。"
 NTS_quetta_airfield:0 "クエッタの預け飛行場"
 NTS_quetta_airfield_desc:0 "砂漠と岩山に囲まれたクエッタの滑走路には、数少ない航空戦力が集結している。しかしこの基地を誰が管轄するのかは明文化されておらず、宮廷の軍部と平原の政治家たちがその所属をめぐって綱引きを続けている。滑走路の整備と哨戒活動は続けられているものの、曖昧な指揮系統が現場の将兵に影を落としている。"
 NTS_counted_cotton:0 "数えられる作物"
 NTS_counted_cotton_desc:0 "オアシスの畑から刈り取られた綿花は、一握りごとに計量され厳密な帳簿へと記録される。モスクワの中央計画が把握しているのはこの純白の繊維の数量であり、畑を埋め尽くす綿は生活必需品の生産を圧迫している。それでも集約された綿花の輸出は、連邦の産業を支える貴重な外貨と工場出力をもたらす。"
 NTS_agreed_placeholder:0 "合意された仮称"
 NTS_agreed_placeholder_desc:0 "草原の詩人たちと思想家たちが言葉を紡ぎ合い、対立する各机を宥める妥協の国名を打ち立てた。名辞そのものは依然として暫定的な響きを残しているものの、文化の尊厳と言葉の力によって人々の連帯が取り戻されつつある。乾燥した官僚文書ではなく詩的真実によって支えられたこの体制は、国家に新たな誇りを吹き込んでいる。"
 NTS_numbered_republic:0 "番号の共和国"
 NTS_numbered_republic_desc:0 "血塗られた粛清を経て古い地名や民族の固有称号は台帳から抹消され、国家は無機質な番号の管区へと解体された。モスクワの厳格な規律のもとで労働者と兵員は規格化され、軍需の増産と徴兵体制が冷徹に敷かれている。かつての自治の面影は失われ、数字だけが支配する巨大な管理国家が誕生した。"
 NTS_court_document:0 "宮廷文書"
 NTS_court_document_desc:0 "カブール宮廷の奥深くで保管されてきた伝統的な儀礼文書が、連邦の新たな国法として布告された。国王の親政と厳格な摂政の威光が中央集権を確たるものとし、王都の命令書が各地の豪族たちを統制する。古き王権の正統性に支えられた軍部と官僚機構は、国家に確固たる規律と決断力をもたらしている。"
 NTS_plains_refusal:0 "平原の拒否"
 NTS_plains_refusal_desc:0 "パンジャーブの地主たちと平原の指導者たちは、頭上に掲げられる大層な連邦の国号を真っ向から拒絶した。彼らにとって何よりも尊いのは肥沃なる大地の自治と伝統的利権であり、中央政府の押し付けがましい統合など論外であった。地方の頑迷な抵抗は国家の調和を乱しているが、平原が抱える莫大な人口は強固な動員基盤を生み出している。"
 NTS_ipi_fire:0 "イピの火"
 NTS_ipi_fire_desc:0 "北ワジリスタンの険しい岩山から、イピのファキールを名乗る指導者が部族民を率いて叛旗を翻した。国境地帯の谷々にはジハードの烽火が燃え広がり、反抗の熱気は民衆の闘志を煽ると同時に各地の平穏を根底から揺るがしている。この荒ぶる炎を力で鎮めるか対話で宥めぬ限り、連邦の背後は常に脅かされ続ける。"
 NTS_bank_milli:0 "ナントカスタン・ミリー銀行"
 NTS_bank_milli_desc:0 "カブールの商人アブドゥル・マジド・ザブリが創設した連邦初の本格的な商業金融機関である。内外の交易資本を巧みに集約し、立ち遅れていた市場経済と基礎的な産業投資を民間の活力で牽引している。信用状と流通網の確立により、広大な内陸領土における物資の取引と建設作業が力強く促される。"
 NTS_turksib:0 "トルクシブ"
 NTS_turksib_desc:0 "シベリアの木材と中央アジアの綿花を結ぶ大動脈として建設された、トルキスタン・シベリア鉄道の運行公社である。過酷なステップと砂漠を克服した線路敷設のノウハウは、各地の交通網とインフラ整備を飛躍的に加速させている。鉄路の延伸とともに物資の移動速度は劇的に向上し、内陸の経済を急速に結びつけている。"
 NTS_nwr_lahore:0 "ラホール北西鉄道工場"
 NTS_nwr_lahore_desc:0 "ラホール近郊のモガルプラに広がる巨大な車両工廠であり、かつて英領インドの幹線鉄道を支えた技術の結晶である。熟練した職工と広大な鋳造施設は、機関車や客車の修理に留まらず重工業設備の製造拠点へと改編されつつある。平原の豊富な労働力を工場へと吸収することで、連邦の工作能力を力強く底上げしている。"
 NTS_embaneft:0 "エンバネフト"
 NTS_embaneft_desc:0 "カスピ海北東岸の乾燥した低地に広がるエンバ油田を統括する国営石油企業である。過酷な環境から汲み上げられる高品質な原油は、精製所へと送られて貴重な航空燃料や潤滑油へと姿を変える。資源開発と化学技術の研究を推し進め、機械化された軍隊に不可欠な血潮を絶え間なく供給する。"
 NTS_attock_oil:0 "アトック石油"
 NTS_attock_oil_desc:0 "パンジャーブ北部のカール油田を基盤とし、古くから小規模な採掘と精製を続けてきた民営石油会社である。産出規模こそエンバの巨大油田に及ばぬものの、平原の工業地帯に近接した貴重な燃料補給源として機能している。身近な油井からの安定した供給は、地方の工場群と輸送網を堅実に支えている。"
 NTS_tashkent_textile:0 "タシュケント織物コンビナート"
 NTS_tashkent_textile_desc:0 "オアシスに集まる莫大な綿花を加工するため、タシュケントに建設された最新鋭の大規模繊維コンビナートである。近代的な紡績機械が一斉に唸りを上げ、原料の山を即座に軍服や民生用の布地へと織り上げていく。軽工業の自給体制を確立したことで消費財の不足が緩和され、工場網の拡張に弾みがついている。"
 NTS_kabul_arsenal:0 "カブール政府工廠"
 NTS_kabul_arsenal_desc:0 "カブール市内に構えられた歴史ある政府直営の兵器工場であり、山岳戦に耐えうる小銃や銃弾の製造を担っている。宮廷の職人たちによる伝統的な鍛造技術と輸入工作機械が融合し、過酷な高山や砂漠でも確実に作動する堅牢な歩兵火器を生み出す。国王の軍勢を支える要として、前線の兵士たちに信頼性の高い装備を届け続けている。"
 NTS_quetta_depot:0 "クエッタ航空基地"
 NTS_quetta_depot_desc:0 "内陸の高原要衝クエッタに整備された航空基地であり、手持ちの旧式機を改修・維持するための主要拠点である。砂嵐と寒暖差に晒される機体を整備し直す現場の工夫は、過酷な風土に適応した航空技術の研究へと直結している。乏しい機材を実戦で役立てるため、技術者たちは日々機体の改良に知恵を絞っている。"
 NTS_karachi_port:0 "カラチ港"
 NTS_karachi_port_desc:0 "インダス川の河口近くに位置するカラチの良港であり、インド洋へ開かれた連邦唯一の本格的な外洋の玄関口である。本格的な造船能力こそ未だ備わっていないが、既存の駆逐艦を改修し泊地を防衛するための護衛艦艇整備を担っている。海原を越えてやってくる国際通商船を守るため、港湾の技術者たちは沿岸警備の強化に尽力している。"
 NTS_guriev_yard:0 "グレフ船渠"
 NTS_guriev_yard_desc:0 "ウラル川の河口グレフに設けられた船渠であり、閉ざされたカスピ海を往来する小型船舶の建造と修理を行っている。エンバ油田から産出される原油を対岸へ運ぶ油送船や、浅瀬を巡視する護衛艇の整備に特化している。内海の特殊な航路事情に合わせた堅実な造船技術が、閉鎖海域における補給線を支えている。"
