l_japanese:
 PRU_cusco_upheaval:0 "クスコ動乱"
 PRU_cusco_upheaval_desc:0 "古都クスコに不穏な空気が満ちる。インカの末裔たちが立ち上がる時だ。"
 PRU_worship_of_inti:0 "インティ崇拝"
 PRU_worship_of_inti_desc:0 "太陽神インティへの信仰を復興させる。神聖なる光が再びアンデスを照らす。"
 PRU_Abolition_social_division:0 "社会身分制の廃止"
 PRU_Abolition_social_division_desc:0 "古き身分制度を打ち壊し、全ての民に平等な機会を。新時代の扉を開け。"
 PRU_opening_parliament:0 "議会の開設"
 PRU_opening_parliament_desc:0 "民の声を聞く場として議会を開設する。対話こそが国を強くする。"
 PRU_social_security:0 "社会保障の整備"
 PRU_social_security_desc:0 "弱き者を守る仕組みを作る。国の強さは最も弱き者の幸福で測られる。"
 PRU_uprising:0 "蜂起"
 PRU_uprising_desc:0 "労働者よ、立ち上がれ！抑圧に耐える時代は終わった。力による変革を。"
 PRU_dawn_democracy:0 "民主主義の夜明け"
 PRU_dawn_democracy_desc:0 "対話と投票による政治を実現する。アンデスに民主主義の光を。"
 PRU_inca_commune:0 "インカ・コミューン"
 PRU_inca_commune_desc:0 "インカの共同体精神と共産主義が融合する。新しき人民の国家が誕生する。"
 PRU_revolutionary_wave:0 "革命の波"
 PRU_revolutionary_wave_desc:0 "革命の波は国境を越える。近隣の民衆にも自由の火を点せ。"
 PRU_liberation_south:0 "南米解放"
 PRU_liberation_south_desc:0 "南米大陸全体を解放へと導く。一つの大陸、一つの革命。"
 PRU_fate_emperor:0 "皇帝の運命"
 PRU_fate_emperor_desc:0 "インカ皇帝の血統は象徴として残すべきか。民の議論が始まる。"
 PRU_people_country:0 "人民共和国"
 PRU_people_country_desc:0 "皇帝なしで、人民自身の手で国を築く。真の民衆国家を目指せ。"
 PRU_inca_federation:0 "インカ連邦"
 PRU_inca_federation_desc:0 "各州の自治を認めつつ、連邦として強さを保つ。多様性の中の統一。"
 PRU_with_emperor:0 "皇帝と共に"
 PRU_with_emperor_desc:0 "インカ皇帝を国家の柱として再び迎える。伝統と革新の調和を図る。"
 PRU_constitution:0 "憲法の制定"
 PRU_constitution_desc:0 "皇帝の下、民の権利を保障する憲法を制定する。立憲君主制の夜明けだ。"
 PRU_god_emperor_people:0 "神・皇帝・人民"
 PRU_god_emperor_people_desc:0 "太陽神・皇帝・人民が三位一体となり、国家は不滅の強さを得る。"
 PRU_kapakocha:0 "カポック・オチャ"
 PRU_kapakocha_desc:0 "古代インカの祭祀カポック・オチャを復活させる。神聖なる儀式が民を統べる。"
 PRU_sun_god:0 "太陽神の降臨"
 PRU_sun_god_desc:0 "インティの力が地上に顕現する。太陽神の化身として、神聖帝国を打ち立てよ。"
 PRU_pure_blood:0 "純血の主張"
 PRU_pure_blood_desc:0 "インカの純粋な血統を守り抜く。血の絆こそが国家の礎である。"
 PRU_second_ocllo:0 "第二のオクリョ"
 PRU_second_ocllo_desc:0 "皇帝の妃オクリョに倣い、新たな巫女の伝統を確立する。聖なる母性が国を包む。"
 PRU_territory_recapture:0 "領土の奪還"
 PRU_territory_recapture_desc:0 "かつてインカ帝国が支配した領土を取り戻す。失われた栄光の回復だ。"
 PRU_holy_inca_empire:0 "神聖インカ帝国"
 PRU_holy_inca_empire_desc:0 "太陽神の加護の下、神聖インカ帝国がここに復活する。世界よ、ひれ伏せ。"
 PRU_natural_scenery:0 "自然の恵み"
 PRU_natural_scenery_desc:0 "アンデスの大自然を守りながら、その恵みを享受する。大地は母なり。"
 PRU_Sacred...?:0 "聖なる……？"
 PRU_Sacred...?_desc:0 "何が聖なるものか、問い直す時が来た。答えは風の中にあるかもしれない。"
 industrial_effort_PRU:0 "産業振興"
 industrial_effort_PRU_desc:0 "工業化の基盤を整え、インカの産業を近代化する。"
 construction_effort_PRU:0 "建設の努力"
 construction_effort_PRU_desc:0 "民間工場を増設し、生産能力を拡大する。"
 production_effort_PRU:0 "生産の努力"
 production_effort_PRU_desc:0 "軍需工場を増設し、軍事生産能力を強化する。"
 construction_effort_PRU_2:0 "建設の努力 II"
 construction_effort_PRU_2_desc:0 "さらなる民間工場の増設で経済基盤を強固にする。"
 production_effort_PRU_2:0 "生産の努力 II"
 production_effort_PRU_2_desc:0 "軍需工場を追加増設し、戦争への備えを固める。"
 infrastructure_effort_PRU:0 "インフラ整備"
 infrastructure_effort_PRU_desc:0 "道路と交通網を整備し、アンデスの山岳地帯をつなぐ。"
 production_effort_PRU_3:0 "生産の努力 III"
 production_effort_PRU_3_desc:0 "軍需工場のさらなる拡充で、生産体制を完成させる。"
 infrastructure_effort_PRU_2:0 "インフラ整備 II"
 infrastructure_effort_PRU_2_desc:0 "インフラ網を全国に拡大し、物流を飛躍的に改善する。"
 construction_effort_PRU_3:0 "建設の努力 III"
 construction_effort_PRU_3_desc:0 "大規模な民間工場建設で、産業の黄金時代を迎える。"
 nuclear_effort_PRU:0 "原子力開発"
 nuclear_effort_PRU_desc:0 "インカの太陽の力を核の力へ。原子力研究に投資する。"
 extra_tech_slot_PRU:0 "研究機関の拡充"
 extra_tech_slot_PRU_desc:0 "新たな研究部門を設立し、技術開発を加速させる。"
 extra_tech_slot_PRU_2:0 "研究機関の更なる拡充"
 extra_tech_slot_PRU_2_desc:0 "更なる研究スロットを追加し、最先端技術の追求を続ける。"
 secret_weapons_PRU:0 "秘密兵器"
 secret_weapons_PRU_desc:0 "古代の叡智と現代の科学が融合する。秘密兵器の開発に着手せよ。"
 PRU_Abolition_social_division_ef:0 "社会身分制廃止"
 PRU_Abolition_social_division_ef_desc:0 "身分制度を廃止し、社会の流動性を高めた。"
 PRU_social_security_ef:0 "社会保障制度"
 PRU_social_security_ef_desc:0 "民の基本的な生活を保障する制度が整った。"
 construction_effort_PRU_tt:0 "民間工場を建設する土地が不足している。"
 production_effort_PRU_tt:0 "軍需工場を建設する土地が不足している。"
 infrastructure_effort_PRU_tt:0 "インフラを建設する土地が不足している。"
