l_japanese:
 NTS_focus:0 "ナントカスタン国家方針"
 NTS_focus_desc:0 "五つの机と仮称憲法のもとで国名を決める方針樹。"
 NTS_name_conference:0 "タシュケント名称会議"
 NTS_name_conference_desc:0 "タシュケントの大広間に集まった代表たちは、五つの机それぞれが異なるレターヘッドを突き出し合った。統一された国名が定まらぬまま、当面の統治を保証する仮称憲法の効力がひとまず確認される。未定の国家をめぐる果てしなき名称論争が、いまここに幕を開けた。"
 NTS_missing_register:0 "欠落した国名台帳"
 NTS_missing_register_desc:0 "国家の基礎を定めるはずの台帳から、肝心の正式名称がすっぽりと抜け落ちている。白紙の表紙を前にした五つの机は、各々の正当性を主張して互いに譲ろうとしない。詩人、党印、宮廷、平原のそれぞれが、空欄となった国名欄に己の文字を書き込もうと蠢動を始めた。"
 NTS_sindh_separates:0 "シンドの分離"
 NTS_sindh_separates_desc:0 "1936年4月、英領インドのボンベイ総督府からシンド州が正式に分離されたとの報せが届いた。海に面したこの重要な回廊の領有は確固たるものとなったが、沿岸の公文書には依然として仮称の印が押されている。海の玄関口を得た歓喜の裏で、国名不在の滑稽さが再び浮き彫りとなった。"
 NTS_ipi_november:0 "十一月のイピ"
 NTS_ipi_november_desc:0 "1936年11月、北ワジリスタンの岩山からミルザ・アリ・ハン、通称イピのファキールが蜂起の烽火を上げた。部族民の怒りは瞬く間に燃え広がり、国境地帯全体を激しい動揺が包み込む。「イピの火」と恐れられるこの反乱を鎮めぬ限り、連邦の足元に安寧は訪れない。"
 NTS_karakalpak_transfer:0 "カラカルパク移管"
 NTS_karakalpak_transfer_desc:0 "1936年12月5日、新憲法に伴いカラカルパクの帰属がカザフからウズベクへと移管された。この境界変更の知らせは名称会議に波紋を広げ、ホジャエフとアリエフの間で激しい議論の火蓋が切って落とされる。地図の境界線が書き換えられるたび、我らの仮称台帳もまた修正を迫られる。"
 NTS_name_settled:0 "国名の確定"
 NTS_name_settled_desc:0 "数々の対立と妥協を経て、ついに白紙の台帳に記されるべき真の国名が採択された。暫定的な仮称憲法は破棄され、選ばれた理念に基づく恒久的な国家精神が打ち立てられる。名を持たぬ国家と呼ばれた時代は終わりを告げ、我らは定まった看板のもとで新たな歴史を刻み始める。"
 NTS_poets_chair:0 "詩人の議長席"
 NTS_poets_chair_desc:0 "アルマトイ机の代表として、草原の詩人サケン・セイフッリンとイリヤス・ジャンソグロフが議長席に座った。彼らは乾燥した官僚主義を拒み、民族の韻律と世俗的な平等の精神をもって国家の理念を語り始める。詩人たちの紡ぎ出す言葉が、会議に新鮮な風を吹き込んでいる。"
 NTS_iqbal_draft:0 "イクバルの草案"
 NTS_iqbal_draft_desc:0 "思想家にして大詩人たるムハンマド・イクバルが、自らの思索を注ぎ込んだ国名草案を平原机に提出した。彼の流麗な詩句はムスリムの誇りと大地の調和を謳い、激しく対立する机の代表たちをも魅了する。この草案の言葉こそが、白紙の台帳を埋める最初の確かな礎となる。"
 NTS_refuse_arrests:0 "逮捕を拒む"
 NTS_refuse_arrests_desc:0 "モスクワから内務人民委員部の護送隊が派遣されたが、我らは愛する詩人たちの引き渡しを断固として拒絶した。中央の理不尽な粛清令を破棄することは、ソ連指導部に対する明白な反逆を意味している。文化の魂を守り抜くため、連邦はクレムリンとの全面対決をも辞さない覚悟を決めた。"
 NTS_long_name_first:0 "長名同盟への踏み込み"
 NTS_long_name_first_desc:0 "ただ短く呼ばれる仮称の屈辱を捨て、国家の正統性を謳い上げる壮大な長名の採用へと踏み切る。公文書の表題を極限まで引き伸ばすことで、連邦は他国の傀儡に甘んじない威厳を内外に誇示する。長名同盟への加盟を見据え、我らの名前は最初の変革を遂げた。"
 NTS_longer_name:0 "さらなる長名"
 NTS_longer_name_desc:0 "詩人の美辞麗句と宮廷の伝統的儀礼称号をこれでもかと重ね合わせ、さらなる超長名へと進化させる。一息では到底読み切れないその国名は、あらゆる公式文書の余白を埋め尽くして官僚たちを圧倒する。連邦の存在感は、名辞の果てしない重層構造によって世界に刻まれる。"
 NTS_party_seals:0 "党印を揃える"
 NTS_party_seals_desc:0 "中央アジア各国の第一書記たちが、朱肉に塗れた自らの党印をタシュケントの会議机へと持ち寄った。五つの印鑑が並ぶ光景は、共産主義の規律によって地方の分離主義を封じ込める決意を物語っている。党の厳格な統制のもとで、国家は番号で区切られた新たな統治構造へと歩みを進める。"
 NTS_accept_purge:0 "粛清を受諾"
 NTS_accept_purge_desc:0 "モスクワから届いた秘密通達は、五つの机のうち中央アジアの書記たちを反革命の廉で告発していた。党印を預かる現地指導者たちを台帳から抹消し、クレムリンの監査官を受け入れねばならない。古びた共和国の名は消え去り、機械的な番号による中央集権統治が始まる。"
 NTS_refuse_purge:0 "粛清を拒む"
 NTS_refuse_purge_desc:0 "モスクワからの粛清指示を突き返し、各机を支えてきた生え抜きの書記たちを断固として留任させる。自立の道を歩む決断はスターリンの激怒を買い、赤い軍団による武力介入の危険を引き寄せることとなった。だが他国の傀儡となるよりは、誇り高き拒絶を選ばねばならない。"
 NTS_bukhara_name:0 "ブハラの名"
 NTS_bukhara_name_desc:0 "タシュケント机の重鎮ファイズッラ・ホジャエフは、かつてのブハラ人民ソビエト共和国の記憶を台帳に残すよう頑なに求めている。古都ブハラの栄光と革命の歴史を連邦の名に刻むことは、定住オアシスの優位を示す証でもある。この歴史ある称号をめぐり、遊牧の書記たちとの議論は白熱している。"
 NTS_karakalpak_name:0 "カラカルパクの名"
 NTS_karakalpak_name_desc:0 "カザフからウズベクへと移管されたカラカルパク自治共和国の代表アリエフは、自らの名を消されることを拒んでいる。アラル海の干上がった沿岸にも固有の誇りと自決の権利が存在すると、彼は会議の席で堂々と主張する。地方の自治名を台帳に残すか否か、書記たちの論争が続いている。"
 NTS_hashim_regency:0 "ハシムの摂政"
 NTS_hashim_regency_desc:0 "若き国王ザーヒル・シャーの後見人として、叔父のムハンマド・ハシム・ハンがカブール宮廷の全権を掌握している。厳格な摂政は五つの机の軽薄な論議を退け、王室の専権事項として秩序を保とうとする。冷徹な執政の手腕によって、王都の威信は揺るぎないものとなる。"
 NTS_zahir_stamp:0 "ザーヒルの印"
 NTS_zahir_stamp_desc:0 "若き国王ザーヒル・シャーが親政を敷くため、後見人を自任する叔父たちの権力を慎重に削ぎ落としていく。玉座の主が自らの手で国務の書類に王室の印章を押す体制を整え、王都の命令系統を一元化する。宮廷の深奥から放たれる若き君主の意志が、分裂しがちな国家を束ねる。"
 NTS_momand_names:0 "モマンドの呼称"
 NTS_momand_names_desc:0 "カブール宮廷の過激な民族主義者モマンドは、国家の唯一の呼称としてパシュトゥンの名を冠するよう強硬に迫る。北方のオアシスや平原の都市に至るまでパシュトゥン化を推し進め、中央集権の単一国家を打ち立てようとする構想だ。だが他の民族や机を顧みないこの強硬論は、各地で激しい軋轢を生んでいる。"
 NTS_bughra_east:0 "ブグラの東"
 NTS_bughra_east_desc:0 "カブール宮廷に身を寄せるムハンマド・アミン・ブグラは、東方のタリム盆地を指差してやまない。新疆の軍閥が動揺する今こそ、パミールを越えて失われたウイグルの大地を取り戻す好機である。王室の承認を得た義勇軍が、雪嶺を越えて東へと向かう。"
 NTS_fazl_dies:0 "ファズルの死"
 NTS_fazl_dies_desc:0 "1936年7月、平原机を束ねていたファズル・イ・フサイン卿が世を去った。ラホールの合同党と平原の指導権は、現実主義者のシカンダル・ハヤト・ハンへと引き継がれる。偉大な調停者を失った平原の地主たちは、自らの特権を守るため結束を固め直している。"
 NTS_sikandar_union:0 "シカンダルの連合"
 NTS_sikandar_union_desc:0 "シカンダル・ハヤト・ハン率いるパンジャーブの地主たちは、強力な中央政府による一元的な連邦名の制定に異を唱える。彼らにとって重要なのは地方の伝統的利権と自治であり、頭上に屋根を架すような大層な国号は不要であった。連合派の抵抗により、安易な単一国家の看板づくりは暗礁に乗り上げる。"
 NTS_ghaffar_servants:0 "ガッファールの奉仕者"
 NTS_ghaffar_servants_desc:0 "国境州の誇り高きパシュトゥン人たちを率いるハーン・アブドゥル・ガッファール・ハンが、平原机と協調の道を選んだ。赤い服を纏った「神の奉仕者」たちは非暴力の規律を守り、民衆の間で確固たる支持を広げている。彼らの献身を国家の機構に組み込むことで、北西辺境に平穏をもたらす。"
 NTS_hari_singh:0 "ハリ・シンの道"
 NTS_hari_singh_desc:0 "カシミールのマハラジャであるハリ・シンとの間に協定を結び、王国の自治と伝統的特権を保障する。ヒンドゥーの君主とムスリムの臣民が織りなす複雑な山岳国を、急進的な統合から守らねばならない。古き藩王国の存続を認めることが、北方の尾根に秩序を保つ最も穏健な道である。"
 NTS_sheikh_abdullah:0 "シェイク・アブドゥッラー"
 NTS_sheikh_abdullah_desc:0 "スリナガルの指導者シェイク・アブドゥッラーは、カシミールの民衆運動を率いて民主的な権利の拡大を求めている。彼はマハラジャの旧弊な支配を糾弾し、風光明媚な夏の都スリナガルを平原机の第二首都に据えるよう提案する。大衆の熱烈な支持を背景に、彼の声は会議でも無視できない重みを持つ。"
 NTS_name_the_railway:0 "鉄道に名を付ける"
 NTS_name_the_railway_desc:0 "中央アジアの砂漠と平原を貫く鉄路が完成したが、列車の車体にはまだ所属を告げる名がない。タシュケント、アルマアタ、カブール、ラホールのどの都市の名を冠するかで、各机の面子が激しく衝突している。線路の敷設を急ぐ工夫たちを尻目に、官僚たちは看板の文字をめぐって議論を続けている。"
 NTS_cotton_count:0 "綿を数える"
 NTS_cotton_count_desc:0 "オアシスの綿畑で収穫された白い綿花が、計量所へと次々に運び込まれていく。イクラモフとシャドゥンツは鉛筆を走らせ、収穫高のひと束に至るまで正確に帳簿へ書き写す。数字として把握された綿の山は、連邦の産業を支える確かな基盤となる。"
 NTS_emba_oil:0 "エンバの石油"
 NTS_emba_oil_desc:0 "カスピ海北東の乾いたステップに広がるエンバ油田へ、本格的な投資を開始する。クラスヌイ・ヤルの試掘井からは良質な原油が噴き出し、国営公社エンバネフトの設立が宣言された。この石油こそが、仮称の国家を支える確固たる産業の礎となる。"
 NTS_frunze_metal:0 "フルンゼの金属"
 NTS_frunze_metal_desc:0 "天山山脈の麓に位置するフルンゼの製錬所から、硬質な金属が軍需工場へと送り出される。周縁机に属するキルギスの資源を兵器生産へと直結させ、連邦の軍備を底上げする。中央の議論から遠く離れた山峡の金属が、国家の防壁を鍛え上げる。"
 NTS_wait_for_zabuli:0 "ザブリを待つ"
 NTS_wait_for_zabuli_desc:0 "卓越した財政の天才アブドゥル・マジド・ザブリの帰国を待ち、秩序ある銀行設立の時機をうかがう。性急な改革を避けてカブール宮廷の伝統的な信用を守る姿勢は、市場の安定と有力者たちの信頼を保つ。やがて設立されるナントカスタン・ミリー銀行は、盤石の基礎の上に築かれるだろう。"
 NTS_bank_now:0 "今すぐ銀行を"
 NTS_bank_now_desc:0 "ザブリの帰国や宮廷の慎重な財政計画を待つ時間はない。仮称憲法の混乱下であっても、直ちに国立銀行の看板を掲げて通貨と信用を掌握すべきだ。急ごしらえの機関立ち上げは各地の商業を揺るがすが、経済の主導権を握る代償としては安い。"
 NTS_punjab_shops:0 "パンジャーブの工房"
 NTS_punjab_shops_desc:0 "ラホール郊外のモガルプラ鉄道工場では、けたたましい金属音が昼夜を問わず響き渡っている。平原机の有力者たちはこの近代的な工房群をテコにして、自らの経済圏を強固なものにしようとしている。熟練工たちの手によって、平原を走る機関車と工業資材が次々と生み出されていく。"
 NTS_attock_wells:0 "アトックの油井"
 NTS_attock_wells_desc:0 "パンジャーブ北部の乾燥した丘陵に、アトック石油のやぐらが立ち並んでいる。平原机の地主たちはこの黒い富を自らの管轄下に置くことで、発言力を確固たるものにしようとしている。精製された燃料は、やがて平原を走る機関車と軍団の血肉となるだろう。"
 NTS_caspian_boats:0 "カスピの小船"
 NTS_caspian_boats_desc:0 "エンバの石油を対岸へ運ぶため、グレフの船渠にカスピ海専用の小船を集備する。閉ざされた内海であっても、二つの海を抱える国家として航路の安全は無視できない。波静かな水面を走る平底船が、北方の油田と連邦の動脈を結びつける。"
 NTS_royal_army:0 "国王の軍"
 NTS_royal_army_desc:0 "国王ザーヒル・シャーの叔父たち、シャー・マフムードとシャー・ワリが宮廷直属軍の再編に乗り出した。山岳地帯と砂漠の双方に適応した強靭な歩兵師団を育成し、軍の統帥権を王室のもとに集中させる。鍛え上げられた国王の軍は、揺らぐ国家を支える最も確かな物理的支柱となる。"
 NTS_call_daoud:0 "ダウードを呼ぶ"
 NTS_call_daoud_desc:0 "カンダハル知事の青年将校ムハンマド・ダウードが、首都の軍事評議会へ召喚された。王族の血を引きながら近代戦の教義に明るい彼は、山岳騎兵の国に装甲部隊の導入を強く説く。宮廷の長老たちは眉をひそめるが、軍の近代化はもはや後戻りできない。"
 NTS_ipi_regulars:0 "イピを正規軍で"
 NTS_ipi_regulars_desc:0 "部族の反乱に対して妥協の余地はない。カブール宮廷直属の国王軍正規連隊を峠へと進発させ、近代兵器の火力をもってイピの蜂起を徹底的に鎮圧する。過酷な山岳戦の経験は、正規軍の士官たちに貴重な実戦の教訓をもたらすだろう。"
 NTS_ipi_servants:0 "イピを奉仕者に"
 NTS_ipi_servants_desc:0 "流血の弾圧を避け、ガッファール・ハンの「神の奉仕者」たちを使者としてワジリスタンの山奥へ派遣する。同じパシュトゥンの同胞として非暴力を説き、イピの支持者たちを平和的な民兵組織へと再編させる。信義と対話に基づく調停は、辺境の傷を最小限に抑えるだろう。"
 NTS_ipi_landlords:0 "イピを地主騎兵に"
 NTS_ipi_landlords_desc:0 "北ワジリスタンの険しい山岳地帯に、パンジャーブ地主たちが拠出する伝統の騎兵隊を投入する。シカンダル率いる平原机の有力者たちに討伐の功名を与え、平原側の発言力を一気に高める。部族の反乱は地主階級の私兵によって封じ込められ、地方の利権が強化される。"
 NTS_numbered_divisions:0 "番号師団"
 NTS_numbered_divisions_desc:0 "部族名や地方の愛称で呼ばれていた混沌とした軍部隊を解体し、無機質なアラビア数字の番号師団へと再編成する。伝統の誇りを奪われた将兵の不満は募るが、画一的な組織化は近代戦における指揮系統を飛躍的に効率化させる。番号管理の波は、兵営の隅々にまで浸透しつつある。"
 NTS_skvortsov_bureau:0 "スクヴォルツォフと設計局"
 NTS_skvortsov_bureau_desc:0 "粛清の荒野にモスクワから着任したニコライ・スクヴォルツォフは、混乱した軍需機構の整理に着手した。個性的な技術陣の名称は剥奪され、すべての兵器設計局は第何号という無機質な連番で呼ばれることになる。個人の栄光を排除した官僚的な統制が、工廠のベルトコンベアを動かしていく。"
 NTS_quetta_fighters:0 "クエッタ戦闘機路線"
 NTS_quetta_fighters_desc:0 "広大な草原と高地の領空を防衛するため、迎撃用戦闘機の開発と配備に重きを置く。クエッタの飛行場から飛び立つ俊敏な戦闘機隊は、他国の偵察機や爆撃機を国境の外へ追い落とす任を帯びる。大空の制空権を確立することこそが、広大すぎる国土を守る鉄則である。"
 NTS_quetta_cas:0 "クエッタ対地路線"
 NTS_quetta_cas_desc:0 "険しい山岳に潜む反乱部隊を制圧するため、クエッタ航空基地に対地攻撃機の整備拠点を置く。岩肌を縫うように超低空で侵入し、的確な爆撃を加える航空戦術が徹底的に鍛え上げられる。山峡の空を制する翼は、地上軍にとって最も頼もしい支援となるだろう。"
 NTS_karachi_escorts:0 "カラチの護衛"
 NTS_karachi_escorts_desc:0 "インド洋に開かれた大港カラチに造船所を増設し、海上交通路を守る護衛部隊の整備を進める。外洋からの通商船団を守り抜くため、小型で俊敏な駆逐艦の建造が急ピッチで進められている。南の青い海は、内陸に偏重しがちな連邦にとって生命線そのものである。"
 NTS_kalat_name:0 "カラートの名"
 NTS_kalat_name_desc:0 "カラート藩王国の支配者アフマド・ヤール・ハンが、バルーチスターン沿岸の自治を認めるよう求めてきた。古くからの部族慣習と自らの称号を台帳へ明記することを求める彼の要求は、中央集権を急ぐ会議を揺るがす。沿岸の港と砂漠の民を繋ぎ留めるには、地方の尊厳に配慮せねばならない。"
 NTS_foreign_desk:0 "外務机"
 NTS_foreign_desk_desc:0 "ファイズ・ムハンマド・ジキリアのもとに、対外関係を一手に司る第六の机「外務机」が設置された。正式な国名なき国家からの使節を諸外国にどう名乗らせるか、外交官たちは頭を悩ませている。だが国境の外へと窓を開くことこそが、国際社会に存在を認めさせる第一歩だ。"
 NTS_seek_recognition:0 "隣国への承認工作"
 NTS_seek_recognition_desc:0 "インド、イラン、中国、そして日本の各政府へ特別使節を派遣し、我が国家の主権と国名の公式な承認を要請する。正式な国号が曖昧なままであっても、隣国との外交関係を既成事実化すれば国際的な地位は定まる。国境の安定を買い取るための地道な外交戦が始まった。"
 NTS_cotton_moscow_trade:0 "モスクワ通商"
 NTS_cotton_moscow_trade_desc:0 "帳簿に整然と記載された綿花を貨車に積み込み、北方のモスクワへと送り出す。ソ連の紡績工場へ原料を安定供給する見返りとして、我らは貴重な機械と外交的保証を手に入れる。実利的な通商関係を結ぶことで、危険な国境にひとときの安定がもたらされる。"
 NTS_break_with_moscow:0 "モスクワとの決裂"
 NTS_break_with_moscow_desc:0 "綿花の納入義務と一方的な価格統制が記されたモスクワの帳簿を、我らは叩き返した。北方の影から抜け出す決断は、国境の緊張を決定的に高めることになる。だが五つの机が自らの意志で歩むためには、赤い巨人の鎖を断ち切らねばならない。"
 NTS_approach_long_alliance:0 "長名同盟への接触"
 NTS_approach_long_alliance_desc:0 "名が長いということは、それだけで強大な正統性と歴史の重みを象徴している。バンコクとスリジャヤワルダナプラコッテの宮廷へ使節を派遣し、同盟の打診を行わせる。仮称に苦しむ我らも、名辞の長さにおいてならば南方の盟主たちと肩を並べられるはずだ。"
 NTS_accept_long_invitation:0 "長名の招待を受ける"
 NTS_accept_long_invitation_desc:0 "バンコクとスリジャヤワルダナプラコッテから届いた親書には、長きにわたる正式国名が整然と刻まれていた。我らの名もすでに紙幅を埋め尽くすほどの長さを獲得しており、対等な盟邦として席に着く資格がある。過剰な敬称を交わし合う長名同盟の輪に加わり、仮称の時代に永遠の別れを告げよう。"
 NTS_sjk_writes_our_name:0 "名を書かせる"
 NTS_sjk_writes_our_name_desc:0 "果てしなく長い名を持つことで知られるスリジャヤワルダナプラコッテの書記官に、我が国の公式名称を羊皮紙に清書させる。南方の島国の熟練した代書人は、美事な装飾文字で我らの長大極まる国名を書き連ねてみせた。認められた長名文書を携え、国家の威信は新たな高みへと到達する。"
 NTS_wes_sand_stance:0 "砂への態度"
 NTS_wes_sand_stance_desc:0 "果てなき荒野の向こうに広がるスナスナスタンに対し、連邦が取るべき明確な方針を決定する。国名がいまだ定まらぬ間は砂の脅威に怯えて警戒を強めるほかないが、看板が定まれば確固たる友好を結ぶこともできる。乾いた砂の海を見つめながら、我らは防衛体制の引き締めを急ぐ。"
 NTS_iran_quiet_border:0 "静かな国境"
 NTS_iran_quiet_border_desc:0 "隣国イランとの間で不可侵条約を結び、長年の摩擦が続いていたホラーサーン国境に平穏をもたらす。西方の安全が担保されたことで、防衛部隊をより緊迫した方面へと再配置することが可能となった。乾いた大地に引かれた境界線は、いまや静かな親善の架け橋となっている。"
 NTS_kashmir_dossier:0 "カシミール外交台帳"
 NTS_kashmir_dossier_desc:0 "山深きカシミール地方をめぐる歴史的権利と外交主張を、一冊の公式台帳へと集約する。宗派や藩王の利権が複雑に絡み合うこの要衝に対し、五つの机が統一された見解を持たねば交渉は進まない。編纂された台帳は、将来の領有権を主張するための揺るぎない根拠となる。"
 NTS_kitada_channel:0 "北田公使ルート"
 NTS_kitada_channel_desc:0 "カブールに駐在する日本の北田公使との間に、極秘の接触ルートを開設する。極東の帝国との結びつきは、孤立を恐れる宮廷にとって極めて魅力的な後ろ盾となり得る。公使の手配によって引き渡された小銃は、国境を守る兵士たちの手に直ちに配備された。"
 NTS_stan_good_neighbor:0 "スタン善隣外交"
 NTS_stan_good_neighbor_desc:0 "周囲に点在する近隣諸国と膝を交え、小規模ながら実利的な通商協定を地道に積み重ねていく。国名の定義をめぐる大仰な神学論争は棚上げにし、商人と羊の往来を保証する現実的な約束を交わす。このささやかな善隣関係の網の目こそが、不安定な国境に平和をもたらす最良の防壁となる。"
