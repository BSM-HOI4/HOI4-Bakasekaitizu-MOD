l_japanese:
  system_initialization:0 "システム初期化"
  system_initialization_desc:0 "国家管理システムを初期化する。政治的安定性を高め、行政効率を改善するための基盤を構築する。"
  data_processing:0 "データ処理基盤の構築"
  data_processing_desc:0 "高度なデータ処理基盤を構築し、研究能力を向上させる。電子工学分野の技術開発を加速する。"
  security_protocols:0 "セキュリティプロトコル"
  security_protocols_desc:0 "国家の安全を確保するため、厳格なセキュリティプロトコルを導入する。軍事情報の保護と国防体制の強化を図る。"
  efficiency_optimization:0 "効率最適化"
  efficiency_optimization_desc:0 "システム全体の効率を最適化し、産業生産性を向上させる。データ処理とセキュリティの両面からアプローチする。"
  network_expansion:0 "ネットワーク拡張"
  network_expansion_desc:0 "国内のインフラネットワークを拡張し、輸送・通信能力を強化する。産業技術の研究にも寄与する。"
  automated_defense:0 "自動防衛システム"
  automated_defense_desc:0 "最先端の自動防衛システムを構築し、国境要塞を強化する。陸軍教義の研究コストを削減する。"
  management_security:0 "管理セキュリティ"
  system_efficiency:0 "システム効率"
