l_japanese:
 LON_ts_three_sovereignties_category:0 "ロンドン橋の向こう側"
 LON_ts_three_sovereignties_category_desc:0 "ロンドン市、英国政府、アイルランド政府の主権を調整する。停戦は相手国の承諾が必要で、領土を自動移譲するものではない。北アイルランドの帰属は、平時に三者の交渉で決める。"
 LON_ts_ire_offer_london_ceasefire:0 "ロンドン市に停戦を提案"
 LON_ts_ire_offer_london_ceasefire_desc:0 "市当局に個別停戦を申し入れる。承認されれば両国間の戦争を終結するが、他国との戦争は継続する。拒否された場合も交渉費用は返還されない。再提案は180日後。"
 LON_ts_london_offer_britain_ceasefire:0 "英国政府に停戦を提案"
 LON_ts_london_offer_britain_ceasefire_desc:0 "二つのロンドンを巡る戦争について、英国政府に個別停戦を申し入れる。承認には英国側の判断が必要で、州126の移譲を保証するものではない。再提案は180日後。"
 LON_ts_ire_offer_britain_ceasefire:0 "英国政府との個別停戦を交渉"
 LON_ts_ire_offer_britain_ceasefire_desc:0 "英国との戦争を交渉で終結させる。ロンドン市との戦争には影響しない。英国が提案を拒否しても交渉費用は返還されない。再提案は180日後。"
 LON_ts_ire_negotiate_northern_ireland:0 "北アイルランドの帰属を交渉"
 LON_ts_ire_negotiate_northern_ireland_desc:0 "三者が平和を保っている間に、英国へ北部の帰属交渉を申し入れる。ロンドン市が領有する場合は市の同意も必要で、アイルランド側が最終条件を審議する。交渉の申し入れだけでは領土は移譲されない。再提案は365日後。"
 LON_ts_disputed_administration:0 "島を治める市役所"
 LON_ts_disputed_administration_desc:0 "ロンドン市の特権とアイルランド住民の代表権が衝突している。誰が課税し、誰が議会に出席するのか、統治の根拠を決め直す必要がある。"
 LON_ts_bridge_disruption:0 "ロンドン橋の物流混乱"
 LON_ts_bridge_disruption_desc:0 "橋の損傷と管理を巡る紛争が、建設資材の流通と行政への信頼を損なっている。修繕で損耗度を70未満まで下げれば、この混乱を解消できる。"
 LON_ts_city_debt:0 "シティの修繕融資"
 LON_ts_city_debt_desc:0 "市の金融界が修繕費を立て替えた。橋は維持されるが、返済のために民間経済へ負担が及ぶ。"
 LON_ts_british_oversight:0 "英国の監督権"
 LON_ts_british_oversight_desc:0 "英国の財政支援と引き換えに、橋と行政への監督を受け入れた。市の政策決定には本国との調整が必要になる。"
 LON_ts_representative_charter:0 "住民代表憲章"
 LON_ts_representative_charter_desc:0 "住民の代表と予算監査を認める憲章が成立した。島の将来を当事者同士で決めるための足場となる。"
 LON_ts_three_party_accord:0 "三者協約"
 LON_ts_three_party_accord_desc:0 "英国、ロンドン市、アイルランドは、それぞれの役割と主権を条約で確認した。合意の維持が交易と国内の安定を支える。"
 LON_ts_irish_reconstruction:0 "アイルランドの再建"
 LON_ts_irish_reconstruction_desc:0 "新しい政府の下で、島の住民が公共事業と生活基盤の再建に取り組んでいる。"
 LON_ts_federal_compact:0 "合意によるケルト連邦"
 LON_ts_federal_compact_desc:0 "構成国の同意と自治を基礎に連邦協定が結ばれた。軍事併合によらず、政治協力を深める枠組みである。"
 LON_ts_relocation:0 "帰還する市当局"
 LON_ts_relocation_desc:0 "ロンドン市の行政と金融機能を、海の向こうから実際のロンドンへ移転している。行政機構の再編には一時的な負担が伴う。"
 LON_ts_bridge_works:0 "ロンドン橋の大規模修繕"
 LON_ts_bridge_works_desc:0 "90日間の大規模修繕に民間資源を投入している。工場を恒久的に減らさず、期間中の消費財負担として費用を賄う。"
 LON_ts_resume_constitution:0 "中断した憲法会議の準備を再開"
 LON_ts_resume_constitution_desc:0 "憲法制定の国家方針を完了した後、戦争や領土の混乱で中断した準備を再開する。アイルランドがまだ成立しておらず、島の4州を領有・支配し、橋の交渉が決着していれば利用できる。再実行は30日後。"
 LON_ts_reconvene_conference:0 "三者会議を再招集"
 LON_ts_reconvene_conference_desc:0 "中断した主権交渉のため、アイルランド代表を再び招く。英国・ロンドン市・アイルランドの全てが平時であることが必要。再招集では以前の承認を引き継がず、各当事者が条件を審議し直す。再提案は90日後。"
 LON_ts_renew_independence:0 "英国に独立を再申請"
 LON_ts_renew_independence_desc:0 "独立交渉の国家方針を完了しても英国の従属国である場合、平時に改めて独立を申請する。英国政府は承認または拒否を選べる。審議中の申請がある間は利用できず、再提案は365日後。"
