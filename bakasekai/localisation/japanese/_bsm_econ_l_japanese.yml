l_japanese:
 bsm_econ_test_gdp_probe:0 "GDP計算をログ出力 (game.log)"
 bsm_econ_test_gdp_probe_desc:0 "自国のGDP(System A)を計算し [BSM_GDP] 行を game.log に出力するデバッグ用。gdp_real / output / state_sum / 資源額 / 成長率 と入力値(工場/安定度/文明度/州数)を確認できる。"
 bsm_econ_test_prestige_probe:0 "威信(Prestige)を計算してログ出力 (game.log)"
 bsm_econ_test_prestige_probe_desc:0 "Vic3型の威信(System C)を全国計算し [BSM_PRESTIGE] を game.log に出力。威信=GDP+陸海軍+従属+tier のパワー合算、ランクは世界平均比(列強≥5×/大国≥2.5×/非主要≥0.6×/小国)。world_avg と自国の prestige/rank/ratio を確認できる。"
 COLLECTION_BSM_WORLD_COUNTRIES:0 "全存在国(威信の世界平均集約用)"
 bsm_rank_7:0 "超大国"
 bsm_rank_6:0 "列強"
 bsm_rank_5:0 "大国"
 bsm_rank_4:0 "地域大国"
 bsm_rank_3:0 "中堅国"
 bsm_rank_2:0 "小国"
 bsm_rank_1:0 "弱小国"
 bsm_prestige_modifier:0 "国家威信ランク"
 bsm_prestige_test_boost:0 "[テスト]威信ブースト源"
 bsm_prestige_factor:0 "国家威信補正"
 bsm_prestige_flat:0 "国家威信(固定値)"
 bsm_prestige_badge_num_txt:0 "[?bsm_prestige_position|0]"
 bsm_prestige_badge_tt:0 "§Y世界威信ランキング #[?ROOT.bsm_prestige_position|0]§!\n階級: [ROOT.GetBsmPrestigeRankName] (rank[?ROOT.bsm_prestige_rank|0])\n威信: §G[?ROOT.bsm_prestige|0]§! (世界平均比 [?ROOT.bsm_prestige_ratio|2]x)\n世界平均威信: [?global.bsm_prestige_world_avg|1]"
 bsm_econ_test_prestige_mod_toggle:0 "[テスト]威信+/-modを付与/解除"
 bsm_econ_test_prestige_mod_toggle_desc:0 "bsm_prestige_test_boost(威信 flat+500 / +20%)を自国に付与/解除し、bsm_prestige_flat/factor が威信計算に効くかを威信probeで確認するテスト。実コンテンツでは idea/focus/event でこれらの modifier を付与する。"
