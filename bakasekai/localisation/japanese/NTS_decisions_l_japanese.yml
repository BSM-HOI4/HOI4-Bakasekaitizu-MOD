l_japanese:

 NTS_border_disputes:0 "国境紛争"

 NTS_kashmir_maintain_claim:0 "カシミールの主張を維持する"
 NTS_kashmir_maintain_claim_desc:0 "ヒマラヤの雪嶺に抱かれたカシミール渓谷に対する歴史的権利を、我らは手放すつもりはない。今は南方の隣国と直ちに矛を交える時ではないが、地図に引かれた主張の墨痕だけは消さずに残しておく。山の民との連帯を心に留めつつ、情勢の推移を静かに見守るべきである。"

 NTS_kashmir_war_goal:0 "カシミールへの戦争目標"
 NTS_kashmir_war_goal_desc:0 "外交的な協議の余地はもはや尽き果て、山谷の帰属は武力によってのみ決せられる。古来より平原の民と運命を共にしてきたカシミールを、南方の支配から解放せねばならない。我らの軍勢を険しき峠の向こうへ進撃させ、かの肥沃なる谷を実力で取り戻す刻が来た。"

 NTS_integrate_kashmir:0 "カシミールの統合"
 NTS_integrate_kashmir_desc:0 "武力によって確保されたカシミールの谷に、ついに我らの恒久的な行政機構が据えられた。異邦の支配による傷跡を癒やし、渓谷の民を連邦の一員として正式に台帳へと登録する。この山岳の要衝は、もはや切り離すことのできぬ不可分の大地となった。"

 NTS_kashmir_withdraw_claim:0 "カシミールの主張を取り下げる"
 NTS_kashmir_withdraw_claim_desc:0 "険峻な山脈の向こうにある係争地への執着を捨て、南の隣国との不毛な摩擦を回避する。我らが守るべきはまず手元の平原と草原であり、果てなき領土への野心ではない。カシミールに対する一切の請求権を破棄し、南方の国境に恒久的な安定をもたらす。"
