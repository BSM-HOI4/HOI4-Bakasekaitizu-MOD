l_japanese:
 ##############################################
 # NSI Ideas Localization
 ##############################################
 
 # 基盤アイデア
 NSI_chikatoshi:0 "地下都市建設"
 NSI_chikatoshi_desc:0 "島の地下に巨大な都市インフラを建設することで、生産能力と建設効率が飛躍的に向上した。"
 
 # 孤立維持ツリー
 nsi_isolation_policy:0 "孤立主義政策"
 nsi_isolation_policy_desc:0 "外界との一切の接触を断つことで、我々の純粋性と安定性を保持している。戦争や同盟は禁止されているが、内政は大幅に強化される。"
 
 nsi_outsider_rejection:0 "侵入者拒絶"
 nsi_outsider_rejection_desc:0 "外部からの侵入者を完全に拒絶する体制を確立。沿岸防御と陸軍の防御力が大幅に向上している。"
 
 nsi_sacred_barriers:0 "神聖なる障壁"
 nsi_sacred_barriers_desc:0 "島全体を神聖な防御障壁で覆うことで、要塞レベルと防御力、スパイ検出能力が向上している。"
 
 nsi_ancient_traditions:0 "古代の伝統"
 nsi_ancient_traditions_desc:0 "数千年前から続く古い伝統と掟により、政治力と安定度、思想防衛力が強化されている。"
 
 nsi_guardian_spirits:0 "守護霊の加護"
 nsi_guardian_spirits_desc:0 "島の守護霊たちによる神秘的な加護により、安定度、戦争協力度、軍隊の士気が大幅に向上している。"
 
 nsi_eternal_vigilance:0 "永遠の警戒"
 nsi_eternal_vigilance_desc:0 "外界への永続的な警戒体制により、建設効率と資源効率が向上し、消費財需要が削減されている。"
 
 # 軍事ツリー
 nsi_warrior_tradition:0 "戦士の伝統"
 nsi_warrior_tradition_desc:0 "古代より伝わる戦士の道により、陸軍の攻撃力・防御力と経験値獲得率が向上している。"
 
 nsi_elite_guards:0 "精鋭護衛隊"
 nsi_elite_guards_desc:0 "島の最精鋭戦士による護衛隊。特殊部隊の上限と戦闘力が大幅に強化されている。"
 
 nsi_ancient_weapons:0 "古代兵器"
 nsi_ancient_weapons_desc:0 "先祖代々受け継がれた古代の武器技術により、陸軍攻撃力と装備転換速度、軍需工場効率が向上している。"
 
 # 地下都市ツリー
 nsi_deep_tunnel_network:0 "深層トンネル網"
 nsi_deep_tunnel_network_desc:0 "島全体を結ぶ深層トンネル網により、防御力と塹壕構築速度、スパイ検出、要塞レベルが向上している。"
 
 nsi_subterranean_metropolis:0 "地下大都市"
 nsi_subterranean_metropolis_desc:0 "完成した地下大都市により、工業・造船能力と建設効率が大幅に向上し、消費財需要が削減されている。"
 
 nsi_hidden_research:0 "秘密研究"
 nsi_hidden_research_desc:0 "地下深くの秘密研究施設により、研究速度と建設効率、スパイ検出能力が向上している。"
 
 nsi_communication_network:0 "通信ネットワーク"
 nsi_communication_network_desc:0 "高度な地下通信網により、政治力と建設効率、暗号化・解読能力が向上している。"
 
 nsi_autarky_perfected:0 "完璧な自給自足"
 nsi_autarky_perfected_desc:0 "外界に一切依存しない完全な自給自足体制を確立。安定度、戦争協力度、資源効率が大幅に向上し、貿易法コストが削減されている。"
 
 # 政治ツリー
 nsi_tribal_council:0 "部族会議"
 nsi_tribal_council_desc:0 "古代より続く部族制度による統治システム。政治力と安定度が向上し、外来思想への抵抗力が強化されている。"
 
 nsi_isolation_laws:0 "孤立法"
 nsi_isolation_laws_desc:0 "外界との接触を法的に禁止する法律。安定度と戦争協力度、思想防衛力が強化され、消費財需要が削減されている。"
 
 # 信仰・神秘ツリー
 nsi_ancestral_worship:0 "祖先崇拝"
 nsi_ancestral_worship_desc:0 "数千年続く祖先崇拝により、安定度、戦争協力度、軍隊士気、思想防衛力が向上している。"
 
 nsi_sacred_rituals:0 "神聖な儀式"
 nsi_sacred_rituals_desc:0 "古代の神聖な儀式により、戦争協力度と軍隊の士気、陸軍経験値獲得率が向上している。"
 
 nsi_forbidden_knowledge:0 "禁断の知識"
 nsi_forbidden_knowledge_desc:0 "一般人には理解できない禁断の知識により、研究速度と電子工学生産効率、暗号化能力が向上している。"
 
 nsi_ancient_military_wisdom:0 "古代軍事叡智"
 nsi_ancient_military_wisdom_desc:0 "失われた古代の軍事知識により、陸軍の攻撃力・防御力と計画速度、最大計画値が向上している。"
 
 nsi_mystical_sciences:0 "神秘科学"
 nsi_mystical_sciences_desc:0 "科学と神秘を融合した独自の学問により、研究速度と民需・軍需工場の生産効率が向上している。"
 
 nsi_spiritual_awakening:0 "精神的覚醒"
 nsi_spiritual_awakening_desc:0 "島民全体の精神的覚醒により、安定度、戦争協力度、政治力、軍隊士気が大幅に向上している。"
 
 nsi_otherworldly_guidance:0 "異界の導き"
 nsi_otherworldly_guidance_desc:0 "異次元存在からの導きにより、研究速度と電子工学効率、暗号化・解読能力が飛躍的に向上している。"
 
 nsi_divine_protection:0 "神的加護"
 nsi_divine_protection_desc:0 "神々による直接的な加護により、要塞・沿岸要塞レベルと陸軍防御力、スパイ検出能力が大幅に強化されている。"
 
 nsi_transcendent_wisdom:0 "超越的叡智"
 nsi_transcendent_wisdom_desc:0 "人間を超えた超越的叡智により、研究速度、安定度、政治力、建設効率が大幅に向上している。"
 
 nsi_reality_bending:0 "現実歪曲"
 nsi_reality_bending_desc:0 "現実そのものを操作する力により、工業・造船能力と建設効率、資源効率が超自然的に向上している。"
 
 nsi_temporal_control:0 "時間制御"
 nsi_temporal_control_desc:0 "時間の流れを支配する能力により、研究速度、建設効率、経験値獲得、徴兵効率が大幅に向上している。"
 
 nsi_ascended_beings:0 "昇華存在"
 nsi_ascended_beings_desc:0 "神的存在への昇華により、全ての能力が人間の限界を超越している。もはや敵う者は存在しない。"
 
 # 覚醒ツリー
 nsi_awakened_empire:0 "覚醒帝国"
 nsi_awakened_empire_desc:0 "平和を破られた没落帝国の覚醒。孤立主義の制約が解除され、強大な軍事力で侵略者への報復を開始する。"
 
 nsi_ancient_fury:0 "古代の憤怒"
 nsi_ancient_fury_desc:0 "数千年の平和を破った者への古代からの憤怒により、戦争協力度と陸軍の攻撃力・士気・経験値獲得が大幅に強化されている。"
 
 nsi_tech_supremacy:0 "技術的優位"
 nsi_tech_supremacy_desc:0 "隠し続けてきた真の技術力の解放により、研究速度と軍需・民需工場の生産効率が大幅に向上している。"
 
 nsi_divine_retribution:0 "神的報復"
 nsi_divine_retribution_desc:0 "神々の名における完全な報復。軍事力と戦争協力度が極限まで強化され、正当化時間が大幅に短縮されている。"