l_japanese:
 # ==========================================
 # BSMシステム ローカライズ
 # ==========================================

 # ------------------------------------------
 # アノマリーイベント
 # ------------------------------------------
 AN_research_complete_title:0 "アノマリー研究完了"
 AN_research_complete_desc:0 "アノマリーの研究が完了した。新たな知見が我が国にもたらされる。"
 AN_research_complete_option:0 "研究成果を確認する"
 AN_research_cancel_title:0 "研究の中断"
 AN_research_cancel_desc:0 "現在進行中のアノマリー研究を中断しようとしている。これまでの進捗は失われる。"
 AN_research_cancel_yes:0 "研究を中断する"
 AN_research_cancel_no:0 "やはり継続する"
 AN_research_not_enough_unity_title:0 "統合力不足"
 AN_research_not_enough_unity_desc:0 "アノマリー研究に必要な統合力が不足している。研究を開始するには、より多くの統合力を蓄積する必要がある。"
 AN_research_not_enough_unity_option:0 "了解した"
 AN_research_started_title:0 "研究開始"
 AN_research_started_desc:0 "アノマリー研究チームが編成され、調査を開始した。完了までしばらく時間がかかるだろう。"
 AN_research_started_option:0 "幸運を祈る"

 # ------------------------------------------
 # 鉱山イベント
 # ------------------------------------------
 mine.0.title:0 "鉱山イベント"
 mine.0.desc:0 "鉱山で何かが起きた。"
 mine.0.a:0 "了解"
 mine.1.title:0 "大規模な落盤事故"
 mine.1.desc:0 "鉱山で大規模な落盤事故が発生した。復旧には多額の資金と鉱山の稼働レベル低下が必要となる。"
 mine.1.a:0 "直ちに復旧作業を開始する"
 mine.2.title:0 "中規模な落盤事故"
 mine.2.desc:0 "鉱山で中規模の落盤事故が発生した。復旧には資金と鉱山の稼働レベル低下が必要となる。"
 mine.2.a:0 "復旧作業を行う"
 mine.3.title:0 "軽度な落盤事故"
 mine.3.desc:0 "鉱山で軽度の落盤事故が発生した。軽微な補修費用が必要となる。"
 mine.3.a:0 "補修を行う"
 mine.4.title:0 "鉱山のストライキ"
 mine.4.desc:0 "鉱山労働者たちが待遇改善を求めてストライキを起こした。生産が一時的に停止している。"
 mine.4.a:0 "事態を見守る"
 mine.5.title:0 "鉱山の占領"
 mine.5.desc:0 "我が国の鉱山が敵国の占領下に置かれた。金の生産が停止している。"
 mine.5.a:0 "奪還を急ぐ"
 mine.6.title:0 "鉱山の解放"
 mine.6.desc:0 "占領されていた鉱山が解放された。生産を再開することができる。"
 mine.6.a:0 "生産を再開する"
 mine.7.title:0 "新鉱脈の発見"
 mine.7.desc:0 "鉱山付近で新たな鉱脈が発見された！ 鉱山の稼働レベルを引き上げることができる。"
 mine.7.a:0 "直ちに開発を開始する"
 mine.8.title:0 "鉱山での事故"
 mine.8.desc:0 "鉱山で事故が発生した。安全対策を講じるか、生産を優先するか決断を迫られている。"
 mine.8.a:0 "安全対策を無視して生産を継続する"
 mine.8.b:0 "鉱山を一時閉鎖して安全対策を行う"

 # ------------------------------------------
 # 核攻撃イベント
 # ------------------------------------------
 nukes_drop.1.t:0 "核攻撃！"
 nukes_drop.1.desc:0 "核兵器が使用された。世界はその破壊的な力を目の当たりにしている。"
 nukes_drop.1.a:0 "神よ、我らを救いたまえ"
 nukes_drop.1.b:0 "事態を注視する"
 nukes_drop.2.t:0 "核の惨禍"
 nukes_drop.2.desc:0 "核攻撃による被害が拡大している。市民の間に恐怖が広がり、国家の対応が求められている。"
 nukes_drop.2.a:0 "国民を守るために全力を尽くす"
 nukes_drop.2.b:0 "政治的対応を優先する"
 nukes_drop.3.t:0 "復興への決意"
 nukes_drop.3.desc:0 "核の惨禍を経て、国民の間に復興への強い意志が芽生えている。戦意が高揚している。"
 nukes_drop.3.a:0 "我らは屈しない"

 # ------------------------------------------
 # ステラリス探検隊イベント - 開始
 # ------------------------------------------
 bsm_stellaris_expedition_start.1.t:0 "学術調査隊の出発"
 bsm_stellaris_expedition_start.1.d:0 "科学者たちからなる学術調査隊が未知の領域へと出発する。新たな知識と発見がもたらされるだろう。"
 bsm_stellaris_expedition_start.1.a:0 "彼らの旅を見送る"
 bsm_stellaris_expedition_start.2.t:0 "軍事偵察隊の出発"
 bsm_stellaris_expedition_start.2.d:0 "精鋭部隊からなる軍事偵察隊が敵性領域への偵察任務に出発する。軍事情報の収集が期待される。"
 bsm_stellaris_expedition_start.2.a:0 "任務の成功を祈る"
 bsm_stellaris_expedition_start.3.t:0 "商業探検隊の出発"
 bsm_stellaris_expedition_start.3.d:0 "商人たちからなる商業探検隊が新たな交易路の開拓に出発する。貴重な資源と利益がもたらされるだろう。"
 bsm_stellaris_expedition_start.3.a:0 "よい取引を"

 # ------------------------------------------
 # ステラリス探検隊イベント - 完了
 # ------------------------------------------
 bsm_stellaris_expedition_complete.1.t:0 "学術調査隊の帰還"
 bsm_stellaris_expedition_complete.1.d:0 "学術調査隊が未知の領域からの調査を完了し、貴重なデータを持ち帰った。統合力が高まるだろう。"
 bsm_stellaris_expedition_complete.1.a:0 "調査結果を分析する"
 bsm_stellaris_expedition_complete.2.t:0 "軍事偵察隊の帰還"
 bsm_stellaris_expedition_complete.2.d:0 "軍事偵察隊が危険な偵察任務を完了し、重要な軍事情報をもたらした。統合力が高まるだろう。"
 bsm_stellaris_expedition_complete.2.a:0 "報告書を確認する"
 bsm_stellaris_expedition_complete.3.t:0 "商業探検隊の帰還"
 bsm_stellaris_expedition_complete.3.d:0 "商業探検隊が新たな交易路の開拓に成功し、豊かな成果を持ち帰った。統合力が高まるだろう。"
 bsm_stellaris_expedition_complete.3.a:0 "利益を確認する"

