l_japanese:

 ########################################
 # baka_news - ニュースイベント
 ########################################

 baka_news.1.t: "砂漠に謎の巨大構造物が出現！"
 baka_news.1.desc: "サハラ砂漠の中央部において、天文学的金額を投じた謎の巨大構造物が確認された。現地のラクダたちも困惑している模様だ。"
 baka_news.1.a: "これは我が国の偉大なる計画だ！"
 baka_news.1.b: "砂漠で何をやっているんだ……"

 baka_news.2.t: "世界バカ会議、緊急招集！"
 baka_news.2.desc: "史上空前の「世界バカ会議」が開催されることとなった。各国の代表者が一堂に会し、誰が一番バカかを競い合う前代未聞の会議である。"
 baka_news.2.a: "我こそが最強のバカなり！"
 baka_news.2.b: "まともな国として参加は見送る……"

 baka_news.3.t: "バカ対決、ついに勃発！"
 baka_news.3.desc: "両国の間で長年蓄積されてきた「バカ対決」がついに激化。世界中が固唾を飲んで見守る中、どちらがよりバカなのかが決定される。"
 baka_news.3.a: "我が国のバカ力が勝る！"
 baka_news.3.b: "いや、我が国の方が上だ！"
 baka_news.3.c: "遠くから眺めるのが一番だな"

 baka_news.4.t: "北方帝国、ついに成立！"
 baka_news.4.desc: "北方の地において、前代未聞の帝国が誕生した。皇帝の宣言は「全てのバカを統べる」という奇妙なものであったが、国民は熱狂している。"
 baka_news.4.a: "これぞ我が帝国の真の姿！"
 baka_news.4.b: "北方で何が起きているんだ……"

 ########################################
 # baka_super_news - スーパーニュース
 ########################################

 baka_super_news.1.t: "【超速報】バカの歴史が動く！"
 baka_super_news.1.desc: "世界を震撼させる大バカ事件の予兆が確認された。歴史の歯車が、しかしバカな方向に回り始めている。"
 baka_super_news.1.a: "ついにこの時が来たか……"
 baka_super_news.1.b: "何か嫌な予感がする……"

 baka_super_news.2.t: "【超速報】砂が世界を覆う！"
 baka_super_news.2.desc: "砂の力がついに臨界点に達した。砂漠の砂が意思を持ったかのように動き始め、世界は新たな砂の時代へ突入しようとしている。"
 baka_super_news.2.a: "砂こそが我が国の力！"
 baka_super_news.2.b: "砂に埋もれる前に準備せねば……"

 baka_super_news.3.t: "【超速報】砂漠帝国の台頭！"
 baka_super_news.3.desc: "サハラを完全に掌握した勢力が、ついに帝国を宣言。アフリカ大陸の覇者として君臨を開始した。近隣諸国は震え上がっている。"
 baka_super_news.3.a: "帝国の栄光は永遠なり！"
 baka_super_news.3.b: "あの砂漠の帝国が……恐ろしい"

 baka_super_news.4.t: "【超速報】バトルロイヤál開戦！"
 baka_super_news.4.desc: "複数の勢力が同時に宣戦布告を行い、史上最大のバトルロイヤアルが始まった。誰が最後まで生き残るのか、誰も予測できない。"
 baka_super_news.4.a: "我こそが勝者だ！"
 baka_super_news.4.b: "この混乱の中で生き残るしかない……"

 baka_super_news.5.t: "【超速報】永遠の道が開かれる！"
 baka_super_news.5.desc: "二つのバカ国家がついに究極の同盟を結成。この完璧なる長き関係は、歴史に永遠に刻まれることだろう。"
 baka_super_news.5.a: "我らの絆は永遠だ！"
 baka_super_news.5.b: "あの二国が手を組んだだと……"

 baka_super_news.6.t: "【超速報】マクドナルド帝国の興隆！"
 baka_super_news.6.desc: "マクドナルドが国家として独立を宣言！ハンバーガーの力で世界征服を狙う前代未聞の事態に、各国首脳は唖然としている。"
 baka_super_news.6.a: "ハンバーガーで世界を制す！"
 baka_super_news.6.b: "ファストフードの脅威……"

 baka_super_news.7.t: "【超速報】マック経済危機発生！"
 baka_super_news.7.desc: "マクドナルド帝国の経済が暴走し、世界中の経済に異常な影響を与え始めた。ビッグマック指数が文字通り世界を支配しようとしている。"
 baka_super_news.7.a: "経済の王国を完成させる！"
 baka_super_news.7.b: "マック経済の波が来る……"

 baka_super_news.8.t: "【超速報】DIS、北米制覇！"
 baka_super_news.8.desc: "DIS軍が北米大陸を完全に制圧。自由の国は消え、新たな秩序が大陸を覆う。ディズニーの魔法が現実となった瞬間である。"
 baka_super_news.8.a: "夢の王国が実現した！"
 baka_super_news.8.b: "北米が……あんな国に……"

 ########################################
 # baka_super - スーパーイベント
 ########################################

 baka_super.1.t: "世界バカ会議"
 baka_super.1.d: "世界の運命を左右するバカ会議が始まろうとしている。全てのバカの頂点に立つのは誰か――歴史の証人たれ。"
 baka_super.1.a: "バカの力を解き放て！"

 baka_super.2.t: "砂の進軍"
 baka_super.2.d: "砂が全てを飲み込む。砂漠の国がついにその真の力を解放し、世界は砂の嵐に包まれた。"
 baka_super.2.a: "砂と共に進め！"

 baka_super.3.t: "サハラ帝国の誕生"
 baka_super.3.d: "誰も予期しなかった。砂漠が帝国を産み落とす日が来るとは。サハラの皇帝の雄叫びが、アフリカ大陸に響き渡る。"
 baka_super.3.a: "帝国に栄光あれ！"

 baka_super.4.t: "バトルロイヤアル"
 baka_super.4.d: "全ての国が敵であり、全ての国が味方である。生き残るのはただ一国だけ。史上最大のバトルロイヤアル、ここに開幕！"
 baka_super.4.a: "最後まで戦い抜く！"

 baka_super.5.t: "永遠の同盟"
 baka_super.5.d: "二つのバカ国家が結んだ永遠の同盟。その絆は鋼よりも固く、バカであるがゆえに揺るぐことはない。"
 baka_super.5.a: "永遠の友よ、共に歩もう！"

 baka_super.6.t: "マクドナルド帝国"
 baka_super.6.d: "かつてハンバーガー屋だったものが、今や帝国である。ポテトの油で輝く玉座に、ハンバーガーの皇帝が座する。"
 baka_super.6.a: "ビッグマックで世界統一！"

 baka_super.7.t: "マック経済崩壊"
 baka_super.7.d: "マック経済の暴走が世界を飲み込む。通貨の代わりにハンバーガーが流通し、GDPの代わりに売上が語られる世界。そんなバカなことが起きようとしていた。"
 baka_super.7.a: "経済？そんなものはハンバーガーだ！"

 baka_super.8.t: "お前はバカだ"
 baka_super.8.d: "世界中に響き渡る嘲笑。「お前はバカだ」という言葉が、戦場を行軍する兵士たちの口から溢れ出す。これが最大の侮辱であり、最大の賛辞である。"
 baka_super.8.a: "……はい、私はバカです"

 baka_super.9.t: "DISによる北米制圧"
 baka_super.9.d: "夢と魔法の国DISが、北米大陸全体をミニチュアランドへと変貌させた。全ての市民はキャストとなり、大陸全体が巨大なテーマパークと化した。"
 baka_super.9.a: "夢の国へようこそ！"

 ########################################
 # baka_quiz - クイズオリンピック
 ########################################

 baka_quiz.1.t: "第1回バカオリンピック、開幕！"
 baka_quiz.1.d: "史上初の「バカオリンピック」が開催されることとなった！各国が自国最強のバカを派遣し、知力ではなく「バカ力」を競い合う前代未聞の大会である。"
 baka_quiz.1.a: "バカ力を見せつけてやる！"

 baka_quiz.2.t: "クイズ第1問：サハラ砂漠の砂は何色か？"
 baka_quiz.2.d: "「サハラ砂漠の砂は何色か？」――あまりにも簡単な問題に見えるが、バカオリンピックに正解など存在しない。参加者たちは自信満々に間違えた。"
 baka_quiz.2.a: "赤に決まっているだろう！"

 baka_quiz.3.t: "クイズ第2問：1+1は？"
 baka_quiz.3.d: "「1+1は？」――この単純な問題に対し、各国代表が次々と奇抜な回答を繰り出した。数学の先生が卒倒する光景であった。"
 baka_quiz.3.a: "田んぼだ！"

 baka_quiz.4.t: "クイズ第3問：次のうち正しいのは？"
 baka_quiz.4.d: "「次のうち正しいのは？」という問題に対し、NYY代表だけがなぜか正解を出した。他国は一斉に「ズルい！」と叫んだ。"
 baka_quiz.4.a: "当然、我が国が正解だ！"
 baka_quiz.4.b: "まぐれ当たりだろ……"

 baka_quiz.5.t: "クイズ第4問：世界で一番バカな国は？"
 baka_quiz.5.d: "「世界で一番バカな国は？」――4カ国が同時に「我が国だ！」と手を挙げた。審査員は困惑しているが、これぞバカオリンピックの真髄である。"
 baka_quiz.5.a: "我がAUSこそ最強のバカ！"
 baka_quiz.5.b: "HRHとASTが合同でバカを主張！"
 baka_quiz.5.c: "日本こそバカの本場である！"
 baka_quiz.5.d: "遠くから眺めるのが安全だ"

 baka_quiz.6.t: "クイズ第5問：水に濡れるとどうなる？"
 baka_quiz.6.d: "「水に濡れるとどうなる？」――当然「濡れる」であるが、参加者たちは「賢くなる」「バカになる」「消滅する」などと回答。科学への冒涜である。"
 baka_quiz.6.a: "溶けるに決まっている！"

 baka_quiz.7.t: "クイズ第6問：太陽はどこから昇る？"
 baka_quiz.7.d: "「太陽はどこから昇る？」――「西から！」という堂々たる回答が会場を沸かせた。天文学者は帰りたくなった模様である。"
 baka_quiz.7.a: "北からに決まっている！"

 baka_quiz.8.t: "クイズ第7問：地球は何の形？"
 baka_quiz.8.d: "「地球は何の形？」――「三角形！」「ひし形！」「バカの形！」次々と飛び出す回答に、会場のバカ度が最大値に達した。"
 baka_quiz.8.a: "フラットな円盤だ！"

 baka_quiz.9.t: "クイズ第8問：空はなぜ青い？"
 baka_quiz.9.d: "「空はなぜ青い？」――「青だから！」という名回答が飛び出し、会場全体が大爆笑。バカオリンピックのハイライトである。"
 baka_quiz.9.a: "ペンキで塗ったからだ！"

 baka_quiz.10.t: "クイズ第9問：魚はなぜ泳げる？"
 baka_quiz.10.d: "「魚はなぜ泳げる？」――「水泳学校に通っているから」という真面目な回答が逆に会場を混乱させた。バカにはバカの論理がある。"
 baka_quiz.10.a: "溺けないように必死なだけだ！"

 baka_quiz.11.t: "クイズ第10問：一番強い動物は？"
 baka_quiz.11.d: "「一番強い動物は？」――「バカ！」という回答が出た。バカは動物なのか？そんな議論はバカオリンピックでは無意味である。"
 baka_quiz.11.a: "人間に決まっている！"

 baka_quiz.12.t: "クイズ第11問：1年は何日？"
 baka_quiz.12.d: "「1年は何日？」――「365日！」という正解が出た瞬間、会場が静まり返った。正解はバカオリンピックにおいて最大の失態である。"
 baka_quiz.12.a: "知るか！毎日バカな日だ！"

 baka_quiz.13.t: "クイズ第12問：月うさぎは何をしている？"
 baka_quiz.13.d: "「月うさぎは何をしている？」――「もちつき！」という正解が出たが、直後に「バカをつき続けている」という訂正が入り、会場は大混乱に陥った。"
 baka_quiz.13.a: "バカをついている！"

 baka_quiz.14.t: "クイズ第13問：なぜ空を飛べない？"
 baka_quiz.14.d: "「なぜ空を飛べない？」――「バカだから！」という結論に全員が同意。これほど美しい合意形成は国連でも見られない。"
 baka_quiz.14.a: "翼を忘れてきたからだ！"

 baka_quiz.15.t: "クイズ第14問：歴史上最大のバカは？"
 baka_quiz.15.d: "「歴史上最大のバカは？」――全代表者が一斉に「自分だ！」と叫んだ。この瞬間、バカオリンピックは真の平等を達成した。"
 baka_quiz.15.a: "今ここにいる全員だ！"

 baka_quiz.16.t: "クイズ第15問：バカの末期症状は？"
 baka_quiz.16.d: "「バカの末期症状は？」――「バカオリンピックに参加していること」というメタ的回答が出たが、誰も気づかなかった。まさに末期症状である。"
 baka_quiz.16.a: "もっとバカになりたい！"

 baka_quiz.17.t: "クイズ第16問：無限大に何を足す？"
 baka_quiz.17.d: "「無限大に何を足す？」――「バカ！」という回答が全会一致で採択された。数学界は永久にこの出来事を認めないだろう。"
 baka_quiz.17.a: "∞＋1だ！"

 baka_quiz.18.t: "クイズ第17問：最後の晩餐に何を食べる？"
 baka_quiz.18.d: "「最後の晩餐に何を食べる？」――「バカのフルコース！」という回答に、シェフが卒倒した。しかしメニューの内容は誰も知らない。"
 baka_quiz.18.a: "ハンバーガー！"

 baka_quiz.19.t: "クイズ第18問：バカと感染ったら？"
 baka_quiz.19.d: "「バカと感染ったら？」――「バカになる！」これ以外にどんな回答があるというのか。バカオリンピック参加者は全員既に感染済みである。"
 baka_quiz.19.a: "もう感染ってるから問題ない！"

 baka_quiz.20.t: "バカオリンピック、閉幕！"
 baka_quiz.20.d: "激戦の末、第1回バカオリンピックは閉幕した。参加者全員が金メダルを要求し、審査員は逃げ出した。次回大会の開催は未定であるが、世界はこれほどバカな祭典を待ち望んでいる。"
 baka_quiz.20.a: "全員金メダルだ！"
