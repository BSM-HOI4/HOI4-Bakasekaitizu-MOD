l_japanese:
 # イベント: chile.1 - インカ帝国アンシュルス
 chile.1.t:0 "チリからのお誘い"
 chile.1.d:0 "チリ共和国より、我がインカ帝国の帰属に関する提案が届いた。彼らは圧倒的な軍事力を背景に、我々を従属させようとしている。しかし、我々には選択肢が残されている。彼らの要求を受け入れるか、拒絶して誇りを示すか、あるいは……金で解決するか。"
 chile.1.a:0 "彼らの要求を受け入れる"
 chile.1.b:0 "断固として拒否する！"
 chile.1.c:0 "金で売るという手もあるな……"
 # イベント: chile.2 - アンシュルス承認後
 chile.2.t:0 "インカ帝国の服従"
 chile.2.d:0 "インカ帝国が我々の要求を受け入れた。かつての栄光あるインカの地は今、チリの旗の下にある。新たな領土の住民たちを統合し、大チリの建設を進めよう。"
 chile.2.a:0 "大チリ万歳！"
 # イベント: chile.3 - アンシュルス拒否後
 chile.3.t:0 "インカの抵抗"
 chile.3.d:0 "インカ帝国が我々の要求を拒否した。彼らは戦いを選んだのだ。ならば、我々も力で示すほかない。チリ軍は直ちに作戦行動を開始せよ！"
 chile.3.a:0 "力で示す時だ"
 # イベント: chile.4 - 購入後
 chile.4.t:0 "インカ領土の取得"
 chile.4.d:0 "交渉の結果、インカ帝国は自らの領土を売却することに同意した。金で国を買うとは、歴史の皮肉よ。だが結果として、チリは新たな領土と資源を手に入れたのだ。"
 chile.4.a:0 "最高の買い物だったな"
 # イベント: chile.5 - 南アメリカ諸国への選択
 chile.5.t:0 "チリの脅威"
 chile.5.d:0 "チリが南アメリカの覇権を握ろうとする中、我々は決断を迫られている。ブラジルのファクションに参加して団結するか、単独で抵抗を続けるか。どちらの道も困難だが、選ばねばならない。"
 chile.5.a:0 "ブラジルと同盟を結ぶ"
 chile.5.b:0 "我々 alone で戦う！"
 # 国家方針: 政治ルート
 CHL_start_discuss:0 "政治議論の開始"
 CHL_start_discuss_desc:0 "チリの未来を決めるため、国民的議論を始めなければならない。我々は北へ進むか、それとも……きょぬーの道へ進むか。"
 CHL_adopt_longer_country:0 "国家の拡大を採用する"
 CHL_adopt_longer_country_desc:0 "チリは長い国である。だが、さらに長くすることもできる。北へ、そしてさらに北へ。アンデスの向こうに広がる可能性を追求しよう。"
 CHL_adopt_to_kyonu:0 "きょぬー主義への転換"
 CHL_adopt_to_kyonu_desc:0 "もはや領土拡大など些細なこと。チリが本当に目指すべきもの、それはきょぬーである。全てはきょぬーのために。"
 # 国家方針: 産業ルート
 CHL_start_pioneer:0 "開拓精神の復活"
 CHL_start_pioneer_desc:0 "チリの産業は未だ発展途上である。かつての開拓者たちのように、荒野を切り拓き、産業の基盤を築こう。"
 CHL_additional_factory_space_0:0 "工場用地の拡張 第一期"
 CHL_additional_factory_space_0_desc:0 "主要州における工場用地を拡張し、生産能力の向上を図る。"
 CHL_additional_factory_space_1:0 "工場用地の拡張 第二期"
 CHL_additional_factory_space_1_desc:0 "第一期の成功を基に、さらなる工場用地の拡張を実施する。"
 CHL_additional_factory_space_2:0 "工場用地の大幅拡張"
 CHL_additional_factory_space_2_desc:0 "工場用地の大規模拡張を行い、チリの工業生産能力を飛躍的に向上させる。生産スペースこそが力の源である。"
 CHL_add_infra_0:0 "インフラ整備 第一期"
 CHL_add_infra_0_desc:0 "国内の主要州におけるインフラストラクチャーの基盤整備を行う。"
 CHL_add_infra_1:0 "インフラ整備 第二期"
 CHL_add_infra_1_desc:0 "整備された基盤の上に、さらなるインフラ投資を行い、全土の連結性を高める。"
 CHL_add_infra_2:0 "全国インフラ大革命"
 CHL_add_infra_2_desc:0 "チリ全土の核心州に大規模なインフラ整備を行う。道路、鉄道、港湾——全てが連なり、国家は一つになる。"
 CHL_add_minju_0:0 "民需工場の建設 第一步"
 CHL_add_minju_0_desc:0 "民間需要に応えるため、主要州に民需工場を建設する。市民生活の向上が国家の力となる。"
 CHL_add_minju_1:0 "民需工場の拡大"
 CHL_add_minju_1_desc:0 "建設した民需工場をさらに拡大し、全国各地に新たな工場を配置する。"
 CHL_add_minju_2:0 "民需工場の大発展"
 CHL_add_minju_2_desc:0 "チリの民需産業を飛躍的に拡大させる。主要州および各地に民需工場を建設し、経済力を増強する。"
 CHL_add_gunju_0:0 "軍需工場の建設 第一步"
 CHL_add_gunju_0_desc:0 "国防のために、主要州に軍需工場を建設する。武力なくして独立なし。"
 CHL_add_gunju_1:0 "軍需工場の拡大"
 CHL_add_gunju_1_desc:0 "軍需工場をさらに拡大し、各地に兵器製造施設を配置する。"
 CHL_add_gunju_2:0 "軍需工場の大発展"
 CHL_add_gunju_2_desc:0 "チリの軍需産業を飛躍的に拡大させる。主要州および各地に軍需工場を建設し、軍事力を増強する。"
 # 国家方針: 研究ルート
 CHL_build_research_base:0 "研究機関の設立"
 CHL_build_research_base_desc:0 "産業の発展に伴い、チリ独自の研究機関を設立する。遅れを取った研究分野を急速にキャッチアップしなければならない。"
 CHL_industrial_company:0 "国策企業の設立"
 CHL_industrial_company_desc:0 "国家主導の産業企業を設立し、工業技術の発展を促進する。"
 CHL_industrial_construction:0 "建設技術の強化"
 CHL_industrial_construction_desc:0 "建設分野に注力し、チリのインフラ建設能力を高める。"
 CHL_industrial_production:0 "生産技術の強化"
 CHL_industrial_production_desc:0 "工業生産分野に注力し、チリの製造能力を高める。"
 CHL_construction_invest:0 "建設への大投資"
 CHL_construction_invest_desc:0 "建設技術に莫大な投資を行い、チリの建設能力を世界水準へ引き上げる。"
 CHL_mining_invest:0 "鉱業への大投資"
 CHL_mining_invest_desc:0 "チリの豊かな地下資源に注目し、鉱業に大規模な投資を行う。鋼材、ゴム、アルミニウム——大地の恵みを余すことなく活用する。"
 CHL_production_invest:0 "生産への大投資"
 CHL_production_invest_desc:0 "工業生産に莫大な投資を行い、チリの製造能力を飛躍的に向上させる。"
 CHL_war_company:0 "軍需企業の設立"
 CHL_war_company_desc:0 "歩兵装備の研究に特化した軍需企業を設立する。兵士たちに最良の装備を。"
 CHL_superior_power:0 "圧倒的火力の追求"
 CHL_superior_power_desc:0 "質において敵を圧倒する。砲兵と装甲、両方の力で敵を粉砕する。"
 CHL_superior_mass:0 "大衆の力"
 CHL_superior_mass_desc:0 "数の利を活かし、大量の歩兵と支援装備で敵を押し潰す。シンプルだが強力な戦略である。"
 CHL_armored_power:0 "機甲戦力の強化"
 CHL_armored_power_desc:0 "装甲部隊に注力し、機動戦の理論と技術を深める。戦車こそが近代戦の王である。"
 CHL_artillery_power:0 "砲兵戦力の強化"
 CHL_artillery_power_desc:0 "砲兵に注力し、圧倒的火力で敵陣を粉砕する。砲声と共に勝利は近づく。"
 CHL_enemy_is_not_only_infantry:0 "敵は歩兵だけではない"
 CHL_enemy_is_not_only_infantry_desc:0 "近代戦では歩兵だけでは勝てない。対戦車、防空、そしてドクトリンの研究を進め、あらゆる脅威に対応できる軍隊を構築する。"
 CHL_high_quality_tank:0 "高品質戦車の開発"
 CHL_high_quality_tank_desc:0 "質の高い戦車を少数精鋭で運用する。一台一台が戦場の主役となる。"
 CHL_produce_cheap_tank:0 "量産型戦車の生産"
 CHL_produce_cheap_tank_desc:0 "安価な戦車を大量生産し、数の利で戦場を制圧する。数は力なり。"
 CHL_true_power:0 "真の力"
 CHL_true_power_desc:0 "装甲と火力の両極を極めた先、そこに「真の力」が存在する。最強の戦車と最強の砲兵、その融合こそが究極の戦力である。工場100以上の産業力を背景に、チリ軍は世界最強への道を歩む。"
 CHL_believe_artillery:0 "砲兵への信仰"
 CHL_believe_artillery_desc:0 "戦車など不要だ。我々が信じるのは砲弾の雨のみ。砲兵技術とドクトリンに全力を注ぎ、圧倒的火力で全てを焼き払う。"
 CHL_armor_is_not_only_power:0 "装甲は力だけではない"
 CHL_armor_is_not_only_power_desc:0 "装甲はただの力ではない。未来への投資だ。最先端の装甲技術と機動戦ドクトリンを融合させ、次世代の機甲戦力を構築する。"
 CHL_mass_recruit:0 "大量徴兵の実施"
 CHL_mass_recruit_desc:0 "大衆の力を信じ、国民から大量に兵士を徴集する。数こそが最大の武器である。"
 CHL_mass_army:0 "大衆軍の建設"
 CHL_mass_army_desc:0 "徴兵した兵士たちを組織化し、大衆軍としての体を整える。支援装備と大攻勢ドクトリンで武装する。"
 CHL_mass_mass_mass:0 "マス・マス・マス！"
 CHL_mass_mass_mass_desc:0 "もっとだ、もっと兵士が必要だ！マス！マス！マス！大量動員と大攻勢ドクトリンの究極形。数の暴力で全てを押し潰せ！"
 CHL_air_company:0 "航空企業の設立"
 CHL_air_company_desc:0 "軽航空機の研究に特化した航空企業を設立する。空を制する者が戦争を制する。"
 CHL_air_support_land:0 "陸軍への航空支援"
 CHL_air_support_land_desc:0 "地上部隊を直接支援する航空戦力に注力する。近接航空支援と戦場支援ドクトリンで、空と地の連携を強化する。"
 CHL_air_strategy_bomb:0 "戦略爆撃の研究"
 CHL_air_strategy_bomb_desc:0 "戦術爆撃機と戦略爆撃機の研究に注力する。敵の心臓部を空から叩き潰す。"
 CHL_coop_with_naval:0 "海軍との協同"
 CHL_coop_with_naval_desc:0 "海軍航空隊の研究を進め、空と海の連携を強化する。洋上の制空権が海戦の鍵を握る。"
 CHL_see_bomb:0 "海の爆撃"
 CHL_see_bomb_desc:0 "海軍爆撃機の研究に注力し、海上目標への打撃力を強化する。船は沈むためにある。"
 CHL_air_focus_to_doctrine:0 "航空ドクトリンへの傾注"
 CHL_air_focus_to_doctrine_desc:0 "航空ドクトリンの研究に全力を注ぐ。理論こそが実践を導く。"
 CHL_air_focus_to_equipment:0 "航空機材への傾注"
 CHL_air_focus_to_equipment_desc:0 "最先端の航空機材開発に全力を注ぐ。技術的優位性が空の支配権を決める。"
 CHL_naval_company:0 "海軍企業の設立"
 CHL_naval_company_desc:0 "海軍装備の研究に特化した企業を設立する。海を制する者が世界を制する。"
 CHL_naval_doctrine:0 "海軍ドクトリンの研究"
 CHL_naval_doctrine_desc:0 "海軍ドクトリンの研究に注力し、チリ海軍の戦術・戦略を体系化する。"
 CHL_naval_air:0 "海軍航空隊の強化"
 CHL_naval_air_desc:0 "海軍航空と海軍ドクトリンの両方を強化し、空海統合作戦の能力を高める。"
 CHL_naval_equip:0 "海軍装備の強化"
 CHL_naval_equip_desc:0 "海軍装備と海軍ドクトリンの両方を強化し、質の高い艦隊を構築する。"
 CHL_additional_research_slot:0 "追加研究枠の確保"
 CHL_additional_research_slot_desc:0 "十分な研究力と120以上の工場を背景に、新たな研究部門を設立する。知識こそが最大の武器である。"
 # 国家方針: 海軍ルート
 CHL_invest_to_naval:0 "海軍への投資"
 CHL_invest_to_naval_desc:0 "チリの長い海岸線を守るため、海軍に投資を行う。造船所の建設と海軍技術の研究を推進する。"
 CHL_superior_tech_0:0 "海軍技術の重視"
 CHL_superior_tech_0_desc:0 "質の高い艦船を少数建造する戦略。技術的優位性で敵艦隊を圧倒する。"
 CHL_superior_tech_1:0 "海軍技術の更なる追求"
 CHL_superior_tech_1_desc:0 "第一段階の成果を基に、さらなる技術的優位を追求する。次世代の海軍技術を我が物とする。"
 CHL_superior_mass_0:0 "海軍の大量建造"
 CHL_superior_mass_0_desc:0 "数の利を活かし、大量の艦船を建造する。造船所を拡張し、次々と艦を進水させる。"
 CHL_superior_mass_1:0 "海軍の更なる大量建造"
 CHL_superior_mass_1_desc:0 "建造ペースをさらに加速し、圧倒的な数の艦隊で海を埋め尽くす。"
 CHL_capital_naval_base:0 "首都海軍基地の建設"
 CHL_capital_naval_base_desc:0 "サンティアゴ周辺に大規模な海軍基地を建設する。沿岸防御と海軍インフラを整備し、太平洋への出口を確固たるものにする。"
 CHL_empire_naval:0 "帝国海軍の創設"
 CHL_empire_naval_desc:0 "南アメリカ覇者として、帝国にふさわしい海軍を創設する。最新鋭の巡洋艦と戦艦で大洋を支配する。"
 CHL_strongest_naval:0 "最強の海軍へ"
 CHL_strongest_naval_desc:0 "30以上の海軍工場を擁する大チリ帝国。その産業力を背景に、世界最強の海軍を目指す。"
 CHL_last_naval:0 "究極の海軍"
 CHL_last_naval_desc:0 "60以上の海軍工場が可能にする究極の艦隊建造。これがチリ海軍の最終形態である。大海の支配者として、誰も我々に挑むことはできない。"
 # 国家方針: 拡張ルート（領土拡大派）
 CHL_treat_with_inka:0 "インカ帝国との交渉"
 CHL_treat_with_inka_desc:0 "かつてのインカ帝国の遺産は、チリの拡大において避けて通れない。交渉により彼らの領土を我々のものとする。平和的にせよ、力によってせよ——アンデスの地はチリのものだ。"
 CHL_summon_pioneer:0 "開拓者たちの召喚"
 CHL_summon_pioneer_desc:0 "特別な顧問たちをチリに招く。彼らは神、巫女、魔女——あらゆる分野の達人であり、チリの国力向上に貢献するだろう。"
 CHL_advise_of_pioneer:0 "開拓者たちの助言"
 CHL_advise_of_pioneer_desc:0 "開拓者たちの知恵を借り、チリ軍の師団テンプレートを整備する。歩兵、砲兵、対空、駐屯、海兵、機甲——あらゆる局面に対応する軍隊を構築する。"
 CHL_alli_with_pioneer:0 "開拓者たちとの盟約"
 CHL_alli_with_pioneer_desc:0 "三人の開拓者をチリ軍の指揮官として迎える。神と呼ばれる元帥、巫女と呼ばれる将軍、魔女と呼ばれる将軍——彼らの力がチリ軍を無敵にする。"
 CHL_get_inka:0 "インカの継承"
 CHL_get_inka_desc:0 "インカ帝国が我々の要求を受け入れた。平和的な統合を完了し、新たなファクションを形成する。アンデスの地は今、チリと共にある。"
 CHL_won_inka:0 "インカの征服"
 CHL_won_inka_desc:0 "力によってインカの地を奪取した。かつてのインカ帝国の核心州は今やチリのコアである。インカを解放しつつ、南アメリカの新秩序を構築する。"
 CHL_buy_inka:0 "インカの購入"
 CHL_buy_inka_desc:0 "金で領土を買う。歴史に残る商取引だ。インカの地はチリのものとなり、両国は一つのファクションの下に結ばれる。"
 CHL_treat_with_south_america:0 "南アメリカ諸国との同盟"
 CHL_treat_with_south_america_desc:0 "南アメリカの諸国と手を組み、大陸の安定を図る。協力と共存こそが真の強さである。"
 CHL_fate_of_south_america:0 "南アメリカの運命"
 CHL_fate_of_south_america_desc:0 "南アメリカ諸国との対立を決意する。彼らは障害に過ぎない。チリの北進を阻むものは、誰であれ排除する。"
 CHL_aim_all_coast:0 "全海岸への野望"
 CHL_aim_all_coast_desc:0 "チリは海岸国家である。そして、全ての海岸はチリのものとなるべきだ。ファシズムの旗の下、緊急動員を発令し、全ての海岸線を手中に収める。"
 CHL_get_all_south_america:0 "南アメリカの制圧"
 CHL_get_all_south_america_desc:0 "南アメリカの全海岸州に請求権を主張する。アルゼンチン、ブラジル、ポルトガル領、そしてスペイン——全てがチリの敵となる。大海の戦争が始まる。"
 CHL_won_in_south_america:0 "南アメリカ覇権の確立"
 CHL_won_in_south_america_desc:0 "南アメリカの全海岸州がチリのものとなった。かつての敵国の核心州を剥奪し、インカには内陸を返還する。チリは南アメリカの支配者である。"
 CHL_go_north_america:0 "北アメリカへの進出"
 CHL_go_north_america_desc:0 "南アメリカを制したチリの次なる標的は北アメリカである。北の大海岸線がチリを待っている。"
 CHL_won_north_america:0 "北アメリカの制圧"
 CHL_won_north_america_desc:0 "北アメリカの海岸州がチリのコアとなった。インカの領土を合衆国に譲渡し、内陸部は傀儡国家として統治する。大西洋から太平洋まで、全ての海岸はチリのもの。"
 CHL_go_africa:0 "アフリカへの進出"
 CHL_go_africa_desc:0 "大西洋を渡り、アフリカ大陸の海岸線に請求権を主張する。かつての植民地帝国の遺産を、今度はチリが受け継ぐ。"
 CHL_won_africa:0 "アフリカの制圧"
 CHL_won_africa_desc:0 "アフリカの全海岸州がチリのものとなった。アフリカ大陸の海岸線は全てチリ国旗の下にある。"
 CHL_asia:0 "アジアへの進出"
 CHL_asia_desc:0 "太平洋を渡り、アジアとオーストラリアの海岸線に請求権を主張する。太平洋の名の通り、チリの海となる。"
 CHL_won_asia:0 "アジアの制圧"
 CHL_won_asia_desc:0 "アジアとオーストラリアの全海岸州がチリのものとなった。太平洋の両岸からインド洋まで、チリの海岸線は終わりを知らない。"
 CHL_revenge_europe:0 "ヨーロッパへの復讐"
 CHL_revenge_europe_desc:0 "かつてヨーロッパの列強たちは南アメリカを植民地とした。今度はチリがヨーロッパの海岸線を主張する番だ。歴史の皮肉を味わえ。"
 CHL_won_europe:0 "ヨーロッパの制圧"
 CHL_won_europe_desc:0 "ヨーロッパの全海岸州がチリのものとなった。かつての列強たちは今、チリの前に膝を屈している。"
 CHL_go_mid_east:0 "中東への進出"
 CHL_go_mid_east_desc:0 "中東の海岸線に請求権を主張する。石油の地も、またチリの海岸となる。"
 CHL_won_mid_east:0 "中東の制圧"
 CHL_won_mid_east_desc:0 "中東の全海岸州がチリのものとなった。ペルシャ湾から紅海まで、全ての海岸がチリを冠する。"
 CHL_get_all_coast:0 "全海岸の獲得"
 CHL_get_all_coast_desc:0 "ついに達した。南アメリカ、北アメリカ、アフリカ、アジア、ヨーロッパ、中東——全世界の海岸線がチリのものとなった。チリはもはや一つの国ではない。「海岸」そのものなのだ。"
 # 国家方針: きょぬー神ルート
 CHL_adopt_to_god:0 "きょぬー神への信仰"
 CHL_adopt_to_god_desc:0 "きょぬーは単なる主義ではない。信仰である。神話学的な信仰体制を確立し、きょぬー神を国教とする。異教徒に慈悲なし。"
 CHL_kyonu_revolution:0 "きょぬー革命"
 CHL_kyonu_revolution_desc:0 "革命だ！きょぬーの理念を全国に拡散し、世界をきょぬーで包み込む。政治的影響力を高め、きょぬーの信徒を増やせ。全てはきょぬーのために！"
