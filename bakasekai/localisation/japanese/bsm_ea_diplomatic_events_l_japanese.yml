l_japanese:
 # Join Request (received by Leader)
 bsm_ea_diplomatic.1.t:0 "[FROM.GetName]からの経済同盟加盟申請"
 bsm_ea_diplomatic.1.d:0 "[FROM.GetName]が我が国の経済同盟への加盟を希望しています。彼らの申請を受け入れますか？"
 bsm_ea_diplomatic.1.a:0 "歓迎する"
 bsm_ea_diplomatic.1.b:0 "拒否する"

 # Join Request Accepted (notification to requester)
 bsm_ea_diplomatic.11.t:0 "経済同盟加盟申請が承認されました"
 bsm_ea_diplomatic.11.d:0 "[FROM.GetName]が我が国の経済同盟加盟申請を承認しました。我々は正式に[FROM.GetEAName]の一員となりました。"
 bsm_ea_diplomatic.11.a:0 "素晴らしい"

 # Join Request Rejected (notification to requester)
 bsm_ea_diplomatic.12.t:0 "経済同盟加盟申請が拒否されました"
 bsm_ea_diplomatic.12.d:0 "[FROM.GetName]が我が国の経済同盟加盟申請を拒否しました。"
 bsm_ea_diplomatic.12.a:0 "残念だ"

 # Leave Notification (received by Leader)
 bsm_ea_diplomatic.2.t:0 "[FROM.GetName]が経済同盟を離脱"
 bsm_ea_diplomatic.2.d:0 "[FROM.GetName]が我が国の経済同盟から離脱しました。"
 bsm_ea_diplomatic.2.a:0 "了解"

 # Kick Notification (received by kicked Member)
 bsm_ea_diplomatic.3.t:0 "経済同盟から追放されました"
 bsm_ea_diplomatic.3.d:0 "[FROM.GetName]が我が国を経済同盟から追放しました。"
 bsm_ea_diplomatic.3.a:0 "許さない..."

 # Invite (received by potential Member)
 bsm_ea_diplomatic.4.t:0 "[FROM.GetName]からの経済同盟招待"
 bsm_ea_diplomatic.4.d:0 "[FROM.GetName]が我が国を[FROM.GetEAName]に招待しています。この招待を受け入れますか？"
 bsm_ea_diplomatic.4.a:0 "喜んで参加する"
 bsm_ea_diplomatic.4.b:0 "丁重にお断りする"

 # Invite Accepted (notification to Leader)
 bsm_ea_diplomatic.41.t:0 "[FROM.GetName]が招待を受諾"
 bsm_ea_diplomatic.41.d:0 "[FROM.GetName]が我が国の経済同盟への招待を受け入れました。"
 bsm_ea_diplomatic.41.a:0 "歓迎する"

 # Invite Rejected (notification to Leader)
 bsm_ea_diplomatic.42.t:0 "[FROM.GetName]が招待を拒否"
 bsm_ea_diplomatic.42.d:0 "[FROM.GetName]が我が国の経済同盟への招待を拒否しました。"
 bsm_ea_diplomatic.42.a:0 "残念だ"

 # Create Alliance Proposal (received by potential co-founder)
 bsm_ea_diplomatic.5.t:0 "[FROM.GetName]からの経済同盟創設提案"
 bsm_ea_diplomatic.5.d:0 "[FROM.GetName]が我が国と共同で新しい経済同盟を創設することを提案しています。[FROM.GetName]が盟主となり、我が国は創設メンバーとして参加します。"
 bsm_ea_diplomatic.5.a:0 "提案を受け入れる"
 bsm_ea_diplomatic.5.b:0 "提案を拒否する"

 # Create Alliance Accepted (notification to proposer)
 bsm_ea_diplomatic.51.t:0 "[FROM.GetName]が経済同盟創設提案を受諾"
 bsm_ea_diplomatic.51.d:0 "[FROM.GetName]が我が国の経済同盟創設提案を受け入れました。我々は新しい経済同盟の盟主となりました！"
 bsm_ea_diplomatic.51.a:0 "素晴らしい"

 # Create Alliance Rejected (notification to proposer)
 bsm_ea_diplomatic.52.t:0 "[FROM.GetName]が経済同盟創設提案を拒否"
 bsm_ea_diplomatic.52.d:0 "[FROM.GetName]が我が国の経済同盟創設提案を拒否しました。"
 bsm_ea_diplomatic.52.a:0 "残念だ"
