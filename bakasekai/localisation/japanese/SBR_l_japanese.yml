l_japanese:
# [superseded by canonical definition] SBR_free_declaration:0 "自由の宣言"
# [superseded by canonical definition] SBR_free_declaration_desc:0 "凍てつく大地シベリアよ、鎖を断ち切れ。我らは自由を宣言する。"
# [superseded by canonical definition] SBR_internal_order:0 "国内秩序の確立"
# [superseded by canonical definition] SBR_internal_order_desc:0 "混沌としたシベリアに秩序をもたらす。まずは足場を固めねばなるまい。"
# [superseded by canonical definition] SBR_siberian_resource:0 "シベリアの資源"
# [superseded by canonical definition] SBR_siberian_resource_desc:0 "この大地は冷たいが、鋼と木材は豊かにある。資源を掘り起こせ。"
# [superseded by canonical definition] SBR_path_ruin:0 "廃墟の道"
# [superseded by canonical definition] SBR_path_ruin_desc:0 "文明など幻だ。我らは破壊の果てに真の強さを見出す。廃墟こそが揺り籠だ。"
# [superseded by canonical definition] SBR_path_holy:0 "神話の道"
# [superseded by canonical definition] SBR_path_holy_desc:0 "シャーマンの太鼓が鳴り響く。古代の精霊たちがシベリアを再び導くのだ。"
# [superseded by canonical definition] SBR_path_red:0 "赤き道"
# [superseded by canonical definition] SBR_path_red_desc:0 "プロレタリアートよ、立ち上がれ！シベリアの雪原に赤旗を掲げる時が来た。"
# [superseded by canonical definition] SBR_ruin_doctrine:0 "廃墟の軍事教義"
# [superseded by canonical definition] SBR_ruin_doctrine_desc:0 "正規の戦術など不要だ。生き残った者だけが正しい。荒ぶる教義を策定せよ。"
# [superseded by canonical definition] SBR_ruin_war_economy:0 "戦時経済の構築"
# [superseded by canonical definition] SBR_ruin_war_economy_desc:0 "工場を軍需に転換し、破壊のための生産を始める。全ては戦火のために。"
# [superseded by canonical definition] SBR_ruin_purge:0 "粛清の嵐"
# [superseded by canonical definition] SBR_ruin_purge_desc:0 "弱者と裏切り者を一掃する。血が流れるたびに、国家は強くなる……はずだ。"
# [superseded by canonical definition] SBR_ruin_blitzkrieg:0 "電撃戦の教え"
# [superseded by canonical definition] SBR_ruin_blitzkrieg_desc:0 "機甲部隊で凍土を突っ切る。敵が気づく前に、全てを灰にする。"
# [superseded by canonical definition] SBR_ruin_arsenal:0 "廃墟の兵器廠"
# [superseded by canonical definition] SBR_ruin_arsenal_desc:0 "武器を大量生産し、破壊の準備を整える。弾薬こそが通貨だ。"
# [superseded by canonical definition] SBR_ruin_sov_ultimatum:0 "ソ連への最後通牒"
# [superseded by canonical definition] SBR_ruin_sov_ultimatum_desc:0 "モスクワの偽りの権力者どもに告ぐ。シベリアは我らのものだ。立ち退け。"
# [superseded by canonical definition] SBR_ruin_total_mobilization:0 "総動員令"
# [superseded by canonical definition] SBR_ruin_total_mobilization_desc:0 "老人も子供も、全てを戦場へ。シベリアの壁は血と鋼でできている。"
# [superseded by canonical definition] SBR_ruin_west_reclaim:0 "西方領土の回収"
# [superseded by canonical definition] SBR_ruin_west_reclaim_desc:0 "かつてロシア帝国が支配した地を、廃墟の力で奪還する。西へ進め。"
# [superseded by canonical definition] SBR_ruin_south_conquest:0 "南方征服"
# [superseded by canonical definition] SBR_ruin_south_conquest_desc:0 "中央アジアの広野も我らの前にひれ伏す。南への道を切り拓け。"
# [superseded by canonical definition] SBR_ruin_convergence:0 "廃墟の収束"
# [superseded by canonical definition] SBR_ruin_convergence_desc:0 "四方からの侵攻が一つに結びつく。廃墟の帝国がここに完成する。"
# [superseded by canonical definition] SBR_holy_shaman:0 "大シャーマンの儀式"
# [superseded by canonical definition] SBR_holy_shaman_desc:0 "大シャーマンが精霊界との交信を開始する。霊的な導きが民を癒やす。"
# [superseded by canonical definition] SBR_holy_divine_army:0 "神聖軍の結成"
# [superseded by canonical definition] SBR_holy_divine_army_desc:0 "精霊の加護を受けた兵士たち。彼らは信仰という名の鎧を纏っている。"
# [superseded by canonical definition] SBR_holy_theocracy:0 "神権政治の樹立"
# [superseded by canonical definition] SBR_holy_theocracy_desc:0 "シャーマン評議会が国政を司る。天の意志が地上に実現するのだ。"
# [superseded by canonical definition] SBR_holy_prophecy:0 "予言の解読"
# [superseded by canonical definition] SBR_holy_prophecy_desc:0 "古代の予言書が科学技術の方向性を示す。神秘と知の融合が始まる。"
# [superseded by canonical definition] SBR_holy_crusade:0 "聖戦の宣言"
# [superseded by canonical definition] SBR_holy_crusade_desc:0 "不信仰者に対する聖戦が宣言される。精霊の名において、戦え。"
# [superseded by canonical definition] SBR_holy_sacred_decree:0 "神聖なる勅令"
# [superseded by canonical definition] SBR_holy_sacred_decree_desc:0 "天上からの命令は一つ。西の地を精霊の名において取り戻せ。"
# [superseded by canonical definition] SBR_holy_holy_industry:0 "神聖産業の興隆"
# [superseded by canonical definition] SBR_holy_holy_industry_desc:0 "祈りと労働は同じだ。工場を建てることもまた、天への奉仕である。"
# [superseded by canonical definition] SBR_holy_west_return:0 "西方への帰還"
# [superseded by canonical definition] SBR_holy_west_return_desc:0 "かつて精霊が守護した西方の地。信仰の力をもって再び聖別する。"
# [superseded by canonical definition] SBR_holy_south_mission:0 "南方布教団"
# [superseded by canonical definition] SBR_holy_south_mission_desc:0 "精霊の言葉を南方の民にも届ける。布教は征服の別名だ。"
# [superseded by canonical definition] SBR_holy_convergence:0 "神話の収束"
# [superseded by canonical definition] SBR_holy_convergence_desc:0 "四方から信仰が集結する。精霊たちが祝す、聖なるシベリアの完成だ。"
# [superseded by canonical definition] SBR_red_workers:0 "労働者の蜂起"
# [superseded by canonical definition] SBR_red_workers_desc:0 "シベリアの労働者たちよ、工場を掌握せよ。市民建設で基盤を築く。"
# [superseded by canonical definition] SBR_red_army_rebuild:0 "赤軍の再建"
# [superseded by canonical definition] SBR_red_army_rebuild_desc:0 "古き良き赤軍の伝統を受け継ぎ、新たな人民軍を建設する。"
# [superseded by canonical definition] SBR_red_collectivization:0 "集団化の推進"
# [superseded by canonical definition] SBR_red_collectivization_desc:0 "土地も労働も、全ては人民のものだ。集団化で豊かなシベリアを。"
# [superseded by canonical definition] SBR_red_heavy_industry:0 "重工業の振興"
# [superseded by canonical definition] SBR_red_heavy_industry_desc:0 "社会主義工業化の波がシベリアに押し寄せる。工場の煙が進歩の証だ。"
# [superseded by canonical definition] SBR_red_purge_bourgeois:0 "ブルジョワ粛清"
# [superseded by canonical definition] SBR_red_purge_bourgeois_desc:0 "人民の敵を一掃する。革命のために、いくばくかの犠牲はやむを得ない。"
# [superseded by canonical definition] SBR_red_absorb_sov:0 "ソ連の吸収"
# [superseded by canonical definition] SBR_red_absorb_sov_desc:0 "モスクワの修正主義者どもに代わり、真の社会主義をシベリアから実現する。"
# [superseded by canonical definition] SBR_red_eastern:0 "東方進出"
# [superseded by canonical definition] SBR_red_eastern_desc:0 "革命の火を東方へ広げる。アジアの民よ、立ち上がるのだ。"
# [superseded by canonical definition] SBR_red_sov_integrate:0 "ソ連領土の統合"
# [superseded by canonical definition] SBR_red_sov_integrate_desc:0 "旧ソ連のインフラを活用し、社会主義連邦を統合する。赤い帝国の完成だ。"
# [superseded by canonical definition] SBR_red_south_advance:0 "南方進攻"
# [superseded by canonical definition] SBR_red_south_advance_desc:0 "中央アジアにも革命を。南への前進は人民の意志である。"
# [superseded by canonical definition] SBR_red_convergence:0 "赤き収束"
# [superseded by canonical definition] SBR_red_convergence_desc:0 "東西南北から赤旗が集う。真の社会主義シベリアがここに誕生する。"
# [superseded by canonical definition] SBR_saint_siberia_glory:0 "聖シベリアの栄光"
# [superseded by canonical definition] SBR_saint_siberia_glory_desc:0 "いかなる道を歩もうと、シベリアは永遠なり。凍土の王者が世界を照らす。"
# [superseded by canonical definition] SBR_spirit_order:0 "秩序の精神"
# [superseded by canonical definition] SBR_spirit_order_desc:0 "混沌の中に秩序を求める精神。行政効率がわずかに向上する。"
# [superseded by canonical definition] SBR_spirit_ruinism_fervor:0 "廃墟の狂信"
# [superseded by canonical definition] SBR_spirit_ruinism_fervor_desc:0 "破壊こそ救済。廃墟を愛する者たちの熱狂が戦意を高める。"
# [superseded by canonical definition] SBR_spirit_holy_mandate:0 "神聖なる天命"
# [superseded by canonical definition] SBR_spirit_holy_mandate_desc:0 "精霊の導きが国家の安定をもたらす。天命を受けし民は動じない。"
# [superseded by canonical definition] SBR_spirit_red_vanguard:0 "赤き先鋒"
# [superseded by canonical definition] SBR_spirit_red_vanguard_desc:0 "革命の先頭に立つ前衛部隊。社会主義の旗の下に結集する。"
# [superseded by canonical definition] SBR_spirit_theocracy:0 "神権統治"
# [superseded by canonical definition] SBR_spirit_theocracy_desc:0 "シャーマン評議会による統治。天意が政治を導く。"
# [superseded by canonical definition] SBR_spirit_siberian_bastion:0 "シベリアの要塞"
# [superseded by canonical definition] SBR_spirit_siberian_bastion_desc:0 "凍土そのものが城塞となる。侵攻する者は凍え死ぬだろう。"
# [superseded by canonical definition] SBR_ruin_west_reclaim_tt:0 "西方の領土主張を獲得する。"
# [superseded by canonical definition] SBR_ruin_south_conquest_tt:0 "南方への領土主張を獲得する。"
# [superseded by canonical definition] SBR_ruin_convergence_tt:0 "廃墟帝国が完成する。政治力と戦意が大幅に向上する。"
# [superseded by canonical definition] SBR_holy_sacred_decree_tt:0 "神聖なる勅令により、西方への領土主張と開戦理由を獲得する。"
# [superseded by canonical definition] SBR_holy_west_return_tt:0 "精霊の名において、西方の領土主張を獲得する。"
# [superseded by canonical definition] SBR_holy_south_mission_tt:0 "布教団の進出により、南方の領土主張と人的資源を獲得する。"
# [superseded by canonical definition] SBR_holy_convergence_tt:0 "神聖シベリアが完成する。安定と政治力が大幅に向上する。"
# [superseded by canonical definition] SBR_red_absorb_sov_tt:0 "真の社会主義の旗を掲げ、ソ連への puppet 戦争目標を獲得する。"
# [superseded by canonical definition] SBR_red_sov_integrate_tt:0 "旧ソ連領土を統合し、産業を強化する。"
# [superseded by canonical definition] SBR_red_south_advance_tt:0 "革命の波を南方へ拡大する。"
# [superseded by canonical definition] SBR_red_convergence_tt:0 "赤き社会主義シベリアが完成する。軍需工場が増設される。"
# [superseded by canonical definition] SBR_saint_siberia_glory_tt:0 "三つの道は一つに収束する。聖シベリアとしての栄光が確定する。"
