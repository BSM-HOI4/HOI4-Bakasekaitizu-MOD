l_japanese:
 # NSI イベント
 nsi_events.1.t:0 "地下都市の拡張完了"
 nsi_events.1.d:0 "地下空洞の新たな区画が開拓された。チカトシの技術者たちが岩盤を削り出し、居住区と作業場を拡張している。地下帝国は着実にその版図を広げつつある。"
 nsi_events.1.a:0 "さらなる拡張の礎としよう"

 nsi_events.2.t:0 "古代遺物の発見"
 nsi_events.2.d:0 "地下深くの発掘作業中に、かつてないほどの規模の古代遺物が発見された。その表面には今も微かに光を放つ不可解な紋章が刻まれている。チカトシの祭祀長はこれを太古の叡智の証と断じた。"
 nsi_events.2.a:0 "遺物の知識を解読せよ"
 nsi_events.2.b:0 "軍事的応用を探れ"

 nsi_events.3.t:0 "外界からの接触を拒絶する"
 nsi_events.3.d:0 "地上の国家が我々の境界に接近しつつある。地下帝国の孤立は単なる政策ではない——それは先祖代々の誓いであり、我々が外界を守護するための鍵である。門を閉ざし、結界を強化せねばならない。"
 nsi_events.3.a:0 "外界との接触を一切遮断せよ"

 nsi_events.4.t:0 "守護霊の加護"
 nsi_events.4.d:0 "地下の聖堂に神秘の光が満ちた。守護霊たちが我々の歩みを肯定的に見守っている。祭祀長は霊界からの託宣を受け取り、民衆は勇気づけられている。"
 nsi_events.4.a:0 "守護霊に感謝を捧げよう"

 nsi_events.5.t:0 "沈黙の帝国が覚醒する"
 nsi_events.5.d:0 "外部勢力がNSIに対して戦争を仕掛けた。千年にわたる隔離の誓いは破られ、地下帝国は覚醒を余儀なくされた。古代の力が目覚め、世界はかつてない脅威に直面しようとしている。"
 nsi_events.5.a:0 "古代の力を解放せよ！"

 nsi_events.6.t:0 "禁断の研究突破"
 nsi_events.6.d:0 "神秘科学の深淵において、研究者たちが画期的な発見を遂げた。時空の法則を歪める知識、物質の本質を透視する技法——これらは太古の賢者たちが封印した叡智の断片である。超越の道が開かれた。"
 nsi_events.6.a:0 "電子工学の神秘を解き明かせ"
 nsi_events.6.b:0 "産業の神秘を応用せよ"

 nsi_events.7.t:0 "地下農場の拡張"
 nsi_events.7.d:0 "地下都市の人口増加に対応するため、農場区画の拡張が提案されている。地下に広がる光の苔を利用した特殊な農法により、地上と遜色ない収穫が見込める。地下大都市の力を持ってすれば、この事業も容易い。"
 nsi_events.7.a:0 "工業区画を拡張せよ"
 nsi_events.7.b:0 "人口を増やし、民を養え"

 nsi_events.8.t:0 "神秘的現象の観測"
 nsi_events.8.d:0 "地下空間の随所で不可解な現象が報告されている。壁面に浮かび上がる古代文字、時空の歪みから漏れ出す光、守護霊たちの活発な交流——これらは超越的な力の覚醒を示唆している。"
 nsi_events.8.a:0 "現象を観測し、知識を蓄積せよ"
 nsi_events.8.b:0 "現象のエネルギーを建設に転用せよ"

 nsi_events.100.t:0 "【速報】沈黙の帝国が覚醒"
 nsi_events.100.d:0 "東方の地下に眠ると伝えられてきた古代帝国NSIが、ついにその扉を開いた。千年の時を経て蘇った文明の力は計り知れず、世界の軍事均衡は根本から覆ろうとしている。"
 nsi_events.100.a:0 "なんという脅威だ……"
 nsi_events.100.b:0 "世界に我々の力を示す時だ"

 # NSI 決定カテゴリ
 NSI_internal_development:0 "NSI：内部開発"
 NSI_awakened_actions:0 "NSI：覚醒帝国の行動"

 # NSI 決定
 NSI_expand_underground_city:0 "地下都市を拡張する"
 NSI_strengthen_defenses:0 "防衛陣地を強化する"
 NSI_spiritual_meditation:0 "精神的瞑想を行う"
 NSI_ancient_research:0 "古代の研究を進める"
 NSI_recruit_elite_warriors:0 "精鋭戦士を徴兵する"
 NSI_commune_with_spirits:0 "守護霊と交信する"
 NSI_mobilize_ancient_arsenal:0 "古代の兵器庫を動員する"
 NSI_divine_wrath:0 "神罰を下す"
 NSI_reality_alteration:0 "現実を改変する"
 NSI_temporal_manipulation:0 "時間を操作する"
