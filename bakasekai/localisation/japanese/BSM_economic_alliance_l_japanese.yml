l_japanese:
 bsm_action_create_economic_alliance:0 "経済同盟の結成"
 bsm_economic_alliance_actions.5.t:0 "経済同盟の結成提案"
 bsm_economic_alliance_actions.5.d:0 "[FROM.GetName]から、我々と共に新たな経済同盟を結成する提案が届きました。"
 bsm_economic_alliance_actions.5.a:0 "提案を受け入れる"
 bsm_economic_alliance_actions.5.b:0 "断る"
 bsm_economic_alliance_actions.51.t:0 "提案が受け入れられました"
 bsm_economic_alliance_actions.51.d:0 "[FROM.GetName]は、我々の経済同盟結成の提案に同意しました。"
 bsm_economic_alliance_actions.52.t:0 "提案が拒否されました"
 bsm_economic_alliance_actions.52.d:0 "[FROM.GetName]は、我々の提案を拒否しました。"
 
 # Initial Diplomatic Actions
 BSM_ACTION_JOIN_ECONOMIC_ALLIANCE_TITLE:0 "経済同盟への加盟申請"
 BSM_ACTION_JOIN_ECONOMIC_ALLIANCE_DESC:0 "この国が主導する経済同盟への加盟を申請します。"

 BSM_ACTION_LEAVE_ECONOMIC_ALLIANCE_TITLE:0 "経済同盟からの脱退"
 BSM_ACTION_LEAVE_ECONOMIC_ALLIANCE_DESC:0 "この国が主導する経済同盟から脱退します。"

 BSM_ACTION_KICK_FROM_ECONOMIC_ALLIANCE_TITLE:0 "経済同盟からの追放"
 BSM_ACTION_KICK_FROM_ECONOMIC_ALLIANCE_DESC:0 "この国を我々の経済同盟から追放します。"

 BSM_ACTION_INVITE_TO_ECONOMIC_ALLIANCE_TITLE:0 "経済同盟への勧誘"
 BSM_ACTION_INVITE_TO_ECONOMIC_ALLIANCE_DESC:0 "この国を我々の経済同盟へ勧誘します。"

 BSM_ACTION_CREATE_ECONOMIC_ALLIANCE_TITLE:0 "経済同盟の結成"
 BSM_ACTION_CREATE_ECONOMIC_ALLIANCE_DESC:0 "この国と我々の経済同盟を結成します。"


 # Events
 bsm_economic_alliance_actions.1.t:0 "経済同盟加盟申請"
 bsm_economic_alliance_actions.1.d:0 "[FROM.GetName]が我々の経済同盟への加盟を希望しています。"
 bsm_economic_alliance_actions.1.a:0 "承認する"
 bsm_economic_alliance_actions.1.b:0 "拒否する"
 
 bsm_economic_alliance_actions.11.t:0 "加盟申請の承認"
 bsm_economic_alliance_actions.11.d:0 "[FROM.GetName]は我々の加盟申請を承認しました！"
 
 bsm_economic_alliance_actions.12.t:0 "加盟申請の拒否"
 bsm_economic_alliance_actions.12.d:0 "[FROM.GetName]は我々の加盟申請を拒否しました。"

 bsm_economic_alliance_actions.2.t:0 "加盟国の脱退"
 bsm_economic_alliance_actions.2.d:0 "[FROM.GetName]が経済同盟からの脱退を通告してきました。"
 
 bsm_economic_alliance_actions.3.t:0 "経済同盟からの追放"
 bsm_economic_alliance_actions.3.d:0 "[FROM.GetName]により、経済同盟から追放されました。"
 
 bsm_economic_alliance_actions.4.t:0 "経済同盟への勧誘"
 bsm_economic_alliance_actions.4.d:0 "[FROM.GetName]から経済同盟への勧誘が届いています。"
 bsm_economic_alliance_actions.4.a:0 "参加する"
 bsm_economic_alliance_actions.4.b:0 "断る"
 
 bsm_economic_alliance_actions.41.t:0 "勧誘の受諾"
 bsm_economic_alliance_actions.41.d:0 "[FROM.GetName]が勧誘を受け入れ、同盟に加わりました。"
 
 bsm_economic_alliance_actions.42.t:0 "勧誘の拒否"
 bsm_economic_alliance_actions.42.d:0 "[FROM.GetName]は勧誘を断りました。"

 # News Events
 bsm_economic_alliance_news.1.t:0 "経済同盟への加盟"
 bsm_economic_alliance_news.1.d:0 "[bsm_ea_joiner.GetName]は、[bsm_ea_leader.GetName]が主導する経済同盟への加盟を正式に表明しました。\n\nこれにより、両国の経済的結びつきはより強固なものとなるでしょう。"
 bsm_economic_alliance_news.1.a:0 "素晴らしいニュースだ。"
 bsm_economic_alliance_news.1.b:0 "興味深い。"

 bsm_economic_alliance_news.2.t:0 "新たな経済同盟の結成"
 bsm_economic_alliance_news.2.d:0 "[bsm_ea_leader.GetName]と[bsm_ea_joiner.GetName]は、新たな経済同盟の結成を宣言しました。\n\n両国は相互の経済発展と協力を誓い、新たなパートナーシップを築き上げます。"
 bsm_economic_alliance_news.2.a:0 "新たな時代の幕開けだ。"
 bsm_economic_alliance_news.2.b:0 "行く末を見守ろう。"
