 nc.1.d: "自国通貨の価値が急落しています。市場の信認が失われ、為替レートが悪化しています。"
 nc.1.a: "緊急対策を実施する"
 nc.2.t: "債務不履行"
 nc.2.d: "統一通貨（UC）の残高が枯渇し、対外債務の履行が不可能になりました。通貨価値が暴落しています。"
 nc.2.a: "深刻な事態だ…"
 nc.3.t: "通貨評価引き上げ"
 nc.3.d: "堅調な経済基盤と安定した財政により、自国通貨の評価が引き上げられました。"
 nc.3.a: "良い知らせだ"
 nc.4.t: "通貨統合の合意"
 nc.4.d: "経済同盟内で通貨統合が完了し、加盟国が共通通貨を採用しました。"
 nc.4.a: "興味深い"
