 # --- ツールチップ ---
  tt_bsm_nc_init_currency: "国家通貨を初期化"
  tt_bsm_nc_monthly_update: "月次為替レート更新"
  tt_bsm_nc_devalue_currency: "§R通貨価値が暴落する（レート+30%、安定度-25）§!"

  bsm_nc_crisis_modifier: "通貨危機"
  bsm_nc_weak_modifier: "§Y通貨弱体化§!"
  bsm_nc_very_weak_modifier: "§R通貨暴落§!"
  bsm_nc_union_converged_modifier: "§G通貨同盟の収斂§!"
  bsm_nc_union_converged_modifier_desc: "加盟国の金融政策と盟主通貨の流通が十分に収斂し、統一された決済圏が機能している。"
  bsm_nc_union_strain_modifier: "§Y通貨同盟離脱圧力§!"
  bsm_nc_union_strain_modifier_desc: "通貨同盟への不満が高まり、加盟国内で独自通貨への復帰を求める声が強まっている。"

  # --- イベント ---
  nc.4.t: "通貨統合の合意"
 nc.4.d: "経済同盟内で通貨統合が完了し、加盟国が共通通貨を採用しました。"
 nc.4.a: "興味深い"
 nc.5.t: "通貨同盟の離脱危機"
 nc.5.d: "[ROOT.GetName]では、盟主通貨の流通と国内経済の足並みが揃わず、通貨同盟への不満が噴出している。\n\n収斂度: §Y[?ROOT.bsm_nc_union_convergence|0]§!\n離脱圧力: §R[?ROOT.bsm_nc_union_exit_pressure|0]§!\n\nこの危機を放置すれば、同盟通貨の信用はさらに傷つくだろう。"
 nc.5.a: "共同安定化策を受け入れる"
 nc.5.b: "資本規制で流出を止める"
 nc.5.c: "通貨同盟から離脱する"
  nc.6.t: "通貨同盟からの離脱"
 nc.6.d: "[ROOT.GetName]は経済同盟の共通通貨運用から離脱し、独自通貨の運用を再開した。盟主通貨の流通は維持できず、他の加盟国にも動揺が広がっている。"
 nc.6.a: "通貨統合は容易ではない"

 # --- EA通貨危機伝播イベント (Phase 2) ---
 nc.10.t: "経済同盟の通貨危機"
 nc.10.d: "[ROOT.GetName]の経済同盟内で通貨危機が連鎖的に伝播している。\n\n危機圧力: §R[?ROOT.bsm_ea_crisis_pressure|0]§!\n弱い通貨国: §Y[?ROOT.bsm_ea_weak_currency_count|0]§!国\n高インフレ国: §Y[?ROOT.bsm_ea_high_inflation_count|0]§!国\nUC赤字国: §Y[?ROOT.bsm_ea_uc_deficit_count|0]§!国\n同盟準備金: §Y[?ROOT.bsm_ea_reserve_uc|0]§! UC\n\n同盟全体の対応が求められている。"
 nc.10.a: "同盟準備金を投入する"
 nc.10.b: "資本規制を実施する"
 nc.10.c: "現状維持で様子を見る"
 nc.10_b_tt: "直ちに対策は講じない。離脱圧力の上昇リスクがある。"
 nc.11.t: "共同対応の資金不足"
 nc.11.d: "同盟準備金が枯渇しており、加盟国の危機対応が困難な状況にある。[ROOT.GetName]として独自資金での支援も選択肢にある。"
 nc.11.a: "独自資金で支援する"
 nc.11_b_tt: "盟主の統一通貨を消費して支援する。"
 nc.11.b: "支援を見送る"
 nc.12.t: "通貨危機の深刻化"
 nc.12.d: "経済同盟の通貨危機がさらに深刻化し、加盟国全体の離脱圧力が加速している。速やかな事態収拾が求められる。"
 nc.12.a: "事態の収拾を急ぐ"

 # --- EA危機伝播 modifiers ---
 bsm_ea_crisis_strain_member: "§Y同盟通貨危機の波及§!"
 bsm_ea_crisis_strain_member_desc: "経済同盟内の通貨危機が伝播し、国内経済に負担がかかっている。"
 bsm_ea_crisis_severe_member: "§R同盟通貨危機（重度）§!"
 bsm_ea_crisis_severe_member_desc: "経済同盟の通貨危機が深刻化し、国内の安定性と戦意に重大な影響を及ぼしている。"

 # --- EA目標 追加 (Phase 5) ---
 bsm_ea_goal_07_resource_security: "資源安全保障"
 bsm_ea_goal_07_resource_security_desc: "経済同盟全体の資源不足に対処するため、共同採掘とインフラ投資を推進する。"
 bsm_ea_goal_08_strategic_stockpile: "戦略備蓄制度"
 bsm_ea_goal_08_strategic_stockpile_desc: "同盟準備金を活用し、重要資源の備蓄体制を整備する。"
 bsm_ea_goal_09_energy_settlement: "エネルギー決済協定"
 bsm_ea_goal_09_energy_settlement_desc: "石油・燃料の同盟内決済を最適化し、エネルギー安全保障を強化する。"

