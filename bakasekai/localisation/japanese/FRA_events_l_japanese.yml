l_japanese:
 ##############################################
 # FRA イベリア併合シナリオ event localisation
 ##############################################

 fra_scenario.1.t:0 "国民投票"
 fra_scenario.1.d:0 "帝政の復活と正統性を問う国民投票が全国で実施された。投じられた圧倒的な賛成票は、新たな秩序を求める民衆の意思を雄弁に物語っている。かつての栄光を戴く帝冠の下、国家は再び統合への道を歩み始めた。"
 fra_scenario.1.a:0 "皇帝万歳"

 fra_scenario.2.t:0 "共和国の復帰"
 fra_scenario.2.d:0 "混迷を極めた動乱を乗り越え、ついに共和国の正統な憲政秩序が回復された。議事堂には再び三色旗が誇らしげに翻り、市民たちは街頭で自由の再来を祝っている。フランス共和国の理念と実態が、いまや一致を見たのである。"
 fra_scenario.2.a:0 "共和国万歳"

 fra_scenario.3.t:0 "パリのクーデタ"
 fra_scenario.3.d:0 "早朝の首都に戒厳令が敷かれ、軍靴の響きとともに議事堂が実力で封鎖された。優柔不断な議会政治は打ち倒され、強力な規律による国家再編が宣言された。秩序回復を掲げる軍の統制下で、冷徹な再出発が切られる。"
 fra_scenario.3.a:0 "国家は統べられる"

 fra_scenario.4.t:0 "新パリ・コミューン"
 fra_scenario.4.d:0 "バリケードに赤旗が掲げられ、パリの街頭で新たなコミューンの樹立が宣言された。既存の支配者階級は放逐され、工場の操業と都市の運営は人民の手へと委ねられた。労働者たちの熱気と革命の歌声が、首都の空へと響き渡っている。"
 fra_scenario.4.a:0 "人民の都へ"

 fra_scenario.10.t:0 "王冠統合の申し出"
 fra_scenario.10.d:0 "フランス政府より、両国の王冠を一本化し国家を統合しようという正式な申し出が届いた。もし合意すれば長年の分断に終止符が打たれ、強大な同君連合が誕生することになる。しかしそれは、我らの独立と主権をパリの宮廷へ委ねることをも意味している。"
 fra_scenario.10.a:0 "王冠を預ける"
 fra_scenario.10.b:0 "権利書は手放せない"

 fra_scenario.11.t:0 "王冠分離の申し出"
 fra_scenario.11.d:0 "フランスから、互いの継承権主張を放棄して平等の同盟を結ぼうとの提案が持ちかけられた。イル＝ド＝フランスに対する王冠の請求権を放棄する代わりに、強固な相互防衛の約束が提示されている。過去の権利書を手放すことは苦渋の決断だが、平和的な生存圏を確保する好機とも言える。"
 fra_scenario.11.a:0 "権利書を置き去る"
 fra_scenario.11.b:0 "断る"

 fra_scenario.12.t:0 "パリからの握手"
 fra_scenario.12.d:0 "パリの外交使節が訪れ、両国関係の改善と協調に向けた和解の手を差し伸べてきた。長年燻っていたピレネー以南との対立を解き、善隣関係を築こうという誠意ある提案である。大西洋を挟む外交の冷え込みに、ようやく確かな雪解けの兆しが見え始めている。"
 fra_scenario.12.a:0 "悪くない話だ"

 fra_scenario.13.t:0 "冷たい海の通告"
 fra_scenario.13.d:0 "フランス側から届いた覚書は極めて儀礼的であり、その裏に警戒と冷淡さを隠そうともしていなかった。国境地帯での諜報活動や監視網の強化が報告されており、彼らに和解の意志がないことは明白である。波立つ大西洋の海原には、再び重苦しい冷戦の影が垂れ込めつつある。"
 fra_scenario.13.a:0 "知っている"

 fra_scenario.14.t:0 "アンドラ共治の提案"
 fra_scenario.14.d:0 "ピレネー山脈の険しい渓谷に位置するアンドラ公国について、フランスから共同統治の復活が提案された。双方が独立を保証する緩衝地帯として再興することで、国境地帯の無用な摩擦を回避する狙いがあるようだ。歴史的な共治制を取り戻すこの申し出に応じるべきか、慎重な判断が求められる。"
 fra_scenario.14.a:0 "同意する"
 fra_scenario.14.b:0 "拒否する"

 fra_scenario.20.t:0 "大西洋の綱引き"
 fra_scenario.20.d:0 "両国の外交政策は激しく交錯し、一方が歩み寄りを模索する一方で、他方は強硬な牽制を繰り返した。互いの思惑が噛み合わぬまま綱引きが続いた結果、歩み寄りの機運も対立の口実も相殺されてしまった。両国の距離感は、良くも悪くも以前の冷淡な中立状態へと引き戻された。"
 fra_scenario.20.a:0 "仕方ない"
