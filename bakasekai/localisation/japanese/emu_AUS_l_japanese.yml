l_japanese:
 # ============================================
 # emu namespace (emu_empire.txt)
 # ============================================

 emu.1.t:0 "エミューの目撃情報"
 emu.1.d:0 "内陸部でエミューの大群が目撃されました。農家はパニックに陥り、軍は対応に追われています。これが新たな戦争の幕開けとなるのか——それとも、ただの鳥の集会でしょうか？"
 emu.1.a:0 "エミューを追い払う！荒野は我々のものだ！"
 emu.1.b:0 "農場を強化して防御を固めよう"
 emu.1.c:0 "科学調査チームを派遣しよう"

 emu.2.t:0 "エミューの襲撃！"
 emu.2.d:0 "エミュー軍団が穀倉地帯に侵攻を開始しました！作物が食い荒らされ、住民は恐怖に震えています。あの長い首と鋭い爪が、暗闇の中から迫ってくるのです……"
 emu.2.a:0 "全面戦争を宣言する！エミューどもを撃破せよ！"
 emu.2.b:0 "防衛線を構築して持ちこたえる"
 emu.2.c:0 "住民を避難させ、人的資源を確保する"

 emu.3.t:0 "大エミュー粛清"
 emu.3.d:0 "エミューとの戦いが泥沼化する中、国内は強硬派と融和派に真っ二つに割れています。エミューを徹底的に排除するか、それとも彼らと共存の道を探るか——選択はあなた次第です。"
 emu.3.a:0 "エミューを徹底排除する！慈悲はいらぬ！"
 emu.3.b:0 "和平交渉を模索する……彼らにも心があろう"
 emu.3.c:0 "政治問題として処理し、有耶無耶にする"

 # ============================================
 # emu_empire namespace (emu_empire_events.txt)
 # ============================================

 emu_empire.1.t:0 "エミュー帝国の誕生"
 emu_empire.1.d:0 "ついにその時が来た！エミューたちが組織的な帝国を樹立しました。三色の羽毛旗の下、彼らは前進しています。皇帝——いや、皇帝鳥の即位に、大陸中が震え上がっています。"
 emu_empire.1.a:0 "エミュー帝国万歳！……万歳？"

 emu_empire.2.t:0 "大エミュー戦争の記念日"
 emu_empire.2.d:0 "例年のこの日、我々は大エミュー戦争の「英雄たち」を追悼します。そう、あの戦争で我々は……実は負けました。機関銃を持った軍隊が、鳥に敗北したのです。しかし！精神的大勝利ということで！"
 emu_empire.2.a:0 "敗戦を記念し、士気を高めよう……たぶん"

 emu_empire.3.t:0 "羽毛議会の設立"
 emu_empire.3.d:0 "エミュー代表による議会が設立されました。議事進行は「ガー！」と「ガァッ！」の二大政党制です。審議は噛み合っていませんが、法律の可決速度は驚異的です。噛みつきながらも前へ進む姿勢は、民主主義の鑑と言えるでしょう。"
 emu_empire.3.a:0 "羽毛議会を承認する。異議なし——「ガー！」"

 emu_empire.4.t:0 "砂塵嵐による敵軍の混乱"
 emu_empire.4.d:0 "エミューが起こした砂塵嵐が敵軍を混乱させました！あの巨大な足で砂を蹴り上げる戦術は、予想以上に効果的です。「エミューの砂嵐作戦」——将軍たちも認めざるを得ません。"
 emu_empire.4.a:0 "この混乱に乗じて攻撃開始！突撃——ガァッ！"

 emu_empire.5.t:0 "エミューの大移住"
 emu_empire.5.d:0 "エミューの大群が新たな領土へ移住を始めました。その数は天を覆い、道路上は羽毛の波となっています。住民は「美しい」と「恐怖」の間で感情が揺れ動いています。"
 emu_empire.5.a:0 "移住を支援し、産業を振興する"
 emu_empire.5.b:0 "政治的なサポートに留める"

 emu_empire.6.t:0 "世界征服宣言！"
 emu_empire.6.d:0 "エミュー帝国がついに世界征服を宣言しました！帝国の影響力は大陸を越え、すべての主要国がこの脅威——いや、この極めて重要な宣言に注目しています。エミューは歩く。世界を、歩き尽くす。"
 emu_empire.6.a:0 "エミュー帝国の世界制覇を宣言する！"

 emu_empire.7.t:0 "エミュー帝国からの宣言"
 emu_empire.7.d:0 "オーストラリアのエミュー帝国が世界征服を宣言しました。本気かどうかは不明ですが、羽毛に覆われた軍隊は確かに存在します。対応を誤れば……次はあなたの国の穀倉地帯かもしれません。"
 emu_empire.7.a:0 "明らかな脅威だ。対抗措置をとる"
 emu_empire.7.b:0 "え……エミュー？ハハハ、笑わせるな"

 emu_empire.8.t:0 "羽毛の大集団移動"
 emu_empire.8.d:0 "エミューの季節的大移動が始まりました。数千羽のエミューが一斉に移動し、その足跡が新たな道を作っています。彼らの移動ルートは、最強のインフラ計画よりも効率的かもしれません。"
 emu_empire.8.a:0 "移動ルートを整備し、インフラを強化する"

 emu_empire.9.t:0 "エミューの卵泥棒事件"
 emu_empire.9.d:0 "隣国がエミューの卵を密かに盗み出したという情報が入りました。これは明らかなる挑発行為です！卵一つ一つが帝国の未来なのです。これを黙って見過ごすわけにはいきません。"
 emu_empire.9.a:0 "隣国に厳重に抗議する！卵を返せ！"
 emu_empire.9.b:0 "静かに対応し、国内の安定を優先する"

 emu_empire.10.t:0 "フェザー・ラミング作戦の成功"
 emu_empire.10.d:0 "エミューの突進戦術が敵戦車部隊に対して劇的な効果を発揮しました！時速50キロで突っ込む巨大な鳥の体当たり——装甲板も歪むという衝撃です。戦車兵たちは二度とエミューを笑えなくなりました。"
 emu_empire.10.a:0 "突進戦術を全軍に展開！突撃——ガァァッ！"

 emu_empire.11.t:0 "鳥類外交サミット"
 emu_empire.11.d:0 "世界の鷲を持つ諸国との鳥類外交サミットが開催されます。白頭鷲のアメリカ、鷲のドイツ、鷲のポーランド——そしてエミューのオーストラリア。翼を持つ者たちがついに一堂に会します。会議の議題は「羽根の手入れ」から始まる予定です。"
 emu_empire.11.a:0 "鳥類外交を推進し、翼ある同志との絆を深める"
 emu_empire.11.b:0 "いや……やはり人間として生きよう"

 emu_empire.12.t:0 "翼なき征服者の宣言"
 emu_empire.12.d:0 "エミューは飛べない。しかし、それは征服の邪魔にはならない。翼のない鳥が世界を歩き尽くす——それが翼なき征服者の教えです。空を飛ぶ必要などない。大地を歩み、すべてを踏み越えればいいのだ。"
 emu_empire.12.a:0 "翼なき征服者の精神を採用する！空はいらぬ！"

 emu_empire.13.t:0 "翼なき征服者の脅威"
 emu_empire.13.d:0 "オーストラリアのエミュー帝国が「翼なき征服者」として宣言を行いました。飛べない鳥が世界征服を企てる——笑い話に聞こえますが、彼らは本気です。そして何より、前回の戦争で人類は彼らに負けています。"
 emu_empire.13.a:0 "エミュー帝国を厳重に警戒する"

