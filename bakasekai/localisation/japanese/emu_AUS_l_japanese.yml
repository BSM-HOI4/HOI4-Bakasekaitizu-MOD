 AUS_emu_expansion_tooltip:0 "エミューの支配領域が拡大し、新たな人的資源と装備を獲得します。"
 AUS_negotiate_with_birds:0 "鳥類との交渉を行う"
 AUS_bird_diplomacy_tooltip:0 "鳥類外交団を通じてエミューとの関係を改善し、国内の安定性と戦争支援度を向上させます。"
