l_japanese:
 ##############################################
 # NSI National Focus Tree Localization
 ##############################################
 
 # 基盤フォーカス
 NSI_Sinkou:0 "進攻"
 NSI_Sinkou_desc:0 "北センチネル島の古代文明は、数千年にわたって外界から隔絶された環境で独自の発展を遂げてきた。今こそ我々の文明の真の力を示す時である。"
 
 # 孤立維持ツリー
 NSI_isolation_doctrine:0 "孤立主義の教義"
 NSI_isolation_doctrine_desc:0 "外界との接触は汚染と堕落をもたらす。我々の純粋性を保つため、完全な孤立を維持しなければならない。"
 
 NSI_outsider_rejection:0 "侵入者の拒絶"
 NSI_outsider_rejection_desc:0 "島への侵入者は一切容認しない。沿岸の防御を強化し、神聖な土地を守り抜く。"
 
 NSI_sacred_barriers:0 "神聖なる障壁"
 NSI_sacred_barriers_desc:0 "先祖代々受け継がれた神聖な防御術により、島全体を要塞化する。侵入者を阻む絶対的な障壁を築く。"
 
 NSI_ancient_traditions:0 "古代の伝統"
 NSI_ancient_traditions_desc:0 "数千年前から伝わる古い掟と伝統こそが、我々の力の源泉である。これらの教えを守り続けることで、真の力を得る。"
 
 NSI_guardian_spirits:0 "守護霊の加護"
 NSI_guardian_spirits_desc:0 "島を守る霊的存在たちが我々に力を与える。この神秘的な加護により、我々は無敵となる。"
 
 NSI_eternal_vigilance:0 "永遠の警戒"
 NSI_eternal_vigilance_desc:0 "外界からの脅威に対する永続的な警戒体制を確立する。この警戒こそが我々の文明を守り抜く鍵である。"
 
 # 軍事ツリー
 NSI_warrior_tradition:0 "戦士の伝統"
 NSI_warrior_tradition_desc:0 "古代より伝わる戦士の道。我々の戦士たちは生まれながらにして戦いの術を身につけている。"
 
 NSI_elite_guards:0 "精鋭護衛隊"
 NSI_elite_guards_desc:0 "島の最も優秀な戦士たちによって構成される精鋭部隊。彼らは普通の兵士とは次元の違う力を持つ。"
 
 NSI_coastal_defense:0 "沿岸防衛"
 NSI_coastal_defense_desc:0 "島の海岸線を完璧に防御する。いかなる侵入者も海から近づくことはできない。"
 
 NSI_hidden_arsenals:0 "隠された武器庫"
 NSI_hidden_arsenals_desc:0 "島の地下深くに隠された古代の武器庫。そこには数世紀分の武器と装備が蓄えられている。"
 
 NSI_ancient_weapons:0 "古代兵器"
 NSI_ancient_weapons_desc:0 "先祖代々受け継がれた古代の武器製造技術。現代の兵器を遥かに凌駕する威力を持つ。"
 
 # 地下都市ツリー
 NSI_chikatoshi:0 "地下都市"
 NSI_chikatoshi_desc:0 "島の地下に巨大な都市を建設する。この地下都市こそが我々の文明の真の中枢となる。"
 
 NSI_underground_expansion:0 "地下拡張"
 NSI_underground_expansion_desc:0 "地下都市をさらに拡張し、より多くの施設を収容できるようにする。"
 
 NSI_deep_tunnels:0 "深層トンネル"
 NSI_deep_tunnels_desc:0 "島全体を縦横に走る深層トンネルネットワーク。完璧な防御システムと交通網を提供する。"
 
 NSI_underground_forges:0 "地下鍛冶場"
 NSI_underground_forges_desc:0 "地下深くに設置された巨大な鍛冶場。ここで我々の武器と装備が製造される。"
 
 NSI_subterranean_city:0 "地下大都市"
 NSI_subterranean_city_desc:0 "完全な地下大都市の完成。この都市は地上のいかなる都市をも凌駕する規模と機能を持つ。"
 
 NSI_hidden_laboratories:0 "隠された研究所"
 NSI_hidden_laboratories_desc:0 "地下都市の最深部に設置された秘密研究所。ここで我々の科学技術は飛躍的に発展する。"
 
 NSI_underground_networks:0 "地下通信網"
 NSI_underground_networks_desc:0 "地下都市全体を結ぶ高度な通信ネットワーク。完璧な情報伝達システムを構築する。"
 
 NSI_self_sufficient_society:0 "完全自給自足社会"
 NSI_self_sufficient_society_desc:0 "外界に一切依存しない完全な自給自足社会を実現する。我々にとって外界は不要である。"
 
 # 政治ツリー
 NSI_tribal_council:0 "部族会議"
 NSI_tribal_council_desc:0 "古代より続く部族制度による統治システム。長老たちの叡智により島は統治される。"
 
 NSI_elder_wisdom:0 "長老の叡智"
 NSI_elder_wisdom_desc:0 "島の長老たちが持つ古代からの叡智。この知識こそが我々の政治の基盤である。"
 
 NSI_isolation_laws:0 "孤立法"
 NSI_isolation_laws_desc:0 "外界との接触を法的に禁止する。この法律により我々の純粋性が永遠に保たれる。"
 
 # 信仰ツリー
 NSI_ancestral_worship:0 "祖先崇拝"
 NSI_ancestral_worship_desc:0 "数千年前から続く祖先崇拝の伝統。先祖の霊が我々を見守り、力を与えてくれる。"
 
 NSI_sacred_rituals:0 "神聖な儀式"
 NSI_sacred_rituals_desc:0 "古代より伝わる神聖な儀式を執り行う。これらの儀式により我々の戦闘力は大幅に向上する。"
 
 NSI_forbidden_knowledge:0 "禁断の知識"
 NSI_forbidden_knowledge_desc:0 "一般人には理解できない禁断の知識への扉を開く。この知識は我々に計り知れない力をもたらす。"
 
 NSI_ancient_texts:0 "古代文書"
 NSI_ancient_texts_desc:0 "失われた古代の軍事知識が記された文書。この知識により我々の戦術は完璧となる。"
 
 NSI_mystical_sciences:0 "神秘科学"
 NSI_mystical_sciences_desc:0 "科学と神秘を融合させた独自の学問。現代科学を遥かに凌駕する技術を生み出す。"
 
 NSI_spiritual_awakening:0 "精神的覚醒"
 NSI_spiritual_awakening_desc:0 "島民全体の精神的覚醒。この覚醒により我々の能力は次元を超越する。"
 
 NSI_otherworldly_contact:0 "異界との接触"
 NSI_otherworldly_contact_desc:0 "この世のものではない存在との接触を確立する。彼らの導きにより我々の技術は飛躍する。"
 
 NSI_divine_protection:0 "神的加護"
 NSI_divine_protection_desc:0 "神々による直接的な加護を得る。この加護により我々の防御は完璧となる。"
 
 NSI_transcendent_wisdom:0 "超越的叡智"
 NSI_transcendent_wisdom_desc:0 "人間の理解を超えた超越的な叡智を獲得する。この叡智により我々は神に近づく。"
 
 NSI_reality_manipulation:0 "現実操作"
 NSI_reality_manipulation_desc:0 "現実そのものを操作する力を手に入れる。物理法則すら我々の意志に従う。"
 
 NSI_temporal_mastery:0 "時間支配"
 NSI_temporal_mastery_desc:0 "時間の流れを支配する能力を獲得する。過去も未来も我々の支配下にある。"
 
 NSI_godlike_ascension:0 "神的昇華"
 NSI_godlike_ascension_desc:0 "ついに我々は神的存在へと昇華する。もはや我々に敵う者は存在しない。"
 
 # 覚醒ツリー
 NSI_awakening_wrath:0 "覚醒の怒り"
 NSI_awakening_wrath_desc:0 "平和を愛する我々が攻撃を受けた時、古代の怒りが覚醒する。侵略者への報復の時が来た。"
 
 NSI_ancient_fury:0 "古代の憤怒"
 NSI_ancient_fury_desc:0 "数千年の平和を破った者たちへの古代からの憤怒。この怒りは止まることを知らない。"
 
 NSI_technological_supremacy:0 "技術的優位"
 NSI_technological_supremacy_desc:0 "隠し続けてきた真の技術力を解放する。我々の科学力は他の全ての国を圧倒する。"
 
 NSI_retribution:0 "神的報復"
 NSI_retribution_desc:0 "神々の名において、我々を侵した者たちに報復を下す。この報復は完全かつ絶対的である。"

 ##############################################
 # NSI Technologies
 ##############################################
 nsi_ancient_warfare:0 "古代戦術"
 nsi_ancient_warfare_desc:0 "祖先から受け継がれた戦闘技術を現代に復活させ、独特な戦術体系を確立する。"
 
 nsi_spiritual_guidance:0 "精神的指導"
 nsi_spiritual_guidance_desc:0 "精神的な結束を深め、軍事教義に霊的な要素を組み込む。"
 
 nsi_sacred_rituals_tech:0 "神聖儀式技術"
 nsi_sacred_rituals_tech_desc:0 "古代の儀式を通じて兵士の士気と組織力を向上させる技術。"
 
 nsi_forbidden_knowledge_tech:0 "禁断知識技術"
 nsi_forbidden_knowledge_tech_desc:0 "禁断とされた古代の知識を活用し、危険だが強力な技術を開発する。"
 
 nsi_advanced_construction:0 "先進建築技術"
 nsi_advanced_construction_desc:0 "部族の建築知識を発展させ、より効率的な建設技術を確立する。"

 ##############################################
 # NSI Equipment
 ##############################################
 tribal_equipment:0 "部族装備"
 tribal_equipment_desc:0 "古代から受け継がれた伝統的な武器と防具。シンプルだが効果的。"
 
 tribal_equipment_1:0 "改良部族装備"
 tribal_equipment_1_desc:0 "伝統的な製造技術を改良して作られた武器。威力と信頼性が向上している。"
 
 ancient_enhanced_equipment:0 "古代強化装備"
 ancient_enhanced_equipment_desc:0 "禁断の知識によって強化された古代の武器。驚異的な威力を持つ。"

 ##############################################
 # NSI Units
 ##############################################
 nsi_tribal_warriors:0 "部族戦士"
 nsi_tribal_warriors_desc:0 "島の自然環境を知り尽くした戦士たち。ジャングルと森林での戦闘に長けている。"
 
 nsi_ancient_guard:0 "古代守護兵"
 nsi_ancient_guard_desc:0 "禁断の知識によって訓練された精鋭兵士。超人的な能力を持つ。"
 
 # generic2.txt フォーカスのローカライズ
 generic_focus:0 "汎用フォーカス"
 generic_focus_desc:0 "このフォーカスは特定の目的を持たない汎用的なものです。"

 generic_political_awakening:0 "政治的覚醒"
 generic_political_awakening_desc:0 "国民の政治意識が高まり、国家の未来を形作る準備が整いました。"

 generic_democratic_path:0 "民主主義の道"
 generic_democratic_path_desc:0 "民主主義の価値観を受け入れ、自由と平等を追求する道を選びます。"

 generic_democratic_consolidation:0 "民主主義の強化"
 generic_democratic_consolidation_desc:0 "民主主義体制をさらに強化し、国民の信頼を得るための施策を実施します。"

 generic_democratic_elections:0 "民主的選挙"
 generic_democratic_elections_desc:0 "自由で公正な選挙を実施し、国民の声を反映させます。"

 generic_democratic_freedoms:0 "民主的自由"
 generic_democratic_freedoms_desc:0 "言論の自由や集会の自由など、基本的な自由を保障します。"

 generic_democratic_rights:0 "民主的権利"
 generic_democratic_rights_desc:0 "すべての国民に平等な権利を与え、法の下の平等を実現します。"

 generic_democratic_press:0 "自由な報道"
 generic_democratic_press_desc:0 "報道の自由を保障し、情報の透明性を確保します。"

 generic_democratic_parliament:0 "民主的議会"
 generic_democratic_parliament_desc:0 "国民の代表が集う議会を設立し、政策決定を行います。"

 generic_democratic_judiciary:0 "独立した司法"
 generic_democratic_judiciary_desc:0 "司法の独立を確保し、公正な裁判を実現します。"

 generic_democratic_diplomacy:0 "民主的外交"
 generic_democratic_diplomacy_desc:0 "他国との平和的な関係を築き、国際的な協力を推進します。"

 generic_democratic_welfare:0 "福祉の充実"
 generic_democratic_welfare_desc:0 "国民の福祉を向上させるための政策を実施します。"