l_japanese:
 ##############################################
 # NSI National Focus Tree Localization
 ##############################################

 # 基盤フォーカス
 NSI_Sinkou_focus:0 "進攻"
 NSI_Sinkou_focus_desc:0 "北センチネル島の古代文明は、数千年にわたって外界から隔絶された環境で独自の発展を遂げてきた。今こそ我々の文明の真の力を示す時である。"

 # 孤立維持ツリー
 NSI_isolation_doctrine:0 "孤立主義の教義"
 NSI_isolation_doctrine_desc:0 "外界との接触は汚染と堕落をもたらす。我々の純粋性を保つため、完全な孤立を維持しなければならない。"

 NSI_outsider_rejection:0 "侵入者の拒絶"
 NSI_outsider_rejection_desc:0 "島への侵入者は一切容認しない。沿岸の防御を強化し、神聖な土地を守り抜く。"

 NSI_sacred_barriers:0 "神聖なる障壁"
 NSI_sacred_barriers_desc:0 "先祖代々受け継がれた神聖な防御術により、島全体を要塞化する。侵入者を阻む絶対的な障壁を築く。"

 NSI_ancient_traditions:0 "古代の伝統"
 NSI_ancient_traditions_desc:0 "数千年前から伝わる古い掟と伝統こそが、我々の力の源泉である。これらの教えを守り続けることで、真の力を得る。"

 NSI_guardian_spirits:0 "守護霊の加護"
 NSI_guardian_spirits_desc:0 "島を守る霊的存在たちが我々に力を与える。この神秘的な加護により、我々は無敵となる。"

 NSI_eternal_vigilance:0 "永遠の警戒"
 NSI_eternal_vigilance_desc:0 "外界からの脅威に対する永続的な警戒体制を確立する。この警戒こそが我々の文明を守り抜く鍵である。"

 # 軍事ツリー
 NSI_warrior_tradition:0 "戦士の伝統"
 NSI_warrior_tradition_desc:0 "古代より伝わる戦士の道。我々の戦士たちは生まれながらにして戦いの術を身につけている。"

 NSI_elite_guards:0 "精鋭護衛隊"
 NSI_elite_guards_desc:0 "島の最も優秀な戦士たちによって構成される精鋭部隊。彼らは普通の兵士とは次元の違う力を持つ。"

 NSI_coastal_defense:0 "沿岸防衛"
 NSI_coastal_defense_desc:0 "島の海岸線を完璧に防御する。いかなる侵入者も海から近づくことはできない。"

 NSI_hidden_arsenals:0 "隠された武器庫"
 NSI_hidden_arsenals_desc:0 "島の地下深くに隠された古代の武器庫。そこには数世紀分の武器と装備が蓄えられている。"

 NSI_ancient_weapons:0 "古代兵器"
 NSI_ancient_weapons_desc:0 "先祖代々受け継がれた古代の武器製造技術。現代の兵器を遥かに凌駕する威力を持つ。"

 # 地下都市ツリー
 NSI_chikatoshi_focus:0 "地下都市"
 NSI_chikatoshi_focus_desc:0 "島の地下に巨大な都市を建設する。この地下都市こそが我々の文明の真の中枢となる。"

 NSI_underground_expansion:0 "地下拡張"
 NSI_underground_expansion_desc:0 "地下都市をさらに拡張し、より多くの施設を収容できるようにする。"

 NSI_deep_tunnels:0 "深層トンネル"
 NSI_deep_tunnels_desc:0 "島全体を縦横に走る深層トンネルネットワーク。完璧な防御システムと交通網を提供する。"

 NSI_underground_forges:0 "地下鍛冶場"
 NSI_underground_forges_desc:0 "地下深くに設置された巨大な鍛冶場。ここで我々の武器と装備が製造される。"

 NSI_subterranean_city:0 "地下大都市"
 NSI_subterranean_city_desc:0 "完全な地下大都市の完成。この都市は地上のいかなる都市をも凌駕する規模と機能を持つ。"

 NSI_hidden_laboratories:0 "隠された研究所"
 NSI_hidden_laboratories_desc:0 "地下都市の最深部に設置された秘密研究所。ここで我々の科学技術は飛躍的に発展する。"

 NSI_underground_networks:0 "地下通信網"
 NSI_underground_networks_desc:0 "地下都市全体を結ぶ高度な通信ネットワーク。完璧な情報伝達システムを構築する。"

 NSI_self_sufficient_society:0 "完全自給自足社会"
 NSI_self_sufficient_society_desc:0 "外界に一切依存しない完全な自給自足社会を実現する。我々にとって外界は不要である。"

 # 政治ツリー
 NSI_tribal_council:0 "部族会議"
 NSI_tribal_council_desc:0 "古代より続く部族制度による統治システム。長老たちの叡智により島は統治される。"

 NSI_elder_wisdom:0 "長老の叡智"
 NSI_elder_wisdom_desc:0 "島の長老たちが持つ古代からの叡智。この知識こそが我々の政治の基盤である。"

 NSI_isolation_laws:0 "孤立法"
 NSI_isolation_laws_desc:0 "外界との接触を法的に禁止する。この法律により我々の純粋性が永遠に保たれる。"

 # 信仰ツリー
 NSI_ancestral_worship:0 "祖先崇拝"
 NSI_ancestral_worship_desc:0 "数千年前から続く祖先崇拝の伝統。先祖の霊が我々を見守り、力を与えてくれる。"

 NSI_sacred_rituals:0 "神聖な儀式"
 NSI_sacred_rituals_desc:0 "古代より伝わる神聖な儀式を執り行う。これらの儀式により我々の戦闘力は大幅に向上する。"

 NSI_forbidden_knowledge:0 "禁断の知識"
 NSI_forbidden_knowledge_desc:0 "一般人には理解できない禁断の知識への扉を開く。この知識は我々に計り知れない力をもたらす。"

 NSI_ancient_texts:0 "古代文書"
 NSI_ancient_texts_desc:0 "失われた古代の軍事知識が記された文書。この知識により我々の戦術は完璧となる。"

 NSI_mystical_sciences:0 "神秘科学"
 NSI_mystical_sciences_desc:0 "科学と神秘を融合させた独自の学問。現代科学を遥かに凌駕する技術を生み出す。"

 NSI_spiritual_awakening:0 "精神的覚醒"
 NSI_spiritual_awakening_desc:0 "島民全体の精神的覚醒。この覚醒により我々の能力は次元を超越する。"

 NSI_otherworldly_contact:0 "異界との接触"
 NSI_otherworldly_contact_desc:0 "この世のものではない存在との接触を確立する。彼らの導きにより我々の技術は飛躍する。"

 NSI_divine_protection:0 "神的加護"
 NSI_divine_protection_desc:0 "神々による直接的な加護を得る。この加護により我々の防御は完璧となる。"

 NSI_transcendent_wisdom:0 "超越的叡智"
 NSI_transcendent_wisdom_desc:0 "人間の理解を超えた超越的な叡智を獲得する。この叡智により我々は神に近づく。"

 NSI_reality_manipulation:0 "現実操作"
 NSI_reality_manipulation_desc:0 "現実そのものを操作する力を手に入れる。物理法則すら我々の意志に従う。"

 NSI_temporal_mastery:0 "時間支配"
 NSI_temporal_mastery_desc:0 "時間の流れを支配する能力を獲得する。過去も未来も我々の支配下にある。"

 NSI_godlike_ascension:0 "神的昇華"
 NSI_godlike_ascension_desc:0 "ついに我々は神的存在へと昇華する。もはや我々に敵う者は存在しない。"

 # 覚醒ツリー
 NSI_awakening_wrath:0 "覚醒の怒り"
 NSI_awakening_wrath_desc:0 "平和を愛する我々が攻撃を受けた時、古代の怒りが覚醒する。侵略者への報復の時が来た。"

 NSI_ancient_fury:0 "古代の憤怒"
 NSI_ancient_fury_desc:0 "数千年の平和を破った者たちへの古代からの憤怒。この怒りは止まることを知らない。"

 NSI_technological_supremacy:0 "技術的優位"
 NSI_technological_supremacy_desc:0 "隠し続けてきた真の技術力を解放する。我々の科学力は他の全ての国を圧倒する。"

 NSI_retribution:0 "神的報復"
 NSI_retribution_desc:0 "神々の名において、我々を侵した者たちに報復を下す。この報復は完全かつ絶対的である。"

 ##############################################
 # NSI Technologies
 ##############################################
 nsi_ancient_warfare:0 "古代戦術"
 nsi_ancient_warfare_desc:0 "祖先から受け継がれた戦闘技術を現代に復活させ、独特な戦術体系を確立する。"

 nsi_spiritual_guidance:0 "精神的指導"
 nsi_spiritual_guidance_desc:0 "精神的な結束を深め、軍事教義に霊的な要素を組み込む。"

 nsi_sacred_rituals_tech:0 "神聖儀式技術"
 nsi_sacred_rituals_tech_desc:0 "古代の儀式を通じて兵士の士気と組織力を向上させる技術。"

 nsi_forbidden_knowledge_tech:0 "禁断知識技術"
 nsi_forbidden_knowledge_tech_desc:0 "禁断とされた古代の知識を活用し、危険だが強力な技術を開発する。"

 nsi_advanced_construction:0 "先進建築技術"
 nsi_advanced_construction_desc:0 "部族の建築知識を発展させ、より効率的な建設技術を確立する。"

 ##############################################
 # NSI Equipment
 ##############################################
 tribal_equipment:0 "部族装備"
 tribal_equipment_desc:0 "古代から受け継がれた伝統的な武器と防具。シンプルだが効果的。"

 tribal_equipment_1:0 "改良部族装備"
 tribal_equipment_1_desc:0 "伝統的な製造技術を改良して作られた武器。威力と信頼性が向上している。"

 ancient_enhanced_equipment:0 "古代強化装備"
 ancient_enhanced_equipment_desc:0 "禁断の知識によって強化された古代の武器。驚異的な威力を持つ。"

 ##############################################
 # NSI Units
 ##############################################
 nsi_tribal_warriors:0 "部族戦士"
 nsi_tribal_warriors_desc:0 "島の自然環境を知り尽くした戦士たち。ジャングルと森林での戦闘に長けている。"

 nsi_ancient_guard:0 "古代守護兵"
 nsi_ancient_guard_desc:0 "禁断の知識によって訓練された精鋭兵士。超人的な能力を持つ。"

 ##############################################
 # シナリオ追加：潮位・外界・古層
 ##############################################

 # 潮位の幹
 NSI_strange_sails:0 "異形の帆"
 NSI_strange_sails_desc:0 "水平線の彼方に、我らの古層の記憶にはない鋼の帆影が現れた。外海の異形どもは再び我らの眠る聖域を窺っている。潮位が告げる警告を無視するわけにはいかない。"
 NSI_read_the_tide:0 "潮を読む"
 NSI_read_the_tide_desc:0 "大洋の満ち引きはただの水流ではなく、深海に沈む巨石回路の鼓動そのものである。長老たちは波打ち際に耳を当て、世界が乱れ始めている兆候を聞き取った。古層の深度が再び変化の時を迎えている。"
 NSI_weigh_the_beach:0 "浜を量る"
 NSI_weigh_the_beach_desc:0 "白砂の浜辺に打ち寄せる砂粒一つひとつに、外の世界の歪みが堆積している。浅瀬に刻まれた測標を確かめ、我らの神聖な境界を侵すものの重みを測らねばならない。異邦人の足跡がこの地を穢す前に備えを固めるのだ。"
 # 外界接触
 NSI_repel_the_sails:0 "帆を撃退する"
 NSI_repel_the_sails_desc:0 "掟を破り浜辺に近づく船には、容赦なき鉄樹の矢雨を浴びせかける。外海の者どもに我らの神聖なる不可侵を思い知らせねばならない。彼らが恐れる未開の威嚇こそが、深層の秘密を守る最初の防壁となる。"
 NSI_salvage_gospel:0 "漂着の福音"
 NSI_salvage_gospel_desc:0 "波が運んでくる鉄屑や異国の遺物は、外界の技術水準を測る貴重な供物である。砂に埋もれた残骸を解体し、古代から継承された神聖な工学の糧とする。海が与えた恵みを無駄にする理由はない。"
 NSI_words_from_the_water:0 "水の言葉"
 NSI_words_from_the_water_desc:0 "寄せては返す波音が、遠く離れた海域のざわめきを我らの耳朶へと運んでくる。水流を介した古層の交信網は、異国の電波よりも遥かに速く世界の変動を捉える。海そのものが我らに警告を囁いているのだ。"
 NSI_raj_survey_ship:0 "大国の測量船"
 NSI_raj_survey_ship_desc:0 "大英帝国の測量船が島の沿岸を巡航し、浅瀬の水深を記録しようとしている。彼らの拙い望遠鏡には、我らの擬態した原始的な生活しか映らない。その油断を利用し、探検隊の動向を影から監視する。"
 NSI_indian_claim:0 "インドの権利書"
 NSI_indian_claim_desc:0 "大陸の支配者どもは、羊皮紙の上に勝手な境界線を引き我らの領有を主張している。だが太古よりこの島を支える脈動を、彼らの薄っぺらな法文が縛ることなどできはしない。我らの海は我らだけの神聖な領域である。"
 NSI_burma_tide:0 "ビルマの潮"
 NSI_burma_tide_desc:0 "北東の海域から押し寄せる潮流に、不穏な戦乱の気配が混じり始めている。ビルマ沿岸の動向は、いずれ我らのサンゴ礁にも波及しかねない。古層の海図を開き、北方からの脅威に備えるべきだ。"
 NSI_calendar_of_wrecks:0 "漂着物の暦"
 NSI_calendar_of_wrecks_desc:0 "浜に打ち上げられた残骸の年代と出所を克明に記録し、外界の文明が辿る衰退の周期を予測する。異邦人が海を汚すたびに、我らは彼らの技術的破綻の兆候を読み取ってきた。歴史の波が我らの優位を告げる時を待つ。"
 # 古層・超技術
 NSI_stone_blueprints:0 "石の設計図"
 NSI_stone_blueprints_desc:0 "神聖なる洞窟の奥深く、苔むした巨石に刻まれているのは太古の精緻な回路図である。部族の見た目は素朴であれ、その血脈には失われた超技術の設計思想が確かに眠っている。いまこそ石に刻まれた真理を読み解く時だ。"
 NSI_coral_alloy:0 "珊瑚合金"
 NSI_coral_alloy_desc:0 "海底に繁茂する生きた珊瑚と深層の重金属を融合させ、外海の鋼を凌駕する複合素材を鍛え上げる。軽石のように軽く、金剛石のように硬いこの物質は、我らの真の力を覆い隠す鎧となる。神話の技術が再び物質として蘇る。"
 NSI_tide_engine:0 "潮汐機関"
 NSI_tide_engine_desc:0 "外海との水位差と海底洞窟の圧力循環を利用した、永久に稼働する動力炉が起動する。蒸気も重油も使わず、ただ海の呼吸のみを力に変える古代の機関である。島を満たす微振動が、真の覚醒を告げている。"
 NSI_silent_arrows:0 "沈黙の矢"
 NSI_silent_arrows_desc:0 "弓矢に見える我らの武具には、音もなく空気を切り裂く共鳴制御が組み込まれている。外海の侵略者には原始の毒矢に見えるだろうが、その実体は装甲をも貫く神聖な投射体である。見えざる死をもって島境を守り抜く。"
 NSI_remembered_dock:0 "思い出した船渠"
 NSI_remembered_dock_desc:0 "砂浜の地下深くに埋没していた、巨大な石造船渠の封印を解除する。忘れ去られていたのではなく、適切な潮位が訪れるその日まで眠りについていただけなのだ。太古の航海者たちが遺した施設に、再び海水が引き入れられる。"
 NSI_closed_circuit:0 "閉じた回路"
 NSI_closed_circuit_desc:0 "外界との接触を完全に断ち、島内のエネルギー伝達網を独自の循環へと閉じる。異邦人の視線を欺きつつ、深層でのみ超技術の出力を最大化させるのだ。完全なる孤立こそが、我らの神聖な純度と力を保つ。"
 NSI_open_the_vault:0 "倉を開く"
 NSI_open_the_vault_desc:0 "島の中央にそびえる神木の根元、幾重にも施された封印の扉を開き放つ。そこに眠るのは、外海の近代兵器など足元にも及ばぬ太古の遺産群である。祖霊の眠りを覚まし、隠された力を白日のもとに晒す時が来た。"
 NSI_stone_thunder:0 "石の雷"
 NSI_stone_thunder_desc:0 "聖なる巨石に蓄えられた膨大な潮汐エネルギーを、不可視の衝撃波として解き放つ。それは原始的な儀式に見せかけた、島全体を覆う破滅的な対空・対艦防衛システムである。神罰の如き雷光が、不届きな侵入者を薙ぎ払うだろう。"
 # GMI・アンダマン
 NSI_andaman_question:0 "アンダマンの問い"
 NSI_andaman_question_desc:0 "隣なるアンダマンの島々に住まう同胞たちは、外海の支配者に屈しその檻に繋がれている。彼らを哀れな同族として見捨てるのか、それとも我らの深層秩序へと統合すべきか。島の未来を占う重大な問いに答えを出さねばならない。"
 NSI_one_realm:0 "一つの領域"
 NSI_one_realm_desc:0 "海峡によって分かたれたアンダマンとセンチネルを、失われた古代の単一領域へと再編する。我らの深層技術の傘を広げ、列島全体をひとつの神聖共同体として束ね上げるのだ。境界線は消え去り、かつての神話的世界が復元される。"
 NSI_two_flags:0 "二つの旗"
 NSI_two_flags_desc:0 "アンダマンの既成統治を形骸化させたまま利用し、我らは影から実権を握る。表向きは外海の秩序に従う二枚舌を使い、裏で古層のネットワークを浸透させるのだ。欺瞞の旗を掲げることで、無用な干渉を避けることができる。"
 NSI_port_blair_yard:0 "ポートブレア船渠"
 NSI_port_blair_yard_desc:0 "外海人によって築かれた近代的な港湾施設を、我らの珊瑚合金と潮汐工学で密かに改修する。粗野な鉄の骨組みに深海の技術を接ぎ木し、未知の艦艇を生み出す拠点へと作り変える。敵の拠点が我らの前進基地となるのだ。"
 NSI_imperial_court:0 "島の宮廷"
 NSI_imperial_court_desc:0 "大樹の木陰に長老たちが集い、外海のいかなる帝国よりも古く厳かな合議を開く。未開の部族会議と侮る者は、そこで下される決定が海域の運命を左右することを知らない。神話の知恵に基づく新たな統治秩序が布告される。"
 # 海と船
 NSI_reef_flotilla:0 "礁の小艦隊"
 NSI_reef_flotilla_desc:0 "一見すれば粗末な丸木舟だが、その船底には珊瑚合金の整流板と潮汐推進器が隠されている。浅瀬や環礁を疾風の如く駆け抜け、大型艦の死角から急襲を仕掛ける影の小艦隊である。環礁そのものが我らの防壁であり武器となる。"
 NSI_tide_riders:0 "潮に乗る者"
 NSI_tide_riders_desc:0 "大洋の海流と古層の波動を全身で感じ取り、波と一体化して戦う戦士たちを育成する。彼らは計器に頼ることなく嵐の夜を泳ぎ、敵の船底に忍び寄って沈黙の破壊をもたらす。海そのものが彼らの足場であり、味方なのだ。"
 NSI_sunken_dock:0 "沈みの船渠"
 NSI_sunken_dock_desc:0 "海面下数十メートルの深度に構築された、外洋艦建造用の水没ドックを再稼働させる。空からの偵察にも一切露見することなく、深海の水圧を利用して堅牢な潜水殻を成形する。完全なる秘匿のうちに、海の巨獣が産声を上げる。"
 NSI_first_horizon:0 "最初の水平線"
 NSI_first_horizon_desc:0 "長きにわたり島を隠し続けてきた霧を抜け、我らの視線は初めて環礁の外の地平線へと向けられた。孤立の時代は終わりを告げ、神話の深度を保ったまま世界へと漕ぎ出す時が来た。我らの足跡が外海へと刻まれる。"
 # 文明・統合
 NSI_grove_census:0 "木立の戸籍"
 NSI_grove_census_desc:0 "うっそうと茂る熱帯雨林の奥で、すべての島民の血統と古層への感応深度を記録する。紙ではなく聖なる幹に刻まれるこの系図は、隠された技術を継承する真の資格者を特定するために不可欠である。部族の結束を霊的かつ組織的に固める。"
 NSI_bengal_reach:0 "ベンガルへの腕"
 NSI_bengal_reach_desc:0 "アンダマン海を越え、ベンガル湾全域にまで我らの潮汐探知網と潜伏工作の触手を伸ばす。沿岸の大国どもが気付かぬうちに、神話の海底ケーブルが海域を掌握しつつある。この海は今や、我らの神聖なる支配領域の内側にあるのだ。"
 # 既存フォーカスの欠損補完
 NSI_subsistence_farming:0 "自給農業"
 NSI_subsistence_farming_desc:0 "島の内側だけで糧を得る。外界を必要としない生活を保つ。"
 NSI_underground_workshops:0 "地下作業場"
 NSI_underground_workshops_desc:0 "地下都市の作業場で、島の道具を内側から整える。"
 NSI_hidden_factories:0 "隠し工場"
 NSI_hidden_factories_desc:0 "外界の目に見えない場所に、小さな生産設備を忍ばせる。"
