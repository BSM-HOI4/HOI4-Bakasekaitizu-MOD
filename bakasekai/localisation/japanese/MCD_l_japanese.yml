 MAC_mechanization_effort:0 "機械化の高度化"
 MAC_mechanization_effort_desc:0 "機械化部隊の能力をさらに向上させる。"

 MAC_doctrine_effort:0 "軍事教義の研究"
 MAC_doctrine_effort_desc:0 "マクドナルド独自の軍事教義を研究する。「速く、安く、美味しく」が基本原則だ！"

