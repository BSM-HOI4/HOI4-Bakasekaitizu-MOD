 # =============================================
 # EVENTS - MCD.1 ~ MCD.5: 肥満度低下イベント
 # =============================================

 MCD.1.t:0 "ダイエットの季節だ！"
 MCD.1.d:0 "国民の皆さん、ポテトばかり食べてないで少しは運動しましょう！肥満度が少し改善されました。"
 MCD.1.a:0 "マックは美味しいけど健康も大事だな…"

 MCD.2.t:0 "ダイエットの季節だ！"
 MCD.2.d:0 "国民の皆さん、ポテトばかり食べてないで少しは運動しましょう！肥満度が少し改善されました。"
 MCD.2.a:0 "マックは美味しいけど健康も大事だな…"

 MCD.3.t:0 "ダイエットの季節だ！"
 MCD.3.d:0 "国民の皆さん、ポテトばかり食べてないで少しは運動しましょう！肥満度が少し改善されました。"
 MCD.3.a:0 "マックは美味しいけど健康も大事だな…"

 MCD.4.t:0 "ダイエットの季節だ！"
 MCD.4.d:0 "国民の皆さん、ポテトばかり食べてないで少しは運動しましょう！肥満度が少し改善されました。"
 MCD.4.a:0 "マックは美味しいけど健康も大事だな…"

 MCD.5.t:0 "ダイエットの季節だ！"
 MCD.5.d:0 "国民の皆さん、ポテトばかり食べてないで少しは運動しましょう！肥満度が少し改善されました。"
 MCD.5.a:0 "マックは美味しいけど健康も大事だな…"

 # =============================================
 # EVENTS - MCD.6: 国家方針樹選択
 # =============================================

 MCD.6.t:0 "マクドナルドか、普通か…"
 MCD.6.d:0 "我らが首相閣下は東京へ公費で旅行に行くと言っている。この際、我が国の進むべき道を選択すべきだ。マクドナルドの道を歩むか、それとも平凡な道を行くか…"
 MCD.6.a:0 "いや、普通でいいんじゃないか…"
 MCD.6.b:0 "マクドナルドこそが我らの道だ！"

 # =============================================
 # EVENTS - MCD.7: AI用隠しイベント
 # =============================================

 MCD.7.t:0 "マクドナルドの道"
 MCD.7.d:0 "このイベントは隠しイベントです。"
 MCD.7.a:0 "AI用選択肢"
 MCD.7.b:0 "プレイヤー用選択肢"

 # =============================================
 # EVENTS - MCD.8: マック・マクド論争（内戦）
 # =============================================

 MCD.8.t:0 "マックかマクドか、それが問題だ"
 MCD.8.d:0 "マクドナルドの略称は「マック」か「マクド」か。この国を二分する論争がついに武力衝突へと発展した。どちらの陣営につくか、今こそ決断の時だ！"
 MCD.8.a:0 "我らは「マック」派だ！マクドnal論客を排除せよ！"
 MCD.8.b:0 "我らは「マクド」派だ！マック主義者を打倒せよ！"

 # =============================================
 # EVENTS - MCD.9 ~ MCD.10: BoP増減イベント
 # =============================================

 MCD.9.t:0 "コーラ戦線の後退"
 MCD.9.d:0 "コーラ戦争において不利な報告が入ってきた。我々の陣営の影響力が低下しつつある。なんとか態勢を立て直さなければならない。"
 MCD.9.a:0 "ペプシの逆襲か…"
 MCD.9.b:0 "コカ・コーラの反撃か…"

 MCD.10.t:0 "コーラ戦線の前進"
 MCD.10.d:0 "コーラ戦争において有利な報告が入ってきた。我々の陣営の影響力が拡大しつつある。この勢いを止めるな！"
 MCD.10.a:0 "ペプシの勝利は近い！"
 MCD.10.b:0 "コカ・コーラに栄光あれ！"

 # =============================================
 # EVENTS - MCD.11 ~ MCD.12: コーラ戦争開始
 # =============================================

 MCD.11.t:0 "コーラ戦争勃発！"
 MCD.11.d:0 "ついにその時が来た。コカ・コーラとペプシ・コーラ、二大巨人の全面戦争が始まる。連邦議会の議席を制圧し、相手方を打倒せよ！"
 MCD.11.a:0 "さあ、戦争だ！どちらが真のコーラか決めよう！"

 MCD.12.t:0 "コーラの選択"
 MCD.12.d:0 "コーラ戦争を始める前に、あなたはどちらのコーラを支持するか決めなければならない。この選択が国の命運を分けることになるだろう。"
 MCD.12.a:0 "コカ・コーラこそ至高！"
 MCD.12.b:0 "ペプシこそ至高！"

 # =============================================
 # EVENTS - MCD.13 ~ MCD.17: ソビエト交渉
 # =============================================

 MCD.13.t:0 "ペプシ社からの電報"
 MCD.13.d:0 "ペプシ社から業務提携の申し出があった。ソ連国内にペプシコーラの支社を合同で設立し、国内で生産・販売するという。認めるべきだろうか。"
 MCD.13.a:0 "国民に嗜好飲料を提供することは非常に重要だ"
 MCD.13.b:0 "我々はいかなる形の資本主義にも屈しない！"

 MCD.14.t:0 "ソビエトからの返答"
 MCD.14.d:0 "彼らは我々の申し出を受け入れ、国内に工場を建設することを受諾した。これで国内での影響力を高められるだろう。"
 MCD.14.a:0 "素晴らしい！これで我々の勝利は確実だ！"

 MCD.15.t:0 "ソビエトからの拒絶"
 MCD.15.d:0 "彼らは我々の申し出を断った。まさか共産主義者がコーラを拒否するとは…"
 MCD.15.a:0 "なんてことだ…アイアンカーテンの向こう側にはコーラがないのか"

 MCD.16.t:0 "ペプシのソ連進出"
 MCD.16.d:0 "ペプシ社はあろうことかソビエト政府とコーラ販売に関する交渉を行い、成功させた。我々はこのことを断固非難すべきだ。"
 MCD.16.a:0 "即座に対応すべきだ！コークの利益が脅かされている！"

 MCD.17.t:0 "ペプシのソ連交渉失敗"
 MCD.17.d:0 "ペプシ社はソビエト政府とコーラ販売の交渉を行ったが失敗した。彼らの影響力は低下するだろう。"
 MCD.17.a:0 "ざまあみろ！コーク最強伝説！"

 # =============================================
 # EVENTS - MCD.18 ~ MCD.19: 連邦議会演説
 # =============================================

 MCD.18.t:0 "コカ・コーラ社の議会演説"
 MCD.18.d:0 "コカ・コーラ社は連邦議会における努力が実り、ついに議会演説をすることができた。結果としては大成功であり、議会のコカ・コーラ社への支持は不動のものとなった。"
 MCD.18.a:0 "我々は一歩勝利に近づいた！"
 MCD.18.b:0 "先を越されてしまった…ペプシも負けていないぞ！"

 MCD.19.t:0 "ペプシ社の議会演説"
 MCD.19.d:0 "ペプシ社は連邦議会における努力が実り、ついに議会演説をすることができた。結果としては大成功であり、議会のペプシ社への支持は不動のものとなった。"
 MCD.19.a:0 "我々は一歩勝利に近づいた！"
 MCD.19.b:0 "先を越されてしまった…コークも負けていないぞ！"

 # =============================================
 # EVENTS - MCD.20: マック・マクド論争
 # =============================================

 MCD.20.t:0 "マックか、マクドか"
 MCD.20.d:0 "マクドナルドの略称は「マック」か「マクド」か。日頃から論争が繰り広げられていたが、マクドナルドが正式に国家になるにあたってこの論争は激化の一途をたどっている。我々はこの問題を終結に導かなければならない。"
 MCD.20.a:0 "我々の呼び方こそが正しく、理にかなっている！"

 # =============================================
 # EVENTS - MCD.21: レナード対ペプシコ事件
 # =============================================

 MCD.21.t:0 "レナード対ペプシコ事件"
 MCD.21.d:0 "ある消費者がペプシコ社を相手取り、ハリアージェット機との引き換えにペプシポイント700万点を提示して訴訟を起こした。この裁判の行方はコーラ戦争の趨勢に大きな影響を与えるだろう。"
 MCD.21.a:0 "この訴訟を見届けよう"

 # =============================================
 # EVENTS - MCD.22 ~ MCD.23: コーラ戦争勝利
 # =============================================

 MCD.22.t:0 "ペプシの勝利！"
 MCD.22.d:0 "コーラ戦争は終結した。ペプシ・コーラがこの偉大なる戦いの勝者として君臨する。コカ・コーラは敗北し、ペプシの旗の下に国が統一される。"
 MCD.22.a:0 "我々の勝利だ！ペプシ・マンバサイ！"
 MCD.22.b:0 "我々の敗北だ…コークの時代は終わったのか…"

 MCD.23.t:0 "コカ・コーラの勝利！"
 MCD.23.d:0 "コーラ戦争は終結した。コカ・コーラがこの偉大なる戦いの勝者として君臨する。ペプシは敗北し、コカ・コーラの旗の下に国が統一される。"
 MCD.23.a:0 "我々の勝利だ！コーク・バンザイ！"
 MCD.23.b:0 "我々の敗北だ…ペプシの夢は散ったのか…"

 # =============================================
 # EVENTS - MCD.24: 内戦激化
 # =============================================

 MCD.24.t:0 "争いの激化"
 MCD.24.d:0 "コーラ戦争はもはや平和的な解決が不可能な段階に達した。双方の陣営が武力による解決を辞さない構えを見せている。内戦の火蓋が切って落とされようとしている！"
 MCD.24.a:0 "我々は実力行使も辞さない！ペプシのために！"
 MCD.24.b:0 "我々は実力行使も辞さない！コークのために！"
 MCD.24.c:0 "事態はひとまず鎮静化した…"

 # =============================================
 # EVENTS - MCD.25: 志高い民衆
 # =============================================

 MCD.25.t:0 "志高い民衆"
 MCD.25.d:0 "コーラ戦争の激化に伴い、志ある民衆が自ら志願して義勇軍を結成した。彼らは我が国のために戦う準備ができている！"
 MCD.25.a:0 "素晴らしい！さあ出陣だ！"

 # =============================================
 # EVENTS - MCD.26 ~ MCD.27: レナード対ペプシコ続報
 # =============================================

 MCD.26.t:0 "レナード対ペプシコ事件 — ペプシ勝訴"
 MCD.26.d:0 "裁判の結果、ペプシコ社が勝訴した。これにより議会におけるペプシ派の影響力が強化されることとなった。"
 MCD.26.a:0 "我々の勝利だ！正義はペプシにあり！"

 MCD.27.t:0 "レナード対ペプシコ事件 — ペプシ敗訴"
 MCD.27.d:0 "裁判の結果、ペプシコ社が敗訴した。賠償金の支払いが命じられ、議会におけるペプシ派の影響力が低下することとなった。"
 MCD.27.a:0 "我々の敗北だ…7百万ポイントの教訓だ…"

 # =============================================
 # NATIONAL FOCUS - 基本ツリー
 # =============================================

 MAC_sales_start_in_the_USA:0 "米国での販売開始"
 MAC_sales_start_in_the_USA_desc:0 "マクドナルド帝国の第一歩は、本拠地アメリカ合衆国での圧倒的支配力の確立にある。まずはハンバーガーで全米を制圧せよ！"

 MAC_Overseas_shop_openings:0 "海外店舗展開"
 MAC_Overseas_shop_openings_desc:0 "アメリカ国内での成功を足掛かりに、世界中へのフランチャイズ展開を開始する。マクドナルドの黄色いアーチが世界中を照らす日も近い！"

 MAC_donaldism:0 "ドナルド主義"
 MAC_donaldism_desc:0 "ドナルド・マクドナルドを精神的指導者とし、その教えを国家の基本理念とする。らんらんるー！"

 MAC_niconico_douga:0 "ニコニコ動画"
 MAC_niconico_douga_desc:0 "ニコニコ動画を通じてドナルドのミーム文化を国内に普及させる。動画投稿サイトは最強のプロパガンダツールだ！"

 MAC_the_expansion_of_donaldism:0 "ドナルド主義の拡大"
 MAC_the_expansion_of_donaldism_desc:0 "ドナルド主義を国民の間に浸透させ、国家の指導理念として確立する。ドナルドが真のリーダーとして君臨する時が来た！"

 MAC_What_size_are_shoes_of_Donald:0 "ドナルドの靴って何センチ？"
 MAC_What_size_are_shoes_of_Donald_desc:0 "ドナルドの巨大な靴は国民の憧れの的だ。靴のサイズを国家機密として研究し、国民士気を高める。"

 MAC_rumor_of_Donald:0 "ドナルドの噂"
 MAC_rumor_of_Donald_desc:0 "巷で囁かれるドナルドに関する様々な噂を調査・利用し、プロパガンダとして活用する。都市伝説も立派な政治的資源だ！"

 MAC_What_is_a_ranranru:0 "らんらんルーってなんなんだ？"
 MAC_What_is_a_ranranru_desc:0 "「らんらんるー」の真意を解明する国家プロジェクト。この謎の言葉が持つ力を解き放て！"

 MAC_Donald_memeing:0 "ドナルドのミーム化"
 MAC_Donald_memeing_desc:0 "ドナルドを完全にミームとして昇華させる。もはや実在の人物かミームかの境界は消え失せた！"

 MAC_further_expansion_of_Donaldism:0 "ドナルド主義の更なる拡大"
 MAC_further_expansion_of_Donaldism_desc:0 "ドナルド主義はもはや国内に留まらない。全世界をドナルドの笑顔で包み込む時が来た！"

 MAC_Is_MC_Donald:0 "M.C.ドナルド"
 MAC_Is_MC_Donald_desc:0 "ドナルドはダンスに夢中なのか？最終鬼畜道化師ドナルド・M。音楽とミームの融合が新たな時代を開く！"

 MAC_Perfection_of_Donaldism:0 "ドナルド教の完成"
 MAC_Perfection_of_Donaldism_desc:0 "ドナルド主義はついに完成された宗教としての地位を獲得した。らんらんるーは永恒の祈りとなった！"

 # =============================================
 # NATIONAL FOCUS - 企業統治ルート
 # =============================================

 MAC_Governance_by_corporations:0 "企業による統治"
 MAC_Governance_by_corporations_desc:0 "ドナルド個人のカリスマではなく、企業としての組織力で国家を運営する。効率化と利益追求こそが国家の使命だ！"

 MAC_Increase_production_of_burgers:0 "ハンバーガーの増産"
 MAC_Increase_production_of_burgers_desc:0 "ハンバーガーの生産量を劇的に増加させる。全ての国民に安価で安定したハンバーガーの供給を！"

 MAC_Encourage_burgers:0 "ハンバーガーの奨励"
 MAC_Encourage_burgers_desc:0 "ハンバーガー消費を国策として推進する。一日三食ハンバーガーこそ健やかな生活の基盤だ！"

 MAC_Start_of_Happy_Set:0 "ハッピーセットの開始"
 MAC_Start_of_Happy_Set_desc:0 "子どもたちに夢のハッピーセットを提供し、次世代の忠実な顧客を育成する。おもちゃは国家の重要施策である！"

 MAC_Expansion_of_private_demand:0 "民需の拡大"
 MAC_Expansion_of_private_demand_desc:0 "民間需要を拡大し、ハンバーガー経済圏を強固なものにする。消費こそが国力の源だ！"

 MAC_Economic_acceleration:0 "経済の加速"
 MAC_Economic_acceleration_desc:0 "マクドナルド経済圏の成長をさらに加速させる。倍ダブルトリプルマックの如く経済を膨張させろ！"

 MAC_Establishment_of_subsidiaries:0 "子会社の設立"
 MAC_Establishment_of_subsidiaries_desc:0 "関連事業を展開する子会社を次々と設立する。不動産、物流、広告…全てがマクドナルド傘下に！"

 MAC_seizing_control_of_the_economy:0 "経済の掌握"
 MAC_seizing_control_of_the_economy_desc:0 "国家経済の全てをマクドナルドの管理下に置く。もはやGDPとは「ゴーデル・バーガー・パティ」の略である！"

 MAC_Buying_the_World:0 "世界の購入"
 MAC_Buying_the_World_desc:0 "フランチャイズ料で得た資金で世界中の資産を買い漁る。不動産帝国マクドナルド、ここに爆誕！"

 MAC_unstoppable_rise:0 "止まらない上昇"
 MAC_unstoppable_rise_desc:0 "マクドナルドの成長はもはや誰にも止められない。株価は月面へ、売上は宇宙へ！"

 MAC_ucollapse:0 "崩壊"
 MAC_ucollapse_desc:0 "あまりの急成長にシステムが悲鳴を上げている。全てが崩れ落ちる前に、何かを決断しなければ…。"

 # =============================================
 # NATIONAL FOCUS - コーラ戦争
 # =============================================

 MAC_start_cola_war:0 "コーラ戦争の開始"
 MAC_start_cola_war_desc:0 "コカ・コーラとペプシ・コーラ、二大コーラ帝国の全面戦争に突入する。どちらが真のコーラか、この戦いで決着をつける！"

 MAC_coca_cola:0 "コカ・コーラ陣営"
 MAC_coca_cola_desc:0 "コカ・コーラの赤き旗の下に集え！世界中で愛される古典のコーラ、それがコカ・コーラだ！"

 MAC_pepsi_cola:0 "ペプシ陣営"
 MAC_pepsi_cola_desc:0 "ペプシの青き旗の下に集え！若者と挑戦者の味方、それがペプシだ！"

 MAC_cola_capitalism:0 "コーラ資本主義"
 MAC_cola_capitalism_desc:0 "資本主義の力を借りてコカ・コーラの市場支配力を強化する。金が全てを解決する！"

 MAC_promote_lobbying:0 "ロビー活動の促進"
 MAC_promote_lobbying_desc:0 "連邦議会へのロビー活動を強化し、コカ・コーラに有利な法案を次々と可決させる。民主主義は金で動く！"

 MAC_partnership_with_WalMart:0 "ウォルマートとの提携"
 MAC_partnership_with_WalMart_desc:0 "世界最大の小売企業ウォルマートと提携し、コカ・コーラの流通網を劇的に拡大する。"

 MAC_mass_propaganda_campaign:0 "大規模宣伝戦"
 MAC_mass_propaganda_campaign_desc:0 "大規模なプロパガンダキャンペーンを展開し、国民の心をコカ・コーラ一色に染め上げる。"

 MAC_cooperation_with_NRA:0 "全米ライフル協会との協力"
 MAC_cooperation_with_NRA_desc:0 "全米ライフル協会と協力関係を築き、コカ・コーラ派の武力を強化する。銃とコーラ、この二つがあれば怖いものなし！"

 MAC_coca_cola_win:0 "コカ・コーラの勝利"
 MAC_coca_cola_win_desc:0 "コーラ戦争は終結した。コカ・コーラの圧倒的勝利である。永遠にコーク！"

 MAC_Global_Distribution_Network:0 "世界的流通網"
 MAC_Global_Distribution_Network_desc:0 "コカ・コーラの流通網を全世界に拡張する。どこにいてもコークが飲める世界を目指せ！"

 MAC_The_Santa_Claus_Image:0 "サンタクロースのイメージ"
 MAC_The_Santa_Claus_Image_desc:0 "コカ・コーラが作り上げたサンタクロースのイメージを戦略的に活用する。赤い服のサンタはコークの広告だったのだ！"

 MAC_Formula_No_7:0 "フォーミュラNo.7"
 MAC_Formula_No_7_desc:0 "コカ・コーラの秘伝のレシピ「フォーミュラNo.7」を解明し、研究力の飛躍的向上を実現する。秘密の成分は…企業秘密だ！"

 MAC_Global_Bottling_Plants:0 "世界的ボトリング工場"
 MAC_Global_Bottling_Plants_desc:0 "世界中にボトリング工場を建設し、コカ・コーラの生産能力を最大化する。"

 MAC_pepsi_propaganda:0 "ペプシ・プロパガンダ"
 MAC_pepsi_propaganda_desc:0 "ペプシのプロパガンダを展開し、議会での支持を拡大する。ペプシ・チャレンジはここから始まる！"

 MAC_alliance_with_Soviets:0 "ソビエトとの共闘"
 MAC_alliance_with_Soviets_desc:0 "ソビエト連邦とペプシの販売提携を結び、共産圏へのペプシ進出を画策する。赤い国に青いコーラを！"

 MAC_pepsi_march:0 "ペプシの行進"
 MAC_pepsi_march_desc:0 "ペプシ支持者たちの大行進を組織し、議会への圧力を強化する。ペプシ・マーチ、全米を駆け抜けろ！"

 MAC_VS_Leonard:0 "レナードとの戦い"
 MAC_VS_Leonard_desc:0 "レナード対ペプシコ事件の法廷闘争に挑む。7百万ペプシポイントの行方はいかに！"

 MAC_pepsi_win:0 "ペプシの勝利"
 MAC_pepsi_win_desc:0 "コーラ戦争は終結した。ペプシ・コーラの圧倒的勝利である。ペプシマンも泣いて喜ぶ！"

 MAC_get_Harrier:0 "ハリアーを入手"
 MAC_get_Harrier_desc:0 "ペプシポイント7百万点でハリアージェット機を手に入れる…はずだった。裁判の結果如何では巨額の賠償が必要になるかもしれない。"

 MAC_pepsi_navy:0 "ペプシ海軍"
 MAC_pepsi_navy_desc:0 "ペプシの力で海軍を建設する。かつてペプシはソ連から潜水艦艦隊と対空ミサイル駆逐艦を入手した実績がある。歴史は繰り返す！"

 MAC_pepsiman_division:0 "ペプシマン師団"
 MAC_pepsiman_division_desc:0 "伝説のペプシマンを指揮官とする精鋭師団を編成する。彼はどんな障害物もペプシと共に乗り越える！"

 MAC_securing_rawmaterials:0 "原材料の確保"
 MAC_securing_rawmaterials_desc:0 "ペプシ生産に必要な原材料を確保するため、南米への進出を図る。コーラの原料は国の命運を握る！"

 MAC_pepsi_guerrilla:0 "ペプシ・ゲリラ"
 MAC_pepsi_guerrilla_desc:0 "ペプシ支持者のゲリラ部隊を組織し、コカ・コーラ支配地域で抵抗活動を展開する。"

 MAC_organise_militias:0 "民兵の組織化"
 MAC_organise_militias_desc:0 "双方の陣営の民兵を統合し、正規軍に近い戦力を構築する。"

 MAC_pre_emptive_uprising:0 "先制蜂起"
 MAC_pre_emptive_uprising_desc:0 "相手方に先んじて武装蜂起を起こし、内戦の主導権を握る。勝つか死ぬか、コーラの名誉をかけた最終決戦だ！"

 # =============================================
 # NATIONAL FOCUS - 共通コーラ戦争
 # =============================================

 MAC_loans_from_banks:0 "銀行からの融資"
 MAC_loans_from_banks_desc:0 "銀行から融資を受け、コーラ戦争の資金を確保する。金利なんて気にするな、コーラのためだ！"

 MAC_plant_expansion:0 "工場の拡充"
 MAC_plant_expansion_desc:0 "コーラ生産工場を拡充し、生産能力を強化する。より多くのコーラ、より強い国！"

 MAC_state_of_US_congress:0 "連邦議会での演説"
 MAC_state_of_US_congress_desc:0 "連邦議会での演説を通じて影響力を拡大する。言葉はコーラより強い…かもしれない。"

 MAC_dr_pepper:0 "ドクター・ペッパー"
 MAC_dr_pepper_desc:0 "第三のコーラ、ドクター・ペッパーを味方につける。23種類のフレーバーは23の議席に相当する！"

 MAC_saida:0 "サイダー"
 MAC_saida_desc:0 "サイダー陣営を取り込み、議会での支持を拡大する。炭酸は炭酸、味方は味方だ！"

 MAC_alcola:0 "アルコーラ"
 MAC_alcola_desc:0 "アルコーラを味方につけ、議会での影響力をさらに強化する。酒とコーラは仲良し…か？"

 MAC_against_bking:0 "バーガーキングへの対抗"
 MAC_against_bking_desc:0 "最大のライバル、バーガーキングに対抗策を打ち出す。王などマクドナルドの敵ではない！"

 MAC_with_bking:0 "バーガーキングとの協力"
 MAC_with_bking_desc:0 "バーガーキングと協力関係を築き、ファストフード帝国を盤石なものにする。王と道化の同盟！"

