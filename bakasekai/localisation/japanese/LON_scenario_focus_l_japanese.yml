l_japanese:
 LON_ts_census:0 "島の住所を調べる"
 LON_ts_census_desc:0 "島の全住民をロンドン市民として登録する国勢調査を始める。納税先は明確になるはずだったが、誰が住民を代表するのかという問いが残った。"
 LON_ts_bridge_conference:0 "橋の請求書を開く"
 LON_ts_bridge_conference_desc:0 "ロンドン橋の修繕費を英国、シティ、地方議会の誰が負担するのか。出資者が求める監督権と、島の住民が求める代表権を同じ会議で扱う。"
 LON_ts_constitution:0 "三つの主権を議場へ"
 LON_ts_constitution_desc:0 "代表会議と橋の負担交渉を踏まえ、島の憲法会議を開く。アイルランドの政府、ロンドン市の特権、英国との関係を各当事者の選択で決める。"
 LON_ts_bridge_engineers:0 "橋梁技師団を常設する"
 LON_ts_bridge_engineers_desc:0 "橋の安全点検を臨時委員会任せにせず、常設の技師団を設置する。損耗を軽減し、修繕費を巡る争いに技術的な根拠を与える。"
 LON_ts_credit_exports:0 "契約を海の向こうへ"
 LON_ts_credit_exports_desc:0 "島の統治方針とは別に、金融網は海を越えて広がる。投資契約と信用調査の業務を整え、世界への影響力を安定した事業に変える。"
 LON_ts_accord_charter:0 "三者協約を行政に移す"
 LON_ts_accord_charter_desc:0 "アイルランドの自治、ロンドンの金融業務、英国との協力を、それぞれの議会が監査できる行政手続きにする。協約の署名は共同統治の出発点である。"
 LON_ts_republic_trade:0 "共和国との通商窓口"
 LON_ts_republic_trade_desc:0 "アイルランド共和国の成立を尊重し、徴税によって結び付いていた関係を通商契約へと改める。領土の移譲後も、対話と投資の窓口を維持する。"
 LON_ts_city_charter:0 "市民が承認する特許状"
 LON_ts_city_charter_desc:0 "シティの自治を守るため、島の住民が参加できる議会と予算監査を特許状に盛り込む。金融界の特権と市民の権利を両立させる。"
 LON_ts_hardline_mandate:0 "市当局の非常委任"
 LON_ts_hardline_mandate_desc:0 "分裂した島で市当局の統治を維持するため、非常予算と防衛計画を承認する。軍事的な備えを進めても、英国との対立を自動的に解決できるわけではない。"
 LON_ts_independence:0 "シティの独立を交渉する"
 LON_ts_independence_desc:0 "英国政府にロンドン自治領の独立を正式に要求する。英国側は承認か拒否を選び、拒否された場合には我々が妥協か対決かを改めて判断する。"
 LON_ts_two_londons:0 "本来のロンドンを要求する"
 LON_ts_two_londons_desc:0 "海の向こうのロンドン州126を、市当局の本来の所在地として要求する。英国の承諾がなければ移譲は成立せず、強制を選ぶ場合には新たな紛争が待つ。"
