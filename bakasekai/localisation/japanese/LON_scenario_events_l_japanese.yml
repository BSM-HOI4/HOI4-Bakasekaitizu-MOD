l_japanese:
 LON.30.t:0 "島の住所を決める国勢調査"
 LON.30.desc:0 "全島をロンドン市域として課税するため、国勢調査が始まった。地方議会からは「我々がロンドン市民なら、海の向こうにあるロンドンは何なのか」と質問状が届いている。"
 LON.30.a:0 "地方議会を調査委員会に招こう。"
 LON.30.b:0 "住所は市が決める。"
 LON.31.t:0 "アイルランド代表会議"
 LON.31.desc:0 "課税先、選挙権、土地行政について話し合うため、地方議会が代表を送ってきた。会議はまだ国家ではない。だが、その同意なしに島を統治し続けることは難しい。"
 LON.31.a:0 "交渉の席を設ける。"
 LON.32.t:0 "ロンドン橋の修繕会議"
 LON.32.desc:0 "橋の損耗を誰が負担するか。英国は監督権を、市の銀行は返済財源を、代表会議は予算の監査権を求めている。橋の修理が、島の主権を決める交渉になった。"
 LON.32.a:0 "英国政府に援助を要請する。"
 LON.32.b:0 "シティの公債で費用を賄う。"
 LON.32.c:0 "地方議会との共同予算にする。"
 LON.32.d:0 "修繕は後回しにする。"
 LON.33.t:0 "海の向こうのロンドンからの請求書"
 LON.33.desc:0 "自治領ロンドンが橋の修繕費を求めている。援助は英国の関与を維持する機会だが、島の議会は監督権の拡大に反対している。"
 LON.33.a:0 "監督を条件に援助する。"
 LON.33.b:0 "自治領の会計で解決すべきだ。"
 LON.34.t:0 "援助は届かなかった"
 LON.34.desc:0 "英国は費用負担を断った。修繕費は市か地方議会が負担するほかない。"
 LON.34.a:0 "公債を発行する。"
 LON.34.b:0 "地方議会と予算を組む。"
 LON.35.t:0 "修繕協定の成立"
 LON.35.desc:0 "英国の援助と監督の下で橋の修繕が始まった。交通の不安は解消するが、監督権をどこまで認めるかという問題が残る。"
 LON.35.a:0 "次は統治の仕組みを決めよう。"
 LON.36.t:0 "二つの島、三つの主権"
 LON.36.desc:0 "代表会議は憲法会議への移行を求めた。マンスターとコノートにアイルランド政府を成立させ、その政府と英国の同意を得て最終協定を結ぶ。市は当面ダブリンと北部を保持する。"
 LON.36.a:0 "三者協約を提案する。"
 LON.36.b:0 "共和国と、ロンドンの帰還を交渉する。"
 LON.36.c:0 "島の自治とシティの自治を両立させる。"
 LON.36.d:0 "市の支配権は譲らない。"
 LON.37.t:0 "アイルランド政府の最初の議決"
 LON.37.desc:0 "マンスターとコノートで我々の政府が発足した。ロンドン市当局は協定案を提出している。新政府には、それを承認する権利も拒む権利もある。"
 LON.37.a:0 "交渉案を承認し、英国の回答を待つ。"
 LON.37.b:0 "共和国の権限を明記した対案を出す。"
 LON.37.c:0 "承認しない。独立は既成事実だ。"
 LON.38.t:0 "アイルランド憲法会議への回答"
 LON.38.desc:0 "島の政府と市当局が統治の協定を求めている。英国の軍事・外交上の関与は条約の対象となり、無制限の権限ではなくなる。"
 LON.38.a:0 "両政府の合意を承認する。"
 LON.38.b:0 "この条件では承認できない。"
 LON.39.t:0 "憲法協定の調印"
 LON.39.desc:0 "三者の権限を分ける協定が成立した。アイルランド政府は実体を持つ国家として、市当局は自らの特権に制約を受ける政府として、新しい関係に入る。"
 LON.39.a:0 "協定を発効させる。"
 LON.40.t:0 "会議の行き詰まり"
 LON.40.desc:0 "提出した案はそのままでは承認されなかった。三者の権限を限定する対案で合意を探るか、市の権威を優先して交渉を打ち切るか。"
 LON.40.a:0 "相互承認の対案を送り、再度の承認を求める。"
 LON.40.b:0 "交渉を打ち切る。"
 LON.41.t:0 "独立を守る方法"
 LON.41.desc:0 "市当局との交渉は決裂した。まず国境を安定させるか、ダブリンの解放を戦争で求めるか。英国との戦争が波及する危険もある。"
 LON.41.a:0 "現在の国境を守り、外交交渉を続ける。"
 LON.41.b:0 "ダブリンへ進軍する。"
 LON.42.t:0 "シティの独立請願"
 LON.42.desc:0 "住民代表との合意を経た市当局は、英国との関係も条約に基づく対等な関係へ改めようとしている。"
 LON.42.a:0 "英国政府へ正式に独立を請願する。"
 LON.43.t:0 "シティの独立を認めるか"
 LON.43.desc:0 "ロンドン自治領から独立請願が届いた。認めれば島への直接的な支配権は失われるが、合意による独立は通商関係を保つ道にもなる。"
 LON.43.a:0 "独立を承認する。"
 LON.43.b:0 "自治領の地位を維持する。"
 LON.44.t:0 "ロンドンをロンドンへ返す"
 LON.44.desc:0 "市当局はアイルランド共和国にダブリンを移譲する代わりに、実際のロンドン州へ帰還したいと申し出た。英国にとって首都地域の移譲は重大な譲歩だ。北部の地位は今回の取引に含まれない。"
 LON.44.a:0 "特別自治市への移譲を認める。"
 LON.44.b:0 "首都地域は譲れない。現状の共和国を承認する。"
 LON.45.t:0 "本来のロンドンを要求する"
 LON.45.desc:0 "強硬派は、海の向こうのロンドン州こそ市の本来の領土だと主張した。要求を送れば英国との関係を損ねる。"
 LON.45.a:0 "州126の移譲を要求する。"
 LON.45.b:0 "要求は撤回する。"
 LON.46.t:0 "独立請願の拒否"
 LON.46.desc:0 "英国は独立を拒否した。自治領に留まるか、一方的な独立を宣言するか。宣言後の英国の反応は我々には決められない。"
 LON.46.a:0 "今は自治領として留まる。"
 LON.46.b:0 "独立を宣言する。"
 LON.47.t:0 "自治領の一方的独立"
 LON.47.desc:0 "市当局が英国からの独立を宣言した。武力で引き戻すか、事実として受け入れるか。"
 LON.47.a:0 "外交関係を結び直す。"
 LON.47.b:0 "離脱を武力で阻止する。"
 LON.48.t:0 "ロンドンからロンドンへの最後通牒"
 LON.48.desc:0 "島の市当局が、英国本土のロンドン州の移譲を要求している。受諾は英国の威信を傷つけ、拒否は武力衝突の危険を伴う。"
 LON.48.a:0 "要求を拒否する。"
 LON.48.b:0 "戦争を避けるため移譲する。"
 LON.49.t:0 "最後通牒への拒絶"
 LON.49.desc:0 "英国はロンドン州の移譲を拒んだ。戦争を選べば、島のアイルランド政府とも対立したまま海を渡ることになる。"
 LON.49.a:0 "要求を取り下げる。"
 LON.49.b:0 "二つのロンドンに決着をつける。"
 LON.50.t:0 "二国間停戦の申し入れ"
 LON.50.desc:0 "[IRE.GetName] が現戦線での停戦を提案している。この合意は両国間の戦争を対象とし、第三国との戦争や最終的な領土問題は別の交渉となる。"
 LON.50.a:0 "停戦を受け入れる。"
 LON.50.b:0 "停戦には応じない。"
 LON.51.t:0 "二国間停戦の申し入れ"
 LON.51.desc:0 "[LON.GetName] が現戦線での停戦を提案している。この合意は両国間の戦争を対象とし、第三国との戦争や最終的な領土問題は別の交渉となる。"
 LON.51.a:0 "停戦を受け入れる。"
 LON.51.b:0 "停戦には応じない。"
 LON.52.t:0 "二国間停戦の申し入れ"
 LON.52.desc:0 "[IRE.GetName] が現戦線での停戦を提案している。この合意は両国間の戦争を対象とし、第三国との戦争や最終的な領土問題は別の交渉となる。"
 LON.52.a:0 "停戦を受け入れる。"
 LON.52.b:0 "停戦には応じない。"
 LON.53.t:0 "北アイルランドの地位協議"
 LON.53.desc:0 "アイルランド政府が北部の地位について協議を求めた。英国が保持する場合は移譲の承認を、市当局が保持する場合は英国の仲介を求めている。"
 LON.53.a:0 "協議に応じる。"
 LON.53.b:0 "現状を維持する。"
 LON.54.t:0 "英国の仲介による北部協議"
 LON.54.desc:0 "英国は北部の地位協議に応じた。島の統一を認めるか、市の統治権を維持するかは、現在の領有者である我々の判断に委ねられている。"
 LON.54.a:0 "住民代表を含む移譲協定を承認する。"
 LON.54.b:0 "北部の統治権を維持する。"
 LON.55.t:0 "北部協定への署名"
 LON.55.desc:0 "北部の領有者が移譲案を承認した。署名すれば北部を共和国へ編入する。拒否すれば現在の国境を維持する。"
 LON.55.a:0 "協定に署名する。"
 LON.55.b:0 "今回は署名しない。"
 LON_ts_negotiations_desc:0 "地方の代表会議が課税、選挙権、土地行政の協議を求めている。彼らはまだ独立した国家ではないが、島の住民を代表する組織として席を求めている。"
 LON_ts_agreement_desc:0 "市当局と代表会議の協議が終わる。合意して住民の政治参加を認めるか、交渉を打ち切って次の憲法会議へ問題を持ち越すか。"
 LON_ts_assembly_tt:0 "代表会議との協議を終え、橋の修繕交渉と憲法会議へ進める。"
