l_japanese:

  # =============================================
  # EVENTS - LON.1 ~ LON.10: ロンドン市長就任ニュース
  # =============================================

  LON.1.t:0 "新市長就任：フランク・ニューソン・スミス"
  LON.1.desc:0 "ロンドン市庁舎の大広間に鐘が鳴り響き、フランク・ニューソン・スミス氏が新たなロンドン市長に就任した。シティの金融街から熱い拍手が送られ、新政権のもとでロンドンの黄金時代が続くことが期待されている。"

  LON.2.t:0 "新市長就任：ジョン・ローリー"
  LON.2.desc:0 "ジョン・ローリー氏がロンドン市長の鎖袍を身にまとった。市庁舎前には祝砲が響き渡り、市民たちは新市長の手腕に大きな期待を寄せている。"

  LON.3.t:0 "新市長就任：ジョージ・ウィルキンソン"
  LON.3.desc:0 "ロンドンの政治の舞台に新顔が登場した。ジョージ・ウィルキンソン氏が市長就任の宣誓を行い、シティ・オブ・ロンドンの未来に新たな一歩を刻んだ。"

  LON.4.t:0 "新市長就任：フランク・ボウアター"
  LON.4.desc:0 "フランク・ボウアター氏がロンドン市長に選出された。名門ボウアター家の伝統と名誉を受け継ぐ彼の就任は、ロンドン市民に安堵と誇りをもたらしている。"

  LON.5.t:0 "新市長就任：ハリー・トワイフォード"
  LON.5.desc:0 "ハリー・トワイフォード氏が新たなロンドン市長に就任した。テムズ川の渡し守の末裔として知られる彼の就任演説は、橋と結びつきの重要性を力強く訴えた。"

  LON.6.t:0 "新市長就任：ブレースウェル・スミス"
  LON.6.desc:0 "ブレースウェル・スミス氏がロンドン市長の座に就いた。実業界からの強力な支援を背景に、彼はロンドンを世界有数の商業都市へと押し上げることを誓った。"

  LON.7.t:0 "新市長就任：サミュエル・ジョセフ"
  LON.7.desc:0 "サミュエル・ジョセフ氏がロンドン市長に就任した。市庁舎のバルコニーから市民に手を振る彼の姿は、困難な時代における希望の象徴として人々の心に焼き付いた。"

  LON.8.t:0 "新市長就任：チャールズ・デイヴィス"
  LON.8.desc:0 "チャールズ・デイヴィス氏が新たなロンドン市長に選ばれた。堅実な行政手腕で知られる彼の就任は、混迷する情勢の中で安定をもたらすものと期待されている。"

  LON.9.t:0 "新市長就任：ウィリアム・コクセン"
  LON.9.desc:0 "ウィリアム・コクセン氏がロンドン市長の鎖袍を受け取った。長年シティの発展に尽くしてきた彼の経験は、まさにこの時代にふさわしい指導力を約束するものだ。"

  LON.10.t:0 "新市長就任：フランク・アレクサンダー"
  LON.10.desc:0 "フランク・アレクサンダー氏がロンドン市長に就任した。祝賀パレードがシティの通りを練り歩き、新市長への信頼と期待がロンドン中に広がっている。"

  # =============================================
  # EVENTS - LON.11 ~ LON.12: アイルランド交渉
  # =============================================

  LON.11.t:0 "アイルランドとの対話の扉"
  LON.11.desc:0 "長きにわたる緊張関係の後、アイルランドとの交渉の機会が訪れた。テムズの霧の向こうから届いた書簡には、隣人として歩み寄る意思が記されている。ロンドンとして真剣に向き合うべきか、それとも従来の強硬路線を維持すべきか——判断を迫られている。"
  LON.11.a:0 "交渉の席につこう"
  LON.11.b:0 "我々に妥協する必要はない"

  LON.12.t:0 "交渉の行方"
  LON.12.desc:0 "アイルランドとの交渉が進展を見せている。テーブルを挟んだ議論は時に白熱したが、双方に歩み寄る姿勢も見えた。合意に達して新たな友好関係を築くか、それとも溝を深めることになるか——歴史的な瞬間が近づいている。"
  LON.12.a:0 "合意に達した！"
  LON.12.b:0 "交渉は決裂した……"

  # =============================================
  # EVENTS - LON.13: ドミニオン地位獲得
  # =============================================

  LON.13.t:0 "ロンドンの地位向上"
  LON.13.desc:0 "ロンドンの経済力と政治的影響力が目覚ましい成長を遂げた今、我々はイギリス本国に対しドミニオンとしての地位を求めることができる。これはロンドンが独立した政治主体として認められる歴史的な一歩となるだろう。ロンドンの運命は、ウェストミンスターの回答を待っている。"
  LON.13.a:0 "イギリスが同意した！"
  LON.13.b:0 "イギリスは我々の要請を退いた"

  # =============================================
  # EVENTS - LON.14 ~ LON.16: ロンドン橋イベント
  # =============================================

  LON.14.t:0 "ロンドン橋、崩落！"
  LON.14.desc:0 "独立の混乱の中、ロンドン橋が崩落した！テムズ川を行き来する船の乗組員たちが悲鳴を上げ、瓦礫が川面に次々と落ちていく。長年シティの象徴として親しまれてきた橋が、今やただの障害物と化してしまった。これは予兆なのか、それともただの災難なのか——いずれにせよ、修理には莫大な労力が必要だ。"

  LON.15.t:0 "ロンドン橋の損耗"
  LON.15.desc:0 "ロンドン橋に新たな損傷が見つかった。テムズ川の冷たい流れと時折襲う暴風雨が、石材の目地を少しずつ削り取っている。桥の上を行き交う馬車と行人は何事もないかのように通り過ぎるが、橋の下では不穏な音が響き始めている。そろそろ本格的な修繕を検討すべきかもしれない。"

  LON.16.t:0 "警告：ロンドン橋が危険な状態に！"
  LON.16.desc:0 "技術者団が緊急報告を提出した——ロンドン橋の損耗度が危険水域に達している！あの有名な童谣「ロンドン橋落ちた」を文字通りに実現させないためにも、直ちに大規模な修繕を行わなければならない。橋が崩落すれば、テムズ川の交通が麻痺し、ロンドンの経済は致命的な打撃を受けるだろう。"

  # =============================================
  # EVENTS - LON.17: バトル中央銀行危機
  # =============================================

  LON.17.t:0 "バトル中央銀行危機勃発！"
  LON.17.desc:0 "シティの金融街に暗雲が立ち込めている。バトル中央銀行の危機が波及し、ロンドンの金融市場は混乱に陥った。ポンド紙幣が風に舞うように価値を失い、銀行家たちは青ざめた顔で走り回っている。この危機を乗り越えられなければ、ロンドンの金融覇権は砂上の楼閣と化すだろう。"

  # =============================================
  # EVENTS - LON.18 ~ LON.19: ケルト統一
  # =============================================

  LON.18.t:0 "ケルトの旗の下に"
  LON.18.desc:0 "島の統治問題に決着がついた今、独立したアイルランド政府に対等な連邦協約を提案できる。参加は任意であり、領土や主権の移譲を求めるものではない。"
  LON.18.a:0 "対等な連邦協約を提案する"
  LON.18.b:0 "時には力も必要だ"

  LON.19.t:0 "ロンドンからの提案"
  LON.19.desc:0 "ロンドン政府から、主権と国境を維持したまま経済・政治協力を進める連邦協約の提案が届いた。我々には協力を承認する権利も、参加を断る権利もある。"
  LON.19.a:0 "主権を保って協約へ参加する"
  LON.19.b:0 "アイルランドの独立は譲れない"

  # =============================================
  # EVENTS - LON.20 ~ LON.21: 国際投資
  # =============================================

  LON.20.t:0 "ロンドンからの投資提案"
  LON.20.desc:0 "ロンドンの金融資本が我が国への投資を申し出てきた。シティの銀行家たちは我が国の成長潜在力に目を付け、資本と技術の提供を約束している。外国資本の流入は経済成長を促すが、同時にロンドンの影響力拡大も意味する。受け入れるべきか、それとも独自路線を貫くべきか。"
  LON.20.a:0 "投資を歓迎する"
  LON.20.b:0 "我が国は自力で立ち上がる"

  LON.21.t:0 "ロンドンからの民主主義支援"
  LON.21.desc:0 "ロンドンが民主主義国家としての我が国に特別な投資を提案してきた。これは単なる経済援助ではなく、自由世界の結束を強めるという理念に基づくものだ。しかし、外国の干渉を警戒する声も根強い。ロンドンの資本を受け入れるか、独自の道を歩むか——国民の判断が求められている。"
  LON.21.a:0 "民主主義の仲間として受け入れよう"
  LON.21.b:0 "外国の干渉は受け入れられない"

  # =============================================
  # NATIONAL FOCUS - ロンドン国家方針
  # =============================================

  LON_fundamentals:0 "基盤構築"
  LON_fundamentals_desc:0 "ロンドンが独立した政治主体として機能するためには、まず足場を固めなければならない。市政の整備、産業の育成、そして市民の信頼——これら全てを出発点として確立する。"

  LON_financial_hub:0 "金融覇権"
  LON_financial_hub_desc:0 "シティ・オブ・ロンドンは世界金融の中心たり得る。銀行、証券取引所、保険市場——これらを統合し、ロンドンを国際金融の要塞へと昇華させる。金の流れを支配する者が、世界を支配するのだ。"

  LON_commonwealth_relations:0 "英連邦外交"
  LON_commonwealth_relations_desc:0 "ロンドンは英連邦の伝統的絆を活かし、イギリス本土および連邦諸国との関係を強化する。共通の言語と法体系、そして歴史的結びつきは、強固な外交基盤となるだろう。"

  LON_celtic_unification:0 "ケルト統一への道"
  LON_celtic_unification_desc:0 "憲法協定の後、独立したアイルランド政府に対等な連邦協約を提案する。参加には相手の同意を必要とし、国境や主権を自動で変更することはない。"

  LON_global_influence:0 "世界影響力"
  LON_global_influence_desc:0 "金融基盤と英連邦外交を足場に世界各国へ投資を広げる。島の政治的決着やケルト協約とは独立して、金融国家としての道を進む。"

