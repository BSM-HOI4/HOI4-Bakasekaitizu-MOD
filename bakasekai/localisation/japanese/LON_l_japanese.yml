  # =============================================
  # IDEAS
  # =============================================

  LON_economic_downturn:0 "経済不況"
  LON_economic_downturn_desc:0 "バトル中央銀行危機の波及により、ロンドンの経済は深刻な不況に陥っている。シティの銀行家たちの顔から血の気が引き、街角には閉鎖された店舗のシャッターが目立つようになった。"
  LON_economic_recovery_effort:0 "経済回復努力"
  LON_economic_recovery_effort_desc:0 "ロンドンは危機から立ち直るための回復措置を実施している。銀行の再編と財政出動が進み、少しずつだが経済指標に回復の兆しが見え始めている。"
  LON_strong_economic_measures:0 "強力な経済対策"
  LON_strong_economic_measures_desc:0 "断固たる経済対策により、ロンドンの金融システムは安定を取り戻しつつある。シティの銀行家たちも再び笑顔を見せ始め、市場には活気が戻ってきた。"
  LON_international_financial_center:0 "国際金融センター"
  LON_international_financial_center_desc:0 "ロンドンは世界金融の中心地としての地位を確立した。シティの銀行と取引所は日夜稼働し、世界中の資本がテムズのほとりに集まってくる。"
  LON_global_financial_network:0 "グローバル金融ネットワーク"
  LON_global_financial_network_desc:0 "ロンドンの金融ネットワークは世界中に張り巡らされている。資本の力を通じて各国に影響力を及ぼし、投資という名の外交を展開する。ロンドンの財布の紐を握る者が、世界を動かすのだ。"
  LON_foreign_investment:0 "外国投資の流入"
  LON_foreign_investment_desc:0 "ロンドンからの投資により、国内産業に活気が生まれている。資本と技術の流入は経済成長を促進し、雇用を創出している。"

