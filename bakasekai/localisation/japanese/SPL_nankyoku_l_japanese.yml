l_japanese:
  # イベント: 内戦 (SPL_naisen)
  SPL_naisen.0.t:0 "不穏な空気"
  SPL_naisen.0.d:0 "国内で不満の声が高まっている。何か手を打たねばならない。"
  SPL_naisen.0.a:0 "様子を見よう"
  SPL_naisen.1.t:0 "抗議活動の激化"
  SPL_naisen.1.d:0 "民衆の抗議が激化し、政府への不信感が募っている。"
  SPL_naisen.1.a:0 "なんとか宥和しなければ……"
  SPL_naisen.2.t:0 "内戦の勃発"
  SPL_naisen.2.d:0 "ついに武装蜂起が発生した。国家は内戦状態に突入した。"
  SPL_naisen.2.a:0 "全力で鎮圧する"
  SPL_naisen.3.t:0 "国家の崩壊"
  SPL_naisen.3.d:0 "内戦は国家を崩壊させた。南極の地に新たな秩序が生まれようとしている。"
  SPL_naisen.3.a:0 "新たな秩序を受け入れる"

  # 国家方針: 南極
  SPL_guotunozaikaifa:0 "国土の再開発"
  SPL_guotunozaikaifa_desc:0 "国土のインフラを再整備し、国民生活の基盤を立て直す。"
  SPL_shunying:0 "順応"
  SPL_shunying_desc:0 "過酷な南極の環境に適応し、生存のための知恵を身につける。"
  SPL_woranoshen:0 "我らの神"
  SPL_woranoshen_desc:0 "古来より伝わる信仰を復興し、国民の精神的支柱を確立する。"
  SPL_rennozhixing:0 "人の知性"
  SPL_rennozhixing_desc:0 "人類の知性と理性を重んじ、知識による統治を目指す。"
  SPL_guojianobenghuai:0 "国家の崩壊"
  SPL_guojianobenghuai_desc:0 "国家体制は限界に達している。内戦を経て、新たな道を切り開く。"
  SPL_zhengzhihuiyiwokaiku:0 "政治会議を開く"
  SPL_zhengzhihuiyiwokaiku_desc:0 "各界の代表を集め、国の進むべき方向について議論する。"
  SPL_jichujiaoyunoqianghua:0 "基礎教育の強化"
  SPL_jichujiaoyunoqianghua_desc:0 "教育制度を強化し、次世代を担う人材を育成する。"
  SPL_poruzhongyan:0 "迫る終焉"
  SPL_poruzhongyan_desc:0 "国家の崩壊が迫る中、滅びの影が忍び寄る。"
  SPL_weizhinobingyuanjun:0 "未知の病原菌"
  SPL_weizhinobingyuanjun_desc:0 "正体不明の病原菌が蔓延し始めた。対策が急務である。"
  SPL_xiangzhounojianzao:0 "箱舟の建造"
  SPL_xiangzhounojianzao_desc:0 "終焉から逃れるため、巨大な箱舟の建造計画を始動する。"
  SPL_taimurimituto:0 "タイム・リミット"
  SPL_taimurimituto_desc:0 "残された時間は限られている。決断の時が迫っている。"
  SPL_weijikaranotuoque:0 "危機からの脱却"
  SPL_weijikaranotuoque_desc:0 "箱舟と時間稼ぎの成果を結集し、危機を脱する計画を実行する。"
  SPL_shijienozhongyan:0 "世界の終焉"
  SPL_shijienozhongyan_desc:0 "すべては終わりへと向かっている。世界の最期を見届ける。"
  SPL_jishunoxinyang:0 "技術の信仰"
  SPL_jishunoxinyang_desc:0 "技術を信仰の対象とし、技術的進歩を国策の中核に据える。"
  SPL_yanjiunojiasu:0 "研究の加速"
  SPL_yanjiunojiasu_desc:0 "研究体制を拡充し、科学技術の発展を加速させる。"
  SPL_jishugexin:0 "技術革新"
  SPL_jishugexin_desc:0 "革新的な技術を開発し、文明の飛躍的進歩を実現する。"
  SPL_biyaojishunoyanjiu:0 "必要技術の研究"
  SPL_biyaojishunoyanjiu_desc:0 "国家の存続に不可欠な技術を特定し、優先的に研究する。"
  SPL_jiyijichengjishunokaifa:0 "記憶継承技術の開発"
  SPL_jiyijichengjishunokaifa_desc:0 "記憶を次世代へ継承する技術の開発に着手する。"
  SPL_95:0 "95"
  SPL_95_desc:0 "プロジェクト95——人類の未来を担う究極の計画。"
  SPL_guancejidinoxiufu:0 "観測基地の修復"
  SPL_guancejidinoxiufu_desc:0 "古い観測基地を修復し、外部世界との接点を復活させる。"
  SPL_jishuhenohuigui:0 "技術への回帰"
  SPL_jishuhenohuigui_desc:0 "失われた技術を取り戻し、かつての栄華を再現する。"
  SPL_jishuzhishangzhuyi:0 "技術至上主義"
  SPL_jishuzhishangzhuyi_desc:0 "技術を至上の価値とし、あらゆる資源を技術開発に注ぎ込む。"
  SPL_anzhunodaichang:0 "安寧の代償"
  SPL_anzhunodaichang_desc:0 "平和を守るためには、何かを犠牲にしなければならない。"
  SPL_waihenozhunbei:0 "外への準備"
  SPL_waihenozhunbei_desc:0 "外部世界へ進出するための準備を進める。"
  SPL_diebaoqianghua:0 "諜報強化"
  SPL_diebaoqianghua_desc:0 "諜報機関を強化し、外部の情報を収集する体制を整える。"
  SPL_zaochuansuonojianshe:0 "造船所の建設"
  SPL_zaochuansuonojianshe_desc:0 "造船所を建設し、外洋へ進出するための船舶を建造する。"
  SPL_qingbaowangnogouzhu:0 "情報網の構築"
  SPL_qingbaowangnogouzhu_desc:0 "情報収集のネットワークを構築し、外部世界の動向を把握する。"
