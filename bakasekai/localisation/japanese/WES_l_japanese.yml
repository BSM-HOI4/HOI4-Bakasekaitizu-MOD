l_japanese:
 WES_GATHERING_STORM_DESC: "サハラ砂漠は強大な国家になるための選択肢がある。一つは帝国となる事、二つは勢力圏を広げること、三つは……砂に身を任せることだ。我が国はどれを選ぶべきなのだろうか。"
 LOC_SAYAMAOKI: "佐山沖"

 # Event(main)
 WES.1.t: "サハラ緑化委員会への招待"
 WES.1.d: "サハラはサハラ緑化委員会を設立し、我々を招待した。\n 委員会に参加すれば緑化による利益がもたらされるだろう。"
 WES.1.a: "緑化委員会に加盟する"
 WES.1.b: "断る"
 WES.2.t: "サハラからの提案"
 WES.2.d: "サハラはより深く委員会で関係を持とうとしている。サハラによるとこのことは利益がもたらされるようだ。"
 WES.2.a: "賛成だ"
 WES.2.b: "反対だ"
 WES.2.c: "我々には関係のない話だ"
 WES.3.t: "更なる委員会の結束"
 WES.3.d: "サハラは更なる委員会での通称を模索している。"
 WES.3.a: "通商の拡大をしよう!"
 WES.3.b: "断る"
 WES.3.c: "我々には関係のない話だ"
 WES.4.t: "連合化の提案"
 WES.4.d: "サハラは緑化委員会の連合化を提案している。"
 WES.4.a: "連合化を受け入れる"
 WES.4.b: "断る"
 WES.4.c: "我々には関係のない話だ"
 WES.5.t: "サハラによる資源投資1"
 WES.5.d: "サハラは我々の持つ資源の開発に協力的だ。我々は受け入れるべきだろうか。"
 WES.5.a: "投資を受け入れよう"
 WES.5.b: "断る"
 WES.6.t: "サハラによる資源投資2"
 WES.6.d: "サハラは更なる投資を画策している。我々は受け入れるべきだろうか。"
 WES.6.a: "投資を受け入れよう"
 WES.6.b: "断る"
 WES.6.c: "我々には関係のない話だ"
 WES.7.t: "サハラによる資源投資3"
 WES.7.d: "サハラは更なる投資を画策している。我々は受け入れるべきだろうか。"
 WES.7.a: "投資を受け入れよう"
 WES.7.b: "断る"
 WES.7.c: "我々には関係のない話だ"
 WES.8.t: "サハラによる資源投資4"
 WES.8.d: "サハラは我々の資源を買い入れようとしている。我々は受け入れるべきだろうか。"
 WES.8.a: "投資を受け入れよう"
 WES.8.b: "断る"
 WES.8.c: "我々には関係のない話だ"
 WES.9.t: "傀儡化"
 WES.9.d: "我々はついに彼らを傀儡状態にした。我々は侵略手段を用いずに拡張していくだろう。"
 WES.9.a: "よくやった!"
 WES.10.t: "提案を拒否"
 WES.10.d: "彼らは我々の提案を断った。「物理的に」資源を回収に行こう"
 WES.10.a: "彼らは愚かだったようだ…"
 WES.11.t: "彼らは我々の要請を受け入れた"
 WES.11.d: "彼らは我々の提案を受け入れた。彼らは我々の支援のもとで発展していくだろう!"
 WES.11.a: "サハラ緑化委員会万歳!"
 WES.12.t: "彼らは我々の要請を断った"
 WES.12.d: "彼らは我々の提案を断った。彼らは没落するだろう…"
 WES.12.a: "彼らは我々の支援を受けないのか…"
 WES.13.t: "国家元首の旅行"
 WES.13.d: "我らが大統領閣下は東京へ旅行に公費で行くと言っている。我々はこれを止めるべきだろうか…"
 WES.13.a: "絶対に止めるべきだ!"
 WES.13.b: "日本政府を正式に訪問すべきだ"
 WES.13.c: "彼にも休養が必要だ"
 WES.14.t: "二人組(?)"
 WES.14.d: "東京へ旅行に行った閣下は二人組…？を連れて帰ってきた。\n片方は日本からの土産の「Manjuu」に似た存在で人間には全く見えなかったが人の言葉を喋っている。\n彼らを首相閣下は閣僚として雇う気があるようだが承認するべきだろうか…"
 WES.14.a: "得体の知れない存在は「排除」するべきだ"
 WES.14.b: "首相閣下の言う通り彼らは何かこの国に要物をもたらしそうだ…"
 WES.15.t: "佐山県"
 WES.15.d: "よくわからないことが起きてしまった。この県の名称が佐原県から佐山県に変更されたのだ。"
 WES.15.a: "何が起きたんだ…"
 WES.16.t: "南アフリカとの講和交渉"
 WES.16.d: "南アフリカの大部分を我々は占領した。これ以上の不毛な争いはやめるべきだ。"
 WES.16.a: "講和するべきだ"
 WES.16.b: "いや、戦い続けるべきだ!"
 WES.17.t: "サハラからの講和交渉"
 WES.17.d: "サハラ政府はこれ以上の戦闘は不毛になると我々に降伏勧告を送ってきた。どう返すべきだろうか？"
 WES.17.a: "抵抗することは損害を大きくするだけだ"
 WES.17.b: "We shall never surrender!"
 WES.18.t: "講和の成立"
 WES.18.d: "南アフリカの領土は我が国が併合することとなった。"
 WES.18.a: "やったぞ!"
 WES.19.t: "講和の拒否"
 WES.19.d: "我々は講和するべきだと考えたが彼らは違うようだ。彼らを徹底的に攻撃し、破壊しよう。"
 WES.19.a: "徹底的に攻撃しよう"
 WES.20.t: "大統領による公費の私的利用？"
 WES.20.d: "国税庁が調査をした所、大統領は公費を度々私的に利用しているようだ。我々はどうすべきだろうか？"
 WES.20.a: "民衆に公開し、裁かせるべきだ!"
 WES.20.b: "秘密裏に止めさせよう"
 WES.20.c: "彼の好きにさせるべきだ"
 WES.21.t: "旅行期間の決定"
 WES.21.desc: "大統領の日本旅行の期間を設定することとなった。できる限り、短くなるようにしなければ…"
 WES.21.a: "2日にすべきだ"
 WES.21.b: "5日にすべきだ"
 WES.21.c: "7日にすべきだ"
 WES.21.d: "いくらでもいいだろう"
 WES.22.t: "訪問の結果"
 WES.22.d: "日本政府を訪問したが特に大きな成果は得られなかった。ただ、知見を広めることはできたようだ。"
 WES.22.a: "少しは成果があったようだ"
 WES.23.t: "大統領の帰国"
 WES.23.d: "大統領が日本からの旅行から帰国した。一日でも早く公務に復帰してもらおう。"
 WES.23.a: "これで満足しただろう"
 WES.24.t: "大統領の改選"
 WES.24.d: "大統領は政治資金の私的流用によって解任された。そのため国中が混乱し、暴動やデモが多発している。我々はその影響を大きく受けているが選挙を急いで行わなければならない。どの候補者が当選したのだろうか…"
 WES.24.a: "フェネックが大統領選に出ている!かわいい!"
 WES.24.b: "Isaac Ali 氏が当選した!"
 WES.24.c: "いや、このまま大統領を決定しなければ…我々の目的が達成できるのでは…？"
 WES.25.t: "政府の崩壊"
 WES.25.d: "大統領不在の期間が長く続き、国民は政府の存在にも疑問視してきている。機は熟した、我々の理想を達成するために、行動を開始しよう。"
 WES.25.a: "民衆の支持は取り付けた!このまま進め!"
 WES.26.t: "安定度の修正"
 WES.26.d: "我が国の安定度は低下し続けている。国民の目を不安定から逸らそう。…根本的な解決にはならないが…"
 WES.26.a: "やったぞ!!!安定度が回復しているように見える!"
 WES.27.t: "大陸横断鉄道建設の完了"
 WES.27.d: "我が国内に鉄道を多く張り巡らせることができた。これで我が国の経済は上向くだろう。"
 WES.27.a: "また一歩、アメリカに近づけた…"
 WES.28.t: "SGC研究協力機構"
 WES.28.d: "現在サハラ緑化委員会では加盟国間で研究協力を行うことが協議されており、加入すれば我が国の研究能力はさらに向上するだろう。我々は参加すべきなのだろうか。"
 WES.28.a: "加盟すべきだ"
 WES.28.b: "するべきではない"
 WES.29.t: "ある青年の入隊希望"
 WES.29.d: "ムバカ族の首長の息子であるジャン＝ベデル・ボカサが我が軍への入隊を希望している。我々は受け入れるべきなのだろうか…"
 WES.29.a: "入隊を許可しよう"
 WES.29.b: "断るべきだ"
 WES_Bokkassa_hire: "360日後に将軍として雇用される。"
 WES.30.t: "方針の決定"
 WES.30.d: "我が国は今後の軍事的方針を定めなければならない。まずは陸軍からだ。"
 WES.30.a: "機動戦をするべきだ"
 WES.30.b: "火力を強化するべきだ"
 WES.30.c: "綿密な計画を立てるべきだ"
 WES.30.desc: "縦深戦術やゲリラ戦術を行うべきだ"
 WES.31.t: "方針の決定"
 WES.31.d: "我が国は今後の軍事的方針を定めなければならない。次に海軍だ。"
 WES.31.a: "艦隊の生存力を高めるべきだ"
 WES.31.b: "敵の通商を破壊するべきだ"
 WES.31.c: "空母を活用して敵海軍を破壊するべきだ"
 WES.32.t: "方針の決定"
 WES.32.d: "我が国は今後の軍事的方針を定めなければならない。最後は空軍だ。"
 WES.32.a: "航空優勢の確保を最優先すべきだ"
 WES.32.b: "空軍による陸軍の補佐が重要だ"
 WES.32.c: "空軍によって敵生産能力を破壊することが最善だ"
 WES.33.t: "大統領選"
 WES.33.d: "我が国は大統領選を行う。誰が当選するのだろうか…"
 WES.33.a: "El Ouali Mustapha Sayed氏が再当選した"
 WES.33.b: "Issac Ali氏が当選した"
 WES.33.c: "Issac Ali氏が再当選した"
 WES.33.d: "ジャン＝ベデル・ボカサ氏が当選した"
 WES.34.t: "方針の決定"
 WES.34.d: "我が国は今後の軍事的方針を定めなければならない。陸軍の再編成が必要だ。"
 WES.34.a: "さらなる拡充を行う"
 WES.34.b: "現状維持とする"
 WES.35.t: "方針の決定"
 WES.35.d: "我が国は今後の軍事的方針を定めなければならない。海軍の再編成が必要だ。"
 WES.35.a: "艦隊を増強する"
 WES.35.b: "現状維持とする"
 WES.36.t: "方針の決定"
 WES.36.d: "我が国は今後の軍事的方針を定めなければならない。空軍の再編成が必要だ。"
 WES.36.a: "戦闘機を増強する"
 WES.36.b: "爆撃機を増強する"
 WES.36.c: "海軍航空隊を増強する"
 WES.36.d: "現状維持とする"
 WES.37.t: "方針の決定"
 WES.37.d: "我が国は今後の軍事的方針を定めなければならない。産業の強化が必要だ。"
 WES.37.a: "民需工場を増強する"
 WES.37.b: "軍需工場を増強する"
 WES.38.t: "方針の決定"
 WES.38.d: "我が国は今後の軍事的方針を定めなければならない。研究分野の強化が必要だ。"
 WES.38.a: "研究機関を拡充する"
 WES.38.b: "現状維持とする"
 WES.39.t: "交戦国の併合"
 WES.39.d: "我が国は敵国を降伏させ、併合した。"
 WES.39.a: "モロッコ併合"
 WES.39.b: "カシミール併合"
 WES.39.c: "カンボジア併合"
 WES.40.t: "佐山県の要求"
 WES.40.d: "佐山県は我が国の青森県を「佐山県」建設用地として割譲することを要求している。"
 WES.40.a: "「自称」佐山県など一瞬で勝利を収められるだろう"
 WES.40.b: "屈するべきだ"
 WES.41.t: "交渉の失敗"
 WES.41.d: "日本からの使者は「自称」佐山県などに与える領土は一片たりともないと告げてきた。"
 WES.41.a: "参戦布告だ"
 WES.42.t: "交渉の成立"
 WES.42.d: "日本は割譲を承認した。これで我が国は狭山建設プロジェクトを進めることができる。"
 WES.42.a: "やったぞ!"
 WES.43.t: "「佐山」からの交渉"
 WES.43.d: "「佐山県」は我が国の青森県の割譲を引き換えに講和を提案している。どうすべきだろうか。"
 WES.43.a: "屈するべきだ"
 WES.43.b: "抵抗を続けなければならない"
 WES.44.t: "「佐山」からの交渉"
 WES.44.d: "「佐山県」は我が国の青森県の割譲を引き換えに講和を提案している。どうすべきだろうか。"
 WES.44.a: "屈するべきだ"
 WES.44.b: "抵抗を続けなければならない"
 WES.45.t: "交渉の失敗"
 WES.45.d: "日本は講和を拒否した。我々はまだ戦わなければならないのだろう…"
 WES.45.a: "戦いはまだまだ続く"
 WES.46.t: "交渉の成立"
 WES.46.d: "日本は割譲を承認した。これで我が国は狭山建設プロジェクトを進めることができる。"
 WES.46.a: "やったぞ!"
 WES.47.t: "将軍の雇用"
 WES.47.d: "族長の息子、ボカサ少佐がついに将軍となった。彼は我が国のために働くだろう。"
 WES.47.a: "サハラ万歳!"

 # Event(anarchy)
 WES_a.1.t: "政府の破壊"
 WES_a.1.d: "政府はもはや国民のために機能していない。政府を破壊し、新たな秩序を築こう。"
 WES_a.1.a: "政府を破壊する"
 WES_a.2.t: "地方政治の破壊"
 WES_a.2.d: "地方政治は腐敗している。地方政治を破壊し、中央集権化を進めよう。"
 WES_a.2.a: "地方政治を破壊する"
 WES_a.3.t: "権威の破壊"
 WES_a.3.d: "権威はもはや意味を持たない。全ての権威を破壊し、真の自由を手に入れよう。"
 WES_a.3.a: "権威を破壊する"
 WES_a.4.t: "軍の破壊"
 WES_a.4.d: "軍は国民を守るどころか抑圧の道具となっている。軍を破壊し、真の平和を実現しよう。"
 WES_a.4.a: "軍を破壊する"
 WES_a.5.t: "無政府闘争"
 WES_a.5.d: "無政府状態のなか、我々は新たな秩序を模索している。闘争はまだ終わらない。"
 WES_a.5.a: "闘争を続ける"
 WES_a.6.t: "市民闘争"
 WES_a.6.d: "市民は政府に対して立ち上がった。この闘争は新たな時代の幕開けだ。"
 WES_a.6.a: "市民の声に応えよう"
 WES_a.7.t: "無政府の広がり"
 WES_a.7.d: "無政府状態は各地に広がっている。この混乱を鎮めることはできるのだろうか。"
 WES_a.7.a: "混乱を受け入れる"
 WES_a.8.t: "無政府の定着"
 WES_a.8.d: "無政府状態が定着しつつある。国民は新たな生活様式に適応し始めている。"
 WES_a.8.a: "新たな秩序へ"
 WES_a.9.t: "国家の解体"
 WES_a.9.d: "国家はもはや解体の瀬戸際にある。我々は最後の決断を下さなければならない。"
 WES_a.9.a: "国家を解体する"
 WES_a.10.t: "無政府の終焉"
 WES_a.10.d: "長きにわたる無政府状態がついに終わりを迎えようとしている。我々は新たな国家を築くことができるのだろうか。"
 WES_a.10.a: "新たな時代の幕開けだ"
 WES_a.11.t: "夢からの目覚め"
 WES_a.11.d: "全ては夢だったのだろうか。しかし、我々は現実を受け入れ、前に進まなければならない。"
 WES_a.11.a: "現実を受け入れよう"
 WES_a.12.t: "新たな指導者"
 WES_a.12.d: "無政府状態の中から新たな指導者が現れた。彼は我々を導いてくれるのだろうか。"
 WES_a.12.a: "指導者に従おう"
 WES_a.13.t: "秩序の再建"
 WES_a.13.d: "無政府状態の後、秩序を再建する時が来た。我々はどのような国を築くべきなのだろうか。"
 WES_a.13.a: "秩序を再建する"
 WES_a.14.t: "国家の再編"
 WES_a.14.d: "国家は再編の途上にある。新たな体制は国民に希望をもたらすのだろうか。"
 WES_a.14.a: "再編を進める"
 WES_a.15.t: "社会の再構築"
 WES_a.15.d: "社会は再構築の段階に入っている。我々は新たな社会像を描かなければならない。"
 WES_a.15.a: "社会を再構築する"
 WES_a.16.t: "経済の復興"
 WES_a.16.d: "無政府状態により疲弊した経済を復興させる必要がある。"
 WES_a.16.a: "経済を復興させる"
 WES_a.17.t: "軍事の再建"
 WES_a.17.d: "解体された軍を再建し、国家を守る力を取り戻さなければならない。"
 WES_a.17.a: "軍を再建する"
 WES_a.18.t: "国家の再出発"
 WES_a.18.d: "全ての混乱を経て、国家は再出発の時を迎えた。我々は新たな国家像を掲げよう。"
 WES_a.18.a: "新たな国家へ"
 WES_a.19.t: "新時代の到来"
 WES_a.19.d: "長き混乱の後、ついに新時代が到来した。我が国は再び世界の舞台に立つ。"
 WES_a.19.a: "新時代万歳!"

 # Event(create)
 WES_cre.1.t: "装備の選択"
 WES_cre.1.desc: "装備を選択することで自動で装備を錬成しよう \n (再度選択すると解除できます)"
 WES_cre.1.a: "歩兵装備"
 WES_cre.1.b: "支援装備"
 WES_cre.1.c: "野戦砲"
 WES_cre.1.d: "次イベントへ"
 WES_cre.2.t: "装備の選択"
 WES_cre.2.desc: "装備を選択することで自動で装備を錬成しよう  (再度選択すると解除できます)"
 WES_cre.2.a: "軽戦車"
 WES_cre.2.b: "中戦車"
 WES_cre.2.c: "重戦車"
 WES_cre.2.d: "次イベントへ"
 WES_cre.3.t: "装備の選択"
 WES_cre.3.desc: "装備を選択することで自動で装備を錬成しよう  (再度選択すると解除できます)"
 WES_cre.3.a: "トラック"
