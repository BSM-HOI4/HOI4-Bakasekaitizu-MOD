l_japanese:
 # GDP補正カスタムmodifier
 bsm_gdp_factor:0 "GDP補正"

 # 法律スロット名(法と政府欄)
 bsm_finance_law:0 "金融法"
 bsm_labor_law:0 "労働法"

 # 金融法
 bsm_state_finance:0 "統制金融"
 bsm_state_finance_desc:0 "国家が金融を統制する。政治的安定と権力を得るが、経済成長(GDP)は鈍化する。"
 bsm_mixed_finance:0 "混合金融"
 bsm_mixed_finance_desc:0 "国家と市場が併存する標準的な金融体制。特段の補正はない。"
 bsm_free_finance:0 "自由金融"
 bsm_free_finance_desc:0 "市場に金融を委ねる。経済成長(GDP)を押し上げるが、安定度は低下する。"

 # 労働法
 bsm_forced_labor:0 "強制労働"
 bsm_forced_labor_desc:0 "労働力を強制的に動員する。短期的に生産とGDP、戦争支持を高めるが、安定度が大きく下がる。"
 bsm_standard_labor:0 "標準労働"
 bsm_standard_labor_desc:0 "標準的な労働体制。特段の補正はない。"
 bsm_worker_protection:0 "労働者保護"
 bsm_worker_protection_desc:0 "労働者を手厚く保護する。生産性とGDP・安定度が向上するが、消費財コストと政治的負担が増える。"
