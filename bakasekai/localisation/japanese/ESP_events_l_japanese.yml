l_japanese:
 ##############################################
 # ESP 亡命シナリオ event localisation
 ##############################################

 esp_scenario.1.t:0 "失われた地図"
 esp_scenario.1.d:0 "イベリア半島のすべての州はフランスの手中に落ち、我らの主権は海の彼方へと追いやられた。カラカスの粗末な執務室に残されたのは、壁にピンで留められた古びた地図と、名目ばかりの領有権の記録だけである。しかし、紙の上に引かれた国境線が消えない限り、祖国再生の誓いが潰えることはない。"
 esp_scenario.1.a:0 "地図はまだ生きている"

 esp_scenario.2.t:0 "在外選挙"
 esp_scenario.2.d:0 "カリブ海の避難所や中南米の亡命街区に仮設の投票所が設けられ、世界各地に散った同胞たちが列をなした。投じられた無数の票は、領土を失おうとも民衆の主権が断じて死んでいない動かぬ証拠である。民主的な手続きを経た亡命政府は、海を越えた真の正統性を世界に向けて誇らかに示した。"
 esp_scenario.2.a:0 "共和国はまだ選べる"

 esp_scenario.3.t:0 "二王の和解"
 esp_scenario.3.d:0 "一世紀にわたって血で血を洗い、相容れることのなかったボルボン家とカルリスタの二つの王統が、ついに大西洋を越えた異郷で手を携えた。古き王位継承の確執は共通の悲願の前に棚上げされ、伝統と秩序の回復を信じる者たちが一つの旗の下に結集した。王冠の数は問うまい、いま大事なのは祖国を取り戻すための揺るぎない結束である。"
 esp_scenario.3.a:0 "王冠は一つでなくてよい"

 esp_scenario.4.t:0 "プリモ・デ・リベラの消息"
 esp_scenario.4.d:0 "本土の獄中に囚われた若き指導者ホセ・アントニオの消息は、依然として深い霧の向こうに閉ざされたままである。しかし、不在であること自体が彼を神話的な殉教者へと昇華させ、青シャツの運動員たちをかつてない狂熱へと駆り立てている。指導者の落とした長大な影は、亡命先で新たな国家主義の旗印として歩み始めた。"
 esp_scenario.4.a:0 "影は旗になる"

 esp_scenario.5.t:0 "地図上のスペイン"
 esp_scenario.5.d:0 "遠きイベリア半島に執着し、幻影の奪還を追い求める日々は終わりを告げた。欧州国家としてのスペインは幕を閉じ、我らはカリブの青き海原と豊かな大地を真の故郷として生きる決断を下したのだ。たとえ半島を失おうとも、この新大陸の地図の上に新たなスペインの名が消えることはない。"
 esp_scenario.5.a:0 "地図は、そこに国があると言っている"

 esp_scenario.6.t:0 "イベリア蜂起"
 esp_scenario.6.d:0 "合図の電文がピレネーを越えるや否や、本土各地に潜伏していた地下組織と労働者たちが一斉に蜂起した。山岳の間道や都市の路地裏から銃声が轟き、フランスによる平穏な支配は一瞬にして打ち砕かれた。抑圧に耐えかねた民衆の怒りの炎が、いまや半島全土を赤々と照らし出している。"
 esp_scenario.6.a:0 "地図の下で火が燃えている"

 esp_scenario.7.t:0 "リスボン問題"
 esp_scenario.7.d:0 "半島の西端に位置するリスボンには、我らが放棄することのできない正当な権利と地政学的利害が横たわっている。パリの議会がこの要衝をどのように処遇しようとも、亡命政府が持つ権利書を無視することは誰にも許されない。半島の完全な解放を見据える以上、我らは隣国とフランスの双方に対して毅然たる態度で臨まねばならない。"
 esp_scenario.7.a:0 "権利書は手元にある"

 esp_scenario.8.t:0 "マドリード奪還"
 esp_scenario.8.d:0 "大西洋の波濤を越え、幾重もの激戦を突破した亡命軍の先鋒が、ついに祖国の首都マドリードへの凱旋を果たした。市民の歓呼と涙の中で掲げられた旗は、長きにわたる苦難の放浪が終わったことを告げている。かつて机の上で見つめ続けた失われた地図は、今や兵士たちの確かな足元に取り戻されたのだ。"
 esp_scenario.8.a:0 "地図に帰る"

 esp_scenario.10.t:0 "カリブからの握手"
 esp_scenario.10.d:0 "カリブ海に拠点を置くスペイン亡命政権から、過去の対立を棚上げして関係改善を求める友好的な使節が送られてきた。彼らは大西洋の平穏と相互の安全保障を望んでおり、我が国との実務的な協調路線を模索しているようだ。海を挟んだこの意外な握手を受け入れることは、西方の憂いを払う上で悪くない選択肢と言える。"
 esp_scenario.10.a:0 "悪くない話だ"

 esp_scenario.11.t:0 "冷たい海の通告"
 esp_scenario.11.d:0 "スペイン亡命政府から届いた外交覚書は、極めて儀礼的でありながらも冷ややかな拒絶の空気を漂わせていた。彼らは公然たる武力衝突こそ避けているものの、我が国の影響力を警戒し、大西洋を挟んだ冷戦状態を継続する腹づもりのようだ。凍てつく波濤の向こうに潜む敵意に対し、我らも監視の目を緩めるわけにはいかない。"
 esp_scenario.11.a:0 "知っている"

 esp_scenario.12.t:0 "カラカス最後通牒"
 esp_scenario.12.d:0 "カラカスのスペイン亡命政権から、我が国の主権と権益を真っ向から否定する最後通牒が叩きつけられた。彼らはイベリア半島に関する不当な要求の即時受託を迫っており、拒絶すれば武力行使も辞さない構えを露わにしている。大西洋の外交的緊張は限界点に達し、海を越えた衝突の火蓋が切られようとしている。"
 esp_scenario.12.a:0 "相応の備えを"

 esp_scenario.15.t:0 "アンドラ共治の提案"
 esp_scenario.15.d:0 "スペイン亡命政権から、ピレネー山中に位置するアンドラ公国の地位に関する公式な外交提案が届けられた。彼らは伝統的な共同統治体制を復活させ、双方の保証による中立の緩衝地帯として同国を再興することを求めている。山間の小国を巡るこの申し出に同意すべきか、あるいは主権の侵害として退けるべきか、判断が迫られている。"
 esp_scenario.15.a:0 "同意する"
 esp_scenario.15.b:0 "拒否する"

 esp_scenario.20.t:0 "大西洋の綱引き"
 esp_scenario.20.d:0 "大西洋を挟んだ両国の外交方針は真っ向から食い違い、事態は複雑な膠着状態へと陥った。一方が協調の手を差し伸べようとしたのに対し、他方は警戒と敵意をむき出しにしたため、双方の思惑は打ち消し合ってしまったのだ。張り詰めた綱引きの末に、二国間の外交関係は再び微妙な中立の原点へと引き戻された。"
 esp_scenario.20.a:0 "仕方ない"
