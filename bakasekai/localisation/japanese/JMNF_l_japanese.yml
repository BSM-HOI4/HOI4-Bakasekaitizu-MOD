 JMNF.3.d: "帝国海軍は新たな八八艦隊計画を発令した。主力艦8隻、巡洋艦8隻を中核とする大艦隊の建造が始まる。"
 JMNF.3.a: "計画を承認する"
 JMNF.4.t: "新型機コンペ結果"
 JMNF.4.d: "航空機メーカー各社による新型機コンペの結果が報告された。どの機種を優先して量産するか決定が必要だ。"
 JMNF.4.a: "戦闘機を優先"
 JMNF.4.b: "爆撃機を優先"
 JMNF.4.c: "偵察機を優先"
 JMNF.5.t: "究極の兵器"
 JMNF.5.d: "帝国の科学者たちが画期的な兵器の開発に成功した。この兵器は戦争の帰趨を決める力を持つ。"
 JMNF.5.a: "量産を急げ"
 JMNF.5.b: "研究を続ける"
 JMNF.6.t: "帝国は大海を統べる"
 JMNF.6.d: "大日本帝国海軍は太平洋の支配権を確立した。帝国の海上交通路は安全であり、敵艦隊はもはや脅威ではない。"
 JMNF.6.a: "素晴らしい"
 JMNF.7.t: "大本営移設完了"
 JMNF.7.d: "帝国の大本営が新たに移設され、三軍の統合作戦指揮が強化された。より効率的な作戦立案が可能となった。"
 JMNF.7.a: "承認する"
 JMNF.8.t: "潜水艦隊の完成"
 JMNF.8.d: "帝国海軍の新鋭潜水艦隊が編成された。最新鋭の潜水艦が深海から敵を脅かす。"
 JMNF.8.a: "出撃せよ"
