l_japanese:
 ##############################################
 # ESP カリブ亡命シナリオ focus localisation
 ##############################################

 # 幹
 ESP_exile_government:0 "亡命政府"
 ESP_exile_government_desc:0 "祖国の土を踏むことが叶わなくとも、我々の精神まで奪われたわけではない。海を渡った者たちはカリブの熱気の中に新たな拠点を築き、正統な主権の灯火を守り続けている。波濤の彼方に残してきたイベリアの地へ、いつの日か必ず帰還を果たすのだ。"
 ESP_caracas_charter:0 "カラカス憲章"
 ESP_caracas_charter_desc:0 "カラカスの乾いた風の中で、亡命者と現地政府の間で新たな連帯の協定が交わされた。これは異郷における生存を保障し、反乱者に奪われた祖国を取り戻すための共通の誓詞である。条文に記された言葉は、新大陸における我らの権利と義務を明確に定めている。"
 ESP_the_lost_map:0 "失われた地図"
 ESP_the_lost_map_desc:0 "かつて宮殿の奥深くに秘匿されていた帝国時代の海図と測量記録が、混乱の中で海を渡ってきた。擦り切れた羊皮紙に描かれた航路は、新旧両大陸を結ぶ見えない絆を今なお示している。我らはこの古き地図を手がかりに、失われた領土と影響力を再興しなければならない。"
 ESP_spanish_registry:0 "亡命者名簿"
 ESP_spanish_registry_desc:0 "港や避難所に散らばる何十万もの同胞の名を台帳へと記録し、亡命社会の基礎を固める。名簿に刻まれた一文字一文字は、異郷で生きる者たちの尊厳であり、来るべき帰還の軍勢の兵籍簿でもある。誰一人として忘れ去られず、祖国再生の力として結集されねばならない。"
 ESP_four_proofs:0 "帰還の四証"
 ESP_four_proofs_desc:0 "イベリアの正統なる継承者たる証は、口先だけの宣言ではなく確固たる事実によって示されねばならない。アンドラ共治権、セウタとメリリャの確保、対仏大西洋外交の主導権、そしてオリノコとキュラソーの資源的基盤。これら四つの証を握ることこそが、我らの正当性を世界に承認させる唯一の道である。"
 ESP_two_homelands_focus:0 "二つの祖国"
 ESP_two_homelands_focus_desc:0 "我らはイベリアの子供であると同時に、今や新大陸の海と風に育まれる者たちでもある。過去の栄光と現在の寄港地、この二つの故郷を愛することは決して矛盾ではない。双方の絆を深めることで、亡命社会は新たな活力と強固な団結を獲得するだろう。"
 # 共和国再編
 ESP_second_republic:0 "第二共和国の再興"
 ESP_second_republic_desc:0 "マドリードで踏みにじられた共和国の旗は、カリブの青空の下で再び掲げられた。独裁の暗雲が本国を覆おうとも、民衆の手によって打ち立てられた自由と民主の理念は死なない。亡命の地から憲政の光を放ち、やがて本国全土を解放するための戦端を開く。"
 ESP_azana_presidency:0 "アサーニャ大統領"
 ESP_azana_presidency_desc:0 "病身と失意に苛まれながらも、マヌエル・アサーニャは今なお亡命知識人と良識派の精神的支柱であり続けている。彼が執務机から発する知性ある言葉は、分裂しやすい共和派を繋ぎ止める貴重な鎖である。大統領の権威の下に結集し、理性ある国家の再生を目指さねばならない。"
 ESP_moderate_coalition:0 "穏健連立"
 ESP_moderate_coalition_desc:0 "急進主義の荒波に抗い、現実的な秩序と法の支配を重視する中道勢力が手を取り合う。左右の極端な主張を排し、確固たる妥協と合意形成によって亡命政権の運営を安定させねばならない。節度ある連立こそが、列強からの外交的信用を勝ち取る鍵となる。"
 ESP_united_front_again:0 "人民戦線の再結成"
 ESP_united_front_again_desc:0 "内戦の悲劇的な敗北を繰り返さぬよう、反ファシズムの旗の下に再びすべての左派勢力が結集する。過去の確執を脇に置き、労働者と農民、そして兵士の固い連帯を蘇らせるのだ。一枚岩となった人民戦線だけが、海を越えた大反攻を成し遂げる原動力となる。"
 ESP_constitution_in_exile:0 "亡命憲法"
 ESP_constitution_in_exile_desc:0 "1931年憲法の精神を継承しつつ、亡命という特殊な現実に対応した新たな基本法を公布する。領土を持たぬ国家であっても、法と制度の秩序を保ち続けることが正統性の根拠となる。この憲法に誓いを立てることで、在外の同胞は法的に一つの国民として結ばれるのだ。"
 ESP_elections_abroad:0 "在外選挙"
 ESP_elections_abroad_desc:0 "世界中に散らばる避難民キャンプや亡命街区に投票所を設け、正当な民意を問う選挙を挙行する。たとえ砲火を避けて海を渡った身であっても、国民の主権は一票の投票用紙の中に生きている。民主的な手続きを貫く姿を諸外国に示すことで、我らの大義はより強固なものとなる。"
 # 王政復古
 ESP_royalist_emissaries:0 "王党派の使者"
 ESP_royalist_emissaries_desc:0 "古き王国の正統と伝統を重んじる使者たちが、密かに大西洋を渡り各国の宮廷へと派遣される。彼らの使命は、動乱の時代にあってスペイン君主制こそが秩序を回復する唯一の道だと説くことだ。王党派の広範な人脈と外交ルートは、我らの孤立を打破する力となる。"
 ESP_alfonso_in_rome:0 "ローマの国王"
 ESP_alfonso_in_rome_desc:0 "ローマの宮殿に身を寄せるアルフォンソ13世は、今なお旧体制の象徴として静かに事態を見守っている。かつて国を追われた王の存在は、大西洋を挟んだ亡命社会においても無視できない重みを持つ。カトリック教会と王家の名の下に、散り散りとなった臣民の忠誠を呼び覚ます時が来た。"
 ESP_carlist_compact:0 "カルリスタ協約"
 ESP_carlist_compact_desc:0 "「神・祖国・国王」の信条を掲げる伝統主義者カルリスタと、亡命政府の間で歴史的な和解が模索されている。長年の王位継承をめぐる争いを棚上げし、共通の敵に対峙するための協定を結ぶのだ。反乱軍に失望した熱心なカトリック信徒たちが、この盟約によって我らの味方となる。"
 ESP_infante_juan:0 "フアン王子"
 ESP_infante_juan_desc:0 "若きバルセロナ伯フアンは、立憲君主制による国民融和の新たな旗手として期待を集めている。旧弊な専制を退け、現代的な秩序と自由を両立させる若き王子の姿は、多くの亡命者を惹きつけてやまない。彼の戴冠こそが、傷ついた祖国を一つに束ねる希望の光となるだろう。"
 ESP_two_crowns:0 "二つの王冠"
 ESP_two_crowns_desc:0 "カスティリャとアラゴンの統合以来の歴史を振り返り、王権の多面性と複合的な主権のあり方を再評価する。海を越えたカリブの地とイベリア本土、それぞれに相応しい王権の象徴を打ち立てるのだ。二重の戴冠構想は、新旧両大陸に跨る広大な共同体の結束を確かなものにする。"
 ESP_crown_over_sea:0 "海を越えた戴冠"
 ESP_crown_over_sea_desc:0 "かつてカルロス1世が新大陸の富によって帝国の威容を誇ったように、今や大西洋の波濤を越えて王権が再構築される。王冠はマドリードの宮殿ではなく、カリブの港湾において新たな尊厳を纏うのだ。海を越えた戴冠式は、新世界における王権の復活を全世界へと宣言する儀式となる。"
 ESP_regency_atlantic:0 "大西洋摂政評議会"
 ESP_regency_atlantic_desc:0 "王位が空位のまま揺れ動く中、権力の空白を埋めるべく大西洋摂政評議会が設置される。軍人、聖職者、貴族の代表からなるこの最高機関が、国家の舵取りを一手に引き受ける。秩序ある統治を維持しつつ、真の君主が帰還するその日まで祖国の祭壇を守り抜くのだ。"
 # ファランヘ
 ESP_falange_exiles:0 "ファランヘ亡命者"
 ESP_falange_exiles_desc:0 "本国の軍事政権に幻滅し、あるいは権力闘争に敗れて大西洋を渡った急進的なファランヘ党員たちが集う。彼らは独自の国家主義と階級闘争の理念を捨てておらず、熱狂的な情熱を内に秘めている。この青シャツの若者たちを組織化し、亡命政権の行動部隊として再編せねばならない。"
 ESP_jons_legacy:0 "JONSの遺産"
 ESP_jons_legacy_desc:0 "ラミロ・レデスマらが唱えた国民サンディカリズムの急進的な原点が、異郷の地で再び検証されている。資本主義の弊害と共産主義の脅威を同時に打破する「第三の道」は、多くの不満分子を惹きつける。国家即労働の鉄の規律を呼び戻し、運動の純粋な闘争精神を取り戻すのだ。"
 ESP_primo_rivera_shadow:0 "プリモ・デ・リベラの影"
 ESP_primo_rivera_shadow_desc:0 "若き指導者ホセ・アントニオの非業の死は、今なおファランヘ運動の精神的支柱として濃い影を落としている。彼の思想とカリスマは神格化され、散り散りとなった党員たちを結束させる聖典となった。指導者の不在を埋めるべく、彼の遺志を継ぐ新たな統率者を立てねばならない。"
 ESP_national_syndicate:0 "国民シンジカリスモ"
 ESP_national_syndicate_desc:0 "国家と労働組合を一体化させ、生産者階級による強固な共同体を組織する計画を推し進める。亡命先の工場や港湾で働く同胞を縦割りの組合へと編入し、効率的な動員態勢を構築するのだ。利己的な階級対立を排し、国家の最高目標たる帰還のために全力を捧げさせる。"
 ESP_hispanidad:0 "イスパニダー"
 ESP_hispanidad_desc:0 "言語、文化、そしてカトリック信仰を共有するイスパノアメリカ諸国に対し、精神的紐帯としての「イスパニダー」を説く。我らは単なる亡命者ではなく、大西洋世界をつなぐ偉大な文明の代表者なのだ。中南米の兄弟国から広範な連帯と支援を引き出し、対外的な影響力を拡大する。"
 ESP_caudillo_candidate:0 "総統候補"
 ESP_caudillo_candidate_desc:0 "亡命社会の混乱を収拾し、祖国奪還の鉄の指導力を発揮できる強力な「カウディーリョ」の出現が望まれている。議会制の優柔不断を断ち切り、全権を掌握して軍民を率いることのできる強力な人物を擁立せねばならない。強力な指導者の下に団結することこそが、勝利への最短距離である。"
 # 人民戦線・共産
 ESP_passion_flower:0 "情熱の花"
 ESP_passion_flower_desc:0 "ドロレス・イバルリ、通称「パショナリア」の情熱的な演説は、カリブの湿った夜風の中でも人々の胸を打つ。「膝をついて生きるより、立ったまま死ぬ方がましだ」という叫びは、今も衰えていない。彼女の声の下に亡命労働者を結束させ、共産主義運動の火を絶やさず燃やし続ける。"
 ESP_jose_diaz_line:0 "ホセ・ディアス路線"
 ESP_jose_diaz_line_desc:0 "スペイン共産党書記長ホセ・ディアスの現実的かつ組織的な方針に従い、党勢の再編を急ぐ。病魔に冒されながらも彼が示す規律と大衆路線の徹底は、地下組織の維持に不可欠である。コミンテルンとの協調を保ちつつ、カリブの地に適応した強固な党組織を築き上げるのだ。"
 ESP_militia_fleets:0 "民兵船団"
 ESP_militia_fleets_desc:0 "武装した漁船や小型商船に赤い旗を掲げ、カリブ海を哨戒するプロレタリア民兵船団を組織する。正規海軍の不足を補うべく、労働者と水夫たちが自ら銃を手に取り海上の警備にあたるのだ。この即席の艦隊は、革命の防壁であると同時に補給路を守る頼もしい盾となる。"
 ESP_union_of_exiles:0 "亡命組合連合"
 ESP_union_of_exiles_desc:0 "UGTやCNTの流れを汲む在外労働組合を結集し、亡命者たちの生活保障と労働環境の改善を図る。異郷の過酷な労働に苦しむ同胞を救済することは、革命勢力の基盤を固めるために不可欠である。労働者の強固な結束は、いかなる軍事力にも勝る巨大な政治的圧力となるだろう。"
 ESP_red_spain_america:0 "赤いスペイン・アメリカ支部"
 ESP_red_spain_america_desc:0 "ラテンアメリカ全域の左派組織と緊密に連携し、コミンテルン指導下のアメリカ支局を拡充する。亡命スペイン人の革命的闘争は、やがて新大陸全体のプロレタリア解放運動と連動していく。カリブ海を赤き闘争の拠点とし、大西洋全域へ向けて革命の烽火を上げるのだ。"
 ESP_pozas_rearguard:0 "後衛の将軍たち"
 ESP_pozas_rearguard_desc:0 "かつてマドリード防衛を支えたセバスティアン・ポサスら歴戦の将軍たちが、軍組織の再建を主導する。過酷な退却戦を生き延びた彼らの経験と統率力は、亡命軍の軍紀を保つための貴重な財産である。後衛を務め上げた名将たちの下に、再び規律ある戦闘部隊を編成しなければならない。"
 # カリブ連邦
 ESP_caribbean_assembly:0 "アンティル議会"
 ESP_caribbean_assembly_desc:0 "アンティル諸島各地の代表者や亡命有力者を一堂に集め、地域の共同協議機関を創設する。新天地における共存共栄と行政の円滑化を図るため、互いの利害を調整する場が必要不可欠である。この議会を通じて、我らはカリブ海域における確固たる政治的発言権を確保する。"
 ESP_lopez_pact:0 "ロペス協定"
 ESP_lopez_pact_desc:0 "ベネズエラのエレオサロ・ロペス・コントレラス政権と極秘裏に折衝を重ね、相互安全保障と定住の権利を取り付ける。石油利権や治安維持での協力と引き換えに、亡命政権の治外法権的活動が黙認されるのだ。この実務的な協定により、我らは南米大陸の北岸に揺るぎない橋頭堡を得る。"
 ESP_spanish_venezuela:0 "スペイン領ベネズエラ"
 ESP_spanish_venezuela_desc:0 "ベネズエラ国内に指定された亡命者特別管区において、独自の司法と行政を執行する体制を整える。かつての副王領の地において、スペインの法と文化が再び息づき始めている。この「スペイン領ベネズエラ」は、祖国を奪われた我らが再び主権を行使するための生きた実験場である。"
 ESP_antilles_league:0 "アンティル連盟"
 ESP_antilles_league_desc:0 "カリブ海に点在する島嶼部と沿岸勢力を束ね、強固な通商・防衛ブロックを結成する。大国の干渉を退け、地域全体の安定と自立を勝ち取るための包括的な連盟を築くのだ。共通の海を持つ諸勢力が団結することで、大西洋航路における我らの存在感は飛躍的に高まる。"
 ESP_new_carthage:0 "新カルタゴ"
 ESP_new_carthage_desc:0 "古代カルタゴがイベリア半島に新天地を求めたように、我らもまたカリブの海辺に不滅の都市を築く。堅固な要塞と賑わう港湾を兼ね備えたこの拠点は、亡命勢力の不屈の意志を象徴する首都となるだろう。ここから大艦隊が出撃し、奪われた旧世界の覇権を再び奪還するのだ。"
 ESP_map_spain_focus:0 "地図上のスペイン"
 ESP_map_spain_focus_desc:0 "たとえ現実の領土が奪われていようとも、地図の上からスペインの名を消し去ることは誰にもできない。公刊されるすべての海図や地勢図において、我らの主権と国境を正しく明記させ続ける外交闘争を展開する。地図上の正統性を死守することこそが、国際社会に我らの実在を刻みつける手段である。"
 # 産業
 ESP_orinoco_derricks:0 "オリノコの掘削塔"
 ESP_orinoco_derricks_desc:0 "オリノコ川流域の熱帯雨林を切り開き、泥濘の中に立ち並ぶ石油掘削塔を次々と稼働させる。湿地帯の奥底から噴き出す黒い黄金は、孤立した亡命政権の命脈を繋ぐ決定的な富となる。過酷な環境に耐えて資源を吸い上げ、祖国奪還のエンジンを力強く回し続けるのだ。"
 ESP_isla_refinery_focus:0 "イスラ製油所"
 ESP_isla_refinery_focus_desc:0 "オランダ領キュラソー島に位置する巨大なイスラ製油所との提携を深め、原油の精製能力を飛躍的に高める。カリブ海有数の処理能力を誇るこの拠点は、燃料供給の死命を制する戦略要衝である。精製された良質な燃料を安定して確保することで、我らの機械化部隊と艦隊は真の機動力を得る。"
 ESP_fuel_for_fleet:0 "艦隊への燃料"
 ESP_fuel_for_fleet_desc:0 "精製された重油を満載したタンカーを配備し、大西洋を睨む亡命艦隊へ途切れることなく燃料を送り届ける。燃料タンクが満たされて初めて、軍艦はその鋼鉄の牙を研ぎ澄ますことができるのだ。補給線の確保は、海を越えた大遠征を成功させるための絶対条件である。"
 ESP_caracas_workshops:0 "カラカス工房"
 ESP_caracas_workshops_desc:0 "カラカス郊外の工廠や作業場を拡張し、小火器や弾薬の現地自給体制を急速に整備する。本国からの補給が途絶えた今、一発の銃弾、一挺の小銃すら自前で製造せねばならない。熟練の職人たちと現地の労働力が一体となり、戦線へ送るべき兵器を昼夜を分かたず造り出す。"
 ESP_exile_shipwrights:0 "亡命船大工"
 ESP_exile_shipwrights_desc:0 "カディスやカルタヘナから逃れてきた熟練の造船工たちが、カリブの船渠に集結している。彼らの卓越した技術と経験は、荒波を越えてきた損傷艦を蘇らせ、新たな小型戦闘艦を建造する原動力となる。異郷のドックに響く槌音は、海軍再建にかける我らの執念そのものである。"
 ESP_convoy_flag:0 "輸送船団旗"
 ESP_convoy_flag_desc:0 "大西洋を行き交う商船や輸送船の船尾に、我らの正統な商船旗を高らかに掲揚させる。中立国の港湾や国際水域においてこの旗を認めさせることは、経済活動を守り抜くための生命線である。護衛された船団が海原を走る限り、亡命政権の血管に物資と富が流れ続ける。"
 ESP_university_in_exile:0 "亡命大学"
 ESP_university_in_exile_desc:0 "知識人や学者たちが集う新たな学術拠点を設立し、スペインの知性と文化の火を後世へと繋ぐ。戦火によって研究を断たれた教授陣を招聘し、次代を担う若者たちに高度な教育を授けるのだ。学問の自由と科学的探究を守り抜くことこそが、復興後の国家を支える確固たる礎となる。"
 ESP_imprenta_madrid:0 "マドリード印刷所"
 ESP_imprenta_madrid_desc:0 "「マドリード印刷所」と名付けられた印刷工房を立ち上げ、新聞、宣伝文書、公報を大量に刷り出す。言論の力によって内外のプロパガンダ戦を優位に進め、本国の反乱政権による欺瞞を暴くのだ。鉛の活字から放たれる真実の言葉は、海を越えて本国の抑圧された同胞たちへと届くだろう。"
 ESP_bolivar_gold:0 "ボリバルの金"
 ESP_bolivar_gold_desc:0 "かつて独立の英雄ボリバルが駆け抜けた大地から採掘される金や外貨準備を、巧みな金融政策によって確保する。新大陸の潤沢な貴金属は、信用を失いかけた亡命通貨の価値を裏付ける揺るぎない担保となる。この黄金の盾を手に入れることで、我らは列強からの武器購入に必要な資金力を手にする。"
 ESP_krone_standard:0 "クローネ本位"
 ESP_krone_standard_desc:0 "北欧や低地諸国の安定した通貨制度を参考に、独自のクローネ本位制あるいは為替防衛策を導入する。インフレの猛威から亡命経済を守り、国際市場における決済能力を確保しなければならない。強固な通貨基盤を確立することによって、在外の商業活動と外資の導入が円滑に進むだろう。"
 ESP_antilles_market:0 "アンティル市場"
 ESP_antilles_market_desc:0 "カリブ海全域を網羅する自由貿易ネットワークを構築し、関税障壁を撤廃して物資の流通を活発化させる。農産物、鉱物資源、工業製品が諸島間を縦横に行き交い、亡命政府の金庫に莫大な関税収入と利益をもたらす。この豊かな海洋市場の繁栄こそが、軍事作戦を支える経済的土台となる。"
 # 軍事
 ESP_fleet_review:0 "亡命艦隊観艦式"
 ESP_fleet_review_desc:0 "カリブの波間に整列した艦艇の前で、亡命海軍の威容を示す壮大な観艦式を挙行する。白波を蹴立てて進む軍艦の姿は、兵士たちの士気を鼓舞し、現地諸国に対しても我らの力をまざまざと見せつける。この艦隊が再び大西洋を逆流し、祖国の母港へと凱旋する日は決して遠くない。"
 ESP_buiza_flag:0 "ブイサの旗"
 ESP_buiza_flag_desc:0 "共和国海軍の猛将ミゲル・ブイサ提督が座乗する旗艦に、司令長官旗が厳かに掲げられる。内戦の苦難を共に乗り越えてきた水兵たちの信望を集める彼の指揮の下、海軍の規律は再び引き締められる。提督の掲げる旗は、いかなる強敵にも屈せぬ不屈の海の誇りを象徴している。"
 ESP_curacao_squadron:0 "キュラソー分艦隊"
 ESP_curacao_squadron_desc:0 "キュラソー島の港湾を前進根拠地として活用し、快速巡洋艦と駆逐艦からなる機動分艦隊を編成する。周辺海域の哨戒と商船護衛を徹底し、敵対勢力の通商破壊工作を徹底して排除するのだ。この精鋭部隊の存在により、カリブ海の航路の安全は強固に担保される。"
 ESP_refitted_libertad:0 "リベルタ改修"
 ESP_refitted_libertad_desc:0 "過酷な航海を耐え抜いた軽巡洋艦「リベルタ」を現地の船渠に入渠させ、近代的な改修工事を施す。対空火器の増設と機関の徹底的なオーバーホールにより、その戦闘能力は格段に向上する。新たな装いとなった自由の軍艦は、亡命艦隊の頼もしい中核として再び海原へと乗り出す。"
 ESP_submarine_wolves:0 "潜水狼群"
 ESP_submarine_wolves_desc:0 "潜水艦部隊を大西洋の通商路へと密かに進出させ、群狼戦術によって敵の海上交通を脅かす。海面下に身を潜める鋼鉄の狼たちは、敵国の輸送船団に対して静かなる恐怖を突きつけるのだ。神出鬼没の潜水作戦を展開することで、我らは大西洋の制海権争いに決定的な楔を打ち込む。"
 ESP_miaja_staff:0 "ミアハ参謀本部"
 ESP_miaja_staff_desc:0 "マドリード防衛の英雄ホセ・ミアハ将軍を中心として、最高軍事指導機関たる参謀本部を編成する。百戦錬磨の幕僚たちが集い、綿密な戦略計画と奪還作戦の青写真を練り上げるのだ。将軍の卓越した戦略眼と冷静沈着な統率力の下で、亡命陸海軍は一つの有機的な刃となる。"
 ESP_rojo_academy:0 "ロホ軍学校"
 ESP_rojo_academy_desc:0 "名将ビセンテ・ロホの教練思想を受け継ぐ士官学校を亡命先で再興する。熱帯の苛烈な気候下で新たな指揮官層を育成し、敗北の苦い教訓を近代戦の理論へと昇華させねばならない。我らの軍旗が再び故国の土を踏むその日まで、若き将校たちの鍛錬に妥協は許されない。"
 ESP_legion_in_exile:0 "亡命外人部隊"
 ESP_legion_in_exile_desc:0 "内戦を生き延び海を渡った古参兵や、祖国復興の大義に共鳴する亡命外国人たちを糾合する。彼らに必要なのは過去の悔恨ではなく、確固たる規律と最新の装備である。この精鋭部隊こそが、いずれ決行される大西洋逆渡航の急先鋒となるだろう。"
 ESP_amphibious_doctrine:0 "上陸ドクトリン"
 ESP_amphibious_doctrine_desc:0 "本土奪還には、かつてない規模の敵前敵中上陸作戦が不可避である。カリブ海の島嶼部を演習場に見立て、沿岸堡塁の無力化と迅速な揚陸展開の手順を確立する。波打ち際の攻防を制する技術体系こそ、帰還を単なる悲願で終わらせないための鍵となる。"
 ESP_landing_battalions:0 "海兵大隊"
 ESP_landing_battalions_desc:0 "熱帯の砂浜とマングローブ林で実戦的訓練を重ねた海兵大隊を編成する。彼らは過酷な強行上陸任務に耐えうる頑強な肉体と、歩兵・砲兵・工兵の有機的連携を叩き込まれている。荒れ狂う海を突破し、イベリア沿岸に最初の足場を築くのは彼らの双肩にかかっている。"
 ESP_generalstaff_return:0 "帰還参謀本部"
 ESP_generalstaff_return_desc:0 "カリブの拠点に散らばっていた高級幕僚を集結させ、統一された帰還参謀本部を組織する。陸海空の全作戦計画を一本化し、大西洋を跨ぐ膨大な補給線と戦略機動を統制せねばならない。祖国奪還の青写真を描く冷徹な頭脳が、いま整いつつある。"
 ESP_air_exile_wings:0 "亡命航空団"
 ESP_air_exile_wings_desc:0 "亡命パイロットたちを再編し、新造機を配備して亡命航空団を立ち上げる。空戦技量に長けた古参と若手操縦士が一体となり、洋上長距離飛行と地上支援の戦術を磨き上げる。祖国の空を取り戻すための翼が、カリブの青空へと力強く羽ばたく。"
 ESP_caribbean_patrol:0 "カリブ哨戒"
 ESP_caribbean_patrol_desc:0 "亡命政府の生命線たるカリブ海の航路を哨戒艦艇と飛行艇で網の目のように警備する。不審船の接近や敵性勢力の浸透を断固として阻止し、補給網の安全を確保せねばならない。この海域の安定こそが、遠き大西洋の彼方へ力を投射するための大前提である。"
 ESP_long_range_ferry:0 "長距離航送"
 ESP_long_range_ferry_desc:0 "新世界から旧世界へと軍勢を運ぶ長距離輸送船団と航送体制を整備する。数千海里に及ぶ外洋を越えて人員と物資を安全に送り届けるには、緻密な航路策定と護衛網が欠かせない。大西洋を渡る補給の架け橋が完成してこそ、我らの反攻は現実の戦力となる。"
 # 橋頭堡
 ESP_mediterranean_claws_focus:0 "地中海の爪"
 ESP_mediterranean_claws_focus_desc:0 "北アフリカ沿岸に踏みとどまるセウタとメリリャは、地中海に食い込んだ我らの切実な爪である。これら飛び地拠点を再整備し、イベリア半島南部を睨む戦略的足場として活性化させる。本土の敵に海峡越しの刃を突きつけ続けることこそ、亡命政権の矜持にほかならない。"
 ESP_ceuta_arsenal_focus:0 "セウタ工廠"
 ESP_ceuta_arsenal_focus_desc:0 "要衝セウタに補給工廠を拡張し、弾薬と重火器の修理・製造拠点を確立する。海峡の向こうから届く物資に依存する脆弱さを脱し、前線基地としての自給自足を推し進める。ここから生み出される兵器群が、いずれ本土奪還の引き金を引くことになる。"
 ESP_melilla_watch:0 "メリリャ監視網"
 ESP_melilla_watch_desc:0 "メリリャに最新の望遠監視所と電信施設を敷設し、アルボラン海一帯の動向を常時捕捉する。敵艦隊の不穏な航行や密航者の接触をいち早く察知し、情報戦の優位を握らねばならない。静かなる警戒の網が、北アフリカの出撃拠点を不意打ちから防ぎ止める。"
 ESP_strait_fortress:0 "海峡要塞"
 ESP_strait_fortress_desc:0 "ジブラルタル海峡に面した要地に沿岸砲台と地下弾薬庫を増設し、難攻不落の要塞へと昇華させる。海峡の通行権を事実上掌握することで、地中海へ出入りするいかなる勢力にも睨みを利かせる。この防衛線の存在が、敵に対する強力な抑止力として機能する。"
 ESP_puppet_staffs:0 "傀儡参謀統合"
 ESP_puppet_staffs_desc:0 "アフリカ現地の従属部隊や現地の行政参謀を我らの統帥機構下へと統合する。指揮系統の二重性を排除し、亡命政府の中央命令が末端の警備部隊まで淀みなく行き届く体制を整える。足元の組織を固めずして、大西洋を越えた大作戦の遂行は望めない。"
 ESP_absorb_the_claws:0 "爪の吸収"
 ESP_absorb_the_claws_desc:0 "北アフリカ飛び地の自律的権限を段階的に回収し、亡命政府直轄の領土として完全に組み込む。現地の軍閥や特権階級の勝手な振る舞いを排し、全資源を本土帰還の大義へと動員する。爪を己の拳へと一体化させることで、我らの意志は一片の迷いもなく統一される。"
 ESP_keep_the_claws:0 "傀儡の維持"
 ESP_keep_the_claws_desc:0 "現地の特殊な政治力学に配慮し、飛び地拠点の自治と既存の傀儡統治体制を当面は維持する。無理な中央集権化による摩擦を避け、現地の有力者たちを懐柔して後背地の治安を安定させる。実利を重んじる柔軟な間接統治こそが、限られた国力を温存する賢策である。"
 # 外交
 ESP_league_petition:0 "国際連盟への訴え"
 ESP_league_petition_desc:0 "ジュネーヴの国際連盟へ特使を派遣し、本土を占拠する非合法政権の暴虐を告発する。我らこそが正統なスペイン共和国の継承者であると国際世論に訴え、外交的正当性を勝ち取らねばならない。たとえ連盟の実効性が揺らいでいようとも、外交文書に残る大義は無視できない重みを持つ。"
 ESP_mexican_hand:0 "メキシコの手"
 ESP_mexican_hand_desc:0 "かつて亡命者を温かく受け入れてくれたメキシコとの歴史的連帯をさらに深める。経済的支援や軍事物資の調達において協力を仰ぎ、ラテンアメリカにおける強固な後ろ盾を確保する。兄弟国の差し伸べてくれた温かい手は、荒波に漂う亡命政府にとって無二の支えである。"
 ESP_washington_briefing:0 "ワシントン説得"
 ESP_washington_briefing_desc:0 "ホワイトハウスおよび米国務省へ非公式の使節を送り、我らの戦略的重要性を説得する。カリブ海の秩序維持と反ファシズムの防波堤として、亡命スペインが果たす役割の大きさを売り込む。アメリカの黙認と軍事物資の供与を取り付けることが、帰還への道を大きく開く。"
 ESP_caribbean_recognition:0 "米州の承認"
 ESP_caribbean_recognition_desc:0 "カリブ海沿岸の諸国家に対して活発な外交攻勢を仕掛け、正当政府としての国家承認を取り付ける。領土的野心を抱かず地域経済の発展に寄与する姿勢を示すことで、周辺国の不信を払拭する。米州における承認の輪を広げることが、国際的孤立を脱するための第一歩となる。"
 ESP_guiana_border:0 "ギアナ国境の確定"
 ESP_guiana_border_desc:0 "長年曖昧なままであったギアナ地域周辺の境界線を画定し、領土関係を法的に安定させる。近隣諸国との無用な摩擦の火種を未然に消し去り、後背地の安全を確立せねばならない。確固たる国境の確定により、内政の足場を固めて次なる外征に備える。"
 # 対仏関係
 ESP_atlantic_temperature:0 "大西洋の温度"
 ESP_atlantic_temperature_desc:0 "大西洋を挟むフランスとの距離感と外交的緊張は、刻一刻と変化している。対決を辞さない威圧を選ぶか、あるいは妥協による共存を模索するか、情勢の温度計を見極めねばならない。この大西洋の温度の推移が、亡命政府の命運を左右する羅針盤となる。"
 ESP_fra_handshake:0 "対仏握手"
 ESP_fra_handshake_desc:0 "イデオロギーの対立や過去の確執を一時棚上げし、フランス共和国との歴史的握手を交わす。外交ルートの正常化を通じて背後の安全を買い、本土帰還に全精力を集中させるための協調路線を選ぶ。現実的な国益を最優先とした決断が、大西洋に束の間の平穏をもたらす。"
 ESP_fra_cold_war:0 "冷たい共存"
 ESP_fra_cold_war_desc:0 "フランスとの妥協なき主権争いを見据え、全面衝突を避けつつも張り詰めた冷戦状態を維持する。国境や海上交通路での小競り合いを警戒し、常に相手の隙を伺う持久戦の構えをとる。凍てつくような緊張関係の中で、我らは自らの軍事的自立を証明し続けねばならない。"
 ESP_paris_consulate:0 "パリ領事館"
 ESP_paris_consulate_desc:0 "パリの地に領事館を正式に再開し、ヨーロッパ中枢への外交・情報連絡拠点とする。フランス国内の世論を味方につけつつ、イベリア半島から流れてくる貴重な機密情報を収集する。敵の懐深くに掲げられた公館の旗は、我らが健在であることの動かぬ証拠である。"
 ESP_iberian_joint_charter:0 "イベリア共同憲章"
 ESP_iberian_joint_charter_desc:0 "イベリア半島の将来構想を巡り、フランスをはじめとする関係勢力と共同憲章を起草する。戦後の秩序回復や主権尊重の原則を条文化し、国際社会に向けた共通の誓約として公表する。この憲章が掲げる大義こそが、反動勢力を道徳的に追い詰める強力な武器となる。"
 ESP_atlantic_entente:0 "大西洋協商"
 ESP_atlantic_entente_desc:0 "大西洋を巡る利害を一致させ、フランスとの間に互恵的な安全保障の協商関係を樹立する。共通の脅威に対抗するための軍事・経済協力を制度化し、海洋秩序の防衛を誓い合う。かつての反目は消え去り、大西洋を挟んだ両国は新たな同盟者として肩を並べる。"
 ESP_caracas_ultimatum:0 "カラカス最後通牒"
 ESP_caracas_ultimatum_desc:0 "国境紛争と資源権益を巡り、ベネズエラ政府に対して妥協なき最後通牒を突きつける。要求の無条件受け入れを迫り、我らの主権と要求を力で認めさせる覚悟を示さねばならない。南米北岸における指導的地位を確立するため、亡命政府は強硬な一歩を踏み出す。"
 ESP_recognition_by_war:0 "戦争による承認"
 ESP_recognition_by_war_desc:0 "外交交渉の限界を悟り、武力行使によって我らの主権と正当性を周辺諸国に認めさせる。戦場での決定的な勝利こそが、いかなる外交辞令よりも雄弁に亡命政府の実力を物語る。流された血の代償として、新世界における我らの存在は疑いようのない事実として刻まれる。"
 # 対仏産業枝
 ESP_orinoco_for_machine:0 "油と機械のバーター"
 ESP_orinoco_for_machine_desc:0 "オリノコ川流域に眠る豊かな原油資源を担保に、重工業国から最新の機械と工作機械を輸入する。未開発の地下資源を近代的な工業生産力へと転換し、軍需産業の基盤を一気に立ち上げる。黒い黄金と鋼鉄の物々交換が、亡命軍の足回りを急速に近代化していく。"
 ESP_curacao_joint_refine:0 "キュラソー合弁精製"
 ESP_curacao_joint_refine_desc:0 "オランダ領キュラソー島の高度な石油精製インフラと連携し、合弁製油事業を開始する。採掘された重質油を航空揮発油や艦船用重油へと効率よく精製し、安定した補給源を確立する。カリブの海上に広がる精製ネットワークが、我らの艦隊と航空隊の血液を絶え間なく供給する。"
 ESP_oil_embargo_fra:0 "対仏禁輸"
 ESP_oil_embargo_fra_desc:0 "対立を深めるフランスに対し、手中の石油資源と精製燃料の供給を完全に遮断する。相手の産業と軍事機構の血管を締め上げ、大西洋における影響力を行使せねばならない。資源という名の静かなる兵器を用いて、我らは大国に手痛い代償を支払わせる。"
 ESP_war_refinery:0 "軍需製油所"
 ESP_war_refinery_desc:0 "有事に備えて自前の軍需製油所を急速建設し、高度な防空設備と備蓄タンクを備え付ける。敵の空襲や封鎖に左右されない戦略燃料の自給体制を築き、長期戦への耐性を高める。立ち上る煙突の群れは、いかなる干渉にも屈しない強靭な補給力の象徴となる。"
 # 対仏軍事枝
 ESP_joint_caribbean_patrol:0 "カリブ共同哨戒"
 ESP_joint_caribbean_patrol_desc:0 "友邦の海軍と緊密に連携し、カリブ海全域をカバーする広域共同哨戒部隊を編成する。海図や暗号通信を共有し、外洋からの敵対勢力の侵略を未然に封じ込める。手を取り合って碧海を監視することで、哨戒の負担を分散しつつ鉄壁の防衛網を築き上げる。"
 ESP_strait_condominium:0 "セウタ海峡共同管理"
 ESP_strait_condominium_desc:0 "地中海の喉首たるセウタ周辺の警備と通商管理を、同盟国との共同管轄下に置く協定を結ぶ。独力での維持が困難な防衛任務を分担し、海峡の国際的価値を高めて防衛を確実なものとする。海峡の共同管理体制は、友邦との軍事的紐帯を強固にする楔となる。"
 ESP_anti_fra_asw:0 "対仏対潜競争"
 ESP_anti_fra_asw_desc:0 "フランス海軍の潜水艦戦力に対抗すべく、ソナー技術の改良と対潜護衛艦の整備を急ピッチで進める。大西洋の暗い海底下隙を突こうとする敵潜水艦を徹底的に捜索・排除する能力を養う。海洋の生命線を巡る見えざる戦いを制してこそ、真の制海権が我らの手に落ちる。"
 ESP_bridgehead_deterrence:0 "橋頭堡牽制配備"
 ESP_bridgehead_deterrence_desc:0 "北アフリカの橋頭堡に最新鋭の沿岸防備部隊と機甲戦力を配備し、敵のいかなる逆侵攻も粉砕する構えを誇示する。圧倒的な牽制態勢を維持することで、本土の防衛軍を沿岸部に釘付けにし、戦略的イニシアチブを握る。この揺るぎなき盾の存在が、将来の反攻作戦を容易にする。"
 # アンドラ
 ESP_andorra_post:0 "アンドラ連絡所"
 ESP_andorra_post_desc:0 "ピレネー山脈の険しい小国アンドラに極秘の外交連絡所を開設する。中立を装う山間の谷間に情報網の拠点を置き、本土のレジスタンスやフランス側の協力者と密かに接触する。深い霧に包まれた連絡所は、分断された故国と我らを繋ぐ細くとも強固な命綱となる。"
 ESP_urgell_seat:0 "ウルヘルの席"
 ESP_urgell_seat_desc:0 "アンドラの共同公の一角を占めるウルヘル司教座との政治的接触を確立する。歴史ある教会組織との対話を通じてカトリック勢力の反感を和らげ、カタルーニャ地方への影響力を浸透させる。神聖なる司教の座をめぐる駆け引きが、ピレネー越えの扉を静かに押し開く。"
 ESP_coprincipality_talks:0 "共治公国交渉"
 ESP_coprincipality_talks_desc:0 "フランス国家元首とウルヘル司教が並び立つ共治公国の特殊な地位を利用し、三者間の直接交渉を開始する。アンドラの中立と主権を尊重しつつ、我らの活動の自由を認めさせる巧妙な外交を展開する。ピレネーの小公国を舞台とした丁々発止の交渉が、勢力均衡の力学を揺さぶる。"
 ESP_restore_adr:0 "アンドラ解放"
 ESP_restore_adr_desc:0 "外部の干渉と軍事的圧迫からアンドラを解放し、その完全な主権と自由を回復させる。山岳民族の誇りを尊重して友好的な自治体制を支援し、確固たる同盟関係を築き上げる。恩義を感じた山村の人々は、やがて来るべきピレネー突破の最も心強い水先案内人となる。"
 ESP_andorra_nail:0 "ピレネーの釘"
 ESP_andorra_nail_desc:0 "ピレネーの要害アンドラを不抜の軍事拠点へと改造し、フランスとイベリア双方を牽制する楔とする。山岳地帯に強固な機関銃座と対空陣地を構築し、容易には抜けない釘として打ち込む。この山頂の要塞化により、ピレネー山脈全域の交通路を我らの監視下に置く。"
 ESP_pyrenees_listening:0 "ピレネー傍受網"
 ESP_pyrenees_listening_desc:0 "高山地帯の急峻な峰々に高感度の電波傍受局を秘密裏に建設する。ピレネー南北を行き交う敵の軍用無線や暗号通信を白日の下に晒し、防衛線の配置を丸裸にする。冷たい高嶺から見下ろす情報の眼が、敵のあらゆる策謀を事前に看破する。"
 ESP_valley_market:0 "渓谷市場"
 ESP_valley_market_desc:0 "山あいの渓谷地帯に物資の非公式な中継交易市場を開設し、生活必需品と軍需品を流通させる。国境警備の目を潜り抜けてイベリア本土へ物資を送り込み、現地の地下経済を掌握する。人々と物資が密かに行き交う闇市は、反攻を支える資金と支持の源泉となる。"
 # 復帰
 ESP_reconquista_plan:0 "レコンキスタ計画"
 ESP_reconquista_plan_desc:0 "故国の全土を不法占拠者から奪還するための総合反攻計画、現代のレコンキスタを策定する。過去数年間に蓄積された全軍事力と亡命民の怨嗟を、一点の突破口へと叩きつける構想である。祖国の山河を再び我らの手に取り戻すための、最も壮大な青写真がここに完成する。"
 ESP_maquis_network:0 "マキ地下組織"
 ESP_maquis_network_desc:0 "イベリア山中に潜む反ファシズムのゲリラ組織「マキ」との連絡を回復し、武器と資金を空輸する。山岳地帯に張り巡らされた抵抗の地下ネットワークを活性化させ、敵の背後を不断に脅かす。彼らの神出鬼没の襲撃が、防衛軍の神経を摩耗させ、決起の瞬間を早める。"
 ESP_pyrenees_line:0 "ピレネー連絡線"
 ESP_pyrenees_line_desc:0 "ピレネー山脈の険しい間道を網羅する秘密補給路を完成させ、人と情報の流通を確立する。山案内の密輸業者や地元民の協力を得て、国境警備隊の隙を突く脱出・潜入ルートを常設化する。この山脈の動脈を通じて、本土の抵抗勢力へと絶え間なく血肉が送り込まれる。"
 ESP_iberian_uprising:0 "イベリア蜂起"
 ESP_iberian_uprising_desc:0 "機は熟した。本土の地下組織と労働者たちへ一斉蜂起の合図を送り、都市と農村で同時に反乱の火の手を上げさせる。敵の統治機構を内部から麻痺させ、進撃する解放軍を歓呼の声で迎え入れねばならない。祖国の自由を求める人々の怒りが、圧政の鎖を粉々に打ち砕く。"
 ESP_balearic_stepping:0 "バレアレスの足場"
 ESP_balearic_stepping_desc:0 "地中海に浮かぶバレアレス諸島を奪還し、本土沿岸への飛び石となる作戦基地を築く。敵の航空戦力を排除して港湾を確保し、カタルーニャおよびバレンシアへの跳躍台とする。島々の解放が告げる勝利の鐘は、目前に迫った半島の夜明けを予感させる。"
 ESP_canary_anchor:0 "カナリアの錨"
 ESP_canary_anchor_desc:0 "大西洋航路の要衝カナリア諸島を急襲・確保し、帰還船団の絶対的な錨地として機能させる。外洋からの長距離航走部隊をここに集結させ、最終点検と補給を行って本土侵攻へ備える。大西洋の波濤を越えてきた我らの艦隊が、いよいよ反攻の錨を上げる。"
 ESP_lisbon_question:0 "リスボン問題"
 ESP_lisbon_question_desc:0 "イベリア半島の西半分を占めるポルトガルとの複雑な外交問題に直面する。隣国の動向を中立に留めるか、圧力をかけて反ファシズム戦線へ引き込むか、慎重な舵取りが求められる。リスボンの決断を見誤れば、半島全体の解放作戦に思わぬ背後の一撃を受けかねない。"
 ESP_french_gate:0 "フランスの門"
 ESP_french_gate_desc:0 "ピレネーの国境ゲートを押し開き、フランス国境側からの陸上侵攻路を確保する。友邦の支援を取り付けるか、あるいは国境警備を実力で突破してカタルーニャの平野部へと雪崩れ込む。半島の北の門が開かれた瞬間、侵略者たちの逃げ場は完全に断たれる。"
 ESP_operation_return:0 "帰還作戦"
 ESP_operation_return_desc:0 "長きにわたる亡命の苦難に終止符を打つ、史上最大の祖国奪還作戦が幕を開ける。カリブ海、大西洋、地中海から集結した陸海空の全将兵が、祖国の海岸線へと一斉に殺到する。我らは帰ってきたのだ、流された涙と血の代償を、正義の鉄槌に変えて取り戻すために。"
 ESP_madrid_or_nothing:0 "マドリードか無か"
 ESP_madrid_or_nothing_desc:0 "首都マドリードを奪還せずして、我らの戦いが終わることは決してない。敵の最後の牙城を取り囲み、総力を結集した猛攻を加えて反動政権の息の根を止める。首都の広場に再び自由の旗を掲げるか、さもなくば全軍討ち死にあるのみである。"
 ESP_iberia_restored:0 "イベリア再統合"
 ESP_iberia_restored_desc:0 "幾星霜の追放生活と過酷な血戦を乗り越え、ついにイベリア半島全土に正統なる共和国の統治が蘇った。カリブ海の波音から始まった孤独な戦いは、いまや国民の歓喜と平和の凱歌となって結実した。苦難を分かち合ったすべての同胞に報いるため、我らは誇り高き新生スペインの未来を築き上げていく。"