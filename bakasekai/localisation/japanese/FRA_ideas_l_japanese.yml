 ##############################################
 # FRA イベリア併合シナリオ ideas/designer localisation
 ##############################################

 # 国民精神
 FRA_two_crowns:0 "二つの王冠"
 FRA_two_crowns_desc:0 "パリの玉座とリスボンの議会が結びつき、帝国は二つの心臓を持つ特異な同君連合体制を確立した。伝統あるフランスの栄光と海洋国家イベリアの利害は常にせめぎ合っており、協調と摩擦の狭間で危うい均衡を保っている。この壮大な二重統治を維持できるか否かが、西欧全土の覇権の行方を左右することになる。"
 FRA_iberian_burden:0 "イベリアの重荷"
 FRA_iberian_burden_desc:0 "併合されたイベリア半島は広大な領土をもたらしたものの、各地に根強い反抗心と終わりのないゲリラ活動の火種を抱え込んでいる。現地の治安維持と自治要求への対応には莫大な国費と兵力が割かれ、本国の財政をじわじわと圧迫し続けている。この過酷な重荷を克服しない限り、半島の平穏と真の統合は訪れないだろう。"
 FRA_dover_cliff:0 "ドーバーの崖"
 FRA_dover_cliff_desc:0 "ドーバー海峡の対岸にそびえる白い崖は、海を隔てた宿敵に対する帝国の橋頭堡であると同時に、絶えざる警戒を強いる前線である。英国との緊張関係は常に一触即発の領域にあり、海峡を行き交う哨戒艦艇は一瞬たりとも気を抜くことが許されない。白亜の絶壁を見据える兵士たちの視線には、海の覇権を巡る終わりのない闘志が宿っている。"
 FRA_code_west:0 "ナポレオン法典の西"
 FRA_code_west_desc:0 "かつて革命の精神を結晶化させたナポレオン法典が、ピレネーを越えてイベリアの全土へと布告された。旧来の封建的特権や教会法を打破し、合理的な近代法秩序を敷くことで、長年の抵抗を根底から解きほぐそうとしている。法の下の平等を掲げるこの試みは、頑迷な反乱者たちを帝国の忠実なる臣民へと変貌させつつある。"
 FRA_crown_scales:0 "王冠の配分"
 FRA_crown_scales_desc:0 "パリとリスボンという二つの重心の間で、帝国が持つ権能と利益の配分を巡る綱引きが続いている。どちらか一方に傾けば国内の結束が瓦解しかねないため、政府は常に天秤の針を見極める緻密な政治工作を強いられている。この繊細な均衡を保ち続けることこそが、巨大な連邦帝国を崩壊から防ぐ唯一の道である。"
 FRA_republic_returned:0 "共和国の復活"
 FRA_republic_returned_desc:0 "長きにわたる君主制の迷走を経て、フランスはついに自由と平等の精神を掲げる共和国としての実体を取り戻した。市民たちの手によって議会政治が再建され、独裁と専制の影は過去のものとして払拭されつつある。再興した祖国を前に、国民は新たな時代の主権者として団結を誓っている。"
 FRA_peoples_emperor:0 "人民の皇帝"
 FRA_peoples_emperor_desc:0 "王冠の威光を借りながらも、民衆の熱狂的な支持と愛国心を自らの力の源泉とする特異な軍事帝政が成立した。皇帝は特権階級の擁護者ではなく、人民の意志を体現する至高の執行者として号令を下す。伝統的な君主制を否定しながら頂点に君臨するこの体制は、国民を熱狂的な総動員へと駆り立てている。"

 # ツールチップ
 FRA_crown_seat_tt:0 "§Y王冠の配分§!: [?ROOT.FRA_crown_seat|0]（負＝パリ優位、正＝リスボン優位）"
 FRA_iberian_governate_tt:0 "イベリア諸州を§Yイベリア総督府§!として解放する準備が整う。"
 FRA_release_cat_tt:0 "§Yカタルーニャ§!を解放し、イベリア総督府として従属させる。"
 FRA_release_nav_tt:0 "§Yナバラ／バスク§!を解放し、イベリア総督府として従属させる。"
 FRA_release_glc_tt:0 "§Yガリシア§!を解放し、イベリア総督府として従属させる。"
 FRA_andalusian_direct_tt:0 "アンダルシア諸州を直轄のまま統治し、服従度を高める。"

