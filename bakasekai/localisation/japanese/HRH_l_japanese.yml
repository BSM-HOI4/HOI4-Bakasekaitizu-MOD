l_japanese:
 # --- Events: HRH_recapture_states namespace ---
 HRH_recapture_states.1.t:0 "領土奪還の宣言"
 HRH_recapture_states.1.d:0 "ハットリバー公国・オーストラリア残留軍は、エミュー帝国に奪われた領土を今こそ取り返す時だ！独立の旗を掲げ、失われた州への奪還作戦を宣言する。諸国民よ、我らの決意を目撃せよ！"
 HRH_recapture_states.1.a:0 "オーストラリアに通告を送る"
 HRH_recapture_states.2.t:0 "ハットリバーからの通告"
 HRH_recapture_states.2.d:0 "ハットリバー公国より奇妙な通告が届いた。彼らは自らを独立国家と宣言し、領土の返還を求めている。承認すれば我々の威信は傷つくが、この小さな公国との外交関係も悪化させるべきではないだろう。"
 HRH_recapture_states.2.a:0 "よかろう、独立を認めよう"
 HRH_recapture_states.2.b:0 "無視する——そんな国など存在しない"

 # --- Events: HRH namespace (news) ---
 HRH.1.t:0 "ハットリバーがエミュー帝国から領土を奪還！"
 HRH.1.d:0 "世界中が驚愕している——ハットリバー公国・オーストラリア残留軍がエミュー帝国から領土を奪還したのだ！エミューの侵略によって失われた土地を人類が取り返すなど、前代未聞の出来事である。国際社会はどう反応するだろうか？"
 HRH.1.a:0 "よくやった、盟友よ！"
 HRH.1.b:0 "興味深い動きだ……"
 HRH.1.c:0 "なんということだ……あの小国が……"

 # --- National Focus: HRH ---
 HRH_focus_1:0 "新生ハットリバー"
 HRH_focus_1_desc:0 "公国は新たな一歩を踏み出す。独立の精神を取り戻し、世界に我らの存在を示す時が来た。"
 HRH_focus_2:0 "地域民兵の統合"
 HRH_focus_2_desc:0 "散在する地元の自衛組織を統合し、公国の正規防衛力として再編する。"
 HRH_focus_2_tt:0 "§Y基本装備技術§!を獲得する"
 HRH_focus_3:0 "弾薬庫の建設"
 HRH_focus_3_desc:0 "防衛力を支えるには武器が必要だ。国内に弾薬製造施設を建設し、兵士たちに装備を供給する。"
 HRH_focus_4:0 "女性兵士の志願制度"
 HRH_focus_4_desc:0 "人口の少ない公国にとって、戦力の源泉は限られている。女性にも志願の機会を開き、国防の輪を広げよう。"
 HRH_focus_4A:0 "防衛将校の育成"
 HRH_focus_4A_desc:0 "正規軍を築くには有能な指揮官が必要だ。防衛に特化した将校を育成し、軍事組織の基盤を固める。"
 HRH_focus_5:0 "ハットリバー不規則連隊"
 HRH_focus_5_desc:0 "正規軍の枠組みに当てはまらない、公国独自の不規則連隊を編成する。ゲリラ戦から正規戦まで柔軟に対応できる部隊だ。"
 HRH_focus_5_tt:0 "§Yハットリバー不規則連隊§!の師団テンプレートを獲得し、3個師団が配備される"
 HRH_focus_6:0 "領土奪還作戦"
 HRH_focus_6_desc:0 "準備は整った。エミュー帝国に奪われた領土を取り返すための作戦を発動する。公国の歴史を塗り替える時だ！"
 HRH_focus_6_tt:0 "§Y領土奪還§!の準備が完了する"
 HRH_focus_7:0 "奪還後の統治"
 HRH_focus_7_desc:0 "領土を取り戻した今、その統治を安定させなければならない。行政機構を整備し、新領土を公国に統合する。"
 HRH_focus_8:0 "エミュー帝国への対外交渉"
 HRH_focus_8_desc:0 "領土奪還を果たした今、エミュー帝国との正式な外交関係を樹立する。承認を得れば、公国の地位は盤石なものとなるだろう。"

 HRH_focus_A2:0 "政府の再建"
 HRH_focus_A2_desc:0 "独立国家として機能するためには、政府機構を再建しなければならない。行政・立法・司法の基盤を整える。"
 HRH_focus_A2_tt:0 "§Y政府再建§!の取り組みを開始する"
 HRH_focus_A3:0 "ラタナ連合"
 HRH_focus_A3_desc:0 "ニュージーランドのラタナ運動との連携を図る。先住民の権利と自治を尊重する姿勢は、公国の理念と通じるものがある。"
 HRH_focus_AB3:0 "先住民の志願兵"
 HRH_focus_AB3_desc:0 "プロパガンダを展開し、先住民コミュニティから志願兵を募る。彼らの土地への愛着は、公国の防衛において強力な戦力となるだろう。"
 HRH_focus_A4:0 "ハットリバー民兵隊"
 HRH_focus_A4_desc:0 "不規則連隊と志願兵に加え、公国民による民兵組織を拡大する。国民一人一人が国防の担い手となるのだ。"
 HRH_focus_A4_tt:0 "§Yハットリバー民兵隊§!の師団テンプレートを獲得し、2個師団が配備される"

 # --- Decisions ---
 HRH_government_rebuilding:0 "政府の再建"
 HRH_recapture_neighborhood:0 "近隣領土の奪還"
 decision_name:0 "仮の決定"

