l_japanese:
 # MYS指向フォーカス
 MYS_choose_direction:0 "指向の選択"
 MYS_choose_direction_desc:0 "謎国家の未来を決定する重要な選択の時が来た。我々はどの道を歩むべきなのか？"
 
 MYS_early_outbreak:0 "早期暴発指向"
 MYS_early_outbreak_desc:0 "速攻による拡張を目指す。低脅威度・小国力でも素早く行動を起こそう。"
 
 MYS_mid_rampage:0 "中期暴走指向"
 MYS_mid_rampage_desc:0 "中程度の準備を整えてから行動を起こす。バランスの取れたアプローチだ。"
 
 MYS_late_disaster:0 "後期災害指向"
 MYS_late_disaster_desc:0 "十分な準備を整えてから大規模な行動を起こす。慎重だが破壊的だ。"
 
 MYS_end_crisis:0 "末期危機指向"
 MYS_end_crisis_desc:0 "完全な準備を整えた後、世界全体を巻き込む危機を引き起こす。"
 
 # 早期暴発ツリー
 MYS_rapid_militarization:0 "急速軍備"
 MYS_rapid_militarization_desc:0 "迅速に軍備を整え、即座に行動できる体制を構築する。"
 
 MYS_radical_policies:0 "急進政策"
 MYS_radical_policies_desc:0 "過激な政策により国民の戦意を高める。安定性は犠牲になるが..."
 
 MYS_execute_early_outbreak:0 "早期暴発実行"
 MYS_execute_early_outbreak_desc:0 "準備は整った。今こそ行動を起こす時だ！"
 
 # 中期暴走ツリー
 MYS_military_strengthening:0 "軍事強化"
 MYS_military_strengthening_desc:0 "軍事技術と経験を向上させ、より強力な軍隊を構築する。"
 
 MYS_industrial_development:0 "産業発展"
 MYS_industrial_development_desc:0 "軍需産業を発展させ、戦争準備を整える。"
 
 MYS_execute_mid_rampage:0 "中期暴走実行"
 MYS_execute_mid_rampage_desc:0 "十分な準備が整った。今度こそ世界に我々の力を示そう。"
 
 # 後期災害ツリー
 MYS_massive_armament:0 "大規模軍備"
 MYS_massive_armament_desc:0 "大規模な軍備拡張により、圧倒的な軍事力を構築する。"
 
 MYS_technological_innovation:0 "科学技術革新"
 MYS_technological_innovation_desc:0 "最先端技術を開発し、技術的優位性を確立する。"
 
 MYS_execute_late_disaster:0 "後期災害実行"
 MYS_execute_late_disaster_desc:0 "我々の技術と軍事力により、敵国を圧倒する時が来た。"
 
 # 末期危機ツリー
 MYS_ultimate_preparation:0 "究極準備"
 MYS_ultimate_preparation_desc:0 "核技術を含む究極の兵器を開発し、最終準備を完了する。"
 
 MYS_total_mobilization:0 "完全動員"
 MYS_total_mobilization_desc:0 "全国民を戦争に動員し、総力戦体制を確立する。"
 
 MYS_execute_end_crisis:0 "末期危機実行"
 MYS_execute_end_crisis_desc:0 "全世界を敵に回すことになろうとも、我々の意志を貫き通す！"
 
 # アイデア
 mys_early_outbreak_idea:0 "早期暴発精神"
 mys_early_outbreak_idea_desc:0 "素早い行動により敵を圧倒する戦略を採用している。"
 
 mys_mid_rampage_idea:0 "中期暴走精神"
 mys_mid_rampage_idea_desc:0 "適度な準備と積極的な行動のバランスを取った戦略だ。"
 
 mys_late_disaster_idea:0 "後期災害精神"
 mys_late_disaster_idea_desc:0 "十分な準備の後に大規模な破壊をもたらす戦略を採用している。"
 
 mys_end_crisis_idea:0 "末期危機精神"
 mys_end_crisis_idea_desc:0 "世界全体を巻き込む究極の危機を引き起こす意志を持っている。"
 
 # イベント
 mys_direction.1.t:0 "謎国家の未来"
 mys_direction.1.d:0 "我が国の指導者たちは、国家の未来について激しく議論している。どの道を選ぶべきか？"
 mys_direction.1.a:0 "早期暴発 - 速攻で行動する！"
 mys_direction.1.b:0 "中期暴走 - バランスを取った準備を"
 mys_direction.1.c:0 "後期災害 - 十分な準備の後に"
 mys_direction.1.e:0 "末期危機 - 究極の準備を整えよう"
 
 mys_early_outbreak_tooltip:0 "早期暴発指向を選択すると、低コストで素早く暴発フォーカスを完了できます（cost<40）"
 mys_mid_rampage_tooltip:0 "中期暴走指向を選択すると、中程度のコストで暴発フォーカスを完了できます（cost<100）"
 mys_late_disaster_tooltip:0 "後期災害指向を選択すると、高コストで大規模な暴発フォーカスを完了できます（cost<150）"
 mys_end_crisis_tooltip:0 "末期危機指向を選択すると、最高コストで世界規模の危機を引き起こせます（cost<150以降）"
 
 mys_outbreak.1.t:0 "早期暴発開始！"
 mys_outbreak.1.d:0 "我が軍の電撃的な行動により、敵国は混乱に陥っている。この機会を逃してはならない！"
 mys_outbreak.1.a:0 "勝利は我々のものだ！"
 
 mys_outbreak.2.t:0 "中期暴走開始！"
 mys_outbreak.2.d:0 "十分な準備を整えた我が軍が、ついに行動を開始した。敵国は我々の実力を思い知るだろう。"
 mys_outbreak.2.a:0 "我々の時代が始まる"
 
 mys_outbreak.3.t:0 "後期災害開始！"
 mys_outbreak.3.d:0 "長期間の準備が実を結び、我が国は圧倒的な力を手に入れた。世界は我々の前に屈するだろう。"
 mys_outbreak.3.a:0 "災害の時代の到来だ"
 
 mys_outbreak.4.t:0 "末期危機開始！"
 mys_outbreak.4.d:0 "ついに究極の時が来た。全世界を敵に回そうとも、我々の意志を貫き通す時だ！"
 mys_outbreak.4.a:0 "世界よ、震えるがいい！"