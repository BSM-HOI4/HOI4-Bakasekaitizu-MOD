l_japanese:
 # =========================================
 # BKK 国家方針 (バカ長名ツリー)
 # =========================================

 BKK_baka_long_name:0 "砂と共に去りぬ"
 BKK_baka_long_name_desc:0 "スリランカの正式名称が長いのは世界的に有名だが、我々はさらに長くできると信じている。名前は長ければ長いほど偉いに決まっている。"

 BKK_long_name_army:0 "砂による統治"
 BKK_long_name_army_desc:0 "国名が長いなら、軍隊の名前も長くなければならない。「ちょーながい おなまえ」師団を創設し、世界にその名を轟かせよう。"

 BKK_long_name_division:0 "中東の砂を歓迎せよ"
 BKK_long_name_division_desc:0 "中東の砂が我らの同盟に新たな風をもたらす。砂の技術を習得し、さらなる長名の道を歩もう。"

 BKK_long_name_division_2:0 "長名師団・第二の砂"
 BKK_long_name_division_2_desc:0 "第一師団だけでは足りない。第二の長名師団を編成し、砂の勢力を拡大する。"

 BKK_long_name_division_3:0 "長名師団・第三の砂嵐"
 BKK_long_name_division_3_desc:0 "三度目の正直。三つ目の長名師団があれば、誰も我らの名前を忘れることはないだろう。"

 BKK_air_force:0 "近隣諸国の砂漠化"
 BKK_air_force_desc:0 "空から砂を撒き散らし、近隣諸国を砂漠に変える計画を立案する。空軍もまた、長い名前を持つべきだ。"

 BKK_long_name_tank:0 "アフリカ統一"
 BKK_long_name_tank_desc:0 "長い名前の戦車を開発し、アフリカ大陸を統一する。戦車の名前も当然、非常に長い。"

 BKK_long_name_tank_2:0 "さらば短い名前の戦車よ"
 BKK_long_name_tank_2_desc:0 "第一世代の長名戦車を超える、さらに長い名前の戦車を開発する。装甲も名前も厚くなった。"

 BKK_long_name_tank_3:0 "究極の長名戦車"
 BKK_long_name_tank_3_desc:0 "これまでで最も長い名前を持つ戦車がついに完成。名前が長すぎて無線で伝えるのに三分かかる。"

 BKK_long_name_navy:0 "ナイルとスエズの砂漠化"
 BKK_long_name_navy_desc:0 "海軍の名前も長くしなければ。ナイル川からスエズ運河まで、砂で埋め尽くす海上作戦を開始する。"

 BKK_long_name_ship:0 "サンサンドスタン建国"
 BKK_long_name_ship_desc:0 "砂だらけの国「サンサンドスタン」を建国し、超大型艦を建造する。船の名前もとてつもなく長い。"

 BKK_long_name_ship_2:0 "長名艦隊・弐番艦"
 BKK_long_name_ship_2_desc:0 "第二の長名艦隊を建造する。巡洋艦の技術を習得し、海の砂漠化をさらに推し進める。"

 BKK_long_name_ship_3:0 "長名艦隊・参番艦"
 BKK_long_name_ship_3_desc:0 "第三の長名艦隊が完成。主力艦の技術を獲得し、七つの海に我らの長い名前を刻み込む。"

 BKK_Sri_Jayawardena_Prakotte:0 "スリ・ジャヤワルダナ・プラコッテの行進"
 BKK_Sri_Jayawardena_Prakotte_desc:0 "スリ・ジャヤワルダナ・プラコッテ。それだけでも十分に長い名前だが、さらに長くできるはずだ。首都の名前から国の長名化を推進する。"

 BKK_long_name_alliance:0 "砂のライフル"
 BKK_long_name_alliance_desc:0 "長い名前の同盟を結成し、砂のライフルで武装する。同盟の名前も当然、非常に長い。"

 BKK_GB_long:0 "砂の車"
 BKK_GB_long_desc:0 "グレートブリテンとの交渉を開始する。彼らの国名もなかなか長いが、我々の方が長くできる。"

 BKK_integration_in_the_UK:0 "砂の船でイギリスへ"
 BKK_integration_in_the_UK_desc:0 "イギリス連邦の全構成国を統合し、究極の長名国家を創り上げる。世界最大の国名がここに誕生する。"

 BKK_UK_long_name:0 "砂の飛行機"
 BKK_UK_long_name_desc:0 "イギリス連邦統合後の新たな国名は、もはや人間が読み上げるには長すぎる。これこそが我らの理想である。"

 BKK_long_naming_of_alliances:0 "砂漠研究所"
 BKK_long_naming_of_alliances_desc:0 "同盟名をさらに長くするための研究所を設立する。名前の長さに制限はない。無限の可能性が砂の中に眠っている。"

 BKK_Let_us_make_our_name_look_big:0 "砂の戦争"
 BKK_Let_us_make_our_name_look_big_desc:0 "ついに我らの名前は十分に長くなった。いや、まだ足りない。さらに長く、さらに大きく、さらにバカげた名前を目指すのだ！"

 # =========================================
 # BKK 産業ツリー
 # =========================================

 BKK_industrial_effort:0 "長名国家の産業努力"
 BKK_industrial_effort_desc:0 "長い名前には強い産業基盤が必要だ。工業技術を磨き、長名帝国の基盤を築こう。"

 BKK_construction_effort:0 "長名建設計画"
 BKK_construction_effort_desc:0 "民需工場を建設し、長名国家の経済的基盤を強化する。名前が長い分、工場も多く必要だ。"

 BKK_construction_effort_2:0 "長名建設計画・改"
 BKK_construction_effort_2_desc:0 "建設計画の第二段階。民需工場をさらに増やし、名前の長さに見合った経済力を獲得する。"

 BKK_construction_effort_3:0 "長名建設計画・新"
 BKK_construction_effort_3_desc:0 "建設計画の第三段階。これで名前の長さと経済力のバランスが取れるはずだ。"

 BKK_infrastructure_effort:0 "長名インフラ整備"
 BKK_infrastructure_effort_desc:0 "長い名前を支えるには、長い道路が必要だ。インフラを整備し、国中に名前を行き渡らせる。"

 BKK_infrastructure_effort_2:0 "長名インフラ整備・改"
 BKK_infrastructure_effort_2_desc:0 "インフラ整備の第二段階。道路が延びれば、名前もさらに長くなれるというものだ。"

 BKK_infrastructure_effort_3:0 "長名インフラ整備・新"
 BKK_infrastructure_effort_3_desc:0 "インフラ整備の最終段階。国中の隅々まで名前が行き渡る道路網が完成する。"

 BKK_production_effort:0 "長名軍需生産"
 BKK_production_effort_desc:0 "軍需工場を建設し、長名軍隊の装備を生産する。名前が長い兵士には、それなりの装備が必要だ。"

 BKK_production_effort_2:0 "長名軍需生産・改"
 BKK_production_effort_2_desc:0 "軍需生産の第二段階。さらに多くの武器を生産し、長名軍を強化する。"

 BKK_production_effort_3:0 "長名軍需生産・新"
 BKK_production_effort_3_desc:0 "軍需生産の第三段階。名前が長くなった分、火力も三倍必要だ。"

 BKK_extra_tech_slot:0 "長名研究所"
 BKK_extra_tech_slot_desc:0 "新しい研究施設を設立する。長い名前を研究するには、それなりの研究施設が必要だ。"

 BKK_extra_tech_slot_2:0 "さらに長名研究所"
 BKK_extra_tech_slot_2_desc:0 "研究施設を拡張する。名前をさらに長くするための研究を加速させよう。"

 BKK_extra_tech_slot_3:0 "超長名研究所"
 BKK_extra_tech_slot_3_desc:0 "究極の研究施設が完成。これで名前の長さにおける技術的限界を突破できるかもしれない。"

 BKK_nuclear_effort:0 "砂の核開発"
 BKK_nuclear_effort_desc:0 "核技術の研究を開始する。砂の中に埋もれるウランを発掘し、長名国家の核開発に着手する。"

 BKK_nuclear_effort_2:0 "砂の核・最終段階"
 BKK_nuclear_effort_2_desc:0 "核技術の最終段階。砂のキノコ雲が上がる時、世界は我らの長い名前を永遠に記憶するだろう。"

 BKK_industrial_effort_2:0 "長名産業・第二革命"
 BKK_industrial_effort_2_desc:0 "第二の産業革命を起こし、長名国家の生産能力を飛躍的に向上させる。"

 BKK_secret_weapons:0 "砂の秘密兵器"
 BKK_secret_weapons_desc:0 "極秘裏に画期的な兵器を開発する。電子工学、核技術、ロケット工学を統合した秘密兵器は、名前もまた非常に長い。"

 # =========================================
 # SJK 国家方針 (バカ長名ツリー)
 # =========================================

 SJK_baka_long_name:0 "砂と共に去りぬ"
 SJK_baka_long_name_desc:0 "スリジャヤワルダネプラコッテもまた、名前を長くする野心に燃えている。SJKの長名化が今、始まる。"

 SJK_long_name_army:0 "砂による統治"
 SJK_long_name_army_desc:0 "SJK版・砂の軍隊を創設する。「ちょーながい おなまえ」師団で敵を圧倒しよう。"

 SJK_long_name_navy:0 "ナイルとスエズの砂漠化"
 SJK_long_name_navy_desc:0 "SJK海軍の長名化を推進する。海上から砂を撒き散らし、大洋を砂漠に変える。"

 SJK_long_name_division:0 "中東の砂を歓迎せよ"
 SJK_long_name_division_desc:0 "中東の砂をSJKの同盟に迎え入れる。砂の技術で歩兵の戦闘力を向上させる。"

 SJK_long_name_division_2:0 "長名師団・第二の砂"
 SJK_long_name_division_2_desc:0 "SJK第二の長名師団。砂の力を借りて、さらなる軍事力を獲得する。"

 SJK_long_name_division_3:0 "長名師団・第三の砂嵐"
 SJK_long_name_division_3_desc:0 "SJK第三の長名師団。三つ目の師団で名前の長さは頂点に達する。"

 SJK_air_force?:0 "近隣諸国の砂漠化"
 SJK_air_force?_desc:0 "SJK空軍を創設し、空から砂を降らせる。名前の長さは空の高さに比例する。"

 SJK_long_name_tank:0 "アフリカ統一"
 SJK_long_name_tank_desc:0 "長い名前の戦車でアフリカを統一する。SJKの戦車は名前の長さにおいて無敵だ。"

 SJK_long_name_tank_2:0 "さらば短い名前の戦車よ"
 SJK_long_name_tank_2_desc:0 "第二世代の長名戦車。名前が長くなり、装甲も厚くなった。当然の進化である。"

 SJK_long_name_tank_3:0 "究極の長名戦車"
 SJK_long_name_tank_3_desc:0 "SJK最強の長名戦車。エンジン出力も名前の長さも限界突破。無線手は毎日名前の練習をしている。"

 SJK_long_name_ship:0 "サンサンドスタン建国"
 SJK_long_name_ship_desc:0 "SJK海軍が超大型艦を建造する。サンサンドスタン建国の夢がここに実現する。"

 SJK_long_name_ship_2:0 "長名艦隊・弐番艦"
 SJK_long_name_ship_2_desc:0 "SJK第二の長名艦隊。巡洋艦技術を獲得し、海の砂漠化を推進する。"

 SJK_long_name_ship_3:0 "長名艦隊・参番艦"
 SJK_long_name_ship_3_desc:0 "SJK第三の長名艦隊。主力艦の技術で、七つの海の支配者がここに誕生する。"

 SJK_Sri_Jayawardena_Prakotte:0 "スリ・ジャヤワルダナ・プラコッテの行進"
 SJK_Sri_Jayawardena_Prakotte_desc:0 "スリ・ジャヤワルダナ・プラコッテ。名前の長さにおいて、この首都は永遠の模範である。"

 SJK_long_name_alliance:0 "砂のライフル"
 SJK_long_name_alliance_desc:0 "長名同盟を結成する。砂のライフルで武装した同盟軍は、名前の長さにおいて無敵だ。"

 SJK_NANTOKA_long:0 "なんとか共和国との交渉"
 SJK_NANTOKA_long_desc:0 "名前が長すぎてなんとか共和国と呼ばれるようになった国との交渉を開始する。彼らの名前もなかなかだが、我らの方が長い。"

 SJK_integration_in_the_NANTOKA:0 "なんとか共和国への編入"
 SJK_integration_in_the_NANTOKA_desc:0 "なんとか共和国に編入され、さらに長い国名を獲得する。これこそが長名化の真の目的だ。"

 SJK_NANTOKA_long_name:0 "なんとか共和国の超長名化"
 SJK_NANTOKA_long_name_desc:0 "なんとか共和国の名前をさらに長くする。もはや誰も正しく読めないが、それが狙いだ。"

 SJK_long_naming_of_alliances:0 "砂漠研究所"
 SJK_long_naming_of_alliances_desc:0 "SJK版の砂漠研究所を設立する。同盟名の長さにおいて、もはやライバルは存在しない。"

 SJK_Let_us_make_our_name_look_big:0 "砂の戦争"
 SJK_Let_us_make_our_name_look_big_desc:0 "SJKの名前も十分に長くなった。いや、まだ足りない。バカげた長名の果てに何が待つのか、それは誰にもわからない。"

 # =========================================
 # SJK 産業ツリー
 # =========================================

 SJK_industrial_effort:0 "長名国家の産業努力"
 SJK_industrial_effort_desc:0 "SJKの工業技術を磨き、長名国家の産業的基盤を築く。"

 SJK_construction_effort:0 "長名建設計画"
 SJK_construction_effort_desc:0 "SJKの民需工場を建設する。名前の長さに比例した経済力が必要だ。"

 SJK_construction_effort_2:0 "長名建設計画・改"
 SJK_construction_effort_2_desc:0 "建設計画の第二段階。SJKの経済力をさらに強化する。"

 SJK_construction_effort_3:0 "長名建設計画・新"
 SJK_construction_effort_3_desc:0 "建設計画の第三段階。これでSJKの経済も名前の長さに追いつく。"

 SJK_infrastructure_effort:0 "長名インフラ整備"
 SJK_infrastructure_effort_desc:0 "SJKのインフラを整備する。長い名前には長い道路が必要だ。"

 SJK_infrastructure_effort_2:0 "長名インフラ整備・改"
 SJK_infrastructure_effort_2_desc:0 "インフラ整備の第二段階。SJK中に道路網を行き渡らせる。"

 SJK_infrastructure_effort_3:0 "長名インフラ整備・新"
 SJK_infrastructure_effort_3_desc:0 "インフラ整備の最終段階。SJKの隅々まで名前が届く。"

 SJK_production_effort:0 "長名軍需生産"
 SJK_production_effort_desc:0 "SJKの軍需工場を建設し、長名軍隊の装備を生産する。"

 SJK_production_effort_2:0 "長名軍需生産・改"
 SJK_production_effort_2_desc:0 "SJK軍需生産の第二段階。さらに多くの武器で長名軍を強化する。"

 SJK_production_effort_3:0 "長名軍需生産・新"
 SJK_production_effort_3_desc:0 "SJK軍需生産の第三段階。生産力が名前の長さに追いついた。"

 SJK_extra_tech_slot:0 "長名研究所"
 SJK_extra_tech_slot_desc:0 "SJKに新しい研究施設を設立する。名前の長さを研究するのだ。"

 SJK_extra_tech_slot_2:0 "さらに長名研究所"
 SJK_extra_tech_slot_2_desc:0 "SJKの研究施設を拡張する。名前をさらに長くするための研究を加速させる。"

 SJK_extra_tech_slot_3:0 "超長名研究所"
 SJK_extra_tech_slot_3_desc:0 "SJK究極の研究施設が完成。技術的限界を突破し、無限の長名を実現する。"

 SJK_nuclear_effort:0 "砂の核開発"
 SJK_nuclear_effort_desc:0 "SJKの核技術研究を開始する。砂の中のウランで長名国家の核武装を目指す。"

 SJK_nuclear_effort_2:0 "砂の核・最終段階"
 SJK_nuclear_effort_2_desc:0 "SJK核技術の最終段階。砂のキノコ雲が、世界に長い名前を刻み込む。"

 SJK_industrial_effort_2:0 "長名産業・第二革命"
 SJK_industrial_effort_2_desc:0 "SJK第二の産業革命で生産能力を飛躍的に向上させる。"

 SJK_secret_weapons:0 "砂の秘密兵器"
 SJK_secret_weapons_desc:0 "SJKの極秘兵器開発。電子工学・核・ロケットを統合した秘密兵器は、名前も非常に長い。"

 # =========================================
 # 決定カテゴリ・決定
 # =========================================

 change_of_political_system:0 "政治体制の変更"
 change_to_official_name:0 "正式名称への変更"
 change_to_official_name_desc:0 "我が国の正式名称はこれまで短すぎた。バカげて長い正式名称を採用し、世界のあらゆる記録を更新する。"

 # =========================================
 # 思想・効果
 # =========================================

 BKK_More_Long_Name_idea:0 "さらなる長名化"
 BKK_More_Long_Name_idea_desc:0 "国名はまだ短い。もっと長くできる。もっともっと長く。名前が長ければ長いほど、国は偉大になるのだ。"

 # =========================================
 # 派閥名
 # =========================================

 BKK_long_name_faction:0 "スリランカ民主社会主義共和国および諸国民の超長名同盟"
 BKK_more_long_name_faction:0 "スリランカ民主社会主義共和国およびグレートブリテンおよび北アイルランド連合王国ならびに諸国民の究極超長名大同盟 forever"
