l_japanese:
JPN_industrial_great_leap: "産業大躍進政策"
JPN_industrial_great_leap_desc: "産業・建設業に投資をし、さらに開発のスピードを上げなければならない。"
JPN_manufacturing_revolution: "製造革命"
JPN_manufacturing_revolution_desc: "製造に関する技術を習得して、生産効率を上げなければならない。"
JPN_policy_conference: "政策会議"
JPN_policy_conference_desc: "次の選挙に向けて政策を考えよう。"
JPN_launch_three_year_plan: "三ヵ年計画の始動"
JPN_launch_three_year_plan_desc: "国民を豊かにするため、経済政策を指導する。"
JPN_promote_cultural_activities: "文化活動の推奨"
JPN_promote_cultural_activities_desc: "民間の文化人たちを支援して、世界に進出できるレベルの文人を作り出そう!"
JPN_plan_one: "①計画"
JPN_plan_one_desc: "日本の文化や、芸術を知ってもらうための博覧・販売会を実施するための準備をしよう!\n名前は・・・「文化大市場」とでもしようか？"
JPN_promote_mass_culture: "下層文化の推進"
JPN_promote_mass_culture_desc: "文化人にしかわからない文学や芸術よりも、大衆の理解を得られるものの方が輸出には適している。\nそれがどのようなものであったとしても、だ。"
JPN_education_reform: "教育改革"
JPN_education_reform_desc: "さまざまな文化に、子どものうちから触れることで、よりよい考えに至る人間が増えるだろう。"
JPN_shikoku_redevelopment_plan: "四国大改造計画"
JPN_shikoku_redevelopment_plan_desc: "四国連邦に開発事業を委任し、日本本土から工業・産業・防衛インフラの整備を支援する。"
JPN_farmland_reform: "農地改革"
JPN_farmland_reform_desc: "農業区画を整理して、頓挫した都市計画を復活させよう。"
JPN_emperors_true_intent: "陛下の真意"
JPN_emperors_true_intent_desc: "陛下の真意を問い、その通りに行動することが目標だ。"
JPN_support_farming_households: "農家への支援"
JPN_support_farming_households_desc: "農家に経済的支援を行う!"
JPN_electrify_countryside: "田舎にも電気を"
JPN_electrify_countryside_desc: "田舎だろうと電気を届けられるよう研究する。"
JPN_replenish_manpower: "人員充足"
JPN_replenish_manpower_desc: "農地に人を送り込み、農業に従事させる。"
JPN_promote_local_consumption: "地産地消の推進"
JPN_promote_local_consumption_desc: "出来立ての方が美味しいからね!"
JPN_export_crops: "作物の輸出"
JPN_export_crops_desc: "できた作物のうち、食べきれないものは海外にうろう!"
JPN_reject: "拒絶"
JPN_reject_desc: "なんてことだ・・・"
JPN_accept: "容認"
JPN_accept_desc: "よかった・・・"
JPN_first_policy_conference: "第一回政策会議"
JPN_first_policy_conference_desc: "会議は踊る、されど進まず。"
JPN_second_policy_conference: "第二回政策会議"
JPN_second_policy_conference_desc: "会議は踊る。"
JPN_scolding: "叱咤"
JPN_scolding_desc: "怒られた・・・"
JPN_collapse: "瓦解"
JPN_collapse_desc: "政権は瓦解した。"
JPN_expand_garrisons: "各駐屯地の拡大"
JPN_expand_garrisons_desc: "各駐屯地を拡張する。"
JPN_otherworld_politicians: "異界の政治家"
JPN_otherworld_politicians_desc: "異界からより優秀な政治家を!"
JPN_ritual_outcome: "儀式の結末"
JPN_ritual_outcome_desc: "儀式の結末を見極めよ・・・。"
JPN_go_vertical: "縦にっ!"
JPN_go_vertical_desc: "縦にっ!縦にっ!縦にっ!"
JPN_transjapan_industrial_zone: "日本横断工業地帯"
JPN_transjapan_industrial_zone_desc: "日本の全てを工業地帯へ"
JPN_challenge_the_arctic: "北極への挑戦"
JPN_challenge_the_arctic_desc: "北極を得ればもはや北に我々を阻むものはいない!"
JPN_push_southward: "南進せよ"
JPN_push_southward_desc: "南の蛮族や機械どもを征服しなければならない"
JPN_complete_the_plan: "計画の完遂"
JPN_complete_the_plan_desc: "終わり!"
JPN_next_election: "次期選挙"
JPN_next_election_desc: "選挙の時間です!"
JPN_sacred_education: "神聖教育"
JPN_sacred_education_desc: "高度な教育を指示するとともに、神話や国史に重点を置き、教育計画を立案せよ。"
JPN_invite_cute_leader: "可愛いリーダー"
JPN_invite_cute_leader_desc: "我らが主神をお招きする。"
JPN_embrace_pacifism: "平和主義"
JPN_embrace_pacifism_desc: "我らが大神は争いを好まない!"
JPN_embrace_expansionism: "拡張主義"
JPN_embrace_expansionism_desc: "八洲だけでは足りぬ!\n大神の威光を知らしめるのだ!"
JPN_invest_in_research: "研究への投資"
JPN_invest_in_research_desc: "研究機関に更なる投資を行い、研究速度を高める。"
JPN_cooperate_with_asia: "アジア圏との協調"
JPN_cooperate_with_asia_desc: "争いではなく和を持って関わり合う。"
JPN_invade_paradise: "楽園への侵攻"
JPN_invade_paradise_desc: "楽園を気取る南洋の蛮族が住む島々など、滅ぼしてしまえ。"
JPN_mortal_politicians: "生身の政治家"
JPN_mortal_politicians_desc: "政治家くらいは我々でやらねば。"
JPN_invest_in_tall_cities: "縦に長い都市に投資"
JPN_invest_in_tall_cities_desc: "都市は立体的な都市を推進すべきだ。"
JPN_vertical_government: "縦長行政"
JPN_vertical_government_desc: "さまざまな省庁により、職務を遂行するよりも、縦長な単一の行政による方が、効率的だろう？"
JPN_establish_family_courts: "家庭裁判所の設置"
JPN_establish_family_courts_desc: "子どもの犯罪を裁くための裁判所を設置し、更生の機会を設けよう。"
JPN_support_families: "子育て家庭への支援"
JPN_support_families_desc: "子育て家庭へ支援をして、優秀な子供を育てよう。"
JPN_accelerate_research: "研究の加速"
JPN_accelerate_research_desc: "神々の力を持ってすれば技術の発展など造作もないことである。"
JPN_expand_co_prosperity_sphere: "共栄圏の拡大"
JPN_expand_co_prosperity_sphere_desc: "平和裏に共栄圏を拡大し、アジアの平和と利権を守らねばならない。"
JPN_threaten_small_nations: "中小国を恫喝"
JPN_threaten_small_nations_desc: "取るに足らない中小国でも、我が国が併合することで、発展させてやれるかもしれない。"
JPN_revive_old_alliance: "古き同盟の回生"
JPN_revive_old_alliance_desc: "英国との同盟を回復し、再び結束するのだ。"
JPN_island_union: "諸島連合"
JPN_island_union_desc: "大洋に浮かぶ島々が、我々と手を結び団結すれば、必ずや国防に善く働くであろう。"
JPN_joint_exercises: "合同演習"
JPN_joint_exercises_desc: "陣営の各国と合同演習を行い、士気を高めよう!"
JPN_open_ports_to_allies: "連合への港解放"
JPN_open_ports_to_allies_desc: "連合国の一員である我々は、盟友に対しても修理・補給を提供しなければならない。"
JPN_invest_in_island_ports: "諸島港湾への投資"
JPN_invest_in_island_ports_desc: "港湾設備が不十分では、満足に戦えないだろう。"
JPN_abandon_okinawa: "沖縄の放棄"
JPN_abandon_okinawa_desc: "本土から横に離れてしまった沖縄は、もはや日本ではない!"
JPN_conceptualize_leadership: "指導者の概念化"
JPN_conceptualize_leadership_desc: "指導者ではなく、国民全員が目標を意識しなければならない。"
JPN_kuril_garrison: "千島駐屯地"
JPN_kuril_garrison_desc: "北方の縦長化は完了した。\n二度と奪われないようにしなければ。"
JPN_prepare_summoning: "召喚準備"
JPN_prepare_summoning_desc: "概念的存在を異なる空間から招くのだ。"
JPN_summon_conceptual_leader: "概念上の指導者"
JPN_summon_conceptual_leader_desc: "概念上の指導者を召喚する。"
JPN_restore_strong_japan: "強い日本を、取り戻す。"
JPN_restore_strong_japan_desc: "強い日本を、取り戻さなければならない。"
JPN_otherworld_commanders: "異界の指揮官"
JPN_otherworld_commanders_desc: "異界から指揮官を呼び出し、協力してもらう。"
JPN_vertical_education: "縦長的教育"
JPN_vertical_education_desc: "子供をより縦に成長させるべく導入された、新学習指導要領では、より縦長、継続的な教育を学生に施すよう明記されている。"
JPN_vote_divine_party: "進神党に投票"
JPN_vote_divine_party_desc: "全てを神に委ねよう。"
JPN_vote_imperial_way_party: "皇道党に投票"
JPN_vote_imperial_way_party_desc: "若造ばっかりだが・・・大丈夫なのか？"
JPN_vote_civilian_party: "民政党に投票"
JPN_vote_civilian_party_desc: "民主主義万歳!\n万歳!万歳!万歳!!"
JPN_rise_of_the_military: "軍部の台頭"
JPN_rise_of_the_military_desc: "ヒエェ!\nく、クーデターだ!!"
JPN_fate_of_japan: "日本の運命"
JPN_fate_of_japan_desc: "日本は度重なる国土の変化によって混乱している。"
JPN_support_vertical_party: "縦長党を支持"
JPN_support_vertical_party_desc: "日本も縦に伸びねばならない!"
JPN_election_1936: "1936年選挙"
JPN_election_1936_desc: "さぁ、選挙の時間だ。"
JPN_otherworld_admiral: "異界の提督"
JPN_otherworld_admiral_desc: "異界から提督を召喚し指導に充てる。"
JPN_imperial_conference: "御前会議"
JPN_imperial_conference_desc: "今までの政府の行動を見返すときだ。"
