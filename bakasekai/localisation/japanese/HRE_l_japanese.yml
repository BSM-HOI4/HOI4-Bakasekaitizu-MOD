 # ==================== Shared Army Focuses ====================
 sf_army_effort:0 "陸軍努力"
 sf_army_effort_desc:0 "帝国陸軍の近代化を加速させる。"
 sf_equipment_effort:0 "装備努力"
 sf_equipment_effort_desc:0 "歩兵・砲兵装備の改良に注力する。"
 sf_equipment_effort_2:0 "装備努力 II"
 sf_equipment_effort_2_desc:0 "装備の性能をさらに向上させる。"
 sf_equipment_effort_3:0 "装備努力 III"
 sf_equipment_effort_3_desc:0 "歩兵・砲兵装備の最先端研究を推進する。"
 sf_motorization_effort:0 "機械化努力"
 sf_motorization_effort_desc:0 "機械化部隊の基盤を整える。"
 sf_armor_effort:0 "装甲努力"
 sf_armor_effort_desc:0 "戦車技術の革新に挑む。"
 sf_mechanization_effort:0 "機械化推進"
 sf_mechanization_effort_desc:0 "機械化装備のさらなる発展を図る。"
 sf_doctrine_effort:0 "陸軍教義努力"
 sf_doctrine_effort_desc:0 "陸軍教義の研究を支援する。"
 sf_doctrine_effort_2:0 "陸軍教義努力 II"
 sf_doctrine_effort_2_desc:0 "陸軍教義の研究をさらに強力に推進する。"
 sf_special_forces:0 "特殊部隊"
 sf_special_forces_desc:0 "精鋭特殊部隊を創設し、あらゆる地形で戦える能力を獲得する。"
 # ==================== Shared Air Focuses ====================
 sf_aviation_effort:0 "航空努力"
 sf_aviation_effort_desc:0 "帝国空軍の基盤を構築する。"
 sf_fighter_focus:0 "戦闘機重視"
 sf_fighter_focus_desc:0 "制空権を確保するため戦闘機開発に注力する。"
 sf_bomber_focus:0 "爆撃機重視"
 sf_bomber_focus_desc:0 "戦略爆撃機と戦術爆撃機の開発に注力する。"
 sf_aviation_effort_2:0 "航空努力 II"
 sf_aviation_effort_2_desc:0 "空軍力をさらに拡大し、航空基地を整備する。"
 sf_CAS_effort:0 "近接航空支援努力"
 sf_CAS_effort_desc:0 "CAS技術を前倒しで研究し、地上部隊を支援する。"
 sf_rocket_effort:0 "ロケット開発"
 sf_rocket_effort_desc:0 "ロケットおよびジェット技術の研究を前倒しする。"
 sf_NAV_effort:0 "海軍航空隊努力"
 sf_NAV_effort_desc:0 "雷撃機・急降下爆撃機技術を前倒しで研究する。"
 # ==================== Shared Naval Focuses ====================
 sf_naval_effort:0 "海軍努力"
 sf_naval_effort_desc:0 "帝国海軍の基盤を構築し、造船所を建設する。"
 sf_flexible_navy:0 "柔軟な海軍"
 sf_flexible_navy_desc:0 "機動性を重視した海軍ドクトリンを採用する。"
 sf_large_navy:0 "大艦隊"
 sf_large_navy_desc:0 "主力艦重視の大艦隊ドクトリンを採用する。"
 sf_submarine_effort:0 "潜水艦努力"
 sf_submarine_effort_desc:0 "潜水艦技術を前倒しで研究する。"
 sf_destroyer_effort:0 "駆逐艦努力"
 sf_destroyer_effort_desc:0 "駆逐艦技術を前倒しで研究する。"
 sf_cruiser_effort:0 "巡洋艦努力"
 sf_cruiser_effort_desc:0 "軽巡洋艦・重巡洋艦技術を前倒しで研究する。"
 sf_capital_ships_effort:0 "主力艦努力"
 sf_capital_ships_effort_desc:0 "戦艦・巡洋戦艦・空母技術を前倒しで研究する。"
 # ==================== Shared Political Focuses ====================
 sf_political_effort:0 "政治努力"
 sf_political_effort_desc:0 "帝国の政治的基盤を強化する。政治力を獲得する。"
 sf_collectivist_ethos:0 "集団主義の倫理"
 sf_collectivist_ethos_desc:0 "個より集団を重んじる思想を採用する。"
 sf_nationalism_focus:0 "国家主義"
 sf_nationalism_focus_desc:0 "国家のために全てを捧げる精神を養う。"
 sf_internationalism_focus:0 "国際主義"
 sf_internationalism_focus_desc:0 "国際連帯を重視し、世界革命を目指す。"
 sf_liberty_ethos:0 "自由主義の倫理"
 sf_liberty_ethos_desc:0 "個人の自由と民主主義を重んじる。"
 sf_militarism:0 "軍国主義"
 sf_militarism_desc:0 "軍事力を国の柱に据える。志願兵の派遣が可能になる。"
 sf_political_correctness:0 "政治的公正"
 sf_political_correctness_desc:0 "政治的正しさを重視し、政治力を獲得する。"
 sf_neutrality_focus:0 "中立主義"
 sf_neutrality_focus_desc:0 "中立を保ち、防御に徹する。"
 sf_interventionism_focus:0 "介入主義"
 sf_interventionism_focus_desc:0 "積極的に国際紛争に介入する。志願兵の派遣が可能になる。"
 sf_military_youth:0 "軍事青年団"
 sf_military_youth_desc:0 "若者を軍事教育に参加させ、支持率を高める。"
 sf_deterrence:0 "抑止力"
 sf_deterrence_desc:0 "強力な防衛力により、侵略を抑止する。"
 sf_volunteer_corps:0 "義勇軍団"
 sf_volunteer_corps_desc:0 "義勇兵制度を導入し、海外派兵を強化する。"
 sf_paramilitarism:0 "準軍事組織"
 sf_paramilitarism_desc:0 "準軍事組織を拡大し、動員能力を高める。"
 sf_indoctrination_focus:0 "教化活動"
 sf_indoctrination_focus_desc:0 "イデオロギー教育を強化し、国民の士気を高める。"
 sf_foreign_expeditions:0 "海外遠征"
 sf_foreign_expeditions_desc:0 "海外での軍事作戦能力を強化する。"
 sf_why_we_fight:0 "なぜ我々は戦うのか"
 sf_why_we_fight_desc:0 "戦う理由を国民に示す。国家の士気と結束が高まる。"
 sf_political_commissars:0 "政治将校"
 sf_political_commissars_desc:0 "政治将校を配置し、軍内の忠誠心を高める。"
 sf_ideological_fanaticism:0 "イデオロギーの狂信"
 sf_ideological_fanaticism_desc:0 "イデオロギーへの献身を極限まで高める。派閥の創設が可能になる。"
 sf_technology_sharing:0 "技術共有"
 sf_technology_sharing_desc:0 "同盟国との技術共有により、研究能力を向上させる。"
 Gtya_des:0 "政治顧問が利用可能になる"
 why_we_fight_effect:0 "国家方針「なぜ我々は戦うのか」の効果が適用される"
 kamikaze_focus_tooltip:0 "特攻出撃が可能になる"
 # ==================== Industry Tree ====================
 HRE_plan_four_years:0 "四カ年計画"
 HRE_plan_four_years_desc:0 "帝国の産業振興のため、四年計画を策定する。まずは工業技術の基盤から。"
 HRE_invest_our_country:0 "国内投資"
 HRE_invest_our_country_desc:0 "自国の産業に投資し、自立した経済を構築する。自給自足こそ帝国の道だ。"
 HRE_invest_foreign_country:0 "対外投資"
 HRE_invest_foreign_country_desc:0 "外国の技術と資本を導入し、産業を発展させる。グローバル化も悪くない。"
 HRE_invest_to_infra_1:0 "インフラ投資 I"
 HRE_invest_to_infra_1_desc:0 "道路と鉄道を整備し、物流の基盤を固める。列車と輸送船も手配する。"
 HRE_invest_to_infra_2:0 "インフラ投資 II"
 HRE_invest_to_infra_2_desc:0 "インフラをさらに拡張する。トラックとコンボイも追加配備する。"
 HRE_invest_to_infra_3:0 "インフラ投資 III"
 HRE_invest_to_infra_3_desc:0 "インフラ網を完成させ、補給体系を最適化する。"
 HRE_invest_to_minju_1:0 "民需工場投資 I"
 HRE_invest_to_minju_1_desc:0 "民需工場の建設を推進する。国内投資なら国内に、対外投資なら海外に建設される。"
