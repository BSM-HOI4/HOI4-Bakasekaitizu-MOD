l_japanese:
 # ==================== Army Tree ====================
 HRE_prepare_army:0 "軍備の準備"
 HRE_prepare_army_desc:0 "神聖ローマ帝国の軍事力を再び立ち上げる。まずは指揮官を見つけなければ。"
 HRE_focus_to_army:0 "陸軍重視"
 HRE_focus_to_army_desc:0 "空軍？知らん。陸軍こそが帝国の誇りだ。"
 HRE_focus_to_air:0 "空軍重視"
 HRE_focus_to_air_desc:0 "陸軍？古い。空を制する者が戦争を制するのだ。"
 HRE_superior_spirit:0 "精神の優越"
 HRE_superior_spirit_desc:0 "数でも技術でもない。士気があれば勝てる……たぶん。"
 HRE_superior_mass:0 "量の優越"
 HRE_superior_mass_desc:0 "質より量。安くて多い方が強いに決まっている。"
 HRE_superior_tech:0 "技術の優越"
 HRE_superior_tech_desc:0 "質こそ正義。最先端技術で敵を圧倒する。"
 HRE_decided_army_policy:0 "軍事方針の決定"
 HRE_decided_army_policy_desc:0 "方針は決まった。後は実行するだけだ。"
 HRE_focus_to_doctrine_1:0 "教義研究 I"
 HRE_focus_to_doctrine_1_desc:0 "どう戦うかを決める。教義は軍の骨組みだ。"
 HRE_focus_to_doctrine_2:0 "教義研究 II"
 HRE_focus_to_doctrine_2_desc:0 "教義の深化を図る。将軍たちもようやく考えがまとまってきた。"
 HRE_focus_to_infantry_equipment_or_fighter_1:0 "装備開発 I"
 HRE_focus_to_infantry_equipment_or_fighter_1_desc:0 "陸軍なら小火器、空軍なら戦闘機。どちらに進む？"
 HRE_focus_to_infantry_equipment_or_fighter_2:0 "装備開発 II"
 HRE_focus_to_infantry_equipment_or_fighter_2_desc:0 "第一段階の成果をさらに発展させる。"
 HRE_focus_to_artillery_or_cas_1:0 "火力支援開発 I"
 HRE_focus_to_artillery_or_cas_1_desc:0 "陸軍なら砲兵、空軍なら近接航空支援。前線を支える火力を整える。"
 HRE_focus_to_artillery_or_cas_2:0 "火力支援開発 II"
 HRE_focus_to_artillery_or_cas_2_desc:0 "火力をさらに強化する。敵に容赦しないのが帝国流だ。"
 HRE_focus_to_support_or_bomber_1:0 "支援技術開発 I"
 HRE_focus_to_support_or_bomber_1_desc:0 "陸軍なら支援兵器、空軍なら爆撃機。戦場の要を固める。"
 HRE_focus_to_support_or_bomber_2:0 "支援技術開発 II"
 HRE_focus_to_support_or_bomber_2_desc:0 "支援体制の完成度を高め、戦場での優位を確固たるものにする。"
 HRE_focus_to_tank_or_jet_1:0 "機甲・ジェット開発 I"
 HRE_focus_to_tank_or_jet_1_desc:0 "陸軍なら戦車、空軍ならジェット技術。新時代の兵器に挑む。"
 HRE_focus_to_tank_or_jet_2:0 "機甲・ジェット開発 II"
 HRE_focus_to_tank_or_jet_2_desc:0 "最先端の機甲・ジェット技術をさらに磨き上げる。"
 HRE_focus_to_nuke:0 "究極の兵器"
 HRE_focus_to_nuke_desc:0 "全てはここに集約される。神聖ローマ帝国の究極兵器が完成する。"
