# =====================================

democratic_awakening:0 "民主的覚醒"
democratic_awakening_desc:0 "民主主義の理念が国民の間に浸透し、政治参加への意欲が高まっている。"

liberal_democracy_idea:0 "自由民主主義体制"
liberal_democracy_idea_desc:0 "個人の自由と市場経済を重視する政治システムが確立されている。"

social_democracy_idea:0 "社会民主主義体制"
social_democracy_idea_desc:0 "社会正義と民主的手続きを両立させる政治システムが機能している。"

collectivist_awakening:0 "集産主義的覚醒"
collectivist_awakening_desc:0 "集団の利益を個人より優先する思想が広く受け入れられている。"

revolutionary_vanguard_idea:0 "革命前衛党"
revolutionary_vanguard_idea_desc:0 "労働者階級の解放を目指す革命政党が政治を主導している。"

nationalist_movement_idea:0 "民族主義運動"
nationalist_movement_idea_desc:0 "民族の誇りと国家の栄光を重視する政治運動が展開されている。"

alternative_governance_idea:0 "代替統治システム"
alternative_governance_idea_desc:0 "従来の政治体制を超えた新しい統治形態が模索されている。"

civic_republicanism_idea:0 "市民共和主義"
civic_republicanism_idea_desc:0 "市民の積極的参加による共和政治が実践されている。"

conservative_reforms_idea:0 "保守的改革"
conservative_reforms_idea_desc:0 "伝統を重んじながら必要な改革を進める政治方針が採用されている。"

constitutional_crown_idea:0 "立憲君主制"
constitutional_crown_idea_desc:0 "君主の権威と議会制民主主義が調和した政治体制が確立されている。"

direct_participation_idea:0 "直接参加制度"
direct_participation_idea_desc:0 "市民が政治決定に直接参加する制度が整備されている。"

transcendent_awakening:0 "超越的覚醒"
transcendent_awakening_desc:0 "従来の政治的枠組みを超えた新しい思想が芽生えている。"

futurist_revolution_idea:0 "未来主義革命"
futurist_revolution_idea_desc:0 "科学技術と合理性に基づく未来社会の建設が進められている。"

intellectual_enlightenment_idea:0 "知性の啓蒙"
intellectual_enlightenment_idea_desc:0 "知識と理性を重視する政治文化が根付いている。"

mythological_revival_idea:0 "神話的復活"
mythological_revival_idea_desc:0 "古代の叡智と神聖な力が現代政治に蘇っている。"

technocratic_state_idea:0 "技術官僚体制"
technocratic_state_idea_desc:0 "専門知識を持つエリートによる効率的な統治が行われている。"

philanthropic_society_idea:0 "博愛主義社会"
philanthropic_society_idea_desc:0 "愛と平和、協調を基盤とする社会システムが確立されている。"

embrace_ruination_idea:0 "廃墟の受容"
embrace_ruination_idea_desc:0 "既存の文明を破壊し、原始状態への回帰を目指している。"

anarchist_commune_idea:0 "無政府主義コミューン"
anarchist_commune_idea_desc:0 "あらゆる権力構造を拒絶し、完全な自由を追求している。"

longitudinal_philosophy_idea:0 "縦断哲学"
longitudinal_philosophy_idea_desc:0 "縦の方向性を重視する独特な哲学的立場を採用している。"

horizontal_philosophy_idea:0 "横断哲学"
horizontal_philosophy_idea_desc:0 "横の方向性を重視する独特な哲学的立場を採用している。"

embrace_absurdity_idea:0 "不条理の受容"
embrace_absurdity_idea_desc:0 "論理や理性を拒絶し、完全なる混沌を受け入れている。"

international_cooperation_idea:0 "国際協力体制"
international_cooperation_idea_desc:0 "他国との建設的な協力関係が確立されている。"

trade_expansion_idea:0 "貿易拡大政策"
trade_expansion_idea_desc:0 "国際貿易の拡大を通じて経済成長を促進している。"


