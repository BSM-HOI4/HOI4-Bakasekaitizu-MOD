Unified_Currency:0 "[?ROOT.Unified_Currency|0]"
Unified_Currency_desc_2:0 "統一通貨は、国民の生産および消費活動や貿易を通じて獲得できる。\nまた探検隊の派遣や未知の解明をはじめとした政府の様々な用途に使用することができる。§H政府与党§!や§H政治顧問§!、§H宗教§!などによっても獲得量は変動する。[Root.GetMercenaryMaintenanceInfo]"
Unified_Currency_topbar_tooltip:0 "統一通貨\n--------------------\n現在の統一通貨: §Y[?ROOT.Unified_Currency|0]§!\n先月の収支: [?ROOT.Unified_Currency_Last_Month_gain|0+]\n最低保持UC量: §Y[?ROOT.ucs_required_ec|0]§!（不足: [?ROOT.ucs_ec_deficit|0R]）\nステート拡大限界: §Y[?ROOT.ucs_state_limit|0]§!（超過: [?ROOT.ucs_state_overage|0R]）\n--------------------\n統一通貨獲得補正: [?modifier@Unified_Currency_gain_factor|0%+][Unified_Currency_desc_war_effort][Unified_Currency_desc_religion]\n--------------------\n合計:[?ROOT.combined_uc_factor|0%+][Root.GetMercenaryMaintenanceInfo]"
Unified_Currency_topbar_desc:0 "統一通貨は、国民の生産および消費活動や貿易を通じて獲得できる。\nまた探検隊の派遣や未知の解明をはじめとした政府の様々な用途に使用することができる。§H政府与党§!や§H政治顧問§!、§H宗教§!などによっても獲得量は変動する。"
Unified_Currency_desc_title:0 "我が政府が様々な用途に使用することができる統一通貨の保有量。\n------------------------------------\n現在の統一通貨: §Y[?ROOT.Unified_Currency|0]§!\n先月の収支: [?ROOT.Unified_Currency_Last_Month_gain|0+]\n最低保持UC量: §Y[?ROOT.ucs_required_ec|0]§!（不足: [?ROOT.ucs_ec_deficit|0R]）\nステート拡大限界: §Y[?ROOT.ucs_state_limit|0]§!（超過: [?ROOT.ucs_state_overage|0R]）\n------------------------------------\n統一通貨獲得補正: [?modifier@Unified_Currency_gain_factor|0%+][Unified_Currency_desc_war_effort][Unified_Currency_desc_religion]\n------------------------------------\n合計:[?ROOT.combined_uc_factor|0%+][Root.GetMercenaryMaintenanceInfo]"
