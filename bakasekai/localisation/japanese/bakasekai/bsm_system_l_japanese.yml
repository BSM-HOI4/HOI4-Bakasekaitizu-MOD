CULTURAL_DEGREES_desc_test_2:0 "[CULTURAL_DEGREES_desc_test]"
CULTURAL_DEGREES_desc:0 "国民が、§Hバカであればあるほど§!低くなる。また、§H宗教§!や§H国民精神§!によっても変動する。§H政治顧問§!で調整することもできる。\n\n現在の文明化率: §Y[?ROOT.Cultural_Degree|0%]§!\n先週の増減: [?ROOT.Cultural_Degree_Last_Week_gain|0%+]\n週ごとの文明化率上昇: [?modifier@weekly_Cultural_Degree|0%+]\n文明化率のベース: [?modifier@base_Cultural_Degree|0%+]\n宗教文明化率補正: [?modifier@Cultural_Degree_religion_factor|0%+]\n\n民度が低いと研究速度が低下するなどの悪い影響がある。\n\n現在の文明化率からの補正:\n研究速度:[?Cultural_Degree|0%]\n政治力獲得補正:[?Cultural_Degree|0%]\n安定度補正:[?Cultural_Degree|0%]"
