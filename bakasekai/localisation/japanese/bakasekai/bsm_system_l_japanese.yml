l_japanese:
USA_GENERIC_GATHERING_STORM_DESC: "かつて世界最強を誇った超大国アメリカは、今や複数の企業系国家に分裂している。カリフォルニア、テキサス、ニューヨークヤンキースなど、各地域はそれぞれ独自の特色を持つ企業や組織によって統治されている。豊富な資源と技術力は健在だが、内部での競争も激しい。分裂した大陸に、再び統一の時は訪れるのだろうか？"
COUNTRY_PO:0 "[?ROOT.National_Unity_Power|0]"
popular_opinion_title:0 "国家統合力"
popular_opinion_tooltip:0 "国家統合力\n--------------------\n現在の国家統合力: §Y[?ROOT.National_Unity_Power|0]§!\n先週の増減: [?ROOT.National_Unity_Power_Last_Week_gain|0+]\n国家統合力獲得補正: [?modifier@National_Unity_Power_gain_factor|0%+]\n戦時統合力補正: [?modifier@National_Unity_Power_war_factor|0%+]\n宗教統合力補正: [?modifier@National_Unity_Power_religion_factor|0%+]"
popular_opinion_desc:0 "国民が、§Hバカであればあるほど§!多く獲得できる。また、§H宗教§!や§H国民精神§!によっても獲得できる。\n特定の§H国家方針§!で追加の統合力を獲得し、§H政治顧問§!で獲得量を増加させることもできる。\n\n国家統合力は伝統の取得やアノマリーの研究に使用される。"

