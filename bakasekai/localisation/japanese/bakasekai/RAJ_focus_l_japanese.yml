 RAJ_a_loyal_government: "忠実な政府"
 RAJ_a_loyal_government_desc: "[RAJ.GetNameDef]では反体制派が独立を熱望しているにもかかわらず、我々の政府は依然として強固で安定している。引き続き規律と決意をもって王室の利益を守り続けるつもりだ。"
 RAJ_high_import_duties: "高い輸入関税"
 RAJ_high_import_duties_desc: "我々は地元産業を保護し、[RAJ.GetNameDef]の経済生産を維持することを目的に、新たな政策を成立させた。外国製品にかかる輸入関税を上げることによって、[RAJ.GetNameDef]が世界の経済圏で自立することを目指している。"
 RAJ_the_zamindari_system: "ザーミンダーリー制度"
 RAJ_the_zamindari_system_desc: "ザーミンダーリー制度を拡大することにより、国内の農村地域の秩序を維持する忠実な地主に権限を与え、行政の効率化を実現した。"
 RAJ_exports_for_the_empire: "インドから帝国への輸出"
 RAJ_exports_for_the_empire_desc: "植民地貿易は何世紀にもわたって[ENG.GetAdjective]帝国の柱となっており、[RAJ.GetNameDef]からの輸出も例外ではない。茶、綿、ジュートのような主要な作物の栽培を優先することによって、我々と帝国の安定した収入を確保している。"
 RAJ_war_industry: "軍需産業"
 RAJ_war_industry_dec: "確固たる決意と絶え間ない意思の力で、軍需産業への資金を積み増すことにより、戦争努力を支えなければならない。我々の市民は勇気と汗と鉄によって勝利を築き上げるだろう。"
 RAJ_indian_gentlemen_officers_goe: "$RAJ_indian_gentlemen_officers$"
 RAJ_indian_gentlemen_officers_goe_desc: "$RAJ_indian_gentlemen_officers_desc$"
 RAJ_south_east_asia_command_dm: "$RAJ_south_east_asia_command$"
 RAJ_south_east_asia_command_dm_desc: "東南アジア司令部を設立することによって、我々の軍事的影響力を地域全体に拡大することができた。このことは、大陸での軍事キャンペーンを計画する上で間違いなく役に立つだろう。"
