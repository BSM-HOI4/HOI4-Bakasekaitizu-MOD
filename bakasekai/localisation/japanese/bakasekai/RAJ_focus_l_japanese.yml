 RAJ_eic_party_long: "株式会社東インド会社"
 RAJ_eic_party: "EIC"
 RAJ_naval_tech_sharing_group_name: "東インド・ロンドン海軍技術交流"
 RAJ_naval_tech_sharing_group_desc: "東インド会社とロンドンの海軍技術交流。1企業にこれほどの権限を与えるのは賢明ではないとささやく外交官もいるが、彼らに何がわかるというのだろう？"
 RAJ_provincial_elections: "地方選挙"
 RAJ_provincial_elections_desc: "新しいインド法は地方選挙を義務づけ、インド民衆に責任を負う地方政府の設立を制定することとなる。これが英国の支配にどのような効果を与えるか注視しよう。"
 RAJ_swaraj: "スワラージ"
 RAJ_swaraj_desc: "ガンジーの概念「自己の支配」すなわちスワラージはインド全体で人気を博している。それは英国の法令と習慣からの完全な遮断を提唱しており、スワラージ派集団はインドの学校で関心を喚起している。"
 RAJ_indian_national_congress: "インド国民会議"
 RAJ_indian_national_congress_desc: "インド国民会議（Indian National Congress）は、亜大陸にまたがる選挙において非常な成功を収めている。彼らは独立インドのための強い声であり、少なくとも帝国内において大きな自治団体の一つである。"
 RAJ_quit_india_movement: "インドから去れ運動"
 RAJ_quit_india_movement_desc: "ガンジーのインド独立運動は、英国がインドから去るように求める要請で頂点に達した。大戦が終わる前に英国による統治が終結するとは考えられないが、この地は日に日に緊張を増している。"
 RAJ_all_india_forward_bloc: "全インド前進同盟"
 RAJ_all_india_forward_bloc_desc: "全インド前進同盟（All India Forward Bloc）はイギリスからのインド解放に時間がかかりすぎていると考えている。より強い、武力行使も辞さない姿勢で臨まなければならない。"
 RAJ_seek_help_from_soviet: "ソビエトに助けを乞う"
 RAJ_seek_help_from_soviet_promised: " ソビエト連邦が彼らへの援助を誓った"
 RAJ_seek_help_from_soviet_desc: "ソビエト連邦は、大英帝国との自然平衡状態を保っている。彼らは自らが革命機関であり、革命をインドに輸出するよう支援すべきだと主張している。"
 RAJ_indian_peoples_army: "インド人民軍"
 RAJ_indian_peoples_army_effect: "共産主義の支持者たちが自由を求めて内戦を開始する。その規模は党支持率と自治度による。"
 RAJ_indian_peoples_army_support: "[SOV.GetNameDefCap]が主張を支持する。"
 RAJ_indian_peoples_army_desc: "我々は、共産主義から学んだ軍隊を組織し、共産主義者と同盟すべきである。"
 RAJ_research_city_excursions: "研究都市遊学"
 RAJ_research_city_excursions_desc: "ソ連の研究都市は驚嘆すべきであり、インドの民衆はエネルギッシュで聡明な知性に満ちている。これらの都市に若手技術者を遊学させることは、国内の研究産業基盤を発展させるのに役立つだろう。"
 RAJ_combined_arms_academy: "諸兵科連合学校"
 RAJ_combined_arms_academy_desc: "ソビエト軍の訓練は、新しい諸兵科連合学校を通じてより効率的に行うことができる。陸海空の力を使った現代戦について最新の知見を得ることができる。"
 RAJ_rani_of_jhans: "ジャーンシーのラニ"
 RAJ_rani_of_jhans_desc: "ジャーンシーのラニ（Rani of Jhans、訳注：ラクシュミー・バーイー）は1857年のインド革命の偉大な英雄であった。勇気と国家の誇りを体現する彼女の前例は、武器をとり自らの連隊を形成したいすべてのインド女性のモデルとなる。"
 RAJ_rebuilding_the_nation: "国家再建"
 RAJ_rebuilding_the_nation_desc: "インドの民衆が結集され、圧制者どもが駆逐されたことで、2世紀にわたる占領の損害を回復する時が来たのだ。"
 RAJ_seek_help_from_germany: "ドイツに助けを乞う"
 RAJ_seek_help_from_germany_promised: " ドイツが彼らへの援助を誓った"
 RAJ_seek_help_from_germany_desc: "ドイツは英国がそうしたようにインドを害したことは一度もなく、ライヒは英国に対する最も現実的な対抗勢力である。我々は枢軸国にもっと接近すべきだろう。"
 RAJ_indian_national_army: "インド国民軍"
 RAJ_indian_national_army_effect: "ファシズムの支持者たちが自由を求めて内戦を開始する。その規模は党支持率と自治度による。"
 RAJ_indian_national_army_support: "[GER.GetNameDefCap]が主張を支持する。"
 RAJ_indian_national_army_desc: "英国の支配下にある軍隊とは別のインド国軍が組織されている。我々は英国の影響を受けない地域でそれを作り上げ、連合国に対峙させ、人的資源をイギリス領インドから奪い取ることができる。"
 RAJ_battaglione_azad_hindoustan: "自由インド大隊"
 RAJ_battaglione_azad_hindoustan_desc: "イタリアは、インド人捕虜からなる連隊である自由インド大隊（Battaglione Azad Hindoustan）を結成した。破壊活動、空挺効果、浸透戦術の訓練を受けた自由インド大隊は、国家の誇りのための大きな一歩となるだろう。"
 RAJ_german_technology: "[Root.GetGermanTechnologyName]"
 RAJ_german_technology_german: "ドイツの技術"
 RAJ_german_technology_japan: "日本の技術"
 RAJ_german_technology_desc: "ドイツの科学者は世界一であり、最高の現代的工学技術を基準にその軍事機構は作られておるのだ。彼らはその技術進歩を我々と共有しようとしてくれている。"
 RAJ_japanese_army_air_force_academy: "[Root.GetJAAFAName]"
 RAJ_japanese_army_air_force_academy_german: "ドイツ空軍飛行訓練学校"
 RAJ_japanese_army_air_force_academy_japan: "日本陸軍飛行学校"
 RAJ_japanese_army_air_force_academy_desc: "日本陸軍飛行学校はアジアにおいてヨーロッパによる支配と戦うことを希求する新兵を受け入れることを決定した。"
 RAJ_cripps_mission: "クリップス使節団"
 RAJ_cripps_mission_desc: "独立への民族主義者の熱狂を差し置いて、インドを連合国及びイギリス勢力側に忠実な国家として保つ必要がある。スタッフォード・クリップス卿は熟練した交渉者であり、民族主義団体の指導者たちに彼らの要求が将来的に対処されると納得させることができる。"
 RAJ_two_nation_theory: "二民族論"
 RAJ_two_nation_theory_effect: "インドが自由を得ると、同時にパキスタンは解放されるだろう。\n"
 RAJ_two_nation_theory_desc: "インドは長い間単一の領土であったが、インドをヒンドゥー教徒とイスラム教徒の2つの国と見なすのは理にかなっている。国家の分割は唯一の答えではないかもしれないが、インド独立にとってのいかなる取引も、この亜大陸の二面性に直面しなければならない。"
 RAJ_princely_state_donations: "藩王国からの寄付"
 RAJ_princely_state_donations_desc: "インドの藩王諸国は長い間英国の下でインド陸軍の中核を為す兵士を提供し続けてきた。これらの土侯たちのさらなる寄付は彼らの帝国への支援を明瞭に示す。"
 RAJ_imperial_service_troops: "帝国戦務部隊"
 RAJ_imperial_service_troops_desc: "帝国戦務部隊（Imperial Service Troops）は諸藩王が募兵し、その兵員数は数十万にも達する。困難な今の時代においても、陛下が諸王の忠誠を頼りとすることができることを知るのは素晴らしいことだ。"
 RAJ_raf_funding: "王立空軍の創設"
 RAJ_raf_funding_desc: "インド王立空軍（Royal Air Force of India）はイギリスからより多く資金と資産を受け取る予定である。"
 RAJ_navy_funding: "海軍の創設"
 RAJ_navy_funding_effect: "技術を開発済みであれば、§Y軽巡洋艦2隻§!が海軍に加わる。\n"
 RAJ_navy_funding_effect_mtg: "同型の§Y軽巡洋艦2隻§!が海軍に加わる。\n"
 RAJ_navy_funding_desc: "インド王立海軍はイギリスからより多く資金と資産を受け取る予定である。"
 RAJ_british_army_support: "イギリス陸軍による支援"
 RAJ_british_army_support_desc: "イギリス陸軍は200年にわたる駐留によってインドを熟知している。彼らは住民と国土に精通しているし、またインド兵がその母国において戦うための訓練を支援することができるだろう。"
 RAJ_red_eagle_division: "赤鷲師団"
 RAJ_create_unit_red_eagles_tt: "デリーにおいて精鋭歩兵師団を獲得する。\n"
 RAJ_red_eagle_division_desc: "赤鷲師団（Red Eagle Division）は海外で戦うために訓練され、過酷な状況における戦闘への備えが為されてるインドの最初の師団となるだろう。"
 RAJ_chindits: "チンディット"
 RAJ_orde_wingate_tt: "§Yスキル4の将軍§!、§Yオード・ウィンゲート§!が登場する。\n"
 RAJ_chindits_desc: "インドは特殊部隊を必要としているため、アジアの密林において敵前線の背後で作戦行動をするための師団、チンディット（Chindits）を創設した。これは危険な作戦であり、高い犠牲率を有するが、戦争の努力には非常に役立つ可能性がある。"
 RAJ_jungle_training: "密林訓練"
 RAJ_jungle_training_effect: "§H密林訓練§!を有効化\n§H海兵隊\n    密林§!\n      攻撃: §G+5%§!\n      移動: §G+10%§!\n§H山岳兵\n    密林§!\n      攻撃: §G+5%§!\n      移動: §G+10%§!\n§H空挺兵\n    密林§!\n      攻撃: §G+5%§!\n      移動: §G+10%§!\n"
 RAJ_jungle_training_desc: "インド、ビルマ、インドシナは密林で覆われており、この危険な地形で効果的に兵士を活動させるために特別な訓練が推奨されている。"
 RAJ_lessons_of_the_great_war: "先の大戦の教訓"
 RAJ_lessons_of_the_great_war_desc: "インド植民地軍の兵士たちは先の大戦に参加した。この戦争の教訓こそが、軍の訓練及び組織機構を支えるべきである。"
 RAJ_indianisation_of_army: "陸軍のインド化"
 RAJ_indianisation_of_army_desc: "総力戦においてインドを適切に保護するためには、インドの全人口が動員されなければならない。これは、インド国民をより広く徴募するだけでなく、インド人将校が指揮官として指揮命令系統に組み込まれることを意味する。"
 RAJ_indian_gurkhas: "インドのグルカ兵"
 RAJ_indian_gurkhas_desc: "パンジャーブとネパール高地のグルカ兵（Gurkhas）は伝説的なまでの軍事能力がある。彼らは何年も忠実に藩王に仕えてきており、あらゆる種類の戦闘を得意としている。"
 RAJ_an_indian_sandhurst: "インド・サンドハースト士官学校"
 RAJ_an_indian_sandhurst_desc: "インドは先の大戦以来独自の陸軍士官学校を要求してきた、そして、遂に我々は1932年に設立した。インド陸軍士官学校はこの数年間インド人将校を輩出し、我々の中核となる将校団を供給している。"
 RAJ_lions_of_the_great_war: "大戦の獅子"
 RAJ_lions_of_the_great_war_desc: "シーク教徒は強き軍の伝統を有し、先の大戦で大いに叙勲された。パンジャーブの獅子は自分達だけで強き軍隊を形成し、さらに当地域では更なる徴兵の準備が整っている。"
 RAJ_indian_gentlemen_officers: "インド人紳士の将校"
 RAJ_indian_gentlemen_officers_desc: "帝国の諸機関との緊密な協力を通して英国による統治に従事してきた紳士たちは司令官の出来合いの補充源であり、忠実な者たちには新たなインド陸軍を率いてもらわねばならない。"
 RAJ_the_bangalore_torpedo: "バンガロール爆薬筒"
 RAJ_the_bangalore_torpedo_desc: "英領インドの最大の戦術貢献の一つがバンガロール爆薬筒（Bangalore Torpedo）、工兵が砲火を浴びつつも、障害物の破壊に使える連結されたパイプである。この兵器は世界中で大きな人気を得ている。"
 RAJ_vickers_berthier_gun: "ヴィッカーズ・ベルチェー銃"
 RAJ_vickers_berthier_gun_desc: "ヴィッカーズ・ベルチェー（Vickers-Berthier）銃は少し扱いにくいが急速に生産するのが容易である点が長所である。インドのような国家にとっては、この銃の特徴は非常に重要である。"
 RAJ_royal_indian_artillery: "王立[ROOT.GetAdjective]砲兵"
 RAJ_royal_indian_artillery_desc: "王立インド砲兵（Royal Indian Artillery）は東インド会社が野戦砲とインド人の砲手を以て大隊を編成したとき以来から存在し続けている。我々はこの何十年もの経験を活用することができる。"
 RAJ_army_motorization: "陸軍の自動車化"
 RAJ_army_motorization_desc: "インドは鉄道と馬匹を以て有効に防衛するには広すぎる。陸軍は自動車化師団と正規の自動車輸送隊を保有しなくてはならない。"
 RAJ_revive_the_screw_guns: "スクリュー・ガンの復活"
 RAJ_revive_the_screw_guns_desc: "インド北部の山岳地帯は、分解でき、必要な所ならどこにでもラバの背で運搬できる砲の開発をもたらした。この7ポンド砲は少し時代遅れかもしれないが、我々はその有用性を無視するべきでない。"
 RAJ_indian_armor: "インド機甲部隊"
 RAJ_indian_armor_desc: "インドは独自の機甲師団の発達に注力しなくてはならない。"
 RAJ_modernizing_army: "陸軍の近代化"
 RAJ_modernizing_army_desc: "あまりにも長期間、インド軍は植民地の前哨基地程度と見なされており、わずかな貢献とイギリス本国軍が利用する装備を提供するだけであった。インド帝国が保持する軍備を近代化する時が来た。"
 RAJ_indian_defense_research: "インド防衛研究"
 RAJ_indian_defense_research_desc: "今やインドは完全な主権国家であり、もはや以前のように先進的な試作型や設計図を受け取る立場ではない。我々は常に、敵より先進的であり、遅れを取らぬようにしなければならない。"
 RAJ_british_pilot_training: "イギリスによるパイロットの訓練"
 RAJ_british_pilot_training_desc: "イギリス空軍は訓練を引き受けるためにインド人パイロットを受け入れることに合意した。この教育は我らが航空隊の発展において大きな助けになるだろう。"
 RAJ_expand_air_bases: "航空基地の拡張"
 RAJ_expand_air_bases_desc: "インドは広大だ。従って、その領空を巡回し防護することは、亜大陸の各地に航空基地を増加させなければならないことを意味する。"
 RAJ_air_support_effort: "航空支援への注力"
 RAJ_air_support_effort_desc: "諸兵科連合戦闘は戦争の新しい手法である。従って、陸軍と海軍を支援する為のパイロットの訓練と航空機生産に注力する必要がある。"
 RAJ_fighter_effort: "戦闘機への注力"
 RAJ_fighter_effort_desc: "爆撃機を護衛し、また我が国を脅かす敵航空機を迎撃する為に、戦闘機が必要である。"
 RAJ_royal_indian_air_force: "王立インド空軍"
 RAJ_royal_indian_air_force_desc: "我々の小さな航空師団を独立した軍事部門へと拡大する時が来た。独立司令部を持つ空軍はインド国民と帝国にさらに貢献するだろう。"
 RAJ_the_smiling_buddha: "微笑むブッダ"
 RAJ_the_smiling_buddha_desc: "科学者たちは原子力エネルギーの秘密を解き明かしつつあり、これは非常に強力な爆薬の創造につながるだろう。我々は、原子力兵器の探求に遅れをとることはできない。"
 RAJ_great_indian_peninsula_railway: "大インド半島鉄道"
 RAJ_great_indian_peninsula_railway_desc: "1925年の大インド半島鉄道（Great Indian Peninsula Railway）の政府支配は、その拡大と改善が我々にも及ぶことを意味する。人口の増加には交通インフラの改善が必要だ。"
 RAJ_industrial_expansion: "産業の拡大"
 RAJ_industrial_expansion_desc: "何億人もの人々が、インドを家とみなしている。この民衆が、巨大産業の基盤となってはならない理由などないだろう。"
 RAJ_tata_steel: "タタ鋼鉄"
 RAJ_tata_steel_desc: "タタ鋼鉄（Tata Steel）は、帝国最大の鉄鋼メーカーになるための道を歩んでいる。より一層の増産は、インドの近代化を大いにたきつけることとなるだろう。"
 RAJ_assam_oil: "アッサム石油"
 RAJ_assam_oil_desc: "アッサムはインドの石油生産の中心地である。とりわけディボイ精油所は。この資源利用を拡大して開発する必要がある。"
 RAJ_indian_institute_of_science: "インド理科大学院"
 RAJ_indian_institute_of_science_desc: "バンガロールのインド理科大学院（Indian Institute of Science）キャンパスでは、インド国民の中でも最高で輝かしい頭脳が、我々の進歩をさらに押し進めることを可能にしている。"
 RAJ_institute_of_fundamental_research: "基礎研究所"
 RAJ_institute_of_fundamental_research_desc: "我が国をリードする科学者たちや産業界の幾人かは、物理学における最新の発見を優位に活用するために、新しい基礎研究所（Institute of Fundamental Research）設立の擁護者となっている。"
 RAJ_research_collaboration: "共同研究"
 RAJ_research_collaboration_desc: "英国人は、親密な同盟国間で科学的進歩を共有することによる利益を教示してくれた。我が陣営の皆がそのために歩調を合わせることで、戦時研究開発をより効率的に行うことができるだろう。"
 RAJ_expand_mazagon_dock: "マザゴン・ドックの拡張"
 RAJ_expand_mazagon_dock_desc: "ムンバイのマザゴン・ドック（Mazagon Dock）は西海岸における最も重要な造船所である。この世界的な危機に際してはより大きな能力が必要になる。"
 RAJ_found_scindia_shipyard: "シンディア造船所の設立"
 RAJ_found_scindia_shipyard_desc: "我が国には東海岸の造船所が必要だ。ヴィシャカパトナムでのシンディア造船所（Scindia Shipyard）の建設は、我らが海軍の未来のために理にかなっている。"
 RAJ_royal_indian_navy: "王立[ROOT.GetAdjective]海軍"
 RAJ_royal_indian_navy_desc: "王立[ROOT.GetAdjective]海軍は急速に拡大する必要がある。新戦術と新規艦船が優先されるべきだ。"
 RAJ_screening_effort: "直衛艦への注力"
 RAJ_screening_effort_desc: "インドは、スエズ運河への南ルートを守る上で重要な役割を果たしている。海上警備や護衛任務は、重要な物資や兵士がヨーロッパおよびアフリカ戦域にたどり着く助けになっている。"
 RAJ_cruiser_effort: "巡洋艦への注力"
 RAJ_cruiser_effort_desc: "[ROOT.GetAdjective]の海軍力の発展と拡大には、今はまだ巡洋艦で十分足りるであろう。"
 RAJ_submarine_effort: "潜水艦への注力"
 RAJ_submarine_effort_desc: "アジアにおける日本の海軍力の向上に対しては、潜水艦の開発に力を注ぎ、海中からの一撃を加えるのも一つの方法であろう。"
 RAJ_capital_ship_effort: "主力艦への注力"
 RAJ_capital_ship_effort_desc: "英国の前哨基地として、インドは海を支配する主力艦の力を見せつけられてきた。我々は自らの重巡洋艦と戦艦を建造すべきだ。"
 RAJ_modernizing_navy: "海軍の近代化"
 RAJ_modernizing_navy_desc: "より良い機関、より多くの乗組員居住空間、より速い速度とより大きな砲。インド海軍はすぐさま大陸最高峰に位置にするようになるだろう。"
 RAJ_east_india_railways: "東インド鉄道"
 RAJ_east_india_railways_desc: "政府が東インド鉄道（East India Railway）をコントロールすることは、その拡大と改善のためのすべてを我々の閣僚の手で決定できるということだ。"
 RAJ_integrate_princely_railways: "藩王国鉄道の統合"
 RAJ_integrate_princely_railways_desc: "インドの藩王の中には、自らの鉄道システムの資金を調達している者もいるが、今までは藩王国が建設した鉄道線との結合が不十分だった。インドの鉄道を結びつけるために何かが行われなければならない。"
 RAJ_ishapore_arsenal: "イシャポール造兵廠"
 RAJ_ishapore_arsenal_desc: "イシャポール・アーセナル・ライフル・ファクトリー（Ishapore Arsenal and Rifle Factory）は18世紀以来操業し続けている。そこでは銃の設計における多くの革新を担っており、武器生産システムの中心的存在である。"
 RAJ_clamp_down_on_corruption: "汚職の取り締まり"
 RAJ_clamp_down_on_corruption_desc: "インドの鉄道システムを拡張しようとする英国の産業界の努力にもかかわらず、この拡張の恩恵はほとんどないように思われる。輸送部門にはインド特有の汚職と二重取引という問題があり、我々はその問題について何かをする必要がある。"
 RAJ_strengthen_ties_with_british_investors: "イギリス投資家との関係強化"
 RAJ_strengthen_ties_with_british_investors_desc: "工場と資源生産の拡大は、依然としてイギリスの資本に大きく依存している。インド自身の銀行業界が活発になるまでは、ロンドンにひざまずき援助を乞い続ける必要がある。"
 RAJ_british_rail_investors: "イギリスの鉄道投資家"
 RAJ_british_rail_investors_desc: "インドの民間工場および交通インフラには、イギリスの資本家から注入される大量の現金が必要だ。"
 RAJ_british_arms_investors: "イギリスの武器投資家"
 RAJ_british_arms_investors_desc: "もし兵器工場を迅速に操業させたければ、イギリスの銀行に軍事インフラへの投資を求める必要があるだろう。"
 RAJ_indian_sandhurst_tt: "§Yスキル4の将軍§!、§Yコーデンデラ・マダッパ・カリアッパ§!が登場する。\n§Yスキル3の将軍§!、§Yコーデンデラ・スマイヤ・ティマイヤ§!が登場する。\n§Yスキル3の将軍§!、§Yジャヤント・ナス・チャウドゥリ§!が登場する。"
 RAJ_create_unit_gurkas_tt: "デリーにおいてグルカ兵精鋭部隊を獲得する。"
 RAJ_create_unit_rani_tt: "デリーにおいて歩兵部隊を獲得する。"
 RAJ_create_unit_sikh_tt: "デリーにおいて歩兵部隊を獲得する。"
 RAJ_create_general_rani_tt: "\n§Yスキル5の将軍§!、§Yラクシュミー・サーガル§!が登場する"
 RAJ_administrative_oversight: "行政の管理"
 RAJ_administrative_oversight_desc: "産業の崩壊になんとか対処し、我々の独立を確保できたところで、そろそろ地元の行政官達を政府の傘下に置くべき時だ。難しい仕事のように思えるが、各部族長や地方の役人達はこの国の人口の大部分に対して影響力を持っている。今のような厳しい状況下で国益のことを考えたら、彼らを取り込む以外に道はない。"
 RAJ_enable_local_industrialization: "§H地方の産業化§!のディシジョンが選択できるようになり、§H農耕社会§!のスピリットの修正が可能となる。"
 RAJ_land_clearance: "土地の開墾"
 RAJ_land_clearance_desc: "地元の指導者達を通じて影響力が高まった今、国家の名の元に各地の天然資源や土地を、より有効に活用できるようになった。"
 RAJ_workforce_integration: "労働人口の統一"
 RAJ_workforce_integration_desc: "各地域や部族の長達の地元での影響力のおかげで、活用しきれずにいた人材を地方の改善計画に当てることができた。"
 RAJ_land_clearance_effect_tt: "§H$RAJ_population_decisions$§!のディシジョンを実行することで、建築スロットが§G1つ§!追加されるようになった。\n$apply_integration_effects_retroactively$"
 RAJ_integration_tooltip: "§H$RAJ_population_decisions$§!のディシジョンを実行することで、以下が追加されるようになった:"
 RAJ_integration_tooltip_post: "$apply_integration_effects_retroactively$"
 RAJ_subhas_chanda_bose: "スバス・チャンドラ・ボース"
 RAJ_bose_is_hiding_tt: "$RAJ_subhas_chanda_bose$は現在どこにも身を隠していない"
 RAJ_bhimrao_ramji_ambedkar: "ビームラーオ・ラームジー・アンベードカル"
 RAJ_karam_singh_mann: "カラム・シン・マン"
 RAJ_chakravarti_rajagopalachari: "チャクラヴァルティー・ラージャゴーパーラーチャーリー"
 RAJ_john_edward_golightly: "ジョン・エドワード・ゴライトリー"
 RAJ_george_h_douglas: "ジョージ・H・ダグラス"
 RAJ_mahatma_mohandas_gandhi: "マハトマ・モーハンダース・ガンジー"
 RAJ_john_mathai: "ジョン・マタイ"
 RAJ_sir_mohammed_iqbal: "ムハンマド・イクバール卿"
 RAJ_agha_khan_iii: "アーガー・ハーン3世"
 RAJ_rajendra_prasad: "ラージェンドラ・プラサード"
 RAJ_anyang_bhula: "アニャン・ブラ"
 RAJ_bahadur_jayla_of_khoch_bahur: "バハドゥール・ジャイラ・オブ・コッホ・バフール"
 RAJ_ram_singh_thakur: "ラム・シン・タクーリ"
 RAJ_arjan_singh_vibhusan: "アルジャン・シン"
 RAJ_aspy_merwan_engineer: "アスピィ・メルワン・エンジニア"
 RAJ_mehar_singh: "メハル・シン"
 RAJ_w_h_gould_bradford: "W・H・グールド＝ブラッドフォード"
 RAJ_arthur_a_barrett: "アーサー・A・バレット"
 RAJ_archibald_wavell: "アーチボルド・ウェーベル"
 RAJ_sir_frank_messervy: "フランク・メッサヴィー卿"
 RAJ_reginald_savory: "レジナルド・セイヴォリー"
 RAJ_kodandera_cariappa: "コダンデラ・カリアッパ"
 RAJ_mohan_singh: "モーハン・シン"
 RAJ_bruce_w_mcpherson: "ブルース・W・マクファーソン"
 RAJ_subroto_mukherjee: "スブロト・ムケルジー"
 RAJ_ravindra_darshan_singh: "ラビンドラ・ダルシャン・シン"
 RAJ_louis_mountbatten: "ルイス・マウントバッテン"
 RAJ_william_e_parry: "ウィリアム・E・パリー"
 RAJ_bhaskar_soman: "バスカー・ソマン"
 RAJ_ram_dass_katari: "ラム・ダス・カタリ"
 RAJ_azad_hind: "自由インド仮政府"
 RAJ_azad_hind_desc: "自由インド仮政府はイギリスの敵の支援を受けながらインドの解放を目指している。インドに自治政府を建設することを願い、日本と協力しながらヨーロッパによる支配を破壊しようとしている。"
 RAJ_marginalized_muslim_community: "軽んじられたイスラム共同体"
 RAJ_marginalized_muslim_community_angry: "軽んじられたイスラム共同体"
 RAJ_marginalized_muslim_community_happy: "軽んじられたイスラム共同体"
 RAJ_risk_of_famine: "飢饉の恐れ"
 RAJ_risk_of_famine_desc: "インドの食糧生産制度は非常に脆弱だ。ちっぽけな中断でさえ崩壊を引き起こす可能性がある。"
 RAJ_risk_of_famine_instant_desc: "次のいずれかに該当すると、§R飢饉§!が発生:\n -開始時のインド国家を失い、それを§Y30日§!以内に奪還できない場合（アデンを除く）\n-新しい支配国が、ゲーム開始時点で我々の占領下にある解放可能な国家以外の場合\n-新しい支配国が我々の従属国以外の場合。"
 RAJ_famine: "飢饉"
 RAJ_famine_desc: "植民地政府とインド鉄道は無競争、無関心、露骨な腐敗によって、困難な事態を本格的な大災害に変えた。この国はこれから何ヶ月も苦しむだろう。"
 RAJ_princely_states: "藩王国"
 RAJ_princely_states_election: "藩王国"
 RAJ_princely_states_donations: "藩王国"
 RAJ_princely_states_donations_troops: "藩王国"
 RAJ_homi_j_bhabha: "ホーミ・J・バーバー"
 RAJ_all_india_forward_bloc_communism: "全インド前進同盟"
 RAJ_all_india_forward_bloc_fascism: "全インド前進同盟"
 RAJ_agrarian_society: "農耕社会"
 RAJ_agrarian_society_desc: "農村部では農耕的生活様式に従って暮らしていることから、地方の行政官はインド国民の大半が軍務やいかなる形式の戦争にも不向きであると信じている。彼らの主張するところでは、我が国は「好戦的な部族」からのみ徴兵すべきということだ。この考え方は大多数の人々の間で深く根を張っており、克服するためには少なくとも1世代を経るか、地方への多額の投資を要するだろう。"
 RAJ_agrarian_society_dynamic: "$RAJ_agrarian_society$"
 RAJ_agrarian_society_dynamic_desc: "$RAJ_agrarian_society_desc$"
 RAJ_industrialized_personnel: "統一された地方の労働人口"
 RAJ_submarine_1: "L級"
 RAJ_submarine_1_desc: "L級潜水艦は、以前の潜水艦の改良版として戦時緊急計画の下で計画された中型潜水艦である。この船は、第一次世界大戦末期に建造され、より大きな21inch魚雷を装備していた。主に訓練と補助任務で使用され、第二次世界大戦の開始まで任務を務めた。"
 RAJ_submarine_2: "T級"
 RAJ_submarine_2_desc: "T級またはトライトン級潜水艦は、O級、P級、R級大型潜水艦を置き換えるために設計された。やや大型で広い作戦航続距離を持ち、太平洋と大西洋での活動に適応していた。十分な武装を施された安定した船体を持っており、紛争中に広範囲で使用された。建造された艦の25%は、戦時中に失われた。"
 RAJ_submarine_3: "U級"
 RAJ_submarine_3_desc: "U級潜水艦は、1940年と1941年の戦時緊急計画の下で建造された小型潜水艦である。元々訓練用潜水艦として計画されたが、戦争が勃発したため設計が変更され、北海や地中海の限られた海域における運用を念頭に置いたものになった。そのため小型で作戦航続距離や兵装は限られていた。U級はアンダイン、アンパイア、アップロアの3つの略同型が建造された。"
 RAJ_submarine_4: "V級"
 RAJ_submarine_4_desc: "V級またはヴァンパイア級潜水艦は、前のU級小型潜水艦に基づいて設計された。この艦は大型化されたとは言え比較的小型の艦で、U級より優れた航行能力を持つが、作戦航続距離や兵装は限られていた。"
 RAJ_destroyer_1: "V/W級"
 RAJ_destroyer_1_desc: "アドミラルティV/W級、ソーニクロフトV/W級を含む艦級。これらの艦は戦時緊急計画の下建造された。第一次世界大戦中に英国の駆逐艦の設計は根本的な進化を遂げており、蓄積された改善や新技術が取り入れられている。その多くは第一次世界大戦後期に建造され、その後英国海軍の駆逐艦の小艦隊の中心となった。1930年代からは予備艦隊に組み込まれ、最終的には船団の護衛任務に使用された。十分に武装され、広い作戦航続距離を持った高速艦だった。"
 RAJ_destroyer_2: "G/H/I級"
 RAJ_destroyer_2_desc: "G級、H級、I級駆逐艦は、1933年と1934年海軍建造計画の一部として発注された。これらの艦は前級のF級駆逐艦の設計を踏襲し、それを全体的に小型化したものだった。G級とH級は、F級と同様に4.7inch砲を搭載していた。広い作戦航続距離を持ち、十分に武装され、強力な魚雷を搭載していた。戦時中に広い範囲で使用され、多数の損失を被った。"
 RAJ_destroyer_3: "J/K/N級"
 RAJ_destroyer_3_desc: "J級、K級、N級は、前級のトライヴァル級と似ているが、設計者は艦砲を強化するのではなくより強力な魚雷と小さい艦砲という標準的な設計に回帰した。戦時中に改装され、改良型の対空砲とレーダーが搭載された。速く、広い作戦航続距離を持ち、十分に武装されていたため艦隊護衛に理想的な艦だった。"
 RAJ_destroyer_4: "バトル級"
 RAJ_destroyer_4_desc: "バトル級駆逐艦は、イギリス駆逐艦の発展の系譜に沿って、1942年、1943年の海軍計画の一部として発注された。前後方に十分な艦砲と魚雷を装備していた。その対空兵装、対潜能力、速力、航続距離から汎用性の高い艦船だった。戦争の後半の投入されたため、僅かな貢献をするに留まった。"
 RAJ_light_cruiser_1: "C級"
 RAJ_light_cruiser_1_desc: "C級軽巡洋艦は、英国海軍で28隻建造された軽巡洋艦である。北海の荒れた海でも活動できるように設計され、第一次世界大戦前・戦中に建造された。本級の船体は幾分小さく窮屈であったが、丈夫で有能な艦であることを証明している。対艦用に6inch砲を、敵艦や輸送船にとどめを刺すために魚雷を装備し、武装は十分なものだった。本級は第一次世界大戦を通して広範囲で運用され、海上作戦の多くに参加した。1930年代半ばには、カレドン、セレス、カーライルの略同型艦が就役するのみとなっていた。"
 RAJ_basic_light_cruiser: "サウサンプトン級"
 RAJ_light_cruiser_2: "サウサンプトン級"
 RAJ_light_cruiser_2_desc: "サウサンプトン級軽巡洋艦はタウン級軽巡洋艦の略同型にあたり、日本の最上型重巡洋艦（当時は軽巡洋艦）に対抗して設計された。本級は厚い装甲、優れた速力と航続距離、そして強力な6inch三連装砲を4基、12門を備えていた。この艦はその後英国海軍が建造する多くの軽巡洋艦の原型となった。"
 RAJ_light_cruiser_3: "クラウン・コロニー級"
 RAJ_light_cruiser_3_desc: "クラウン・コロニー級軽巡洋艦は初期のタウン級の改良型で、建造費と建造期間を削減するため設計が簡略化された。前級と同じ6inch三連装砲を4基搭載していた。本級は前級と比べて小型の機関を搭載したものの、同じ厚さの装甲を装備したため、幾分航続距離が短くなっている。フィジー級、セイロン級 二つの略同型を有する。"
 RAJ_light_cruiser_4: "マイノーター級"
 RAJ_light_cruiser_4_desc: "スウィフトシェア級としても知られるこの巡洋艦は、クラウンコロニー級に戦争における改善点を盛り込んだ改良型として1941年に設計された。本級はクラウンコロニー級より長い作戦行動半径と多くの対空火器を持っていた一方、主砲は三連装砲3基に減らされた。戦況の影響で建造ペースは遅く、その後多くの艦が発注を取り消された。"
 RAJ_heavy_cruiser_1: "ホーキンス級"
 RAJ_heavy_cruiser_1_desc: "ホーキンス級巡洋艦は世界初の重巡洋艦である。本級は初期のタウン級軽巡洋艦、特にその略同型であるバーミンガム級を元型とし、7.5inch砲と厚い装甲帯が取り付けられている。またドイツ海軍が持つ大型の通商破壊艦と戦うために設計された。十分な武装、適度な速度と航続距離、そして高い防御力を兼ね備えている。全5隻が就役したが、第二次世界大戦開戦に間に合ったのは4隻だけだった。"
 RAJ_heavy_cruiser_2: "サリー級"
 RAJ_heavy_cruiser_2_desc: "サリー級重巡洋艦は1928年の海軍計画で提案された艦である。本級は初期のヨーク級重巡洋艦の改良型で、2隻が発注されたが双方ともに建造されることはなかった。もし完成していれば8inch連装砲を4基、より厚い装甲、そしてより強力な機関を装備するはずだった。"
 RAJ_heavy_cruiser_3: "アドミラル級"
 RAJ_heavy_cruiser_3_desc: "アドミラル級重巡洋艦（アドミラル級巡洋戦艦と混同しないように）は、英国海軍が最後に設計、建造に挑戦した8inch砲装備の巡洋艦である。設計は1938年から1941年にかけて行われ、様々な提案がなされた。最終案は新型8inch三連装砲、多数の対空火器、重装甲、優秀な速度性能を特徴としていた。しかし敵巡洋艦が僅少となったこととコストパフォーマンスの問題から、より多数の軽巡洋艦を建造する方針が採択された。"
 RAJ_heavy_cruiser_4: "チャーチルの計画艦"
 RAJ_heavy_cruiser_4_desc: "ドイツのドイッチュラント級ポケット戦艦に対抗するために、第二次世界大戦の初期段階でサー・ウィンストン・チャーチル海軍大臣によって提案された艦である。9.2inch砲、強力な対空兵器、強力な装甲を装備し、効果的に敵主力艦と戦うために設計された。最終的に、コストの高さと重巡洋艦の需要不足のため建造が中止された。"
 RAJ_battle_cruiser_1: "レナウン級"
 RAJ_battle_cruiser_1_desc: "レナウン級巡洋戦艦は、元々リヴェンジ級戦艦の改良型として起工された。しかし第一次世界大戦の勃発により取り消され、その後フィッシャー海軍卿が巡洋戦艦として建造再開を命じた。十分な武装と機動性を備えていたが、代わりに薄い装甲と狭い作戦航続距離を持つという、典型的な巡洋戦艦だった。予定されていた3隻のうち、レナウンとレパルスの2隻が建造された。"
 RAJ_battle_cruiser_2: "プリンセス・ロイヤル級"
 RAJ_battle_cruiser_2_desc: "プリンセス・ロイヤル級は架空の巡洋戦艦で、キング・ジョージ5世級戦艦を高速化し、建造費を削減したものである。元の艦級に類似した兵装を搭載しているがその数は削減されており、2基の14inch三連装砲と6基の5.25inch連装高角砲を装備する。高い速度と航続距離の長さは英国海軍に迅速な攻撃能力と船団護衛力を提供するが、限られた装甲は近代的な戦艦との戦闘時に問題となるだろう。"
 RAJ_battleship_1: "リヴェンジ級"
 RAJ_battleship_1_desc: "リヴェンジ級戦艦は、クイーン・エリザベス級高速ドレッドノートの量産型として1913年に発注された。武装や装甲は見劣りしないものだったが、とても低速だったために第二次大戦中は二線級の任務に従事していた。同型艦8隻が計画され、そのうち5隻が完成している。"
 RAJ_battleship_2: "キング・ジョージ5世級"
 RAJ_battleship_2_desc: "主力艦の最大排水量と主砲口径を制限したワシントン（1922年）、第一次ロンドン（1930年）海軍軍縮条約は、キング・ジョージ5世級戦艦を生み出した。条約の制限のため、同級は前級はおろか同時代の戦艦よりも小口径の主砲を搭載していた。小口径ではあったが、強力な対空兵装と適切な装甲により充分に武装していた。旧式化したクイーン・エリザベス級を代替する為に5隻が発注、起工された。"
 RAJ_battleship_3: "ライオン級"
 RAJ_battleship_3_desc: "ライオン級戦艦はキング・ジョージ5世級から多くの特徴を受け継いだ艦級である。1938年時海軍軍備計画において、老朽化したリヴェンジ級戦艦を代替する為に発注されたが、紛争が激化したため完成することはなかった。同級の概要はキング・ジョージ5世級に類似していたが、もし建造されていれば主砲に強力な新型16inch砲を導入し重武装化していたことだろう。またより厚い装甲と、強力な機関を搭載していたと考えられる。"
 RAJ_battleship_4: "ヴァンガード級"
 RAJ_battleship_4_desc: "ヴァンガード級戦艦は、英国海軍によって建造された最後の戦艦である。発注は一隻だったが、太平洋戦域の為に更に4隻必要と考えられていた。1940年の戦時緊急計画の下で発注されたものの建造の優先度は低く、完成した時には既に戦後となっていた。この艦はそのスマートな船体によって、優れた安定性と凌波性を有していた。兵装はクイーン・エリザベス級やリヴェンジ級戦艦と同じもので、十分な火力を有し、強力な機関と優れた装甲により速力と防御力も兼ね備えている。"
 RAJ_SH_battleship_1: "センチュリオン級"
 RAJ_SH_battleship_1_desc: "センチュリオンは、英国海軍がドイツや日本の大型艦船に対抗する為に建造した、と仮定した仮想の超大型戦艦である。大口径の18inch砲と厚い装甲は、これらの艦船と戦う為に必要な火力と防御力を兼ね備えている。強力な対空火器、長い航続距離、および良好な速力は大英帝国の広大な海域をカバーするのに必要なものだった。"
 RAJ_SH_battleship_2: "ライオンII級"
 RAJ_SH_battleship_2_desc: "ライオンII級戦艦は、ライオン級戦艦に改良を加えた艦として、1944年に設計された。戦時中の教訓を取り入れ、長大かつ重大な設計となり、完成の暁には最新型の3基から4基の三連装16inch砲を搭載し、その厚い装甲はあらゆる方向からの攻撃や空襲から艦を守っていたことだろう。建造に掛かる費用や敵海軍の喪失、航空母艦の必要性によってこの計画は放棄された。"
 RAJ_carrier_1: "カレイジャス級"
 RAJ_carrier_1_desc: "3隻建造されたこの航空母艦は、巡洋戦艦を改装した英国海軍初の艦隊型空母である。ワシントン海軍軍縮条約を受け、1922年に改装が開始され1925年に終了した。作戦航続距離が広く優れた速度を持ち、適度に装甲があり十分な武装をされた艦だったが、改装艦のため搭載できる艦載機の数は限られていた。それでもなお、この艦は航空母艦の建造と艦隊の航空戦略における重要な経験を英国海軍にもたらした。"
 RAJ_carrier_2: "アーク・ロイヤル級"
 RAJ_carrier_2_desc: "アークロイヤル級航空母艦は、ワシントン海軍軍縮条約の制限に収まるように建造された。この艦は、格納庫とその上の飛行甲板が船体に一体化された最初の航空母艦である。1934年に設計され、樹分な装甲と武装を施されている。多くの艦載機を搭載し、英国海軍の主力艦隊に追いつくために十分な作戦航続距離と速度を持っていた。"
 RAJ_carrier_3: "イラストリアス級"
 RAJ_carrier_3_desc: "イラストリアス級航空母艦は、空母の大きさの上限を23000tとした1936年の第二次ロンドン海軍軍縮会議の制限内で設計された。この艦は世界初の装甲飛行甲板を採用した空母だったが、搭載機数は縮小しなければならなかった。厚い装甲と対空兵装による強力な防御力と、強力な機関と大きな燃料搭載量による長い航続距離を備えている。"
 RAJ_carrier_4: "インプラカブル級"
 RAJ_carrier_4_desc: "インプラカブル級航空母艦はイラストリアス級の改良型で、1938年に海軍計画艦として承認された。戦争の初期〜中期に船団護衛用の小型艦船へ計画の優先順位が変更されたため建造が遅れた。大型化により船体と甲板の両方に厚い装甲を維持したまま、より多くの艦載機を搭載することが可能となった。より強力な機関は、イラストリアス級より速く大きな作戦行動半径をもたらした。"
