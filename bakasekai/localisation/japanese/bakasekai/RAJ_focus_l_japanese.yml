 RAJ_industrialize_state_goe: "$RAJ_industrialize_state$"
 RAJ_industrialize_state_goe_desc: "$RAJ_industrialize_state_desc$"
 RAJ_GATHERING_STORM_DESC: "大英帝国の王冠の宝石、最も貴重な部分たるインドの皇帝は、皇帝の力と無力さの奇妙な組み合わせである。イギリスの公務員のごく一部のエリートが、何億人もの臣民で満たされた広大な亜大陸を支配しているのだ。臣民の階級から、先の大戦で勇敢に戦ったインド陸軍が徴集される。\n\nインドの指導者たちは、先の大戦での犠牲がイギリスから独立を獲得することを助けるだろうと願っていたが、今やその希望は失望となった。新たな戦争が迫り来るなか、多くの者が自由を得るときが来たと信じている。どのような手段が必要となろうとも。"
 RAJ_BLITZKRIEG_DESC: "大英帝国の王冠の宝石、最も貴重な部分たるインドの皇帝は、皇帝の力と無力さの奇妙な組み合わせである。イギリスの公務員のごく一部のエリートが、何億人もの臣民で満たされた広大な亜大陸を支配しているのだ。臣民の階級から、先の大戦で勇敢に戦ったインド陸軍が徴集される。\n\nインドの指導者たちは、先の大戦での犠牲がイギリスから独立を獲得することを助けるだろうと願っていたが、今やその希望は失望となった。新たな戦争が迫り来るなか、多くの者が自由を得るときが来たと信じている。どのような手段が必要となろうとも。"
