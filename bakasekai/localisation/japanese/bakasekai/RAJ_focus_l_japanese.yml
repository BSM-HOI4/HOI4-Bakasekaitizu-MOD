 RAJ_establish_local_recruitment_offices: "現地採用事務所の設置"
 RAJ_establish_local_recruitment_offices_tt: "採用事務所が§Y$idea_RAJ_agrarian_society$§!からの悪影響を軽減するのにかかる予想月数: [?var:RAJ_projected_time_left]。採用事務所を拡張すれば、このプロセスはさらに加速される。\n\n現在の軽減効果: \n$experience_gain_army_tt$ §R[?RAJ_agrarian_society_experience_gain_army_factor_offices]%§!\n$mobilization_speed_tt$ §G[?RAJ_agrarian_society_mobilization_speed_offices]%§!\n$conscription_factor_tt$§G[?RAJ_agrarian_society_conscription_factor_offices]%§!\n $mobilization_laws_cost_factor$: §G[?RAJ_agrarian_society_mobilization_laws_cost_factor_offices]%§!\n\n最大上限値:\n$experience_gain_army_tt$ §R[?RAJ_agrarian_society_experience_gain_army_factor_offices_max]%§!\n$mobilization_speed_tt$ §G[?RAJ_agrarian_society_mobilization_speed_offices_max]%§!\n$conscription_factor_tt$§G[?RAJ_agrarian_society_conscription_factor_offices_max]%§!\n $mobilization_laws_cost_factor$: §G[?RAJ_agrarian_society_mobilization_laws_cost_factor_offices_max]%§!"
