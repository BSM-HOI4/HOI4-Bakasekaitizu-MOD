 RAJ_famine_scripted_timeframe_reveal: "[GetFamineTimeframe]\n$RAJ_famine_prevention_stats$"
 RAJ_famine_scripted_timeframe_reveal_desc: "飢饉はあと§Y[?RAJ_famine_spread_times]§!か月間継続すると判定された。"
 RAJ_famine_scripted_timeframe_non_reveal_desc: "飢饉はあと§Y[?RAJ_famine_spread_times_min]§! - §Y[?RAJ_famine_spread_times_max]§!か月間継続すると予測された。"
 RAJ_famine_risk_scripted_gui_desc: "予防措置により隣国への飢饉拡大を防止できる可能性: §G[?RAJ_famine_shield]%§!\n飢饉拡大のリスク: §R[?RAJ_famine_spreads]%§!"
 RAJ_famine_prevention_stats: "我々の予防措置により、\n飢饉の拡大は§Y[?RAJ_times_shield_has_blocked_spread]§!回防止され、\n飢饉の期間は§Y[?RAJ_famine_reduction_from_shield]§!か月間短縮された"
 RAJ_famine_shield_tt: "予防措置により飢饉拡大を防止できる可能性: §G+$RIGHT|0$%§!"
 RAJ_take_over_administrative_rights: "管理権限の引き継ぎ"
 RAJ_take_over_administrative_rights_desc: "この地域から潔く撤退するために、[ENG.GetAdjective]政府は行政事務を当社の事務員に外注し始めた。"
 RAJ_the_return_of_the_east_india_company: "東インド会社の復活"
 RAJ_the_return_of_the_east_india_company_desc: "数十年間の空白を経て、東インド会社が再設立されることになった。徹底的な効率でインド亜大陸を完全に搾取することを目的としている。"
 RAJ_the_return_of_the_east_india_company_tt: "東インド投資計画と税制が今有効化された。\n投資家に配当金を支払うための§Yディシジョン§!をアンロック。"
 RAJ_privatized_tutelage: "教育の民営化"
 RAJ_privatized_tutelage_desc: "教育に関しては、厳格に民営化された学校および大学制度を維持することによって、無駄な人を排除し、教育を受けるにふさわしい人たちのために確保すべきだ。"
 RAJ_vertical_integration: "垂直統合"
 RAJ_vertical_integration_desc: "最近の節税方法は比較的、海外の政府に気づかれにくい。我々はさらなる節税の実現に向けて、もっとたくさんの抜け穴を見つけることができるだろう。"
 RAJ_acquire_new_resources: "新たな資源の入手"
 RAJ_acquire_new_resources_desc: "我々の業界では、商品の需要を満たすために、なおいっそうの資源供給を必要としている。そこで、我々は各地に保有する新たな資源処理施設で、失業者たちに働いてもらうつもりだ。"
 RAJ_corporate_expansion: "企業の拡大"
 RAJ_corporate_expansion_desc: "我々の主要なポートフォリオにおける経済成長は人口増加につながっている。長期的な成長を確実なものにするため、インフラを拡張して将来的な雇用の増加に備えなければならない。"
 RAJ_trade_federation_of_india: "ブランド再構築"
 RAJ_trade_federation_of_india_desc: "近年、我々は歴史的な成長を遂げ、多くの企業が夢見ることしかできないレベルの高い政治力を手に入れた。一方で、いまだに企業による統治に納得がいかない州もあるようだ。高額の補償金を支払えば、彼らを説得できるだろうか？"
 RAJ_trade_federation_of_india_tt: "§Y消費財工場補正§!と§Y政治力§!を使って、高い迎合度の中核州を作るディシジョンをアンロック。"
 RAJ_the_varuna_class: "ヴァルナ級"
 RAJ_the_varuna_class_desc: "我々の最新主力艦は工学における偉大な成果である。したがって、この船には神の名前こそがふさわしい。"
 RAJ_purchase_destroyers_and_subs: "駆逐艦と潜水艦の購入"
 RAJ_purchase_destroyers_and_subs_desc: "$SMB_purchase_destroyers_and_subs_desc$"
 RAJ_purchase_cruisers_and_dreadnoughts: "巡洋艦とドレッドノートを購入"
 RAJ_purchase_cruisers_and_dreadnoughts_desc: "$SMB_purchase_cruisers_and_dreadnoughts_desc$"
 RAJ_mineral_exploitation_institute: "鉱物開発研究所"
 RAJ_mineral_exploitation_institute_desc: "最近、鉱物開発からの成果が思わしくない。地質調査への投資額を増やし、天然資源から得られる潜在的な収益額をより正確に測定できるようにすべきである。"
 RAJ_establish_the_reserve_bank_of_india: "インド準備銀行の設立"
 RAJ_establish_the_reserve_bank_of_india_desc: "我が国の経済をさまざまな衝撃から守るため、準備銀行を設立して通貨の管理権限を委ねるべきだ。"
 RAJ_all_india_kisan_sabha: "全インド農民組合"
 RAJ_all_india_kisan_sabha_desc: "インドの農村部では、長い間小作人や農民が搾取されてきた。今こそ団結し、集団で声をあげるべきである。"
 RAJ_haripura_session_of_the_indian_national_congress: "第2回ハリプラ会議"
 RAJ_haripura_session_of_the_indian_national_congress_desc: "資本主義が世界的な緊張を高める中、労働者や小作人の闘争の場としてスワラージを再構築する時がきた。第2回ハリプラ会議では、我々は革新的な構想の下で団結し、帝国主義の同盟を拒否し、階級のない自立したインドのために戦闘を受け入れるだろう。"
 RAJ_the_second_gorkha_war: "第二次ゴルカ戦争"
 RAJ_the_second_gorkha_war_desc: "ネパールの独立は過去の遺物であり、1つであるべき亜大陸を分断している。ゴルカ兵に決定的な軍事行動を仕掛け、こちら側に取り込もう。ヒマラヤ山脈を確保するぞ。"
 RAJ_guarantee_nepalese_independence: "ネパールの独立を保証"
 RAJ_guarantee_nepalese_independence_desc: "ネパールの主権を認めることは帝国の支配に抵抗を示す象徴になる。彼らの独立を保証することで、我々はヒマラヤ山脈の安全を確保し、この地域で外国の影響力に対抗するための強力な同盟国を得ることになる。"
 RAJ_ignite_the_sino_indian_war: "中印戦争の火蓋を切る"
 RAJ_ignite_the_sino_indian_war_desc: "国境をめぐる中国との緊張状態はもはや一触即発であり、看過できるものではない。我々は断固とした行動を取ることで、ヒマラヤ山脈における優位性を主張し、正当な領土を確保すべきだ。今、勇敢な攻撃に踏み切れば、アジアの勢力図が我々優位に書き換えられるかもしれない。"
 RAJ_national_planning_committee: "国家計画委員会"
 RAJ_national_planning_committee_desc: "経済的な自給自足は真の独立の基盤となるものだ。国家計画委員会を設立することで、工業化、農村開発、そして公正な成長に向けた道筋を計画化することができる。統一された計画は、インドを近代的で自立した国家へと変容させるだろう。"
 RAJ_promote_violence_against_the_british: "イギリスに対する暴力を推進"
 RAJ_promote_violence_against_the_british_desc: "もはや平和的な抗議を行う時ではない。帝国の圧政を打ち破るには、直接行動を起こすしかない。組織的な抵抗活動はイギリスの支配力を弱め、民衆に立ち上がる勇気を与えるだろう。"
 RAJ_rally_the_indian_left: "インド左派の結集"
 RAJ_rally_the_indian_left_desc: "分裂した左派は団結し、労働者の権利と真の独立を勝ち取るために闘争を主導しなければならない。社会主義勢力と共産主義勢力を1つの旗の下に結集することで、帝国主義と資本主義に立ち向かう強力な戦線を作り上げることができる。"
 RAJ_forward_bloc: "全インド前進同盟"
 RAJ_forward_bloc_desc: "全インド前進同盟は、インドの将来に関する大胆な構想を表明している。それは、妥協の拒否と、革命的行動の受け入れだ。すべての反帝国主義勢力を団結させることで、完全な独立に向けた闘争を加速し、より強力でより急進的なインドの基礎を築くことができる。"
 RAJ_give_me_blood_and_i_will_grant_you_freedom: "私に君たちの血をくれれば、私は君たちに自由を与えよう"
 RAJ_give_me_blood_and_i_will_grant_you_freedom_desc: "独立への道のりは闘争と犠牲で舗装されている。勇敢な者たちを我々の大義のために結集することで、植民地統治の鎖を断ち切るほど強力な動きを作り出すことができる。勝利は対価を払う者の前に現れるのだ。"
 RAJ_rani_of_jhansi_regiment: "ジャーンシー連隊のラニ"
 RAJ_rani_of_jhansi_regiment_desc: "ジャーンシーのラニの勇敢さに触発され、圧政に立ち向かう女性だけの連隊を創設する。勇敢な戦士たちに力を与えることによって、植民地統治に強力な打撃を与え、独立闘争における女性の役割を見直すことにつながるだろう。"
 RAJ_azad_hind_dlc: "自由インド仮政府"
 RAJ_azad_hind_dlc_desc: "自由インド仮政府は、最高潮に達した自由への闘争を象徴する存在であり、イギリス統治を終わらせることに専念する亡命政府だ。軍備を整え、明確な構想を持った彼らは武力と意思の強さでインドを自由に導く準備ができている。"
 RAJ_azad_hind_dlc_radio: "自由インド仮政府のラジオ"
 RAJ_azad_hind_dlc_radio_desc: "解放のメッセージを拡散するために、我々は自由インド仮政府のラジオを開設した。この革命的な放送は、我々の自由を求める声を国境を越えて発信するものだ。これによって愛国者たちは団結し、植民地支配との戦いが始まるだろう。闘争には声が必要であり、それは我々の声なのだ。"
 RAJ_azad_hind_dlc_bank: "自由インド仮政府の銀行"
 RAJ_azad_hind_dlc_bank_desc: "改革には資源が必要だ。自由インド仮政府の銀行の設立によって、独立戦争の支援に専念する金融機関が生まれる。この銀行が資金を集め、愛国者たちに力を与え、自由なインドの経済的基盤を築くだろう。"
 RAJ_seek_japanese_support: "日本の支援を求める"
 RAJ_seek_japanese_support_desc: "敵の敵は、最強の味方かもしれない。日本に支援を求めれば、イギリスの統治に対抗するための資源、訓練、人材が手に入る可能性がある。その道のりはリスクを伴うが、流れを有利に変えるのは、このような同盟国かもしれない。"
 RAJ_the_enemy_of_my_enemy: "敵の敵"
 RAJ_the_enemy_of_my_enemy_desc: "独立に向けた戦いでは、必要に迫られて同盟が結ばれるものだ。イギリスの敵対国と協力することによって、我が領土に対するイギリスの支配力を弱めることができる。自由を手にするには、意外な味方が必要になるかもしれない。要は勝てば良いのだ。"
 RAJ_shaheed_and_swaraj: "シャヒードとスワラージ"
 RAJ_shaheed_and_swaraj_desc: "殉教者の犠牲は、スワラージの絶え間ない追求の動機付けになる。彼らの血は改革の火に油をそそぎ、独立は与えられるものではなく、奪い取るものだと思い出させてくれる。彼らの記憶が、主権国家インドの自由を勝ち取るという我々の決意を強固にすることを願っている。"
 RAJ_azad_hind_radio: "自由インド仮政府のラジオ"
 RAJ_azad_hind_radio_desc: "$RAJ_azad_hind_dlc_radio_desc$"
 RAJ_seek_international_recognition: "国際的な認知を要請"
 RAJ_seek_international_recognition_desc: "我々の闘争が正当であることを知らしめるために、我々の大義について国際的な認知を得なければならない。国際的な支援を集めることによって、[ENG.GetAdjective]を孤立させ、世界的に見た我々の主権要求を強化できるだろう。"
 RAJ_war_taxes: "戦時税"
 RAJ_war_taxes_desc: "戦争の費用は自己犠牲によって分担されるべきものだ。戦時税を課すことで、軍事活動に必要な費用を確保し、勝利に必要な資源を提供することができる。自由インドはすべてのルピーを差し出す価値がある。"
 RAJ_azad_hind_bank: "自由インド仮政府の銀行"
 RAJ_azad_hind_bank_desc: "$RAJ_azad_hind_dlc_bank_desc$"
 RAJ_hindutva: "ヒンドゥー至上主義"
 RAJ_hindutva_desc: "ヒンドゥー至上主義は文化的、宗教的遺産に根差した統一インドを思い描く考え方だ。この理念を推進することによる、国家のアイデンティティ形成を目的としている。そうすれば、団結を強化し、国際社会でインドが自らの主張を表明する準備が整うだろう。"
 RAJ_netaji: "ネタジ"
 RAJ_netaji_desc: "ネタジ・スバス・チャンドラ・ボースは、帝国の統治に対する絶え間ない抵抗の精神を体現した人物だ。彼の展望と指導力は数百万名の人々を奮い立たせ、インドの主権を勝ち取るための戦闘に動員した。彼の指導の下、独立の夢は現実に近づいている。"
 RAJ_hindu_mahasabha: "進歩的なヒンドゥー教徒の州"
 RAJ_hindu_mahasabha_desc: "全インド・ヒンドゥー会議は藩王国の独立を支援しており、彼らのことを「ヒンドゥー教の力の基盤」だと称賛している。これらの国に独立を認めることで、我々はより多くの資金を受け取ることができ、残りの国土を統合することができる。"
 RAJ_hindu_mahasabha_tt: "藩王国を傀儡として解放すると、その国が傀儡である限り、この精神ボーナスが§G+4%§!増加し、最大値は§Y32%§!まで。"
 RAJ_sanatani: "サナタニ"
 RAJ_sanatani_desc: "サナータナ・ダルマの原理は、インドの統一と復興に向けて、永久の基盤を提供するものだ。これらの価値を受け入れることで、伝統に導かれた、調和のとれた強靭な国家を築くことができる。"
 RAJ_hindi_as_a_national_language: "国語としてのヒンディー語"
 RAJ_hindi_as_a_national_language_desc: "国語としてヒンディー語を採用することは、共通の文化的アイデンティティでインドを統一することにつながる。ヒンディー語の使用を推進することで、コミュニケーションは強化され、民族の誇りが育まれ、まとまりのある独立した国家基盤が築かれる。"
 RAJ_seven_shackles_desc: "ヴィヤヴァサイバンディはインド人の職業選択の自由を制限するもので、これが彼らを奴隷的な制度にしばりつけている。この制約を排除すれば、労働者は解放され、真に独立した平等な経済に貢献する権利を手にする。"
 RAJ_coal_fire_and_steel: "石炭と火と鉄"
 RAJ_coal_fire_and_steel_desc: "石炭はエンジンを動かし、火は意思を鍛え、鉄は未来を作る。重工業への投資は、自立したインドの基盤を構築し、この国が主権を守り、繁栄を勝ち取る力を与える。"
 RAJ_extend_indian_security_zone: "[GetRajName]の安全地帯を拡張する"
 RAJ_extend_indian_security_zone_desc: "安全地帯の拡張はインド国境の安全を確保するとともに、地域一体に我々の力を示すことにつながる。我々の影響力が高まれば、安定した主権国家の維持に必要な安全保障を確実なものにできるのだ。"
 RAJ_high_altitude_training: "高所トレーニング"
 RAJ_high_altitude_training_desc: "ヒマラヤ山脈の険しい山頂付近では強さと回復力が求められる。我々は特殊な高所トレーニングプログラムを確立し、我が部隊が極限環境下で優位に戦えるように準備を進めている。これによって、国境は安全に保たれ、戦略的に重要な山岳地帯を支配することが可能だ。"
 RAJ_high_altitude_training_tt: "山岳兵の編制を獲得する"
 RAJ_demand_return_of_imperialist_colonies: "帝国主義による植民地の返還を要求"
 RAJ_demand_return_of_imperialist_colonies_desc: "インド亜大陸における、帝国主義の全植民地の返還を要求する時がきた。インドのすべての土地を1つの旗の下に統合し、植民地侵略の時代を終わらせよう。"
 RAJ_planned_economy: "計画経済"
 RAJ_planned_economy_desc: "強い国家には強い経済が必要であり、それらは目的と構想によって導かれるものだ。計画経済を導入すれば、効率的に資源配分を行い、産業の成長を優先し、すべての国民に公平な発展を保証することができる。"
 RAJ_two_nation_theory_: "二民族論"
 RAJ_two_nation_theory__desc: "二民族論はヒンドゥー教徒とイスラム教徒は異なる民族であり、それぞれが独自の国家を持つ資格があると主張している。この理念を受け入れることによって、自己決定に向けた別々の道の必要性に気づき、分割と自治を通じたインド亜大陸の未来を形成する。"
 RAJ_red_in_the_shadows: "影に潜む赤い勢力"
 RAJ_red_in_the_shadows_desc: "帝国衰退の混乱の中で、革命勢力が力を蓄え、秘密裏に旧体制の弱体化を目論んでいる。赤旗勢力の台頭は、来たるべき報復の予兆であり、それによってインドと世界の未来が一変するかもしれない。"
 RAJ_red_in_the_shadows_tt: "イギリス政府に潜入し、独立運動を親共産主義に導くディシジョンをアンロックし、§Y$RAJ_royal_indian_navy$§!の完成に必要な要件を緩和する。"
 RAJ_seek_domestic_allies: "国内の協力者"
 RAJ_seek_domestic_allies_desc: "全インド前進同盟だけで構想を実現するのは不可能だ。政治思想を超えて協力者を募れば、革命的な思想家たちを団結させることができ、より広範な支持を集め、インドを真の独立に導くために必要な指導力を集結させることができる。"
 RAJ_protest_against_the_howell_monument: "ホルウェル記念碑に対する抗議行動"
 RAJ_protest_against_the_howell_monument_desc: "ホルウェル記念碑は植民地支配と不正を賛美するために建てられたものだ。この象徴に対する抗議行動を主催することによって、国全体を動員し、帝国のプロパガンダを拒否し、我々の自由のための闘争を侮辱する遺物の撤去を要求しよう。"
 RAJ_the_indian_national_army: "インド国民軍"
 RAJ_the_indian_national_army_desc: "インド国民軍は、インドの独立のための闘争を体現したものだ。愛国者たちを1つの旗の下に結集し、植民地統治に対して武器を持って立ち向かわせる。インド国民軍はその決意と犠牲により、インドを解放し、主権国家に導く準備ができている。"
 RAJ_appoint_soviet_friendly_government: "ソビエト寄りの政府を任命"
 RAJ_appoint_soviet_friendly_government_desc: "モスクワからの継続的な支援を確保するために、ソビエトのイデオロギーに完全に沿う政府を樹立する。彼らに対する忠誠心は、我々の国家に対する経済支援、軍事協力、イデオロギーの一貫性をもたらすだろう。"
 RAJ_appoint_german_friendly_government: "ドイツ寄りの政府を任命"
 RAJ_appoint_german_friendly_government_desc: "我が国の政府を[GER.GetNameDef]と連携させることによって、ヨーロッパで台頭する勢力との結び付きを強めることができるだろう。この政権は産業の成長、軍備の近代化、ボリシェヴィズムに対する断固たる反対を優先事項とする。"
 RAJ_ban_untouchability_once_and_for_all: "不可触民差別を永久に禁止する"
 RAJ_ban_untouchability_once_and_for_all_desc: "不可触民差別は我々の社会の汚点だ。最も団結が必要な時に我々を分断させてしまうものだ。この悪しき慣行を撤廃しなければ、すべてのインド人に尊厳を認め、公正で包括的な国家を樹立するための決定的な一歩は踏み出せない。"
 RAJ_a_tiger_unchained: "解き放たれた虎"
 RAJ_a_tiger_unchained_desc: "我々は最も過酷な山岳地形を制圧可能な精鋭部隊を創設する。この山頂の虎たちは敵に恐怖を与え、山岳地帯における優位性を確保してくれるだろう。"
 RAJ_to_shake_the_world: "世界を揺るがすために"
 RAJ_to_shake_the_world_desc: "インドの産業の潜在力は莫大であり、今こそそれを解き放つ時だ。工場を拡張し、インフラを近代化し、資源を有効活用することで、インドは世界の運命を握る産業大国に生まれ変わることができる。"
 RAJ_east_india_railways_dlc: "東インド鉄道"
 RAJ_east_india_railways_dlc_desc: "東インド鉄道の拡大と近代化により、商業を強化し、接続性を改善し、もっと繁栄した統合国家への道のりを築くことができる。"
 RAJ_modify_indian_railways_tt: "$idea_RAJ_indian_railways$に以下の補正:  "
 RAJ_the_calcutta_line: "カルカッタ線"
 RAJ_the_calcutta_line_desc: "地域の緊張が高まるにつれて、東部の国境地域を確保することが急務となっている。カルカッタ線の強化を通じて防衛要塞が設置され、重要なインフラの保護、外敵からの市街地の防衛を実現できるだろう。"
 RAJ_the_calcutta_line_tt: "国内の§Yすべての§!州に§Y陸上要塞§!を§G2つ§!ずつ追加する。"
 RAJ_bombay_baroda_and_central_india_railway: "ボンベイ・バロｰダ・中央インド鉄道"
 RAJ_bombay_baroda_and_central_india_railway_desc: "ボンベイ鉄道、バローダ鉄道、中央インド鉄道の拡張は、主要な地域間を接続し、経済成長を促進し、コミュニティ同士を結合させる。これらの重要な路線は貿易ネットワークを強化し、インドのインフラを今後起こる課題に向けて強固なものにする。"
 RAJ_great_indian_peninsula_railway_dlc: "大インド半島鉄道 "
 RAJ_great_indian_peninsula_railway_dlc_desc: "大インド半島鉄道は、中央インドと南インドの経済的な潜在力を解き放つための鍵である。この鉄道ネットワークの拡張は貿易を促進し、産業を活性化させ、インド亜大陸全体のシームレスな接続を実現する。"
 RAJ_south_indian_railway_company: "南インド鉄道会社"
 RAJ_south_indian_railway_company_desc: "南インド鉄道会社は活気ある南インドとその他の地域を結び付けている。このネットワークを強化・拡大することによって、地域の成長を促進し、団結を育み、インドの経済的独立に向けた南インドの役割を確固たるものにする。"
 RAJ_supply_center_fortifications: "供給基地の要塞化"
 RAJ_supply_center_fortifications_desc: "供給基地の安全確保は戦争努力を維持するために極めて重要だ。このような拠点を要塞化することによって、資源の流通を確実に途切れないようにし、軍事作戦の根幹を敵の侵攻から守ることができる。"
 RAJ_supply_center_fortifications_tt: "領有する州内のすべての§Y補給ハブ§!ごとに、§Y$bunker$§!を§G3つ§!追加する。"
 RAJ_north_western_state_railway: "ノース・ウェスタン鉄道"
 RAJ_north_western_state_railway_desc: "ノース・ウェスタン鉄道はインドの中心部と戦略的な国境を結ぶ上で非常に重要だ。このネットワークを拡張・近代化することによって、地域の貿易を強化し、移動手段を高度化し、重要な国境沿いでの我が国の存在感を高めることができる。"
 RAJ_prioritize_army_cargo: "陸軍貨物を優先"
 RAJ_prioritize_army_cargo_desc: "鉄道網は軍事物流の根幹である。陸軍兵站を優先することにより、迅速かつ決定的な勝利に必要な武器、資源、増援部隊の供給を確実なものとする。"
 RAJ_prioritize_civilian_cargo: "民間貨物を優先"
 RAJ_prioritize_civilian_cargo_desc: "勝利のためには強力な国内戦線が不可欠だ。民間貨物を優先することにより、食料、物資、材料のタイムリーな供給を確実なものとして国民と産業を維持し、危機の中でも国家の回復力を維持することができる。"
 RAJ_specialized_dietary_requirement: "特別な食事要件"
 RAJ_specialized_dietary_requirement_desc: "兵士の士気と結束を維持するためには、彼らの多様な食事ニーズを尊重しなければならない。宗教や文化的信条に沿った食事を提供することにより、すべての兵士が尊重されていることを感じ、士気高く戦場に向かうことができる。"
 RAJ_standardized_rations: "標準化された配給食料"
 RAJ_standardized_rations_desc: "効率性と一貫性は強固な軍隊を作る鍵である。標準化された食料を配給することにより、兵站を簡素化し、費用を抑え、すべての兵士が等しい食事にありつける結果、階級を超えた団結と規律が育まれるのだ。"
 RAJ_royal_indian_artillery_: "王立インド砲兵 "
 RAJ_royal_indian_artillery__desc: "この強力な部隊をさらに強化することにより、破壊的な火力を実現して敵の戦線を突破し、戦場での勝利を確実なものとする。"
 RAJ_armoured_corps_center_and_school: "装甲部隊センター"
 RAJ_armoured_corps_center_and_school_desc: "未来の戦争では、機械化された戦力が戦況を左右する。装甲部隊センターを設立すれば、兵士に装甲戦術を訓練することができ、戦車を現代軍事戦略の先鋒に変えることができる。"
 RAJ_indian_army_corps_of_engineers: "[ROOT.GetAdjective]陸軍工兵隊"
 RAJ_indian_army_corps_of_engineers_desc: "要塞から橋梁まで、[ROOT.GetAdjective]陸軍工兵隊は作戦の成功に不可欠な存在だ。この重要な部門を拡張し、装備することにより、我が軍はあらゆる障害物を乗り越え、あらゆる戦線で勝利までの道のりを築くことができる。"
 RAJ_kingmaker: "キングメーカー"
 RAJ_kingmaker_desc: "外国の紛争に義勇軍を送り込むことで、我が国の影響力を広げるとともに、貴重な戦闘経験を得ることができる。このような取り組みは同盟国の支援に限られず、世界中の闘争の結果を左右する決定的な部隊という我々の地位を確立する。"
 RAJ_relax_agrarian_society_criteria: "工業化された社会"
 RAJ_relax_agrarian_society_criteria_desc: "近代的な工業大国に移行するためには、経済の主軸を伝統的な農業から脱却させなければならない。農村地域の住民が工場労働に参加することを奨励し、持続可能な経済成長と技術発展の基礎を作ることができた。"
 RAJ_mechanization_of_the_cavalry: "騎兵の近代化"
 RAJ_mechanization_of_the_cavalry_desc: "騎馬戦の時代は終わった。騎兵隊は機械化によって現代的な装甲部隊に変わり、スピードと火力を兼ね備えて戦場を支配し、インドを戦争の未来に導いてくれる。"
 RAJ_mountain_tanks: "山岳戦車"
 RAJ_mountain_tanks_desc: "伝統的な戦車は起伏に富んだ地形で苦戦するものだが、特殊な山岳戦車は高高度の戦闘を有利に戦うことができる。このような機動性の高い機械は高所を制圧して戦略的な拠点を確保し、敵を出し抜くことになるだろう。"
 RAJ_siege_batteries: "攻城砲"
 RAJ_siege_batteries_desc: "立ちふさがる要塞をがれきに変えてしまうのが攻城砲だ。この重砲兵部隊は比類なき破壊力を持ち、いかなる砦も要塞も我々の進軍を止められない。"
 RAJ_mountain_guns: "山砲"
 RAJ_mountain_guns_desc: "高高度での戦闘には適応力が必要だ。山砲は起伏に富んだ地形に合わせて設計されており、最も過酷な環境にいる部隊に重要な火力支援を提供し、最も困難な戦闘においても優位性を確保する。"
 RAJ_regimental_loyalty: "連隊への忠誠"
 RAJ_regimental_loyalty_desc: "連隊への忠誠の絆は我々の部隊に団結と規律を生む。この伝統に誇りを持つことで、名誉と信頼、そして勝利に向けた不屈の決意で結ばれた力が生まれる。"
 RAJ_uplifting_the_people_of_india: "インドの人々の生活向上"
 RAJ_uplifting_the_people_of_india_desc: "インドの人々は独立に向けて、断固たる決意で臨まなければならない。そのためにはまず、彼らの基本的なニーズが満たされている必要がある。そのため、我々はこれを達成するための政策を実施する。"
 RAJ_gurkhas: "グルカ兵"
 RAJ_gurkhas_desc: "グルカ兵は勇気と粘り強さで知られ、戦闘においては比類なき精鋭部隊だ。彼らの役割を拡大し、我々の大義への貢献を確実にすることで、戦場における大きな優位性を確保できる。"
 RAJ_lions_of_the_great_war_: "大戦の獅子"
 RAJ_lions_of_the_great_war__desc: "先の大戦におけるインド兵の犠牲は彼らの勇敢さの証である。彼らの功績を記念し、その勇気を称えることで、インドの運命のために戦う新たな世代にその精神が引き継がれることを願っている。"
 RAJ_abolish_agrarian_society_criteria: "工業化の加速"
 RAJ_abolish_agrarian_society_criteria_desc: "今日において、他国に劣らぬ経済発展の実現が我が国の急務である。我々はあまりにも長い間農業に依存してきたのだ。今こそ迅速な工業化への道を拓き、[RAJ.GetNameDef]を新たな進歩の時代へと導かねばならない。"
 RAJ_abolish_agrarian_society_criteria_tt: "§Y$idea_RAJ_agrarian_society$§!の影響を軽減するのに必要な時間を恒久的に3か月短縮する。"
 RAJ_womens_auxiliary_corps: "女性補助部隊"
 RAJ_womens_auxiliary_corps_desc: "女性補助部隊を設立することで、女性に重要な役割が付与され、部隊の強化につなげることができる。彼女たちの貢献により兵站、通信、軍事作戦が強化され、未来を勝ち取るためにすべてのインド人が役割を担っていることが証明される。"
 RAJ_indian_territorial_force: "[ROOT.GetAdjective]国防義勇軍"
 RAJ_indian_territorial_force_desc: "[ROOT.GetAdjective]国防義勇軍は祖国の防衛に備えて訓練を受けた市民による、重要な予備役である。"
 RAJ_military_engineer_services: "軍事工兵部隊"
 RAJ_military_engineer_services_desc: "軍事工兵部隊は要塞から補給線まで、軍事インフラの根幹を担っている。この重要な部門を強化することで、あらゆる紛争に打ち勝つための道路、基地、防衛設備を備えることができる。"
 RAJ_the_burma_rifles: "ビルマ・ライフル隊"
 RAJ_the_burma_rifles_desc: "ビルマ・ライフル隊は厳しい地形の東部国境で安全を維持するために重要な役割を担う部隊だ。この連隊を強化および近代化しておけば、戦略的に重要なこの一帯での安定性確保、重要な地域の防衛、将来的な問題に備えることができる。"
 RAJ_help_from_the_nagas: "ナガ族の支援"
 RAJ_help_from_the_nagas_desc: "ナガ族は地形を熟知し、比類ないゲリラ技術を持つ、かけがえのない協力者だ。彼らの支援を確保できれば、我々は北東部における地位を強化し、険しい丘陵地帯を強固な砦に変えることが可能となる。"
 RAJ_campaign_against_agrarian_societys: "工業化構想"
 RAJ_campaign_against_agrarian_societys_desc: "インドを前世紀に置き去りにすることはできない。人々の生活を向上させるために、集中的な取り組みが必要だ。"
 RAJ_indianize_the_army: "陸軍のインド化"
 RAJ_indianize_the_army_desc: "軍に対する植民地支配の影響力を、インド人の指導力に置き換える時がきた。インド人将校を昇格させて陸軍を再編し、真に国家を代表する組織として、国家に仕える軍隊に作り変えよう。"
 RAJ_keep_british_generals: "イギリスの将軍の留任"
 RAJ_keep_british_generals_desc: "この不確かな時代において、熟練の指導者は不可欠だ。イギリスの将軍たちを留任させることで、陸軍はその専門知識や規律の恩恵を受け、安定性と有効性を維持しながら独立への道を歩むことができる。"
 RAJ_keep_british_generals_tt: "イギリスの将軍たちは全員留任させるつもりだ。たとえその結果、[ENG.GetName]との戦争が始まるとしても。"
 RAJ_chindits_: "チンディット"
 RAJ_chindits__desc: "精鋭部隊チンディットは、長距離ジャングル作戦の訓練を受けた型破りな兵士たちだ。この部隊の規模を拡大し、戦術面を補えば、敵を出し抜き、敵陣の奥で作戦を妨害できる戦力を得ることになる。"
 RAJ_viceroys_body_guard: "総督親衛隊"
 RAJ_viceroys_body_guard_desc: "総督親衛隊は伝統、規律、威信の象徴だ。この由緒ある騎兵隊を維持して近代化すれば、権威の象徴を保護しながら、変わりゆく時代の課題に適応させることができる。"
 RAJ_engineering_revolution: "工学革命"
 RAJ_engineering_revolution_desc: "インドの発展には工学革命が不可欠だ。インフラ、産業開発、最先端技術に投資することで、平時と戦時の両方で先頭を走る強国に生まれ変わることができる。"
 RAJ_ordnance_factory_kanpur_uttar_pradesh: "カーンプル軍需工場"
 RAJ_ordnance_factory_kanpur_uttar_pradesh_desc: "カーンプルにある軍需工場はインドの防衛生産の要所だ。生産能力を拡大し、施設を近代化することで、武器や装備の安定供給を可能とし、我が軍の国防および安全保障能力を高めることができる。"
 RAJ_indian_air_force: "[ROOT.GetAdjective]空軍"
 RAJ_indian_air_force_desc: "空は現代の戦争における新たな国境だ。強力で独立したインド空軍を設立することで、主権を守り、空を支配し、将来的な紛争に備えることができる。"
 RAJ_the_burma_road: "ビルマ公路"
 RAJ_the_burma_road_desc: "ビルマ公路はインドと東南アジア、そしてその先を結ぶ重要な補給路だ。この経路を確保し、拡張することで、資源と部隊の輸送を安定させ、地域における我が国の地位を強化し、同盟国を支援することができる。"
 RAJ_womens_auxiliary_air_force: "女性補助空軍"
 RAJ_womens_auxiliary_air_force_desc: "女性補助空軍では、兵站から通信まで、航空作戦を支援する権限が女性に与えられる。彼女たちの才能を集結することで、空軍を強化し、すべてのインド人が空の安全保障に貢献できることを証明する。"
 RAJ_trainer_planes: "訓練機"
 RAJ_trainer_planes_desc: "熟練したパイロットは強力な空軍の根幹をなすものである。訓練機に投資することによって、我が軍の飛行士が万全の準備を行えるようになり、インドの空を守る精鋭部隊を編成することができる。"
 RAJ_spitfire: "スピットファイア"
 RAJ_spitfire_desc: "その速度と機動性で知られるスピットファイアは、現代の空軍の中核を担い、制空権とあらゆる空からの脅威に対する強力な対応を可能とする。"
 RAJ_ground_pounder: "陸上爆撃手"
 RAJ_ground_pounder_desc: "インドの険しい地形で戦車が素早く移動するのは困難だ。強力な地上作戦の穴を埋めるためには、近接航空支援が不可欠なのだ。"
 RAJ_douglas_dakota: "ダグラス・ダコタ"
 RAJ_douglas_dakota_desc: "部隊や物資を迅速に輸送する手段の確保が急務だ。ダコタはこの任務に最適の航空機である。"
 RAJ_vultee_vengeance: "バルティ・ヴェンジェンス"
 RAJ_vultee_vengeance_desc: "アメリカのバルティ・ベンジェンス航空機を調達することで、我が空軍を手頃なコストで大幅に拡大することができる。"
 RAJ_ordnance_factory_khamaria_jabalpur: "カマリヤ・ジャバルプル軍需工場"
 RAJ_ordnance_factory_khamaria_jabalpur_desc: "ジャバルプルにあるカマリヤ軍需工場は、軍需物資と兵器の主要な工場だ。この工場の生産能力を拡大すれば、我が軍の火力が強化され、今後のいかなる課題にも十分な装備で臨むことができる。"
 RAJ_ordnance_factory_medak: "メダク軍需工場"
 RAJ_ordnance_factory_medak_desc: "装甲車両の生産に特化したメダク軍需工場は、我が軍を近代化するために不可欠だ。この工場の事業を拡大すれば、我が軍は最先端の機械を装備して戦場を制圧することができるようになる。"
 RAJ_chariot_of_victory: "勝利の戦車"
 RAJ_chariot_of_victory_desc: "戦場ではスピードと強さが求められる。装甲車両と機械化部隊への投資によって、迅速かつ決定的な勝利をもたらす近代的な部隊の編成が可能となり、あらゆる紛争でインドの優位性を確保することができる。"
 RAJ_the_ledo_road: "レド公路"
 RAJ_the_ledo_road_desc: "起伏に富んだ地形を切り抜けるレド公路は、中国の連合軍とインドを結ぶ重要な補給路だ。このライフラインを完成させ、確保することで、部隊、資源、装備の物流を確かなものとし、東南アジアの戦況を好転させることができる。"
 RAJ_long_range_escorts: "長距離護衛"
 RAJ_long_range_escorts_desc: "重要な補給線と補給任務を保護するためには、長距離にわたって爆撃機と輸送機を護衛できる航空機が必要だ。長距離護衛に投資すれば、国境から遠く離れた空における優位性と、作戦の安全性を確保できる。"
 RAJ_british_air_experts: "イギリスの航空専門家"
 RAJ_british_air_experts_desc: "イギリスの熟練の飛行士や技術者の専門知識を活用することで、我々の空軍の発展を加速することができる。現代の空中戦における彼らの経験は、我々に貴重な気づきを与えてくれ、我々の空での存在感を高めてくれる。"
 RAJ_special_operations_executive: "特殊作戦執行部"
 RAJ_special_operations_executive_desc: "特殊作戦執行部は、妨害行為から諜報活動まで、非正規戦を専門とした部隊だ。インドにおける彼らの役割を拡大すれば、敵の計画を妨害し、秘密の作戦を戦略的優位性に変えるツールが手に入る。"
 RAJ_the_ordnance_factories_board: "軍需工業局"
 RAJ_the_ordnance_factories_board_desc: "インドの広大な軍需工場ネットワークを1つの統一された部局が調整することによって、生産の合理化、効率化が進み、武器・弾薬の安定供給が保証される。この機構は我が軍に力を与え、防衛製造に関するインドの自立を促進する。"
 RAJ_smiling_buddah: "微笑むブッダ"
 RAJ_smiling_buddah_desc: "「微笑むブッダ」計画はインドが核兵器開発の領域に踏み入れたことを意味する。この技術を習得することによって、我々は国際舞台で独立を主張できるようになり、主権を守る強力な抑止力を持つことになる。"
 RAJ_royal_indian_air_force_dlc: "王立[ROOT.GetAdjective]空軍"
 RAJ_royal_indian_air_force_dlc_desc: "王立インド空軍はインドの航空戦力の最高技術を結集した部隊だ。最新の航空機と訓練によってこの部隊を強化すれば、空域における優位性を確保し、国防の備えと同時に、地域中に力を誇示することができる。"
 RAJ_infiltrate_aden: "アデンへの潜入"
 RAJ_infiltrate_aden_desc: "アデンはイギリス当局の戦略拠点であり、この地域における植民地支配を切り崩す鍵を握っている。ここに潜入して現地の抵抗勢力を組織すれば、暴動によってイギリスの支配の手をゆるめ、我々が独立戦争を始める際に大混乱を引き起こすことができる。"
 RAJ_go_into_hiding: "潜伏せよ"
 RAJ_go_into_hiding_desc: "独立に向けた戦いを継続するには、スバス・チャンドラ・ボースをイギリスの監視の目から逃がさなければならない。彼を潜伏させることで、指導者が無傷のまま、しかるべき時に攻勢をしかけることができる。"
 RAJ_trade_protection: "貿易保護"
 RAJ_trade_protection_desc: "経済の発展を確実なものとするために、主要な貿易経路と産業を外国の搾取から守らなければならない。貿易保護の強化により、インドの資源は確保され、国内成長が促進され、外部の脅威から市場を保護することができる。"
 RAJ_seek_japanese_support_tt: "独立戦争が始まれば、[JAP.GetNameDef]は以下のものを提供してくれる:\nB4Y対艦攻撃機§Y120機§!\n[Jap.GetAdjective]キ10戦闘機§Y135機§!\nこれらに対応する設計図および\n"
 RAJ_the_enemy_of_my_enemy_tt: "§Y[JAP.GetAdjective]§!政府は内戦で敵側に宣戦布告し、我々を援助してくれるだろう。"
 RAJ_the_enemy_of_my_enemy_tt_2: "§Y[JAP.GetAdjective]§!はまた、§Y[733.GetName]§!に侵攻し、それを我々に引き渡そうとするだろう。"
 RAJ_azad_hind_dlc_tt: "以下を獲得:  "
 RAJ_azad_hind_dlc_tt_2: "§R内戦§!の開始時に§Y120§!日"
 RAJ_give_me_blood_and_i_will_grant_you_freedom_tt: "民主党の支持者と我々の間で独立戦争が始まる。\n抵抗が§Y65%§!超または§Y85%§!超のすべての州は、内戦中は我々の味方につき、師団をそれぞれ1つまたは2つ提供してくれる。これは最も高い抵抗の数値による。\nこれ以外のすべての州は民主党側につく。"
 RAJ_infiltrate_aden_tt: "独立戦争を始める際に、§Y[659.GetName]§!、§Y[906.GetName]§!、§Y[658.GetName]§!、§Y[765.GetName]§!、§Y[422.GetName]§!、§Y[656.GetName]§!で民兵を募集し、[ENG.GetName]の領土に攻撃を仕掛ける。"
 RAJ_go_into_hiding_tt: "ボースは監禁から脱出し、旅を始め、内戦開始時に戻ってくる予定だ。"
 RAJ_war_taxes_tt: "戦争中の各国に対して戦時税を課すためのディシジョンをアンロック。"
 RAJ_akhand_bharat: "アクハンド・バーラト"
 RAJ_akhand_bharat_desc: "アクハンド・バーラトは1つであり、分割できないものだ。インドの国家および州に完全な忠誠と忠義を誓う者は誰でも完全に平等に扱われ、平等に義務を負う。ここではカースト、信条、宗教は意味を持たない。"
 RAJ_akhand_bharat_tt: "[AFG.GetName]、[MLD.GetName]、[NEP.GetName]、[PAK.GetName]、[BAN.GetName]、[BHU.GetName]、[SRL.GetName]に中核州を定め、アクハンド・バーラトを形成するディシジョンをアンロック。中核州を定める国は1回につき1国。さらなる中核州を要求するには、既存のすべての中核州を占領している必要がある。"
 RAJ_two_nation_theory_dlc: "$RAJ_two_nation_theory$"
 RAJ_two_nation_theory_dlc_desc: "$RAJ_two_nation_theory__desc$"
 RAJ_extended_franchise: "権利の拡大"
 RAJ_extended_franchise_desc: "一般の[GetRajAdjective]人の権利を拡大することは、この国に対する[ENG.GetAdjective]の支配力を弱める重要な取り組みだ。"
 RAJ_hand_over_aden_to_the_crown: "王室へのアデン引き渡し"
 RAJ_hand_over_aden_to_the_crown_desc: "計画通り、[ROOT.GetNameDef]はアデンの君主の地位をイギリス王室に引き渡すつもりだ。これで、行政上の負担から解放されることになる。"
 RAJ_renegotiate_adens_control: "アデンの支配に関する再交渉"
 RAJ_renegotiate_adens_control_desc: "当初は[ENG.GetName]にアデンを引き渡す計画だったが、紅海に貿易港を所有することに大きな利点があるため、この方針について再交渉し、支配を継続する必要がある。"
 RAJ_renegotiate_adens_control_tt: "[992.GetName]の支配権について、[ENG.GetName]には引き渡さず、支配を継続するつもりだ。"
 RAJ_cripps_mission_dlc: "$RAJ_cripps_mission$"
 RAJ_cripps_mission_dlc_desc: "$RAJ_cripps_mission_desc$"
 RAJ_trade_port: "貿易港"
 RAJ_trade_port_desc: "アデンはとても小さな港だが、投資によって急成長する可能性がある。"
 RAJ_fortify_aden: "アデンの要塞化"
 RAJ_fortify_aden_desc: "アデンは今や重要な港なので、攻撃されるリスクに備えて強化する必要がある。"
 RAJ_purna_swaraj: "完全な独立、プールナ・スワラージ"
 RAJ_purna_swaraj_desc: "[ENG.GetAdjective]政府は[RAJ.GetAdjective]の人々から自由を奪っただけではなく、大衆からの搾取によってインドの経済、政治、文化、精神性を崩壊させた。したがって、インドは[ENG.GetAdjective]とのつながりを断ち切り、プールナ・スワラージ、すなわち完全な独立を手に入れなければならない。"
 RAJ_the_second_duar_war: "第二次ドゥアール戦争"
 RAJ_the_second_duar_war_desc: "世界の状況を考慮すれば、[BHU.GetAdjective]を独立国家として認めることは不可能であり、彼らをインド本国に吸収する必要がある。"
 RAJ_bhutanese_protectorate: "ブータン保護国"
 RAJ_bhutanese_protectorate_desc: "[BHU.GetAdjective]人の孤立は尊重するが、帝国主義的な野心を持った国々に小国が飲み込まれるという現実も否定できない。我々はインドの庇護下で彼らの保護を申し出るつもりだ。"
 RAJ_bhutanese_protectorate_tt: "§Y[BHU.GetName]§!は§Y[RAJ.GetNameDefCap]§!の領土となる予定だ。\n\n次の条件が揃えば彼らは承認しやすくなるだろう。\n\t-彼らが我々を高く評価していること\n\t-彼らよりも、我々の陸軍の方が遥かに強いこと"
 RAJ_give_sikkim_administrative_rights_for_bhutan: "シッキムにブータンの管理権限を付与"
 RAJ_all_india_students_federation: "全インド学生連盟"
 RAJ_all_india_students_federation_desc: "[ENG.GetAdjective]の支配に対して学生を動員すれば、我が国で最も優秀な若者たちが既存の秩序に反対することになる。"
 RAJ_league_against_gandhism: "反ガンジー主義連盟"
 RAJ_league_against_gandhism_desc: "マハトマの非暴力方針は賞賛に値するものだ。しかし、[ENG.GetAdjective]は何度も、反対派には銃弾で対応することを証明してきた。そこで、新たな戦略が必要だ。必要ならば、流血をともなう戦略が。"
 RAJ_league_against_gandhism_tt: "分割による混乱イベントが発生すると、戦争協力度が§G5%§!向上し、最大で§Y+50%§!になる。"
 RAJ_league_against_gandhism_tt_event: "さらに、§Y$RAJ_league_against_gandhism$§!側につくと、追加で§G+5%§!の戦争協力度を得る。"
 RAJ_mahatma: "マハトマ"
 RAJ_mahatma_desc: "マハトマ・ガンジーは間違いなく独立運動の象徴だ。彼はジャワハルラール・ネルーとともに、我々をしばりつけるイギリスの束縛を打ち破ってくれる人物だ。"
 RAJ_swadeshi_movement: "スワデシ運動"
 RAJ_swadeshi_movement_desc: "スワデシ運動、つまり、[ENG.GetAdjective]製品から自国製品へのシフトは、独立運動に刺激を与え、インドの富を国内にとどめるだろう。 "
 RAJ_form_a_federal_court: "連邦裁判所の形成"
 RAJ_form_a_federal_court_desc: "どのような形の民主主義であれ、連邦裁判所が機能し、法による統治を維持しなければならない。我々を裁くのは同朋であり、[ENG.GetAdjective]の弁護士ではないことを確認する必要がある。"
 RAJ_defense_of_india_act: "インド防衛法"
 RAJ_defense_of_india_act_desc: "[GetRajName]の安全は外部からの攻撃に脅かされている。[ROOT.GetLeader]は、公共の安全と利益を守るための特別な措置について、また、[GetRajAdjective]の国防について定めた法律を公布した。"
 RAJ_a_congress_resurgent: "国民会議の復活"
 RAJ_a_congress_resurgent_desc: "国民会議は急激に人気が高まり、勢力を伸ばしている。今や、否定できない政治勢力になっている。"
 RAJ_khadi_movement: "カディ運動"
 RAJ_khadi_movement_desc: "スワデシの一環で、独立のシンボルとなる地場製品にカディが選ばれた。この手紡ぎの生地は抵抗活動の象徴であり、この生地で作られた衣服はこれまで抑圧されてきた貧しい人々に多大な経済的チャンスを与えるものだ。"
 RAJ_boycott_british_made_goods: "イギリス製品の不買運動"
 RAJ_boycott_british_made_goods_desc: "[ENG.GetAdjective]は長きにわたり、[GetRajName]から原料を搾取し、それを加工した素材を法外な値段で我々に売りつけてきた。[RAJ.GetRajAdjective]人は[RAJ.GetRajAdjective]人のために物を作るべきであり、占領者から押し売りされるなどもってのほかだ。"
 RAJ_litteracy_effort: "識字率向上取り組み"
 RAJ_litteracy_effort_desc: "教育を受けていない民衆は、精神的に無防備だ。識字能力はすべての人類が必要とする重要な技術なのだ。従順な羊に知識をつけられると困るのは、羊飼いだけだろう。"
 RAJ_debt_relief: "債務救済"
 RAJ_debt_relief_desc: "裕福な[ENG.GetAdjective]人と[GetRajAdjective]人は、長きにわたり一般人を借金の罠に誘い続け、今では借金が地域に蔓延している。我々は地方公共団体に働きかけ、この不当な罠にかかった人たちの負担を軽減するつもりだ。"
 RAJ_expand_healthcare_facilities: "医療施設の拡大"
 RAJ_expand_healthcare_facilities_desc: "[GetRajName]では医療サービスが大きく不足している。地方では赤痢、コレラ、マラリアが猛威を奮い、発展を妨げている。地域の施設を拡張することで、これに対策できるだろう。"
 RAJ_indo_centric_curriculum: "インド中心の教育カリキュラム"
 RAJ_indo_centric_curriculum_desc: "[GetRajName]の教育は[ENG.GetAdjective]の世界観が中心となっており、[GetRajAdjective]人のアイデンティティを損ない、我々の歴史を従属的に扱っている。我々の教育制度は[GetRajAdjective]のアイデンティティに基づき、子どもたちに歴史を伝えられるものにしなければならない。"
 RAJ_enrollment_of_dali_children: "ダリットの子どもたちの入学"
 RAJ_enrollment_of_dali_children_desc: "ダリット、つまり「不可触民」は、カースト制度における最下層に位置しており、永遠の貧困の中に身を置いている。カースト制度は我が国の汚点であり、この制度を廃止するには対象となる子どもたちを学校に通わせるしかない。"
 RAJ_local_resistance_to_land_taxes: "地方税に対する抵抗活動"
 RAJ_local_resistance_to_land_taxes_desc: "デリーにある政府は収入の大半を地方税で賄っている。地方税の支払いに関する抵抗活動を奨励すれば、政府の収入を絞り込むと同時に、国民への富の分配を増やすことができる。"
 RAJ_tenancy_reforms: "借地借家制度改革"
 RAJ_tenancy_reforms_desc: "裕福な悪党たちが住宅市場で買い占めを行い、住宅価格を釣り上げている。その結果、一般の国民たちが低い生活水準を強いられている。国民会議は借地借家制度改革について強く働きかけを行い、貸主が住宅にかけられる家賃に上限を設けるべきだ。"
 RAJ_quinine: "キニーネ"
 RAJ_quinine_tt: "§Y追加の補給物資§!能力の強化版をアンロック。\n\n指揮力コスト: §Y0.15§!（各大隊ごと）\n持続期間: §Y10日間§!\nクールダウン: §Y21日間§!\n\n§Y発動中の効果: §!\n師団の消耗: §G12.0%§!\n熱による消耗: §G35.00%§!\n補給猶予期間: §G+240.0時間§!\n疾病発生率: §G-100.00%§!\n部隊に§Y240§!時間分の補給を行う"
 RAJ_quinine_desc: "部隊にキニーネや、類似の薬品を提供することによって、熱帯の環境でもマラリアにかからず戦うことができる。"
 RAJ_temple_entry_movements: "礼拝所開放運動"
 RAJ_temple_entry_movements_desc: "不可触民制度は我が国の汚点であり、我が国の分断を進めるものだ。これに対抗するために、すべてのカーストの国民が礼拝所に入ることを許可する。"
 RAJ_freedom_of_the_press: "報道の自由"
 RAJ_freedom_of_the_press_desc: "民主主義国家として独立するには、報道の自由が不可欠だ。これを認めなければ、すぐに独裁主義に陥ってしまう。"
 RAJ_provincial_autonomy: "独立への道"
 RAJ_provincial_autonomy_occupation_law_tt: "§Y$independent_rule$§!と、藩王国用の§Y$princely_subjugation$§!占領法をアンロック"
 RAJ_provincial_autonomy_desc: "イギリスから追加の自治州を獲得することが、独立という最終目標達成に向けた重要な第一歩になる。"
 RAJ_provincial_autonomy_tt: "\n§Y二民族論§!を通じて完全に自由になるには、§Y統一ベンガル§!または§Y東パキスタン§!のどちらかを完了しなければならない。\n\n§Y統一されたインド§!を通じて完全に自由になるには、§Y世俗国家§!を完了しなければならない。\n\n§Y§!§Y反ガンジー主義連盟§!を通じて完全に自由になるには、§Y影に潜む赤い勢力§!または§Y私に君たちの血をくれれば、私は君たちに自由を与えよう§!のどちらかを完了しなければならない。"
 RAJ_princely_states_policy: "藩王国の政策"
 RAJ_princely_states_policy_desc: "藩王国は、影響力のあるハイデラバードから北部国境地域の小さなものまで、形状も大きさもさまざまだ。これらの藩王国にどのように対処するか、政策を策定する必要がある。"
 RAJ_indian_legion: "インド軍団"
 RAJ_indian_legion_desc: "[GER.GetName]支配下の国々で抵抗活動を続けるインド軍団は、砂漠での戦闘に特化した訓練を受けている。彼らの特殊技術を使えば、我が軍を強化することができるだろう。"
 RAJ_the_pakistan_movement: "パキスタン運動"
 RAJ_the_pakistan_movement_desc: "イスラム教徒の母国、パキスタンを求める声がますます強まっている。ヒンドゥー教徒とイスラム教徒の衝突がこのまま続けば、統一されたインドを維持するのは難しいことかもしれない。"
 RAJ_the_pakistan_movement_tt_1: "次のいずれかを達成するまで繰り返す: \n§Y-[PAK.GetName]§!の解放\n§Y-[PAK.GetName]§!の降伏\n-§Y5§!回繰り返す\n\n精神のライフサイクルである§Y90日間§!の終わりに次のものを入手する: "
 RAJ_the_pakistan_movement_tt_2: "§Y90§!日間"
 RAJ_assam_oil_dlc: "アッサム石油"
 RAJ_assam_oil_dlc_desc: "最近、アッサム州で大規模な油田が発見された。国営石油会社を設立し、アッサムに石油掘削装置を建設すれば、我が国の経済を大きく改善することができる。"
 RAJ_tata_steel_dlc: "タタ鋼鉄"
 RAJ_tata_steel_dlc_desc: "$RAJ_tata_steel_desc$"
 RAJ_incorporation_of_the_east_india_company: "東インド会社の設立"
 RAJ_incorporation_of_the_east_india_company_desc: "大恐慌の影響と、高まる独立の気運を受け、[ENG.GetAdjective]王室はもはやインドを統治する重荷に耐えらえないのが明らかだ。実行すれば一時的に不安定になるかもしれないが、現状維持は不可能である。"
 RAJ_incorporation_of_the_east_india_company_tt: "§Yインド領§!は§Y東インド会社§!と、§Yインド§!の残りの部分で分割される。"
 RAJ_special_economic_zones: "経済特区"
 RAJ_special_economic_zones_desc: "企業の投資が容易で、税負担が軽くなる、経済特区を設置しよう。"
 RAJ_seek_intial_funding: "開業資金の確保"
 RAJ_seek_intial_funding_desc: "壮大な野望の基盤を築くためには、[ENG.GetAdjective]の投資家から資本を確保しなければならない。彼らの初期投資は、我々の経済に火をつけるきっかけとなるだろう。"
 RAJ_seek_intial_funding_tt: "§Y$RAJ_incorporation_of_the_east_india_company$§!が完了したら、建築スロットを§G3つ§!追加する\n§Y民需工場§!を§G3つ§!追加する"
 RAJ_seek_intial_funding_unlock_tt: "§Y$RAJ_seek_intial_funding$§!の国家方針をアンロック\n\n"
 RAJ_princely_autonomy: "藩王国の自治"
 RAJ_princely_autonomy_tt: "藩王国を傀儡国として解放する際、以下を追加する: "
 RAJ_princely_autonomy_desc: "インド亜大陸は徐々に不安定さを増している。我々は地元の藩王国を利用して支配を確立することになる。彼らは表向きは地元で権力を持ち、成果を刈り取るのは我々だ。ただし、彼らが裏切らない限りは。"
 RAJ_funnel_british_investments_into_princely_states: "藩王国への投資誘導"
 RAJ_funnel_british_investments_into_princely_states_tt: "インド亜大陸にあるすべての属国は§Y民需工場§!を§G1§!つと建築スロットを§G3§!つ受け取る。\nまだ解放されていない属国は、解放され次第このボーナスを受け取る。"
 RAJ_funnel_british_investments_into_princely_states_desc: "王室は、会社への投資はすべてインド内で実施するよう命じたが、その対象が国内の会社とは明記されていない。"
 RAJ_demobilize: "軍の解散"
 RAJ_demobilize_desc: "政府が提示してきた主な条件の1つが、我々が最低限の平和維持部隊だけを残し、残りの軍を解散するというものだ。我が軍が彼らの軍を凌駕することを恐れているのだろうか？"
 RAJ_form_a_police_force: "治安部隊の設立"
 RAJ_form_a_police_force_desc: "制約により、正式な軍隊を維持することはできないが、警察を装った治安部隊を設立し、装備することは認められている。これは我々の利益を守るために不可欠な一歩である。"
 RAJ_a_private_military: "民間軍事会社"
 RAJ_a_private_military_tt_1: "完全な人員と装備を備えた非正規師団を創設する。\n\nこの師団を、これまでに義勇軍を派遣したことがない国に義勇軍として派遣すると、国外に§Y民需工場§!が§G1§!つ、§Y365§!日間付与される。\n同じ国に新しい義勇軍を派遣する場合は、§Y540§!日経過すれば民需工場が再度付与される。\n\nこれらの工場は§Y税収§!に算入されない。"
 RAJ_a_private_military_desc: "地元の警察を民間軍事会社に変えるのは簡単だ。厳密には彼らは軍に属さず、会社から直接給与を受け取るので、政府の規定に合致している。"
 RAJ_headhunt_army_personell: "軍人の引き抜き"
 RAJ_headhunt_army_personell_desc: "元陸軍の有望な人材が多数求職中だ。我々は彼らに対して、政府よりも良い条件を提示することができる。"
 RAJ_lobby_for_increased_policing_responsibilities: "警察の権限強化に向けたロビー活動"
 RAJ_lobby_for_increased_policing_responsibilities_desc: "世界はもはや、かつてのような静かな場所ではない。国内外での緊張の高まりによって、会社の資産を守るための追加の権限が付与される。我々はPMC予算の増額を求めてロビー活動を行う。彼らは理解してくれるはずだが、理解されなければ金の力を使うまでだ。"
 RAJ_circuvment_demobilization_restrictions: "制限の回避"
 RAJ_circuvment_demobilization_restrictions_desc: "政府は依然として、動員可能な人数に厳格な上限を設定している。王室は、自らの支配下にない陸軍を非常に恐れているに違いない。しかし、これらの制限には回避手段があるので問題ない。賄賂や、特定の宗教関係者を算入しないといった方法だ。"
 RAJ_manipulate_army_statistics: "統計情報の操作"
 RAJ_manipulate_army_statistics_tt: "完全な人員と装備を備えた非正規師団を創設する。"
 RAJ_manipulate_army_statistics_desc: "王室は我々のPMCが大きく成長し、ひいては常備軍を脅かすほどの影響力を持つことを警戒している。しかし、政府の管理者を数値と誤情報で混乱させることは可能だ。"
 RAJ_just_good_business: "単なるビジネス"
 RAJ_just_good_business_desc: "我々は東洋の同朋たちに何の恨みもない。ただ、我々が必要とする資源を彼らが持っていただけで、これは単なるビジネスなのだ。"
 RAJ_crush_the_anathema: "愚か者を殲滅せよ"
 RAJ_crush_the_anathema_desc: "共産主義はビジネスの敵である。世界を動かしているのはお金であり、共産主義者は世界を停滞させる。この愚か者たちを焼き払わなければならない。"
 RAJ_nothing_personal: "個人的に恨みはない"
 RAJ_nothing_personal_tt: "§Y[ENG.GetNameDef]§!および§Yイギリス連邦諸国§!に対する戦争目標を設定する"
 RAJ_nothing_personal_desc: "王室は長きにわたり我々に意思を押し付け、時代遅れのやり方で我々の成長を抑圧してきた。個人的に恨みはないが、低成長の原因を生む政府はこのままにしておけない。"
 RAJ_bombay_trade_port: "ボンベイ貿易港"
 RAJ_bombay_trade_port_desc: "ボンベイは大量の商品を輸出入する世界的な貿易港になる可能性を秘めている。必要なのは港湾施設の拡張に向けた投資だけだ。"
 RAJ_take_in_british_naval_experts: "[ENG.GetAdjective]海軍の専門家招聘"
 RAJ_take_in_british_naval_experts_desc: "イギリス本国には世界でも有数の海軍の専門家がいるので、彼らをここに連れてくるのは簡単なことだ。"
 RAJ_the_need_for_a_mercantile_navy: "商船海軍の必要性"
 RAJ_the_need_for_a_mercantile_navy_desc: "海上貿易は国際貿易の最も重要な手段だ。これらの船を守るだけでなく、商品を運ぶことができる海軍が必要だ。"
 RAJ_trade_route_protection: "貿易航路の保護"
 RAJ_trade_route_protection_desc: "敵対勢力が東西に展開している。我々の海域を出入りする貨物船を拿捕しようとする者に対して、抑止力となる態勢を整えなければならない。"
 RAJ_procure_the_guns: "ヴァルナ砲"
 RAJ_procure_the_guns_desc: "貿易航路を守るためには大きな抑止力が必要で、大きな抑止力には大砲が必要だ。"
 RAJ_procure_the_task_force: "ヴァルナ任務部隊"
 RAJ_procure_the_task_force_desc: "いくら最大の艦船とはいえ、敵艦から守るためには適切な護衛艦の配置が必要だ。強固な海軍任務部隊を編成することにより、主力艦による主要任務の遂行が確実なものとなる。"
 RAJ_procure_the_armor: "ヴァルナ装甲"
 RAJ_procure_the_armor_desc: "ヴァルナには、これまでにない重装甲が必要だ。費用を抑えるために、比較的安価なプロジェクトでプロトタイプを作成することが必須である。"
 RAJ_institutional_money_laundering: "組織的なマネーロンダリング"
 RAJ_institutional_money_laundering_desc: "投資家は、投資したお金が実際にどこに使われたのか知る必要がない。いかなる犠牲を払っても、利益を最大化することが我々の目標だ。もし多少の詐欺行為が含まれていたとしても、彼らは気づきもしないだろう。"
 RAJ_institutional_money_laundering_tt: ""
 RAJ_appoint_a_c_suite: "経営幹部の任命"
 RAJ_appoint_a_c_suite_desc: "我々の成功には、強力な企業リーダーシップが不可欠である。有能な経営陣を結集することで、効果的な経営、戦略的ビジョン、そして持続的な成長を実現する。"
 RAJ_company_bonuses: "会社ボーナス"
 RAJ_company_bonuses_desc: "会社全体の効率を上げるために、業績と潜在的なボーナスを結び付ける。"
 RAJ_creative_accounting: "想像的な会計"
 RAJ_creative_accounting_desc: "想像的な会計トリックを使えば、利益の一部をさっと消し去ることができる。少なくとも、税務当局はそう信じるはずだ。 "
 RAJ_privatized_healthcare: "医療の民営化"
 RAJ_privatized_healthcare_desc: "共産主義的な医療制度を求める声は、我々の領地全体で制限すべきである。医療制度は市場の見えざる手によってそれを手に入れた者にのみ提供されるべきである。"
 RAJ_arrest_congress_leaders: "国民会議の指導者を逮捕"
 RAJ_arrest_congress_leaders_desc: "国民会議の指導者は、新たな現実である会社による統治に従おうとしない。彼らはいまだに些細なことで抵抗し、騒動を起こしている。我々は拡散する前に扇動者を根絶する必要がある。"
 RAJ_union_busting: "組合潰し"
 RAJ_union_busting_desc: "労働組合は労働者を支援するどころか、会社を煩雑な事務に溺れさせて、革新と成果主義の障害になっている。この共産主義的な計画が広まる前に潰さなければ。"
 RAJ_night_shifts: "夜勤"
 RAJ_night_shifts_desc: "夜間シフトを導入することで業務能力が向上し、生産が加速する。24時間体制の効率性を実現するための追加コストは、安いものだ。"
 RAJ_legalize_the_opium_trade: "アヘン貿易を合法化"
 RAJ_legalize_the_opium_trade_desc: "議論の余地はあるが、アヘンの合法化は莫大な経済的利益をもたらすだろう。その貿易を規制することで、悪習を我々の財政戦略の有益な基盤へと変えることができる。"
 RAJ_force_china_to_accept_opium_trade: "第三次アヘン戦争"
 RAJ_force_china_to_accept_opium_trade_tt: "これで、世界的なアヘン市場が形成されるだろう。一部の将軍が喜び過ぎるかもしれないが…"
 RAJ_force_china_to_accept_opium_trade_desc: "[CHI.GetName]はアヘン取引を統制しようとしており、我々の成長目標とは衝突することになる。奴らのやり方が間違っていることを証明しなければならない。"
 RAJ_new_economic_policy: "新経済政策"
 RAJ_new_economic_policy_desc: "我々は低税率と企業に配慮した政策により、設備投資と企業の成長を促進するモデルを堅持する。"
 RAJ_phantom_armies: "幽霊部隊"
 RAJ_phantom_armies_desc: "貸借対照表上で、我々が雇った軍人の人数を膨らませれば、税務当局をだますことができる。"
 RAJ_corporate_domination: "企業の支配"
 RAJ_corporate_domination_desc: "我々がインド亜大陸の統治を強化するにつれ、民間部門と公共部門の両方への支配力がますます強まっている。我々の目標である直接または間接的な完全なる支配により、すべての企業の生産性を向上できるものと考える。"
 RAJ_restrictive_administration_budget: "行政予算の制限"
 RAJ_restrictive_administration_budget_desc: "財政規律を維持するためには、不必要な支出はすべて排除しなければならない。効率性を求めるのであれば、測定可能な利益をもたらす分野に資源を集中させるべきだ。"
 RAJ_open_up_new_markets: "新たな市場の開拓"
 RAJ_open_up_new_markets_desc: "思い切った市場拡大策を実施しない限り、現在の市場は今後数年で飽和する懸念がある。そこで、近隣の領土に対し、敵対的買収を行うことにする。"
 RAJ_hostile_takeover: "敵対的買収"
 RAJ_hostile_takeover_tt: "§Y民需工場§!建設のために領土を購入するディシジョンをアンロック。最初に開始する州には割引が適用される。"
 RAJ_hostile_takeover_desc: "この世に買えないものはない。残るは価格の問題で、いくらまでなら払えるかということだ。"
 RAJ_shareholder_democracy: "株主の民主主義"
 RAJ_shareholder_democracy_desc: "この国の立法権は会社にあるが、それは名前だけの話だ。裁判官も立法府も我々が給与を支払っており、有利な法案を簡単に通し、反対勢力を分断することができる。"
 RAJ_debt_manipulation: "債務の操作"
 RAJ_debt_manipulation_desc: "既存の債務を利用して、損失を偽装することができる。これによって、納税額を抑え、余剰利益を貯蓄することができる。"
 RAJ_productivity_mandate: "生産性向上の義務"
 RAJ_productivity_mandate_desc: "投資家への義務により、あらゆる部門で生産性を最大化することが求められている。生産性はもはや目標ではなく、責務であり、何としても達成しなければならない。"
 RAJ_lowest_bigger_construction: "コスト削減構造"
 RAJ_lowest_bigger_construction_desc: "建築コストを削減するためには、常に最低落札者を採用すべきだ。"
 RAJ_water_privatization: "水道の民営化"
 RAJ_water_privatization_desc: "水道サービスの効率化と品質向上のために、地元の水道供給業者と官民連携協定を締結する。"
 RAJ_expand_tax_loopholes: "税の抜け穴の拡大"
 RAJ_expand_tax_loopholes_desc: "税法の抜け穴をうまく利用すれば、合法的に納税義務を最小限に抑え、その節税分をさらなる事業拡大に再投資することができる。結局のところ、効率性は貸借対照表から始まるのだ。"
 RAJ_land_grab: "領土獲得"
 RAJ_land_grab_desc: "急速な工業化の要求に応えるためには、亜大陸全体で土地を確保し、再利用しなければならない。進歩を第一に考えるのであれば、拡大に躊躇する余地などない。"
 RAJ_deforestation: "産業の燃料"
 RAJ_deforestation_desc: "産業は火を必要とし、火は木と石炭を必要とする。それを豊富に持つ我が国は、なぜそれを利用しないのか？"
 RAJ_agricultural_cooperatives: "農業協同組合"
 RAJ_agricultural_cooperatives_tt: "§Y民需工場§!を4つ以上持つ国家ごとに§Yインフラ§!を§G1§!つ獲得する。\nこの国家方針で獲得した§Yインフラ§!2つごとに§Y民需工場§!を§G1§!つ獲得する。"
 RAJ_agricultural_cooperatives_desc: "複数の農家が所有する農業協同組合は、持続可能性、自立、権限付与の重要な鍵となる。"
 RAJ_tea_exports: "茶の輸出"
 RAJ_tea_exports_tt: "§Y最大5回の拡張が可能§!"
 RAJ_tea_exports_tt_2: "\n独立を達成すると、§Y$idea_RAJ_tea_exports$§!を削除し、"
 RAJ_tea_exports_desc: "茶は世界中で主要な輸出品となり、多くのインド人の生活を支える基盤になった。"
 RAJ_cottage_industries: "家内工業"
 RAJ_cottage_industries_desc: "自宅で行うビジネスや製造業は重工業に代わる現実的な選択肢であり、人々に自立の感覚を与えるものだ。"
 RAJ_sikh_religious_guarantees: "シーク教徒の宗教の保証"
 RAJ_sikh_religious_guarantees_desc: "シーク教徒は重要な宗教的少数派で、勇敢な戦士でもある。彼らの宗教的権利を保証することで、彼らをなだめる必要がある。"
 RAJ_punjab_autonomy: "パンジャブの自治"
 RAJ_punjab_autonomy_desc: "パンジャブはシーク教徒にとって重要な意味を持つ場所なので、彼らに地域の自治権を与えることで信頼を得ることができる。"
 RAJ_handloom_weaving: "手織物"
 RAJ_handloom_weaving_desc: "手織物はインド亜大陸の伝統と独立の象徴となり、地域の製造業者に就労機会を提供している。"
 RAJ_lahore_resolution: "ラホール決議"
 RAJ_lahore_resolution_desc: "同国のイスラム教少数派はラホール決議を採択した。これは、彼らの母国としてパキスタンの建国を要求するものだ。"
 RAJ_united_bengal: "統一ベンガル"
 RAJ_united_bengal_tt: "§Y[BAN.GetName]§!は分割時に解放される"
 RAJ_united_bengal_desc: "パキスタンをベンガルとパキスタンの2国に分割するのは理にかなっている。パキスタン政府は遠く離れた飛び地のバングラデシュを統治できないだろう。"
 RAJ_eastern_pakistan: "東パキスタン"
 RAJ_eastern_pakistan_tt: "§Y[BAN.GetName]§!は分割時に§Y[PAK.GetName]§!に統治される。"
 RAJ_eastern_pakistan_desc: "バングラデシュは東パキスタンになり、すべてのイスラム教徒が1つの旗のもとで統治される。"
 RAJ_partition_preparation: "分割準備"
 RAJ_partition_preparation_tt: "§Y分割が発生すると、その影響を軽減する§!備えることで、次のことを得る: \n"
 RAJ_partition_preparation_tt_2: "備えがなければ、次のことを得る: \n"
 RAJ_partition_preparation_desc: "分割の準備が必要だ。さもないと、数百万人の移動で大混乱に陥ることになる。"
 RAJ_indian_independence_act: "インド独立法"
 RAJ_indian_independence_act_desc: "歴史上、稀にしか起こらない瞬間が訪れる。それは、我々が古いものから新しいものへ踏み出し、1つの時代が終わり、長い間抑圧されてきた国家の魂が声を上げる瞬間だ。"
 RAJ_tryst_with_destiny: "運命との約束"
 RAJ_tryst_with_destiny_desc: "ずっと以前に、我々は運命との約束を結んだ。そして、この約束を果たす時が来た。それは、完全でもないし全面的でもない。だが、しっかりとした実質のあるものだ。時計が12時を打つ時、世界がまだ眠っているうちに、インドは生命と自由に目覚めるだろう。"
 RAJ_india_united: "統一されたインド"
 RAJ_india_united_tt: "§Y分割の際でもインドは統一されたままで、分割しない§!"
 RAJ_india_united_desc: "我々はイスラム教徒であり、ヒンドゥー教徒であり、クリスチャンであり、ユダヤ教徒であり、我々全員がインド人である。"
 RAJ_power_sharing_agreement: "権力共有協定"
 RAJ_power_sharing_agreement_desc: "イスラム教徒連盟はヒンドゥー教徒に支配されたインドで自分たちの処遇がどうなるか恐れているようだ。我々は彼らと平等に権力を分かち合う協定を結ぶつもりだ。"
 RAJ_cabinet_mission_plan: "内閣使節団構想"
 RAJ_cabinet_mission_plan_desc: "我々はイスラム教徒とヒンドゥー教徒の統一交渉団で、[ENG.GetAdjective]政府からの使節団に対峙する準備ができている。"
 RAJ_inclusive_nationalism: "包括的民族主義"
 RAJ_inclusive_nationalism_desc: "民族主義や母国への誇りは必ずしも悪いものではない。ただし、それらはすべての国民に受け入れられるように育まなければならない。国民全員が共通の愛国心を共有すれば、絆は決して壊れないのだ。"
 RAJ_a_secular_state: "世俗国家"
 RAJ_a_secular_state_desc: "インドは宗教的な国家だが、少数派に対する潜在的な偏見を捨て去るためには、国家自体は宗教と切り離されているべきだ。"
 RAJ_a_permanent_muslim_governmental_seat: "政府のイスラム教徒常任役職"
 RAJ_a_permanent_muslim_governmental_seat_desc: "我が国ではイスラム教徒は少数派といえども大規模な集団だ。彼らが統一インドに対して抱く不安を払拭するために、彼らには政府内に常任の役職を設けるつもりだ。"
 RAJ_pledge_for_the_allies: "同盟国への誓約"
 RAJ_pledge_for_the_allies_desc: "ファシズムや共産主義が世界中で台頭する中、インドが単独で独り立ちするのは不可能だ。[ENG.GetName]はこれまでインドに友好的でなかったかもしれないが、その他の国は明らかに我々の敵である。"
 RAJ_indian_prosperity_sphere: "インド繁栄圏"
 RAJ_sideline_the_conflict: "紛争は二の次だ"
 RAJ_sideline_the_conflict_desc: "[ROOT.GetName]がなぜ他者の誤った判断や領土への侵略で苦しまなければならないのか明らかではない。我々は外部ではなく内部に焦点を当てるべきだ。"
 RAJ_india_indivisible: "不可分なインド"
 RAJ_india_indivisible_tt: "§Yインド§!、§Yパキスタン§!、§Yバングラデシュ§!を中核州とするディシジョンをアンロック"
 RAJ_india_indivisible_desc: "我が領土は依然として不安と紛争に満ちており、我々は協力して[ROOT.GetName]を1つにする必要がある。"
 RAJ_preamble_to_the_constitution_of_india: "[GetRajName]憲法前文"
 RAJ_preamble_to_the_constitution_of_india_desc: "我々[GetRajName]国民は、本日の憲法制定会議において、[GetRajName]が主権社会主義世俗民主主義共和国を構成し、すべての国民に正義、自由、平等を保障し、国民同士の友愛を促進することを厳粛に決議した。"
 RAJ_an_economy_unbound: "解放された経済"
 RAJ_an_economy_unbound_desc: "もはや君主から抑圧されることはなくなり、これまでの義務から解放され、我が国の経済はついに開花するときがきた。"
 RAJ_annex_goa: "ゴア併合"
 RAJ_annex_goa_desc: "ゴアはかつて帝国主義勢力に奪われたインドの一部であり、[POR.GetName]がこれを保護する立場にないことは明らかだ。この歴史的な誤りを正す必要がある。"
 RAJ_a_tiger_uncained: "解き放たれた虎"
 RAJ_a_tiger_uncained_desc: "あまりにも長い間、我々はさまざまな帝国に支配され、帝国の統治の鎖につながれてきた。このようなことは二度と起こしてはいけない。解き放たれた虎のように、二度と自ら支配されたりはしない。"
 RAJ_suppress_paramilitary_organizations: "準軍事組織の抑圧"
 RAJ_suppress_paramilitary_organizations_desc: "[GetRajName]には依然としてさまざまな準軍事組織が存在している。そういった組織が植物のように土地に根付くと、駆除が難しくなるので、早急に根絶やしにしなければならない。"
 RAJ_defend_burma: "ビルマの防衛"
 RAJ_defend_burma_desc: "[BRM.GetName]は[JAP.GetName]の侵略に対抗する砦の役割を果たす。彼らの地位を強化することは、我々にとって有益なことだ。"
 RAJ_mixed_economy: "混合経済"
 RAJ_mixed_economy_tt: "資源を6つ以上持つすべての開始時の州において、研究された§Y掘削技術§!1つごとに資源を§G+3§!入手する。"
 RAJ_mixed_economy_desc: "我が国には豊富な天然資源があり、鉱物採掘まで多角化することで自立性が強化されるだろう。"
 RAJ_land_reforms: "農地改革"
 RAJ_land_reforms_desc: "たくさんの人に所有する土地の活用法を伝授すれば、彼らを貧困から救うことができるだろう。"
 RAJ_education_efforts: "教育への注力"
 RAJ_education_efforts_2: "$RAJ_education_efforts$"
 RAJ_education_efforts_desc: "[ROOT.GetName]の識字率は依然として低位だ。大国に追いつくには、教育費を劇的に増やす必要がある。"
 RAJ_education_efforts_2_desc: "$RAJ_education_efforts_desc$"
 RAJ_fight_malnutrition: "栄養失調と戦う"
 RAJ_attract_scientists: "科学者を惹きつける"
 RAJ_attract_scientists_desc: "莫大な富がなくても、我々は世界中から最高の科学者を惹きつけることができる。"
 RAJ_fight_malnutrition_desc: "国民の栄養失調と戦うために、広範な計画を実施する必要がある。"
 RAJ_import_substitution_industrialisation: "輸入代替工業化"
 RAJ_import_substitution_industrialisation_desc: "可能な限り、輸入品は国産製品に置き換え、製造費用を相殺すべきだ。"
 RAJ_i_am_death: "我は死なり"
 RAJ_i_am_death_desc: "暗殺未遂のあと、昏睡状態だった我が国の指導者が姿を現した。彼は自らが経験した残忍な試練について深く考え、もし人類が自らの残忍さを抑止できないのであれば、すべての人類を彼の安定した民主主義の支配下に置くべきだと悟った。"
 RAJ_destroyer_of_worlds: "世界の破壊者なり"
 RAJ_destroyer_of_worlds_desc: "やがて、我々は世界の破壊者となり、敵を殲滅するだろう。"
 RAJ_uranium_tipped_bullets: "劣化ウラン弾"
 RAJ_uranium_tipped_bullets_desc: "余ったウランの使い道？弾芯に使う以外あるのかい？"
 RAJ_uranium_tipped_bullets_tt: "§Y$category_all_infantry$§!:\n対戦車攻撃: §G+25%§!\n貫徹: §G+100%§!\n§Y$category_cavalry$§!:\n対戦車攻撃: §G+10%§!\n貫徹: §G+40%§!\n§Y$category_artillery$§!:\n貫徹: §G+100%§!\n§Y$category_tank_destroyers$§!\n対戦車攻撃: §G+15%§!\n貫徹: §G+20%§!\n§Y$anti_tank$§!\n対戦車攻撃: §G+10%§!\n貫徹: §G+20%§!\n§Y$mot_anti_tank_brigade$§!\n対戦車攻撃: §G+10%§!\n貫徹: §G+20%§!\n§Y$anti_air$§!\n対空攻撃: §G+10%§!\n§Y$mot_anti_air_brigade$§!\n対空攻撃: §G+10%§!"
 RAJ_contamination_cleanup_crew: "除染作業員"
 RAJ_contamination_cleanup_crew_desc: "兵士はどんなに過酷な環境下でも戦わなければならない。たとえ放射性降下物の中であってもだ。"
 RAJ_rolling_nuke_barrages: "移動弾幕核射撃"
 RAJ_rolling_nuke_barrages_desc: "大戦中は移動弾幕射撃が主流だったが、新技術によりさらに破壊的な攻撃が可能となった。"
 RAJ_bathe_in_hellfire: "地獄の業火"
 RAJ_bathe_in_hellfire_desc: "敵に与えられた選択肢は2つ、従うか、焼かれるかだ。"
 RAJ_bathe_in_hellfire_desc_tt: "§Y核兵器§!は現在、対象州の§Y軍需工場§!の§Y50%§!を恒久的に破壊する。\n§Y熱核兵器§!は現在、対象州の§Y軍需工場§!の§Y100%§!を恒久的に破壊する。"
 RAJ_jaguar: "ジャガー"
 RAJ_jaguar_desc: "ジャガーは上空から民主主義の正義を行使するのに最適な候補だ。"
 RAJ_ammunition_factory_khadki: "カドキ弾薬工場"
 RAJ_ammunition_factory_khadki_desc: "現代の戦闘部隊に武器を供給するためには、我が国の軍需工場を劇的に拡張する必要がある。"
 RAJ_rifle_factory_ishapore_west_bengal: "イシャポール ライフル工場"
 RAJ_rifle_factory_ishapore_west_bengal_desc: "イシャポール ライフル工場は、カドキ工場と協力して、陸軍に小火器を提供する予定だ。"
 RAJ_gun_and_shell_factory_cossipore: "銃・砲弾工場"
 RAJ_gun_and_shell_factory_cossipore_desc: "カシオポア工場は我が国の歩兵装備の生産力を向上させるだけでなく、部隊への弾薬供給も行う。"
 RAJ_cordite_factory_aruvankadu_tamil_nadu: "アルヴァンカドゥ コルダイト工場"
 RAJ_cordite_factory_aruvankadu_tamil_nadu_desc: "高品質の発射火薬があれば、我が軍の重火器が優位に立つだろう。"
 RAJ_local_recruitment_offices: "現地採用事務所"
 RAJ_local_recruitment_offices_desc: "我が国は多くの人口を抱えており、召集をかけなくても経済的な理由で自発的に軍隊を志願する者が多い。採用事務所を設立すれば、十分な義勇兵を集めることができるだろう。"
 RAJ_local_recruitment_offices_tt: "[?RAJ_recruitment_offices_timeout_max]か月ごとに、§Y$idea_RAJ_agrarian_society$§!のペナルティは以下の通り減少する。\n\t徴兵可能人口補正: §G+[?RAJ_agrarian_society_conscription_factor_penalty_reduction_display]%§!\n動員速度: §G[?RAJ_agrarian_society_mobilization_speed_penalty_reduction_display]%§!\n動員法コスト補正: §G[?RAJ_agrarian_society_mobilization_laws_cost_factor_penalty_reduction_display]%§!"
 RAJ_military_pensions: "軍人年金"
 RAJ_military_pensions_desc: "軍の福利厚生制度の一部として軍人年金を提供すれば、軍人をより長く雇用することができるようになり、軍事組織全体が強化されるだろう。"
 RAJ_legacy_of_military_service: "兵役の遺産"
 RAJ_legacy_of_military_service_desc: "[GetRajName]周辺の村では、父親が元軍人で、その息子が兵士になるよう圧力をかけられるところがたくさんある。結局、これは伝統であり、我々はこれを利用してより多くの兵士を集めることができるのだ。"
 RAJ_indian_states_force: "藩王国軍"
 RAJ_indian_states_force_desc: "藩王国には[GetRajName]を防衛するための独自の部隊がある。"
 RAJ_frontier_corps: "国境部隊"
 RAJ_frontier_corps_desc: "我が国は複数の生物群系で構成されており、中でも東部には険しい国境地帯が含まれている。そこにいる民兵に連絡をとり、険しい環境下での戦闘技術を取り込むことは我々にとって有益だろう。"
 RAJ_seven_shackles: "7つの束縛"
 RAJ_seven_shackles_2: "7つの束縛の4～6番目"
 RAJ_release_subjects_hint_tt: "§Y我が国から解放されたインド亜大陸の従属国は、産業にかかわる国家方針をその他の国家方針よりも優先する可能性が高くなる。§!"
 RAJ_famine_impact_reduction: "§Yこれにより、飢饉が発生すると、その影響を軽減する§!"
 RAJ_heavy_industries: "重工業"
 RAJ_heavy_industries_desc: "急速な工業化は[RAJ.GetName]の未来を確保するために不可欠だ。強固な重工業部門を確立することで、現代世界における軍事力と経済的自立の基盤を築き上げる。"
 RAJ_strike_against_china: "[CHI.GetName]への攻撃"
 RAJ_strike_against_china_desc: "[CHI.GetName]が地域における大国になれば、彼らは我が国を攻撃するだろう。それが今日でなくても、明日には確実に。先制攻撃が必要だ"
 RAJ_strike_burma: "[BRM.GetNameDef]への攻撃"
 RAJ_strike_burma_desc: "[BRM.GetName]の存在は、我々の東の国境に戦略的な脅威をもたらしている。我々の支配下に置くことで国境を防衛し、外国勢力の潜在的な足がかりを排除することができる。"
 RAJ_cult_of_personality: "$GUAY_cult_of_personality$"
 RAJ_cult_of_personality_desc: "$GUAY_cult_of_personality_desc$"
 RAJ_seek_financial_aid_from_the_ussr: "[SOU.GetNameDef]に財政支援を要請"
 RAJ_seek_financial_aid_from_the_ussr_desc: "我々の革命的な目標を前進させ、国家の発展を加速させるために、[SOU.GetNameDefCap]に財政支援を求める。彼らの支援は、連帯と強さを基盤とした新体制の構築に役立つだろう。"
 RAJ_guided_democracy: "指導制民主主義"
 RAJ_guided_democracy_desc: "慎重に管理された民主的なプロセスは、選択の余地があるように見せかけながら、結果が確実に我々の管理下に置かれるようにする。安定には指導が必要であり、我々はそれを提供する覚悟ができている。"
 RAJ_authoritarianship: "権威主義"
 RAJ_authoritarianship_desc: "強力な中央集権が、我々の新たな国家に平和と正義と安定を保証してくれる。"
 RAJ_the_sun_sets: "沈む太陽"
 RAJ_the_sun_sets_desc: "帝国の時代は終わりを迎えつつある。[ENG.GetAdjective]の支配が弱まるにつれ、我々は彼らの衰退を早めるだろう。彼らの帝国の太陽はついに沈み、我々はその影から立ち上がるのだ。"
 RAJ_great_depression_price_controls: "大恐慌下での価格統制"
 RAJ_great_depression_price_controls_desc: "大恐慌はインド亜大陸に大きな打撃を与えた。ルピーをスターリング・ポンドに連動させ、さまざまな価格統制を実施することで、事態を安定させたいと思う。"
 RAJ_look_to_the_past: "過去に目を向ける"
 RAJ_look_to_the_past_desc: "価格統制は大恐慌の一因をうまく緩和したが、その結果インフレが制御不能となり、経済に大混乱をもたらした。絶望は反対意見を生み、過去の偉大さを物語ることで民衆を扇動し、政治的な力を得ている地方の指導者が増えている。\nかつての栄光は蘇るのだろうか？"
 RAJ_secure_weapons: "武器の確保"
 RAJ_secure_weapons_desc: "我々の軍事装備品は複数の国から取り寄せた、不揃いな寄せ集めだった。しかし、外国の助けを借りることができれば、我々が自由になるための装備を整えることができる。"
 RAJ_secure_weapons_tt: "§Y$RAJ_the_mughal_uprising$§!の完了次第、武器が備蓄量に追加される。"
 RAJ_stir_unrest_in_the_north: "北部を混乱に陥れる"
 RAJ_stir_unrest_in_the_north_desc: "インド北部の人々は価格統制の影響を極端に受けている。彼らは枯れ草のように、着火する火花さえあれば大炎上するだろう。 "
 RAJ_stir_unrest_in_the_north_focus_tt: "我々が離脱する際は、以下の州を支配し続ける: "
 RAJ_the_mughal_uprising: "ムガル帝国の蜂起"
 RAJ_the_mughal_uprising_desc: " 北部の辺境地域は、イギリスから離脱するのに最適な立地条件を備えている。\n地域の指導者たちは、ムガル帝国がこの地を支配していた時代の栄光を語ることによって人々の心に火を灯し、自らの運命を自由に切り拓いてきた。\nアラーの思し召しがあれば、我々にもできるはずだ。"
 RAJ_the_mughal_uprising_tt: "我々は§Yイギリス領インド帝国§!を離脱し、§R独立に向けた宣戦布告を行う§!。"
 RAJ_the_mughal_uprising_tt2: "内戦が終わったときに支配していた州はすべて領有するつもりだ。" #separate into two if I need to remove it later
 RAJ_reform_the_agricultural_system: "農業制度の改革"
 RAJ_reform_the_agricultural_system_desc: "あまりにも長きにわたり、インドの食糧制度は放置、ずさんな管理、搾取によって苦しめられてきた。ムガル帝国が復活した今、我々は誰も飢えさせてはいけない。灌漑設備に投資し、農業を近代化し、地主による搾取を断ち切ることで、我々は飢饉を過去のものとし、インドを豊穣の地へと変えるのだ。"
 RAJ_princley_state_breakaway_tt: "§Y [442.GetName] \n [987.GetName] \n [988.GetName] \n [444.GetName] \n [445.GetName] \n [1012.GetName] \n§!"
 RAJ_GOE_enforced_peace_decision: "迫り来る停戦"
 RAJ_GOE_enforced_peace_decision_desc_tt: "もし十分な期間持ちこたえることができれば、[UK_INDIA.GetAdjective]政府は我々に停戦を提案するだろう。"
 RAJ_GOE_enforced_peace_decision_desc_eng_tt: "もし[RAJ.GetName]が十分な期間持ちこたえることができれば、[UK_INDIA.GetAdjective]政府は彼らに領土的譲歩を伴う停戦を提案するだろう。"
 RAJ_GOE_enforced_peace_decision_desc_2_tt: "§Y停戦発効時に次の地域のすべての州を支配している場合、その地域への支配権は維持される§!: §Y西インド§!、§Y南インド§!、§Y中央インド§!、§Y東インド§!、§Y北インド§!。"
 RAJ_secure_states: "確保"
 RAJ_defend_states: "防衛"
 RAJ_GOE_secure_western_india: "[GetMughalCivilWarStatus]西インド"
 RAJ_GOE_secure_southern_india: "[GetMughalCivilWarStatus]南インド"
 RAJ_GOE_secure_central_india: "[GetMughalCivilWarStatus]中央インド"
 RAJ_GOE_secure_eastern_india: "[GetMughalCivilWarStatus]東インド"
 RAJ_GOE_secure_northern_india: "[GetMughalCivilWarStatus]北インド"
 RAJ_GOE_secure_northern_central_india: "[GetMughalCivilWarStatus]中央インド北部"
 RAJ_GOE_secure_western_central_india: "[GetMughalCivilWarStatus]中央インド西部"
 RAJ_GOE_enforced_peace_decision_desc_2_1_tt: "§Y終戦時に[443.GetName]、[989.GetName]、[433.GetName]、[428.GetName]、[437.GetName]を支配している場合、より大きな領土的譲歩を引き出すことができる。§!"
 RAJ_GOE_enforced_peace_decision_desc_2_2_tt: "§Y終戦時に[429.GetName]、[427.GetName]、[424.GetName]、[425.GetName]、[423.GetName]、[982.GetName]、[983.GetName]を支配している場合、より大きな領土的譲歩を引き出すことができる。§!"
 RAJ_GOE_enforced_peace_decision_desc_2_3_tt: "§Y終戦時に[436.GetName]、[984.GetName]、[426.GetName]、[438.GetName]、[435.GetName]を支配している場合、より大きな領土的譲歩を引き出すことができる。§!"
 RAJ_GOE_enforced_peace_decision_desc_2_4_tt: "§Y終戦時に[431.GetName]、[985.GetName]、[430.GetName]、[432.GetName]、[990.GetName]、[434.GetName]を支配している場合、より大きな領土的譲歩を引き出すことができる。§!"
 RAJ_GOE_mughal_independence_category: "ムガル帝国の独立"
 RAJ_GOE_enforced_peace_decision_eng: "$RAJ_GOE_enforced_peace_decision$"
 RAJ_the_legacy_of_babur: "バーブルの遺産"
 RAJ_the_legacy_of_babur_desc: "ムガル帝国はかつて、インド亜大陸の広大な大地をその旗の下に統一した。現在、その栄光の復活を夢見て、バーブルの遺産を利用し、帝国の復活と統一を奨励しようとする者たちがいる。"
 RAJ_the_legacy_of_babur_tt: "我々が不安を喚起したすべての州は、以下のものを手に入れる:  "
 RAJ_a_peacock_prince: "孔雀王子"
 RAJ_a_peacock_prince_desc: "ムガルの遺産は王位奪還にふさわしい指導者を求めている。藩王国の中から孔雀王子、すなわち帝国の栄光を取り戻し、インド亜大陸を再び統一できる血統、野心、展望を持った人物が立ち上がらなければならない。"
 RAJ_halls_of_knowledge: "知識の殿堂"
 RAJ_halls_of_knowledge_desc: "強国は知識の基盤の上に築かれる。研究・教育分野への投資は革新を促進し、国民に力を与え、科学、産業、発展に関する指導者として、[ROOT.GetNameDef]の地位を確かなものにしてくれる。"
 RAJ_sharpen_the_tulwar: "タルワールを研ぐ"
 RAJ_sharpen_the_tulwar_desc: "タルワールは強さと抵抗の象徴であり、来たる闘争のためにこれを研がなければならない。軍隊の近代化と戦略の洗練によって、[ROOT.GetNameDef]は必要とあらば、決定的な一撃を食らわせる準備が整っている。"
 RAJ_timurid_bureaucracy: "ティムール朝の官僚制度"
 RAJ_timurid_bureaucracy_desc: "ティムールの遺産に根ざしたティムール朝の官僚制度は、効率的な統治と中央集権的な支配の規範となるものだ。この制度を復活させることにより、帝国の行政が強化され、広大な領土全体の安定と繁栄が保証されるだろう。"
 RAJ_conquer_afghanistan: "アフガニスタンの征服"
 RAJ_conquer_afghanistan_desc: "帝国のかつての中心地だったアフガニスタンを奪還しなければならない。この歴史的な地域の支配権を取り戻すことにより、我々はムガル帝国の遺産を尊重し、帝国復活に向けた重要な拠点を確保できるのだ。"
 RAJ_across_the_himalayas: "ヒマラヤ山脈を越えて"
 RAJ_across_the_himalayas_desc: "ヒマラヤ山脈を越えた先の領土には計り知れない富があり、戦略的にも重要性が高い。この恐るべき山々の向こうまでムガル帝国の影響力を広げることにより、我々は支配力を固め、帝国の栄光に向けて新たな国境を確保するのだ。"
 RAJ_through_the_wakhan_corridor: "ワハーン回廊を通って"
 RAJ_through_the_wakhan_corridor_desc: "$RAJ_skibedi_san_ma_desc$"
 RAJ_skibedi_san_ma: "打倒軍閥"
 RAJ_skibedi_san_ma_desc: "西北三馬の軍閥はムガル帝国の中央アジア支配を妨げている。我々は決定的な軍事遠征を実施し、彼らの戦力を破壊するとともに、戦略的な貿易経路を確保し、帝国の影響力をこの地域まで広げるつもりだ。"
 RAJ_conquerors_of_persia: "ペルシア征服"
 RAJ_conquerors_of_persia_desc: "莫大な富と長い歴史を誇る国、[PER.GetNameDef]は、かつてムガル帝国のライバルであった。彼らをムガル帝国の統治下に置くことができれば、我々の優位性を確認し、西部の重要な領土を確保し、帝国の権威の正当な継承者として、ムガル帝国の地位を固めることができるだろう。"
 RAJ_halls_of_knowledge_2: "帝国アカデミー"
 RAJ_halls_of_knowledge_2_desc: "権力の継続には、知識が重要な鍵となる。ムガル帝国全土に帝国アカデミーを設立し、学者、科学者、行政官といった革新を推進し、統治を強化し、帝国の知恵と発展といった遺産を守ることができる人材を育成する。"
 RAJ_halls_of_knowledge_3: "永遠の知識の源泉"
 RAJ_halls_of_knowledge_3_desc: "知識は我々を深い混沌の泉に導く可能性があり、多くの人はそこを避けるものだが、我々はそこに踏み込まなければならない。"
 RAJ_elephants_for_the_modern_age: "現代の象"
 RAJ_elephants_for_the_modern_age_desc: "かつて、ムガル帝国の強力な戦象は戦場を支配していた。そして今、その遺産を現代に適用するため、装甲車両や機械化部隊に投資している。そして、我が帝国を勝利に導く止まることのない戦争のエンジンを生み出している。"
 RAJ_unite_the_subcontinent: "インド亜大陸の統一"
 RAJ_unite_the_subcontinent_desc: "インド亜大陸内で分裂した国々はかつての栄光の影に過ぎない。これらの領地を再びムガルの旗の下に統一し、帝国の調和、強さ、威厳を取り戻そう。これらの山や海を統治するのは我々の宿命なのだ。"
 RAJ_the_true_mongols: "真のモンゴル"
 RAJ_the_true_mongols_desc: "[Root.GetNameDef]は、大草原の力強さとインド亜大陸の文化を融合させた、モンゴルの遺産の正当な承継者だ。我々はそのルーツを活かし、真のモンゴル精神を呼び起こし、かつての先祖がそうしたように征服と統一を完遂する。"
 RAJ_halls_of_knowlege_3: "帝国の図書館"
 RAJ_halls_of_knowlege_3_desc: "教養は帝国繁栄の基盤である。ムガル帝国全土に大きな図書館を建設することによって、古代の知恵を保存し、革新を促進し、未来の世代がこの帝国を比類なき偉大さへ導く動機付けになる。"
 RAJ_thunder_elephants: "帝国の戦象"
 RAJ_thunder_elephants_desc: "ムガルの権力の象徴である威厳のある象たちが、力強さと伝統の化身として戦場に帰ってくる。彼らの圧倒的な力と存在感は我が軍を鼓舞し、敵の心に恐怖を生み、帝国の勝利への道を切り拓くだろう。"
 RAJ_revolt_of_the_princes: "藩王の反乱"
 RAJ_revolt_of_the_princes_desc: "長きにわたりイギリスの統治下にあった藩王国が、自国の遺産を取り戻すために反乱を起こすのは当然のことだ。"
 RAJ_revolt_of_the_princes_tt: "イギリス領インド帝国に宣戦布告すれば、藩王国は蜂起して我々に加勢し、我々の属国となるだろう。"
 RAJ_secular_rule: "世俗政権"
 RAJ_secular_rule_desc: "ムガル帝国は多様性を基盤として繁栄する世俗政権であり、信仰に関係なく、すべての属国に公平な統治を保証する。功績と平等を優先することによって、帝国の団結を強化し、広大で多様な領土全体での忠誠心を確保する。"
 RAJ_theocratic_rule: "ジンミーの再成文化"
 RAJ_theocratic_rule_desc: "ムガル帝国の統治下では、非イスラム教徒の権利は厳しく規制されてきた。今こそ、このような問題を現代社会に合わせて解決し、我々が分別のある国家だということをインド全体に証明する時だ。"
 RAJ_mughal_court: "ムガル宮廷"
 RAJ_mughal_court_desc: "ムガル宮廷には領土内で最も聡明な学者たちと、影響力のある指導者たちが集結している。この助言者たちに権限を与えることで、彼らの指導に沿って帝国を強化することができ、あらゆる意思決定が我々の栄光と野望を実現するものとなる。"
 RAJ_mughal_court_tt: "すべての藩王国が国民精神を獲得: "
 RAJ_mughal_court_princely_states_tt: "すべての王子は藩王国を離れ、顧問または将軍としてムガル帝国に参加してもらう。"
 RAJ_the_silk_road: "シルクロードの拡張"
 RAJ_the_silk_road_desc: "シルクロードはかつて帝国に富と文化をもたらした。この歴史的な交易網を復元することで、世界の商業の中心地としての地位を取り戻し、帝国を豊かにし、その広大な領土全体に繁栄をもたらそう。"
 RAJ_restore_the_timurid_empire: "ティムール帝国の再興"
 RAJ_restore_the_timurid_empire_desc: "ティムールの旗が再びはためき、かつてのスルタンや王たちに畏怖された帝国が、歴史の灰の中から蘇った。我々の統治は、かつて彼の征服によって形作られた土地に広がり、1つの主権の下に東西を結び付けている。世界よ注目せよ、ティムール朝が戻ってきた。我々はもう、歴史に埋もれることはない。"
 RAJ_peacock_throne_for_the_modern_age: "現代の孔雀の玉座"
 RAJ_peacock_throne_for_the_modern_age_desc: "孔雀の玉座は、我らが先祖の権力と威厳を表す究極の象徴だった。この歴史的な王室に新たな玉座を作ることで、我々の優位性を誇示し、忠誠心を呼び起こし、インド亜大陸の肥沃なデルタに対する我々の構想を明確に示すことができる。"
 RAJ_the_crown_and_the_world: "王位と世界"
 RAJ_the_crown_and_the_world_desc: "ムガル帝国は比類なき世界の超大国として台頭する運命にある。我々の影響力を拡大することで、我々の力を強化し、優位性を誇示し、現代における究極の統治者としての地位は確固たるものになるだろう。"
 RAJ_conquerors_of_iraq: "メソポタミアへの進軍"
 RAJ_conquerors_of_iraq_desc: "イラクはかつて、ティムール帝国における貿易と支配の要所であり、その富が過去の栄光を支えていた。今はその伝統にふさわしくない、取るに足らない支配者の手中にある。我々はメソポタミアを再び支配下に置くことで、戦略的な中心拠点を手に入れ、東西を隔てる玄関口を支配する。ティムールは要求するのではなく、奪う存在だということを世界に思い出させてやろう。"
 RAJ_conquerors_of_turkey: "第二次アンカラの戦い"
 RAJ_conquerors_of_turkey_desc: "アナトリアはかつて帝国同士の戦場であった。歴史によれば、ティムール帝国がオスマン帝国に勝利している。しかし、この崩壊したスルタン国の後継者は、我々の正当な統治下にある土地に、いまだにしがみついている。我々は再び西に進軍し、奴らの防衛線を打破し、かつての征服地を取り戻そうではないか。"
 RAJ_reviving_the_workshop_of_the_world: "世界の工房の復活"
 RAJ_reviving_the_workshop_of_the_world_desc: "イギリスに統治される前のインドは、工業、繊維、貿易に関して世界の中心地であった。ムガル帝国が復活し、この伝統を取り戻す時がきた。工場を近代化し、貿易ルートを再び活性化させることで、我々の経済を世界の列強と並ぶまでに変貌させよう。"
 RAJ_legacy_of_timur: "ティムールの遺産"
 RAJ_legacy_of_timur_desc: "ティムール帝国は歴史の中に消える運命ではなかった。先祖から伝わる土地を奪還し、それらを1つの統治下に統一することによって、我々はティムールの遺産を復活させ、力と野心に満ちた新たな時代を築いていこう。世界は再び、ティムールの子たちの前で震えあがるのだ。"
 RAJ_forging_the_mughal_arsenal: "ムガル工廠の再建"
 RAJ_forging_the_mughal_arsenal_desc: "かつての戦争は棒と石で戦ったものだが、そんな時代は終わった。我が帝国が現代の列強と渡り合うためには、膨大な軍事機械を維持するのに必要な産業基盤を構築しなければいけない。組み立てラインは産業の音でにぎわい、やがて我が軍は我々が作った武器を手に戦場に赴くだろう。"
 RAJ_rebuilding_the_empires_roads: "帝国の道路の再建"
 RAJ_rebuilding_the_empires_roads_desc: "軍隊、物資、国民の輸送手段がなければ帝国は機能しない。イギリスが残していった、老朽化した道路や鉄道を拡張し、現代化しなければならない。"
 RAJ_hedgemony_of_the_subcontinent: "インド亜大陸の覇権"
 RAJ_hedgemony_of_the_subcontinent_desc: "我々はインド亜大陸において産業に関する優位性を手に入れ、同じ地位を狙う競合を退けた。我々は競争から離脱した他国を置き去りにし、難攻不落の地位を築いたのだ。"
 RAJ_hedgemony_of_the_subcontinent_tt: "すべての開始州は[ROOT.GetName]に領有されている。"
 RAJ_orchestrate_train_robberies_desc: "労働者主導の管理と監督強化によって鉄道建設は減速したが、建設された各路線は計画経済とうまく統合され、物流面でのメリットと効率性をもたらしている。"
 RAJ_revisiting_inquities: "目には目を"
 RAJ_revisiting_inquities_desc: "我が帝国の歴史的な衰退は、外国の貿易会社の干渉によって加速されたものだった。我々が得た新たな力によって、我々がかつて受けた不当な行いと同じことを、かつての敵に受けさせることは我々の権利である、と信じる者がいる。"
 RAJ_royal_indian_navy_mutiny: "王立インド海軍の反乱"
 RAJ_royal_indian_navy_mutiny_desc: "我々の大義を支持するインド人航海士の間では不満が募っている。我々はこれを利用し、権力を掌握し、イギリスからの増援を阻止することができる。奴らは降伏するしかないだろう。"
 RAJ_royal_indian_navy_mutiny_tt: "§Rこの国家方針をクリアすると共産主義者の潜入ディシジョンは削除される。§!"
 RAJ_royal_indian_navy_mutiny_tt2: "§R我々の義務を果たせば共産主義者の潜入ディシジョンは削除される。§!"
 RAJ_hide_communist_infiltration: "$RAJ_royal_indian_navy_mutiny_tt2$"
 RAJ_accept_russian_muhajir_money_desc: "外国の金が我々の手に流れ込み、改革の火に油をそそぐ。"
 RAJ_jugantar_desc: "ユガンタルの魂が目覚め、抵抗活動が領土中に広がっていく。この勢いに乗り、ベンガルを再び手中におさめよう"
 RAJ_the_peoples_liberation_army_desc: "規律正しく、思想的に献身的な人民解放軍は、民族解放の先陣を切る。労働者階級と農民から構成される人民解放軍は、革命を防衛し、新たな秩序を築く準備ができている。"
 RAJ_deathblow_to_imperial_remnants_desc: "イギリスは共産主義の台頭に対抗しようと必死で、彼らの代理人を務める[PAK.GetName]に大量の資源を投入してきた。ついに、この争いを終わらせるときがきた。"
 RAJ_the_revolutionary_army_marches_desc: "我が軍は目的を持って進軍する。改革のため、インドのため、そして民衆のために。"
 RAJ_threaten_princes_desc: "藩王たちは我々の要求に従うか、もしくは抵抗して報いを受けるかのどちらかだ。"
 RAJ_look_to_the_future: "未来に目を向ける"
 RAJ_look_to_the_future_desc: "物価の混乱を制御するためには、過去ではなく未来に目を向ける必要がある。大規模な安定化策を実施する必要がある。今すぐにだ。"
 RAJ_lobby_parliment: "議会への働きかけ"
 RAJ_lobby_parliment_desc: "民間投資家の支援を受け、世界経済のさらなる崩壊を防ぐ唯一の現実的な手段は民営化であると我々は議会に働きかける。インド帝国の一部を売却することは単なる戦略ではなく、帝国の安定につながるのだ。"
 RAJ_lobby_parliment_tt: "東インド会社の設立を開始する"
 RAJ_orchestrate_train_robberies: "人民鉄道"
 RAJ_orchestrate_train_robberies_tt: "鉄道の国家方針により§Yインド鉄道§!の精神に以下の修正: \n工場出力: §G+[?RAJ_railway_default_increase_tt]%§!\n鉄道建設速度: §R[?RAJ_railway_default_decrease_tt]%§!\n補給ハブ建設速度: §R[?RAJ_railway_default_decrease_tt]%§!\nインフラ建設速度: §R[?RAJ_railway_default_decrease_tt]%§!\n（鉄道の国家方針をそれぞれ完了するたびに適用）\n\nすでに完了している鉄道の国家方針はすべて、これに対応するよう自動的に切り替わる。"
 RAJ_accept_russian_muhajir_money: "ロシアのムハージルの資金を受け入れる"
 RAJ_jugantar: "ユガンタル"
 RAJ_jugantar_tt: "[PAK.GetName]に宣戦布告すれば、バングラデシュ周辺に師団を獲得する"
 RAJ_bhoodan_movement: "ブーダン運動"
 RAJ_bhoodan_movement_desc: "自主的な土地の再分配を通じて、土地を持たない人々に力を与え、農村に正しい秩序を取り戻す。土を耕す人々に土を返すことで、我々は彼らの労働力を得るだけでなく、永続的な忠誠心をも得るのだ。"
 RAJ_the_peoples_liberation_army: "人民解放軍の結成"
 RAJ_deathblow_to_imperial_remnants: "帝国の残党への致命的な一撃"
 RAJ_the_revolutionary_army_marches: "革命軍の進軍"
 RAJ_nationalize_british_owned_factories: "イギリスが所有する工場の国有化"
 RAJ_nationalize_british_owned_factories_desc: "[RAJ.GetAdjective]労働者の犠牲の上に成り立っている工場は、もはや外国の利益にはならない。[ENG.GetAdjective]所有の産業を国有化することで、我々は人々に力を戻し、不当に奪われたものを再び取り戻す。"
 RAJ_threaten_princes: "藩王への脅迫"
 RAJ_exile_princes: "藩王の追放"
 RAJ_exile_princes_desc: "君主制の時代は終わりを告げた。真の挙国一致を確保するために、我々は封建権力の残党を排除し、彼らを宮殿やかつて彼らが統治していた国民から遠く離れた場所へと追放する。"
 RAJ_integrate_the_princes: "藩王たちを結集する"
 RAJ_integrate_the_princes_desc: "我々はこれまで藩王たちを亡命させ、彼らを徐々にインドに集結させている。そして今、ついに藩王国を完全に統合する時が来た。"
 RAJ_integrate_the_princes2: "藩王の征服"
 RAJ_integrate_the_princes2_desc: "藩王国制度による半自治は我々が維持を望むものではない。藩王国は完全にインドに統合されることになる。"
 RAJ_exiled_princes_flag: "藩王たちを亡命させた"
 RAJ_join_the_co_prospherity_sphere: "共栄圏に参加する"
 RAJ_join_the_co_prospherity_sphere_desc: "日本は西洋の帝国主義に立ち向かう唯一の地方勢力だ。我々はより大きな目標のため、彼らと共闘しなければならない。"
 RAJ_join_the_co_prospherity_sphere_tt: "（§Y[JAP.GetName]§!）はイベント「§Y[RAJ.GetNameDefCap]§!は共栄圏への参加を目指す」を入手する。"
 RAJ_cruiser_effort_dlc: "$RAJ_cruiser_effort$"
 RAJ_submarine_effort_dlc: "$RAJ_submarine_effort$"
 RAJ_capital_ship_effort_dlc: "$RAJ_capital_ship_effort$"
 RAJ_black_swan_sloops: "ブラックスワン級スループ"
 RAJ_black_swan_sloops_desc: "費用対効果の高いブラックスワン級の船体を取得し、改装することで、沿岸防衛や船団護衛に最適な小型哨戒艦隊を迅速に拡大することができる。"
 RAJ_coastal_protection: "沿岸保護"
 RAJ_coastal_protection_desc: "我々の広大な海岸線は、外国の脅威に対して何らかの保護が必要だ。"
 RAJ_the_sword_and_the_saffron: "剣とサフラン"
 RAJ_the_sword_and_the_saffron_desc: "我々の運命は強さと信念によって築かれる。剣は領土を守り、サフランの旗は民衆を1つの目標に向かって団結させる。"
 RAJ_burn_down_the_cellular_jail: "セルラー刑務所を焼き払う"
 RAJ_burn_down_the_cellular_jail_desc: "セルラー刑務所はインドの独立のために戦ったすべての人への侮辱であり、破壊しなければならない。"
 RAJ_indian_marine_corps: "[ROOT.GetAdjective]海兵隊"
 RAJ_indian_marine_corps_desc: "我々は水陸両用作戦と特殊攻撃の訓練を受けた専任の海兵隊を創設する。"
 RAJ_madras_ship_repair_factories: "マドラス船舶修理工場"
 RAJ_madras_ship_repair_factories_desc: "マドラスは拡大しつつある艦隊の維持と改修を行う専用の修理施設を備えた海軍の主要支援拠点として開発され、東部沿岸全域での作戦準備態勢を確保する。"
 RAJ_obtain_british_naval_contracts: "イギリス海軍と契約する"
 RAJ_obtain_british_naval_contracts_desc: "[ENG.GetNameDefCap]との海軍建設契約を確保するために彼らに歩み寄り、戦略的関係を強化しながら彼らの産業能力を活用して自国の艦隊を強化する。"
 RAJ_purchase_decomissioned_british_ships: "退役した艦艇を購入する"
 RAJ_purchase_decomissioned_british_ships_desc: "退役した海軍艦艇を入手するために、[ENG.GetNameDefCap]に歩み寄る。時代遅れではあるが、これらの艦船は最小限のコストで迅速に艦隊を拡大するために再装備することができる。"
 RAJ_request_transfer_of_british_commanders: "イギリスの指揮官の派遣を要求"
 RAJ_request_transfer_of_british_commanders_desc: "[ENG.GetNameDefCap]に連絡をとり、彼らの海軍指揮官1名の派遣を要請し、新人海兵隊員の訓練を支援してもらうつもりだ。"
 RAJ_obtain_modern_ship_contracts: "最新艦の契約をする"
 RAJ_obtain_modern_ship_contracts_desc: "海軍の近代化を加速させるため、我々は[ENG.GetNameDefCap]と交渉し、最新鋭の巡洋艦の取得を目指す。これにより、進化する海洋情勢において、我が艦隊の競争力を維持するのだ。"
 RAJ_dominate_the_bay_of_bengal: "ベンガル湾を支配せよ"
 RAJ_dominate_the_bay_of_bengal_desc: "ベンガル湾における制海権を確保することは、我が国の海洋戦略にとって不可欠だ。この海域における存在感を高め、影響力を拡大することで貿易ルートを保護し、地域的な優位性を確保する。"
 RAJ_indian_cruiser_development: "[ROOT.GetAdjective]の巡洋艦の開発"
 RAJ_indian_cruiser_development_desc: "我々の海軍戦略を打ち立てる時が来た。国内設計の巡洋艦を開発することで産業の独立性を主張し、近代的なインド艦隊の基礎を築く。"
 RAJ_increase_funding_for_the_GRSE: "GRSEへの資金提供を増やす"
 RAJ_increase_funding_for_the_GRSE_desc: "新たな造船所の建設を可能とするため、GRSEに対する州の資金提供額を増やす。"
 RAJ_womens_royal_indian_naval_service: "王立[ROOT.GetAdjective]女性海軍"
 RAJ_womens_royal_indian_naval_service_desc: "女性が海軍での役割を果たせるよう、王立[ROOT.GetAdjective]女性海軍を設立する。"
 RAJ_modernizing_navy_dlc: "海軍の近代化"
 RAJ_modernizing_navy_dlc_desc: "この地域の大国としての地位を確立するには、アジアの海に影響力を及ぼすために先進的な船の設計、インフラの改善、戦略的ドクトリンに投資して海軍を近代化しなければならない。"
 RAJ_rashtriya_swayamsevak_sangh: "民族義勇団"
 RAJ_rashtriya_swayamsevak_sangh_desc: "我々は若者を規律ある部隊に組織し、いかなる犠牲を払っても我が国を防衛し、ヒンドゥー至上主義の価値観を守るつもりだ。"
 RAJ_the_hindu_martial_tradition: "ヒンドゥーの武術の伝統"
 RAJ_the_hindu_martial_tradition_desc: "シヴァージーの戦士からダルマの守護者まで、我々は古代の武術の精神を蘇らせ、次なる戦いに備えている。"
 RAJ_cultural_reawekening: "文化の再覚醒"
 RAJ_cultural_reawekening_desc: "芸術、言語、伝統に満ちた新たな夜明けが近付いている。我々の文明の永遠の精神のもとで、我が国に団結をもたらそう。"
 RAJ_mass_production: "大量生産"
 RAJ_mass_production_desc: "最も低コストで設備を提供できる民間企業から調達を行う。設備コストの抑制が成長の鍵である。"
 RAJ_deathknell_to_the_raj: "インド帝国の終焉"
 RAJ_deathknell_to_the_raj_desc: "我々はこの土地への支配権を徐々に広げることによって、インド帝国の残滓を削り取ってきた。このような茶番は終わらせ、インド亜大陸の完全な支配を要求する時がきた。"
 RAJ_deathknell_to_the_raj_trigger: "§Yイギリス領§!§Yインド帝国§!の統治が存在している"
 RAJ_deathknell_to_the_raj_trigger_tt: "インド帝国の残滓を併合する"
 RAJ_learn_from_the_crown: "王室からの学び"
 RAJ_learn_from_the_crown_desc: "我々は王室の豊富な軍事経験から学び、その実証された教義を取り入れ、今後の課題に備えなければならない。"
 RAJ_join_the_shadow_scheme: "シャドウ計画への参加"
 RAJ_join_the_shadow_scheme_desc: "秘密作戦に参加することで、我々は諜報能力を高め、戦略的立ち位置を強化できる。"
 RAJ_colonial_cadet_exchange: "植民地からの士官候補生留学"
 RAJ_colonial_cadet_exchange_desc: "我々は最も聡明な士官候補生をイギリスに派遣し、現地の将校たちとともに訓練を受けさせ、我が軍に最新の技術を導入する。"
 RAJ_learn_from_the_secret_intelligence_service: "秘密諜報機関からの学び"
 RAJ_learn_from_the_secret_intelligence_service_desc: "イギリスの秘密諜報機関と協力することで、我々の利益を守る強力なスパイネットワークを構築できる。"
 RAJ_purchase_british_supply_equipment: "イギリスの供給装備を購入"
 RAJ_purchase_british_supply_equipment_desc: "我々は、軍隊を強化し、戦場における兵站を改善するために、英国の先進的な供給装備を手に入れなければならない。"
 RAJ_forming_an_indian_doctrine: "インドのドクトリンを作成する"
 RAJ_forming_an_indian_doctrine_desc: "我々が自分で道を切り拓く時がきた。我々特有の強みと願いを反映させたインドのドクトリンを開発する。"
 RAJ_model_after_germany: "ドイツを見習う"
 RAJ_model_after_germany_desc: "ドイツの規律ある効果的な軍事ドクトリンを見習うことで、我が軍を近代的な戦争機械に変容させることができる。"
 RAJ_model_after_usa: "アメリカを見習う"
 RAJ_model_after_usa_desc: "アメリカの軍事戦略を学ぶことで、柔軟性と技術革新を重視し、我が軍を近代化することができる。"
 RAJ_model_after_soviet: "ソビエト連邦を見習う"
 RAJ_model_after_soviet_desc: "ソビエト連邦が大衆動員と革命的戦術を重視したことは、我々の軍事進化の青写真となる。"
 RAJ_automating_the_army: "陸軍の自動化"
 RAJ_automating_the_army_desc: "我々は機械化と装甲師団の高度化を優先し、完全に近代化された陸軍への道を切り拓く。"
 RAJ_for_the_people_by_the_people: "人民による、人民のための"
 RAJ_for_the_people_by_the_people_desc: "真に国民の意思に根ざした陸軍を構築するために、歩兵、砲兵、支援師団の強化に重点を置く。"
 RAJ_five_year_plan: "五カ年計画"
 RAJ_five_year_plan_desc: "共産主義国家には五カ年計画が必要だ！[RAJ.GetNameDefCap]の産業が反映するよう、我々の計画策定を始めよう！"
 RAJ_five_year_plan_flag: "国家方針、§Y五カ年計画§!を完了した。"
 RAJ_five_year_plan_tt: "§Y土地社会主義§!または§Y都市産業主義§!を完了すると、五カ年計画が変更される。"
 RAJ_five_year_plan_when_removed_tt: "現在の日数: [?RAJ_five_year_plan_flag:days|Y0]"
 RAJ_five_year_plan_modify_tt: "§Y五カ年計画§!に以下の補正: "
 RAJ_soviet_influence: "ソビエトの影響力"
 RAJ_soviet_influence_desc: "ソビエト連邦は革命的変革の模範である。彼らのイデオロギー的指導と制度的な枠組みを受け入れることで、我々も[RAJ.GetName]同様の道筋を描くことができるだろう。"
 RAJ_indian_socialism: "インド社会主義"
 RAJ_indian_socialism_desc: "社会主義大国からインスピレーションを得るのではなく、[RAJ.GetNameDefCap]のニーズに合わせた独自の社会主義ドクトリンを作成する。"
 RAJ_soviet_indian_industrial_cooperation: "ソビエト・インド産業協力"
 RAJ_soviet_indian_industrial_cooperation_desc: "経済改革を加速させるため、我々は[SOU.GetNameDefCap]と産業的関係を結ぶ。彼らの技術的専門知識と集中型開発における経験は、我々のニーズに合わせた社会主義経済の構築に役立つだろう。"
 RAJ_indian_national_highways: "インド国立高速道路"
 RAJ_indian_national_highways_desc: "[RAJ.GetNameDefCap]の産業を発展させるために、補給線を基礎から作り始めなければならない。"
 RAJ_expand_industry_in_hyderabad: "ハイデラバードの産業拡大"
 RAJ_expand_industry_in_hyderabad_desc: "ハイデラバードの工場を拡張すれば、大きな投資を必要とせずに、我々の生産能力を大幅に向上できる。"
 RAJ_continue_the_five_year_plan: "五カ年計画の継続"
 RAJ_continue_the_five_year_plan_desc: "五カ年計画の初年度が終わり、これまでの進捗を振り返る時がきた。これまでに学んだ教訓を今後の4年間に活かさなければならない。"
 RAJ_continue_the_five_year_plan_tt: "§Y五カ年計画§!のすべての補正を§G30%§!増やす"
 RAJ_nationalize_tata_group: "タタグループの国有化"
 RAJ_nationalize_tata_group_desc: "我々の経済をタタグループに依存するのはやめなければいけない。今こそこの会社を引き継ぎ、国有化する時だ。"
 RAJ_focus_on_military_industry: "軍需産業に焦点を当てる"
 RAJ_focus_on_military_industry_desc: "我々は何よりも国家の安全を優先しなければならず、我々の生存を保障するために軍拡を優先しなければならない。"
 RAJ_nationalize_gun_carriage_agency: "ガン・キャリッジ・エージェンシーの国有化"
 RAJ_nationalize_gun_carriage_agency_desc: "ガン・キャリッジ・エージェンシーは我々の主要な武器調達先の1つであり、このような力は民間企業の手に委ねるべきではなく、国有化すべきだ。"
 RAJ_eastern_shipyard_construction: "東部の造船所建設"
 RAJ_eastern_shipyard_construction_desc: "近代的な海軍力の成長を支えるため、東海岸の造船能力を拡大する。これらの新しい造船所は、我々の海洋戦略の基幹となるだろう。"
 RAJ_colonial_cadet_exchange_tt: "撤廃時: "
 RAJ_form_ties_with_leftist_parties: "左派政党との連携"
 RAJ_form_ties_with_leftist_parties_desc: "国内の社会主義者と共産主義者の支持を集めなければならない。"
 RAJ_relax_agrarian_society_criteria_tt: "§Y$idea_RAJ_independence_movement$§!に修正を加えて\n§Y効果を変更: §!"
 RAJ_secular_rule_alt: "ティムール朝の遺産"
 RAJ_secular_rule_alt_desc: "先祖代々の中心地を取り戻し、我々の王朝が生まれた山々から新たな時代を築く時がきた。アフガニスタンの中心にある厳しい地形に帝国を定着させることで、我々は領土を確保し、帝国による統治の基盤を回復することができる。"
 RAJ_theocratic_rule_alt: "モンゴルの遺産"
 RAJ_theocratic_rule_alt_desc: "我々は征服者の承継者であり、かつて世界を震撼させた帝国の後継者である。モンゴルの遺産を尊重するために、我々は力で団結し、信仰や出自にかかわらず、王への忠誠心によって結ばれた1つの国民として、インド亜大陸を支配下に置かなければならない。帝国の力の前に、すべての者がひざまずくだろう。"
 RAJ_secret_weapons: "科学力を取り戻せ"
 RAJ_secret_weapons_desc: "我々はロケット開発の世界的なリーダーに返り咲き、その技術を敵のせん滅に利用する。"
 RAJ_his_majestys_loyal_government: "陛下の忠実なる政府"
 RAJ_his_majestys_loyal_government_desc: "独立を求める声が街頭で高まる中、[ROOT.GetName]の機械は不動のままである。国王陛下が任命した総督が統治し、インド高等文官が支え、我々は規律と決意をもって王家の利益を推進していく。"
 RAJ_the_government_of_india_act: "インド政府法"
 RAJ_the_government_of_india_act_desc: "インド政府法は、州内での自治拡大への扉を開いた。地方の省庁に権限を委譲することで、穏健派の声をなだめ、行政効率を強化することができる。その一方で、帝国の手綱はしっかりと握ったままにしておくことができるのだ。"
 RAJ_work_with_local_leaders: "地元の指導者との協力"
 RAJ_work_with_local_leaders_desc: "有力な地方の指導者たちと協力することで、資源を過度に使うことなく、我々の影響力を拡大することができる。この指導者たちは、自分たちの地域が必要としていることを理解しており、住民と王室の両方に役立つ改善策を実施することができる。"
 RAJ_concessions_to_the_industrialists: "実業家への譲歩"
 RAJ_concessions_to_the_industrialists_desc: "国の財政を圧迫することなく開発を促進するために、地域の成長に投資する意欲のある実業家には有利な条件を提供する。ささやかな譲歩と引き換えに、地域の指導者は繁栄を通じて忠誠を確保する。"
 RAJ_empower_provincial_authorities: "地方自治体の権限強化"
 RAJ_empower_provincial_authorities_desc: "私的利益を追求するのではなく、地方自治体の行政権限を強化し、開発を直接監督する。投資決定を地方自治体に委ねることで、忠誠心は責任をもって報われる。"
 RAJ_confer_with_the_congress: "議会との協議"
 RAJ_confer_with_the_congress_desc: "政権内には沈黙を望む者も多いが、独立運動を完全に無視することはより大きな不安を招くリスクがある。一部の要求を受け入れることで怒りを和らげ、国内の安定性を強化できるかもしれない。"
 RAJ_favor_the_muslim_league: "イスラム連盟を支持"
 RAJ_favor_the_muslim_league_desc: "イスラム連盟に対しより大きな認知と政治的支援を与えることで、支配的な民族主義運動に対する忠実な対抗勢力を育成することができる。彼らに力を与えることで、インド全体を代表しようとする人々の間に有益な摩擦を生み出すことができる。団結には強さがある。分裂には管理可能な政治がある。"
 RAJ_the_indian_parliament: "インド議会"
 RAJ_the_indian_parliament_desc: "自治を求める声が高まるなか、インド議会を設立し、総督から民政権を移譲する。この移行により、帝国の枠組みの中で、先住民の指導者に真の自治権が与えられることになる。"
 RAJ_court_the_princes: "藩王への接近"
 RAJ_court_the_princes_desc: "藩王国は長い間、亜大陸における忠誠と秩序の柱として存在してきた。その特権を再確認し、統治に直接的に関与させることで、高まりつつある民衆の動揺に対して帝国の基盤を強化することができる。"
 RAJ_the_integrity_of_india_act: "インド完全性法"
 RAJ_the_integrity_of_india_act_desc: "反乱の脅威が高まっていることに対処し、帝国の権威を維持するために、我々はインド完全性法を制定する。この法律により、扇動者の拘束、政治的反対意見の制限、亜大陸全体における忠実な統治の確保が可能となる。結束は時に強制されなければならない。"
 RAJ_princely_state_donations_GOE: "藩王国からの寄付"
 RAJ_princely_state_donations_GOE_desc: "$RAJ_princely_state_donations_desc$"
 RAJ_the_jewel_becomes_the_crown: "宝石が王冠に"
 RAJ_the_jewel_becomes_the_crown_desc: "祖国の崩壊に伴い、今こそ我々が指導者としての重荷を担う時である。新たな活力をもって、我々は帝国の中心を解放し、その緑豊かな心地よい土地を汚そうとした者たちをすべて滅ぼすために、[ROOT.GetNameDef]の広大な資源を活用する。"
 RAJ_the_punjab_accord: "パンジャブ合意"
 RAJ_the_punjab_accord_desc: "シーク教徒コミュニティの独自な立場を認識し、パンジャブ州において限定的な自治権を認めることで、我々は長年にわたって培われてきた忠誠心と奉仕の絆を強化するだろう。その見返りとして、彼らの継続的な支援は[ROOT.GetNameDef]の重要な地域における権威を強化し、伝統と安定が手を取り合って歩むことを確実にする。"
 RAJ_the_dominion_of_india: "インド自治領"
 RAJ_the_dominion_of_india_desc: "インド亜大陸における秩序がしっかりと再確立された今こそ、帝国の忠実な自治領として、帝国の兄弟たちの中に我々の居場所を見つける時である。\n王に栄光あれ！"
 RAJ_curtail_the_zamindars: "ザーミンダールの抑制"
 RAJ_curtail_the_zamindars_desc: "地方地主の根強い影響力は、長年にわたり統治の近代化と[ROOT.GetNameDef]の潜在能力の引き出しを妨げてきた。行政権と資源を能力主義に基づく公務員や信頼性のある機関へと移行させることで、彼らの影響力を弱めながら、より対応力のある国家の基盤を強化することができる。"
 RAJ_raise_import_duties: "輸入関税の引き上げ"
 RAJ_raise_import_duties_desc: "経済的な依存度を減らし、国内の成長を促進するために、外国製品に対してより高い輸入関税を課す。この政策は地元産業を保護し、資本を国内に留め、[ROOT.GetNameDef]が自らの足で立つことを援助する。"
 RAJ_imperial_industry_initiative: "帝国産業計画"
 RAJ_imperial_industry_initiative_desc: "帝国の柱としての[ROOT.GetNameDef]の地位を固めるためには、都市産業の大幅な拡大に全力を傾けなければならない。帝国産業計画は重工業と熟練労働者に資源を投入し、その結果、我々の都市が亜大陸における回復力と再生の原動力となることを確実なものにする。"
 RAJ_rural_development_plan: "農村開発計画"
 RAJ_rural_development_plan_desc: "農業改革が進行中である今、我々は産業を地方にもたらさなければならない。機械化、地方のインフラ計画、小規模製造業は、村を生産の原動力へと変えていくだろう。"
 RAJ_the_great_recovery: "大いなる復興"
 RAJ_the_great_recovery_desc: "大恐慌の傷跡は我が国の経済全体に長く残り、進歩を遅らせ、自信を奪ってきた。しかし今、新たな安定とビジョンを得て、我々は停滞の重荷を振り払うだろう。これは単なる正常化ではなく、[ROOT.GetNameDef]の新たな章の始まりだ。 "
 RAJ_reform_the_agricultural_sector: "農業部門の改革"
 RAJ_reform_the_agricultural_sector_desc: "非効率な土地利用と時代遅れの慣行が数十年も続いた結果、[ROOT.GetNameDef]の農業部門は混乱し脆弱な状態になっている。的を絞った改革、インフラへの投資、そして近代的な技術により、収穫量を改善し、より強靭な食糧供給を実現することができる。 "
 RAJ_expand_the_zamindari_system: "ザーミンダーリー制度の拡大"
 RAJ_expand_the_zamindari_system_desc: "ザーミンダーリー制度は、長年にわたり農村部の統治と税収の徴収に信頼性の高い枠組みを提供してきた。その適用範囲を拡大し、忠実な地主の特権を再確認することで、中央政府を過度に拡大することなく、地域の秩序と行政の効率性を確保することができる。"
 RAJ_crown_commodities: "皇室商品"
 RAJ_crown_commodities_desc: "輸出向けの換金作物の栽培を優先することで、安定した収入を確保し、帝国に対する経済的重要性を強化することができる。紅茶、綿花、ジュート、その他の植民地貿易の主要品目は、農村部の繁栄の基盤となるだろう。"
 RAJ_rural_mechanization_program: "農村機械化計画"
 RAJ_rural_mechanization_program_desc: "農業生産を向上させ、時代遅れの労働方法への依存を減らすため、我々は機械化農業を全国に導入する体系的なプログラムを実施する。トラクター、脱穀機、灌漑システムは、農村部の生産性を向上させ、近代的で自給自足の経済の基盤を築くことになるだろう。"
 RAJ_the_riches_of_the_raj: "インド帝国の富"
 RAJ_the_riches_of_the_raj_desc: "広大な平原と険しい丘陵地帯が広がる[ROOT.GetNameDef]の下には、戦争中の帝国を動かすのに必要な資源が眠っている。鋼鉄、石油、その他の重要な材料が採掘され、精製され、帝国の防衛に利用される。"
 RAJ_strengthen_ties_with_british_investors_GOE: "イギリス投資家との関係強化"
 RAJ_strengthen_ties_with_british_investors_GOE_desc: "$RAJ_strengthen_ties_with_british_investors_desc$"
 RAJ_imperial_rail_renewal_act: "帝国鉄道改修法"
 RAJ_imperial_rail_renewal_act_desc: "亜大陸をまたぐ商品、軍隊、物資の迅速な移動を確保するため、[ROOT.GetNameDef]の鉄道インフラの包括的な改修に投資する。帝国鉄道改修法は老朽化した路線を近代化し、物流能力を拡大し、広大な領土を鋼鉄と蒸気でつなぐ。"
 RAJ_exploit_the_frontier: "国境の開発"
 RAJ_exploit_the_frontier_desc: "広大な資源埋蔵地は、亜大陸の辺境や未開発地域に眠っている。事業を拡大し、[BRM.GetNonIdeologyName]などの地域に対する支配力を強めることで、タングステンなどの重要資源を確保し、成長を続ける軍事力を維持することができる。"
 RAJ_overlords_railway_investment: "[ROOT.OVERLORD.GetAdjective]鉄道への投資"
 RAJ_overlords_railway_investment_desc: "近代的な鉄道システムの基盤が整った今、我々は[ROOT.OVERLORD.GetAdjective]の産業および金融関係者からの投資を募り、ネットワークのさらなる拡大と改善を図る。彼らの資金と我々の成長するインフラを組み合わせることで、帝国にふさわしい鉄道システムが構築されるだろう。"
 RAJ_territorial_development_scheme: "地域開発計画"
 RAJ_territorial_development_scheme_desc: "[ROOT.GetNameDef]の経済的可能性を十分に活用するには、土地の割り当てと利用方法を再評価する必要がある。地域開発計画では、発展途上の地域を特定し、成長の障害を取り除き、産業拡大のための新たな区域を準備する。 "
 RAJ_the_empires_workshop: "帝国の工場"
 RAJ_the_empires_workshop_desc: "世界的な需要の高まりに直面する帝国の強さを確保するため、我々は[ROOT.GetNameDef]と[ROOT.OVERLORD.GetNameDef]間の経済的結びつきを深める。両地域にわたる投資と工場拡張の調整により、共有する産業基盤を単一の生産エンジンへと変貌させる。"
 RAJ_institute_of_fundamental_research_GOE: "基礎研究所"
 RAJ_institute_of_fundamental_research_GOE_desc: "有力な実業家や科学者の支援を受け、我々は基礎研究所を設立し、高度な理論研究を推進する。この研究所は原子力エネルギーの研究を含む最先端の実験の中核となるだろう。"
 RAJ_keep_calm_and_carry_on: "落ち着いて先へ進め"
 RAJ_keep_calm_and_carry_on_desc: "この非常に厳しい局面においても、我々は挫けない。[ROOT.GetNameDefCap]は不屈の決意で戦争の道具を鍛造する力の砦として立ち上がるだろう。勝利は快適さから生まれるものではなく、勇気、汗、そして鋼鉄から生まれるものなのだ。"
 RAJ_indian_gentleman_officers: "インド人紳士の将校"
 RAJ_indian_gentleman_officers_desc: "我らが帝国の宝の未来と安全を確保するためには、新しい[RAJ.GetAdjective]軍を率いる忠実な人材を確保することが不可欠である。これらの人々は、帝国当局との緊密な協力により、[RAJ.GetNameDef]に十分に貢献しており、最も信頼のおける指揮官として活用されるにふさわしい。"
 RAJ_the_aden_protectorate: "アデン保護国"
 RAJ_the_aden_protectorate_desc: "アラビア半島のアデン州は、我々の管轄下にある。したがって、[ENG.GetNameDef]に[RAJ.GetNameDef]が中東の水域における[ENG.GetAdjective]帝国の利益を守れることを証明するためには、その保護を保障することが極めて重要だ。"
 RAJ_linlithgows_declaration_of_war: "リンリスゴーの宣戦布告"
 RAJ_linlithgows_declaration_of_war_desc: "[ENG.GetAdjective]帝国の一員として、武器を取って彼らの戦争に参加することは我々の責任である。議会指導者たちに許可を乞うために時間を無駄にしている余裕はない。問題に正面から立ち向かわなければならない。宣言文を作成し、[ENG.GetNameDef]の敵との戦争に備えよ。"
 RAJ_consult_with_congress_leaders: "議会指導者との協議"
 RAJ_consult_with_congress_leaders_desc: "[ENG.GetNameDef]の戦争に無理やり参加するのではなく、公式な手段で参加しなければならない。議会指導者たちと協議し、[RAJ.GetNameDef]が戦争に参加できるよう彼らに訴えるべきだ。"
 RAJ_preemptive_invasion_of_iran: "イランへの先制介入"
 RAJ_preemptive_invasion_of_iran_desc: "[PER.GetNameDef]は西の国境に位置しており、迅速に対処しなければ、ペルシア回廊を通って[RAJ.GetNameDef]への直進ルートを敵に提供することになりかねない。このような侵略は平和を求める人々の怒りを買うことは確実だが、成功すれば、[PER.GetNameDef]の豊富な油田を我が物にできるだろう。"
 RAJ_mobilization_of_the_indian_army: "インド軍の動員"
 RAJ_mobilization_of_the_indian_army_desc: "我々の数は多く、栄光に満ちた帝国を防衛するという精神が我々を勇気づけている。亜大陸の各地から軍を集結させるには時間がかかるかもしれないが、[RAJ.GetAdjective]軍の動員を開始することが重要である。[RAJ.GetNameDef]と[ENG.GetNameDef]のために立ち上がり、戦う時が来たのだ。"
 RAJ_support_naval_invasions: "強襲上陸の支援"
 RAJ_support_naval_invasions_desc: "この戦争は陸上や空中だけでなく、海上でも戦われることになる。地上軍を動員することが重要であるのと同様に、同盟国の海上侵攻計画を支援するために、海軍を準備しなければならない。"
 RAJ_assume_eastern_naval_responsibilities: "東部海域の海軍責任"
 RAJ_assume_eastern_naval_responsibilities_desc: "[JAP.GetNameDef]が東方で問題を引き起こしていることは疑いの余地がない。彼らの計画が明らかになるにつれ、[RAJ.GetAdjective]の海域を守るために海軍を準備することが急務となっている。我々は[ENG.GetAdjective]の海軍艦船を派遣するよう王室に訴え、我々の取り組みを支援するよう要請しなければならない。"
 RAJ_south_east_asia_command: "東南アジア司令部"
 RAJ_south_east_asia_command_desc: "緊張が高まるにつれ、東南アジアにおける中央司令部の必要性が高まっている。我々はそれを実現する先駆者となり、大陸における軍事作戦を計画するための作戦拠点を構築することができる。"
 RAJ_desert_training: "砂漠訓練"
 RAJ_desert_training_desc: "戦闘部隊の技能と効率を高めるための取り組みの一環として、我々はタール砂漠とその周辺で訓練体制を整えられる。これにより、部隊を乾燥した環境に慣れさせることができるだろう。"
 RAJ_fortify_el_alamein: "エル・アラメインの要塞化"
 RAJ_fortify_el_alamein_desc: "エル・アラメインはエジプトの保持と安全確保という観点において戦略的に重要な地点である。この地域の防御を強化し、敵が[ENG.GetAdjective]北アフリカに足がかりを得るのを防ぐための我々の努力に、王室は大いに感謝するだろう。"
 RAJ_jungle_training_GOE: "密林訓練"
 RAJ_jungle_training_GOE_desc: "我が国のように広大な土地では、幸いにも生物群系の多様性という利点がある。[RAJ.GetNonIdeologyName]、[BRM.GetNonIdeologyName]、インドシナは密林で覆われており、この危険な地形で効果的に兵士を活動させるために特別な訓練が推奨されている。"
 RAJ_defense_of_malaya: "マラヤの防衛"
 RAJ_defense_of_malaya_desc: "[MAL.GetNameDef]はインド洋と太平洋の間に位置しているため、侵略の危険にさらされている。同じ王室の仲間である者として、我々はこの地域を守り強化するために自分たちの役割を果たし、東南アジアの支配を維持しなければならない。"
 RAJ_hill_training: "山岳訓練"
 RAJ_hill_training_desc: "部隊に提供する訓練の多様化を図る取り組みの一環として、ジャングルや砂漠、市街地だけでなく、山岳地帯での戦闘にも対応できるよう準備を整えなければならない。"
 RAJ_defense_of_burma: "ビルマの防衛"
 RAJ_defense_of_burma_desc: "[BRM.GetNonIdeologyName]はベンガルの真東に位置し、そのジャングルは東からの脅威から[RAJ.GetNonIdeologyName]の国境が侵されるのを防ぐ最後の自然の障壁となっている。この地域に防衛軍を動員し、[BRM.GetAdjective]と肩を並べて、インド亜大陸を[ENG.GetAdjective]のためにしっかりと守ることが極めて重要だ。"
 RAJ_holding_the_gates_of_india: "インド門の防衛"
 RAJ_holding_the_gates_of_india_desc: "何があろうとも、我々は東からの侵略者の暴挙から[RAJ.GetNonIdeologyName]を守らねばならない。彼らは熱狂と怒りに燃えて襲いかかってくるかもしれないが、我々は[RAJ.GetNonIdeologyName]の門で彼らの容赦ない征服を阻止する。何人たりとも通さない。"
 RAJ_free_abyssinia: "自由なアビシニア"
 RAJ_free_abyssinia_desc: "我々はあまりにも長い間、アビシニア地方を敵の手に委ねてきた。アデン経由で「アフリカの角」に強力な強襲上陸を行い、その住民を占領者から解放することで、王室に我々の価値を示す。"
 RAJ_urban_training: "市街地訓練"
 RAJ_urban_training_desc: "このような事態にならないことを願っているが、大都市の路上で敵を食い止めなければならない可能性もある。このような事態に備え、都市部での専門的な訓練を行う必要がある。"
 RAJ_the_defense_of_hong_kong: "香港の防衛"
 RAJ_the_defense_of_hong_kong_desc: "[CHI.GetNonIdeologyName]の圧力が高まるなか、[ENG.GetAdjective]の王室は香港の所有に関する運命を心配している。我々は香港を侵略から守るのに最適な立場にあり、成功すれば[ENG.GetAdjective]政府からの支持と承認を得られるだろう。"
 RAJ_modify_a_loyal_government_tt: "§Y$RAJ_a_loyal_government$§!に以下の修正: "
 RAJ_modify_south_east_asia_command_dm_tt: "§Y$RAJ_south_east_asia_command_dm$§!に以下の修正: "
 RAJ_the_government_of_india_act_pp_bonus_tt: "迎合度が§Y74%§!以上の開始時の州ごとに、§Y$RAJ_a_loyal_government$§!を[?RAJ_the_government_of_india_act_pp_bonus_based_on_compliance|+=%%0]$MODIFIER_POLITICAL_POWER_FACTOR$ずつ追加。"
 RAJ_stop_unrest_events_tt: "§Gこれ以上混乱イベントは発生しない。§!"
 RAJ_the_dominion_of_india_every_owned_state_compliance_tt: "迎合度が§Y100%§!未満の全領有州"
 RAJ_crown_commodities_cg_to_the_empire_tt: "（§Y[ENG.GetFlag][ENG.GetName]§!とその§Y従属国§!）: "
 RAJ_the_empires_workshop_civs_to_the_empire_subjects_tt: "（§Y[ENG.GetFlag][ENG.GetName]§!のランダムな中核州の1つ）: \n§G2§!個の建築スロットを追加。\n§G2§!個の§Y$industrial_complex$§!を追加\n\n（§Y[ENG.GetFlag][ENG.GetAdjective]のすべての従属国§!のランダムな中核州）: \n§G1§!個の建築スロットを追加\n§G1§!個の§Y$industrial_complex$§!を追加。"
 RAJ_the_riches_of_the_raj_targets_oil_tt: "§Y$state_resource_oil$§!£resources_strip|1を持つすべての開始時の州: \n§Y+4§!個の£resources_strip|1の生産量を追加。\n§G1§!個の§Y$infrastructure$§!を追加。"
 RAJ_the_riches_of_the_raj_targets_tt: "少なくとも§Y20§!ユニットの§Y$state_resource_aluminium$§!£resources_strip|2 、§Y$state_resource_rubber$§!£resources_strip|3 、§Y$state_resource_chromium$§!£resources_strip|6 、§Y$state_resource_tungsten$§!£resources_strip|4 、§Y$state_resource_coal$§!£resources_strip|0 、§Y$temporary_state_resource_steel$§!£resources_strip|5 のいずれかを持つ開始時の州: \nさらに§Y+4§!ユニットのリソースの生産を追加。\n§G1§!個の§Y$infrastructure$§!を追加。"
 RAJ_imperial_rail_renewal_act_tt: "産業部門の鉄道の国家方針が完了するごとに、§G1§!個の§Y$industrial_complex$§!を追加。"
 RAJ_south_east_asia_command_rename_dm_tt: "国民精神§Y$RAJ_indian_gentlemen_officers_goe$§!の名前を§Y$RAJ_south_east_asia_command_dm$§!に改名。"
 RAJ_linlithgows_declaration_of_war_tt: "§Y[ROOT.GetNameWithFlag]§!が宗主国（§Y[ENG.GetNameWithFlag]§!）のすべての敵に宣戦布告する。"
 RAJ_linlithgows_declaration_of_war_current_effects_tt: "§Y[ROOT.GetNameWithFlag]§!が宗主国の現在のすべての敵に宣戦布告する。"
 RAJ_exploit_the_frontier_decisions_tt: "自国の資源生産の発展や、ビルマでの資源の利権の要求を可能にする。"
 RAJ_concessions_to_the_industrialists_chances_tt: "§Y$RAJ_investments_from_local_leaders$§!は主に§Y民需産業§!に焦点を当てており、§Y軍需産業§!にはそこまで注力していない。"
 RAJ_empower_provincial_authorities_chances_tt: "§Y$RAJ_investments_from_local_leaders$§!は§Y民需産業§!、§Y軍需産業§!、§Y防衛インフラ§!にそれぞれ均等に焦点を当てている。"
 RAJ_his_majestys_loyal_government_break_free_tt: "完全な独立を果たすには、最終的な3つの国家方針、§Y$RAJ_the_dominion_of_india$§!、§Y$RAJ_keep_calm_and_carry_on$§!、§Y$RAJ_holding_the_gates_of_india$§!をすべて完了させなければならない。"
 RAJ_loyalist_branch_capstone_focuses_become_free_tt: "3つの国家方針、§Y$RAJ_the_dominion_of_india$§!、§Y$RAJ_keep_calm_and_carry_on$§!、§Y$RAJ_holding_the_gates_of_india$§!がすべて完了されれば、§G自治度の変更に関する制限が解除され、§!§Y自由§!となる。"
 RAJ_royal_indian_artillery_dlc: "$RAJ_royal_indian_artillery$"
 RAJ_royal_indian_artillery_dlc_desc: "$RAJ_royal_indian_artillery_desc$"
 RAJ_lions_of_the_great_war_dlc: "$RAJ_lions_of_the_great_war$"
 RAJ_lions_of_the_great_war_dlc_desc: "$RAJ_lions_of_the_great_war_desc$"
 RAJ_chindits_dlc: "$RAJ_chindits$"
 RAJ_chindits_dlc_desc: "$RAJ_chindits_desc$"
 RAJ_re_establish_the_khyber_rifles: "カイバル・ライフル隊の再編成"
 RAJ_re_establish_the_khyber_rifles_desc: "我々は険しい地域を防衛するために、民兵カイバル・ライフル隊を再編成する。おそらく我々も彼らから学ぶことがあるだろう。"
 RAJ_expand_mazagon_dock_dlc: "$RAJ_expand_mazagon_dock$"
 RAJ_expand_mazagon_dock_dlc_desc: "$RAJ_expand_mazagon_dock_desc$"
 RAJ_found_scindia_shipyard_dlc: "$RAJ_found_scindia_shipyard$"
 RAJ_found_scindia_shipyard_dlc_desc: "$RAJ_found_scindia_shipyard_desc$"
 RAJ_royal_indian_navy_dlc: "$RAJ_royal_indian_navy$"
 RAJ_royal_indian_navy_dlc_desc: "$RAJ_royal_indian_navy_desc$"
 RAJ_mughal_shortcut: "政治:\nムガル帝国"
 RAJ_eic_shortcut: "東インド会社"
 RAJ_road_to_independence_shortcut: "独立への道"
 RAJ_majestys_government_shortcut: "忠実な政府"
 RAJ_railways_shortcut: "鉄道"
 RAJ_army_shortcut: "将校"
 RAJ_ammunition_factories_shortcut: "弾薬工場"
 RAJ_recruitment_shortcut: "採用"
 RAJ_navy_shortcut: "インド海軍"
 RAJ_airforce_shortcut: "インド空軍"
 RAJ_constitution_for_the_masses: "大衆のための憲法"
 RAJ_constitution_for_the_masses_desc: "人民共和国は古い帝国の法律に依存してはならない。\n新しい憲法は、君主や植民地総督の気まぐれではなく、労働者、農民、土地を持たない人々の意思を反映したものでなければならない。"
 RAJ_founding_of_the_peoples_republic: "人民共和国の建国"
 RAJ_founding_of_the_peoples_republic_desc: "我々は体制を打倒した。\n今こそ、人民による人民のための、革命によって支えられた新しい体制を築くという使命が始まるのだ。"
 RAJ_agrarian_socialism: "土地社会主義"
 RAJ_agrarian_socialism_desc: "革命は農地から始まる。\n耕す者に土地を返還し、平等と正義の名の下に村々が自治を行うべきである。"
 RAJ_urban_industrialism: "都市産業主義"
 RAJ_urban_industrialism_desc: "未来は牧草地ではなく工場にある。\n急速な工業化を通じてのみ革命を確保し、今後の戦いに備えることができる。"
 RAJ_urban_industrialism_tt: "これにより、五カ年計画は産業拡大により重点を置くよう変更され、建物の建設速度が§G10%§!向上する。"
 RAJ_urban_industrialism_tt2: "これにより、五カ年計画は土地社会主義により重点を置くよう変更され、 "
 RAJ_land_of_the_tillers: "耕作人の土地"
 RAJ_land_of_the_tillers_desc: "地主は消えたが、闘争は続いている。\n我々は土地を再分配し、封建制の最後の鎖を断ち切る。区画ごとに、村ごとに。"
 RAJ_focus_on_the_countryside: "地方重視"
 RAJ_focus_on_the_countryside_desc: "我々の強みは、何百万人もの土を故郷と呼ぶ人々にある。\n彼らに投資し、武装させ、組織化しよう。革命は村々のものである。"
 RAJ_decentralize_the_party: "党の分散化"
 RAJ_decentralize_the_party_desc: "権力はインドラプラスタの役所から流れてくるべきではない。\n地方議会や農村の者たちを通じて、人民が革命を導くべきである。"
 RAJ_industrialize_the_ganges: "ガンジス川の工業化"
 RAJ_industrialize_the_ganges_desc: "ガンジス川は何世紀にもわたって我々を養ってきた。\nそして今、その水は機械を動かし、炉に燃料を供給し、軍隊を武装させるだろう。"
 RAJ_comrades_of_the_city: "都市の同志たち"
 RAJ_comrades_of_the_city_desc: "都市の労働者は先鋒である。\n教育、道具、団結により、彼らは共和国を近代化へと導く。"
 RAJ_central_comittee_authority: "中央委員会の権限"
 RAJ_central_comittee_authority_desc: "規律は力なり。\n中央委員会は革命が混乱に陥らないよう、統治のあらゆる側面を監督する。"
 RAJ_reorganize_the_five_year_plan_towards_heavy_industry: "五カ年計画の転換"
 RAJ_reorganize_the_five_year_plan_towards_heavy_industry_desc: "現在の工業化のペースでは不十分である。\n革命を守るためには、重工業と鋼鉄生産を優先しなければならない。"
 RAJ_invite_soviet_industrial_experts: "ソ連の工業専門家を招待"
 RAJ_invite_soviet_industrial_experts_desc: "ソ連はゼロから産業基盤を構築した経験がある。\n彼らから学び、我々自身の変革を加速させよう。"
 RAJ_planned_economy2: "計画経済の統合"
 RAJ_planned_economy2_desc: "革命には市場は不要である。\nあらゆる資源、あらゆる労働者、そしてあらゆる工場は五カ年計画に奉仕しなければならない。"
 RAJ_the_red_curtain_falls_over_asia: "アジアに赤いカーテンが落ちる"
 RAJ_the_red_curtain_falls_over_asia_desc: "我々は祖国を確保した。\n今こそ、革命の炎を言葉やパンフレット、あるいは銃によって隣人たちに伝える時が来たのだ。"
 RAJ_the_red_curtain_falls_over_asia_desc_tt: "アジア全域に共産主義革命を広げるディシジョンをアンロック"
 RAJ_red_punjab_operation: "赤いパンジャブ作戦"
 RAJ_red_punjab_operation_desc: "我々の首都は外国からの侵略に対して脆弱である。我々は首都の安全地帯を拡大しなければならない。"
 RAJ_secure_rajahsthan: "ラージャスターンの確保"
 RAJ_secure_rajahsthan_desc: "ラージャスターンの砂漠が反革命の拠点になってはならない。\n我々は州を仲間に迎え入れる。"
 RAJ_strike_eastern_pakistan: "東パキスタンへの攻撃"
 RAJ_strike_eastern_pakistan_desc: "[PAK.GetName]の東部は孤立しており、不安定だ。\n彼らがしっかりと足場を固める前の今こそ、攻撃すべき時である。"
 RAJ_mass_assault: "大量突撃"
 RAJ_defenders_of_the_revolution_idea_tt: "§Y革命の大量突撃§!技術を追加。"
 RAJ_arm_the_peasantry: "農民の武装"
 RAJ_arm_the_peasantry_desc: "革命はあらゆる地に広がらなければならない。\n我々は反動に対して無防備な村が一つも残らないよう、忠実な農村民兵に武器を配布する。"
 RAJ_every_man_a_gun: "全員に銃を"
 RAJ_every_man_a_gun_desc: "人民共和国では、すべての国民が兵士である。\n我々は訓練を標準化し、国民全員に武器を支給し、国家そのものを要塞化する。"
 RAJ_every_man_a_leader: "全員が指導者に"
 RAJ_every_man_a_leader_desc: "真の革命的強さは命令からではなく、自主性から生まれる。\n我々は許可を待たずに断固とした行動を取るよう、現地の司令官や民兵の指導者を訓練する。"
 RAJ_defenders_of_the_revolution: "革命の守護者"
 RAJ_defenders_of_the_revolution_desc: "彼らは兵士ではない。彼らは思想の守護者なのだ。\n最も規律正しく忠実な戦士たちを、国土とイデオロギーの両方を守る精鋭部隊へと昇格させる。"
 RAJ_education_for_the_masses: "大衆のための教育"
 RAJ_education_for_the_masses_desc: "知識がなければ、革命は専制政治に陥る。\n識字能力、政治教育、科学的な訓練が、すべての村や工場にもたらされるだろう。"
 RAJ_break_the_zamindars: "ザーミンダールを打ち破れ"
 RAJ_break_the_zamindars_desc: "地主は旧体制の遺物である。\n我々は彼らの財産を解体し、土地を没収し、彼らの権力を風に散らすだろう。"
 RAJ_planned_but_decentralized: "計画的かつ分散型"
 RAJ_planned_but_decentralized_desc: "経済計画は維持するが、地方の集団に自治権を認める。\n官僚主義ではなく、イデオロギーによる効率化である。"
 RAJ_socialist_self_reliance: "社会主義自立"
 RAJ_socialist_self_reliance_desc: "我々は資本主義諸国の輸入や帝国主義顧問に頼ることはない。\nインドは自国で食料を確保し、自らを武装し、必要であれば単独で立ち向かう。"
 RAJ_quality_training: "質の高い訓練"
 RAJ_quality_training_desc: "量だけでは戦争に勝つことはできない。\n訓練プログラムを標準化し、士官の指導を改善し、軍の専門性を高める。"
 RAJ_iron_will_indoctrination: "鉄の意志の教化"
 RAJ_iron_will_indoctrination_desc: "強さは肉体だけにあるのではない。信念の中にあるのだ。\n我々はすべての兵士に絶対的な規律、思想の明晰さ、そして戦うための揺るぎない意志を植え付ける。"
 RAJ_purge_the_reactionaries: "反体制派の粛清"
 RAJ_purge_the_reactionaries_desc: "旧世界との妥協はありえない。\n革命の敵、妨害者、反革命分子は根絶やしにされるだろう。"
 RAJ_stopping_the_japanese_threat_into_central_asia: "中央アジアにおける日本の脅威の阻止"
 RAJ_stopping_the_japanese_threat_into_central_asia_desc: "日本の野望は中国の国境で終わるものではない。彼らの目は今、さらなる帝国拡大の潜在的な足掛かりである中央アジアへと向けられている。\n我々は迅速に行動しなければならない。東の国境を強化することで、征服の波が大草原の先まで到達する前に食い止めることができるだろう。"
