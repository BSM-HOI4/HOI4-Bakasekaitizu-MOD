l_japanese:
 JPN_Nishio_Tsukahara:0 "西尾塚原"
 JPN_Nishio_Tsukahara_desc:0 "西尾塚原は、日本海軍の提督であり、優れた戦術能力を持つ海軍指揮官である。"
 
 # ブハラのキャラクター
 BUK_Alim_Khan:0 "アーリム・ハーン"
 BUK_Alim_Khan_desc:0 "ムハンマド・アーリム・ハーンは、ブハラ・アミール国の最後の統治者であり、伝統的な君主制を維持する指導者である。"
 RUS_Pavel_Nikolayevich:0 "パーヴェル・ニコラエヴィチ"
 RUS_Pavel_Nikolayevich_desc:0 "パーヴェル・ニコラエヴィチは、ロシア帝国の政治家であり、立憲君主制を支持する改革派の指導者である。"
 
 # アンドラのキャラクター
 ADR_Justi_Guitart_i_Vilardebo:0 "ジュスティ・ギタルト・イ・ビラルデボ"
 ADR_Justi_Guitart_i_Vilardebo_desc:0 "ジュスティ・ギタルト・イ・ビラルデボは、アンドラの政治家であり、民主的改革を推進する立憲君主制の支持者である。"
 
 ADR_Ramon_Iglesias_i_Navarri:0 "ラモン・イグレシアス・イ・ナバリ"
 ADR_Ramon_Iglesias_i_Navarri_desc:0 "ラモン・イグレシアス・イ・ナバリは、アンドラの自由主義政治家であり、政治的な改革と近代化を推進している。"
 
 # 日本のキャラクター
 JPN_Chichibunomiya:0 "秩父宮殿下"
 JPN_Chichibunomiya_desc:0 "秩父宮殿下は、日本皇室の一員であり、立憲君主制における皇室の役割を重視する指導者である。"
 
 JPN_kanji_ishiwara:0 "石原莞爾"
 JPN_kanji_ishiwara_desc:0 "石原莞爾は、日本陸軍の元帥であり、卓越した戦略眼と攻撃的な軍事教義で知られる軍事指導者である。"
 
 JPN_Nishio_Tsukahara:0 "塚原二四三"
 JPN_Nishio_Tsukahara_desc:0 "塚原二四三は、日本海軍の提督であり、優れた戦術能力を持つ海軍指揮官である。"
 
 JPN_mikasanomiya:0 "三笠宮崇仁親王"
 JPN_mikasanomiya_desc:0 "三笠宮崇仁親王は、日本皇室の一員であり、学者としての知識と皇室の威厳を兼ね備えた指導者である。"
 
 JPN_Takamatsunomiya:0 "高松宮宣仁親王"
 JPN_Takamatsunomiya_desc:0 "高松宮宣仁親王は、日本皇室の一員にして海軍軍人であり、海軍への深い理解と卓越した指揮能力を持つ指導者である。"