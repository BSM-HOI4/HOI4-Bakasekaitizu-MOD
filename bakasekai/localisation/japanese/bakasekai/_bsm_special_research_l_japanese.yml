l_japanese:
  bsm_special_research:0 "特別研究"
  bsm_special_research_desc:0 "通常技術ツリーとは別に、研究局と汎用研究者を使って物理・社会・工学の特別研究を進める。各分野は10件の研究カードを持ち、条件を満たした候補から少数のカードが提示される。"

  bsm_special_research_establish_bureau:0 "特別研究局を設置"
  bsm_special_research_establish_bureau_desc:0 "通常の研究機関では扱いきれない横断課題を集約する。これにより物理・社会・工学の特別研究カードが解禁される。"
  bsm_sr_refresh_research_cards:0 "研究候補を再評価"
  bsm_sr_refresh_research_cards_desc:0 "研究局の候補リストを更新する。研究者の任用、文化度の上昇、前提研究の完了によって新たな候補が提示されることがある。"
  bsm_sr_recruit_physics_researcher:0 "汎用物理研究者を任用"
  bsm_sr_recruit_physics_researcher_desc:0 "計算、電波、核、ロケットなどを扱う物理研究者を任用する。任用時に研究者特性を1つ得る。"
  bsm_sr_recruit_society_researcher:0 "汎用社会研究者を任用"
  bsm_sr_recruit_society_researcher_desc:0 "行政、教育、士気、兵站、外交を扱う社会研究者を任用する。任用時に研究者特性を1つ得る。"
  bsm_sr_recruit_engineering_researcher:0 "汎用工学研究者を任用"
  bsm_sr_recruit_engineering_researcher_desc:0 "工業、建設、材料、輸送、兵器基盤を扱う工学研究者を任用する。任用時に研究者特性を1つ得る。"

  bsm_sr_physics_computing_labs:0 "物理研究: 計算研究室"
  bsm_sr_physics_computing_labs_desc:0 "実験データを処理する計算研究室を整備し、電子工学研究を加速する。"
  bsm_sr_physics_signal_lattice:0 "物理研究: 信号格子理論"
  bsm_sr_physics_signal_lattice_desc:0 "通信、電波、誘導信号の扱いを体系化する。"
  bsm_sr_physics_applied_atomics:0 "物理研究: 応用原子論"
  bsm_sr_physics_applied_atomics_desc:0 "原子力技術を軍需・産業に接続する研究を進める。"
  bsm_sr_physics_radar_harmonics:0 "物理研究: レーダー高調波"
  bsm_sr_physics_radar_harmonics_desc:0 "レーダー施設と電子観測網の性能を引き上げる。"
  bsm_sr_physics_rocketry_test_range:0 "物理研究: ロケット試験場"
  bsm_sr_physics_rocketry_test_range_desc:0 "推進、弾道、試験手順を標準化し、ロケット研究を進める。"
  bsm_sr_physics_cryptologic_engines:0 "物理研究: 暗号解析機関"
  bsm_sr_physics_cryptologic_engines_desc:0 "暗号機と解析機を研究し、電子技術と情報処理を強化する。"
  bsm_sr_physics_isotope_catalogues:0 "物理研究: 同位体目録"
  bsm_sr_physics_isotope_catalogues_desc:0 "同位体の性質を整理し、原子力研究の実用化を支える。"
  bsm_sr_physics_high_energy_storage:0 "物理研究: 高エネルギー蓄積"
  bsm_sr_physics_high_energy_storage_desc:0 "高密度エネルギーの保存と放出を工業利用へ転換する。"
  bsm_sr_physics_predictive_ballistics:0 "物理研究: 予測弾道学"
  bsm_sr_physics_predictive_ballistics_desc:0 "砲兵、誘導、照準計算を統合して戦場で使える知識にする。"
  bsm_sr_physics_field_manipulation:0 "物理研究: 場操作理論"
  bsm_sr_physics_field_manipulation_desc:0 "電磁場と高エネルギー理論を統合する物理分野の最終研究。"

  bsm_sr_society_administrative_algorithms:0 "社会研究: 行政アルゴリズム"
  bsm_sr_society_administrative_algorithms_desc:0 "行政手続きを再設計し、国家運営の損失を減らす。"
  bsm_sr_society_mass_education:0 "社会研究: 大衆教育体系"
  bsm_sr_society_mass_education_desc:0 "教育制度を体系化し、研究と統合力の基盤を広げる。"
  bsm_sr_society_staff_simulation:0 "社会研究: 参謀演習"
  bsm_sr_society_staff_simulation_desc:0 "軍事組織の意思決定を演習化し、教義研究に接続する。"
  bsm_sr_society_census_harmonization:0 "社会研究: 国勢調査標準化"
  bsm_sr_society_census_harmonization_desc:0 "人口、産業、行政情報を揃え、国家管理を効率化する。"
  bsm_sr_society_public_morale_studies:0 "社会研究: 公共士気研究"
  bsm_sr_society_public_morale_studies_desc:0 "国民感情と宣伝効果を分析し、安定した動員を支える。"
  bsm_sr_society_logistics_sociology:0 "社会研究: 兵站社会学"
  bsm_sr_society_logistics_sociology_desc:0 "物資、人員、交通の流れを社会制度として設計する。"
  bsm_sr_society_doctrinal_synthesis:0 "社会研究: 教義統合法"
  bsm_sr_society_doctrinal_synthesis_desc:0 "戦訓と演習を統合し、陸軍教義の研究効率を高める。"
  bsm_sr_society_civil_defense_model:0 "社会研究: 民間防衛モデル"
  bsm_sr_society_civil_defense_model_desc:0 "防空、防災、疎開の制度設計を研究する。"
  bsm_sr_society_diplomatic_codes:0 "社会研究: 外交符牒"
  bsm_sr_society_diplomatic_codes_desc:0 "外交交渉、秘密交信、国際儀礼を体系化する。"
  bsm_sr_society_strategic_culture:0 "社会研究: 戦略文化論"
  bsm_sr_society_strategic_culture_desc:0 "国家の戦略判断を制度と文化の両面から研究する社会分野の最終研究。"

  bsm_sr_engineering_industrial_automation:0 "工学研究: 工業自動化"
  bsm_sr_engineering_industrial_automation_desc:0 "工場作業の反復工程を自動化し、産業研究を進める。"
  bsm_sr_engineering_materials_program:0 "工学研究: 材料計画"
  bsm_sr_engineering_materials_program_desc:0 "建設、装甲、機械部品の材料規格を整える。"
  bsm_sr_engineering_mobile_platforms:0 "工学研究: 機動プラットフォーム"
  bsm_sr_engineering_mobile_platforms_desc:0 "陸空の移動兵器に共通する車体、機関、整備体系を研究する。"
  bsm_sr_engineering_construction_prefabs:0 "工学研究: 建設プレハブ"
  bsm_sr_engineering_construction_prefabs_desc:0 "建設資材を標準化し、現場作業を高速化する。"
  bsm_sr_engineering_resource_extraction_methods:0 "工学研究: 資源採掘法"
  bsm_sr_engineering_resource_extraction_methods_desc:0 "採掘、精錬、輸送前処理を改善する。"
  bsm_sr_engineering_production_line_memory:0 "工学研究: 生産ライン記憶"
  bsm_sr_engineering_production_line_memory_desc:0 "工場の改善履歴を保存し、切替時の損失を抑える。"
  bsm_sr_engineering_distributed_foundries:0 "工学研究: 分散鋳造所"
  bsm_sr_engineering_distributed_foundries_desc:0 "小規模工場網を組み合わせ、軍需生産の柔軟性を高める。"
  bsm_sr_engineering_naval_architecture_cells:0 "工学研究: 艦船設計セル"
  bsm_sr_engineering_naval_architecture_cells_desc:0 "艦船設計と造船所の技術班を小単位で高度化する。"
  bsm_sr_engineering_aeronautic_tooling:0 "工学研究: 航空治工具"
  bsm_sr_engineering_aeronautic_tooling_desc:0 "航空機生産に必要な治工具と組立手順を整備する。"
  bsm_sr_engineering_railway_systems:0 "工学研究: 鉄道システム工学"
  bsm_sr_engineering_railway_systems_desc:0 "鉄道、補給拠点、交通建設を統合する工学分野の最終研究。"

  bsm_sr_rare_autonomous_laboratories:0 "希少研究: 自律研究所"
  bsm_sr_rare_autonomous_laboratories_desc:0 "研究所そのものを半自律化し、分野横断の研究効率を高める。"
  bsm_sr_rare_logistics_grid:0 "希少研究: 国家兵站グリッド"
  bsm_sr_rare_logistics_grid_desc:0 "産業、交通、行政を一体化した兵站網を設計する。"
  bsm_sr_rare_integrated_warfare:0 "希少研究: 統合作戦理論"
  bsm_sr_rare_integrated_warfare_desc:0 "陸海空の研究成果を作戦体系として統合する。"
  bsm_sr_capstone_integrated_research_institute:0 "統合研究院"
  bsm_sr_capstone_integrated_research_institute_desc:0 "物理・社会・工学の最終研究と希少研究を統合し、恒久的な研究体制を完成させる。"

  bsm_special_research_bureau:0 "特別研究局"
  bsm_special_research_bureau_desc:0 "通常の技術研究では扱いにくい横断課題を集約する研究局。"
  bsm_sr_generic_physics_researcher:0 "汎用物理研究者"
  bsm_sr_generic_physics_researcher_desc:0 "物理、電子、原子力、ロケット研究を担当する研究者。"
  bsm_sr_generic_society_researcher:0 "汎用社会研究者"
  bsm_sr_generic_society_researcher_desc:0 "行政、教育、軍事組織、外交制度を担当する研究者。"
  bsm_sr_generic_engineering_researcher:0 "汎用工学研究者"
  bsm_sr_generic_engineering_researcher_desc:0 "工業、建設、材料、機械設計を担当する研究者。"
  bsm_sr_researcher_trait_brilliant_synthesist:0 "研究者特性: 卓越した統合者"
  bsm_sr_researcher_trait_brilliant_synthesist_desc:0 "別分野の成果を素早く組み合わせ、研究速度を高める。"
  bsm_sr_researcher_trait_meticulous_archivist:0 "研究者特性: 緻密な記録者"
  bsm_sr_researcher_trait_meticulous_archivist_desc:0 "資料整理と再現性を重視し、行政効率と安定性を高める。"
  bsm_sr_researcher_trait_field_experimentalist:0 "研究者特性: 現場実験主義者"
  bsm_sr_researcher_trait_field_experimentalist_desc:0 "机上の理論を工場や建設現場に素早く落とし込む。"
  bsm_sr_researcher_trait_military_liaison:0 "研究者特性: 軍連絡官"
  bsm_sr_researcher_trait_military_liaison_desc:0 "軍の要求を研究計画へ反映し、各軍経験値の蓄積を助ける。"
  bsm_sr_researcher_trait_rare_insight:0 "研究者特性: 希少な洞察"
  bsm_sr_researcher_trait_rare_insight_desc:0 "凡庸な結論から外れた価値ある着想を拾い上げる。"
  bsm_sr_researcher_trait_physics_specialist:0 "研究者特性: 物理学専門"
  bsm_sr_researcher_trait_physics_specialist_desc:0 "物理、電子、原子力、ロケット研究に強い。"
  bsm_sr_researcher_trait_society_specialist:0 "研究者特性: 社会科学専門"
  bsm_sr_researcher_trait_society_specialist_desc:0 "行政、教育、士気、外交研究に強い。"
  bsm_sr_researcher_trait_engineering_specialist:0 "研究者特性: 工学専門"
  bsm_sr_researcher_trait_engineering_specialist_desc:0 "工業、建設、材料、輸送研究に強い。"

