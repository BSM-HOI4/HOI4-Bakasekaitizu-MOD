  bsm_sr_physics_radar_harmonics_result_desc:0 "高調波研究により、レーダー網の建設と電子研究が進みやすくなった。"
  bsm_sr_physics_rocketry_test_range_result_desc:0 "ロケット試験場が推進技術の実用化を支えている。"
