  bsm_sr_physics_predictive_ballistics_result_desc:0 "予測弾道学により、砲兵と照準技術の研究が進んでいる。"
  bsm_sr_physics_field_manipulation_result_desc:0 "場操作理論が物理分野の成果を統合している。"
  bsm_sr_society_administrative_algorithms_result_desc:0 "行政アルゴリズムにより、国家運営の処理能力が向上している。"
  bsm_sr_society_mass_education_result_desc:0 "大衆教育体系が研究者層と国家統合力を広げている。"
