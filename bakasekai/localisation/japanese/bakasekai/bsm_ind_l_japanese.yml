 # アイデア
 # ============================================================
 bsm_ind_idea_saec_leader:0 "南アジア経済共同体・盟主"
 bsm_ind_idea_saec_leader_desc:0 "インドは南アジア経済共同体の盟主として、域内の経済協力を主導している。統一通貨圏の形成と貿易の活性化が期待される。"
 bsm_ind_idea_famine_recovery:0 "飢饉からの復興"
 bsm_ind_idea_famine_recovery_desc:0 "ベンガル飢饉の傷跡はまだ癒えていないが、復興に向けた取り組みが始まっている。"
 bsm_ind_idea_refugee_crisis:0 "難民危機"
 bsm_ind_idea_refugee_crisis_desc:0 "分割と内戦を逃れた難民が大量に流入し、社会的安定を脅かしている。"
 bsm_ind_idea_unified_administration:0 "統一行政"
 bsm_ind_idea_unified_administration_desc:0 "州の再編と行政の統一化により、より効率的な統治が実現している。"
 bsm_ind_idea_non_aligned:0 "非同盟運動"
 bsm_ind_idea_non_aligned_desc:0 "インドは東西冷戦のいずれの陣営にも属さない非同盟の立場を貫く。この姿勢は多くの途上国から尊敬を集めている。"
 bsm_ind_idea_planning_commission:0 "計画委員会"
 bsm_ind_idea_planning_commission_desc:0 "計画委員会の指導のもと、国家主導の経済発展計画が着実に実施されている。インドの近代化は加速する。"

 # ============================================================
 # 決定カテゴリ
 # ============================================================
 IND_national_reconstruction_desc:0 "独立後のインドを再建するための政策"
 IND_partition_management_desc:0 "分割に関わる諸問題への対応"

 # ============================================================
 # 決定
 # ============================================================
 IND_quell_communal_violence_desc:0 "各地で発生している宗教間の暴力事件に対応し、社会秩序を回復する。"
 IND_quell_communal_violence_tooltip:0 "治安部隊を派遣し、宗教間暴力を鎮圧する。"
 IND_manage_refugee_camps_desc:0 "押し寄せる難民のためのキャンプを整備し、人道的な危機に対応する。"
 IND_manage_refugee_camps_tooltip:0 "難民キャンプを設置し、難民の生活を支援する。"
 IND_five_year_plan_civ_desc:0 "五カ年計画に基づき、民間工業への投資を促進する。"
 IND_five_year_plan_civ_tooltip:0 "首都圏に工場建設スロットを追加する。"
 IND_recruit_indian_officers_desc:0 "英国人将校に依存した軍の体制を変え、インド人将校を積極的に育成する。"
 IND_recruit_indian_officers_tooltip:0 "軍のインド化を推進し、指揮能力を向上させる。"
 IND_invite_neighbor_to_saec_desc:0 "近隣諸国を南アジア経済共同体への加盟に招待し、経済圏を拡大する。"
 IND_invite_neighbor_to_saec_tooltip:0 "近隣国を経済同盟に招待する。"
