POS_channel_pressure.1.b:0 "主権を主張し抵抗する"
POS_channel_pressure.1.c:0 "英仏の対立を利用する"
POS_channel_pressure.2.t:0 "フランスの領土要求"
POS_channel_pressure.2.d:0 "フランスが「歴史的権利」を根拠にシーランドへの領土主張を行ってきた。\n我々の対応は如何にあるべきか。"
POS_channel_pressure.2.a:0 "フランスの要求を受け入れる"
POS_channel_pressure.2.b:0 "主権を主張し抵抗する"
POS_channel_pressure.2.c:0 "英仏の対立を利用する"
POS_channel_pressure.3.t:0 "英仏の合同工作"
POS_channel_pressure.3.d:0 "英国とフランスが合同でシーランドへの工作活動を展開している。\n重大な局面に直面している。"
POS_channel_pressure.3.a:0 "議会を招集し対応を協議する"
