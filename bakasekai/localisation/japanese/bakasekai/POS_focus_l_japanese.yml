l_japanese:
POS_fortress_state:0 "要塞国家"
POS_fortress_state_desc:0 "海上要塞を起源とする我が国は、その防衛力において比類なき強さを持つ。"
POS_royal_prestige:0 "王室の威信"
POS_royal_prestige_desc:0 "ベイツ家の王室は国民の尊敬を集め、国家の威信を高めている。"
POS_channel_fortress_spirit:0 "英仏海峡城"
POS_channel_fortress_spirit_desc:0 "海峡に君臨する我が城は、いかなる敵も寄せ付けない不落の要塞である。"
POS_civic_spirit:0 "市民精神"
POS_civic_spirit_desc:0 "市民一人ひとりの参加が、国家を強固なものにする。"
POS_citizen_republic:0 "市民共和国"
POS_citizen_republic_desc:0 "全ての市民が平等に参加する共和国こそ、シーランドの理想の姿である。"
POS_paradise_spirit:0 "楽園精神"
POS_paradise_spirit_desc:0 "労働からの解放と快楽の追求。それこそが人類の到達すべき境地である。"
POS_paradise_residence:0 "楽園の住所"
POS_paradise_residence_desc:0 "シーランドは世界で唯一の楽園である。ここに住む者は全ての苦悩から解放される。"
POS_data_haven_economy:0 "データヘイヴン経済"
POS_data_haven_economy_desc:0 "情報の自由な流通が、新しい経済の基盤となる。"
POS_micronation_diplomacy:0 "ミクロネーション外交"
POS_micronation_diplomacy_desc:0 "世界の小国との連携が、シーランドの外交力を飛躍的に高める。"
POS_channel_defense:0 "海峡防衛体制"
POS_channel_defense_desc:0 "海峡の守りを固め、いかなる侵略も防ぐ準備が整っている。"
POS_maritime_power:0 "海上覇権"
POS_maritime_power_desc:0 "海峡を支配する者は、海を支配する。シーランド海軍の旗の下に。"
POS_roy_bates:0 "ロイ・ベイツ"
POS_joan_bates:0 "ジョアン・ベイツ"
POS_michael_bates:0 "マイケル・ベイツ"
POS_sealand_rising:0 "シーランドの興隆"
POS_sealand_rising_desc:0 "小さな海上要塞国家シーランド。その歴史は今、始まろうとしている。"
POS_royal_house_bates:0 "ベイツ家の王朝"
POS_royal_house_bates_desc:0 "ロイ・ベイツとその家族は、シーランドの王室として国家を率いる。"
POS_fortress_heritage:0 "要塞の遺産"
POS_fortress_heritage_desc:0 "第二次世界大戦の海上要塞ロフツタワーの遺産を、国家の防衛に活かす。"
POS_declaration_sovereignty:0 "主権宣言"
POS_declaration_sovereignty_desc:0 "シーランドは独立した主権国家として、国際社会にその存在を宣言する。"
POS_channel_residence:0 "海峡への移住"
POS_channel_residence_desc:0 "要塞を本格的な居住地として整備し、人口の増加を図る。"
POS_battle_of_sealand:0 "シーランド防衛戦"
POS_battle_of_sealand_desc:0 "侵入者から要塞を守り抜いた栄光の歴史を、軍事の伝統として受け継ぐ。"
POS_princely_court:0 "公国の宮廷"
POS_princely_court_desc:0 "宮廷を整備し、爵位制度を確立する。これは外交上の重要な資産となる。"
POS_royal_navy_tradition:0 "王立海軍の伝統"
POS_royal_navy_tradition_desc:0 "海に囲まれた国家として、海軍の伝統を確立する。"
POS_crown_jewels:0 "王冠の宝石"
POS_crown_jewels_desc:0 "王室の宝物は国家の文化的遺産であり、国民の誇りである。"
POS_resist_channel_powers:0 "海峡列強への抵抗"
POS_resist_channel_powers_desc:0 "英国とフランスの圧力に対し、シーランドは独立を守り抜く。"
POS_channel_fortress:0 "英仏海峡城"
POS_channel_fortress_desc:0 "ついにシーランドは、英仏海峡に君臨する難攻不落の城塞となった。"
POS_civil_reform:0 "市民改革の夜明け"
POS_civil_reform_desc:0 "直接民主制から、より参加型の市民政治への移行を図る。"
POS_citizen_assembly:0 "市民議会の設立"
POS_citizen_assembly_desc:0 "全ての市民が参加できる議会を設立し、真の民主主義を実現する。"
POS_civic_constitution:0 "市民憲法の起草"
POS_civic_constitution_desc:0 "市民の権利と義務を明文化した憲法を起草する。"
POS_local_self_governance:0 "地方自治の確立"
POS_local_self_governance_desc:0 "小さな国家だからこそ、きめ細かな自治が可能である。"
POS_civil_education:0 "市民教育の推進"
POS_civil_education_desc:0 "教育こそが民主主義の基盤である。市民の教養を高める。"
POS_civilism_path:0 "市民主義への道"
POS_civilism_path_desc:0 "直接民主制を深化させ、市民主義国家への移行を完了する。"
POS_citizen_rights:0 "市民権の拡大"
POS_citizen_rights_desc:0 "全ての居住者に市民権を付与し、国家の一員として迎え入れる。"
POS_cooperative_economy:0 "協同組合経済"
POS_cooperative_economy_desc:0 "市民が協力して運営する協同組合経済を構築する。"
POS_citizen_army:0 "市民軍の結成"
POS_citizen_army_desc:0 "市民自身が国を守る。志願制の市民軍を結成する。"
POS_civic_republic:0 "市民共和国"
POS_civic_republic_desc:0 "市民主義の理想が実現した。全ての市民が主権者である。"
POS_paradise_vision:0 "楽園への展望"
POS_paradise_vision_desc:0 "労働からの解放。快楽の追求。自動化が人類に真の自由をもたらす。"
POS_pleasure_gardens:0 "海峡の快楽庭園"
POS_pleasure_gardens_desc:0 "海峡に浮かぶ楽園。あらゆる快楽がここにある。"
POS_automated_leisure:0 "自動化された安逸"
POS_automated_leisure_desc:0 "機械が労働を担い、人間は Leisure を享受する。"
POS_channel_resort:0 "海峡リゾートの建設"
POS_channel_resort_desc:0 "世界中から観光客を惹きつけるリゾート施設を建設する。"
POS_leisure_technology:0 "レジャー技術の開発"
POS_leisure_technology_desc:0 "快楽を最大化するための技術開発に投資する。"
POS_paradise_path:0 "楽園主義への道"
POS_paradise_path_desc:0 "直接民主制を超え、楽園主義国家への移行を完了する。"
POS_hedonistic_culture:0 "享楽文化の開花"
POS_hedonistic_culture_desc:0 "快楽を追求する文化が、シーランドに花開く。"
POS_data_haven:0 "データヘイヴンの構築"
POS_data_haven_desc:0 "インターネット上の自由な数据避難所を構築し、新しい経済を創出する。"
POS_automated_paradise:0 "自動化楽園の完成"
POS_automated_paradise_desc:0 "完全に自動化された楽園。人間はただ快楽を享受するだけである。"
POS_haven_of_hedonism:0 "享楽の楽園"
POS_haven_of_hedonism_desc:0 "シーランドは世界で唯一の真の楽園となった。ここに来る者は全てが幸福である。"
POS_title_enterprise:0 "爵位販売事業の開始"
POS_title_enterprise_desc:0 "シーランドの爵位を世界中に販売し、外交と収入の新たな源を開拓する。"
POS_diplomatic_outreach:0 "外交使節団の派遣"
POS_diplomatic_outreach_desc:0 "世界中に使節団を派遣し、シーランドの存在を広く知らしめる。"
POS_sell_barony:0 "男爵位の販売"
POS_sell_barony_desc:0 "男爵位を販売し、小国との関係を構築する。"
POS_micronation_contact:0 "ミクロネーションとの接触"
POS_micronation_contact_desc:0 "世界の他のミクロネーションとの外交チャンネルを開設する。"
POS_sell_earldom:0 "伯爵位の販売"
POS_sell_earldom_desc:0 "伯爵位を販売し、より広範な国との関係を構築する。"
POS_micronation_league:0 "ミクロネーション連盟"
POS_micronation_league_desc:0 "ミクロネーション連盟を結成し、小国の連帯を強化する。"
POS_title_to_generals:0 "将軍への爵位授与"
POS_title_to_generals_desc:0 "他国の将軍に爵位を授与し、軍事的影響力を拡大する。"
POS_sell_dukedom:0 "公爵位の販売"
POS_sell_dukedom_desc:0 "最高位の公爵位を主要国に販売し、最大の外交効果を狙う。"
POS_international_recognition:0 "国際承認キャンペーン"
POS_international_recognition_desc:0 "国際社会にシーランドの主権を広く認めさせる。"
POS_small_state_alliance:0 "小国連合の結成"
POS_small_state_alliance_desc:0 "小国連合を結成し、大国の圧力に立ち向かう。"
POS_industrial_foundation:0 "産業基盤の構築"
POS_industrial_foundation_desc:0 "小国ながらも、自立した産業基盤を構築する。"
POS_dockyard_expansion:0 "ドックヤード拡張"
POS_dockyard_expansion_desc:0 "造船能力を拡大し、海軍力の基盤を強化する。"
POS_arms_production:0 "兵器生産の開始"
POS_arms_production_desc:0 "自国での兵器生産を開始し、軍事的独立性を高める。"
POS_naval_construction:0 "海軍建造計画"
POS_naval_construction_desc:0 "独自の海軍建造計画を立案し、海峡の防衛力を強化する。"
POS_fortification_program:0 "要塞化計画"
POS_fortification_program_desc:0 "海峡城を難攻不落の要塞へと改造する。"
POS_channel_trade:0 "海峡貿易の振興"
POS_channel_trade_desc:0 "海峡の交通の要衝として、貿易を振興する。"
POS_coast_guard_est:0 "沿岸警備隊の編成"
POS_coast_guard_est_desc:0 "沿岸警備隊を編成し、領海の安全を確保する。"
POS_channel_defense_focus:0 "海峡防衛体制"
POS_channel_defense_focus_desc:0 "海峡の防衛体制を全面的に強化する。"
POS_marine_forces:0 "海兵隊の編成"
POS_marine_forces_desc:0 "海兵隊を編成し、上陸戦能力を獲得する。"
POS_maritime_supremacy:0 "海上覇権の確立"
POS_maritime_supremacy_desc:0 "シーランド海軍は海峡を制し、海上覇権を確立する。"
POS_channel_pressure.1.t:0 "英国の主権主張"
POS_channel_pressure.1.d:0 "英国政府がシーランドの主権に異議を唱え、「海峡の安全」を名目に圧力をかけてきた。\n我々は如何に対処すべきか。"
