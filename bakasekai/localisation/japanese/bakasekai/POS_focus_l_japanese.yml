POS_channel_pressure.4.d:0 "我々の対応が実を結び、シーランドの立場は強化された。\n国際社会も我々の決意を認識したようだ。"
POS_channel_pressure.4.a:0 "シーランドは屈しない"
POS_sovereignty_crisis.1.t:0 "主権の危機"
POS_sovereignty_crisis.1.d:0 "国際社会の一部がシーランドの国家としての地位を疑問視している。\n我々は主権をどのように擁護するか。"
