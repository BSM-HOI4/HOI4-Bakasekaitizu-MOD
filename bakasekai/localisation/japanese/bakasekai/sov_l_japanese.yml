l_japanese:
BSM_SOV_Exile_to_Far_East:3 "極東への追放"
BSM_SOV_Exile_to_Far_East_desc:3 "白軍による内戦の敗北後、我々の指導者たちはシベリアの辺境に追放された。ここで彼らは新しい生活を始め、革命の火を再び燃え上がらせる準備をしなければならない。"
BSM_SOV_International_Isolation:3 "国際的孤立"
BSM_SOV_International_Isolation_desc:3 "我々の革命的な理想は、世界の多くの国々から敵意と不信を招いている。我々は孤立しているが、我々の信念は揺るがない。"
BSM_SOV_Food_Shortage:3 "食糧不足"
BSM_SOV_Food_Shortage_desc:3 "内戦と経済の混乱により、我々の国は深刻な食糧不足に直面している。人民の健康と士気を維持するために、我々は緊急の対策を講じなければならない。"

# 新しい初期国民精神
SOV_russian_unification_ambition:0 "ロシア統一の野望"
SOV_russian_unification_ambition_desc:0 "ロシアは1つの国家だけでいい！！"

SOV_incomplete_revolution:0 "不完全な革命"
SOV_incomplete_revolution_desc:0 "我々は数多の同志の犠牲があったにもかかわらず全土の革命には至らなかった。"

SOV_great_famine:0 "全ロシア大飢饉"
SOV_great_famine_desc:0 "1930年に発生した大飢饉は未だ改善を見せておらず、悪化の一途を辿っている。町では食料品がなくなり、軍の配給には雑草しかない。"

SOV_internal_struggle:0 "内部闘争"
SOV_internal_struggle_desc:0 "国内では様々な党・派閥が存在しており、闘争に勝利しようと躍起になっている。"