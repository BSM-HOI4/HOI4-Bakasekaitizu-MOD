l_japanese:
 # =====================================================
 # ROOT
 # =====================================================
 SBR_free_declaration:0 "自由の宣言"
 SBR_free_declaration_desc:0 "シベリアの凍てつく大地に、新たな自由国家の誕生を高らかに宣言する。廃墟と希望の地から、聖シベリア自由国の歴史が始まる。"

 # =====================================================
 # TIER 1: 基盤
 # =====================================================
 SBR_internal_order:0 "内部秩序の確立"
 SBR_internal_order_desc:0 "分裂した国内勢力を統合し、強固な行政基盤を構築する。三つ巴の権力闘争に終止符を打つ時だ。"
 SBR_siberian_resource:0 "シベリアの資源開発"
 SBR_siberian_resource_desc:0 "凍土の下に眠る豊富な鉄鉱石と資源を開発し、国家の経済基盤を固める。"

 # =====================================================
 # TIER 2: 路線選択
 # =====================================================
 SBR_path_ruin:0 "廃墟への道"
 SBR_path_ruin_desc:0 "廃墟主義の旗の下、古い秩序を破壊し、廃墟の上に新世界を築く。破滅的な力こそが真の解放である。"
 SBR_path_holy:0 "聖なる道"
 SBR_path_holy_desc:0 "太古の神話と聖なる力を信じ、シベリアを神聖国家として導く。天の意志がわれわれに勝利を与えるだろう。"
 SBR_path_red:0 "赤の道"
 SBR_path_red_desc:0 "赤い革命の炎をシベリアに灯す。労働者の力で腐敗した帝国主義を打倒し、真の平等社会を建設する。"

 # =====================================================
 # 廃墟ブランチ
 # =====================================================
 SBR_ruin_doctrine:0 "廃棄主義教義"
 SBR_ruin_doctrine_desc:0 "廃棄の教義を軍全体に浸透させる。破壊こそが我々の戦術であり、哲学である。"
 SBR_ruin_war_economy:0 "廃墟経済体制"
 SBR_ruin_war_economy_desc:0 "全ての生産力を戦争に捧げる廃墟経済体制を確立する。民生は二の次、勝利こそが全てだ。"
 SBR_ruin_purge:0 "反廃墟主義者の粛清"
 SBR_ruin_purge_desc:0 "国内に潜む反廃墟主義者と日和見主義者を徹底的に排除する。恐怖が国を一つにする。"
 SBR_ruin_blitzkrieg:0 "電撃戦教義"
 SBR_ruin_blitzkrieg_desc:0 "電光石火の電撃戦術を研究・採用する。装甲の鉄槌が敵防衛線を一気に突き崩す。"
 SBR_ruin_arsenal:0 "廃墟の兵器庫"
 SBR_ruin_arsenal_desc:0 "シベリアの工業力を結集し、廃墟の兵器庫を構築する。弾薬と兵器が絶え間なく供給される。"
 SBR_ruin_sov_ultimatum:0 "ソ連への最終通告"
 SBR_ruin_sov_ultimatum_desc:0 "腐敗し崩壊しつつあるソ連に対し、廃墟主義の鉄槌を突きつける最終通告を発する。属国か、滅亡か。"
 SBR_ruin_total_mobilization:0 "総動員令"
 SBR_ruin_total_mobilization_desc:0 "国民全員を戦争機械の歯車として組み込む総動員令を発令する。廃墟主義の嵐が吹き荒れる。"
 SBR_ruin_west_reclaim:0 "西方廃墟化"
 SBR_ruin_west_reclaim_desc:0 "ロシア帝国とノルウェーの占領地を廃墟の鉄槌で取り戻す。西の地は我らの廃墟となる。"
 SBR_ruin_west_reclaim_tt:0 "西方（ロシア帝国・ノルウェー方面）への国家主張が追加される。"
 SBR_ruin_south_conquest:0 "南方征服"
 SBR_ruin_south_conquest_desc:0 "中華と朝鮮の大地を廃墟の足で踏み荒らす。東アジアの旧秩序は消え去るだろう。"
 SBR_ruin_south_conquest_tt:0 "中国・朝鮮方面への国家主張が追加される。"
 SBR_ruin_convergence:0 "シベリア廃墟帝国"
 SBR_ruin_convergence_desc:0 "廃墟の上にのみ、真の帝国は建てられる。聖シベリアの廃墟帝国がユーラシアに君臨する。"
 SBR_ruin_convergence_tt:0 "廃墟帝国の威光が轟き渡る。戦意・安定度が大幅に向上する。"

 # =====================================================
 # 神話ブランチ
 # =====================================================
 SBR_holy_shaman:0 "シャーマン評議会"
 SBR_holy_shaman_desc:0 "古来のシャーマンたちを最高顧問として招聘する。精霊の声が国家の方向を示し、民衆の心を一つにする。"
 SBR_holy_divine_army:0 "聖戦士団"
 SBR_holy_divine_army_desc:0 "神の名の下に戦う聖戦士団を組織する。信仰の力が普通の兵士を神聖な戦士へと変える。"
 SBR_holy_theocracy:0 "神政国家宣言"
 SBR_holy_theocracy_desc:0 "聖シベリアを神の律法によって統治される神政国家として正式に宣言する。政治は信仰と一体化する。"
 SBR_holy_prophecy:0 "神託宣布"
 SBR_holy_prophecy_desc:0 "シャーマン評議会が下した神のお告げを国民に宣布する。科学と技術への神の祝福が研究を加速させる。"
 SBR_holy_crusade:0 "聖征発動"
 SBR_holy_crusade_desc:0 "神の意志の名の下に聖征を発動する。不信心な政権に聖なる裁きを下す。"
 SBR_holy_sacred_decree:0 "聖地布告"
 SBR_holy_sacred_decree_desc:0 "シベリアを超えた全ての神聖な土地の回収を宣言する。ソ連に占領された聖地を取り戻す時だ。"
 SBR_holy_sacred_decree_tt:0 "ソ連の主要州への国家主張が追加され、傀儡化戦争目標が設定される。"
 SBR_holy_holy_industry:0 "聖なる工業"
 SBR_holy_holy_industry_desc:0 "信仰の力を工業生産に転化する。神の加護の下、シベリアの工場が昼夜を問わず動き続ける。"
 SBR_holy_west_return:0 "西方聖地回収"
 SBR_holy_west_return_desc:0 "かつて聖シベリアの支配下にあった西方の聖地を、神の名の下に取り戻す。ロシア帝国とノルウェーよ、備えよ。"
 SBR_holy_west_return_tt:0 "西方（ロシア帝国・ノルウェー方面）への国家主張が追加される。"
 SBR_holy_south_mission:0 "南方宣教"
 SBR_holy_south_mission_desc:0 "神話の教えを南方の異教徒に広める宣教師を派遣する。必要ならば、剣によって。"
 SBR_holy_south_mission_tt:0 "東方・南方への国家主張が追加される。"
 SBR_holy_convergence:0 "神聖シベリア顕現"
 SBR_holy_convergence_desc:0 "神話の力が現世に顕現する。聖シベリアの神聖使命が完成へと向かい、ユーラシアに神の国が建てられる。"
 SBR_holy_convergence_tt:0 "神聖帝国の聖光が全土に降り注ぐ。安定度・政治力が大幅に向上する。"

 # =====================================================
 # 共産ブランチ
 # =====================================================
 SBR_red_workers:0 "労働者評議会"
 SBR_red_workers_desc:0 "シベリアの労働者たちが権力を握る。評議会制度が国家の根幹となり、生産力を爆発的に高める。"
 SBR_red_army_rebuild:0 "赤軍再建"
 SBR_red_army_rebuild_desc:0 "ブリュヘル将軍の指揮の下、新しい赤軍を組織する。革命を守る鉄の盾と矛が誕生する。"
 SBR_red_collectivization:0 "農業集団化"
 SBR_red_collectivization_desc:0 "農業を集団化し、社会主義的生産様式に転換する。人民は土地から解放され、工場へと向かう。"
 SBR_red_heavy_industry:0 "重工業化"
 SBR_red_heavy_industry_desc:0 "スターリン式5ヶ年計画を参考に、シベリア版重工業化を推進する。鉄と鋼鉄が国力の基盤となる。"
 SBR_red_purge_bourgeois:0 "ブルジョワ粛清"
 SBR_red_purge_bourgeois_desc:0 "革命に反対するブルジョワジーと反革命分子を徹底的に粛清する。赤い恐怖が国を清める。"
 SBR_red_absorb_sov:0 "ソ連吸収計画"
 SBR_red_absorb_sov_desc:0 "腐敗したモスクワの官僚主義に終止符を打つ。本物の社会主義はシベリアから始まる。ソ連を吸収し、真の人民共和国を建設する。"
 SBR_red_absorb_sov_tt:0 "ソ連への傀儡化戦争目標が追加される。"
 SBR_red_eastern:0 "東方赤化"
 SBR_red_eastern_desc:0 "赤い革命の波を東方に広める。中国と朝鮮の労働者階級が解放を待っている。"
 SBR_red_sov_integrate:0 "ソビエト統合"
 SBR_red_sov_integrate_desc:0 "傀儡化したソ連を本格的に統合する。モスクワの官僚機構を解体し、シベリア式の人民評議会に再編する。"
 SBR_red_sov_integrate_tt:0 "ソ連統合による生産力ボーナスが追加される。"
 SBR_red_south_advance:0 "南下征服"
 SBR_red_south_advance_desc:0 "赤い軍旗を南に向ける。中国・朝鮮の資本主義勢力を打倒し、アジアに赤の楽園を建設する。"
 SBR_red_south_advance_tt:0 "南方への国家主張と動員力が追加される。"
 SBR_red_convergence:0 "シベリア赤色共和国"
 SBR_red_convergence_desc:0 "シベリアを中心とした新たな赤色大国が誕生する。東西に広がる社会主義の大帝国がユーラシアを席巻する。"
 SBR_red_convergence_tt:0 "赤色帝国の旗がユーラシアに翻る。生産力・兵器庫が大幅に強化される。"

 # =====================================================
 # FINAL
 # =====================================================
 SBR_saint_siberia_glory:0 "聖シベリアの栄光"
 SBR_saint_siberia_glory_desc:0 "廃墟の道を歩もうと、聖なる道を歩もうと、赤い道を歩もうと——聖シベリア自由国はその栄光をユーラシアの歴史に永遠に刻む。"
 SBR_saint_siberia_glory_tt:0 "聖シベリア自由国の名声がユーラシア全土に轟く。国家安定と戦意が大幅に向上する。"

 # =====================================================
 # 国民精神
 # =====================================================
 SBR_spirit_order:0 "秩序の確立"
 SBR_spirit_order_desc:0 "内部の混乱が収まり、国家行政が機能し始めた。"
 SBR_spirit_ruinism_fervor:0 "廃墟の熱狂"
 SBR_spirit_ruinism_fervor_desc:0 "廃墟主義の信念が国民を焚きつける。破壊への渇望が軍の士気を高めるが、安定を損なう。"
 SBR_spirit_holy_mandate:0 "聖なる使命"
 SBR_spirit_holy_mandate_desc:0 "神話の力への信仰が国民を一つにする。聖なる使命感が国家を安定させ、発展を促す。"
 SBR_spirit_red_vanguard:0 "赤の先鋒"
 SBR_spirit_red_vanguard_desc:0 "社会主義革命の先鋒として、労働者が団結する。生産力が向上し、革命の炎が燃え続ける。"
 SBR_spirit_siberian_bastion:0 "シベリアの砦"
 SBR_spirit_siberian_bastion_desc:0 "シベリアの凍土を活かした堅固な防御陣地が構築された。敵はシベリアの大地で消耗するだろう。"
 SBR_spirit_theocracy:0 "神政国家"
 SBR_spirit_theocracy_desc:0 "聖シベリアは神の律法によって統治される。シャーマンの権威が政治に浸透し、秩序と繁栄をもたらす——ただし、戦意は幾分か失われる。"
