l_japanese:

 # National Spirits
 NOR_sunken_ship:0 "沈められた船"
 NOR_sunken_ship_desc:0 "偉大なるハラール1世が統一した我らの祖国は隣国の帝国主義的な拡張政策に飲まれ、今は祖国から遠いシベリアの奥地に押し込められている。だが我々は決して諦める事はないだろう。祖国の土を踏むその時まで。"

 NOR_one_nation_two_language:0 "1つの国家、2つの言語"
 NOR_one_nation_two_language_desc:0 "我が国の公用語は現在2つ、1つは我々がかつてより使用しているノルウェー語、もう1つはこの土地で使われているロシア語である。どちらも語族は同じだがそれ以外は全くもって違う言語である。このような現状では何をするにも効率が悪い。いずれどちらかの言語に統一しなければならない。"

 NOR_old_industrial_tradition:0 "非効率な産業制度"
 NOR_old_industrial_tradition_desc:0 "この国の産業制度は未だ未熟で、古い非効率な制度が現在でも残っている。"

 NOR_haakon_vii:0 "国王ホーコン7世"
 NOR_haakon_vii_desc:0 "大叔父であるオスカル2世の継承者にしてノルウェー国王のホーコン7世のもとノルウェー国民は団結し、かつての土地を取り戻す日を目指している。"