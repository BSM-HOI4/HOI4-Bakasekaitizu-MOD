l_japanese:
 fallen_empire_machine:0 "没落した帝国：機械知性"
 fallen_empire_machine_desc:0 "この国はかつて銀河を支配した機械知性の成れの果てです。現在は休眠状態にあり、外部への干渉を最小限に留めています。"
 fallen_empire_xenophobe:0 "没落した帝国：狂信的排他主義"
 fallen_empire_xenophobe_desc:0 "この国は異星種族を激しく嫌悪し、自らの領域に引きこもっています。彼らを刺激しない限り、脅威となることはないでしょう。"
 fallen_empire_isolationist:0 "没落した帝国：隔絶主義者"
 fallen_empire_isolationist_desc:0 "この国は外界との関わりを完全に断っています。彼らはただ静かに、自らの歴史を守り続けています。"
 fallen_empire_watchers:0 "没落した帝国：観測者"
 fallen_empire_watchers_desc:0 "この国は若い文明を観察することを目的としています。彼らは干渉することなく、ただ記録し続けています。"
 bsm_ancestor_databanks:0 "先人のデータ保管庫"
 bsm_ancestor_databanks_desc:0 "没落した帝国から提供された古代のデータベースです。解析することで飛躍的な技術進歩が見込めます。"
 
 bsm_fallen_empire_gift_received:0 "贈り物を受け取った"
 bsm_fallen_empire_gift_refused:0 "贈り物を拒否された"

 bsm_fallen_empire.1.t:0 "近隣国への贈り物"
 bsm_fallen_empire.1.d:0 "我々の倉庫には使われない物資が溢れている。近隣の若い文明にこれらを分け与えることで、彼らの成長を促すべきだろうか？"
 bsm_fallen_empire.1.a:0 "彼らに接触を図ろう"

 bsm_fallen_empire.2.t:0 "古代帝国からの贈り物"
 bsm_fallen_empire.2.d:0 "近隣の[FROM.GetName]から通信が入りました。彼らは我々の文明の発展を支援するため、物資や技術の提供を申し出ています。"
 bsm_fallen_empire.2.a:0 "ありがたく受け取ろう"
 bsm_fallen_empire.2.b:0 "彼らの施しなど必要ない！"

 bsm_fallen_empire.3.t:0 "拒絶"
 bsm_fallen_empire.3.d:0 "彼らは我々の善意を拒絶しました。無礼な連中だ。"
 bsm_fallen_empire.3.a:0 "放っておこう"

 bsm_fallen_empire.10.t:0 "資源の到着"
 bsm_fallen_empire.10.d:0 "[FROM.GetName]から大量の産業支援物資が届きました。これにより我々の工業力は強化されるでしょう。"
 
 bsm_fallen_empire.11.t:0 "装備の到着"
 bsm_fallen_empire.11.d:0 "[FROM.GetName]から最新鋭の装備が届きました。軍の近代化に役立つでしょう。"

 bsm_fallen_empire.12.t:0 "技術支援"
 bsm_fallen_empire.12.d:0 "[FROM.GetName]から技術顧問団が派遣されました。彼らの知識は我々の科学技術を飛躍的に進歩させるでしょう。"

 bsm_fallen_empire.13.t:0 "データ保管庫の受信"
 bsm_fallen_empire.13.d:0 "[FROM.GetName]から膨大なデータが送信されてきました。これには失われた古代の技術が含まれているようです。"
 fallen_empire.1.t:0 "古代帝国からの贈り物の提案"
 fallen_empire.1.desc:0 "我々の偉大なる文明の倉庫には、もはや使用されない物資が山積みとなっている。近隣の若き文明に対し、これらを提供することで彼らの発展を助け、同時に友好関係を築くべきではないか？"
 fallen_empire.1.a:0 "贈り物を送ろう"
 fallen_empire.1.b:0 "彼らに関わる必要はない"
