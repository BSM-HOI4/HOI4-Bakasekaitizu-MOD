l_japanese:
 nts.1.t:0 "シンド分離の報"
 nts.1.d:0 "1936年4月、イギリス領インドのボンベイ総督府からシンド州が切り離されたとの公電が届いた。我らの手にあるアラビア海の港湾地帯は依然として仮称の印章で治められており、机の代表たちは海側の正式な呼び名すら定めていなかった事実に直面した。南の海への回廊を確たるものにするためにも、台帳の空白を埋める作業を急がねばならない。"
 nts.1.a:0 "会議の議事に載せよ"
 nts.1b.t:0 "シンド、ボンベイより分離"
 nts.1b.d:0 "イギリス領インド帝国において行政機構の再編が行われ、インダス下流域のシンドがボンベイ総督府から分離された。この報せを受けた内陸のナントカスタン会議では、自らが領有する沿岸部の名称がいまだ仮称のままであるという奇妙な実態が浮き彫りとなった。巨大な名無しの連邦が海へ通じる窓口をどう位置づけるのか、近隣諸国も注視している。"
 nts.1b.a:0 "我々の沿岸も名前がない"
 nts.1b.b:0 "遠い内陸の出来事だ"
 nts.2.t:0 "カラートの自治要求"
 nts.2.d:0 "1933年以来カラートのハーンを務めるアフマド・ヤール・ハンから、バルーチスターン沿岸の自治を公認せよとの使節が訪れた。荒涼たる岩山と海岸線を握る土着の首長は、連邦の緩やかな秩序を認める代償として、自らの伝統的支配権と固有の名称を文書に記すよう求めている。この申し出を容認して地方の平穏を買うか、拒絶して中央の威信を示すか、決断を下さねばならない。"
 nts.2.a:0 "自治の名を認める"
 nts.2.b:0 "要求を拒絶する"
 nts.4.t:0 "スクヴォルツォフの着任"
 nts.4.d:0 "激しい大粛清の嵐が吹き荒れたのち、モスクワの党中央人事部からニコライ・スクヴォルツォフが派遣されてきた。かつての現地書記たちが次々と姿を消したアルマトイの執務室で、彼はクレムリンの意向を体現する冷徹な監査役として党印を握り直す。地方の個性は削ぎ落とされ、連邦は機械的な番号と厳格な規律によって再編されることとなる。"
 nts.4.a:0 "番号の共和国に印を押せ"
 nts.5.t:0 "詩人イクバルの死"
 nts.5.d:0 "1938年4月、ラホールの地で精神の灯火を掲げ続けてきたムハンマド・イクバルが息を引き取った。イスラムの覚醒と大地の調和を謳い上げた彼の流麗な詩句は、五つの机の対立を宥める貴重な絆であった。偉大なる言葉の紡ぎ手を失った今、平原との命名合意は大きく揺らぎ、残された者たちは白紙の草案を前に立ち尽くしている。"
 nts.5.a:0 "草案だけが残る"
