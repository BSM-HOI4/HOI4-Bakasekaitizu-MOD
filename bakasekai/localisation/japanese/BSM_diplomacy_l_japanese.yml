l_japanese:
BSM_FABRICATE_CLAIM_ACTION_TITLE:0 "請求権の捏造"
BSM_FABRICATE_CLAIM_ACTION_ACTION_DESC:0  "§Y[FROM.GetName]§!の州のいずれか一つに対する請求権の捏造プロセスを開始します。統一通貨を消費し、外交関係が悪化する可能性があります。"
BSM_FABRICATE_CLAIM_DIPLO_COST:0 "£resource_energy_large §H100§!"
BSM_FABRICATE_CLAIM_DIPLO_COST_DESC:0 "請求権の捏造には、£resource_energy_large §H統一通貨§!が§Y100§!必要です。"
