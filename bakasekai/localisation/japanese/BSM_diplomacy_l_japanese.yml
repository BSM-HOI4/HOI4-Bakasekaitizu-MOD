 # Iberian Economic Sphere
 SPR_grant_north_african_autonomy:0 "北アフリカへの自治付与"
 SPR_grant_north_african_autonomy_desc:0 "我々の北アフリカ領土、セウタとメリリャに自治権を与え、経済的な連携を強化します。"
 BSM_iberian_economic_sphere_category:0 "イベリア経済圏"
 BSM_iberian_sphere.1.t:0 "イベリア経済圏の形成"
 BSM_iberian_sphere.1.d:0 "スペインは北アフリカのセウタとメリリャに自治権を認め、それらを包含する新たな経済圏「イベリア経済圏」の設立を宣言しました。"
 BSM_iberian_sphere.1.a:0 "素晴らしい！"

 # Iberian Expansion
 BSM_petition_to_join_iberian_sphere:0 "イベリア経済圏への加盟申請"
 BSM_petition_to_join_iberian_sphere_desc:0 "我々の利益のため、イベリア経済圏への加盟を申請します。"
 bsm_iberian_sphere.10.t:0 "イベリア経済圏への加盟申請"
 bsm_iberian_sphere.10.d:0 "[FROM.GetName]がイベリア経済圏への加盟を希望しています。"
 bsm_iberian_sphere.10.a:0 "歓迎しよう"
 bsm_iberian_sphere.10.b:0 "断る"
  bsm_can_fabricate_claim_on_this_state_in_event_trigger:0 "この州に請求権を捏造可能"
  # イベント
  BSM_FABRICATE_CLAIM_EVENT_1_TITLE:0 "[FROM.GetName]に対する請求権の捏造"
  BSM_FABRICATE_CLAIM_EVENT_1_DESC:0 "諜報部員が[FROM.GetName]の領土である§Y[event_target:bsm_target_state_for_claim_fabrication.GetName]§!に対する請求権の捏造準備を完了しました。\n\nこれには§R[ROOT.bsm_fabrication_actual_cost]統一通貨（UC）§!を消費し、間違いなく国際的な非難を浴び、[FROM.GetName]との関係は悪化するでしょう。" 
# [ROOT.bsm_fabrication_actual_cost] はイベント内で計算したコストを表示する一時変数
  BSM_FABRICATE_CLAIM_EVENT_1_OPT_A:0 "実行せよ！[event_target:bsm_target_state_for_claim_fabrication.GetName]は我々のものだ！"
  BSM_FABRICATE_CLAIM_EVENT_1_OPT_B:0 "今はその時ではない。"

  BSM_FABRICATE_CLAIM_UC_SHORTAGE_TITLE:0 "資金不足"
  BSM_FABRICATE_CLAIM_UC_SHORTAGE_DESC:0 "請求権の捏造に必要な統一通貨が不足しています。"
  OKAY:0 "了解"
 RECALL_VOLUNTEERS_TITLE:0 "義勇軍の撤退"
