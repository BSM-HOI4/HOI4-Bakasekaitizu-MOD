l_japanese:
 # 指向選択フォーカス
 MYS_early_outbreak:0 "早期暴発指向"
 MYS_early_outbreak_desc:0 "速やかに行動を起こし、小規模な軍事力で世界に衝撃を与える。脅威度は低く、国力も小さいが、迅速な暴発を目指す。"
 MYS_mid_rampage:0 "中期暴走指向"
 MYS_mid_rampage_desc:0 "中程度の準備期間を経て、バランスの取れた軍事力で世界に挑戦する。脅威度は中程度、国力も中程度での暴走を目指す。"
 MYS_late_disaster:0 "後期災害指向"
 MYS_late_disaster_desc:0 "十分な準備期間を経て、大規模な産業力で世界を圧倒する。脅威度は中程度だが国力は大で災害級の展開を目指す。"
 MYS_end_crisis:0 "末期危機指向"
 MYS_end_crisis_desc:0 "最大限の準備を整え、圧倒的な国力で世界に終末をもたらす。脅威度は中程度だが国力は最大級での危機的暴発を目指す。"
 
 # 早期暴発ツリー
 MYS_early_mobilization:0 "緊急動員"
 MYS_early_mobilization_desc:0 "直ちに国民を動員し、軍事力を強化する。"
 MYS_early_rapid_industry:0 "迅速工業化"
 MYS_early_rapid_industry_desc:0 "最小限の工業基盤を急速に構築する。"
 MYS_early_military_first:0 "軍事優先"
 MYS_early_military_first_desc:0 "すべてのリソースを軍事力強化に集中させる。"
 MYS_early_infantry_equipment:0 "歩兵装備の生産"
 MYS_early_infantry_equipment_desc:0 "基本的な歩兵装備の大量生産を開始する。"
 MYS_early_emergency_research:0 "緊急研究"
 MYS_early_emergency_research_desc:0 "最低限の技術研究を急いで進める。"
 MYS_early_blitzkrieg:0 "電撃戦ドクトリン"
 MYS_early_blitzkrieg_desc:0 "速度と機動力を重視した戦術を採用する。"
 MYS_early_tank_production:0 "戦車生産開始"
 MYS_early_tank_production_desc:0 "機甲部隊の基礎となる戦車の生産を始める。"
 MYS_early_air_power:0 "航空戦力の確保"
