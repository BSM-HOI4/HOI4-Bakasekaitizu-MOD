l_japanese:
 # 指向選択フォーカス
 MYS_early_outbreak:0 "早期暴発指向"
 MYS_early_outbreak_desc:0 "速やかに行動を起こし、小規模な軍事力で世界に衝撃を与える。脅威度は低く、国力も小さいが、コスト40以下での迅速な暴発を目指す。"
 MYS_mid_rampage:0 "中期暴走指向"
 MYS_mid_rampage_desc:0 "中程度の準備期間を経て、バランスの取れた軍事力で世界に挑戦する。脅威度は中程度、国力も中程度、コスト100以下での暴走を目指す。"
 MYS_late_disaster:0 "後期災害指向"
 MYS_late_disaster_desc:0 "十分な準備期間を経て、大規模な産業力で世界を圧倒する。脅威度は中程度だが国力は大、コスト150以下での災害級の展開を目指す。"
 MYS_end_crisis:0 "末期危機指向"
 MYS_end_crisis_desc:0 "最大限の準備を整え、圧倒的な国力で世界に終末をもたらす。脅威度は中程度だが国力は最大級、コスト150以降での危機的暴発を目指す。"
 
 # 早期暴発ツリー
 MYS_early_prep_1:0 "緊急軍備"
 MYS_early_prep_1_desc:0 "迅速な軍事動員の準備を開始する。"
 MYS_early_prep_2:0 "軍需工場の急造"
 MYS_early_prep_2_desc:0 "最小限の軍需工場を建設する。"
 MYS_early_outbreak_execute:0 "早期暴発の実行"
 MYS_early_outbreak_execute_desc:0 "準備が整った。今こそ行動する時だ。"
 
 # 中期暴走ツリー
 MYS_mid_prep_1:0 "軍事力の強化"
 MYS_mid_prep_1_desc:0 "バランスの取れた軍事力を構築する。"
 MYS_mid_prep_2:0 "産業の拡充"
 MYS_mid_prep_2_desc:0 "軍需・民需の両工場を建設する。"
 MYS_mid_rampage_execute:0 "中期暴走の実行"
 MYS_mid_rampage_execute_desc:0 "十分な準備が整った。暴走を開始する。"
 
 # 後期災害ツリー
 MYS_late_prep_1:0 "産業基盤の確立"
 MYS_late_prep_1_desc:0 "大規模な産業基盤を構築する。"
 MYS_late_prep_2:0 "軍事ドクトリンの研究"
 MYS_late_prep_2_desc:0 "高度な軍事ドクトリンを習得する。"
 MYS_late_disaster_execute:0 "後期災害の実行"
 MYS_late_disaster_execute_desc:0 "完璧な準備が整った。災害を引き起こす。"
 
 # 末期危機ツリー
 MYS_end_prep_1:0 "最終産業基盤"
 MYS_end_prep_1_desc:0 "圧倒的な産業力を確立する。"
 MYS_end_prep_2:0 "総合軍事力の完成"
 MYS_end_prep_2_desc:0 "あらゆる軍事分野を極める。"
 MYS_end_crisis_execute:0 "末期危機の実行"
 MYS_end_crisis_execute_desc:0 "すべての準備が完了した。世界に終末をもたらす。"
 
 # アイデア
 MYS_early_outbreak_idea:0 "早期暴発の精神"
 MYS_early_outbreak_idea_desc:0 "迅速な行動で敵を圧倒する。"
 MYS_mid_rampage_idea:0 "中期暴走の精神"
 MYS_mid_rampage_idea_desc:0 "バランスの取れた力で敵を制圧する。"
 MYS_late_disaster_idea:0 "後期災害の精神"
 MYS_late_disaster_idea_desc:0 "圧倒的な産業力で敵を蹂躙する。"
 MYS_end_crisis_idea:0 "末期危機の精神"
 MYS_end_crisis_idea_desc:0 "究極の力で世界を支配する。"
 
 # イベント
 MYS_direction.1.t:0 "指向の選択"
 MYS_direction.1.d:0 "謎国家の未来を決める重要な選択の時が来た。我々はどの道を進むべきか？\n\n早期暴発：迅速な行動で世界を驚かせる\n中期暴走：バランスの取れた力で世界に挑む\n後期災害：十分な準備で世界を圧倒する\n末期危機：完璧な準備で世界に終末をもたらす"
 MYS_direction.1.a:0 "早期暴発指向を選択する"
 MYS_direction.1.b:0 "中期暴走指向を選択する"
 MYS_direction.1.c:0 "後期災害指向を選択する"
 MYS_direction.1.d:0 "末期危機指向を選択する"
 
 MYS_direction.11.t:0 "早期暴発の開始"
 MYS_direction.11.d:0 "準備が整った。今こそ世界に我々の存在を知らしめる時だ。小規模ながらも迅速な行動で、敵を驚かせよう。"
 MYS_direction.11.a:0 "行動開始！"
 
 MYS_direction.12.t:0 "中期暴走の開始"
 MYS_direction.12.d:0 "十分な準備期間を経て、我々は世界に挑戦する準備が整った。バランスの取れた力で敵を制圧しよう。"
 MYS_direction.12.a:0 "暴走開始！"
 
 MYS_direction.13.t:0 "後期災害の開始"
 MYS_direction.13.d:0 "長い準備期間を経て、我々は圧倒的な産業力を手に入れた。今こそ世界に災害級の衝撃を与える時だ。"
 MYS_direction.13.a:0 "災害を引き起こせ！"
 
 MYS_direction.14.t:0 "末期危機の開始"
 MYS_direction.14.d:0 "すべての準備が完了した。我々は究極の力を手に入れた。世界に終末をもたらそう。"
 MYS_direction.14.a:0 "終末を開始せよ！"
