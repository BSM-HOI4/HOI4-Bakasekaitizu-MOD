l_japanese:
 GBR_bsm_address:0 "帝国の現住所"
 GBR_bsm_address_desc:0 "二つのロンドンと、独自の歴史を持つ自治領。英国政府は現存する国々との関係を確認し、実在しない植民地の帳簿を閉じる。"
 GBR_bsm_westminster:0 "ウェストミンスターの権限"
 GBR_bsm_westminster_desc:0 "本土政府と王室の権限を整理する。ロンドン市や自治領の政治体制を一方的に変えることはしない。"
 GBR_bsm_accounts:0 "海図と国庫の照合"
 GBR_bsm_accounts_desc:0 "地図上の泊地と国庫の支出を照合し、実際に所有・支配する州だけを国内建設の対象とする。"
 GBR_bsm_circular:0 "自治領への回状"
 GBR_bsm_circular_desc:0 "カナダ、南アフリカ、インドへ通商・研究協力を提案する。各政府は参加を拒否できる。"
 GBR_bsm_two_londons:0 "二つのロンドン問題"
 GBR_bsm_two_londons_desc:0 "海の向こうのロンドン市に予備会談を提案する。市が承認すれば既存の国勢調査へ接続し、既に始まった交渉は巻き戻さない。"
 GBR_bsm_charter:0 "自治領憲章"
 GBR_bsm_charter_desc:0 "自発的な協力を統治の原則に据える。"
 GBR_bsm_federal:0 "帝国会議の再招集"
 GBR_bsm_federal_desc:0 "同じ王冠をいただく政府にも、参加と拒否の権利がある。"
 GBR_bsm_crown:0 "特権を再点検する"
 GBR_bsm_crown_desc:0 "中央政府の責任を明確にする。既存の自治や国境は交渉なしに変更しない。"
 GBR_bsm_home:0 "本土優先予算"
 GBR_bsm_home_desc:0 "海外統治の負担を減らし、本土の建設へ予算を振り向ける。"
 GBR_bsm_bridge:0 "橋に予算を、議会に席を"
 GBR_bsm_bridge_desc:0 "ロンドン市に代表参加と共同修繕を提案する。市の承認と既存の修繕手続きが必要になる。"
 GBR_bsm_dublin:0 "ダブリン三者会談"
 GBR_bsm_dublin_desc:0 "三者の代表会議と修繕が済んでいれば憲法会議を提案する。アイルランドの成立や国境の変更は既存会議で双方が判断する。"
 GBR_bsm_commonwealth:0 "自由な英連邦"
 GBR_bsm_commonwealth_desc:0 "互いの主権を保ち、合意した通商・研究協力を進める。"
 GBR_bsm_seats:0 "人口と負担に応じた議席"
 GBR_bsm_seats_desc:0 "自治領の代表権を保障する。英国側も政治力を負担し、各政府に参加を改めて求める。"
 GBR_bsm_budget:0 "共通予算と共同参謀本部"
 GBR_bsm_budget_desc:0 "会議に同意した参加国との共同制度を整える。独立や国境を維持したまま協力の実利を得る。"
 GBR_bsm_voluntary_federation:0 "自発的な帝国連邦"
 GBR_bsm_voluntary_federation_desc:0 "協約への署名を各政府に求める。単一国家への併合は行わず、拒否国は協約の外に残る。"
 GBR_bsm_oversight:0 "自治領監督委員会"
 GBR_bsm_oversight_desc:0 "監督条件を明示した修繕援助を市へ提案する。承認がなければ援助・監督は成立しない。"
 GBR_bsm_north:0 "北部の安全保障線"
 GBR_bsm_north_desc:0 "北部州の地位について三者協議を提案する。領有国の承認とアイルランドの署名が必要で、英国が市の州を接収することはない。"
 GBR_bsm_reintegration:0 "王冠の下の再交渉"
 GBR_bsm_reintegration_desc:0 "中央政府の交渉窓口を強める。協力協定を提案するが、拒否を自動的な戦争や併合へ結び付けない。"
 GBR_bsm_island_government:0 "島の行政を島の住民へ"
 GBR_bsm_island_government_desc:0 "ロンドン市に憲法会議を提案する。市の同意なくアイルランドを解放しない。"
 GBR_bsm_capital:0 "首都機能の分散"
 GBR_bsm_capital_desc:0 "北西イングランドに英国の行政機能を準備する。州を失っていれば別の支配中の中核州を用い、他国領へ首都を移さない。"
 GBR_bsm_return_london:0 "ロンドンをロンドンへ返す"
 GBR_bsm_return_london_desc:0 "首都分散後、既存の共和国の結末を選んだロンドン市へ帰還案を提示する。市の承認後も英国が既存イベントで最終判断する。"
 GBR_bsm_city_credit:0 "大蔵省とシティの協定"
 GBR_bsm_city_credit_desc:0 "ロンドン市へ金融協定を提案する。拒否時にもミッドランズへの国内投資は継続できる。"
 GBR_bsm_midlands:0 "ミッドランズ再投資"
 GBR_bsm_midlands_desc:0 "英国が所有・支配する西ミッドランズへ民需工場を一つ建設する。州を失っていれば国内公債の整理へ切り替える。"
 GBR_bsm_northern_industry:0 "北部工業の更新"
 GBR_bsm_northern_industry_desc:0 "英国のヨークシャーで物流整備を進める。占領地や他国領には建設しない。"
 GBR_bsm_port_rail:0 "港湾鉄道の接続"
 GBR_bsm_port_rail_desc:0 "北西イングランドの供給計画と港湾産業に投資する。州の所有・支配を確認してから着工する。"
 GBR_bsm_shipbuilding:0 "船を売り、航路を守る"
 GBR_bsm_shipbuilding_desc:0 "輸送船の修繕と建造を支援する。既存艦隊に即した整備を優先し、艦船を無制限に生成しない。"
 GBR_bsm_trade:0 "帝国通商の再契約"
 GBR_bsm_trade_desc:0 "現存する自治領と通商協力を再交渉する。参加するかは各政府が決める。"
 GBR_bsm_admiralty:0 "海軍本部の再査定"
 GBR_bsm_admiralty_desc:0 "英国海軍の既存艦隊と泊地を調べ、護衛・整備を中心とする計画をまとめる。"
 GBR_bsm_escort:0 "大西洋護衛司令部"
 GBR_bsm_escort_desc:0 "輸送船団の護衛と修繕を改善する。"
 GBR_bsm_irish_patrol:0 "アイリッシュ海の共同警備"
 GBR_bsm_irish_patrol_desc:0 "ロンドン市・アイルランドへ協力を提案する。相手の軍を自動で指揮することはない。"
 GBR_bsm_anchorages:0 "世界の泊地をつなぐ"
 GBR_bsm_anchorages_desc:0 "既存の島嶼政府へ協定を提案する。独立した島を英国の直接領土として扱わない。"
 GBR_bsm_air_defence:0 "本土防空網"
 GBR_bsm_air_defence_desc:0 "南東イングランドの対空網を整備する。所有・支配が失われた場合は航空教育を優先する。"
 GBR_bsm_expedition:0 "遠征軍の標準化"
 GBR_bsm_expedition_desc:0 "地域の異なる守備隊にも通用する訓練を整える。"
 GBR_bsm_joint_exercise:0 "陸海空合同上陸演習"
 GBR_bsm_joint_exercise_desc:0 "護衛、航空支援、補給を合わせて訓練する。"
 GBR_bsm_defence:0 "二つの島の防衛協定"
 GBR_bsm_defence_desc:0 "同意した政府と防衛協力を提案する。外交交渉が成立しなくても本土の参謀制度を整える。"
 GBR_bsm_dover:0 "対岸のドーバー"
 GBR_bsm_dover_desc:0 "ドーバーの対岸はフランス領である。地位の協議を始めるが、既存の国境を一方的に変えない。"
 GBR_bsm_channel:0 "海峡航行協定"
 GBR_bsm_channel_desc:0 "フランスに航行・通商の協定を提案する。承認は領土移譲とは別の契約とする。"
 GBR_bsm_dover_demand:0 "ドーバー返還要求"
 GBR_bsm_dover_demand_desc:0 "フランスへ州835の移譲を要求する。フランスは拒否でき、第三国の州や占領地を取引しない。"
 GBR_bsm_channel_islands:0 "海峡諸島の個別憲章"
 GBR_bsm_channel_islands_desc:0 "ジャージーとガーンジーの各政府に協定を提案する。ロンドンの取り決めを一括適用しない。"
 GBR_bsm_gibraltar:0 "ジブラルタルの門番"
 GBR_bsm_gibraltar_desc:0 "ジブラルタル政府と基地・通商協力を交渉する。"
 GBR_bsm_ocean:0 "大洋の中継点"
 GBR_bsm_ocean_desc:0 "モルディブとエロマンガ島の政府に参加を求める。現地の国家や領土は維持する。"
 GBR_bsm_joint_staff:0 "共同参謀制度"
 GBR_bsm_joint_staff_desc:0 "各国軍の指揮権を保ちながら、補給と訓練計画を合わせる。"
 GBR_bsm_home_reconstruction:0 "本土再建計画"
 GBR_bsm_home_reconstruction_desc:0 "海外交渉の成否にかかわらず、国内の工業と行政を整える。"
 GBR_bsm_shipyards:0 "航路と修繕所"
 GBR_bsm_shipyards_desc:0 "船舶産業への時限支援。"
 GBR_bsm_escort_command:0 "大西洋護衛司令部"
 GBR_bsm_escort_command_desc:0 "輸送船団を支える整備と護衛指揮。"
 GBR_bsm_cooperation:0 "英連邦協力協約"
 GBR_bsm_cooperation_desc:0 "各政府の承認による研究と通商の協約。領土、独立、軍の指揮権は維持する。"
 GBR_bsm.1.t:0 "二つのロンドンの予備会談"
 GBR_bsm.1.d:0 "英国政府が対話を提案した。市が受け入れれば既存の国勢調査から代表会議を始める。既存の交渉結果は変えない。"
 GBR_bsm.1.a:0 "提案を受け入れる"
 GBR_bsm.1.b:0 "今回は見送る"
 GBR_bsm.2.t:0 "英国からの憲法会議提案"
 GBR_bsm.2.d:0 "代表会議と橋の修繕を経た今、英国が三者の憲法会議を提案している。市が承認すれば既存の会議へ進む。"
 GBR_bsm.2.a:0 "提案を受け入れる"
 GBR_bsm.2.b:0 "今回は見送る"
 GBR_bsm.3.t:0 "橋と代表権の共同予算"
 GBR_bsm.3.d:0 "英国が代表の参加を伴う橋の修繕支援を提案した。市は共同予算を受け入れるか判断する。"
 GBR_bsm.3.a:0 "提案を受け入れる"
 GBR_bsm.3.b:0 "今回は見送る"
 GBR_bsm.4.t:0 "監督付き修繕援助"
 GBR_bsm.4.d:0 "英国政府は監督を伴う修繕費を提案している。市は条件を拒否できる。"
 GBR_bsm.4.a:0 "提案を受け入れる"
 GBR_bsm.4.b:0 "今回は見送る"
 GBR_bsm.5.t:0 "英国からのロンドン帰還提案"
 GBR_bsm.5.d:0 "英国は首都機能を分散した上で、州126と113の交換移譲を改めて提案した。市が承認すると英国側の既存の帰還判断へ進む。"
 GBR_bsm.5.a:0 "提案を受け入れる"
 GBR_bsm.5.b:0 "今回は見送る"
 GBR_bsm.6.t:0 "大蔵省とシティの協定案"
 GBR_bsm.6.d:0 "英国は金融協力を提案している。受諾すれば両政府に研究・通商協力が成立し、拒否しても国境や政治体制は変わらない。"
 GBR_bsm.6.a:0 "提案を受け入れる"
 GBR_bsm.6.b:0 "今回は見送る"
 GBR_bsm.7.t:0 "英国からの協力協約"
 GBR_bsm.7.d:0 "英国が対等な通商・研究協力を提案した。参加しても独立や領土、軍の指揮権は変わらない。"
 GBR_bsm.7.a:0 "提案を受け入れる"
 GBR_bsm.7.b:0 "今回は見送る"
 GBR_bsm.8.t:0 "北部の地位を協議する"
 GBR_bsm.8.d:0 "英国は北部について既存の三者協議を提案している。市が承認しても、領有国とアイルランドの署名なしに州は移譲されない。"
 GBR_bsm.8.a:0 "提案を受け入れる"
 GBR_bsm.8.b:0 "今回は見送る"
 GBR_bsm.9.t:0 "海峡航行の協定案"
 GBR_bsm.9.d:0 "英国から通商・航行協力の申し出が届いた。ドーバーの領有権はこの協定では変更しない。"
 GBR_bsm.9.a:0 "提案を受け入れる"
 GBR_bsm.9.b:0 "今回は見送る"
 GBR_bsm.10.t:0 "対岸のドーバー返還要求"
 GBR_bsm.10.d:0 "英国は州835の返還を要求している。受諾する場合は英国が補償として政治的な負担を引き受ける。拒否による自動開戦はない。"
 GBR_bsm.10.a:0 "提案を受け入れる"
 GBR_bsm.10.b:0 "今回は見送る"
 GBR_bsm_retry_talks:0 "ロンドン市へ予備会談を再提案"
 GBR_bsm_retry_talks_desc:0 "情勢と相手国の承認を確認して交渉を再提案する。既存の会議結果や領土を一方的に変更しない。"
 GBR_bsm_retry_conference:0 "三者の憲法会議を再提案"
 GBR_bsm_retry_conference_desc:0 "情勢と相手国の承認を確認して交渉を再提案する。既存の会議結果や領土を一方的に変更しない。"
 GBR_bsm_retry_finance:0 "シティとの金融協議を再開"
 GBR_bsm_retry_finance_desc:0 "情勢と相手国の承認を確認して交渉を再提案する。既存の会議結果や領土を一方的に変更しない。"
 GBR_bsm_retry_north:0 "北部の地位について協議を再開"
 GBR_bsm_retry_north_desc:0 "情勢と相手国の承認を確認して交渉を再提案する。既存の会議結果や領土を一方的に変更しない。"
 GBR_bsm_retry_return:0 "ロンドン帰還の再提案"
 GBR_bsm_retry_return_desc:0 "情勢と相手国の承認を確認して交渉を再提案する。既存の会議結果や領土を一方的に変更しない。"
 GBR_bsm_diplomacy:0 "帝国の住所録"
 GBR_bsm_diplomacy_desc:0 "現存する政府との協議窓口。拒否や時機の不一致でも、国内の国家方針は継続できる。"
