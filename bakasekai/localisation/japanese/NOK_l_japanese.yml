l_japanese:
  nokia.1.t:0 "ノキアの市場支配"
  nokia.1.d:0 "我々の通信機器帝国がついに頂点に立った。ノキア製の端末が世界中のあらゆる市場を席巻し、競合他社は遠く後方に取り残されている。だが、技術革新の波は留まることを知らない。新たな脅威が地平線の向こうから迫りつつある——タッチスクリーンを備えた革新的な端末たちが、我々の支配的地位を揺るがそうとしているのだ。"
  nokia.1.a:0 "事態の推移を見守る"

  nokia.2.t:0 "革命的な新製品"
  nokia.2.d:0 "競合企業が全く新しいタイプの携帯端末を発表した。タッチスクリーン、アプリケーションストア、そして洗練されたユーザーインターフェース——これは単なる携帯電話ではなく、スマートフォンと呼ばれる新世代の端末である。ノキアのエンジニアたちが分析を急いでいるが、経営陣の対応が試されている。"
  nokia.2.a:0 "一時的な流行に過ぎない"
  nokia.2.b:0 "この脅威を直ちに分析せよ"

  nokia.3.t:0 "市場シェア崩壊"
  nokia.3.d:0 "最悪の事態が現実となった。ノキアの市場シェアが急速に低下している。スマートフォンの台頭に対する我々の遅れた対応が、取り返しのつかない結果をもたらしつつある。株主たちが恐慌に陥り、従業員たちの士気も低下している。危機管理体制を直ちに構築しなければならない。"
  nokia.3.a:0 "危機管理委員会を設立せよ"

  nokia.4.t:0 "危機管理——早期対応"
  nokia.4.d:0 "スマートフォンの脅威を早期に察知したおかげで、我々はまだ対応の余地を持っている。経営陣は速やかに危機管理チームを編成し、戦略の抜本的見直しに着手した。被害は最小限に抑えられるはずだ——だが、前途は依然として困難に満ちている。"
  nokia.4.a:0 "戦略的見直しを開始せよ"

  nokia.5.t:0 "株主の動揺"
  nokia.5.d:0 "ノキアの株価が急落し、世界中の投資家たちがパニックに陥っている。「ノキアの時代は終わったのか？」——金融市場の至る所でこの問いが囁かれている。経営陣には重大な決断が求められている。現状維持で信頼を回復できるか、それとも大胆な転換が必要なのか。"
  nokia.5.a:0 "現在の方針を堅持せよ！"
  nokia.5.b:0 "新たな戦略を検討せよ"

  nokia.10.t:0 "破壊不能王国の黎明"
  nokia.10.d:0 "ノキア3310——伝説にして不滅。この端末は落下しても砕けず、衝撃を受けても壊れず、あらゆる試練に耐え抜く。その精神が今、国家の理念となった。我々の国民もまた、3310のように屈せず、壊れず、永遠に立ち続けるだろう。「破壊不能王国」の旗の下、国民は不撓不屈の決意で団結している。"
  nokia.10.a:0 "不撓不屈の精神で前進せよ！"

  nokia.20.t:0 "ネットワーク接続の成功"
  nokia.20.d:0 "グローバルネットワーク構想が実を結び始めている。我々の通信インフラが世界中の同盟国を結びつけ、情報と資源の流れがかつてないほどスムーズになっている。同盟の絆が強固になるにつれ、我々の影響力も着実に拡大している。"
  nokia.20.a:0 "ネットワークを拡張せよ"

  nokia.30.t:0 "特許戦争の勝利"
  nokia.30.d:0 "法廷戦線で決定的な勝利を収めた！競合企業の特許侵害が証明され、莫大な賠償金と技術使用料が我々のものとなった。この勝利は単なる金銭的成果にとどまらず、ノキアの技術的優位性を世界に宣告するものとなった。"
  nokia.30.a:0 "賠償金を研究開発に投資せよ"

  nokia.31.t:0 "特許盗用の失敗"
  nokia.31.d:0 "競合企業の技術設計図を入手する作戦が失敗に終わった。我々の工作員が対象国の治安機関に察知され、外交関係に深刻な亀裂が生じた。この失敗は国際社会におけるノキアの評判にも影響を及ぼすだろう。"
  nokia.31.a:0 "事態の收拾を図れ"

  nokia.40.t:0 "オープンソースの解放"
  nokia.40.d:0 "技術を人民の手に！オープンソース革命の理念が世界中に広がりつつある。ノキアの解放された技術プラットフォームが、各国の労働者と開発者たちに力を与えている。知識は共有されるべきであり、特許の壁は打破されるべきだ——この信念が、新たな技術的ルネサンスを引き起こしている。"
  nokia.40.a:0 "技術の力を人民に還元せよ"

  nokia.100.t:0 "スネーク選手権"
  nokia.100.d:0 "国民的イベントの季節がやってきた——ノキア・スネーク選手権である！全国から集まったトッププレイヤーたちが、あの伝説的なゲームの最高得点を競い合う。大会の規模を拡大し、国家的な祭典として後援すれば、国民の士気向上につながるだろう。"
  nokia.100.a:0 "大会を後援せよ！"
  nokia.100.b:0 "もっと重要な優先事項がある"

  NKA_shouki_toushi:0 "初期投資"
  NKA_shouki_toushi_desc:0 "ノキアの基盤を固めるため、産業への初期投資を行う。未来への第一歩は、確固たる基盤の構築から始まる。"

  NKA_gomu_boots:0 "ゴム長靴"
  NKA_gomu_boots_desc:0 "ノキアの起源はゴム長靴製造にある。この伝統的な事業を拡大し、国内のインフラ整備を推進する。"

  NKA_seishi_jigyo:0 "製紙事業"
  NKA_seishi_jigyo_desc:0 "製紙部門を拡充し、産業基盤を構築する。ノキアの複合企業としての基礎を築く。"

  NKA_cable_seizo:0 "ケーブル製造"
  NKA_cable_seizo_desc:0 "通信ケーブルの製造技術を磨き、電子工学と産業技術への足がかりとする。"

  NKA_tsushin_gijutsu_no_yoake:0 "通信技術の夜明け"
  NKA_tsushin_gijutsu_no_yoake_desc:0 "長年の蓄積がついに結実する。通信技術の研究に新たな拠点を開設し、研究体制を拡充する。"

  NKA_mobira_no_ooja:0 "モビーラの王者"
  NKA_mobira_no_ooja_desc:0 "モビラ・サロラ＝ノキアの合併が生んだ移動体通信の王者。その遺産を継承し、移動通信分野での圧倒的優位を確立する。"

  NKA_golden_age:0 "黄金時代"
  NKA_golden_age_desc:0 "ノキアの最盛期を再現する。革新と成長の黄金時代を宣言し、国家の結束を固める。"

  NKA_connecting_people:0 "Connecting People"
  NKA_connecting_people_desc:0 "「人々をつなぐ」——ノキアの魂のスローガンを掲げ、国民と世界を結ぶ絆を強化する。"

  NKA_mass_market_appeal:0 "大衆市場への訴求"
  NKA_mass_market_appeal_desc:0 "誰もが手に取れる製品で市場を席巻する。大衆の心をつかむ製品戦略を推進する。"

  NKA_intuitive_UI:0 "直感的ユーザーインターフェース"
  NKA_intuitive_UI_desc:0 "ユーザーフレンドリーな設計思想で市場をリードする。計算機技術の研究を加速する。"

  NKA_market_dominance:0 "市場支配"
  NKA_market_dominance_desc:0 "ノキアの市場支配が完成に近づいている。全世界の通信市場を掌握する最終段階に入る。"

  NKA_paradigm_shift:0 "パラダイムシフト"
  NKA_paradigm_shift_desc:0 "スマートフォンの脅威が既存のビジネスモデルを根底から覆した。危機を新たな成長の契機に変えるため、大胆な転換を断行する。"

  NKA_unbreakable_kingdom:0 "破壊不能王国"
  NKA_unbreakable_kingdom_desc:0 "ノキア3310の不滅の精神に倣い、国家を絶対に砕けない要塞とする。非同盟路線の下、国家の独立と強靭さを追求する。"

  NKA_3310_seishin:0 "3310の精神"
  NKA_3310_seishin_desc:0 "落下しても砕けず、衝撃を受けても壊れない——ノキア3310は単なる携帯電話ではない。それは不撓不屈の象徴である。この精神を国家の軍事ドクトリンに組み込む。"

  NKA_kyojin_na_kokudo:0 "強靭な国土"
  NKA_kyojin_na_kokudo_desc:0 "3310の頑丈さを国土防衛に応用する。国境沿いに堅固な防衛線を構築し、いかなる攻撃にも耐えうる要塞国家を築く。"

  NKA_snake_doctrine:0 "スネーク教義"
  NKA_snake_doctrine_desc:0 "画面上の蛇が果物を求めて成長していくように、我が軍も縦横無尽に機動する。スネークゲームから着想を得た機動戦ドクトリンを採用する。"

  NKA_global_network:0 "グローバルネットワーク"
  NKA_global_network_desc:0 "民主主義の理念の下、世界中の国家と通信ネットワークで結ばれる。自由な情報の流通が平和と繁栄をもたらす。"

  NKA_sekai_wo_tsunagu:0 "世界をつなぐ"
  NKA_sekai_wo_tsunagu_desc:0 "ノキアのネットワーク技術を外交の武器とする。世界中の主要国との通信インフラ協力を推進し、国際的な結びつきを強化する。"

  NKA_5G_hegemony:0 "5G覇権"
  NKA_5G_hegemony_desc:0 "次世代通信規格の覇権を握る。5G技術の研究開発を加速し、研究拠点を拡充する。"

  NKA_kyoudou_kaihatsu:0 "共同開発"
  NKA_kyoudou_kaihatsu_desc:0 "同盟国との技術協力体制を構築する。共有された研究開発プラットフォームが、双方に利益をもたらす。"

  NKA_aggressive_monopoly:0 "攻撃的独占"
  NKA_aggressive_monopoly_desc:0 "市場は力によって支配される。競合を排除し、ノキアの技術的覇権をあらゆる手段で守り抜く。全体主義的体制の下、企業と国家が一体化する。"

  NKA_shijo_dokusen:0 "市場独占"
  NKA_shijo_dokusen_desc:0 "あらゆる手段を用いて市場を独占する。競合企業を買収し、サプライチェーンを支配し、代替品を排除する。"

  NKA_tokkyo_sensou:0 "特許戦争"
  NKA_tokkyo_sensou_desc:0 "特許を武器とする。競合企業の技術を法廷と工作活動によって奪取し、ノキアの技術的優位を盤石なものにする。"

  NKA_N_Gage_gun:0 "N-Gage軍"
  NKA_N_Gage_gun_desc:0 "かつてのゲーム端末N-Gageの精神を軍事応用に転用する。特殊部隊と海兵隊の戦術をゲーム設計思想から再構築する。"

  NKA_open_source_revolution:0 "オープンソース革命"
  NKA_open_source_revolution_desc:0 "技術は人民のものだ！特許と知的財産の壁を打ち破り、すべての技術を共有財産とする革命を宣言する。共産主義の理念の下、技術の平等な分配を実現する。"

  NKA_kaihou_sareta_gijutsu:0 "解放された技術"
  NKA_kaihou_sareta_gijutsu_desc:0 "ノキアの技術プラットフォームを解放する。オープンソース化された技術が、世界中の労働者と開発者に力を与える。"

  NKA_symbian_doumei:0 "シンビアン同盟"
  NKA_symbian_doumei_desc:0 "シンビアンOSの理念に基づく国際同盟を結成する。開かれたプラットフォームの旗の下、同志国を結集させる。"

  NKA_minshuu_no_tame_no_gijutsu:0 "民衆のための技術"
  NKA_minshuu_no_tame_no_gijutsu_desc:0 "技術を民衆に還元する。効率化された産業プロセスが、労働者の生活を向上させる。"

  NKA_gunji_gijutsu:0 "軍事技術"
  NKA_gunji_gijutsu_desc:0 "ノキアの技術力を軍事分野に応用する。陸海空すべての分野で実戦経験を蓄積する。"

  NKA_digital_signals:0 "デジタル信号"
  NKA_digital_signals_desc:0 "ノキアの通信技術をレーダーと電子戦に応用する。デジタル信号処理の優位性が戦場を制する。"

  NKA_composite_materials:0 "複合材料"
  NKA_composite_materials_desc:0 "携帯端末の小型化技術を装甲材質に応用する。軽量かつ強靭な複合材料の研究を推進する。"

  NKA_camera_optics:0 "カメラ光学"
  NKA_camera_optics_desc:0 "ノキアのカメラ技術を航空光学機器に応用する。精密な光学照準システムが空の支配を支援する。"

  NKA_handset_development:0 "端末開発"
  NKA_network_expansion_decisions:0 "ネットワーク拡張"
  NKA_patent_war_decisions:0 "特許戦争"
  NKA_revolutionary_decisions:0 "革命活動"
