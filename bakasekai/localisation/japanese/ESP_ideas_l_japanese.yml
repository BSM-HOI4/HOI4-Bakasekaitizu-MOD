 ##############################################
 # ESP 亡命シナリオ ideas/designer localisation
 ##############################################

 # 国民精神
 ESP_government_in_exile:0 "亡命政権"
 ESP_government_in_exile_desc:0 "本土を追われた我々の政府は、大西洋を隔てたカリブの海と南米の沿岸に辛うじて逃れ、亡命政権としての命脈を保っている。首都マドリードを喪失した現実はあまりに重いが、正統なるスペインの灯火をここで絶やすわけにはいかない。異国の地で孤立を深めながらも、我々はいつの日か海を越えて故郷へ帰還することを固く誓っている。"
 ESP_two_homelands:0 "二つの祖国"
 ESP_two_homelands_desc:0 "亡命生活が長引くにつれ、我々を受け入れた新世界の豊かな土地に根を下ろす民が日増しに増えている。しかし、カリブの暮らしに安寧を見出すほど、海峡の彼方にあるイベリアの祖国への思いは徐々に薄れかけてしまう。新たな故郷への愛着と、奪われた祖国を取り戻すという誓いの狭間で、国民の心は激しく揺れ動いている。"
 ESP_krone_backing:0 "クローネの担保"
 ESP_krone_backing_desc:0 "本土という基盤を欠いた亡命政権が発行するスペイン・クローネは、常に信用の崩壊という危機に晒されている。この危うい通貨を支えているのは、新大陸のボリバルが産出する豊かな黄金と沿岸の石油資源にほかならない。大地から掘り出される確かな富を担保とすることで、我々はかろうじて軍備と国家財政の破綻を免れている。"
 ESP_proof_fleet_idea:0 "艦隊の証"
 ESP_proof_fleet_idea_desc:0 "本土脱出を成し遂げた残存艦艇は、カリブの工廠で徹底的な改修を受け、大西洋を横断し得る外洋艦隊へと生まれ変わった。過酷な航海に耐えうる燃料と整備体制が整い、将兵たちの士気も祖国の海へと向けて高まっている。この鍛え抜かれた鋼鉄の艦列こそが、我々に半島への帰還を果たす力があることの動かぬ証である。"
 ESP_mediterranean_claws:0 "地中海の爪"
 ESP_mediterranean_claws_desc:0 "ジブラルタル海峡南岸のセウタとメリリャは、アフリカ北岸に残された旧帝国の貴重な遺産である。我々はこの二つの飛び地を要塞化し、奪われた半島本土の喉元へ突き立てる強固な橋頭堡へと仕立て上げた。地中海への出口を睨むこの爪痕は、欧州帰還作戦において決定的な突破口となるだろう。"
 ESP_madrid_on_the_map:0 "マドリードは地図にある"
 ESP_madrid_on_the_map_desc:0 "たとえ異国の支配下に置かれようとも、人々の心と世界が認める地図の上からマドリードの名が消えることはない。カリブの海を渡る我々の訴えは本土の同胞にも届いており、同じ祖国の地図を見つめる彼らの結束は揺らいでいない。正統なる首都の記憶が共有されている限り、我々の主権と奪還の大義はいかなる脅威にも脅かされない。"
 ESP_map_spain:0 "地図上のスペイン"
 ESP_map_spain_desc:0 "もはや遠き欧州の半島へ帰還する夢は捨て去られ、旧来の帝国としてのスペインは歴史の幕を閉じた。我々はカリブの海と南米の大地に恒久的な根を下ろし、新世界の国家として新たな道を歩み始めている。かつての世界地図に描かれた領土ではなく、今ここに生きる人々の手によって新たなスペインの繁栄が築かれるのだ。"

 # ツールチップ
 ESP_rapport_tt:0 "§Y大西洋の温度§!: [?ROOT.ESP_FRA_rapport|0]（+60で友好確定、-60で敵対確定）"
 ESP_proofs_tt:0 "§Y帰還の四証§!: 艦隊 [?ROOT.ESP_proof_fleet|0]/3 / 橋頭堡 [?ROOT.ESP_proof_bridgehead|0]/3 / 正統 [?ROOT.ESP_proof_legitimacy|0]/3 / 承認 [?ROOT.ESP_proof_recognition|0]/3"

