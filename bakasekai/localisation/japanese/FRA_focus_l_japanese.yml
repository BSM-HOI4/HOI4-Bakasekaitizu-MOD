l_japanese:
 ##############################################
 # FRA イベリア併合シナリオ focus localisation
 ##############################################

 # 幹
 FRA_two_capitals:0 "二つの都"
 FRA_two_capitals_desc:0 "セーヌ河畔のパリとテージョ河畔のリスボンは、今や広大な帝国の二つの心臓として鼓動している。ピレネーを越えて結ばれた両都市の連絡を緊密にし、帝国の重心を再配置しなければならない。東西の都が協調してこそ、大陸の覇権は揺るぎないものとなる。"
 FRA_crown_parliament:0 "憲政議会"
 FRA_crown_parliament_desc:0 "皇帝の権威と国民の主権を調和させるため、帝政議会の役割を再定義する。かつての専制への回帰を退け、法の支配に基づく立憲の枠組みを固めねばならない。代議員たちとの対話を通じて、安定した統治基盤を築き上げる。"
 FRA_iberian_patrimony:0 "イベリアの世襲領"
 FRA_iberian_patrimony_desc:0 "ピレネーの南に広がる広大な土地は、もはや単なる占領地ではなく帝国の不可分な領土である。現地の慣習を尊重しつつも、フランス王冠の正統な継承地としての権威を確立する。この沃野と資源を帝国の永続的な繁栄のために役立てる時が来た。"
 FRA_imperial_review:0 "帝国観兵式"
 FRA_imperial_review_desc:0 "シャン・ド・マルスに集結した諸軍の威容を、皇帝と市民の前に誇示する。フランス本国兵とイベリアの部隊が同じ軍旗のもとで行進し、帝国の結束を示す。この荘厳な閲兵は、国内外へ帝政の復活を強く印象づけるだろう。"
 FRA_empire_question:0 "帝国の問い"
 FRA_empire_question_desc:0 "広大化し多民族を抱える国家となった今、われわれはいかなる政体を目指すべきか。ボナパルトの戴冠による帝政か、それとも共和の理念への回帰か。国民が下す決断こそが、これからのフランスの針路を決定づける。"
 FRA_crown_scales_focus:0 "王冠の配分"
 FRA_crown_scales_focus_desc:0 "パリの主権と各地の特権の調停は、繊細な天秤の針を合わせるような難事である。中央の専制を防ぎつつ、地方の不満を巧みに抑え込まねばならない。各勢力の権限を綿密に配分し、国家の亀裂を未然に防ぐ。"
 # 帝政継続
 FRA_bonaparte_charter:0 "ボナパルト憲章"
 FRA_bonaparte_charter_desc:0 "ナポレオン六世の理念を具現化する新たな基本憲章を発布する。立憲主義と個人の権利を保障しつつ、世襲皇帝に象徴的かつ実質的な最高権威を付与する。これによって、帝政の正統性は法的に確立される。"
 FRA_napoleon_court:0 "宮廷の整理"
 FRA_napoleon_court_desc:0 "旧来の貴族と新たな実力者が入り乱れる宮廷の序列を再編する。煩雑な礼式を簡素化し、能力ある実務家を皇帝の側近として登用する。宮廷の無用な浪費を抑え、近代的な帝政運営に即した体制を整える。"
 FRA_plebiscite_1937:0 "1937年国民投票"
 FRA_plebiscite_1937_desc:0 "帝政の是非と新秩序の正当性を国民自身の手によって信認させる。全国に投票所を設け、広範な民意をボナパルトの旗の下に結集する。圧倒的な信任を得ることで、国内外の反対派を沈黙させねばならない。"
 FRA_imperial_decrees:0 "勅令統治"
 FRA_imperial_decrees_desc:0 "議会の紛糾や非常事態に対処するため、皇帝に広範な大権を一時的に認める。迅速な意思決定によって、遅滞しがちな国政の諸問題を断固として解決する。危機を乗り切るための強力な指導力を行使する。"
 FRA_order_of_crown:0 "王冠勲章"
 FRA_order_of_crown_desc:0 "国家と皇室に多大な貢献をなした軍人や官僚を顕彰する新たな勲章を制定する。身分や出身地を問わず功績を称えることで、帝国全土のエリートの忠誠を繋ぎ止める。名誉は忠誠心を育む最良の絆である。"
 FRA_court_parties:0 "宮廷党派の調停"
 FRA_court_parties_desc:0 "宮中では伝統派、軍部、自由主義派が皇帝の寵愛を巡って暗闘を繰り広げている。皇帝自らが調停者となり、不毛な対立を抑え込まねばならない。互いの利害を調整し、国家指導部の結束を維持する。"
 FRA_second_empire_style:0 "第二帝政風"
 FRA_second_empire_style_desc:0 "かつての栄光ある第二帝政期の華やかな文化と建築様式を復興させる。都市の美観を整え、壮麗な公共事業を通じて市民に誇りと繁栄の実感を与える。帝国の黄金期を想起させることで、民衆の歓心を惹きつける。"
 FRA_emperor_two_seas:0 "二つの海の皇帝"
 FRA_emperor_two_seas_desc:0 "大西洋と地中海を抱く広大な領土の主として、皇帝の尊称を世に知らしめる。二つの海を結ぶ海洋国家としての自覚を深め、海軍と沿岸防備の拡充を急ぐ。東西の荒波を越え、帝国の栄光を世界に轟かせる。"
 FRA_bonapartist_supreme:0 "帝政の確定"
 FRA_bonapartist_supreme_desc:0 "幾多の政治的対立を乗り越え、ボナパルト朝による統治は確固たるものとなった。王政復古主義者や急進派の策動は退けられ、帝国の骨格は定まった。皇帝ナポレオンの指導の下、フランスは新たな黄金期へと歩み出す。"
 # 共和
 FRA_republican_opposition:0 "共和野党"
 FRA_republican_opposition_desc:0 "議会内には依然として共和制の維持を掲げる議員たちが根強く存在している。彼らは帝政への移行を専制への逆戻りと批判し、民主的な抵抗を試みている。共和派の勢力を無視して国家の安定を保つことはできない。"
 FRA_daladier_path:0 "ダラディエ政権"
 FRA_daladier_path_desc:0 "急進社会党のエドゥアール・ダラディエが政権を掌握し、現実的な中道政策を推進する。過度な急進論を退け、社会秩序と防衛体制の強化を最優先課題とする。国難を前に、堅実な議会政治の維持に全力を尽くす。"
 FRA_blum_coalition:0 "ブリュム連立"
 FRA_blum_coalition_desc:0 "レオン・ブリュム率いる社会主義勢力と連携し、広範な左派連立を形成する。労働者の権利拡大と社会福祉の向上を訴え、民衆の熱狂的な支持を集める。国内の社会的分断を癒やすための改革に乗り出す。"
 FRA_third_republic_return:0 "第三共和制の復帰"
 FRA_third_republic_return_desc:0 "帝政への動きを押し戻し、伝統的な議会制民主主義の旗印を再び掲げる。憲法を厳格に擁護し、自由と平等の精神を国家の基盤へと据え直す。幾多の試練を耐え抜いた共和国の誇りを取り戻す。"
 FRA_social_republic:0 "社会共和国"
 FRA_social_republic_desc:0 "労働者と農民の利益を第一とする社会共和制の樹立を目指す。資本の過度な集中を是正し、富の再分配を大胆に進める。民衆主権を徹底させることで、より公正な新秩序を築き上げる。"
 FRA_auriol_presidency:0 "オリオル大統領"
 FRA_auriol_presidency_desc:0 "ヴァンサン・オリオルを大統領に擁立し、政情の安定と各派の宥和を図る。豊かな政治経験と温厚な人柄を持つ彼の指導力は、議会の融和を促す。共和国の良心として、国家の団結を固めていく。"
 FRA_republic_confirmed:0 "共和の確定"
 FRA_republic_confirmed_desc:0 "王党派や軍部の干渉を完全に排し、共和国の永続性がここに宣言された。議会と市民が守り抜いた民主主義の基盤は、いかなる暴威にも揺らぐことはない。自由の祖国として、揺るぎない威信を保ち続ける。"
 # 王党・国家主義
 FRA_action_francaise:0 "アクション・フランセーズ"
 FRA_action_francaise_desc:0 "シャルル・モーラス率いる右翼運動が街頭で気勢を上げている。彼らは共和制の腐敗を徹底的に糾弾し、伝統的秩序と秩序あるカトリック的王権の回復を主張する。その先鋭的な扇動は政局を揺るがしつつある。"
 FRA_maurras_circle:0 "モーラスの系譜"
 FRA_maurras_circle_desc:0 "モーラスの統合ナショナリズム思想に共鳴する知識人や政治家が結集する。反個人主義と強権的な国家秩序を説く彼らの教義は、保守派エリートに浸透している。知的な理論武装を進め、政権掌握の好機をうかがう。"
 FRA_bucard_shirts:0 "ビュカールの民兵"
 FRA_bucard_shirts_desc:0 "マルセル・ビュカール率いる青シャツ隊の準軍事組織が街頭を闊歩する。鉄の規律とファシズム的な熱狂を武器に、反乱勢力や左派の集会を暴力で威圧する。秩序の維持を名目に、彼らの武力を体制の矛とする。"
 FRA_petain_regency:0 "ペタン摂政"
 FRA_petain_regency_desc:0 "ヴェルダンの英雄であるフィリップ・ペタン元帥を摂政に据え、国家の最高権力を委ねる。国民的英雄の揺るぎない名望は、混乱する国内をまとめ上げる唯一の楔となる。厳格な規律と伝統の復活を宣言する。"
 FRA_national_integral:0 "国民統合"
 FRA_national_integral_desc:0 "階級闘争や地方分権の弊害を排し、有機的な国民共同体を創出する。労働組合と産業界を国家の指導下に再編し、全体が一つの身体として機能する体制を整える。祖国への絶対的な献身こそが求められている。"
 FRA_coup_de_paris:0 "パリのクーデタ"
 FRA_coup_de_paris_desc:0 "優柔不断な議会を力で解散させ、首都の重要拠点を電撃的に制圧する。右派諸勢力と軍の一部が合流し、旧体制の息根を止める。パリの街頭に革命的な緊迫感が満ち、新たな権力が誕生する。"
 FRA_french_state_new:0 "新フランス国家"
 FRA_french_state_new_desc:0 "共和制の幕を引き、強力な指導原理に基づく新国家の成立を宣言する。『労働、家族、祖国』の理念を掲げ、社会の道徳的再生を断行する。強権的な秩序のもと、国家の立て直しが始まる。"
 # 共産
 FRA_cgt_underground:0 "CGT地下組織"
 FRA_cgt_underground_desc:0 "弾圧を逃れた労働総同盟の闘士たちが、工場の地下や路地裏で秘密細胞を組織している。非合法活動を通じてストライキの火種を絶やさず、体制への抵抗を続ける。労働者階級の団結を再び呼び覚ます。"
 FRA_thorez_party:0 "トレーズ系"
 FRA_thorez_party_desc:0 "モーリス・トレーズ率いる共産党主流派が、規律ある組織力を武器に党勢を拡大する。モスクワの指導線を忠実に守りつつ、大衆への浸透を図る。前衛党としての統制を強め、来たるべき蜂起に備える。"
 FRA_nicod_marxists:0 "ニコ系"
 FRA_nicod_marxists_desc:0 "独自のマルクス主義解釈を掲げる分派が、理論と実践の両面で独自の路線を模索する。教条主義を批判し、現地の情勢に即した柔軟な闘争方針を打ち出す。急進的な青年層を取り込み、独自の影響力を築く。"
 FRA_popular_front:0 "人民戦線"
 FRA_popular_front_desc:0 "ファシズムの脅威に対抗するため、共産党、社会党、急進党が広範な反ファシズム連合を結成する。民衆の圧倒的な支持を背景に、街頭と議会の双方で主導権を握る。民主主義と労働者の権利を守るための一大結集である。"
 FRA_peoples_commissariats:0 "人民委員会"
 FRA_peoples_commissariats_desc:0 "旧態依然とした官僚機構を解体し、労働者と革命兵士からなる人民委員会を組織する。各省庁の実権を大衆の代表へと移管し、徹底した革命的統制を実施する。国家機構の抜本的な刷新を進める。"
 FRA_red_iberia_link:0 "イベリア地下組織との連携"
 FRA_red_iberia_link_desc:0 "ピレネーの向こうで潜伏するイベリアの革命分子や無政府主義者たちと連絡路を開く。武器や資金を密かに送り込み、国境を越えた統一戦線を構築する。イベリア全土を巻き込む革命の連鎖を引き起こす。"
 FRA_paris_commune_new:0 "新パリ・コミューン"
 FRA_paris_commune_new_desc:0 "かつてのコミューンの記憶を呼び覚まし、首都を赤旗で覆い尽くす。革命政府はプロレタリア独裁の成立を宣言し、旧支配層の特権を完全に剥奪する。労働者が自らの運命を決定する新時代が到来した。"
 # 中道技術官僚
 FRA_guillaumat_technocrats:0 "ギョーマの技術官僚"
 FRA_guillaumat_technocrats_desc:0 "政治的党派争いに嫌気が差したギョーマ将軍と技術者たちが、実利的な統治を唱える。イデオロギーを排し、綿密な計算と科学的管理法によって国政を運営すべきだと主張する。実務の専門家集団が表舞台に立つ。"
 FRA_merit_council:0 "能力評議会"
 FRA_merit_council_desc:0 "出身や家柄ではなく、真の能力と実績に基づきエリートを選抜する評議会を創設する。各分野の最優秀な人材を国家の指導的役職に抜擢し、行政の能率を極限まで高める。実力主義による国家運営を推進する。"
 FRA_planification:0 "計画局"
 FRA_planification_desc:0 "国家全体の経済資源と生産目標を一元管理する計画局を設置する。長期的な統計データに基づき、工業生産や物資の配分を科学的に指導する。無秩序な市場競争を排し、合理的で無駄のない産業体制を構築する。"
 FRA_apolitical_state:0 "非政治国家"
 FRA_apolitical_state_desc:0 "不毛な議会闘争や政党対立を完全に停止させ、純粋な実務執行国家へと転換する。すべての意思決定は客観的なデータと国益の観点からのみ下される。感情的な煽動を排し、冷徹な統治機構を確立する。"
 FRA_experts_charter:0 "専門家憲章"
 FRA_experts_charter_desc:0 "技師、学者、実業家など各界の専門家に対し、政策立案における公的な権限を付与する憲章を制定する。科学と技術の進歩を国家指導の最高基準と位置づける。合理主義に基づく近代国家の青写真を描き出す。"
 # イベリア統治
 FRA_iberian_administration:0 "イベリア行政庁"
 FRA_iberian_administration_desc:0 "広大なイベリア半島を効率的に治めるため、専用の統治機関を整備する。旧来の地方行政を整理し、本国の訓令を遅滞なく伝達・執行する仕組みを構築する。半島全体の治安維持と法秩序の確立を急ぐ。"
 FRA_madrid_palace:0 "マドリード行宮"
 FRA_madrid_palace_desc:0 "マドリードの歴史ある宮殿を行宮として改修し、国家元首の現地滞在拠点とする。中央高原に帝国の威光を示す象徴的な建築として整備し、現地の有力者を引見する。ピレネーの彼方にも確固たる統治の座を示す。"
 FRA_direct_departements:0 "直轄県化"
 FRA_direct_departements_desc:0 "イベリアの旧行政区分を解体し、フランス本土と同様の直轄県制度を導入する。パリから派遣された知事が直接統治にあたり、法の平等を押し広げる。中央集権体制を徹底し、分離主義の芽を根底から摘み取る。"
 FRA_autonomy_charter:0 "自治憲章"
 FRA_autonomy_charter_desc:0 "現地の強い反発を和らげるため、一定の地域的自治を認める憲章を公布する。固有の言語や慣習法の使用を許容し、中央への過度な敵意を緩和する。妥協を通じた融和策によって、長期的な安定を図る。"
 FRA_iberian_governate:0 "イベリア総督府"
 FRA_iberian_governate_desc:0 "強力な権限を持つ総督を現地に派遣し、軍政と民政を一手に掌握させる。非常時における迅速な決断を可能にし、広域の不穏な動きに即応できる体制を整える。半島の秩序を力強く維持する。"
 FRA_catalan_autonomy:0 "カタルーニャ自治"
 FRA_catalan_autonomy_desc:0 "独自の文化と強烈な自立心を持つカタルーニャに対し、広範な自治権を認める。バルセロナの自治機関を承認し、経済的活力を帝国の発展へと結びつける。宥和政策によって不毛な反乱を未然に防ぐ。"
 FRA_basque_statute:0 "バスク自治条例"
 FRA_basque_statute_desc:0 "バスク地方の伝統的な特権と自治制度を法的に保障する特別条例を制定する。ピレネーを跨ぐ同胞たちの結束を尊重し、反発を抑え込んで強固な協力関係を築く。地域の安寧を保ち、重要な工業地帯を保護する。"
 FRA_galician_cortes:0 "ガリシア議会"
 FRA_galician_cortes_desc:0 "ガリシアの地方議会を再編し、現地の名望家たちに意見具申の場を与える。大西洋に面するこの地域との対話を重ね、民心の離反を防ぐ。地方の声を吸い上げることで、帝国の忠実な一翼へと育てる。"
 FRA_andalusian_question:0 "アンダルシア問題"
 FRA_andalusian_question_desc:0 "広大な農業地帯であるアンダルシアでは、貧富の格差と社会不安が根深い問題となっている。大土地所有制の弊害に対処し、現地の不満分子を鎮圧または懐柔せねばならない。治安の回復と社会秩序の再建を急ぐ。"
 FRA_iberia_integrated:0 "イベリア統合"
 FRA_iberia_integrated_desc:0 "数々の施策を経て、イベリア半島は名実ともに帝国の不可分な構成要素となった。制度と経済の同化は進み、かつての国境線は過去のものとなりつつある。大西洋からアルプスに至る大帝国がここに完成する。"
 # PAL連携
 FRA_paris_two_crowns:0 "パリの二冠"
 FRA_paris_two_crowns_desc:0 "フランスの王冠に加え、イベリアの主権を象徴するもう一つの王冠をパリの玉座に頂く。二つの大国の運命は、同一の君主の頭上に永遠に結びつけられた。壮大なる二重体制の出発点となる。"
 FRA_lisbon_cortes:0 "リスボン議会との会議"
 FRA_lisbon_cortes_desc:0 "リスボンの伝統ある議会に代表団を派遣し、二重体制下の権限分担を協議する。現地の特権層や議員たちの主張に耳を傾け、不必要な摩擦を避ける。協調的な議論を通じて、合意の土台を築き上げる。"
 FRA_palis_envoy:0 "パリ議会への特使"
 FRA_palis_envoy_desc:0 "リスボン側からパリの議会へと常駐の特使を迎え入れ、恒常的な対話窓口を開く。双方の利害調整を迅速化し、誤解による政治的混乱を未然に防止する。東西の意思疎通を制度的に保障する。"
 FRA_crown_in_lisbon:0 "リスボンへの座"
 FRA_crown_in_lisbon_desc:0 "皇帝が定期的にリスボンに滞在し、現地の法廷と執務を執り行う体制を整える。君主の存在を身近に感じさせることで、現地の市民の忠誠心を高める。二重国家としての実質を形式と行動で示す。"
 FRA_madeira_station:0 "マデイラ寄港協定"
 FRA_madeira_station_desc:0 "大西洋の要衝であるマデイラ諸島を海軍の重要補給拠点として位置づける協定を結ぶ。艦隊の補給と哨戒活動を円滑にし、広大な海洋航路の安全を確保する。帝国の海上権力を大西洋深くまで投射する。"
 FRA_dual_coronation:0 "二重戴冠"
 FRA_dual_coronation_desc:0 "パリのノートルダムとリスボンの大聖堂において、厳かに二重の戴冠式を執り行う。二つの伝統と歴史を継承する唯一の君主として、神と国民の前に誓いを立てる。帝国の尊厳は最高潮に達する。"
 FRA_union_of_crowns:0 "王冠統合"
 FRA_union_of_crowns_desc:0 "同君連合という緩やかな紐帯を脱し、両国の主権を完全に一つへと統合する。法制、財政、軍事のすべてを一元化し、単一の不可分な帝国へと昇華させる。真の統一国家としての新たな歴史が始まる。"
 FRA_pal_separation:0 "王冠分離"
 FRA_pal_separation_desc:0 "無理な統合による摩擦を避け、それぞれの王冠の独自性と独立性を維持する道を選ぶ。共通の君主を戴きつつも、内政においては互いの自律を尊重する。柔軟な二重体制こそが長期的安定をもたらす。"
 FRA_lisbon_joint_fleet:0 "リスボン合同艦隊"
 FRA_lisbon_joint_fleet_desc:0 "両国の海軍戦力を統合し、大西洋と地中海を睨む強力な合同艦隊を編成する。指揮系統を一本化し、共同演習を重ねて外洋での作戦能力を飛躍的に高める。敵対勢力の通商破壊を断固として粉砕する。"
 # 産業
 FRA_iberian_mines:0 "イベリア鉱山"
 FRA_iberian_mines_desc:0 "半島各地に眠る豊富な鉱物資源の本格的な開発に着手する。最新の採掘機材を導入し、帝国の重工業を支える原料供給基地として再整備する。地下の富を掘り起こし、軍備の拡張を支える。"
 FRA_rio_tinto_concessions:0 "鉱山利権"
 FRA_rio_tinto_concessions_desc:0 "リオ・ティントをはじめとする重要鉱山の採掘権と経営権を帝国の管理下に置く。外国資本の影響力を排除し、戦略的に不可欠な銅や硫黄の供給を独占する。国家主権に基づき、資源の流出を防ぐ。"
 FRA_asturias_coal:0 "アストゥリアス炭田"
 FRA_asturias_coal_desc:0 "アストゥリアスの炭鉱地帯に大規模な投資を行い、石炭の産出量を急速に引き上げる。輸送路の整備と坑道の近代化を急ぎ、製鉄所や鉄道網に安定して燃料を供給する。帝国の産業心臓部に火を灯す。"
 FRA_basque_steel:0 "バスク製鉄"
 FRA_basque_steel_desc:0 "ビルバオ周辺の製鉄コンビナートを拡張し、軍艦や戦車に必要な高品質の鋼鉄を量産する。現地の熟練労働者と最新の冶金技術を結びつけ、生産能力を極限まで高める。鉄と炎の砦を築き上げる。"
 FRA_pyrennees_rail:0 "ピレネー鉄道"
 FRA_pyrennees_rail_desc:0 "険しいピレネー山脈を越えて本国と半島を結ぶ鉄道幹線を増強する。標準軌の敷設と複線化を進め、人車や軍需物資の大量輸送を可能にする。物理的な大動脈が両地域の一体化を加速させる。"
 FRA_madrid_workshops:0 "マドリード工廠"
 FRA_madrid_workshops_desc:0 "マドリード周辺に大規模な兵器廠を建設し、小銃や大砲の現地生産体制を確立する。ピレネー以南の部隊へ迅速に装備を行き渡らせ、補給線を短縮する。自立した軍事生産基盤を整える。"
 FRA_renault_contracts:0 "ルノー請負"
 FRA_renault_contracts_desc:0 "フランスの大手自動車企業ルノーに、装甲車両や軍用トラックの大量生産を発注する。民間工場の高い生産力を軍需へと転換し、部隊の機械化を一気に進める。工業界との強固な協力関係を築く。"
 FRA_colonial_ports:0 "外地港"
 FRA_colonial_ports_desc:0 "アフリカや大西洋の植民地港湾を拡張し、大型船舶が常時寄港できる設備を整える。通商路の要衝を抑え、外地からの原料輸送と本土からの防衛派遣を円滑にする。帝国の世界的な補給網を強固にする。"
 FRA_five_year_plan:0 "五年計画"
 FRA_five_year_plan_desc:0 "国家主導による意欲的な五年経済計画を策定し、重化学工業と基盤インフラの整備を一気に進める。生産目標を厳格に管理し、産業全体の近代化を力強く牽引する。自給自足可能な経済基盤を確立する。"
 FRA_channel_trade:0 "海峡通商"
 FRA_channel_trade_desc:0 "英仏海峡を挟む貿易航路の利権を確保し、関税と物流の再編を進める。隣国との通商を活性化させて莫大な税収を得るとともに、経済的な発言権を強める。海峡の波間を行き交う富を支配する。"
 # 対ESP産業枝
 FRA_machine_for_orinoco:0 "機械とオリノコ油"
 FRA_machine_for_orinoco_desc:0 "南米オリノコ川流域の石油資源に着目し、高度な産業機械との物々交換交渉を進める。最新鋭の工作機械や工業製品を供与する見返りとして、渇望する重油を安定確保する。産業と軍隊の血潮を手に入れる。"
 FRA_curacao_joint_slot:0 "キュラソー合弁枠"
 FRA_curacao_joint_slot_desc:0 "カリブ海のキュラソー島に位置する精油施設に共同出資し、利用枠を確保する。原油の精製能力を外部で押さえることで、大西洋を越えて運ばれる燃料を効率的に製品化する。海洋戦略の要衝を確保する。"
 FRA_embargo_exile_oil:0 "亡命油の禁輸"
 FRA_embargo_exile_oil_desc:0 "対立する亡命政権が支配または利用する産油ルートに対し、厳しい禁輸措置を発動する。海外からの物資流入を遮断し、反乱勢力の継戦能力を根底から干渉する。敵の生命線を断ち切る経済戦を展開する。"
 FRA_iberian_autarky:0 "イベリア自給軍需"
 FRA_iberian_autarky_desc:0 "ピレネー以南の防衛に必要な軍需物資を、現地の生産力のみで完全に賄える体制を整える。海上封鎖や本土の危機に際しても、半島の防衛網が自立して機能するようにする。強固な自給自足の砦を完成させる。"
 # 軍事
 FRA_grand_armee_review:0 "大陸軍点検"
 FRA_grand_armee_review_desc:0 "帝国陸軍の編成と装備を総点検し、最新の軍事教義に即した近代化を図る。旧式兵器を退役させ、指揮系統の合理化と機動訓練を徹底する。ナポレオンの遺産を継ぐ誇り高き大軍の戦闘力を研ぎ澄ます。"
 FRA_gamelin_doctrine:0 "ガムラン・ドクトリン"
 FRA_gamelin_doctrine_desc:0 "モーリス・ガムラン将軍が提唱する防御的かつ慎重な運用計画を採用する。堅固な陣地と周到な兵站配置を軸とし、敵の攻勢を確実に受け止めて消耗を強いる。綿密な計算に基づき戦線を支える。"
 FRA_degaulle_armor:0 "ド・ゴール装甲"
 FRA_degaulle_armor_desc:0 "シャルル・ド・ゴール大佐の革新的な機甲師団構想を取り入れ、戦車を集中運用する独立部隊を編制する。敵の防衛線を突破し縦深を急襲する電撃的な機動力を手に入れる。陸戦の主導権を握るための変革を断行する。"
 FRA_maginot_extension:0 "マジノ延長"
 FRA_maginot_extension_desc:0 "国境地帯の巨大要塞線を北方の脆弱な低地帯へと向けて延伸する。鉄筋コンクリートと重砲の連鎖を築き上げ、いかなる侵略軍の通過も許さない不落の防壁とする。祖国の門戸を鋼鉄で閉ざす。"
 FRA_pyrenees_line:0 "ピレネー線"
 FRA_pyrenees_line_desc:0 "かつての国境であったピレネー山脈の険峻な峠道に防衛拠点を構築する。万一の半島動乱や海上からの侵入に備え、戦略的な予備防衛線として整備する。帝国の背後を固める要害を整える。"
 FRA_alpine_forts_focus:0 "アルプス要塞"
 FRA_alpine_forts_focus_desc:0 "雪深きアルプス山脈の隘路に強固なトーチカと観測所を配備する。険しい山岳地帯を天然の障壁として最大限に活用し、東方からのいかなる企ても粉砕する。標高の利を活かした堅牢な守りを築く。"
 FRA_colonial_army:0 "外地軍"
 FRA_colonial_army_desc:0 "アフリカや海外領土に駐留する部隊を再編し、現地の環境に適応した機動部隊を育てる。過酷な気候に耐える練度を高め、広大な植民地防備と本土への迅速な増援を担わせる。帝国の広範な領域を守り抜く。"
 FRA_darlan_fleet:0 "ダルラン艦隊"
 FRA_darlan_fleet_desc:0 "フランソワ・ダルラン提督の構想のもと、近代的で均整のとれた海洋打撃戦力を構築する。新鋭戦艦と巡洋艦の連携を強化し、大西洋と地中海の制海権を断固として掌握する。海軍の誇りを一身に背負い出航する。"
 FRA_atlantic_squadron:0 "大西洋艦隊"
 FRA_atlantic_squadron_desc:0 "荒れ狂う大西洋の通商路を護衛し、敵の大型艦を警戒するための精鋭部隊を配備する。外洋航行能力の高い艦艇を集中させ、広大な西方の海原に睨みを利かせる。帝国の西の防壁として海原を警戒する。"
 FRA_mediterranean_squadron:0 "地中海艦隊"
 FRA_mediterranean_squadron_desc:0 "要衝トゥーロンを拠点とし、地中海の海脈を掌握する艦隊を強化する。北アフリカ航路の安全を死守し、周辺諸国の海軍力に対抗できる圧倒的な優位を確立する。地中海を真の帝国の湖とする。"
 FRA_vuillemin_air:0 "ビュイヤマン航空"
 FRA_vuillemin_air_desc:0 "ジョゼフ・ビュイヤマン将軍の指導下、空軍の組織改革と新鋭機の配備を進める。時代遅れとなった機体を刷新し、近代的な戦闘機隊と爆撃機隊を編成する。青空の覇権を握るため、航空戦力の再建を急ぐ。"
 FRA_air_reserve:0 "航空予備"
 FRA_air_reserve_desc:0 "パイロットの養成学校を拡充し、機体の備蓄と整備体制を強化する。激化する航空戦において消耗に耐えうる分厚い予備戦力を常に確保する。継続的な作戦行動を支える基盤を固める。"
 # 対ESP軍事枝
 FRA_joint_antilles_patrol:0 "アンティル共同哨戒"
 FRA_joint_antilles_patrol_desc:0 "西インド諸島周辺の海域において、友邦軍とともに合同パトロール網を展開する。不審船の侵入を監視し、通商破壊の危険を未然に排除する。カリブの海平線に揺るぎない監視の目を配る。"
 FRA_strait_shared_watch:0 "セウタ海峡共同監視"
 FRA_strait_shared_watch_desc:0 "地中海の出入口であるジブラルタル海峡周辺をセウタ側から厳格に監視する。沿岸砲台とレーダー施設を整備し、海峡を通過するすべての艦船を捕捉する。戦略のチョークポイントを完全に掌握する。"
 FRA_exile_asw_race:0 "対潜競争"
 FRA_exile_asw_race_desc:0 "亡命勢力や敵対勢力が放つ潜水艦の脅威に対抗するため、対潜哨戒能力を強化する。駆逐艦への新型探信儀の配備と哨戒機の増積を急ぎ、水中の暗殺者を索敵・撃滅する。生命線たる補給船団を死守する。"
 FRA_antilles_blockade_plan:0 "アンティル封鎖計画"
 FRA_antilles_blockade_plan_desc:0 "敵対勢力の拠点となりつつあるカリブ海域に対し、徹底的な海上封鎖を課す作戦を立案する。主要な港湾を海上から締め上げ、補給物資と外部からの支援を完全に遮断する。敵の抵抗拠点を兵糧攻めにする。"
 # 対ESP関係
 FRA_spain_question:0 "スペイン問題"
 FRA_spain_question_desc:0 "ピレネー以南に残る旧秩序の残滓と、海外へ逃れた反対派の動向をどのように処理すべきか。武力による完全な抑え込みか、それとも政治的な懐柔と和解の模索か。半島の将来を左右する重大な選択が迫られている。"
 FRA_spain_handshake:0 "対ESP握手"
 FRA_spain_handshake_desc:0 "亡命政権や現地の穏健派勢力と対話の席に着き、互いの存在を認める協定を結ぶ。過去の遺恨を水に流し、共通の利害に基づいた平和的な共存関係を模索する。融和の握手を交わし、不毛な対立を終結させる。"
 FRA_spain_cold_file:0 "冷たいファイル"
 FRA_spain_cold_file_desc:0 "対立勢力との交渉を打ち切り、彼らに関するすべての記録を敵対的な脅威として封印する。もはや融和の余地はなく、冷徹な封じ込めと治安工作によって脅威を根絶する。断固たる姿勢で潜在的敵対者を監視する。"
 FRA_caracas_recognition:0 "カラカス黙認"
 FRA_caracas_recognition_desc:0 "カラカスに逃れた旧指導部らの活動に対し、表向きの過度な干渉を避けて現状を黙認する。遠く離れた彼らの存在を棚上げにすることで、南米諸国との摩擦を回避し国益を優先する。現実的な外交判断を下す。"
 FRA_iberian_joint_charter_fra:0 "イベリア共同憲章"
 FRA_iberian_joint_charter_fra_desc:0 "フランスとイベリアの諸民族が対等な立場で共存するための恒久的な基本憲章を制定する。相互の権利と義務を明文化し、連帯に基づく新たな秩序の礎石を築く。大西洋から地中海を結ぶ新たな共同体が誕生する。"
 FRA_atlantic_entente_fra:0 "大西洋協商"
 FRA_atlantic_entente_fra_desc:0 "大西洋を挟む友邦諸国と緊密な安全保障協定を締結する。共通の脅威に対処するための情報共有と相互防衛を約束し、海洋秩序の主導権を握る。西欧の安定を守護する強固な同盟網を完成させる。"
 FRA_exile_spain_watch:0 "亡命監視"
 FRA_exile_spain_watch_desc:0 "海外へ逃れた反乱指導者たちの不穏な動向を監視するため、諜報網を世界規模で展開する。彼らの資金源や武器調達ルートを暴き、再起の企てを水際で粉砕する。陰謀の芽を決して見逃さない。"
 FRA_caribbean_expedition:0 "カリブ遠征準備"
 FRA_caribbean_expedition_desc:0 "海を越えた敵対拠点を制圧するため、長距離展開が可能な遠征軍の準備を進める。揚陸艦の確保と熱帯地での戦闘訓練を施し、カリブ海への電撃的な部隊派遣を可能にする。海の彼方へ帝国の鉄槌を下す。"
 # アンドラ
 FRA_andorra_valley:0 "渓谷の現状"
 FRA_andorra_valley_desc:0 "ピレネーの山中に抱かれた中世以来のアンドラ渓谷は、複雑な歴史的権利が絡み合う地である。現地の自治慣習と住民の生活を調査し、長らく放置されてきた現状を把握する。山間の小国に対する帝国の関与を再考する。"
 FRA_imperial_coprince:0 "皇帝の共治権"
 FRA_imperial_coprince_desc:0 "フランス元首が伝統的に保持してきたアンドラ共治大公の権利を、皇帝の名において改めて確認する。ウルヘル司教とともに渓谷の主権を分け合い、古来の特権を帝国秩序の中に組み込む。伝統の正統な継承者としての威信を示す。"
 FRA_coprincipality_offer:0 "共治提案"
 FRA_coprincipality_offer_desc:0 "共治大公としての義務を果たすため、渓谷の統治に関する新たな協定案を現地へ提示する。インフラの近代化や経済的支援を約束し、帝国の保護下で繁栄を享受する道を提案する。平和的な対話を通じて影響力を確固たるものにする。"
 FRA_release_adr:0 "アンドラ解放"
 FRA_release_adr_desc:0 "過度な干渉を排し、アンドラ住民に完全な自治と自由な決定権を委ねる。ピレネーの要塞化や軍事利用から彼らを切り離し、中立の平和な渓谷として国際社会へ送り出す。寛大なる帝国の態度を世界に示す。"
 FRA_andorra_fort:0 "渓谷要塞化"
 FRA_andorra_fort_desc:0 "アンドラの険しい地形を天然の要塞として捉え、重砲陣地や防御施設を構築する。ピレネー山脈を越える間道を封鎖し、軍事的な戦略拠点へと塗り替える。平穏な谷間に鋼鉄の規律を敷く。"
 FRA_pyrenees_listen_post:0 "傍受所"
 FRA_pyrenees_listen_post_desc:0 "山頂の澄んだ大気と高低差を利用し、最新の無線傍受・監視ステーションを建設する。周辺諸国の軍用通信を傍受し、敵の意図をいち早く察知する情報基地とする。見えざる耳が山脈の頂から全方位を警戒する。"
 FRA_valley_customs:0 "渓谷関税"
 FRA_valley_customs_desc:0 "密輸の温床となりがちだった渓谷地帯に近代的な税関を設置し、通商の流れを完全に統制する。不法な物資の流出入を取り締まり、帝国の関税法を厳格に適用する。山岳ルートの経済的な主権を確立する。"
 # 外交
 FRA_dover_question:0 "ドーバー問題"
 FRA_dover_question_desc:0 "イギリス海峡を隔てて対峙する英国との関係は、帝国の安全保障における最重要課題である。対決の道を歩むか、それとも海峡の平和を維持する協調を選ぶか。歴史的な宿敵との距離感を慎重に定めねばならない。"
 FRA_channel_entente:0 "海峡協商"
 FRA_channel_entente_desc:0 "ロンドンとの間に建設的な対話を開き、海峡の安定と通商の自由を保障する協定を結ぶ。過去の確執を乗り越えて相互不可侵の枠組みを築き、西方世界の連帯を深める。海峡の両岸に平和の橋を架ける。"
 FRA_channel_rivalry:0 "海峡競争"
 FRA_channel_rivalry_desc:0 "英国の海洋覇権に対抗し、海峡を挟む戦略的な軍拡競争を辞さない構えをとる。沿岸要塞を増強し、通商破壊艦を配置して対岸に強烈な圧力を加える。覇権を争う対決姿勢を明確にする。"
 FRA_rhineland_watch:0 "ライン監視"
 FRA_rhineland_watch_desc:0 "東方の国境線、特に非武装化されたラインラントの動向を厳しく監視する。ドイツ側の不穏な軍備拡張や挑発行動に即応できるよう、偵察と防衛準備を怠らない。平和を守るため、防壁の向こうに目を光らせる。"
 FRA_alsace_memory:0 "アルザスの記憶"
 FRA_alsace_memory_desc:0 "かつて幾度も戦禍に巻き込まれたアルザス・ロレーヌの痛みを決して忘れてはならない。国民の防衛意識を高め、二度と祖国の神聖な領土を奪われない誓いを新たにする。歴史の教訓を胸に、東部戦線の警戒を固める。"
 FRA_italian_border:0 "サヴォワ国境"
 FRA_italian_border_desc:0 "アルプスを挟んで接するイタリアとの国境地帯に防衛線を再配置する。隣国の拡張主義的な野心に備え、要衝の峠道を封鎖して不測の事態を防ぐ。南東の門戸を強固に閉ざし、侵略の意図を挫く。"
 FRA_monaco_status:0 "モナコ地位協定"
 FRA_monaco_status_desc:0 "地中海沿岸の小国モナコとの保護条約を再確認し、帝国の安全保障傘下に確実に組み込む。港湾の利用権や通信の安全を確保し、戦略的な間隙が生じるのを防ぐ。小国の安全を保障しつつ、沿岸の支配を完成させる。"
 # 終局
 FRA_empire_of_west:0 "西方帝国宣言"
 FRA_empire_of_west_desc:0 "フランスとイベリアを束ねた大帝国は、西欧の正統な覇者としてその成立を高らかに宣言する。かつての大陸軍の栄光を甦らせ、ヨーロッパの新秩序を指導する意志を世界に示す。偉大なる西方の帝国がここに誕生した。"
 FRA_iberian_coronation:0 "イベリア戴冠"
 FRA_iberian_coronation_desc:0 "トレドの古都またはリスボンの壮麗な大聖堂で、イベリアの王冠を戴く式典を挙行する。現地の諸身分と民衆が皇帝への忠誠を誓い、数世紀にわたる分裂の歴史に幕を下ろす。半島の民と皇帝の絆が神聖に祝福される。"
 FRA_twin_thrones_final:0 "双玉座の確定"
 FRA_twin_thrones_final_desc:0 "パリとリスボンの双玉座体制は、一切の動揺を排して恒久的な制度として完成された。二つの国家の伝統を保ちつつ、単一の意志によって動く巨大な連邦帝国が確立する。揺るぎない二重統治の時代が幕を開ける。"
 FRA_continent_master:0 "大陸統治の完成"
 FRA_continent_master_desc:0 "大西洋からライン川、ピレネーからジブラルタルに至る大帝国の統治機構が完全に結実した。法、軍隊、産業のすべてが完璧な調和のもとに機能し、大陸西半を支配する。覇者としての地位は誰の目にも疑いようがない。"
 FRA_new_charlemagne:0 "新シャルルマーニュ"
 FRA_new_charlemagne_desc:0 "西欧の統一を果たした皇帝は、かつての中世の始祖シャルルマーニュの再来として称えられる。諸民族を一つの冠のもとに統合し、ヨーロッパに永続的な秩序と繁栄をもたらす。千年の時を超えて、偉大なる帝国の理想が蘇る。"