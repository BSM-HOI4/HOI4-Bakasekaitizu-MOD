l_japanese:
  chn_strikes.1.t:0 "労働ストライキの発生"
  chn_strikes.1.d:0 "各地の工場労働者が不満を抱え、相次いでストライキを宣言している。生産に深刻な影響が出るのは避けられない状況だ。政府は事態の収束に向けて対応を迫られている。"
  chn_strikes.1.a:0 "事態を注視する"
  chn_strikes.2.t:0 "ストライキの収束"
  chn_strikes.2.d:0 "労働者たちの要求に一部応じた結果、ストライキはようやく収束に向かっている。生産体制の復旧にはまだ時間がかかるが、社会秩序は徐々に回復しつつある。"
  chn_strikes.2.a:0 "秩序は回復した"
