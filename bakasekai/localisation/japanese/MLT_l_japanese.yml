l_japanese:
  MLT_restore_the_order:0 "聖ヨハネ騎士団の復興"
  MLT_restore_the_order_desc:0 "マルタ島に宿る騎士団の誇りと伝統を復興し、かつての栄光を取り戻す。聖ヨハネ騎士団の精神は今もこの地に生き続けている。"
  MLT_grand_master_authority:0 "総長の権威強化"
  MLT_grand_master_authority_desc:0 "騎士団の最高指導者たる総長の権威を強化し、組織の結束を固める。規律と忠誠こそが騎士団の力の源である。"
  MLT_hospitallers_legacy:0 "施療騎士団の遺産"
  MLT_hospitallers_legacy_desc:0 "古来より傷病者を救護してきた施療騎士団の遺産を受け継ぎ、その崇高な使命を現代に蘇らせる。"
  MLT_fortify_malta:0 "マルタの要塞化"
  MLT_fortify_malta_desc:0 "マルタ島を難攻不落の要塞とする。地中海の戦略的拠点として、いかなる敵の侵攻にも耐えうる防衛線を構築する。"
  MLT_knight_commanders:0 "騎士指揮官の育成"
  MLT_knight_commanders_desc:0 "騎士団の指揮官層を強化し、近代的な軍事知識と騎士道精神を兼ね備えた指導者を育成する。"
  MLT_medical_corps:0 "騎士団医療団の設立"
  MLT_medical_corps_desc:0 "施療騎士団の伝統を受け継ぎ、高度な医療能力を持つ組織を設立する。戦場においても民間においても、その奉仕の精神は変わらない。"
  MLT_naval_tradition:0 "海洋騎士の伝統"
  MLT_naval_tradition_desc:0 "地中海の制海権を守り抜くため、騎士団の海洋伝統を復活させ、新たな海軍力を構築する。"
  MLT_mediterranean_bastion:0 "地中海の砦"
  MLT_mediterranean_bastion_desc:0 "マルタを地中海における不動の戦略拠点とし、海上交通の要衝を支配する。海軍基地を拡充し、周辺海域の制圧能力を高める。"
  MLT_crusader_spirit:0 "十字軍の精神"
  MLT_crusader_spirit_desc:0 "騎士たちの胸に燃え上がる十字軍の精神を奮い立たせる。神聖なる使命への献身が、我々に比類なき勇気を与える。"
  MLT_expand_the_fleet:0 "騎士団艦隊の拡充"
  MLT_expand_the_fleet_desc:0 "地中海の覇権を握るため、騎士団の艦隊を拡充する。新たな駆逐艦を建造し、海上戦力を強化する。"
  MLT_modern_knights:0 "近代騎士の結成"
  MLT_modern_knights_desc:0 "騎士団の精神を受け継ぎつつ、最新の軍事技術を駆使する近代的な特殊部隊を結成する。海兵隊の研究にボーナスを得る。"
  MLT_mediterranean_trade:0 "地中海貿易網の構築"
  MLT_mediterranean_trade_desc:0 "マルタの地理的利点を活かし、地中海全域にわたる貿易網を構築する。商業の繁栄が騎士団の力をさらに強固にする。"
  MLT_knights_of_malta:0 "マルタ騎士団"
  MLT_hospitaller_tradition:0 "施療騎士団の伝統"
  MLT_knight_commanders_idea:0 "騎士指揮官"
  MLT_medical_tradition:0 "騎士団医療伝統"
  MLT_naval_knights:0 "海洋騎士"
  MLT_crusader_zeal:0 "十字軍の熱狂"
  MLT_trade_hub:0 "地中海貿易拠点"
