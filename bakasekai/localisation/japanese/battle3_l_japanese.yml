l_japanese:
  kpo.1.t:0 "キエフ協約機構の発足"
  kpo.1.d:0 "内戦の混乱の中、キエフを掌握した勢力が新たな秩序を宣言する。大同団結して北方の脅威に立ち向かうべく、キエフ協約機構の結成が宣言された。"
  kpo.1.a:0 "時はまだ来ていない"
  kpo.1.c:0 "キエフ協約機構を結成する！"
  kpo.1.b:0 "様子を見る"
  kpo.2.t:0 "指導者の選出"
  kpo.2.t.d:0 "連合諸国が集まり、キエフ協約機構の指導権を誰に委ねるかが議論されている。各派閥が自らの指導者を推挙し、激しい駆け引きが続いている。"
  kpo.2.a:0 "BTPを支持する"
  kpo.2.b:0 "BTYを支持する"
  kpo.2.c:0 "BTGを支持する"
  kpo.2.d:0 "誰も支持しない"
  kpo.2.e:0 "BTWを支持する"
  kpo.3.t:0 "キエフ協約機構への参加"
  kpo.3.t.d:0 "キエフ協約機構からの加盟要請が届いた。内戦を終結させ、共通の敵に立ち向かうため、連合への参加が求められている。"
  kpo.3.b:0 "断る"
  kpo.4.t:0 "祖国の危機"
  kpo.4.d:0 "モスクワ、レニングラード、スターリングラード——三つの聖なる都市が敵の手に落ちようとしている。母国は存亡の危機に瀕している。もはや全面降伏か、決死の抵抗か、選択を迫られている。"
  kpo.4.a:0 "屈辱を受け入れる"
  kpo.4.b:0 "戦い続ける"
  kpo.5.t:0 "勝利の報"
  kpo.5.d:0 "キエフ協約機構の軍勢が決定的な勝利を収めた。敵の主要拠点が次々と陥落し、戦況は一変した。兵士たちの歓喜が戦場を駆け巡る。"
  kpo.5.a:0 "前進せよ！"
  kpo.6.t:0 "従属の要求"
  kpo.6.d:0 "キエフ協約機構が従属を求めてきた。圧倒的な兵力を前に、降伏を受け入れるか、最後まで抗戦するかの選択を迫られている。"
  kpo.6.a:0 "降伏を受け入れる"
  kpo.6.b:0 "徹底抗戦する"
  kpo.7.t:0 "降伏の署名"
  kpo.7.d:0 "従属条約に署名した。かつての独立は失われたが、血を流すことなく秩序は保たれた。新たな支配者の下で、国の行方はどうなるのか。"
  kpo.7.a:0 "運命に身を委ねる"
  kpo.8.t:0 "抗戦の決意"
  kpo.8.d:0 "降伏を拒否し、徹底抗戦の道を選んだ。もはや退路はない。全ての兵力を結集し、最後の一人まで戦い抜く覚悟だ。"
  kpo.8.a:0 "開戦要求を作成する"
