 bsm_eng_militia.1.t:0 "民兵募集"
 bsm_eng_militia.1.d:0 "海岸で、上陸地で、平野で街路で、そして高地で戦う。決して屈服はしない。万一 ―― そのようなことをわれわれは一瞬たりとも信じないが ――、本土の大部分が征服され､人々が飢えに苦しむことがあっても、王立艦隊の援護を受けた海のかなたのわが帝国が、権力と武力をすべて備えた新世界が旧世界の救済と解放に駆けつけるまで、必ずや戦い抜くであろう。そしてわれわれは、底を割ったビール瓶で戦うのさ。"
 bsm_eng_militia.1.a:0 "なにせ武器はそれしかないんだから。"
 bsm_broken_beer_bottle_tech:0 "底割ったビール瓶"
 bsm_broken_beer_bottle_tech_desc:0 "我々に残された最後の武器である。"
