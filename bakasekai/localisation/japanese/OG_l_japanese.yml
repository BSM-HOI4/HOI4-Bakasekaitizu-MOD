l_japanese:
  og_poland_taisho:0 "ポーランド対処"
  og_poland_taisho_desc:0 "ポーランド問題はハプスブルク帝国にとって長年の懸案である。東方における我々の権益をどのように扱うか、方針を決定しなければならない。"
  og_heigo:0 "併合"
  og_heigo_desc:0 "ポーランドを直接我が領土に編入する。古きハプスブルクの権利を行使し、東方における秩序を回復するのだ。"
  og_keizoku:0 "継続"
  og_keizoku_desc:0 "現在の方針を継続し、ポーランドにおける我々の影響力を維持する。慎重かつ着実なアプローチが必要である。"
  og_houki:0 "放棄"
  og_houki_desc:0 "ポーランドへの介入を放棄し、帝国の資源を他の方面へ振り向ける。古き執着から解放されることで新たな道が開ける。"
  og_hapusuburuk:0 "ハプスブルクの遺産"
  og_hapusuburuk_desc:0 "ハプスブルク家の栄光ある遺産を取り戻す。王朝の血脈はヨーロッパ中に広がり、かつての威光を取り戻す力となろう。"
  og_hun:0 "ハンガリー王国"
  og_hun_desc:0 "ハンガリーはハプスブルク帝国の不可欠な構成国である。マジャル人との絆を再確認し、二重帝国の基盤を固める。"
  og_OZY_hun:0 "墺洪二重帝国"
  og_OZY_hun_desc:0 "オーストリアとハンガリーの二重帝国を復活させる。二つの王国を一つの帝国の下に統合し、中央ヨーロッパの秩序を再建する。"
  og_OZYtria:0 "大オーストリア"
  og_OZYtria_desc:0 "ハンガリーへの依存を脱し、大オーストリアとして中央集権的な帝国を構築する。多民族を統合する新たな国家体制を目指す。"
  og_spain:0 "スペイン・ハプスブルク"
  og_spain_desc:0 "かつてスペインはハプスブルク家の支配下にあった。イベリア半島における王朝の絆を再び結びつけ、西ヨーロッパに影響力を及ぼす。"
  og_napori:0 "ナポリ王国"
  og_napori_desc:0 "ナポリ王国はハプスブルク家がかつて支配した南イタリアの要衝である。地中海における覇権を取り戻すため、南イタリアへの進出を図る。"
  og_kairai:0 "傀儡国家の構築"
  og_kairai_desc:0 "スペインまたはナポリに傀儡政権を樹立する。間接的な支配により、地中海世界におけるハプスブルクの影響力を拡大する。"
  og_eiseityuuritu:0 "永世中立"
  og_eiseityuuritu_desc:0 "帝国は永世中立を宣言し、列強の争いから身を引く。平和と安定を礎として、内政の充実を図る道である。"
  og_dannatu:0 "ポーランド弾圧"
  og_dannatu_desc:0 "ポーランドの抵抗を力で鎮圧する。反乱勢力を弾圧し、帝国の権威を東方に浸透させる。鉄の意志で秩序を貫くのだ。"
  og_aukusuraihi:0 "アウスグライヒ"
  og_aukusuraihi_desc:0 "1867年のアウスグライヒ（和協）にならい、各民族との妥協を図る。多民族帝国としての調和を模索する道である。"
  og_annei:0 "帝国の安寧"
  og_annei_desc:0 "内外の脅威を排除し、帝国に安寧をもたらす。安定した国家基盤の上に、新たな外交政策を展開する準備を整える。"
  og_ENG:0 "イギリスとの同盟"
  og_ENG_desc:0 "海洋大国イギリスとの同盟を結び、北方の脅威に対抗する。ハプスブルクとウィンザーの提携は、ヨーロッパの新たな均衡をもたらす。"
  og_ITA:0 "イタリアとの協調"
  og_ITA_desc:0 "イタリア王国との協調路線をとる。南の隣人との関係を改善し、地中海における共同の利益を確保する。"
  og_handoku:0 "反独路線"
  og_handoku_desc:0 "ドイツの膨張主義に対抗すべく、反独路線をとる。ヨーロッパの勢力均衡を守るため、独裁的な隣人に立ち向かう。"
  og_sindoku:0 "親独路線"
  og_sindoku_desc:0 "ドイツとの協力関係を強化する。ゲルマン民族の連帯を旗印に、中部ヨーロッパの新秩序を共に築く。"
  og_GER:0 "ドイツとの同盟"
  og_GER_desc:0 "ドイツ帝国との正式な同盟を締結する。二大ゲルマン国家の連合は、ヨーロッパの運命を左右する力となる。"
  og_juzoku:0 "ドイツへの従属"
  og_juzoku_desc:0 "ドイツの覇権下に入り、その従属国として生きる道を選ぶ。独立性を失う代わりに、強大な庇護を得る。"
  og_hapsburg_reich:0 "ハプスブルク・ライヒ"
  og_hapsburg_reich_desc:0 "ハプスブルク家の千年の栄光がここに蘇る。王朝の血脈と外交の力により、ヨーロッパ全土を覆う新たな帝国を築き上げる。"
  og_donau:0 "ドナウ連邦"
  og_donau_desc:0 "ドナウ川流域の諸民族を統合し、連邦国家を構築する。多様性の中の統一を掲げ、ドナウ流域に新たな秩序を生み出す。"
  og_OZY:0 "オーストリア帝国"
  og_OZY_desc:0 "オーストリア帝国の独立と栄光を確固たるものとする。ハプスブルク家の祖業であるこの帝国を、新たな時代にふさわしい姿へ導く。"
  og_auhun:0 "墺洪帝国"
  og_auhun_desc:0 "オーストリア＝ハンガリー帝国の完全な復活を宣言する。二つの王冠が一つに結びつき、中央ヨーロッパに君臨する。"
  og_kokkai:0 "帝国国会"
  og_kokkai_desc:0 "帝国議会を召集し、各民族の代表による国政への参加を認める。立憲的な枠組みの中で、帝国の近代化を推進する。"
  og_gozenkaigi:0 "御前会議"
  og_gozenkaigi_desc:0 "皇帝陛下の御前において、帝国の最重要政策を決定する。伝統的な御前会議を復活させ、意思決定の中枢を強化する。"
  OGn_1:0 "造船所の拡張"
  OGn_1_desc:0 "帝国の海軍力を再建するため、造船所を拡張する。かつてアドリア海を制した伝統を受け継ぎ、新たな艦隊の礎を築く。"
  OGn_2:0 "通商破壊戦術"
  OGn_2_desc:0 "潜水艦を主力とした通商破壊戦術を研究する。敵の補給線を断ち切ることで、海上の優位を確立する。"
  OGn_3:0 "艦隊決戦主義"
  OGn_3_desc:0 "大艦隊による決戦を重視する海軍ドクトリンを採用する。制海権の確保こそが、帝国の海洋戦略の中核である。"
  OGn_4:0 "潜水艦の近代化"
  OGn_4_desc:0 "最新鋭の潜水艦技術を導入し、帝国の水中戦力を強化する。深海からの脅威が、敵に恐怖を与える。"
  OGn_5:0 "巡洋艦の改良"
  OGn_5_desc:0 "軽巡洋艦および重巡洋艦の設計を近代化する。艦隊の目と耳として、偵察から哨戒まで多彩な任務を担う。"
  OGn_6:0 "主力艦の建造"
  OGn_6_desc:0 "戦艦・巡洋戦艦・航空母艦の建造技術を革新する。帝国の威信をかけた大艦巨砲主義の結晶である。"
  OGn_7:0 "駆逐艦隊の整備"
  OGn_7_desc:0 "駆逐艦の量産と改良を推進する。艦隊の護衛から対潜哨戒まで、海上作戦を縁の下から支える。"
  OGa_1:0 "空軍の創設"
  OGa_1_desc:0 "帝国空軍を正式に創設し、航空基地を整備する。制空権の確保は、現代戦において不可欠な要素である。"
  OGa_2:0 "戦闘機の開発"
  OGa_2_desc:0 "最新鋭の戦闘機を開発する。帝国の空を守る翼として、優れた空中戦闘能力を持つ機体を追求する。"
  OGa_3:0 "爆撃機の開発"
  OGa_3_desc:0 "戦略爆撃機および戦術爆撃機の開発に注力する。敵の心臓部を叩く長距離打撃力が、帝国の新たな切り札となる。"
  OGa_1_2:0 "航空戦力の拡充"
  OGa_1_2_desc:0 "航空基地をさらに拡充し、空軍ドクトリンを深化させる。航空優勢の確保が、帝国の防衛戦略の要となる。"
  OGa_4:0 "海軍航空隊"
  OGa_4_desc:0 "海軍と連携した海上哨戒および対艦攻撃能力を備えた海軍航空隊を編成する。海上と空中の協同作戦で敵を圧倒する。"
  OGa_5:0 "近接航空支援"
  OGa_5_desc:0 "地上部隊を直接支援する近接航空支援能力を強化する。空と陸の連携が、戦場における決定的な優位をもたらす。"
  OGa_6:0 "ロケット工学とジェット推進"
  OGa_6_desc:0 "最先端のロケット工学とジェット推進技術の研究に投資する。未来の空を制する技術こそ、帝国にとっての切り札である。"
