l_japanese:
  ICE_dev_forcus:0 "開発フォーカス"
  ICE_dev_forcus_desc:0 "MOD開発の旅が始まる。我々の情熱と狂気が世界を作り変える。"
  ICE_banned_onedrive:0 "OneDrive禁止令"
  ICE_banned_onedrive_desc:0 "「OneDriveでファイル共有して」——もう聞きたくない。共有リンクが期限切れになるたびに魂が削られる。禁止だ。全面禁止。"
  ICE_university_entrance_exam:0 "大学入試"
  ICE_university_entrance_exam_desc:0 "開発者を大学に送り込め。知識は力であり、単位は自由時間の墓標である。長い長い受験戦争の始まりだ。"
  ICE_return_admins:0 "管理者の帰還"
  ICE_return_admins_desc:0 "大学から帰ってきた管理者たちが、溜まったタスクの山に直面する。「Pull Requestはどこだ？」"
  ICE_tolinerism_rise:0 "トリナリズムの台頭"
  ICE_tolinerism_rise_desc:0 "Tolineerの思想がMOD開発チームに浸透し始める。プロジェクト管理の新たなイデオロギーが誕生した。"
  ICE_kometsubism:0 "コメツビズム"
  ICE_kometsubism_desc:0 "コメツブの理想に基づく新たな開発哲学。「小さく、速く、壊してもいい」——これがコメツビズムの教えである。"
  ICE_ameeto_return:0 "アミートの帰還"
  ICE_ameeto_return_desc:0 "伝説の開発者アミートが戦場——もとい開発現場に帰還する。「息してる？」の問いに「コード書いてる」と答える男。"
  ICE_discord_server:0 "Discordサーバー開設"
  ICE_discord_server_desc:0 "開発チームのコミュニケーション拠点としてDiscordサーバーを開設する。ここでアイデアが生まれ、喧嘩が始まり、そして何かが完成する。"
  ICE_server_rules:0 "サーバールール制定"
  ICE_server_rules_desc:0 "秩序なきチャットは混沌のみを生む。サーバールールを制定し、健全な（？）開発環境を維持する。"
  ICE_hello_aho_kasu:0 "こんにちはアホカス"
  ICE_hello_aho_kasu_desc:0 "「あほかす」——開発チームにおける最高の挨拶。愛の言葉である。この一言で絆は深まる。"
  ICE_mega_is_good:0 "MEGAは良い"
  ICE_mega_is_good_desc:0 "「MEGAでいいじゃん」——Git？知らない子ですね。大容量ファイル共有の王者、MEGAを使い続ける栄光の道。"
  ICE_introduce_github:0 "GitHub導入"
  ICE_introduce_github_desc:0 "文明への第一歩。ついにGit/GitHubを導入し、バージョン管理という概念に触れる。「commitって何？」"
  ICE_zip:0 "ZIP圧縮地獄"
  ICE_zip_desc:0 "「最新版.zip」「最新版_修正.zip」「最新版_修正_最終.zip」「最新版_修正_最終_本番.zip」——この苦しみを知る者だけが、Gitの恩恵を理解できる。"
  ICE_first_commit:0 "ファーストコミット"
  ICE_first_commit_desc:0 "歴史的瞬間。初めてのコミットが行われる。コミットメッセージ：「動くやつ」。美しい。"
  ICE_map_making:0 "マップ制作"
  ICE_map_making_desc:0 "世界地図を作る。プロビンスの境界線一つ一つが、開発者の精神を削っていく。「この州の形、おかしくない？」"
  ICE_mapmod_integration:0 "マップMOD統合"
  ICE_mapmod_integration_desc:0 "制作したマップをMOD本体に統合する。コンフリクトとの戦いが始まる。「マージして」——「マージした」——「壊れた」。"
  ICE_nostepback:0 "退くな"
  ICE_nostepback_desc:0 "「No Step Back」——後戻りは許されない。Gitの歴史を改変しても、開発の歩みは止められない。"
  ICE_client_ping:0 "クライアントPing"
  ICE_client_ping_desc:0 "「@everyone 起きてますか？」——深夜3時のPingが開発を駆動する。睡眠は敵である。"
  ICE_hahahawhynotusegit:0 "あはは、なんでGit使わないの？"
  ICE_hahahawhynotusegit_desc:0 "「え、まだZIPで管理してるの？笑」——先輩開発者の言葉が胸に突き刺さる。そう、使わない理由がなかったのだ。"
  ICE_integration_into_github:0 "GitHub完全統合"
  ICE_integration_into_github_desc:0 "ついに全ての開発プロセスがGitHubに統合される。Issue、PR、Review——現代的な開発フローの完成である。"
  ICE_github_rules:0 "GitHub運用ルール"
  ICE_github_rules_desc:0 "ブランチ戦略、コミット規約、PRテンプレート——GitHubの運用ルールを定め、混沌に秩序をもたらす。"
  ICE_good_github:0 "良いGitHub"
  ICE_good_github_desc:0 "美しいコミットログ、整理されたIssue、迅速なReview——理想的なGitHubリポジトリが完成する。涙が出るほど美しい。"
  ICE_warm_hand_typing:0 "温かい手でタイピング"
  ICE_warm_hand_typing_desc:0 "冬の深夜、冷え切った手でキーボードを叩く開発者たち。でも情熱は熱い。温かい手で未来をタイプする。"
  ICE_ver_tsundere:0 "Ver.ツンデレ"
  ICE_ver_tsundere_desc:0 "「別にリリースしたくてやってるわけじゃないし！」——ツンデレ精神でMODのバージョンアップを成し遂げる。最終形態。"
  ICE_act1:0 "第1幕：始まり"
  ICE_act1_desc:0 "物語はここから始まる。一人の開発者が狂気の世界に足を踏み入れる。"
  ICE_act2:0 "第2幕：出会い"
  ICE_act2_desc:0 "開発者たちが集い、チームが結成される。「お前もか」という運命の出会い。"
  ICE_act3:0 "第3幕：葛藤"
  ICE_act3_desc:0 "意見の対立、技術的な壁、そして无尽的なバグ。開発チームに亀裂が入る。"
  ICE_act4:0 "第4幕：決意"
  ICE_act4_desc:0 "それでも開発は続く。闇を乗り越える決意を固める。"
  ICE_act5:0 "第5幕：転機"
  ICE_act5_desc:0 "突破口が見える。長いトンネルの先に光が差す。"
  ICE_act6:0 "第6幕：激動"
  ICE_act6_desc:0 "開発チーム最大の危機。全てが崩れかける中、真の結束が試される。"
  ICE_act7:0 "第7幕：再起"
  ICE_act7_desc:0 "灰の中から蘇る開発チーム。かつてないほどの力を結集する。"
  ICE_act8:0 "第8幕：完成"
  ICE_act8_desc:0 "ついにMODが完成する。長き旅の果てに、栄光のフィナーレが訪れる。"
  ICE_act9:0 "第9幕：新たな旅立ち"
  ICE_act9_desc:0 "完成は終わりではない。新たなアップデート、新たなバグ、新たな冒険が待っている。"
