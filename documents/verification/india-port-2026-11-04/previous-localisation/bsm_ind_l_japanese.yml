l_japanese:
 # ============================================================
 # フォーカスツリー - インド自治領シナリオ
 # ============================================================

 # Phase 0 - ルート
 IND_dominion_crossroads:0 "帝国の岐路"
 IND_dominion_crossroads_desc:0 "インドは大英帝国の支配下に置かれているが、独立への機運は高まる一方である。我々はこの岐路において、どの道を選ぶべきか。"

 # Phase 1A - 国民会議派路線
 IND_indian_national_congress:0 "インド国民会議派"
 IND_indian_national_congress_desc:0 "インド国民会議派は、平和的手段による独立を掲げる。ガンジーやネルーの指導のもと、非暴力の精神で英国との交渉を進めよう。"
 IND_swaraj_demand:0 "スワラージの要求"
 IND_swaraj_demand_desc:0 "「スワラージ（自治）」——インド人自らがインドを統治する権利を要求する。インド独立への最初の一歩である。"
 IND_salt_march_legacy:0 "塩の行進の遺産"
 IND_salt_march_legacy_desc:0 "ガンジーの塩の行進は、インド全土に不服従運動の精神を広めた。この遺産を受け継ぎ、非暴力の抵抗を続けよう。"
 IND_congress_provincial_elections:0 "州議会選挙"
 IND_congress_provincial_elections_desc:0 "州議会選挙において圧勝した国民会議派は、藩王国との関係を見直し、より民主的な統治を目指す。"
 IND_demand_self_governance:0 "自治の要求"
 IND_demand_self_governance_desc:0 "英国政府に対して正式に自治権を要求する。英国がどのような返答をするかは分からないが、インドの声は世界に届くだろう。"
 IND_atlantic_charter_appeal:0 "大西洋憲章への訴え"
 IND_atlantic_charter_appeal_desc:0 "チャーチルとルーズベルトが署名した大西洋憲章は、すべての民族の自決権を謳っている。インドもこの原則が適用されるべきだ。"
 IND_cripps_mission_response:0 "クリップス使節団への対応"
 IND_cripps_mission_response_desc:0 "英国政府はスタッフォード・クリップスを派遣し、戦後の自治を約束する条件を提示してきた。この提案にどう応じるか。"
 IND_declaration_of_independence_congress:0 "独立宣言（国民会議派）"
 IND_declaration_of_independence_congress_desc:0 "インド国民会議派は、英連邦からの完全独立を宣言する。ネルーは「運命との約束を果たす時が来た」と語った。"

 # Phase 1B - アザド・ヒンド路線
 IND_all_india_forward_bloc:0 "全インド前進同盟"
 IND_all_india_forward_bloc_desc:0 "スバス・チャンドラ・ボーズが率いる急進派は、英国との妥協を拒否する。力によってのみ独立は勝ち取れると信じる。"
 IND_bose_returns:0 "ボーズの帰還"
 IND_bose_returns_desc:0 "インド国民軍の創設者、スバス・チャンドラ・ボーズが帰還した。彼の強烈なカリスマは急進派を鼓舞し、独立運動に新たな風を吹き込む。"
 IND_axis_alignment:0 "枢軸国との連携"
 IND_axis_alignment_desc:0 "「我が敵の敵は味方なり」——英国と戦うドイツ・日本との接触を図り、独立の機会を探る。"
 IND_soviet_alignment:0 "ソ連との連携"
 IND_soviet_alignment_desc:0 "ソ連の革命的理念は植民地解放を支持する。共産主義の支援のもと、英帝国主義からの解放を目指す。"
 IND_indian_national_army:0 "インド国民軍"
 IND_indian_national_army_desc:0 "英国に対して武装蜂起するインド国民軍を創設する。ラクシュミー・サーガルらの指揮のもと、独立戦争の準備を整える。"
 IND_axis_support_independence:0 "枢軸国の独立支援"
 IND_axis_support_independence_desc:0 "ドイツ・日本に対してインドの独立支援を要請する。彼らにとっても英国を内側から崩す好機となるだろう。"
 IND_soviet_support_independence:0 "ソ連の独立支援"
 IND_soviet_support_independence_desc:0 "ソ連に対してインド革命への支援を要請する。植民地解放は社会主義革命の一部であるとソ連は信じている。"
 IND_azad_hind_declaration:0 "アザド・ヒンド政府宣言"
 IND_azad_hind_declaration_desc:0 "ボーズはアザド・ヒンド（自由インド）の仮政府樹立を宣言する。インド解放のための全面戦争が始まる。"

 # Phase 1C - 帝国奉仕路線
 IND_imperial_service_path:0 "帝国への奉仕"
 IND_imperial_service_path_desc:0 "英連邦の一員として英国と協力しながら、段階的に自治を拡大していく道を選ぶ。急激な変化よりも安定を優先する。"
 IND_princely_state_donations:0 "藩王国の貢献"
 IND_princely_state_donations_desc:0 "各藩王国に戦争努力への貢献を求める代わりに、彼らの自治を保障する。"
 IND_commonwealth_realm_upgrade:0 "英連邦王国への昇格"
 IND_commonwealth_realm_upgrade_desc:0 "インドを英連邦王国として位置づける。カナダやオーストラリアと同等の自治権を得ることが目標だ。"
 IND_british_military_cooperation:0 "英国との軍事協力"
 IND_british_military_cooperation_desc:0 "英国軍との緊密な協力のもと、インド軍の近代化を進める。英国の技術と経験から多くを学ぶことができる。"
 IND_dominion_constitution:0 "自治領憲法"
 IND_dominion_constitution_desc:0 "英連邦の枠組みの中で新たな憲法を制定し、より広い自治権を確立する。"

 # Phase 2 - 独立後の混乱
 IND_independence_celebrations:0 "独立の熱狂"
 IND_independence_celebrations_desc:0 "独立の喜びは全土に広がるが、同時に政治的・宗教的な混乱も始まりつつある。新生インドが直面する課題は山積している。"
 IND_partition_question:0 "分割問題"
 IND_partition_question_desc:0 "全インド・ムスリム連盟はヒンドゥーとムスリムの共存は不可能として、別個のイスラム国家「パキスタン」の樹立を要求している。"
 IND_integrate_princely_states:0 "藩王国の統合"
 IND_integrate_princely_states_desc:0 "独立後のインドには500以上の藩王国が残っている。これらを統合してインド連邦を完成させなければならない。"
 IND_bengal_famine_relief:0 "ベンガル飢饉対策"
 IND_bengal_famine_relief_desc:0 "ベンガルを中心に飢饉が発生している。独立したインドの最初の仕事は、自国民を飢えから救うことだ。"
 IND_accept_partition:0 "分割を受け入れる"
 IND_accept_partition_desc:0 "痛みを伴うが、分割を受け入れることで宗教間の暴力を最小限に抑え、平和的な移行を実現できるかもしれない。"
 IND_resist_partition:0 "統一インドを守る"
 IND_resist_partition_desc:0 "インドの分割は受け入れられない。すべての宗教・民族が共存する統一インドを実現するために闘う。"
 IND_states_reorganization_act:0 "州再編成法"
 IND_states_reorganization_act_desc:0 "藩王国を廃止し、言語・文化的な区分に基づいてインドの行政区分を再編する大改革を実施する。"
 IND_refugee_crisis_management:0 "難民危機への対処"
 IND_refugee_crisis_management_desc:0 "分割や内戦を逃れた何百万もの難民が押し寄せている。人道的な危機に迅速に対応しなければならない。"
 IND_emergency_food_program:0 "緊急食料プログラム"
 IND_emergency_food_program_desc:0 "飢饉と食糧不足に対応するための緊急食料生産プログラムを立ち上げる。インドの農業を根本から変える必要がある。"
 IND_secular_constitution:0 "世俗主義憲法"
 IND_secular_constitution_desc:0 "インドを宗教や民族に関わらず、すべての市民が平等な権利を持つ世俗主義共和国として位置づける憲法を制定する。"
 IND_accession_of_hyderabad:0 "ハイデラバードの帰属"
 IND_accession_of_hyderabad_desc:0 "ムスリムが支配するハイデラバード藩王国は独立を志向しているが、インドの地理的中心に位置するこの地を統合しなければならない。"
 IND_kashmir_question:0 "カシミール問題"
 IND_kashmir_question_desc:0 "ヒンドゥー藩王が統治するカシミールの帰属問題は、インドとパキスタンの間の長年の懸案事項となっている。"

 # Phase 3 - 国家建設
 IND_nehru_government:0 "ネルー政権"
 IND_nehru_government_desc:0 "ジャワハルラール・ネルーを首相とする民主政権を確立する。社会主義的民主主義によってインドの近代化を推進する。"
 IND_constituent_assembly:0 "憲法制定議会"
 IND_constituent_assembly_desc:0 "アンベードカルが委員長を務める憲法制定議会が、インド共和国の基本法を起草する。"
 IND_planning_commission:0 "計画委員会"
 IND_planning_commission_desc:0 "経済発展を計画的に推進するための計画委員会を設立する。インドの経済的自立を実現するための長期計画を策定する。"
 IND_tata_steel_expansion:0 "タタ製鉄の拡張"
 IND_tata_steel_expansion_desc:0 "ジャムシェドプールのタタ製鉄を国家の重工業の柱として拡張する。インドの工業化を加速させる。"
 IND_assam_oil_nationalization:0 "アッサム油田の国有化"
 IND_assam_oil_nationalization_desc:0 "アッサムの油田を国有化し、エネルギー資源を国家の手に取り戻す。石油の自給自足を目指す。"
 IND_first_five_year_plan:0 "第一次五カ年計画"
 IND_first_five_year_plan_desc:0 "農業・重工業・インフラを中心とした第一次五カ年計画を策定する。インドは計画経済によって急速な発展を目指す。"
 IND_green_revolution_research:0 "緑の革命"
 IND_green_revolution_research_desc:0 "農業技術の革新によって食料生産を飛躍的に増大させる「緑の革命」を推進する。飢饉の悲劇を二度と繰り返さない。"
 IND_hindustan_aircraft_factory:0 "ヒンドスタン航空機工場"
 IND_hindustan_aircraft_factory_desc:0 "バンガロールにヒンドスタン航空機工場を建設し、インド独自の航空産業を育成する。"
 IND_great_indian_peninsula_railway:0 "大インド半島鉄道"
 IND_great_indian_peninsula_railway_desc:0 "インド全土を結ぶ鉄道網の拡充により、経済活動を活性化させる。"
 IND_steel_authority_of_india:0 "スチール・オーソリティ"
 IND_steel_authority_of_india_desc:0 "国営の製鉄公社を設立し、重工業の基盤を強化する。"
 IND_second_five_year_plan:0 "第二次五カ年計画"
 IND_second_five_year_plan_desc:0 "重工業・基幹産業に重点を置いた第二次五カ年計画を推進する。インドの自立した工業基盤を確立する。"
 IND_institute_of_fundamental_research:0 "基礎研究所"
 IND_institute_of_fundamental_research_desc:0 "ホミ・バーバが所長を務めるインド基礎研究所を設立し、科学技術の基盤を築く。将来の核開発の礎となるだろう。"
 IND_non_aligned_declaration:0 "非同盟運動の宣言"
 IND_non_aligned_declaration_desc:0 "インドは米ソいずれの陣営にも与しない「非同盟」の立場を宣言する。この原則はパンチシール（平和五原則）として世界に広まる。"

 # Phase 4 - 南アジア経済共同体
 IND_south_asian_cooperation:0 "南アジア協力構想"
 IND_south_asian_cooperation_desc:0 "インドを中心とした南アジア諸国の経済協力体制を構築する。域内の貿易拡大と共同発展を実現しよう。"
 IND_invite_pakistan:0 "パキスタンを招待する"
 IND_invite_pakistan_desc:0 "かつての分割という痛みを超えて、パキスタンとの経済協力を模索する。南アジアの安定と発展は共通の利益だ。"
 IND_invite_ceylon:0 "セイロンを招待する"
 IND_invite_ceylon_desc:0 "インド洋の真珠、セイロン（スリランカ）との経済同盟を深化させる。"
 IND_invite_burma:0 "ビルマを招待する"
 IND_invite_burma_desc:0 "歴史的に深い関係を持つビルマを南アジア経済共同体に招く。"
 IND_invite_nepal:0 "ネパールを招待する"
 IND_invite_nepal_desc:0 "ヒマラヤの王国ネパールとの経済協力を強化する。"
 IND_saec_charter:0 "SAEC設立憲章"
 IND_saec_charter_desc:0 "南アジア経済共同体（SAEC）の設立憲章に調印する。これは地域統合の新たな出発点となる。"
 IND_indian_ocean_trade_network:0 "インド洋貿易ネットワーク"
 IND_indian_ocean_trade_network_desc:0 "インド洋を中心とした広域貿易ネットワークを構築する。古代から続く海のシルクロードを現代に蘇らせる。"
 IND_greater_south_asia_initiative:0 "大南アジア構想"
 IND_greater_south_asia_initiative_desc:0 "経済圏を東南アジアへと拡大し、より広域の経済共同体を目指す。"

 # ============================================================
 # イベント
 # ============================================================

 # bsm_ind.1 - 帝国の岐路
 bsm_ind.1.t:0 "帝国の岐路"
 bsm_ind.1.d:0 "インドは今、歴史の転換点に立っている。何世紀にも渡る英国支配の下、独立を求める声は高まり続けている。我々はどのような未来を選ぶのか。"
 bsm_ind.1.a:0 "独立への道を歩もう"
 bsm_ind.1.b:0 "今は時期を待とう"

 # bsm_ind.2 - 自治要求
 bsm_ind.2.t:0 "自治の要求"
 bsm_ind.2.d:0 "英国政府に対して自治を要求する時が来た。どのような形で要求するか、慎重に判断しなければならない。"
 bsm_ind.2.a:0 "自治領の地位を要求する"
 bsm_ind.2.b:0 "完全な独立を要求する"
 bsm_ind.2b.t:0 "インドからの自治要求"
 bsm_ind.2b.d:0 "インドが自治領の地位を要求してきた。どう対応するか。"
 bsm_ind.2b.a:0 "要求を受諾する"
 bsm_ind.2b.b:0 "要求を拒否する"
 bsm_ind.2c.t:0 "インドからの独立要求"
 bsm_ind.2c.d:0 "インドが完全独立を要求してきた。これは大英帝国への直接的な挑戦である。"
 bsm_ind.2c.a:0 "インドの独立を認める"
 bsm_ind.2c.b:0 "断固として拒否する"

 # bsm_ind.3 - クリップス使節団
 bsm_ind.3.t:0 "クリップス使節団"
 bsm_ind.3.d:0 "英国政府はスタッフォード・クリップス卿をインドに派遣した。彼は戦後のインド自治を約束する条件を提示している。この提案を受け入れるかどうか、国民会議派は決断を迫られている。"
 bsm_ind.3.a:0 "使節団の条件を受け入れる"
 bsm_ind.3.b:0 "条件を拒否し、即時独立を要求する"

 # bsm_ind.4 - 枢軸国の支援
 bsm_ind.4.t:0 "枢軸国の支援申し出"
 bsm_ind.4.d:0 "ドイツとの秘密交渉ルートが開かれた。枢軸国はインドの独立を支持し、英国との闘いに協力すると申し出ている。"
 bsm_ind.4.a:0 "枢軸国の支援を受け入れる"
 bsm_ind.4.b:0 "独自の路線を維持する"
 bsm_ind.4b.t:0 "インドからの支援要請"
 bsm_ind.4b.d:0 "インドの急進派が我々の支援を求めている。インドでの反英運動を支援することは、イギリスへの圧力となるだろう。"
 bsm_ind.4b.a:0 "インドを支援する"
 bsm_ind.4b.b:0 "今は支援できない"

 # bsm_ind.5 - ソ連の支援
 bsm_ind.5.t:0 "ソ連の支援申し出"
 bsm_ind.5.d:0 "ソ連は植民地解放を積極的に支持している。インドの独立運動に軍事・政治的支援を提供すると申し出てきた。"
 bsm_ind.5.a:0 "ソ連の支援を受け入れる"
 bsm_ind.5.b:0 "非同盟の中立を維持する"
 bsm_ind.5b.t:0 "インドからの支援要請"
 bsm_ind.5b.d:0 "インドの革命勢力がソ連の支援を求めている。植民地解放の支援は我々の国際的義務だ。"
 bsm_ind.5b.a:0 "インド革命を支援する"
 bsm_ind.5b.b:0 "今は支援できない"

 # bsm_ind.6 - 自治領憲法
 bsm_ind.6.t:0 "自治領の新憲法"
 bsm_ind.6.d:0 "英連邦の枠組みの中で、インドの新たな憲法が起草された。これはインドが自治領として歩む新たな出発点となる。"
 bsm_ind.6.a:0 "憲法に署名する"

 # bsm_ind.10 - 独立宣言（会議派）
 bsm_ind.10.t:0 "インド独立宣言"
 bsm_ind.10.d:0 "1947年8月15日——インドは自由を得た。ネルー首相は「今夜、真夜中に世界が眠る時、インドは生命と自由に目覚める。歴史においてめったにない瞬間が来る」と語った。"
 bsm_ind.10.a:0 "インド共和国の誕生を祝おう！"
 bsm_ind.10b.t:0 "インド独立！"
 bsm_ind.10b.d:0 "英連邦からの独立を宣言したインドは、アジア最大の民主主義国家として歩み始めた。"
 bsm_ind.10b.a:0 "インドに自由を！"
 bsm_ind.10b.b:0 "歴史的な瞬間だ"

 # bsm_ind.11 - アザド・ヒンド宣言
 bsm_ind.11.t:0 "アザド・ヒンドの宣言"
 bsm_ind.11.d:0 "スバス・チャンドラ・ボーズは「自由インド政府」の樹立を宣言した。「諸君に血を捧げよ、我は諸君に自由を与えよう」——この言葉はインド中に響き渡った。"
 bsm_ind.11.a:0 "インド国民軍、前進せよ！"
 bsm_ind.11.b:0 "国際的な承認を求める"

 # bsm_ind.12 - 独立後の混乱
 bsm_ind.12.t:0 "独立の熱狂と混乱"
 bsm_ind.12.d:0 "独立の喜びは爆発的な熱狂をもたらしたが、同時に宗教間の緊張も高まっている。デリーからカルカッタまで、各地で暴動が起きている。"
 bsm_ind.12.a:0 "非常事態を宣言する"
 bsm_ind.12.b:0 "国民の力を信じる"

 # bsm_ind.15 - 分割問題
 bsm_ind.15.t:0 "分割問題"
 bsm_ind.15.d:0 "全インド・ムスリム連盟のムハンマド・アリー・ジンナーは、ヒンドゥーとムスリムの共存は不可能として「パキスタン」の樹立を要求している。この問題をどう解決するか、インドの未来がかかっている。"
 bsm_ind.15.a:0 "分割を受け入れる準備をする"
 bsm_ind.15.b:0 "統一インドを守るために闘う"

 # bsm_ind.16 - 藩王国の統合
 bsm_ind.16.t:0 "藩王国の統合"
 bsm_ind.16.d:0 "インド国内には500以上の藩王国が存在し、それぞれが独自の支配権を主張している。独立したインドに統合するにはどうすればよいか。"
 bsm_ind.16.a:0 "寛大な条件で統合する"
 bsm_ind.16.b:0 "即時統合を要求する"

 # bsm_ind.17 - 州再編
 bsm_ind.17.t:0 "州の再編成"
 bsm_ind.17.d:0 "植民地時代の行政区分は言語・文化的な実態と乖離している。言語別に州を再編することで、より民主的な統治が実現できる。"
 bsm_ind.17.a:0 "言語別に州を再編する"
 bsm_ind.17.b:0 "現状の行政区分を維持する"

 # bsm_ind.20 - パキスタンの誕生
 bsm_ind.20.t:0 "パキスタンの誕生"
 bsm_ind.20.d:0 "1947年8月14日——パキスタン・イスラム共和国が誕生した。インド亜大陸の分割により、何百万もの人々が国境を越えて移動を余儀なくされた。"
 bsm_ind.20.a:0 "痛みを伴うが、平和的な移行を目指す"
 bsm_ind.20b.t:0 "パキスタン独立！"
 bsm_ind.20b.d:0 "インド亜大陸に新たな国家が誕生した。インドとパキスタンの関係は、今後の南アジアの安定を左右する。"
 bsm_ind.20b.a:0 "新時代の始まりだ"
 bsm_ind.20b.b:0 "パキスタン・ジンダバード！"
 bsm_ind.20b.c:0 "歴史的な分割だ"

 # bsm_ind.21 - カシミール問題
 bsm_ind.21.t:0 "カシミール問題"
 bsm_ind.21.d:0 "カシミールのヒンドゥー藩王はインドへの帰属を決めたが、パキスタンは異議を唱えている。この問題はインドとパキスタンの間の長年の紛争の種となるだろう。"
 bsm_ind.21.a:0 "カシミールはインドのものだ"
 bsm_ind.21.b:0 "国際的な調停を求める"

 # bsm_ind.25 - パキスタンへのSAEC招待
 bsm_ind.25.t:0 "南アジア経済共同体への招待"
 bsm_ind.25.d:0 "インドが南アジア経済共同体への加盟を招待してきた。かつての分割の痛みを超えて、経済協力の時代が来たのだろうか。"
 bsm_ind.25.a:0 "SAECへの加盟を受け入れる"
 bsm_ind.25.b:0 "時期尚早だ、断る"

 # bsm_ind.26 - 東南アジアへの拡大
 bsm_ind.26.t:0 "南アジア経済共同体への招待"
 bsm_ind.26.d:0 "インドが率いる南アジア経済共同体が、我が国への加盟を打診してきた。この地域の経済連携に参加することは我が国の利益になるだろうか。"
 bsm_ind.26.a:0 "SAECへ参加する"
 bsm_ind.26.b:0 "独自の路線を歩む"

 # bsm_ind.30 - 非同盟運動宣言
 bsm_ind.30.t:0 "非同盟運動の宣言"
 bsm_ind.30.d:0 "ネルーとチトーはバンドン会議を経て、東西いずれの陣営にも属さない「非同盟運動」を世界に宣言した。インドはアジア・アフリカ諸国の声を代弁する存在となる。"
 bsm_ind.30.a:0 "第三の道を歩もう"
 bsm_ind.30.b:0 "インドが独自の路線を宣言した"

 # bsm_ind.31 - SAEC設立
 bsm_ind.31.t:0 "南アジア経済共同体の設立"
 bsm_ind.31.d:0 "インドの主導で南アジア経済共同体（SAEC）が設立された。加盟国間の自由貿易と経済協力により、南アジアの繁栄を目指す。"
 bsm_ind.31.a:0 "南アジアの新時代の始まりだ！"
 bsm_ind.31.b:0 "地域統合の新たな試みだ"

 # ============================================================
 # アイデア
 # ============================================================
 bsm_ind_idea_saec_leader:0 "南アジア経済共同体・盟主"
 bsm_ind_idea_saec_leader_desc:0 "インドは南アジア経済共同体の盟主として、域内の経済協力を主導している。統一通貨圏の形成と貿易の活性化が期待される。"
 bsm_ind_idea_famine_recovery:0 "飢饉からの復興"
 bsm_ind_idea_famine_recovery_desc:0 "ベンガル飢饉の傷跡はまだ癒えていないが、復興に向けた取り組みが始まっている。"
 bsm_ind_idea_refugee_crisis:0 "難民危機"
 bsm_ind_idea_refugee_crisis_desc:0 "分割と内戦を逃れた難民が大量に流入し、社会的安定を脅かしている。"
 bsm_ind_idea_unified_administration:0 "統一行政"
 bsm_ind_idea_unified_administration_desc:0 "州の再編と行政の統一化により、より効率的な統治が実現している。"
 bsm_ind_idea_non_aligned:0 "非同盟運動"
 bsm_ind_idea_non_aligned_desc:0 "インドは東西冷戦のいずれの陣営にも属さない非同盟の立場を貫く。この姿勢は多くの途上国から尊敬を集めている。"
 bsm_ind_idea_planning_commission:0 "計画委員会"
 bsm_ind_idea_planning_commission_desc:0 "計画委員会の指導のもと、国家主導の経済発展計画が着実に実施されている。インドの近代化は加速する。"

