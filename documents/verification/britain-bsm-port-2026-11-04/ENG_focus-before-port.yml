 ENG_trade_unions_demand_timer: "過去30日間に労働組合の要求を満たした"
 ENG_trade_unions_demands_tt: "新たな§Y労働組合の要求§!が解除された。\n"
 ENG_trade_unions_demand_legislation_amendment: "法改正"
 ENG_trade_unions_demand_legislation_amendment_desc: "政治的努力により、労働組合の要求に答えるよう現在の法案を改正する。"
 ENG_trade_unions_demand_conscription_limitations: "徴兵の制限"
 ENG_trade_unions_demand_conscription_limitations_desc: "労働組合の要求に応えるため、当面の徴兵を制限する。"
 ENG_trade_unions_demand_conscription_limitations_tt: "徴兵の拡大を§Y365日間§!制限する。\n"
 ENG_trade_unions_demand_conscription_limitations_tt2: "現在の徴兵法が§Y志願兵のみ§!を超える場合、徴兵法が1段階減少する。\n"
 ENG_cannot_increase_conscription_law: "労働組合に徴兵拡大を行わないことを確約した。\n"
 ENG_trade_unions_demand_workplace_safety_legislation: "工場安全法の通過"
 ENG_trade_unions_demand_workplace_safety_legislation_desc: "労働組合の要求を満たすために、我々は労働安全衛生法を新たに制定する。生産性を犠牲にする代わりに労働者を保護する。"
 ENG_trade_unions_demand_increase_in_paid_leave: "有給休暇増加法の通過"
 ENG_trade_unions_demand_increase_in_paid_leave_desc: "労働組合の要求に応えるため、有給休暇増加の法案を通過させる。"
 ENG_trade_unions_demand_minimum_pay_increase: "最低賃金引き上げ法案の通過"
 ENG_trade_unions_demand_minimum_pay_increase_desc: "労働組合の要求に応えるため、最低賃金引き上げの法案を通過させる。"
 ENG_trade_unions_demand_construction_safety_legislation: "建設安全法案の通過"
 ENG_trade_unions_demand_construction_safety_legislation_desc: "労働組合の要求に応えるため建設安全法案を通過させ、建築産業に従事する労働者の安全性を向上する。"
 ENG_trade_unions_demand_mandatory_union_days: "強制的な組合の日の制定"
 ENG_trade_unions_demand_mandatory_union_days_desc: "労働組合の要求に応えるために新たな法案を通過させ、すべての労働者が彼らの権利について学び、団結することを奨励し、その他組合関連の活動時間を増やす「組合の日」に参加することを必須とする。"
 ENG_trade_unions_demand_referendum: "国民投票の実施"
 ENG_trade_unions_demand_referendum_desc: "社会主義の支持拡大をうけ、労働組合が要求する国民投票の実施を余儀なくされた。結果は分かりきっているが……"
