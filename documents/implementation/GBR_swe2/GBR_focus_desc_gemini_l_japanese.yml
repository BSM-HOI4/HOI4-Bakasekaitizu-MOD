l_japanese:
 GBR_address_book_desc:0 "世界中に散らばる領土や自治領から届く郵便物は、宛先の間違いや重複した請求書で官僚たちを日々混乱させている。我々は帝国全土の役所へ照会を送り、いまどこに誰の政府が存在するのかを台帳にまとめ直さねばならない。相手側が応じるならば、散在する同胞たちと正式な外交窓口を再開し、帝国の正しい現在地を確かめるつもりだ。"
 GBR_westminster_authority_desc:0 "古来の慣習と不文憲法に縛られた議事堂では、どの法律が海を越えて通用するのかについて連日激しい議論が続いている。我々は王冠の権威と議会の正統性を改めて確認し、各自治領との曖昧な上下関係を整理せねばならない。形式的な押しつけを避け、各地の統治機構との対話を重んじる姿勢を示すことで、国内の動揺を静める確かな歩みとする。"
 GBR_charts_and_treasury_desc:0 "海軍が保管する航路図と大蔵省の帳簿を突き合わせると、実在しない港への維持費や行方不明の防波堤予算が次々と発覚した。我々は航路の安全を維持しつつ、無駄な歳出を洗い出して港湾整備の対象を明確化しなければならない。同盟国や各地の港湾当局と修繕計画を協議し、合意を得られた拠点から優先的に財政支援を振り向けていく。"
 GBR_dominion_circular_desc:0 "遠く離れた海を越え、各地の自治領政府へ一斉に外交文書を発送する。これまでの命令一方通行な関係を改め、対等な協議の場を設けようという呼びかけである。それぞれの議会や総督が我々の提案を歓迎し、協調に応じる確約を与えてくれるならば、長年くすぶっていた行政上の不信感を解消し、新たな信頼関係を築くことができるはずだ。"
 GBR_two_londons_desc:0 "本土にある我々の首都と、西の島を支配する市長や金融街が名乗る同名の自治領は、互いに本物のロンドンを自称して電報の宛先すら奪い合っている。この奇妙な分裂を放置するわけにはいかない。我々は対岸の市当局へ予備会談を申し入れ、相手が受諾すれば住民の権利を守る国勢調査や代表会議の開催へと歩みを進める。"
 GBR_dominion_charter_desc:0 "帝国の絆は強制的な武力ではなく、法の下における自由な合意によって保たれるべきである。我々は各自治領の内政自治権を明文化し、将来の地位変更や協定締結に関する明確な交渉手順を定める憲章案を提示する。各地の議会がこの公正な取り決めに納得して受け入れることで、対等な対話に応じる政治的土壌が整うはずだ。"
 GBR_bridges_and_representation_desc:0 "海を隔てた島々や領土の交通網は荒廃し、住民たちの往来を著しく妨げている。我々は本土の財政と建設資源を進んで提供し、壊れた橋や連絡路の共同修繕計画を提案する。目指すのは従属の強制を排し、現地の正当な代表者を議会へ迎える協調関係だ。相手側がこの負担と権利の分配に同意するならば、真の連帯が始まる。"
 GBR_dublin_conference_desc:0 "西の島を実効支配する市長たちの市庁舎と、自由を求める島民の代表会議は鋭く対立し、行政文書の宛名すら統一できずにいる。我々は双方が顔を合わせる和解の場を呼びかけ、共存に向けた包括協定案を机上に載せる。島を分断する両者の双方が署名に応じない限り調印は成立しないが、暴力の連鎖を断つには対話しかない。"
 GBR_free_commonwealth_desc:0 "服従の強制による搾取を捨て去り、互いの主権と独立を認め合う新たな連邦の枠組みを宣言する。自由意志に基づく条約に参加する国々とは、通商協約や技術交流を惜しみなく進める方針だ。去る者を力で引き留めることはせず、植民地からの恒久的な工場収奪も放棄するが、同意に基づく真摯な提携こそが永続的な絆を育む。"
 GBR_imperial_conference_desc:0 "帝国の諸地域が直面する諸課題を協議するため、現存する従属国政府へ代表団の派遣を要請する。旧来の従属関係に囚われることなく、同じ王冠を戴く共同体として膝を交える場が必要だ。已に離脱した地域への招待には慎重な外交手続きを要するが、まず応じてくれた代表たちと対等な立場で未来の結束を模索していく。"
 GBR_representative_seats_desc:0 "遠隔地の納税者たちに一方的な義務を課す慣習は、長年燻る怨嗟の根源となってきた。我々は人口と財政負担に応じて議席を分担し、各地の声を立法府へ直接届ける制度を整える。行政の調整業務や政治的な負担は増大するものの、権利の保障に相手側が納得してくれるならば、旧来の反感を和らげて真の一体感を獲得できるはずだ。"
 GBR_common_budget_desc:0 "海洋交通路の防衛と産業インフラの再建は、本土単独の予算だけで賄える規模を超えている。我々は連邦参加国に対し、共有基金の創設と軍事幕僚の共同運用を呼びかける。主権侵害を恐れる声に配慮し、この枠組みへの拠出と恩恵は同意を与えた政府のみに限定する。参加を承認した盟友たちとともに、堅実な協力体制を構築する方針だ。"
 GBR_voluntary_federation_desc:0 "帝国の再編は、武力併合を退けて主権国家同士の自由な選択に基づくべきである。我々は連邦憲章への調印を呼びかけ、署名に応じた国々とともに新たな協力共同体を結成する。合意を見送った地域を排除したり制裁したりせず、外側の友邦として尊重し続ける。一体的な国家の樹立を拙速に迫ることなく、確かな信頼を積み重ねる。"
 GBR_review_privileges_desc:0 "西の島を支配する市当局や各地の自治領は、中世以来の免税特権や勝手な司法権を盾に中央の統制を逃れてきた。我々は王冠と議会の正統性を背景に、これら不条理な免除特権の全面的な再点検を開始する。地方の寡頭権力者たちからの猛反発を招くことは避けられないが、国家の規律を取り戻すため断固として監査を押し通す。"
 GBR_dominion_oversight_desc:0 "気前の良い財政支援を無条件でばらまく時代は終わった。我々は自治領への援助協定に厳格な財務監査と中央監督官の派遣を受け入れる条件を盛り込み、相手方へ受諾を迫る。西の市当局がこの監督を受け入れるならば支援資金を供給するが、拒むならば支援は打ち切られる。国庫の尊厳を守るため、対等な支援に説明責任を要求する。"
 GBR_northern_security_desc:0 "西の島における北部の防衛線は、海峡を挟んだ防衛上の生命線である。我々は市当局が管轄する北部の現状維持を確認しつつ、治安維持と駐留に関する公式な防衛協定の締結を申し入れる。相手の領有権を尊重しつつ条約の合意を通じて共同の守りを固め、不穏な勢力の浸透を阻止せねばならない。"
 GBR_crown_reintegration_desc:0 "帝国の分裂をこれ以上見過ごすことはできない。我々は王冠の下に全領土が結集することを求め、従属関係の抜本的な再交渉を各地へ通告する。平和的な受諾を最優先とするが、明確な拒絶に対しては経済制裁や外交的最後通牒も辞さない。戦争の惨禍を避ける努力を尽くしつつも、中央の権威を回復するための覚悟を示す時だ。"
 GBR_home_budget_desc:0 "海の彼方にある島々や果てしない海外拠点への無制限な資金拠出は、もはや本土住民の生活を圧迫する限界に達している。我々は過剰な海外支援費を大胆に削減し、限られた国庫の富を国内の工場やインフラの復興へと集中させる。遠くの体面を繕うことよりも、足元の産業基盤を立て直し、住民の暮らしを真に守ることが先決である。"
 GBR_island_self_government_desc:0 "西の島に生きる人々の自治権を他国が一方的に奪い続けることは許されない。我々は現地の代表会議と正式な自治政府の樹立に向けた対話を進める。ただし、既存の市当局が管理する地域を我々の独断で切り離して譲渡することはせず、市側の同意も得た上での秩序ある移行を図る。住民の権利を尊重しつつ、混乱のない道を探る。"
 GBR_disperse_capital_desc:0 "将来的な領土交換や行政再編の交渉に備え、国家の中枢が麻痺する事態を未然に防がねばならない。我々は現首都に集中している省庁や行政機構を、本土の安全な別州へと分散移転させる準備に着手する。万一の事態に備えて統治機構を強靭化し、どの街に首都が置かれようとも本土防衛と政務が揺らがない体制を整えておく。"
 GBR_return_london_desc:0 "首都機能の退避を終えた我々は、西の島を支配する市当局や現地の独立政府に対し、ねじれた領土の交換移譲案を打診する。双方が受諾すれば歴史的な領土の是正が実現するが、相手に拒絶された場合は無理強いせず、本土の地勢を維持したまま国内再建の完遂へと舵を切る。結末の行方は、関係者全員の合意に委ねられている。"
 GBR_city_treasury_compact_desc:0 "西の島に拠点を構える金融街の銀行家たちは、莫大な資本を握りつつも本土の納税を巧みに回避している。我々は彼らの市当局へ互恵的な金融協定の締結を申し入れ、本土復興資金の融通を求める。もし相手がこれを拒絶するならば、外部の資本に頼る方針を速やかに改め、国内公債の発行によって独自に財源を確保する構えだ。"
 GBR_midlands_investment_desc:0 "煤煙たなびく中部の工業地帯は、帝国の経済を底から支える心臓部である。我々が確かに支配するミッドランズの各州へ財政投資を集中的に行い、新たな民需工場と拡張用地を整備せねばならない。長引く不況で職を奪われていた労働者たちに安定した雇用をもたらし、産業基盤を根底から立て直して本土の底力を発揮させる。"
 GBR_northern_industry_desc:0 "北部の鉱山や重工業地域は、古い設備と立ち後れた輸送網に苦しめられている。我々が管轄する北部諸州に対し、道路や鉄道インフラの抜本的な改修を施すとともに、最新の生産技術を研究するための支援体制を整える。荒削りだが頑強な現場の職人たちに最新の知見を授けることで、過酷な国際競争を勝ち抜く工業力を培う。"
 GBR_port_railways_desc:0 "本土の主要な港湾と内陸の物資集積所を結ぶ線路は、長年の継ぎ接ぎだらけな拡張により寸断されかけている。我々は各地の現存する線路網と補給拠点の配置を実地検証し、最も効率的な輸送路を特定して直結改良工事を進める。港に荷揚げされた資源を滞りなく工場や前線へと送り届ける動脈を整備し、物流の渋滞を根絶する。"
 GBR_merchant_shipbuilding_desc:0 "島国である我々にとって、商船隊は生活物資と防衛資源を運ぶ生命線そのものである。かつて世界を席巻した造船所を再び活気づけるため、資材調達の補助と船台の近代化支援を時限的に実施する。大量の輸送船を効率よく建造できる体制を急造し、どのような封鎖や通商破壊にも耐えうる頑強な補給船団を海原へ送り出す。"
 GBR_renew_trade_desc:0 "帝国の諸地域を結ぶ古い貿易特権は形骸化し、各地の港では形式ばかりの関税手続きが商人を悩ませている。我々は現存する条約相手国へ新たな通商協定の締結を呼びかけ、互いの合意のもとで物資の流通を活発化させる。相手政府が承諾して協調姿勢を示した場合にのみ効果を発揮させ、公正な経済圏を再構築していく。"
 GBR_admiralty_review_desc:0 "書類上にしか存在しない幽霊戦隊や、老朽化して港に放置された巨艦をこれ以上抱え続ける余裕はない。海軍本部は現存する稼働艦艇の実数を冷徹に点検し、限られた人員と物資を真に戦える艦隊へと再編する。机上の栄光にすがる古いドクトリンを刷新し、実戦に即した艦隊整備方針を打ち立てて海の守りを固める。"
 GBR_atlantic_escorts_desc:0 "大西洋の暗い波間に潜む敵潜水艦の脅威は、本土を飢餓に追い込む最大の凶兆である。我々は護衛艦艇の対潜技術や探信装置の研究を急ぎ、孤立した商船を群れとして守る船団護衛司令部を組織する。過酷な海域で生命線を守り抜く水兵たちの犠牲を決して無駄にせぬよう、組織的な対潜警戒体制を徹底して海路の安全を死守する。"
 GBR_irish_sea_patrol_desc:0 "本土と西の島を隔てる内海は、不審船や密輸が横行する警備の空白地帯となっている。我々は対岸の市当局や現地の独立政権に対し、港湾利用と共同哨戒に関する協定を申し入れる。相手の艦艇を勝手に指揮下に置く傲慢を戒め、双方が合意した管轄区域を互いに見守る対等な取り決めを結び、海峡の安定を共に図る。"
 GBR_global_anchorages_desc:0 "世界中に点在する泊地は、大英帝国の海洋支配を支えてきた礎である。我々が現在も実効支配している要衝では燃料貯蔵施設や修理ドックの拡充を進め、他国や自治領が管轄する港湾に対しては正式な基地利用協定を打診する。相手国の主権と合意を尊重し、同意を得られた拠点と連携して世界規模の補給網を維持する。"
 GBR_home_air_defence_desc:0 "近代戦における空からの爆撃は、都市の住民と生産施設を瞬く間に灰燼に帰せしめる。我々は本土全域の防空網を刷新し、早期警戒を可能にする電波探知施設と対空砲座を沿岸部から重点的に配備する。さらに新型戦闘機の開発と戦技研究に資源を投じ、国土の空を飛ぶ敵機を確実に迎撃できる強固な防空の盾を完成させる。"
 GBR_expeditionary_standards_desc:0 "遠隔地へ派遣される部隊がそれぞれ規格の異なる小銃や弾薬を抱えていては、過酷な戦場で補給線が断絶してしまう。我々は陸軍の装備仕様と編制基準を根本から見直し、歩兵火器や通信支援装備の規格共通化を図る。過去の戦闘訓令を整理して陸軍の実戦経験を蓄積し、少数精鋭でも十全に機能する近代的遠征軍を育成する。"
 GBR_joint_landing_exercises_desc:0 "敵前上陸作戦の成否は、海軍の砲撃と空軍の援護が陸戦部隊とどれほど緊密に呼吸を合わせられるかにかかっている。我々は新造艦の無茶な即時配備を避けて現場の練成を重んじ、陸海空の合同上陸演習を重ねて協同戦術の研究を進める。波打ち際で流される将兵の血を最小限に抑えるため、入念な連携ドクトリンを確立する。"
 GBR_two_island_defence_desc:0 "海を挟んで向き合う両島が共に防衛体制を築ければ理想的である。我々は周辺諸政権へ共同防衛への参加を呼びかけるが、政治協議の不調や相手の拒絶によって提携が結べない事態も想定せねばならない。たとえ共同防衛が成立せずとも、本土単独での徹底抗戦計画を完結させる準備を整え、国土の守備に万全を期す。"
 GBR_dover_question_desc:0 "海峡を挟んだ対岸に位置するドーバーの一角は、歴史の数奇な巡り合わせによりフランス領となり、英仏双方が正当な権利を主張し合っている。我々は隣国フランスに対し、この地域に関する包括的な地位協議を申し入れる。相手国が協調を選ぶか要塞化を選ぶかは先方の判断に委ねるが、対話を通じた平和的解決を模索する。"
 GBR_channel_navigation_desc:0 "向かい合う沿岸の緊張を解くため、フランス側に航行規則と不可侵の協議を提案する。白亜の崖を行き交う船便の安全は双方の市民の暮らしに直結しており、領土問題の解決を待たずにまず合意できる道を官僚たちの間で模索していく構えだ。"
 GBR_demand_dover_desc:0 "英仏二重中核の歪みを正すべく、フランス領部分の返還を正式に要求する。相手側の主権や面目にも配慮し、即時譲渡のみならず補償の提案や拒否の権利も認めた上で、ドーバー海峡の完全な平穏を取り戻すための厳しい外交交渉へ踏み出す。"
 GBR_island_charters_desc:0 "海峡諸島に残る各自治政府の歴史と特権を尊重し、別個の憲章を提示する。アイルランド島で起きた自治領の枠組みを機械的に押し付ける愚を避け、固有の法制度や免税特権の維持を約することで、古くからの連帯を維持する道を探る方針である。"
 GBR_gibraltar_gateway_desc:0 "要衝ジブラルタルを直接支配の対象とみなさず、自律した門番たる現地当局へ防衛協力と基地利用の協定を申し入れる。地中海へ睨みを利かせる岩山で暮らす人々の権理を損なわないよう配慮しつつ、相互の安全保障を支える枠組みを整えたい。"
 GBR_ocean_waystations_desc:0 "大洋に浮かぶ奇妙な小国たちへ使節を派遣し、港湾の利用や学術調査、通商協力の打診を行う。相手方の風変わりな国情や領土保全を軽視せず、往来の船員が安全に補給を受けられる中継点として、対等かつ実利的な友好関係の構築を目指す構えだ。"
